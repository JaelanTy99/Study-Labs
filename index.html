{id:"r16",domain:1,title:"Advanced Subnetting & VLSM (Worked Examples)",tags:["subnetting","vlsm","cidr","wildcard","supernet","math"],content:"<p>Speed and accuracy with subnetting separate passing scores from failing ones. Memorize the block-size table: /25 = 128, /26 = 64, /27 = 32, /28 = 16, /29 = 8, /30 = 4. The block size is 256 minus the value of the 'interesting' octet in the mask. To find which subnet an address belongs to, find the largest multiple of the block size that is less than or equal to the address in the interesting octet. Example: 172.16.77.45/20. A /20 mask is 255.255.240.0 (block size 16 in the third octet). Multiples of 16: 64, 80. Since 77 falls between 64 and 79, the network is 172.16.64.0, broadcast 172.16.79.255, usable .65 through .78 in that octet's range — 4,094 usable hosts total.</p><p>VLSM (Variable-Length Subnet Masking) means using different mask lengths within the same address space to right-size each subnet and avoid waste. Always allocate from largest requirement to smallest. Example: from 192.168.1.0/24, a LAN needing 100 hosts takes a /25 (126 usable: .0–.127). A second LAN needing 50 hosts takes the next available /26 (.128–.191, 62 usable). A point-to-point link takes a /30 (.192–.195, 2 usable). Allocating small subnets first would fragment the space and strand larger blocks.</p><p>Wildcard masks (used in ACLs and OSPF) are the bitwise inverse of a subnet mask. A /24 (255.255.255.0) becomes wildcard 0.0.0.255. A 0 bit means 'must match exactly'; a 1 bit means 'don't care.' So 'permit 10.20.0.0 0.0.255.255' matches all of 10.20.0.0/16. For the exam, practice converting between prefix length, dotted-decimal mask, and wildcard mask instantly, and be ready to compute network, first host, last host, and broadcast for any prefix.</p>"},
{id:"r17",domain:1,title:"IPv6 In Depth",tags:["ipv6","slaac","dhcpv6","link-local","dual stack","eui-64","nd"],content:"<p>IPv6 uses 128-bit addresses written as eight hextets of four hex digits, separated by colons. Two compression rules apply: leading zeros in a hextet may be dropped (2001:0db8 → 2001:db8), and one run of consecutive all-zero hextets may be replaced with '::' a single time per address. So 2001:0db8:0000:0000:0000:0000:0000:0001 becomes 2001:db8::1. Knowing how to expand and compress addresses is commonly tested.</p><p>Key address types: Global unicast (typically 2000::/3) are internet-routable. Unique local (fc00::/7, in practice fd00::/8) are the IPv6 equivalent of RFC1918 private space. Link-local (fe80::/10) are auto-assigned to every interface and used for neighbor discovery and next-hop addressing — they are never routed off the link. Multicast (ff00::/8) replaces IPv4 broadcast; for example ff02::1 is all-nodes and ff02::2 is all-routers on the link. There is no broadcast in IPv6.</p><p>Address assignment can be stateless (SLAAC), where the host learns the /64 prefix from a Router Advertisement and builds its own interface ID using EUI-64 or a random value, or stateful (DHCPv6), where a server assigns full addresses and options. Neighbor Discovery Protocol (NDP) uses ICMPv6 messages — Router Solicitation/Advertisement and Neighbor Solicitation/Advertisement — to replace ARP and router discovery. Most organizations run dual stack (IPv4 and IPv6 simultaneously) during migration; transition tools include tunneling (6to4, Teredo) and translation (NAT64/DNS64).</p>"},
{id:"r18",domain:2,title:"Wireless Standards & RF Fundamentals",tags:["wifi","802.11","2.4ghz","5ghz","6ghz","channels","mimo","interference"],content:"<p>The 802.11 family has evolved through several generations. 802.11b/g operate at 2.4 GHz; 802.11a at 5 GHz; 802.11n (Wi-Fi 4) added MIMO and works in both bands; 802.11ac (Wi-Fi 5) is 5 GHz only with wider channels and MU-MIMO; 802.11ax (Wi-Fi 6, and Wi-Fi 6E when extended into 6 GHz) adds OFDMA, improved efficiency in dense environments, and target wake time. Higher throughput generally comes from wider channels, more spatial streams (MIMO), and higher-order modulation.</p><p>Band trade-offs matter for design. The 2.4 GHz band has longer range and better wall penetration but only three non-overlapping 20 MHz channels in the US (1, 6, 11) and heavy interference from microwaves, Bluetooth, and cordless phones. The 5 GHz band offers many more non-overlapping channels and less interference but shorter range; some channels require DFS (Dynamic Frequency Selection) to avoid radar. The 6 GHz band (Wi-Fi 6E/7) adds a large block of clean spectrum but the shortest range. In dense deployments, plan a channel reuse pattern, keep channel widths conservative on 2.4 GHz, and tune transmit power to limit co-channel interference.</p><p>Common RF concepts and problems: attenuation (signal loss over distance/obstacles), absorption (walls, water, people), reflection/multipath, and interference (co-channel from same-channel APs, adjacent-channel from overlapping channels). Tools include a Wi-Fi analyzer for channel utilization and a site survey/heat map for coverage planning. SNR (signal-to-noise ratio) and RSSI are the metrics to watch — low SNR causes retransmissions and slow throughput even with a 'full bars' RSSI reading."},
{id:"r19",domain:2,title:"Spanning Tree Protocol Deep Dive",tags:["stp","rstp","root bridge","bpdu","portfast","bpdu guard","loop"],content:"<p>Spanning Tree Protocol (802.1D) prevents Layer 2 loops in networks with redundant switch links. Without it, broadcasts circulate endlessly, creating a broadcast storm, MAC table instability, and multiple frame copies — symptoms that look like a total outage with near-100% link utilization. STP logically blocks redundant paths while keeping them ready as backups.</p><p>The process: first, switches elect a root bridge — the switch with the lowest bridge ID (a 2-byte priority plus its MAC address). Lower priority wins; the MAC breaks ties. Administrators set a low priority on the desired root (often a core switch) rather than leaving it to MAC luck. Each non-root switch then selects one root port (its lowest-cost path toward the root). Each segment elects one designated port. Remaining ports are placed in a blocking state. Classic STP port states are Blocking → Listening → Learning → Forwarding, taking 30–50 seconds to converge.</p><p>Rapid STP (802.1w) converges in seconds using port roles (root, designated, alternate, backup) and proposal/agreement handshakes; it is backward compatible and now the default on most switches. Edge features harden the design: PortFast moves an access port directly to forwarding (use only on host ports), BPDU Guard shuts a PortFast port if it receives a BPDU (catching a rogue switch), and Root Guard prevents an unexpected switch from becoming root. For the exam, know how the root is elected, the port roles/states, the symptoms of a missing STP, and what PortFast/BPDU Guard do."},
{id:"r20",domain:2,title:"High Availability & First-Hop Redundancy",tags:["hsrp","vrrp","glbp","redundancy","failover","nic teaming","ha"],content:"<p>High availability removes single points of failure so the network keeps working through component failures. At the gateway, first-hop redundancy protocols (FHRPs) let two or more routers present a single virtual IP and virtual MAC that hosts use as their default gateway. If the active router fails, a standby takes over the virtual address transparently — no client reconfiguration. HSRP (Cisco) uses active/standby with one forwarding router; VRRP is the open-standard equivalent (master/backup); GLBP additionally load-balances across multiple forwarding routers.</p><p>Redundancy applies at every layer. Link level: LACP/EtherChannel bundles multiple physical links so traffic continues if one fails, while also adding bandwidth. Switch level: redundant uplinks protected by RSTP, or stacking/MLAG so two switches act as one. Server/NIC level: NIC teaming (bonding) provides link failover and aggregation for hosts. Power: dual power supplies and UPS/generator. Path level: dynamic routing (OSPF/EIGRP) reroutes around failed links automatically.</p><p>Design metrics tie back to operations: redundancy improves availability (more 'nines'), reduces MTTR by enabling failover instead of repair-before-recovery, and supports SLA commitments. Beware of introducing loops when adding redundant Layer 2 paths — that is exactly what STP exists to manage. For the exam, recognize which protocol solves which single point of failure: FHRP for the gateway, LACP for links, RSTP for switch loops, dynamic routing for paths."},
{id:"r21",domain:4,title:"VPNs & IPsec",tags:["vpn","ipsec","ike","tunnel","site-to-site","remote access","ssl","split tunnel"],content:"<p>A VPN creates an encrypted tunnel across an untrusted network (usually the Internet), protecting confidentiality and integrity in transit. Two deployment models dominate. Site-to-site VPNs connect entire networks — for example, two branch offices — with the tunnel terminating on firewalls or routers; users are unaware it exists. Client-to-site (remote access) VPNs let individual roaming devices connect back to the corporate network using client software, ideal for work-from-anywhere employees.</p><p>IPsec is the most common framework for VPNs. It has two modes: transport mode encrypts only the payload (used host-to-host), while tunnel mode encrypts the entire original packet and adds a new header (used for site-to-site gateways). IPsec uses IKE (Internet Key Exchange) to authenticate peers and negotiate keys in two phases, then protects traffic with AH (integrity/authentication only) or, far more commonly, ESP (encryption plus integrity). Know that IPsec relies on UDP 500 for IKE and either ESP (protocol 50) directly or UDP 4500 when NAT traversal is required.</p><p>SSL/TLS VPNs (often clientless, via a browser) are an alternative that traverses firewalls easily on TCP 443 and is popular for remote access to specific applications. A key design decision is split tunneling versus full tunneling: with split tunneling only corporate-bound traffic enters the tunnel (better performance, less inspection), while full tunneling forces all traffic through the corporate gateway (more control and security). For the exam, match the VPN type to the scenario and remember IPsec's modes, components, and ports."},
{id:"r22",domain:1,title:"Cloud, Virtualization, SDN & SD-WAN",tags:["cloud","iaas","paas","saas","sdn","sd-wan","virtualization","nfv"],content:"<p>Cloud service models define who manages what. IaaS (Infrastructure as a Service) provides virtual compute, storage, and networking — you manage the OS and apps. PaaS (Platform as a Service) provides a managed runtime/platform — you manage only your application and data. SaaS (Software as a Service) delivers complete applications over the web — the provider manages almost everything. Deployment models include public, private, hybrid, and community clouds. Connectivity to the cloud may use the Internet, a VPN, or a dedicated private circuit (direct connect) for predictable performance.</p><p>Virtualization underpins both data centers and cloud. A hypervisor runs multiple virtual machines on one physical host; Type 1 (bare-metal) hypervisors run directly on hardware for production, while Type 2 run atop a host OS. Virtual switches connect VMs to the physical network, and concepts like VXLAN extend Layer 2 segments across Layer 3 fabrics, enabling large multi-tenant environments beyond the 4,094 VLAN limit.</p><p>Software-defined networking (SDN) separates the control plane (decisions) from the data plane (forwarding), centralizing intelligence in a controller that programs devices via APIs — enabling network-wide policy from one place. SD-WAN applies these ideas to the WAN: it abstracts multiple transports (MPLS, broadband, LTE) and uses application-aware policy from a central controller to steer each flow over the best path, improving cost, performance, and resilience versus traditional single-transport WANs. NFV (Network Function Virtualization) runs functions like firewalls and load balancers as software instances rather than dedicated appliances."},
{id:"r23",domain:4,title:"AAA, 802.1X, RADIUS & TACACS+",tags:["aaa","802.1x","radius","tacacs","authentication","authorization","accounting","nac"],content:"<p>AAA stands for Authentication (proving identity), Authorization (what you're allowed to do), and Accounting (recording what you did). Centralizing AAA means credentials and policy live on a server rather than on each device, improving security and auditability. Two protocols dominate. RADIUS (UDP 1812/1813, originally 1645/1646) is widely used for network access — Wi-Fi, VPN, and 802.1X — and combines authentication with authorization while encrypting only the password. TACACS+ (TCP 49) is favored for device administration because it separates the three AAA functions and encrypts the entire payload, enabling granular per-command authorization and accounting.</p><p>802.1X is port-based network access control with three roles: the supplicant (the device/software requesting access), the authenticator (the switch or AP that gates the port), and the authentication server (typically RADIUS). Until the supplicant authenticates — often via EAP methods such as EAP-TLS using certificates or PEAP using credentials — the port allows only authentication traffic. After success, the server can return a VLAN or policy to apply dynamically. This stops unauthorized devices from simply plugging in.</p><p>Network Access Control (NAC) builds on this by adding posture assessment: before granting access, it checks endpoint health (OS patch level, antivirus status, configuration) and can quarantine or remediate non-compliant devices. For the exam, be ready to choose RADIUS vs TACACS+ for a scenario (network access vs device admin), identify the 802.1X roles, and recognize NAC posture checks."},
{id:"r24",domain:3,title:"DNS In Depth & DNS Security",tags:["dns","records","recursion","caching","dnssec","ttl","forward","reverse"],content:"<p>DNS resolves names to addresses through a hierarchy: a client asks its recursive resolver, which queries root servers, then TLD servers (.com), then the domain's authoritative servers, caching each answer for its TTL (time to live). Understanding record types is essential. A maps a name to an IPv4 address; AAAA to IPv6. CNAME is an alias pointing one name to another canonical name. MX designates mail servers (with priority values). NS lists a zone's authoritative name servers. PTR provides reverse lookups (IP to name) and lives in a special reverse zone. SOA holds zone authority and timers. TXT stores arbitrary text, widely used for email authentication (SPF, DKIM, DMARC) and domain ownership verification.</p><p>Forward lookups (name to IP) are the common case; reverse lookups (IP to name via PTR) matter for mail server reputation and logging. TTL governs caching: long TTLs reduce query load but slow propagation of changes, so administrators often lower TTLs before a planned migration. Internal (split-horizon) DNS can return different answers to internal versus external clients for the same name.</p><p>DNS is a frequent attack target and troubleshooting source. DNS cache poisoning/spoofing inserts forged records to redirect users; DNSSEC mitigates this by cryptographically signing records so resolvers can validate authenticity (it provides integrity/authentication, not confidentiality). Operationally, 'ping by IP works but by name fails' is the classic sign of a DNS problem — verify with nslookup or dig against a specific server, check the configured resolver, and flush the local cache if stale entries are suspected."},
{id:"r25",domain:2,title:"Cabling, Connectors & Transceivers",tags:["cabling","cat6","fiber","sfp","qsfp","singlemode","multimode","standards","poe"],content:"<p>Copper twisted-pair categories define supported speed and distance, all capped at 100 meters: Cat5e (1 Gbps), Cat6 (1 Gbps to 100 m, 10 Gbps to ~55 m), Cat6a (10 Gbps to 100 m), and Cat7/Cat8 for higher-frequency/data-center use. Shielding (UTP vs STP/F/UTP) reduces electromagnetic interference in noisy environments. Beyond 100 m, or where EMI or electrical isolation matters, fiber is required. Plenum-rated cable is mandatory in air-handling spaces because of its fire/smoke characteristics.</p><p>Fiber comes in two families. Multimode (larger core, LED/VCSEL source, OM3/OM4/OM5) is cheaper and used for shorter runs — typically within a building or data center, up to a few hundred meters at 10–100 Gbps. Single-mode (small core, laser source, OS1/OS2) supports much longer distances — many kilometers — and higher speeds, used for campus backbones and carrier links. Common connectors include LC (small form factor, most common today), SC, and ST; copper uses RJ-45.</p><p>Transceivers are pluggable optics that match a port to a media type and distance: SFP (1 Gbps), SFP+ (10 Gbps), SFP28 (25 Gbps), QSFP+ (40 Gbps), and QSFP28 (100 Gbps). Choosing the right transceiver and matching fiber type (and wavelength) on both ends is essential — a multimode optic will not interoperate with single-mode fiber. Termination standards T568A/T568B define pin-outs; mixing them end-to-end yields a crossover. Always verify category, distance, connector, and optic type when planning or troubleshooting a physical link."},
{id:"r26",domain:3,title:"Quality of Service (QoS)",tags:["qos","dscp","cos","queuing","shaping","policing","jitter","latency"],content:"<p>QoS lets the network prioritize traffic so latency-sensitive applications perform well even under congestion. It matters most for real-time flows — VoIP and video conferencing — which are intolerant of delay (latency), variation in delay (jitter), and loss. The first step is classification and marking: traffic is identified (by port, application, or DSCP value) and tagged so downstream devices treat it consistently. Layer 3 marking uses DSCP in the IP header (for example, EF — Expedited Forwarding — for voice); Layer 2 marking uses CoS (802.1p) in the VLAN tag.</p><p>Once marked, devices apply policies. Queuing schemes such as priority queuing or low-latency queuing service high-priority traffic first; weighted fair queuing shares bandwidth proportionally. Congestion management decides what to drop when buffers fill (e.g., WRED drops lower-priority traffic earlier). Traffic shaping buffers and smooths bursts to a target rate (delaying rather than dropping), while traffic policing enforces a hard rate and drops or remarks excess immediately. Shaping suits outbound smoothing toward a slower WAN; policing suits enforcing a contracted rate.</p><p>A practical example: a branch with a congested WAN suffers choppy calls. Marking voice as DSCP EF, placing it in a priority queue, and shaping bulk traffic ensures voice is served first and bursts don't starve it — without buying more bandwidth. For the exam, connect symptoms (jitter, choppy voice) to the right tool (classification/marking plus prioritized queuing), and distinguish shaping (buffers/delays) from policing (drops/remarks)."},
{id:"r27",domain:5,title:"Structured Troubleshooting: Symptoms to Causes",tags:["troubleshooting","duplex","mtu","crc","loop","apipa","gateway","tools"],content:"<p>Effective troubleshooting pairs the CompTIA methodology with pattern recognition. Work the layers from the bottom up unless evidence says otherwise, because physical issues are common and cheap to rule out. Build a mental map from symptom to likely cause: 'ping by IP works, by name fails' → DNS; 'works on own subnet, nothing beyond' → default gateway; address in 169.254.x.x → APIPA, meaning no DHCP reachable; intermittent connectivity with an OS 'IP conflict' message → duplicate/overlapping address.</p><p>Physical-layer signatures are distinctive. Rising CRC and input errors point to a bad cable, EMI, a dirty fiber connector, or a failing transceiver. Late collisions and runts on a good cable indicate a speed/duplex mismatch. A gigabit-capable port negotiating only 100 Mbps (≈94 Mbps throughput) usually means a low-category or damaged cable, a 100 Mbps NIC, or a forced-speed mismatch. Large transfers stalling while small ones succeed — especially across a VPN — signals an MTU/fragmentation problem; lower the MTU/MSS. A cabling change that triggers near-100% utilization everywhere is a switching loop/broadcast storm caused by missing or disabled STP.</p><p>Match the tool to the question. Use ping for reachability, traceroute/tracert for path and where it breaks (remembering that '* * *' often just means a hop filters ICMP), nslookup/dig to test a specific DNS server, ipconfig/ip addr to verify addressing, arp -a for IP-to-MAC mappings, and a cable tester or TDR for physical faults and distance-to-break. After fixing anything, verify full functionality and document — confirming you didn't introduce a new problem and leaving a record for next time.</p>"}
,
{id:"r28",domain:3,title:"Change & Configuration Management",tags:["change management","configuration","baseline","rollback","documentation","approval"],content:"<p>Change management is the disciplined process for making network changes without causing avoidable outages. A formal change request captures what is changing, why, who is affected, and the risk level. It moves through review and approval (often a Change Advisory Board for higher-risk work), gets scheduled into a maintenance window to limit user impact, and is only then implemented. The two elements that matter most operationally are a clear implementation plan and a documented rollback (backout) plan so the team can return to the last known-good state quickly if the change fails.</p><p>Configuration management keeps the actual device state consistent and recoverable. Maintain a configuration baseline (the approved standard build) and store known-good configuration backups so any device can be restored or replaced from a template. Version control and automated config backups let you diff current against baseline to catch unauthorized or drifted changes. This is also how you enforce standardization across dozens or hundreds of devices.</p><p>Supporting documentation ties it together: physical and logical network diagrams, an IP address plan (IPAM), asset inventories, and rack/port mappings. When a change goes wrong at 2 a.m., accurate diagrams and a tested rollback plan are what separate a five-minute recovery from an all-night outage. For the exam, know the order of a change process, the purpose of a backout plan, and why baselines and config backups are essential."},
{id:"r29",domain:3,title:"Disaster Recovery, RPO & RTO",tags:["disaster recovery","backup","rpo","rto","high availability","redundancy","site"],content:"<p>Business continuity and disaster recovery (DR) planning define how the organization keeps running through failures ranging from a dead switch to a lost data center. Two metrics anchor every DR plan. RPO (Recovery Point Objective) is the maximum acceptable data loss, measured in time — an RPO of one hour means backups/replication must be no more than an hour apart. RTO (Recovery Time Objective) is the maximum acceptable downtime — how fast service must be restored. Tighter RPO/RTO cost more (more frequent replication, warmer standby sites).</p><p>Backup strategy supports the RPO. A full backup copies everything; incremental backups copy only what changed since the last backup (fast to create, slower to restore — you need the full plus every increment); differential backups copy everything changed since the last full (larger each day, but restore needs only the full plus the latest differential). The classic 3-2-1 rule — three copies, on two media types, one off-site — protects against site-level loss. Always test restores; an untested backup is a hope, not a plan.</p><p>Recovery-site options trade cost against speed: a hot site is fully running and can take over almost immediately (lowest RTO, highest cost); a warm site has equipment and data staged but needs setup; a cold site is just space and power (cheapest, slowest). High-availability designs — redundant power, links, FHRP gateways, clustered servers — reduce the chance you ever invoke DR. For the exam, be able to match a stated tolerance for data loss and downtime to the right RPO/RTO, backup type, and site tier."},
{id:"r30",domain:4,title:"Authentication, Authorization & Access Control",tags:["aaa","802.1x","radius","tacacs","nac","mfa","least privilege","rbac"],content:"<p>AAA — Authentication, Authorization, and Accounting — is the framework behind controlled network access. Authentication proves identity (something you know/have/are; multifactor combines categories). Authorization determines what an authenticated identity may do. Accounting logs what was done, for auditing and forensics. Two protocols implement AAA for network devices: RADIUS (open standard, UDP, encrypts only the password, commonly used for network/user access) and TACACS+ (Cisco-originated, TCP, encrypts the entire payload, separates AAA functions — favored for administrative device access with granular command authorization).</p><p>Port-based access uses 802.1X: the supplicant (client) authenticates through the authenticator (switch/AP) to an authentication server (RADIUS) before the port is opened. Network Access Control (NAC) extends this with posture checks — verifying patch level, antivirus, or certificate status — and can quarantine noncompliant devices onto a remediation VLAN. This is how organizations keep unmanaged or unhealthy devices off the production network.</p><p>Access-control models shape authorization. RBAC (role-based) grants permissions by job role — the practical default in most enterprises. Least privilege gives each identity only the access it needs, and separation of duties splits sensitive tasks across people to prevent abuse. These map directly to your IAM work: provisioning by role, removing orphaned accounts, and pruning privilege creep. For the exam, contrast RADIUS vs TACACS+, know the 802.1X roles, and recognize NAC's posture/quarantine function."},
{id:"r31",domain:4,title:"Network Hardening & Physical Security",tags:["hardening","port security","physical security","patching","default credentials","segmentation"],content:"<p>Hardening reduces a device's attack surface before an attacker ever probes it. Core steps: change default credentials immediately, disable unused services and ports, use secure management protocols (SSH not Telnet, HTTPS not HTTP, SNMPv3 not v1/v2c), apply firmware/patches on a schedule, and restrict management access to a dedicated management VLAN or out-of-band network with ACLs. Every one of these closes a common, well-known avenue of compromise.</p><p>Switch-port protections defend Layer 2. Port security limits which and how many MAC addresses a port accepts, stopping MAC flooding and unauthorized devices. DHCP snooping blocks rogue DHCP servers on untrusted ports; Dynamic ARP Inspection uses the snooping table to stop ARP spoofing; BPDU Guard shuts a PortFast edge port that unexpectedly receives BPDUs (a rogue switch). Disabling unused ports and placing them in an unused VLAN removes easy footholds. Segmentation (VLANs, and micro-segmentation in zero-trust designs) contains any breach to a small blast radius.</p><p>Physical security is the foundation — if someone can touch the hardware, most logical controls can be bypassed. Lock wiring closets and data centers, use badge access with logging, deploy cameras, secure console ports, and control for tailgating. Environmental controls (HVAC, fire suppression, UPS/generator) protect availability. For the exam, connect a hardening requirement to the specific control that satisfies it, and remember that changing defaults, patching, and disabling the unused are the highest-value first moves."},
{id:"r32",domain:5,title:"Wireless Troubleshooting",tags:["wireless","wifi","rssi","snr","interference","roaming","channel","dfs"],content:"<p>Wireless problems usually trace to RF conditions, not the client. Distinguish the key metrics: RSSI measures received signal strength (how strong), while SNR measures signal relative to the noise floor (how usable). A client can show strong RSSI yet perform terribly if the SNR is low because of interference — the classic 'full bars, slow speeds' complaint near microwaves, motors, or dense neighboring APs. Fixing throughput often means reducing noise or moving the client to a cleaner band/channel, not boosting power (which can worsen co-channel interference).</p><p>Channel and band planning prevents self-interference. In 2.4 GHz, only channels 1, 6, and 11 are non-overlapping — anything else causes adjacent-channel interference. The 5 GHz band offers many more clean channels but shorter range; some require DFS and will briefly change channels if radar is detected. Overlapping cells on the same channel cause co-channel interference and airtime contention. A site survey / heat map validates coverage and channel reuse; a Wi-Fi analyzer shows channel utilization and rogue APs.</p><p>Other recurring issues: sticky clients that won't roam to a closer AP (tune roaming thresholds), coverage holes and dead spots (attenuation from walls, distance), band steering pushing capable clients to 5 GHz, and authentication failures (wrong PSK, expired certificate, or a RADIUS/NPS problem for enterprise Wi-Fi). Mismatched security settings and captive-portal quirks also break association. For the exam, tie the symptom to the cause — low SNR to interference, poor roaming to thresholds, and 'works on 5 GHz but not 2.4' to band-specific interference or channel overlap."}

// ═══════════════════════════════════════════════════════════════════════════════
// AUDIO — synthesized via WebAudio (no asset files needed)
// Two banks: "arcade" (8-bit beeps) and "modern" (UI chime/thud)
// ═══════════════════════════════════════════════════════════════════════════════
const Audio = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }
    return ctx;
  }

  // Generic tone generator
  function tone({freq=440, dur=0.1, type='sine', vol=0.18, attack=0.005, release=0.06, slide=null} = {}) {
    const c = getCtx(); if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur + release);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + dur + release + 0.02);
  }

  // ── Arcade pack ──
  const arcade = {
    correct() {
      tone({freq:660, dur:0.07, type:'square', vol:0.13, slide:880});
      setTimeout(()=>tone({freq:880, dur:0.09, type:'square', vol:0.13, slide:1320}), 60);
    },
    wrong() {
      tone({freq:220, dur:0.1, type:'square', vol:0.14, slide:110});
      setTimeout(()=>tone({freq:110, dur:0.12, type:'sawtooth', vol:0.12, slide:80}), 80);
    },
    levelUp() {
      const notes = [523, 659, 784, 1047];
      notes.forEach((f,i) => setTimeout(()=>tone({freq:f, dur:0.08, type:'square', vol:0.12}), i*70));
    },
    streak() {
      tone({freq:880, dur:0.05, type:'square', vol:0.10});
      setTimeout(()=>tone({freq:1320, dur:0.05, type:'square', vol:0.10}), 50);
      setTimeout(()=>tone({freq:1760, dur:0.08, type:'square', vol:0.10}), 100);
    },
    tick() { tone({freq:1200, dur:0.03, type:'square', vol:0.06}); },
    bell() {
      tone({freq:1568, dur:0.18, type:'square', vol:0.14});
      setTimeout(()=>tone({freq:2093, dur:0.20, type:'square', vol:0.13}), 100);
    },
  };

  // ── Modern pack ──
  const modern = {
    correct() {
      tone({freq:880, dur:0.10, type:'sine', vol:0.18, slide:1320, attack:0.01, release:0.12});
    },
    wrong() {
      tone({freq:220, dur:0.18, type:'sine', vol:0.16, slide:140, attack:0.02, release:0.18});
    },
    levelUp() {
      tone({freq:523, dur:0.12, type:'sine', vol:0.16, attack:0.015});
      setTimeout(()=>tone({freq:784, dur:0.12, type:'sine', vol:0.16, attack:0.015}), 100);
      setTimeout(()=>tone({freq:1047, dur:0.18, type:'sine', vol:0.18, attack:0.015}), 200);
    },
    streak() {
      tone({freq:1047, dur:0.08, type:'sine', vol:0.14, slide:1568});
    },
    tick() { tone({freq:880, dur:0.04, type:'sine', vol:0.05}); },
    bell() {
      tone({freq:880, dur:0.4, type:'sine', vol:0.18, attack:0.02, release:0.35});
      setTimeout(()=>tone({freq:1320, dur:0.4, type:'sine', vol:0.16, attack:0.02, release:0.35}), 80);
    },
  };

  return { arcade, modern, getCtx };
})();

function daysBetween(a,b) { return Math.round((b - a) / 86400000); }

// "Day-streak" — count of consecutive days with activity, computed from daily map
function computeDayStreak() {
  const days = Object.keys(state.daily).sort();
  if (days.length === 0) return 0;
  let count = 0;
  let cursor = new Date(todayKey());
  while (true) {
    const k = dateKey(cursor);
    if (state.daily[k] && state.daily[k].questions > 0) {
      count++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      // if today has no activity yet but yesterday does, that's still a 1-day streak from yesterday
      if (count === 0 && k === todayKey()) {
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      break;
    }
  }
  return count;
}

// WEAK SPOT ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
// Topic = domain for now (could be more granular later by tagging questions)
// "Weakness" score = (1 - accuracy) weighted by # questions seen on that domain.
function getWeakDomains() {
  const out = [];
  for (let d = 1; d <= 5; d++) {
    const s = state.scores[d];
    if (s.t < 3) continue; // need a minimum sample
    const acc = s.c / s.t;
    if (acc < 0.75) {
      out.push({domain:d, acc, attempts:s.t, weakness:(1-acc)});
    }
  }
  out.sort((a,b) => b.weakness - a.weakness);
  return out;
}

function getWeakQuestions() {
  // Specific qids the user has gotten wrong recently or has < 50% on
  const out = [];
  for (const qid in state.qStats) {
    const s = state.qStats[qid];
    if (s.seen < 1) continue;
    const acc = s.correct / s.seen;
    if (acc < 0.7 || state.missed.includes(qid)) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (q) out.push({q, acc, seen:s.seen});
    }
  }
  out.sort((a,b) => a.acc - b.acc);
  return out;
}

// ═══════════════════════════════════════════════════════════════════════════════
// QUIZ ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
function buildQuizQueue() {
  if (state.weakMode) {
    const weak = getWeakQuestions().map(w => w.q);
    return weak.length ? shuffle(weak) : [];
  }
  if (state.reviewMode) {
    const missedQs = QUESTIONS.filter(q => state.missed.includes(q.id));
    return shuffle(missedQs);
  }
  // Normal — but if weakSilentMix is enabled, prepend some weak questions
  let pool = getQuestionsForDomain(state.domain);
  pool = shuffle(pool);
  if (state.settings.weakSilentMix) {
    const weak = getWeakQuestions().map(w => w.q).filter(q =>
      state.domain === 0 || q.domain === state.domain
    );
    if (weak.length > 0) {
      // Mix in roughly 1 weak question per 4 normal ones
      const mixCount = Math.min(weak.length, Math.ceil(pool.length / 4));
      const mixed = shuffle(weak).slice(0, mixCount);
      // remove duplicates from pool
      const mixedIds = new Set(mixed.map(q => q.id));
      pool = pool.filter(q => !mixedIds.has(q.id));
      // Splice them in at random positions
      mixed.forEach(mq => {
        pool.splice(Math.floor(Math.random() * pool.length), 0, mq);
      });
    }
  }
  return pool;
}

function initQuizQueue() {
  state.questionQueue = buildQuizQueue();
  nextQuestion();
}

function nextQuestion() {
  if (state.questionQueue.length === 0) {
    if (state.reviewMode || state.weakMode) {
      state.currentQuestion = null;
    } else {
      state.questionQueue = buildQuizQueue();
    }
    if (state.questionQueue.length === 0) { state.currentQuestion = null; render(); return; }
  }
  state.currentQuestion = state.questionQueue.pop();
  state.selectedAnswer = null;
  state.answerRevealed = false;
  state.qStartTime = Date.now();
  state.noteEditing = null;
  render();
}

function selectAnswer(letter) {
  if (state.answerRevealed) return;
  state.selectedAnswer = letter;
  render();
}

function submitAnswer() {
  if (!state.selectedAnswer || state.answerRevealed) return;
  state.answerRevealed = true;
  const q = state.currentQuestion;
  const isCorrect = state.selectedAnswer === q.answer;
  const ms = Date.now() - state.qStartTime;

  // domain + overall scores
  if (!state.scores[q.domain]) state.scores[q.domain] = {c:0,t:0};
  state.scores[q.domain].t++;
  if (isCorrect) state.scores[q.domain].c++;
  state.scores[0].t++;
  if (isCorrect) state.scores[0].c++;

  // per-question stats
  if (!state.qStats[q.id]) state.qStats[q.id] = {seen:0, correct:0, totalMs:0};
  state.qStats[q.id].seen += 1;
  if (isCorrect) state.qStats[q.id].correct += 1;
  state.qStats[q.id].totalMs += ms;

  // history (keep last 500)
  state.history.push({ts: Date.now(), qid: q.id, domain: q.domain, correct: isCorrect, ms});
  if (state.history.length > 500) state.history.splice(0, state.history.length - 500);

  // daily activity
  updateDaily(1, isCorrect, ms);

  // streak + XP
  if (isCorrect) {
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    awardXP(10);
    playSound('correct');
    if (state.streak === 3) showToast('Triple Threat!', '3 in a row — keep going');
    else if (state.streak === 5) { showToast('On Fire!', '5-streak achieved'); awardXP(15); playSound('streak'); }
    else if (state.streak === 10) { showToast('Unstoppable!', '10 correct in a row 🔥'); fireConfetti(); awardXP(30); playSound('streak'); }
    else if (state.streak > 0 && state.streak % 25 === 0) {
      showToast('Legendary Streak!', `${state.streak} correct in a row!`);
      fireConfetti(); awardXP(50); playSound('streak');
    }
  } else {
    state.streak = 0;
    playSound('wrong');
  }

  // missed list
  if (!isCorrect && !state.missed.includes(q.id)) state.missed.push(q.id);
  else if (isCorrect && state.missed.includes(q.id)) state.missed = state.missed.filter(id => id !== q.id);

  saveAll();
  render();
}

function resetScore() {
  state.scores[state.domain] = {c:0,t:0};
  if (state.domain !== 0) {
    let c=0, t=0;
    for (let i=1;i<=5;i++) { c += state.scores[i].c; t += state.scores[i].t; }
    state.scores[0] = {c,t};
  } else {
    for (let i=0;i<=5;i++) state.scores[i] = {c:0,t:0};
  }
  saveAll();
  render();
}

  // Build a 90-question pool weighted by domain, drawn from EXAM_QUESTIONS
  const picks = [];
  for (let d = 1; d <= 5; d++) {
    const target = Math.round(EXAM_LENGTH * DOMAIN_WEIGHTS[d]);
    const pool = shuffle(EXAM_QUESTIONS.filter(q => q.domain === d));
    picks.push(...pool.slice(0, target));
  }
  // Pad/trim to exactly EXAM_LENGTH
  while (picks.length < EXAM_LENGTH) {
    const extra = shuffle(EXAM_QUESTIONS).find(q => !picks.includes(q));
    if (extra) picks.push(extra); else break;
  }
  picks.length = Math.min(picks.length, EXAM_LENGTH);
  const chosen = shuffle(picks);
  // Randomize the A/B/C/D position of each question's options so the exam
  // differs every attempt and answers aren't clustered on one letter.
  const optOrder = {};
  for (const q of chosen) optOrder[q.id] = shuffle(['A','B','C','D']);
  state.exam = {
    questions: chosen.map(q => q.id),
    optOrder,
    answers: {},
    idx: 0,
    startTs: Date.now(),
    endTs: Date.now() + EXAM_MINUTES * 60 * 1000,
    finished: false,
    results: null,
    reviewIdx: 0,
    paused: false,
    pausedRemainingMs: 0,
  };
  saveAll();
  render();
  startExamClock();
}

// ─── Live exam clock + pause/resume ───
function startExamClock() {
  if (state.examClockInterval) return;
  state.examClockInterval = setInterval(examClockTick, 1000);
}
function stopExamClock() {
  if (state.examClockInterval) { clearInterval(state.examClockInterval); state.examClockInterval = null; }
}
function examClockTick() {
  if (!state.exam || state.exam.finished || state.exam.paused) return;
  const remaining = state.exam.endTs - Date.now();
  if (remaining <= 0) {
    stopExamClock();
    finishExam();
    return;
  }
  updateExamTimerDisplay();
}
function updateExamTimerDisplay() {
  const el = document.getElementById('examTimer');
  if (!el || !state.exam) return;
  const remaining = state.exam.paused
    ? Math.max(0, state.exam.pausedRemainingMs)
    : Math.max(0, state.exam.endTs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  el.innerHTML = `${state.exam.paused ? ICONS.pause : ICONS.clock} ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  el.classList.toggle('paused', state.exam.paused);
  el.classList.toggle('danger', !state.exam.paused && remaining < 60000);
  el.classList.toggle('warn', !state.exam.paused && remaining >= 60000 && remaining < 5*60000);
}
function pauseExam() {
  if (!state.exam || state.exam.finished || state.exam.paused) return;
  state.exam.pausedRemainingMs = Math.max(0, state.exam.endTs - Date.now());
  state.exam.paused = true;
  stopExamClock();
  saveAll();
  render();
}
function resumeExam() {
  if (!state.exam || state.exam.finished || !state.exam.paused) return;
  state.exam.endTs = Date.now() + Math.max(0, state.exam.pausedRemainingMs);
  state.exam.paused = false;
  saveAll();
  startExamClock();
  render();
}

function answerExam(letter) {
  if (!state.exam || state.exam.finished) return;
  const qid = state.exam.questions[state.exam.idx];
  state.exam.answers[qid] = letter;
  saveAll();
  render();
}

function examNav(delta) {
  if (!state.exam || state.exam.finished) return;
  const next = state.exam.idx + delta;
  if (next < 0 || next >= state.exam.questions.length) return;
  state.exam.idx = next;
  render();
}

function jumpExam(idx) {
  if (!state.exam || state.exam.finished) return;
  state.exam.idx = idx;
  render();
}

function finishExam() {
  if (!state.exam || state.exam.finished) return;
  stopExamClock();
  // tally results
  let correct = 0;
  const byDomain = {1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0},5:{c:0,t:0}};
  for (const qid of state.exam.questions) {
    const q = findExamQ(qid);
    if (!q) continue;
    byDomain[q.domain].t++;
    if (state.exam.answers[qid] === q.answer) {
      correct++;
      byDomain[q.domain].c++;
    }
  }
  const pct = Math.round((correct / state.exam.questions.length) * 100);
  state.exam.finished = true;
  state.exam.results = {
    correct,
    total: state.exam.questions.length,
    pct,
    byDomain,
    durationMs: Date.now() - state.exam.startTs,
  };
  state.exam.reviewIdx = 0;
  // Award XP for completing
  awardXP(50 + Math.round(pct / 2));
  if (pct >= PASS_THRESHOLD) {
    fireConfetti();
    showToast('Practice Exam: PASS!', `${pct}% score · 90-question simulation`);
    playSound('bell');
  } else {
    showToast('Practice Exam complete', `${pct}% score · review your answers`);
  }
  saveAll();
  render();
}

function abandonExam() {
  stopExamClock();
  state.exam = null;
  saveAll();
  render();
}

// ═══════════════════════════════════════════════════════════════════════════════
// POMODORO
// ═══════════════════════════════════════════════════════════════════════════════
function pomStart(mode) {
  if (state.pomTickInterval) { clearInterval(state.pomTickInterval); state.pomTickInterval = null; }
  state.pom.mode = mode;
  const mins = mode === 'work' ? state.settings.workMins : state.settings.breakMins;
  state.pom.remaining = mins * 60;
  state.pom.runningSince = Date.now();
  pomTick();
  state.pomTickInterval = setInterval(pomTick, 1000);
  render();
}
function pomPause() {
  if (state.pomTickInterval) { clearInterval(state.pomTickInterval); state.pomTickInterval = null; }
  state.pom.runningSince = null;
  render();
}
function pomResume() {
  if (state.pomTickInterval) return;
  state.pom.runningSince = Date.now();
  state.pomTickInterval = setInterval(pomTick, 1000);
  render();
}
function pomStop() {
  if (state.pomTickInterval) { clearInterval(state.pomTickInterval); state.pomTickInterval = null; }
  state.pom.mode = 'idle';
  state.pom.remaining = state.settings.workMins * 60;
  state.pom.runningSince = null;
  render();
}
function pomTick() {
  if (state.pom.runningSince === null) return;
  state.pom.remaining -= 1;
  // accumulate study minutes when in work mode
  if (state.pom.mode === 'work') {
    const t = todayKey();
    if (!state.pom.minutesToday[t]) state.pom.minutesToday[t] = 0;
    state.pom.minutesToday[t] += 1/60;
    if (Math.abs((state.pom.minutesToday[t] % 1)) < 0.018) saveAll();
  }
  if (state.pom.remaining <= 0) {
    if (state.pomTickInterval) { clearInterval(state.pomTickInterval); state.pomTickInterval = null; }
    if (state.pom.mode === 'work') {
      state.pom.cyclesCompleted++;
      saveAll();
      showToast('Work cycle done!', `Take a ${state.settings.breakMins}-min break`);
      playSound('bell');
      pomStart('break');
    } else {
      showToast('Break over', 'Ready for another work cycle?');
      playSound('bell');
      pomStop();
    }
    return;
  }
  // Subtle tick on last 3 seconds
  if (state.pom.remaining <= 3 && state.pom.remaining > 0) playSound('tick');
  // Re-render only the timer pill + page if on pomodoro page (avoid full re-render every second)
  updateTimerDisplay();
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateTimerDisplay() {
  // Update the small pill in the topbar
  const pill = document.getElementById('topPomPill');
  if (pill) {
    pill.textContent = fmtTime(state.pom.remaining);
    if (pill.parentElement && pill.parentElement.classList) {
      pill.parentElement.classList.toggle('running', state.pom.runningSince !== null);
      pill.parentElement.classList.toggle('break', state.pom.mode === 'break');
    }
  }
  // If we're on the pomodoro page, update the big timer too
  const big = document.getElementById('pomBigTime');
  if (big) big.textContent = fmtTime(state.pom.remaining);
}

  const streak = computeDayStreak();

function renderHeatmap() {
  // 12 weeks = 84 days. Show as 28 cols (4 weeks × 7 rows? actually 28 cols of singles)
  // We'll render 84 cells in chronological order ending today.
  const cells = [];
  const today = new Date(todayKey());
  for (let i = 83; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const data = state.daily[k];
    let cls = 'heat-cell';
    if (k === todayKey()) cls += ' today';
    if (data && data.questions > 0) {
      const pct = data.questions / state.dailyGoal;
      if (pct >= 1.5) cls += ' l4';
      else if (pct >= 1) cls += ' l3';
      else if (pct >= 0.5) cls += ' l2';
      else cls += ' l1';
    }
    cells.push(`<div class="${cls}" title="${k}: ${data ? data.questions : 0} questions"></div>`);
  }
  return `<div class="heatmap">${cells.join('')}</div>`;
}

function renderQuiz() {
  // Domain filter strip
  let html = renderDomainTabs();

  const q = state.currentQuestion;
  if (!q) {
    if (state.weakMode) {
      return html + `<div class="panel"><div class="empty-state">
        <div class="empty-icon">${ICONS.trophy}</div>

    }
    if (state.reviewMode) {
      return html + `<div class="panel"><div class="empty-state">
        <div class="empty-icon">${ICONS.trophy}</div>
        <p>All missed questions reviewed — clean queue.</p>
        <button class="btn btn-primary" style="margin-top:1rem" data-action="dashboard">${ICONS.bar} BACK TO DASHBOARD</button>
      </div></div>`;

    return html + `<div class="panel"><div class="empty-state">

      <p>No questions for this domain.</p>
    </div></div>`;
  }

  const s = state.scores[state.domain] || {c:0,t:0};
  const p = scorePct(s);
  const queueLeft = state.questionQueue.length;
  const isBookmarked = !!state.bookmarks[q.id];
  const note = state.notes[q.id] || '';
  const isWeakQ = (state.qStats[q.id] && state.qStats[q.id].seen >= 2 && state.qStats[q.id].correct / state.qStats[q.id].seen < 0.5);

  html += `<div class="panel">
    <div class="q-meta">
      <span class="q-meta-tag">D${q.domain} · ${DOMAINS[q.domain].name.replace('Networking ','').replace('Network ','')}</span>
      <span class="q-meta-tag">${queueLeft} LEFT</span>
      ${state.reviewMode ? '<span class="q-meta-tag review">📌 REVIEW</span>' : ''}
      ${state.weakMode ? '<span class="q-meta-tag weak">⚠ WEAK SPOT</span>' : ''}
      ${isWeakQ && !state.weakMode ? '<span class="q-meta-tag weak">⚠ WEAK</span>' : ''}
      ${state.streak >= 3 ? `<span class="q-meta-tag streak">🔥 ${state.streak} STREAK</span>` : ''}
      <div class="q-actions">
        <button class="btn btn-ghost btn-icon" id="bookmarkBtn" title="${isBookmarked ? 'Bookmarked' : 'Bookmark this question'}" style="color:${isBookmarked ? 'var(--warn)' : 'var(--text-3)'}">
          ${isBookmarked ? ICONS.bookmarkFill : ICONS.bookmark}
        </button>
        <button class="btn btn-ghost btn-icon" id="noteBtn" title="${note ? 'Edit note' : 'Add note'}" style="color:${note ? 'var(--tertiary)' : 'var(--text-3)'}">
          ${ICONS.note}
        </button>
      </div>
    </div>
    <div class="question-text">${q.question}</div>
    <div class="options">`;

  for (const letter of ['A','B','C','D']) {
    let cls = 'option';
    if (state.answerRevealed) {
      cls += ' disabled';
      if (letter === q.answer) cls += ' correct';
      else if (letter === state.selectedAnswer && letter !== q.answer) cls += ' incorrect';
    } else if (state.selectedAnswer === letter) {
      cls += ' selected';
    }
    html += `<button class="${cls}" data-option="${letter}">
      <div class="option-letter">${letter}</div>
      <div class="option-text">${q.options[letter]}</div>
    </button>`;
  }
  html += `</div>`;

  if (state.answerRevealed) {
    html += `<div class="explanation">
      <div class="explanation-label">${ICONS.lightbulb} EXPLANATION</div>
      ${q.explanation}
    </div>`;
  }

  if (state.noteEditing === q.id) {
    html += `<div class="q-note">
      <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
      <textarea id="noteInput" placeholder="Write a personal note about this question…">${(note || '').replace(/</g,'&lt;')}</textarea>
      <div class="q-note-actions">
        <button class="btn btn-ghost btn-sm" id="noteCancel">CANCEL</button>
        <button class="btn btn-sm" id="noteSave">${ICONS.save} SAVE</button>
      </div>
    </div>`;
  } else if (note) {
    html += `<div class="q-note">
      <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
      <div style="font-size:0.85rem;line-height:1.55;color:var(--text);font-family:var(--font-mono);white-space:pre-wrap">${(note).replace(/</g,'&lt;')}</div>
    </div>`;
  }

  html += `<div class="quiz-controls">`;
  if (!state.answerRevealed) {
    html += `<button class="btn btn-primary" id="submitBtn" ${!state.selectedAnswer ? 'disabled' : ''}>${ICONS.check} SUBMIT</button>`;
  } else {
    html += `<button class="btn btn-primary" id="nextBtn">NEXT ${ICONS.arrow}</button>`;
  }
  html += `<button class="btn btn-ghost btn-sm" id="resetScoreBtn">RESET</button>
    <div class="score-display">${ICONS.target}<span class="score-num ${scoreClass(p)}">${s.c}/${s.t} · ${s.t > 0 ? p+'%' : '—'}</span></div>
  </div></div>`;

  return html;
}

function renderDomainTabs() {
  // Don't show in weak/review mode
  if (state.weakMode || state.reviewMode) return '';
  let html = `<div class="quick-picks" style="margin-bottom:1rem">`;
  for (const d of DOMAINS) {
    const cls = state.domain === d.id ? ' active' : '';
    const label = d.id === 0 ? 'ALL' : 'D' + d.id;
    html += `<button class="quick-pick${cls}" data-setdomain="${d.id}">${label}</button>`;
  }
  html += `</div>`;
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// FLASHCARDS
// ─────────────────────────────────────────────────────────────────────────────
function renderFlashcards() {
  let html = renderDomainTabs();
  const c = state.currentCard;
  if (!c) return html + `<div class="panel"><div class="empty-state">
    <div class="empty-icon">${ICONS.flip}</div>
    <p>No flashcards for this domain.</p>
  </div></div>`;

  const totalCards = state.cardTotal || getCardsForDomain(state.domain).length;
  const progressPct = totalCards > 0 ? Math.round((state.cardsSeenCount / totalCards) * 100) : 0;
  const isBookmarked = !!state.bookmarks[c.id];
  const note = state.notes[c.id] || '';

  html += `<div class="fc-progress">CARD <b>${state.cardsSeenCount}</b> OF ${totalCards}</div>
    <div class="fc-progress-track"><div class="fc-progress-fill" style="width:${progressPct}%"></div></div>`;

  // Action row above card (mobile-friendly)
  html += `<div class="q-meta" style="justify-content:flex-end;margin-bottom:0.55rem">
    <div class="q-actions">
      <button class="btn btn-ghost btn-icon" id="cardBookmarkBtn" title="${isBookmarked ? 'Bookmarked' : 'Bookmark this card'}" style="color:${isBookmarked ? 'var(--warn)' : 'var(--text-3)'}">
        ${isBookmarked ? ICONS.bookmarkFill : ICONS.bookmark}
      </button>
      <button class="btn btn-ghost btn-icon" id="cardNoteBtn" title="${note ? 'Edit note' : 'Add note'}" style="color:${note ? 'var(--tertiary)' : 'var(--text-3)'}">
        ${ICONS.note}
      </button>
    </div>
  </div>`;

  html += `<div class="flashcard-container"><div class="flashcard${state.cardFlipped ? ' flipped' : ''}" id="flashcard">
    <div class="flashcard-face flashcard-front">
      <div class="flashcard-front-mark">D${c.domain} · TERM</div>
      <div class="flashcard-term">${c.term}</div>
      <div class="flashcard-hint">${ICONS.flip} TAP OR <span class="kbd">SPACE</span> TO REVEAL</div>
    </div>
    <div class="flashcard-face flashcard-back">
      <div class="flashcard-def">${c.definition}</div>
      <div class="flashcard-example"><b>EXAMPLE</b> ${c.example}</div>
    </div>
  </div></div>`;

  // Note editor
  if (state.noteEditing === c.id) {
    html += `<div class="q-note" style="margin-bottom:1rem">
      <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
      <textarea id="noteInput" placeholder="Write a personal note about this flashcard…">${(note || '').replace(/</g,'&lt;')}</textarea>
      <div class="q-note-actions">
        <button class="btn btn-ghost btn-sm" id="noteCancel">CANCEL</button>
        <button class="btn btn-sm" id="noteSave">${ICONS.save} SAVE</button>
      </div>
    </div>`;
  } else if (note) {
    html += `<div class="q-note" style="margin-bottom:1rem">
      <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
      <div style="font-size:0.85rem;line-height:1.55;color:var(--text);font-family:var(--font-mono);white-space:pre-wrap">${(note).replace(/</g,'&lt;')}</div>
    </div>`;
  }

  html += `<div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">`;
  if (!state.cardFlipped) html += `<button class="btn" id="flipCardBtn">${ICONS.flip} REVEAL</button>`;
  html += `<button class="btn btn-primary" id="nextCardBtn">NEXT CARD ${ICONS.arrow}</button>
  </div>`;
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// REFERENCE / TOPICS
// ─────────────────────────────────────────────────────────────────────────────
function renderReference() {
  if (state.activeRef) {
    const ref = state.activeRef;
    const note = state.notes[ref.id] || '';
    const isBookmarked = !!state.bookmarks[ref.id];

    let html = `<div class="ref-back">
      <button class="btn btn-sm" id="refBackBtn">${ICONS.arrowleft} BACK TO TOPICS</button>
    </div>
    <div class="panel ref-detail">
      <div class="ref-detail-header">
        <div class="ref-detail-icon">${ICONS.book}</div>
        <div class="ref-detail-info">
          <div class="ref-detail-title">${ref.title.toUpperCase()}</div>
          <div class="ref-detail-meta">DOMAIN ${ref.domain} · ${DOMAINS[ref.domain].name}</div>
        </div>
        <div class="q-actions">
          <button class="btn btn-ghost btn-icon" id="refBookmarkBtn" title="${isBookmarked ? 'Bookmarked' : 'Bookmark this topic'}" style="color:${isBookmarked ? 'var(--warn)' : 'var(--text-3)'}">
            ${isBookmarked ? ICONS.bookmarkFill : ICONS.bookmark}
          </button>
          <button class="btn btn-ghost btn-icon" id="refNoteBtn" title="${note ? 'Edit note' : 'Add note'}" style="color:${note ? 'var(--tertiary)' : 'var(--text-3)'}">
            ${ICONS.note}
          </button>
        </div>
      </div>
      <div class="ref-content">${ref.content}</div>`;
    if (state.noteEditing === ref.id) {
      html += `<div class="q-note" style="margin-top:1.25rem">
        <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
        <textarea id="noteInput" placeholder="Write a personal note about this topic…">${(note || '').replace(/</g,'&lt;')}</textarea>
        <div class="q-note-actions">
          <button class="btn btn-ghost btn-sm" id="noteCancel">CANCEL</button>
          <button class="btn btn-sm" id="noteSave">${ICONS.save} SAVE</button>
        </div>
      </div>`;
    } else if (note) {
      html += `<div class="q-note" style="margin-top:1.25rem">
        <div class="q-note-label">${ICONS.note} YOUR NOTE</div>
        <div style="font-size:0.9rem;line-height:1.55;color:var(--text);font-family:var(--font-mono);white-space:pre-wrap">${(note).replace(/</g,'&lt;')}</div>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  // ── Topic browser: domain overview → per-domain list ──
  const DOMAIN_BLURB = {
    1: 'OSI model, TCP/UDP, ports, IP addressing, subnetting & VLSM, VLANs, NAT, IPv6, routing protocols & cloud/SDN.',
    2: 'Switching, STP, wireless standards & RF, routing config, VPNs & IPsec, high availability, cabling & transceivers.',
    3: 'Monitoring (SNMP/Syslog/NetFlow), DNS, QoS, backups & DR, baselines, RAID, NTP & configuration management.',
    4: 'Security fundamentals, common attacks, firewalls, AAA / 802.1X, RADIUS vs TACACS+, VPN security & zero trust.',
    5: 'Troubleshooting methodology, essential CLI tools, and a structured symptom-to-cause diagnostic guide.',
  };

  const refItemHTML = (r) => `<button class="ref-item" data-ref="${r.id}">
    <div class="ref-icon">${ICONS.layers}</div>
    <div class="ref-meta">
      <div class="ref-item-title">${r.title.toUpperCase()}</div>
      <div class="ref-item-domain">D${r.domain} · ${DOMAINS[r.domain].name.replace('Networking ','').replace('Network ','')}${state.bookmarks[r.id] ? ' · ★' : ''}${state.notes[r.id] ? ' · 📝' : ''}</div>
    </div>
    <div class="ref-item-arrow">${ICONS.arrow}</div>
  </button>`;

  const qry = state.searchQuery.toLowerCase();
  let html = `<div class="search-bar"><div class="search-input-wrap">
    <span class="search-icon">${ICONS.search}</span>
    <input class="search-input" id="refSearch" type="text" placeholder="Search all topics, tags, concepts…" value="${state.searchQuery.replace(/"/g,'&quot;')}">
  </div></div>`;

  // 1) Active search → flat results across every domain
  if (qry) {
    const refs = REFERENCES.filter(r => r.title.toLowerCase().includes(qry) || (r.tags && r.tags.some(t => t.toLowerCase().includes(qry))));
    if (refs.length === 0) {
      html += `<div class="panel"><div class="empty-state">
        <div class="empty-icon">${ICONS.search}</div>
        <p>No topics match "${state.searchQuery}"</p>
      </div></div>`;
    } else {
      html += `<div class="ref-list">${refs.map(refItemHTML).join('')}</div>`;
    }
    return html;
  }

  // 2) No domain selected → show the five domain cards
  if (!state.refDomain) {
    html += `<div class="dom-grid">`;
    for (let d = 1; d <= 5; d++) {
      const count = REFERENCES.filter(r => r.domain === d).length;
      html += `<button class="dom-card" data-refdomain="${d}">
        <div class="dom-card-badge">D${d}</div>
        <div class="dom-card-body">
          <div class="dom-card-title">${DOMAINS[d].name.toUpperCase()}</div>
          <div class="dom-card-sub">${DOMAIN_BLURB[d]}</div>
          <div class="dom-card-count">${count} TOPIC${count === 1 ? '' : 'S'} · ${DOMAINS[d].weight} OF EXAM</div>
        </div>
        <div class="dom-card-arrow">${ICONS.arrow}</div>
      </button>`;
    }
    html += `</div>`;
    return html;
  }

  // 3) Inside a domain → that domain's topic list
  const d = state.refDomain;
  const refs = REFERENCES.filter(r => r.domain === d);
  html += `<div class="ref-back"><button class="btn btn-sm" id="refDomainBack">${ICONS.arrowleft} ALL DOMAINS</button></div>
    <div class="ref-domain-head">
      <div class="rh-badge">D${d}</div>
      <div>
        <div class="rh-title">${DOMAINS[d].name.toUpperCase()}</div>
        <div class="rh-sub">${refs.length} TOPIC${refs.length === 1 ? '' : 'S'} · ${DOMAINS[d].weight} OF EXAM</div>
      </div>
    </div>`;
  if (refs.length === 0) {
    html += `<div class="panel"><div class="empty-state">
      <div class="empty-icon">${ICONS.book}</div>
      <p>No topics in this domain yet.</p>
    </div></div>`;
  } else {
    html += `<div class="ref-list">${refs.map(refItemHTML).join('')}</div>`;
  }
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// PRACTICE EXAM
// ─────────────────────────────────────────────────────────────────────────────
function renderExam() {
  if (!state.exam) return renderExamStart();
  if (state.exam.finished) return renderExamResults();
  return renderExamInProgress();
}

function renderExamStart() {
  return `<div class="panel">
    <div class="panel-head">
      <div class="panel-title">${ICONS.exam} PRACTICE EXAM</div>
      <div class="panel-meta">SIMULATION</div>
    </div>
    <div style="line-height:1.7;color:var(--text-2);margin-bottom:1.25rem">
      <p style="margin-bottom:0.85rem"><b style="color:var(--text);font-family:var(--font-display);letter-spacing:0.04em">${EXAM_LENGTH} QUESTIONS · ${EXAM_MINUTES} MINUTES</b></p>
      <p style="margin-bottom:0.6rem">A separate, harder bank of scenario- and calculation-based questions — distinct from the Quiz — designed to make you reason through troubleshooting decisions, subnetting math, and "BEST / MOST likely / FIRST" judgment calls. Questions and answer choices are reshuffled every attempt.</p>
      <p style="margin-bottom:0.6rem">Questions are weighted by official ${CERT.code} domain percentages:</p>
      <ul style="list-style:none;padding-left:0;font-family:var(--font-mono);font-size:0.85rem">
        <li>· Domain 1 — Networking Concepts (~21 Qs)</li>
        <li>· Domain 2 — Network Implementation (~17 Qs)</li>
        <li>· Domain 3 — Network Operations (~15 Qs)</li>
        <li>· Domain 4 — Network Security (~18 Qs)</li>
        <li>· Domain 5 — Network Troubleshooting (~19 Qs)</li>
      </ul>
      <p style="margin-top:0.85rem;font-size:0.85rem">Navigate freely between questions. Use PAUSE if you get interrupted. Pass = ${PASS_THRESHOLD}%.</p>
    </div>
    <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
      <button class="btn btn-primary" id="examStartBtn">${ICONS.play} START EXAM</button>
    </div>
  </div>`;
}

function renderExamInProgress() {
  const ex = state.exam;
  const paused = !!ex.paused;
  const remaining = paused
    ? Math.max(0, ex.pausedRemainingMs)
    : Math.max(0, ex.endTs - Date.now());
  const remainingMins = Math.floor(remaining / 60000);
  const remainingSecs = Math.floor((remaining % 60000) / 1000);
  const timeStr = String(remainingMins).padStart(2,'0') + ':' + String(remainingSecs).padStart(2,'0');
  const timeClass = paused ? 'paused' : (remaining < 60000 ? 'danger' : (remaining < 5*60000 ? 'warn' : ''));

  // Auto-finish if time's up (never while paused)
  if (!paused && remaining <= 0) {
    setTimeout(finishExam, 0);
  }

  const qid = ex.questions[ex.idx];
  const q = findExamQ(qid);
  if (!q) return `<div class="panel">Error loading question</div>`;
  const answered = ex.answers[qid];
  const order = (ex.optOrder && ex.optOrder[qid]) || ['A','B','C','D'];
  const totalAnswered = Object.keys(ex.answers).length;
  const progressPct = Math.round(((ex.idx + 1) / ex.questions.length) * 100);

  let html = `<div class="panel">
    <div class="exam-progress">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.45rem;flex-wrap:wrap;gap:0.4rem">
        <div class="panel-meta">QUESTION ${ex.idx + 1} OF ${ex.questions.length} · ${totalAnswered} ANSWERED</div>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <button class="btn btn-sm" id="examPauseToggle">${paused ? ICONS.play + ' RESUME' : ICONS.pause + ' PAUSE'}</button>
          <div class="exam-timer ${timeClass}" id="examTimer">${paused ? ICONS.pause : ICONS.clock} ${timeStr}</div>
        </div>
      </div>
      <div class="exam-bar"><div class="exam-bar-fill" style="width:${progressPct}%"></div></div>
    </div>`;

  if (paused) {
    html += `<div class="exam-paused-banner">${ICONS.pause} Exam paused — timer stopped. Press resume when you're ready.</div>`;
  }

  html += `<div class="${paused ? 'exam-paused-dim' : ''}">
    <div class="q-meta">
      <span class="q-meta-tag exam">EXAM MODE</span>
      <span class="q-meta-tag">D${q.domain}</span>
    </div>
    <div class="question-text">${q.question}</div>
    <div class="options">`;
  const dispLetters = ['A','B','C','D'];
  order.forEach((origLetter, i) => {
    const cls = 'option' + (answered === origLetter ? ' selected' : '');
    html += `<button class="${cls}" data-examopt="${origLetter}">
      <div class="option-letter">${dispLetters[i]}</div>
      <div class="option-text">${q.options[origLetter]}</div>
    </button>`;
  });
  html += `</div></div><div class="quiz-controls">
    <button class="btn" id="examPrev" ${ex.idx === 0 ? 'disabled' : ''}>${ICONS.arrowleft} PREV</button>
    <button class="btn btn-primary" id="examNext" ${ex.idx >= ex.questions.length - 1 ? 'disabled' : ''}>NEXT ${ICONS.arrow}</button>
    <button class="btn btn-warn btn-sm" id="examFinish" style="margin-left:auto">${ICONS.check} FINISH EXAM</button>
  </div></div>`;

  // Question grid navigator
  html += `<div class="panel"><div class="panel-head">
    <div class="panel-title">${ICONS.bar} QUESTION NAVIGATOR</div>
    <div class="panel-meta">JUMP TO ANY</div>
  </div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px">`;
  for (let i = 0; i < ex.questions.length; i++) {
    const isAnswered = !!ex.answers[ex.questions[i]];
    const isCurrent = i === ex.idx;
    const bg = isCurrent ? 'var(--primary)' : (isAnswered ? 'rgba(111,155,199,0.20)' : '#000');
    const color = isCurrent ? '#000' : (isAnswered ? 'var(--primary-bright)' : 'var(--text-3)');
    const border = isCurrent ? '2px solid var(--primary)' : (isAnswered ? '1.5px solid var(--primary)' : '1px solid var(--border)');
    const shadow = isCurrent ? '0 0 12px var(--glow-pri)' : (isAnswered ? '0 0 6px var(--glow-pri)' : 'none');
    html += `<button class="examnavjump" data-jump="${i}" style="aspect-ratio:1;background:${bg};border:${border};border-radius:0;font-family:var(--font-mono);font-size:0.7rem;font-weight:700;color:${color};cursor:pointer;box-shadow:${shadow};letter-spacing:0.04em">${i+1}</button>`;
  }
  html += `</div></div>`;

  html += `<div style="text-align:center;margin-top:0.5rem">
    <button class="btn btn-danger btn-sm" id="examAbandon">${ICONS.trash} ABANDON EXAM</button>
  </div>`;
  return html;
}

function renderExamResults() {
  const ex = state.exam;
  const r = ex.results;
  const passed = r.pct >= PASS_THRESHOLD;
  const durMins = Math.floor(r.durationMs / 60000);
  const durSecs = Math.floor((r.durationMs % 60000) / 1000);

  let html = `<div class="panel">
    <div class="exam-result">
      <div class="exam-score-big ${passed ? 'pass' : 'fail'}">${r.pct}%</div>
      <div class="exam-verdict ${passed ? 'pass' : 'fail'}">${passed ? '✓ PASS' : '✗ NOT YET'}</div>
      <div style="font-family:var(--font-mono);color:var(--text-2);font-size:0.85rem;margin-bottom:0.5rem">${r.correct} / ${r.total} correct · ${durMins}m ${durSecs}s</div>
      <div class="exam-stats">`;
  for (let d = 1; d <= 5; d++) {
    const dr = r.byDomain[d];
    const dp = dr.t === 0 ? 0 : Math.round((dr.c / dr.t) * 100);
    const cls = dp >= PASS_THRESHOLD ? 'pri' : (dp >= 50 ? 'warn' : 'danger');
    html += `<div class="exam-stat">
      <div class="exam-stat-num ${cls}">${dp}%</div>
      <div class="exam-stat-lbl">D${d} · ${dr.c}/${dr.t}</div>
    </div>`;
  }
  html += `</div></div></div>`;

  // Review section
  html += `<div class="panel"><div class="panel-head">
    <div class="panel-title">${ICONS.book} FULL REVIEW · ALL ${ex.questions.length} QUESTIONS</div>
    <div class="panel-meta">EVERY QUESTION + EXPLANATION</div>
  </div>`;

  for (let i = 0; i < ex.questions.length; i++) {
    const qid = ex.questions[i];
    const q = findExamQ(qid);
    if (!q) continue;
    const yours = ex.answers[qid];
    const correct = yours === q.answer;
    const yoursLabel = yours ? `${yours}. ${q.options[yours]}` : '— (not answered)';
    html += `<div class="review-q ${correct ? 'correct' : 'incorrect'}">
      <div class="review-num">Q${i+1} · D${q.domain} · ${correct ? '✓ CORRECT' : '✗ INCORRECT'}</div>
      <div class="review-q-text">${q.question}</div>
      <div class="review-row your ${correct ? '' : 'wrong'}">
        <span class="lbl">YOUR</span><span class="val">${yoursLabel}</span>
      </div>
      <div class="review-row correct">

  }

}

// ─────────────────────────────────────────────────────────────────────────────
function renderBookmarks() {
  const ids = Object.keys(state.bookmarks).filter(k => state.bookmarks[k]);
  if (ids.length === 0) {
    return `<div class="panel"><div class="empty-state">
      <div class="empty-icon">${ICONS.bookmark}</div>
      <p>No bookmarks yet.</p>
      <div style="font-size:0.85rem;margin-top:0.4rem">Tap the bookmark icon on any question, flashcard, or topic to save it here.</div>
    </div></div>`;
  }

  // Group items by type
  const items = ids.map(id => {
    const q = QUESTIONS.find(x => x.id === id);
    if (q) return {type:'question', id, label:q.question, sub:'D' + q.domain + ' · QUESTION'};
    const f = FLASHCARDS.find(x => x.id === id);
    if (f) return {type:'card', id, label:f.term, sub:'D' + f.domain + ' · FLASHCARD'};
    const r = REFERENCES.find(x => x.id === id);
    if (r) return {type:'ref', id, label:r.title, sub:'D' + r.domain + ' · TOPIC'};
    return null;
  }).filter(Boolean);

  let html = `<div class="panel"><div class="panel-head">
    <div class="panel-title">${ICONS.bookmark} BOOKMARKS</div>
    <div class="panel-meta">${items.length} SAVED</div>
  </div>`;
  for (const it of items) {
    const tagClass = it.type === 'card' ? 'card' : (it.type === 'ref' ? 'ref' : '');
    const tagLabel = it.type === 'card' ? 'CARD' : (it.type === 'ref' ? 'TOPIC' : 'QUESTION');
    const note = state.notes[it.id] || '';
    html += `<div class="list-item" data-bookmark="${it.id}" data-bktype="${it.type}">
      <span class="list-item-tag ${tagClass}">${tagLabel}</span>
      <div class="list-item-body">
        <div class="list-item-title">${it.label}</div>
        <div class="list-item-meta">${it.sub}</div>
        ${note ? `<div class="list-item-note">${note.replace(/</g,'&lt;')}</div>` : ''}

      <div class="list-item-actions">
        <button class="btn btn-ghost btn-icon" data-unbookmark="${it.id}" title="Remove bookmark">${ICONS.trash}</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// ANALYTICS
// ─────────────────────────────────────────────────────────────────────────────
function renderAnalytics() {
  const overall = state.scores[0];
  const accPct = scorePct(overall);
  const totalMs = Object.values(state.daily).reduce((sum, d) => sum + (d.studyMs || 0), 0);
  const totalMins = Math.round(totalMs / 60000);
  const todayMins = Math.round((state.daily[todayKey()]?.studyMs || 0) / 60000);
  const pomMinsToday = Math.round(state.pom.minutesToday[todayKey()] || 0);
  const dayStreak = computeDayStreak();

  // 14-day trend bars (questions per day)
  const trend = [];
  const today = new Date(todayKey());
  for (let i = 13; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const data = state.daily[dateKey(d)];
    trend.push(data ? data.questions : 0);
  }
  const maxTrend = Math.max(1, ...trend);

  let html = `<div class="metric-grid">
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon">${ICONS.target}</div>
        <div class="metric-trend">${overall.t} attempts</div>
      </div>
      <div class="metric-value">${overall.t > 0 ? accPct + '%' : '—'}</div>
      <div class="metric-label">OVERALL ACCURACY</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon ter">${ICONS.bolt}</div>
      </div>
      <div class="metric-value">${state.xp}</div>
      <div class="metric-label">TOTAL XP</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon warn">${ICONS.flame}</div>
        <div class="metric-trend">best ${state.bestStreak}</div>
      </div>
      <div class="metric-value">${state.streak}</div>
      <div class="metric-label">CURRENT STREAK</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon ter">${ICONS.cal}</div>
      </div>
      <div class="metric-value">${dayStreak}</div>
      <div class="metric-label">DAY STREAK</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon">${ICONS.clock}</div>
        <div class="metric-trend">today ${todayMins}m</div>
      </div>
      <div class="metric-value">${totalMins}m</div>
      <div class="metric-label">TOTAL STUDY TIME</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-head">
        <div class="metric-card-icon ter">${ICONS.clock}</div>
        <div class="metric-trend">pomodoro</div>
      </div>
      <div class="metric-value">${pomMinsToday}m</div>
      <div class="metric-label">FOCUS TIME TODAY</div>
    </div>
  </div>`;

  // 14-day trend
  html += `<div class="panel"><div class="panel-head">
    <div class="panel-title">${ICONS.trending} 14-DAY ACTIVITY</div>
    <div class="panel-meta">QUESTIONS PER DAY</div>
  </div>
  <div class="trend-chart">${trend.map(v => `<div class="trend-bar" style="height:${Math.max(2, (v / maxTrend) * 100)}%" title="${v} qs"></div>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-3);margin-top:0.4rem;letter-spacing:0.04em">
    <span>14 DAYS AGO</span><span>TODAY</span>
  </div></div>`;

  // Weak domains analysis
  const weak = getWeakDomains();
  if (weak.length > 0) {
    html += `<div class="panel"><div class="panel-head">
      <div class="panel-title">${ICONS.weak} WEAK DOMAINS</div>
      <div class="panel-meta">BELOW ${PASS_THRESHOLD}%</div>
    </div><div class="dom-list">`;
    for (const w of weak) {
      const pct = Math.round(w.acc * 100);
      const shortName = DOMAINS[w.domain].name.replace('Networking ','').replace('Network ','');
      html += `<div class="dom-row">
        <span class="dom-num">D${w.domain}</span>
        <span class="dom-name">${shortName}</span>
        <div class="dom-bar"><div class="dom-fill ${progressClass(pct)}" style="width:${pct}%"></div></div>
        <span class="dom-pct ${scoreClass(pct)}">${pct}%</span>
      </div>`;
    }
    html += `</div><div style="margin-top:1rem;text-align:center">
      <button class="btn btn-primary" data-action="weak">${ICONS.weak} START WEAK SPOT QUIZ</button>
    </div></div>`;
  }

  // All domains breakdown
  html += `<div class="panel"><div class="panel-head">
    <div class="panel-title">${ICONS.bar} ALL DOMAINS</div>
    <div class="panel-meta">FULL BREAKDOWN</div>
  </div><div class="dom-list">`;
  for (let i = 1; i <= 5; i++) {
    const s = state.scores[i] || {c:0,t:0};
    const p = scorePct(s);
    const shortName = DOMAINS[i].name.replace('Networking ','').replace('Network ','');
    html += `<div class="dom-row">
      <span class="dom-num">D${i}</span>
      <span class="dom-name">${shortName}</span>
      <div class="dom-bar"><div class="dom-fill ${progressClass(p)}" style="width:${s.t > 0 ? Math.max(p,2) : 0}%"></div></div>
      <span class="dom-pct ${s.t > 0 ? scoreClass(p) : 'muted'}">${s.t > 0 ? p+'%' : '—'}</span>
    </div>`;
  }
  html += `</div></div>`;

  // Exam history
  if (state.exam && state.exam.finished) {
    const r = state.exam.results;
    html += `<div class="panel"><div class="panel-head">
      <div class="panel-title">${ICONS.exam} LAST PRACTICE EXAM</div>
      <div class="panel-meta">${r.pct >= PASS_THRESHOLD ? 'PASSED' : 'NEEDS WORK'}</div>
    </div>
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-value ${r.pct >= PASS_THRESHOLD ? '' : ''}" style="color:${r.pct >= PASS_THRESHOLD ? 'var(--success)' : 'var(--danger)'};text-shadow:0 0 8px ${r.pct >= PASS_THRESHOLD ? 'rgba(95,168,140,0.5)' : 'rgba(155,95,114,0.5)'}">${r.pct}%</div>
        <div class="metric-label">EXAM SCORE</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${r.correct}/${r.total}</div>
        <div class="metric-label">CORRECT</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${Math.floor(r.durationMs/60000)}m</div>
        <div class="metric-label">DURATION</div>
      </div>
    </div></div>`;
  }
  return html;
}
