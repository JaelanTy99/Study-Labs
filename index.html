{id:"r16",domain:1,title:"Advanced Subnetting & VLSM (Worked Examples)",tags:["subnetting","vlsm","cidr","wildcard","supernet","math"],content:"<p>Speed and accuracy with subnetting separate passing scores from failing ones. Memorize the block-size table: /25 = 128, /26 = 64, /27 = 32, /28 = 16, /29 = 8, /30 = 4. The block size is 256 minus the value of the 'interesting' octet in the mask. To find which subnet an address belongs to, find the largest multiple of the block size that is less than or equal to the address in the interesting octet. Example: 172.16.77.45/20. A /20 mask is 255.255.240.0 (block size 16 in the third octet). Multiples of 16: 64, 80. Since 77 falls between 64 and 79, the network is 172.16.64.0, broadcast 172.16.79.255, usable .65 through .78 in that octet's range — 4,094 usable hosts total.</p><p>VLSM (Variable-Length Subnet Masking) means using different mask lengths within the same address space to right-size each subnet and avoid waste. Always allocate from largest requirement to smallest. Example: from 192.168.1.0/24, a LAN needing 100 hosts takes a /25 (126 usable: .0–.127). A second LAN needing 50 hosts takes the next available /26 (.128–.191, 62 usable). A point-to-point link takes a /30 (.192–.195, 2 usable). Allocating small subnets first would fragment the space and strand larger blocks.</p><p>Wildcard masks (used in ACLs and OSPF) are the bitwise inverse of a subnet mask. A /24 (255.255.255.0) becomes wildcard 0.0.0.255. A 0 bit means 'must match exactly'; a 1 bit means 'don't care.' So 'permit 10.20.0.0 0.0.255.255' matches all of 10.20.0.0/16. For the exam, practice converting between prefix length, dotted-decimal mask, and wildcard mask instantly, and be ready to compute network, first host, last host, and broadcast for any prefix.</p>"},
{id:"r17",domain:1,title:"IPv6 In Depth",tags:["ipv6","slaac","dhcpv6","link-local","dual stack","eui-64","nd"],content:"<p>IPv6 uses 128-bit addresses written as eight hextets of four hex digits, separated by colons. Two compression rules apply: leading zeros in a hextet may be dropped (2001:0db8 → 2001:db8), and one run of consecutive all-zero hextets may be replaced with '::' a single time per address. So 2001:0db8:0000:0000:0000:0000:0000:0001 becomes 2001:db8::1. Knowing how to expand and compress addresses is commonly tested.</p><p>Key address types: Global unicast (typically 2000::/3) are internet-routable. Unique local (fc00::/7, in practice fd00::/8) are the IPv6 equivalent of RFC1918 private space. Link-local (fe80::/10) are auto-assigned to every interface and used for neighbor discovery and next-hop addressing — they are never routed off the link. Multicast (ff00::/8) replaces IPv4 broadcast; for example ff02::1 is all-nodes and ff02::2 is all-routers on the link. There is no broadcast in IPv6.</p><p>Address assignment can be stateless (SLAAC), where the host learns the /64 prefix from a Router Advertisement and builds its own interface ID using EUI-64 or a random value, or stateful (DHCPv6), where a server assigns full addresses and options. Neighbor Discovery Protocol (NDP) uses ICMPv6 messages — Router Solicitation/Advertisement and Neighbor Solicitation/Advertisement — to replace ARP and router discovery. Most organizations run dual stack (IPv4 and IPv6 simultaneously) during migration; transition tools include tunneling (6to4, Teredo) and translation (NAT64/DNS64).</p>"},
{id:"r18",domain:2,title:"Wireless Standards & RF Fundamentals",tags:["wifi","802.11","2.4ghz","5ghz","6ghz","channels","mimo","interference"],content:"<p>The 802.11 family has evolved through several generations. 802.11b/g operate at 2.4 GHz; 802.11a at 5 GHz; 802.11n (Wi-Fi 4) added MIMO and works in both bands; 802.11ac (Wi-Fi 5) is 5 GHz only with wider channels and MU-MIMO; 802.11ax (Wi-Fi 6, and Wi-Fi 6E when extended into 6 GHz) adds OFDMA, improved efficiency in dense environments, and target wake time. Higher throughput generally comes from wider channels, more spatial streams (MIMO), and higher-order modulation.</p><p>Band trade-offs matter for design. The 2.4 GHz band has longer range and better wall penetration but only three non-overlapping 20 MHz channels in the US (1, 6, 11) and heavy interference from microwaves, Bluetooth, and cordless phones. The 5 GHz band offers many more non-overlapping channels and less interference but shorter range; some channels require DFS (Dynamic Frequency Selection) to avoid radar. The 6 GHz band (Wi-Fi 6E/7) adds a large block of clean spectrum but the shortest range. In dense deployments, plan a channel reuse pattern, keep channel widths conservative on 2.4 GHz, and tune transmit power to limit co-channel interference.</p><p>Common RF concepts and problems: attenuation (signal loss over distance/obstacles), absorption (walls, water, people), reflection/multipath, and interference (co-channel from same-channel APs, adjacent-channel from overlapping channels). Tools include a Wi-Fi analyzer for channel utilization and a site survey/heat map for coverage planning. SNR (signal-to-noise ratio) and RSSI are the metrics to watch — low SNR causes retransmissions and slow throughput even with a 'full bars' RSSI reading."},
{id:"r19",domain:2,title:"Spanning Tree Protocol Deep Dive",tags:["stp","rstp","root bridge","bpdu","portfast","bpdu guard","loop"],content:"<p>Spanning Tree Protocol (802.1D) prevents Layer 2 loops in networks with redundant switch links. Without it, broadcasts circulate endlessly, creating a broadcast storm, MAC table instability, and multiple frame copies — symptoms that look like a total outage with near-100% link utilization. STP logically blocks redundant paths while keeping them ready as backups.</p><p>The process: first, switches elect a root bridge — the switch with the lowest bridge ID (a 2-byte priority plus its MAC address). Lower priority wins; the MAC breaks ties. Administrators set a low priority on the desired root (often a core switch) rather than leaving it to MAC luck. Each non-root switch then selects one root port (its lowest-cost path toward the root). Each segment elects one designated port. Remaining ports are placed in a blocking state. Classic STP port states are Blocking → Listening → Learning → Forwarding, taking 30–50 seconds to converge.</p><p>Rapid STP (802.1w) converges in seconds using port roles (root, designated, alternate, backup) and proposal/agreement handshakes; it is backward compatible and now the default on most switches. Edge features harden the design: PortFast moves an access port directly to forwarding (use only on host ports), BPDU Guard shuts a PortFast port if it receives a BPDU (catching a rogue switch), and Root Guard prevents an unexpected switch from becoming root. For the exam, know how the root is elected, the port roles/states, the symptoms of a missing STP, and what PortFast/BPDU Guard do."},
{id:"r20",domain:2,title:"High Availability & First-Hop Redundancy",tags:["hsrp","vrrp","glbp","redundancy","failover","nic teaming","ha"],content:"<p>High availability removes single points of failure so the network keeps working through component failures. At the gateway, first-hop redundancy protocols (FHRPs) let two or more routers present a single virtual IP and virtual MAC that hosts use as their default gateway. If the active router fails, a standby takes over the virtual address transparently — no client reconfiguration. HSRP (Cisco) uses active/standby with one forwarding router; VRRP is the open-standard equivalent (master/backup); GLBP additionally load-balances across multiple forwarding routers.</p><p>Redundancy applies at every layer. Link level: LACP/EtherChannel bundles multiple physical links so traffic continues if one fails, while also adding bandwidth. Switch level: redundant uplinks protected by RSTP, or stacking/MLAG so two switches act as one. Server/NIC level: NIC teaming (bonding) provides link failover and aggregation for hosts. Power: dual power supplies and UPS/generator. Path level: dynamic routing (OSPF/EIGRP) reroutes around failed links automatically.</p><p>Design metrics tie back to operations: redundancy improves availability (more 'nines'), reduces MTTR by enabling failover instead of repair-before-recovery, and supports SLA commitments. Beware of introducing loops when adding redundant Layer 2 paths — that is exactly what STP exists to manage. For the exam, recognize which protocol solves which single point of failure: FHRP for the gateway, LACP for links, RSTP for switch loops, dynamic routing for paths."},
{id:"r21",domain:4,title:"VPNs & IPsec",tags:["vpn","ipsec","ike","tunnel","site-to-site","remote access","ssl","split tunnel"],content:"<p>A VPN creates an encrypted tunnel across an untrusted network (usually the Internet), protecting confidentiality and integrity in transit. Two deployment models dominate. Site-to-site VPNs connect entire networks — for example, two branch offices — with the tunnel terminating on firewalls or routers; users are unaware it exists. Client-to-site (remote access) VPNs let individual roaming devices connect back to the corporate network using client software, ideal for work-from-anywhere employees.</p><p>IPsec is the most common framework for VPNs. It has two modes: transport mode encrypts only the payload (used host-to-host), while tunnel mode encrypts the entire original packet and adds a new header (used for site-to-site gateways). IPsec uses IKE (Internet Key Exchange) to authenticate peers and negotiate keys in two phases, then protects traffic with AH (integrity/authentication only) or, far more commonly, ESP (encryption plus integrity). Know that IPsec relies on UDP 500 for IKE and either ESP (protocol 50) directly or UDP 4500 when NAT traversal is required.</p><p>SSL/TLS VPNs (often clientless, via a browser) are an alternative that traverses firewalls easily on TCP 443 and is popular for remote access to specific applications. A key design decision is split tunneling versus full tunneling: with split tunneling only corporate-bound traffic enters the tunnel (better performance, less inspection), while full tunneling forces all traffic through the corporate gateway (more control and security). For the exam, match the VPN type to the scenario and remember IPsec's modes, components, and ports."},
{id:"r22",domain:1,title:"Cloud, Virtualization, SDN & SD-WAN",tags:["cloud","iaas","paas","saas","sdn","sd-wan","virtualization","nfv"],content:"<p>Cloud service models define who manages what. IaaS (Infrastructure as a Service) provides virtual compute, storage, and networking — you manage the OS and apps. PaaS (Platform as a Service) provides a managed runtime/platform — you manage only your application and data. SaaS (Software as a Service) delivers complete applications over the web — the provider manages almost everything. Deployment models include public, private, hybrid, and community clouds. Connectivity to the cloud may use the Internet, a VPN, or a dedicated private circuit (direct connect) for predictable performance.</p><p>Virtualization underpins both data centers and cloud. A hypervisor runs multiple virtual machines on one physical host; Type 1 (bare-metal) hypervisors run directly on hardware for production, while Type 2 run atop a host OS. Virtual switches connect VMs to the physical network, and concepts like VXLAN extend Layer 2 segments across Layer 3 fabrics, enabling large multi-tenant environments beyond the 4,094 VLAN limit.</p><p>Software-defined networking (SDN) separates the control plane (decisions) from the data plane (forwarding), centralizing intelligence in a controller that programs devices via APIs — enabling network-wide policy from one place. SD-WAN applies these ideas to the WAN: it abstracts multiple transports (MPLS, broadband, LTE) and uses application-aware policy from a central controller to steer each flow over the best path, improving cost, performance, and resilience versus traditional single-transport WANs. NFV (Network Function Virtualization) runs functions like firewalls and load balancers as software instances rather than dedicated appliances."},
{id:"r23",domain:4,title:"AAA, 802.1X, RADIUS & TACACS+",tags:["aaa","802.1x","radius","tacacs","authentication","authorization","accounting","nac"],content:"<p>AAA stands for Authentication (proving identity), Authorization (what you're allowed to do), and Accounting (recording what you did). Centralizing AAA means credentials and policy live on a server rather than on each device, improving security and auditability. Two protocols dominate. RADIUS (UDP 1812/1813, originally 1645/1646) is widely used for network access — Wi-Fi, VPN, and 802.1X — and combines authentication with authorization while encrypting only the password. TACACS+ (TCP 49) is favored for device administration because it separates the three AAA functions and encrypts the entire payload, enabling granular per-command authorization and accounting.</p><p>802.1X is port-based network access control with three roles: the supplicant (the device/software requesting access), the authenticator (the switch or AP that gates the port), and the authentication server (typically RADIUS). Until the supplicant authenticates — often via EAP methods such as EAP-TLS using certificates or PEAP using credentials — the port allows only authentication traffic. After success, the server can return a VLAN or policy to apply dynamically. This stops unauthorized devices from simply plugging in.</p><p>Network Access Control (NAC) builds on this by adding posture assessment: before granting access, it checks endpoint health (OS patch level, antivirus status, configuration) and can quarantine or remediate non-compliant devices. For the exam, be ready to choose RADIUS vs TACACS+ for a scenario (network access vs device admin), identify the 802.1X roles, and recognize NAC posture checks."},
{id:"r24",domain:3,title:"DNS In Depth & DNS Security",tags:["dns","records","recursion","caching","dnssec","ttl","forward","reverse"],content:"<p>DNS resolves names to addresses through a hierarchy: a client asks its recursive resolver, which queries root servers, then TLD servers (.com), then the domain's authoritative servers, caching each answer for its TTL (time to live). Understanding record types is essential. A maps a name to an IPv4 address; AAAA to IPv6. CNAME is an alias pointing one name to another canonical name. MX designates mail servers (with priority values). NS lists a zone's authoritative name servers. PTR provides reverse lookups (IP to name) and lives in a special reverse zone. SOA holds zone authority and timers. TXT stores arbitrary text, widely used for email authentication (SPF, DKIM, DMARC) and domain ownership verification.</p><p>Forward lookups (name to IP) are the common case; reverse lookups (IP to name via PTR) matter for mail server reputation and logging. TTL governs caching: long TTLs reduce query load but slow propagation of changes, so administrators often lower TTLs before a planned migration. Internal (split-horizon) DNS can return different answers to internal versus external clients for the same name.</p><p>DNS is a frequent attack target and troubleshooting source. DNS cache poisoning/spoofing inserts forged records to redirect users; DNSSEC mitigates this by cryptographically signing records so resolvers can validate authenticity (it provides integrity/authentication, not confidentiality). Operationally, 'ping by IP works but by name fails' is the classic sign of a DNS problem — verify with nslookup or dig against a specific server, check the configured resolver, and flush the local cache if stale entries are suspected."},
{id:"r25",domain:2,title:"Cabling, Connectors & Transceivers",tags:["cabling","cat6","fiber","sfp","qsfp","singlemode","multimode","standards","poe"],content:"<p>Copper twisted-pair categories define supported speed and distance, all capped at 100 meters: Cat5e (1 Gbps), Cat6 (1 Gbps to 100 m, 10 Gbps to ~55 m), Cat6a (10 Gbps to 100 m), and Cat7/Cat8 for higher-frequency/data-center use. Shielding (UTP vs STP/F/UTP) reduces electromagnetic interference in noisy environments. Beyond 100 m, or where EMI or electrical isolation matters, fiber is required. Plenum-rated cable is mandatory in air-handling spaces because of its fire/smoke characteristics.</p><p>Fiber comes in two families. Multimode (larger core, LED/VCSEL source, OM3/OM4/OM5) is cheaper and used for shorter runs — typically within a building or data center, up to a few hundred meters at 10–100 Gbps. Single-mode (small core, laser source, OS1/OS2) supports much longer distances — many kilometers — and higher speeds, used for campus backbones and carrier links. Common connectors include LC (small form factor, most common today), SC, and ST; copper uses RJ-45.</p><p>Transceivers are pluggable optics that match a port to a media type and distance: SFP (1 Gbps), SFP+ (10 Gbps), SFP28 (25 Gbps), QSFP+ (40 Gbps), and QSFP28 (100 Gbps). Choosing the right transceiver and matching fiber type (and wavelength) on both ends is essential — a multimode optic will not interoperate with single-mode fiber. Termination standards T568A/T568B define pin-outs; mixing them end-to-end yields a crossover. Always verify category, distance, connector, and optic type when planning or troubleshooting a physical link."},
{id:"r26",domain:3,title:"Quality of Service (QoS)",tags:["qos","dscp","cos","queuing","shaping","policing","jitter","latency"],content:"<p>QoS lets the network prioritize traffic so latency-sensitive applications perform well even under congestion. It matters most for real-time flows — VoIP and video conferencing — which are intolerant of delay (latency), variation in delay (jitter), and loss. The first step is classification and marking: traffic is identified (by port, application, or DSCP value) and tagged so downstream devices treat it consistently. Layer 3 marking uses DSCP in the IP header (for example, EF — Expedited Forwarding — for voice); Layer 2 marking uses CoS (802.1p) in the VLAN tag.</p><p>Once marked, devices apply policies. Queuing schemes such as priority queuing or low-latency queuing service high-priority traffic first; weighted fair queuing shares bandwidth proportionally. Congestion management decides what to drop when buffers fill (e.g., WRED drops lower-priority traffic earlier). Traffic shaping buffers and smooths bursts to a target rate (delaying rather than dropping), while traffic policing enforces a hard rate and drops or remarks excess immediately. Shaping suits outbound smoothing toward a slower WAN; policing suits enforcing a contracted rate.</p><p>A practical example: a branch with a congested WAN suffers choppy calls. Marking voice as DSCP EF, placing it in a priority queue, and shaping bulk traffic ensures voice is served first and bursts don't starve it — without buying more bandwidth. For the exam, connect symptoms (jitter, choppy voice) to the right tool (classification/marking plus prioritized queuing), and distinguish shaping (buffers/delays) from policing (drops/remarks)."},
{id:"r27",domain:5,title:"Structured Troubleshooting: Symptoms to Causes",tags:["troubleshooting","duplex","mtu","crc","loop","apipa","gateway","tools"],content:"<p>Effective troubleshooting pairs the CompTIA methodology with pattern recognition. Work the layers from the bottom up unless evidence says otherwise, because physical issues are common and cheap to rule out. Build a mental map from symptom to likely cause: 'ping by IP works, by name fails' → DNS; 'works on own subnet, nothing beyond' → default gateway; address in 169.254.x.x → APIPA, meaning no DHCP reachable; intermittent connectivity with an OS 'IP conflict' message → duplicate/overlapping address.</p><p>Physical-layer signatures are distinctive. Rising CRC and input errors point to a bad cable, EMI, a dirty fiber connector, or a failing transceiver. Late collisions and runts on a good cable indicate a speed/duplex mismatch. A gigabit-capable port negotiating only 100 Mbps (≈94 Mbps throughput) usually means a low-category or damaged cable, a 100 Mbps NIC, or a forced-speed mismatch. Large transfers stalling while small ones succeed — especially across a VPN — signals an MTU/fragmentation problem; lower the MTU/MSS. A cabling change that triggers near-100% utilization everywhere is a switching loop/broadcast storm caused by missing or disabled STP.</p><p>Match the tool to the question. Use ping for reachability, traceroute/tracert for path and where it breaks (remembering that '* * *' often just means a hop filters ICMP), nslookup/dig to test a specific DNS server, ipconfig/ip addr to verify addressing, arp -a for IP-to-MAC mappings, and a cable tester or TDR for physical faults and distance-to-break. After fixing anything, verify full functionality and document — confirming you didn't introduce a new problem and leaving a record for next time.</p>"}
,
{id:"r28",domain:3,title:"Change & Configuration Management",tags:["change management","configuration","baseline","rollback","documentation","approval"],content:"<p>Change management is the disciplined process for making network changes without causing avoidable outages. A formal change request captures what is changing, why, who is affected, and the risk level. It moves through review and approval (often a Change Advisory Board for higher-risk work), gets scheduled into a maintenance window to limit user impact, and is only then implemented. The two elements that matter most operationally are a clear implementation plan and a documented rollback (backout) plan so the team can return to the last known-good state quickly if the change fails.</p><p>Configuration management keeps the actual device state consistent and recoverable. Maintain a configuration baseline (the approved standard build) and store known-good configuration backups so any device can be restored or replaced from a template. Version control and automated config backups let you diff current against baseline to catch unauthorized or drifted changes. This is also how you enforce standardization across dozens or hundreds of devices.</p><p>Supporting documentation ties it together: physical and logical network diagrams, an IP address plan (IPAM), asset inventories, and rack/port mappings. When a change goes wrong at 2 a.m., accurate diagrams and a tested rollback plan are what separate a five-minute recovery from an all-night outage. For the exam, know the order of a change process, the purpose of a backout plan, and why baselines and config backups are essential."},
{id:"r29",domain:3,title:"Disaster Recovery, RPO & RTO",tags:["disaster recovery","backup","rpo","rto","high availability","redundancy","site"],content:"<p>Business continuity and disaster recovery (DR) planning define how the organization keeps running through failures ranging from a dead switch to a lost data center. Two metrics anchor every DR plan. RPO (Recovery Point Objective) is the maximum acceptable data loss, measured in time — an RPO of one hour means backups/replication must be no more than an hour apart. RTO (Recovery Time Objective) is the maximum acceptable downtime — how fast service must be restored. Tighter RPO/RTO cost more (more frequent replication, warmer standby sites).</p><p>Backup strategy supports the RPO. A full backup copies everything; incremental backups copy only what changed since the last backup (fast to create, slower to restore — you need the full plus every increment); differential backups copy everything changed since the last full (larger each day, but restore needs only the full plus the latest differential). The classic 3-2-1 rule — three copies, on two media types, one off-site — protects against site-level loss. Always test restores; an untested backup is a hope, not a plan.</p><p>Recovery-site options trade cost against speed: a hot site is fully running and can take over almost immediately (lowest RTO, highest cost); a warm site has equipment and data staged but needs setup; a cold site is just space and power (cheapest, slowest). High-availability designs — redundant power, links, FHRP gateways, clustered servers — reduce the chance you ever invoke DR. For the exam, be able to match a stated tolerance for data loss and downtime to the right RPO/RTO, backup type, and site tier."},
{id:"r30",domain:4,title:"Authentication, Authorization & Access Control",tags:["aaa","802.1x","radius","tacacs","nac","mfa","least privilege","rbac"],content:"<p>AAA — Authentication, Authorization, and Accounting — is the framework behind controlled network access. Authentication proves identity (something you know/have/are; multifactor combines categories). Authorization determines what an authenticated identity may do. Accounting logs what was done, for auditing and forensics. Two protocols implement AAA for network devices: RADIUS (open standard, UDP, encrypts only the password, commonly used for network/user access) and TACACS+ (Cisco-originated, TCP, encrypts the entire payload, separates AAA functions — favored for administrative device access with granular command authorization).</p><p>Port-based access uses 802.1X: the supplicant (client) authenticates through the authenticator (switch/AP) to an authentication server (RADIUS) before the port is opened. Network Access Control (NAC) extends this with posture checks — verifying patch level, antivirus, or certificate status — and can quarantine noncompliant devices onto a remediation VLAN. This is how organizations keep unmanaged or unhealthy devices off the production network.</p><p>Access-control models shape authorization. RBAC (role-based) grants permissions by job role — the practical default in most enterprises. Least privilege gives each identity only the access it needs, and separation of duties splits sensitive tasks across people to prevent abuse. These map directly to your IAM work: provisioning by role, removing orphaned accounts, and pruning privilege creep. For the exam, contrast RADIUS vs TACACS+, know the 802.1X roles, and recognize NAC's posture/quarantine function."},
{id:"r31",domain:4,title:"Network Hardening & Physical Security",tags:["hardening","port security","physical security","patching","default credentials","segmentation"],content:"<p>Hardening reduces a device's attack surface before an attacker ever probes it. Core steps: change default credentials immediately, disable unused services and ports, use secure management protocols (SSH not Telnet, HTTPS not HTTP, SNMPv3 not v1/v2c), apply firmware/patches on a schedule, and restrict management access to a dedicated management VLAN or out-of-band network with ACLs. Every one of these closes a common, well-known avenue of compromise.</p><p>Switch-port protections defend Layer 2. Port security limits which and how many MAC addresses a port accepts, stopping MAC flooding and unauthorized devices. DHCP snooping blocks rogue DHCP servers on untrusted ports; Dynamic ARP Inspection uses the snooping table to stop ARP spoofing; BPDU Guard shuts a PortFast edge port that unexpectedly receives BPDUs (a rogue switch). Disabling unused ports and placing them in an unused VLAN removes easy footholds. Segmentation (VLANs, and micro-segmentation in zero-trust designs) contains any breach to a small blast radius.</p><p>Physical security is the foundation — if someone can touch the hardware, most logical controls can be bypassed. Lock wiring closets and data centers, use badge access with logging, deploy cameras, secure console ports, and control for tailgating. Environmental controls (HVAC, fire suppression, UPS/generator) protect availability. For the exam, connect a hardening requirement to the specific control that satisfies it, and remember that changing defaults, patching, and disabling the unused are the highest-value first moves."},
{id:"r32",domain:5,title:"Wireless Troubleshooting",tags:["wireless","wifi","rssi","snr","interference","roaming","channel","dfs"],content:"<p>Wireless problems usually trace to RF conditions, not the client. Distinguish the key metrics: RSSI measures received signal strength (how strong), while SNR measures signal relative to the noise floor (how usable). A client can show strong RSSI yet perform terribly if the SNR is low because of interference — the classic 'full bars, slow speeds' complaint near microwaves, motors, or dense neighboring APs. Fixing throughput often means reducing noise or moving the client to a cleaner band/channel, not boosting power (which can worsen co-channel interference).</p><p>Channel and band planning prevents self-interference. In 2.4 GHz, only channels 1, 6, and 11 are non-overlapping — anything else causes adjacent-channel interference. The 5 GHz band offers many more clean channels but shorter range; some require DFS and will briefly change channels if radar is detected. Overlapping cells on the same channel cause co-channel interference and airtime contention. A site survey / heat map validates coverage and channel reuse; a Wi-Fi analyzer shows channel utilization and rogue APs.</p><p>Other recurring issues: sticky clients that won't roam to a closer AP (tune roaming thresholds), coverage holes and dead spots (attenuation from walls, distance), band steering pushing capable clients to 5 GHz, and authentication failures (wrong PSK, expired certificate, or a RADIUS/NPS problem for enterprise Wi-Fi). Mismatched security settings and captive-portal quirks also break association. For the exam, tie the symptom to the cause — low SNR to interference, poor roaming to thresholds, and 'works on 5 GHz but not 2.4' to band-specific interference or channel overlap."}
];

const SEC_QUESTIONS = [
{id:"s1_01",domain:1,question:"An organization posts signage at every entrance stating that the premises are monitored and that trespassers will be prosecuted. How should this control be classified?",options:{A:"Physical category, deterrent type",B:"Operational category, detective type",C:"Physical category, preventive type",D:"Managerial category, directive type"},answer:"A",lead:"Categories describe HOW a control is implemented: technical, managerial, operational, or physical. Types describe WHAT it does: preventive, deterrent, detective, corrective, compensating, or directive. Signage is a physical object, and its purpose is to discourage an attacker from attempting the act — the definition of a deterrent.",why:{B:"Misclassifies both the category and the function, since a sign detects nothing.",C:"Would require the sign to physically stop entry, which it cannot.",D:"Would apply to a written policy instructing personnel how to behave."}},
{id:"s1_02",domain:1,question:"A legacy manufacturing system cannot support multifactor authentication, which the security policy requires. Management approves isolating the system on a dedicated network segment with strict ACLs and enhanced session logging. How is this arrangement BEST described?",options:{A:"A directive control",B:"A compensating control",C:"A corrective control",D:"An accepted risk with no control applied"},answer:"B",lead:"A compensating control is an alternative measure deployed when the required primary control cannot be implemented, providing a comparable level of protection. Segmentation, restrictive ACLs, and enhanced logging together substitute for the missing authentication strength.",why:{A:"Instructs people what to do, such as a policy statement.",C:"Acts after an incident to restore normal operation, such as a restore from backup.",D:"Is inaccurate because substantial controls were in fact applied."}},
{id:"s1_03",domain:1,question:"In a zero trust architecture, a request arrives for access to a protected resource. Which component evaluates policy and renders the access decision, and which component enforces it at the resource?",options:{A:"The implicit trust zone decides; the subject enforces",B:"The policy administrator decides; the policy engine enforces",C:"The policy engine decides; the policy enforcement point enforces",D:"The policy enforcement point decides; the policy administrator enforces"},answer:"C",lead:"In the NIST model the policy engine evaluates identity, device posture, and context against policy and produces the grant or deny decision. The policy administrator then establishes or terminates the session by instructing the policy enforcement point, which is the component in the data plane that actually allows or blocks the connection to the resource.",why:{A:"Confuses architectural zones with decision-making components; a subject is the requesting user or system.",B:"B and D swap the roles of these components.",D:"B and D swap the roles of these components."}},
{id:"s1_04",domain:1,question:"A security team places specially crafted fake credentials in a database and configures an alert to fire if those credentials are ever used anywhere in the environment. What is this technique called?",options:{A:"Data masking",B:"A honeynet",C:"Steganography",D:"A honeytoken"},answer:"D",lead:"A honeytoken is a piece of fabricated data — credentials, an account, a record, a file — that has no legitimate use. Any interaction with it is inherently suspicious, so it produces a very high-fidelity alert and can also reveal that a specific data set was exfiltrated.",why:{A:"Replaces sensitive values with realistic but non-sensitive substitutes so real data is not exposed in non-production use.",B:"Is an entire decoy network of systems.",C:"Conceals data inside other data such as an image."}},
{id:"s1_05",domain:1,question:"A developer must send a file to a partner such that the partner can confirm the file came from the developer and was not altered, but the file itself does not need to be kept secret. Which cryptographic operation should the developer perform, and with which key?",options:{A:"Create a digital signature using the developer's private key",B:"Encrypt the file using the partner's public key",C:"Create a digital signature using the partner's public key",D:"Encrypt the file using the developer's public key"},answer:"A",lead:"A digital signature is produced by hashing the message and encrypting that hash with the SIGNER's private key. Anyone holding the developer's public key can verify it, which establishes integrity, authentication of origin, and non-repudiation. Confidentiality is not provided, which the scenario says is unnecessary.",why:{B:"Provides confidentiality but no proof of origin, since anyone can obtain the partner's public key.",C:"Is impossible, because signing requires a private key.",D:"Would let anyone with the developer's public key decrypt it, providing no security property at all."}},
{id:"s1_06",domain:1,question:"A password database stores hashes generated with a unique random value appended to each password before hashing. Which attack does this specifically defeat, and why?",options:{A:"Credential stuffing, because reused passwords from other breaches will not match",B:"Precomputed rainbow table attacks, because identical passwords produce different hashes",C:"Brute force attacks, because the hash cannot be computed without the original password",D:"On-path attacks, because the salt encrypts the password in transit"},answer:"B",lead:"Salting adds a unique random value per password, so two users with the same password produce completely different hashes. That destroys the economics of precomputed tables, since an attacker would need a separate table for every possible salt rather than one universal table.",why:{A:"Is wrong because if an attacker knows the plaintext, the salt does not prevent a match.",C:"Is wrong because salting does not stop brute force; key stretching with a high work factor is what raises that cost.",D:"Is wrong because salting is not encryption and provides no transit protection."}},
{id:"s1_07",domain:1,question:"An application team must protect stored passwords against offline cracking on modern GPU hardware. Which approach is MOST appropriate?",options:{A:"SHA-256 hashing applied twice to each password",B:"A truncated MD5 hash to reduce the storage footprint",C:"A key stretching algorithm such as bcrypt or Argon2 with a tuned work factor",D:"AES-256 encryption of the password with a key stored in the application config"},answer:"C",lead:"Key stretching algorithms are deliberately slow and memory-hard, and their cost factor can be raised as hardware improves. Argon2 in particular resists GPU and ASIC parallelization by requiring substantial memory per guess, dramatically reducing an attacker's guessing rate.",why:{A:"Uses a fast general-purpose hash designed for speed, which is exactly wrong for passwords — billions of guesses per second remain feasible.",B:"Is worse still, since MD5 is broken and truncation reduces the search space.",D:"Makes passwords recoverable and places the key alongside the data."}},
{id:"s1_08",domain:1,question:"An organization needs a device that generates, stores, and performs operations with cryptographic keys for thousands of servers, is tamper-resistant, and is validated to FIPS 140-2 Level 3. Which technology should be selected?",options:{A:"A secure enclave in the CPU",B:"A software-based key vault on a hardened server",C:"A Trusted Platform Module",D:"A hardware security module"},answer:"D",lead:"An HSM is a dedicated, tamper-resistant appliance built for high-volume cryptographic operations and centralized key management across many systems. Keys are generated inside it and never leave in plaintext, and models are certified to FIPS 140-2 Level 3.",why:{A:"Isolates sensitive computation inside one processor and is likewise per-device.",B:"Lacks the tamper-resistant hardware boundary and the certification.",C:"C (TPM) is a chip bound to a single motherboard, protecting that one device's keys — typical use is full disk encryption."}},
{id:"s1_09",domain:1,question:"A payment application must retain the ability to look up a customer's prior transactions while ensuring that no primary account number is stored in the application database. Which technique meets both requirements?",options:{A:"Tokenization, replacing the account number with a surrogate value mapped in a separate vault",B:"Hashing the account number with a salted SHA-256 digest",C:"Full-disk encryption of the database server's storage volume",D:"Data masking, replacing all but the last four digits in the stored record"},answer:"A",lead:"Tokenization substitutes a non-sensitive surrogate value for the real account number. The mapping lives in a hardened token vault outside the application, so the application database contains no cardholder data at all while still being able to reference the same customer consistently across transactions.",why:{B:"Is irreversible, so prior transactions could be matched but never used for legitimate operations such as refunds.",C:"Protects only against physical theft of the drive and leaves data readable to the running application and to anyone with database access.",D:"Alters the stored value permanently, and the retained digits are still cardholder data under most standards."}},
{id:"s1_10",domain:1,question:"A public web server presents a certificate that a browser rejects with a name mismatch error. The certificate's common name is www.example.com and the site is reached at shop.example.com. Which TWO certificate options would resolve this? (Select TWO)",options:{A:"An extended validation certificate for www.example.com",B:"A SAN certificate listing both www.example.com and shop.example.com",C:"A self-signed certificate generated on the web server",D:"A shorter certificate validity period",E:"A wildcard certificate issued for *.example.com"},answer:["B", "E"],lead:"A wildcard certificate for *.example.com is valid for any single-label subdomain, including shop.example.com. A Subject Alternative Name certificate explicitly lists multiple names, and browsers validate against the SAN entries. Either resolves the mismatch.",why:{A:"Changes the validation level, not the names covered.",C:"Does not address the name at all and adds a trust error on top of the mismatch.",D:"Affects lifetime and has no bearing on which hostnames are valid."}},
{id:"s1_11",domain:1,question:"A CA operator keeps the root certificate authority powered off and physically secured in a safe, issuing certificates only through subordinate CAs. What is the PRIMARY reason for this design?",options:{A:"Offline roots issue certificates faster because they have no network overhead",B:"Compromise of the root would invalidate every certificate in the hierarchy, and a root cannot be revoked easily",C:"An offline root eliminates the need for a certificate revocation list",D:"Regulations require that root CAs be air-gapped in all industries"},answer:"B",lead:"The root is the anchor of trust for the entire PKI. If its private key were stolen, an attacker could issue certificates for anything and every certificate beneath it would have to be replaced — a catastrophic event with no clean recovery. Keeping the root offline and using intermediates means a compromised intermediate can simply be revoked by the root.",why:{A:"Is false, since an offline root issues nothing routinely.",C:"Is false, as revocation infrastructure is still required for the intermediates and end-entity certificates.",D:"Overstates the requirement, which is best practice rather than universal law."}},
{id:"s1_12",domain:1,question:"A browser validating a certificate must determine whether it has been revoked, without contacting a third party on every connection and without downloading a large list. Which mechanism accomplishes this?",options:{A:"A certificate revocation list downloaded by the client at each connection",B:"A shortened certificate validity period",C:"OCSP stapling, where the server presents a recent CA-signed status response during the handshake",D:"Certificate pinning configured in the browser"},answer:"C",lead:"With OCSP stapling the web server periodically queries the CA's responder itself and attaches the signed, timestamped status to the TLS handshake. The client gets authoritative revocation information with no extra round trip and without disclosing its browsing to the CA, which is the privacy weakness of direct OCSP.",why:{A:"Is the mechanism the question rules out — CRLs grow large and scale poorly.",B:"Reduces the exposure window but is not a revocation check.",D:"Prevents acceptance of an unexpected certificate but says nothing about revocation."}},
{id:"s1_13",domain:1,question:"An organization must ensure that encrypted data on employee laptops remains recoverable if an employee leaves abruptly, while preventing any single administrator from unilaterally decrypting a user's drive. Which combination BEST achieves this?",options:{A:"Requiring users to email their recovery key to the help desk at enrollment",B:"Disabling encryption on laptops assigned to departing employees",C:"Storing recovery keys in a shared administrator spreadsheet on a protected file server",D:"Key escrow with split knowledge requiring two custodians to reconstruct the recovery key"},answer:"D",lead:"Key escrow places a recovery key with a trusted party so data survives the loss of a user. Adding split knowledge or dual control means the key is divided so that no single custodian can act alone, which addresses the insider risk the scenario raises.",why:{A:"Transmits and stores keys insecurely and gives the help desk unilateral access.",B:"Abandons the protection entirely and does not help with an abrupt departure.",C:"Creates a single high-value target readable by any administrator, defeating the dual control requirement."}},
{id:"s1_14",domain:1,question:"A change advisory board is reviewing a proposal to update firewall rules across the enterprise. Which element of the change request MOST directly addresses what happens if the change causes an unexpected outage?",options:{A:"The backout plan",B:"The impact analysis",C:"The maintenance window",D:"The stakeholder list"},answer:"A",lead:"The backout, or rollback, plan documents the specific steps to return the environment to its previous known-good state, and ideally it has been tested. It is what bounds the duration of a failed change.",why:{B:"Predicts who and what will be affected before the change, which informs approval but does not restore service.",C:"Schedules when the work occurs to minimize disruption.",D:"Identifies who must be informed and consulted."}},
{id:"s1_15",domain:1,question:"After a firewall rule change was implemented successfully, an application began failing two days later because it relied on an undocumented outbound connection. Which change management element would MOST likely have prevented this?",options:{A:"A more detailed communication plan for end users",B:"A dependency analysis identifying systems relying on the affected traffic",C:"A longer maintenance window for the change",D:"An additional approver on the change request"},answer:"B",lead:"Technical implications of a change include dependencies — the services, integrations, and downstream systems that rely on current behavior. Mapping those before implementation surfaces the undocumented outbound connection, which a rule-by-rule review of the firewall alone would miss.",why:{A:"Informs people about the change without identifying what will break.",C:"Provides more time to execute but does not reveal unknown dependencies.",D:"Adds oversight but not technical discovery."}},
{id:"s1_16",domain:1,question:"Which statement correctly describes how symmetric and asymmetric cryptography are typically combined in a TLS session?",options:{A:"Both the handshake and the bulk data use asymmetric cryptography for maximum security",B:"Symmetric cryptography authenticates the server; asymmetric cryptography encrypts all subsequent data",C:"Asymmetric cryptography authenticates the server and establishes a shared secret; symmetric cryptography then encrypts the bulk data",D:"The client and server negotiate whether to use one or the other for the entire session"},answer:"C",lead:"Asymmetric operations are computationally expensive, so they are used only where their unique properties are needed: proving the server's identity via its certificate and performing the key exchange. Once both sides derive the same session key, the far faster symmetric algorithm encrypts the actual traffic.",why:{A:"Would be prohibitively slow for bulk data.",B:"Reverses the roles, and symmetric keys cannot authenticate an unknown party.",D:"Misdescribes the negotiation, which selects cipher suites rather than choosing one cryptographic family for everything."}},
{id:"s1_17",domain:1,question:"A security architect needs to protect a specific column of Social Security numbers inside a shared database, such that database administrators performing routine maintenance cannot read those values. Which encryption approach is MOST appropriate?",options:{A:"Full-disk encryption on the database server",B:"Transparent data encryption applied to the entire database file",C:"Encrypting the backup files written to the storage array",D:"Record or field level encryption with keys managed outside the database"},answer:"D",lead:"Protection must survive the fact that a DBA has legitimate access to the running database. Encrypting at the field or record level, with key access granted only to the application, means the DBA sees ciphertext in that column while still administering the system normally.",why:{A:"A and B both decrypt transparently for anyone authenticated to the running system, so a DBA reads the values in plaintext — they defend against theft of the physical media, not against authorized insiders.",B:"A and B both decrypt transparently for anyone authenticated to the running system, so a DBA reads the values in plaintext — they defend against theft of the physical media, not against authorized insiders.",C:"Protects only the backup copies."}},
{id:"s1_18",domain:1,question:"An organization implements a distributed, append-only record of transactions in which each entry contains a cryptographic hash of the previous entry, and the record is replicated across many independent participants. Which security property does this design MOST directly provide?",options:{A:"Integrity, because altering any past entry invalidates every subsequent hash",B:"Availability, because participants can vote to remove malicious entries",C:"Non-repudiation, because participants remain anonymous",D:"Confidentiality, because the entries are encrypted end to end"},answer:"A",lead:"Chaining each block to the hash of its predecessor means changing a historical entry changes its hash, which breaks every following link. Combined with wide replication, tampering becomes computationally and practically infeasible to hide — a tamper-evident integrity guarantee.",why:{B:"Misstates the mechanism, as immutability is the point and entries are not removed.",C:"Is garbled; non-repudiation comes from digital signatures, and anonymity would undermine rather than support it.",D:"Is wrong because an open public ledger is typically readable by all participants by design."}},
{id:"s1_19",domain:1,question:"An investigator finds that an employee exfiltrated a spreadsheet by embedding it inside the pixel data of vacation photographs uploaded to a personal cloud account. Which technique was used, and which control would MOST likely have detected the transfer?",options:{A:"Tokenization, detected by reviewing database access logs",B:"Steganography, detected by data loss prevention inspecting outbound uploads with anomaly analysis",C:"Data masking, detected by comparing production and test data sets",D:"Obfuscation of source code, detected by static analysis tooling"},answer:"B",lead:"Steganography hides data inside an otherwise ordinary carrier file so that nothing appears amiss. It is difficult to detect by content inspection alone, which is why detection generally depends on DLP combined with behavioral analysis — unusual upload volume, unexpected destinations, or statistical irregularities in the image files.",why:{A:"A, C, and D all name real techniques, but none describe hiding data inside another file's contents for exfiltration.",C:"A, C, and D all name real techniques, but none describe hiding data inside another file's contents for exfiltration.",D:"A, C, and D all name real techniques, but none describe hiding data inside another file's contents for exfiltration."}},
{id:"s1_20",domain:1,question:"A company installs reinforced posts along the sidewalk in front of its data center lobby. Which control category and type does this represent?",options:{A:"Technical category, compensating type",B:"Physical category, deterrent type",C:"Physical category, preventive type",D:"Operational category, preventive type"},answer:"C",lead:"Bollards are physical objects, and they actively stop a vehicle from reaching the building rather than merely discouraging the attempt. A control that blocks the action from succeeding is preventive.",why:{A:"Would require it to be a technology-based substitute for a different required control.",B:"Applies to controls that discourage without physically stopping, such as signage or visible cameras.",D:"Describes controls executed by people through procedure."}},
{id:"s1_21",domain:1,question:"Which pairing correctly matches an authentication concept to what it establishes?",options:{A:"Authentication determines what resources an identity may access",B:"Identification proves the claimed identity is genuine",C:"Accounting verifies that the presented credential is valid",D:"Authorization determines what an authenticated identity is permitted to do"},answer:"D",lead:"The AAA sequence runs identification (claiming an identity), authentication (proving it), authorization (determining permitted actions), and accounting (recording what was done). Authorization is the step that maps a proven identity to permissions.",why:{A:"Describes authorization, not authentication.",B:"Describes authentication, since identification is merely the claim.",C:"Describes authentication, not accounting."}},
{id:"s1_22",domain:1,question:"A security team wants a control that will alert them when an attacker interacts with a system that has no legitimate purpose, generating almost no false positives. Which TWO deployments satisfy this? (Select TWO)",options:{A:"An endpoint antivirus agent with heuristic scanning enabled",B:"A honeypot placed on an isolated segment with full logging",C:"A next-generation firewall with default signature policy at the perimeter",D:"A honeyfile containing fabricated financial data placed on a file share",E:"A network intrusion detection sensor on a SPAN port"},answer:["B", "D"],lead:"Deception technologies work because they have no legitimate use. Nobody has a business reason to connect to a honeypot or open a honeyfile, so any interaction is by definition anomalous. That is what produces near-zero false positives and very high confidence alerts.",why:{A:"A, C, and E are all valuable detection controls, but each inspects legitimate production traffic and activity, which is exactly why they generate false positives that analysts must triage.",C:"A, C, and E are all valuable detection controls, but each inspects legitimate production traffic and activity, which is exactly why they generate false positives that analysts must triage.",E:"A, C, and E are all valuable detection controls, but each inspects legitimate production traffic and activity, which is exactly why they generate false positives that analysts must triage."}},
{id:"s2_01",domain:2,question:"An analyst reviews the authentication log below. Which attack is MOST likely in progress?",pre:"08:14:02  FAILED  user=jmartin    src=203.0.113.44  pass_attempt=Autumn2025!\n08:14:03  FAILED  user=asingh     src=203.0.113.44  pass_attempt=Autumn2025!\n08:14:04  FAILED  user=dlopez     src=203.0.113.44  pass_attempt=Autumn2025!\n08:14:05  FAILED  user=kwright    src=203.0.113.44  pass_attempt=Autumn2025!\n08:14:06  SUCCESS user=tnguyen    src=203.0.113.44  pass_attempt=Autumn2025!\n08:14:07  FAILED  user=rpatel     src=203.0.113.44  pass_attempt=Autumn2025!",options:{A:"Password spraying",B:"A pass-the-hash attack",C:"Brute force against a single account",D:"Credential stuffing using a breached password list"},answer:"A",lead:"One password is tried against many different accounts, one attempt each. This is password spraying, and its defining purpose is evading account lockout — no individual account accumulates enough failures to trigger a threshold, so the attack can run quietly for a long time.",why:{B:"Would not appear as password attempts at all, since it reuses a captured hash rather than a plaintext password.",C:"Would show many different passwords against ONE username.",D:"Would show different passwords paired with different usernames, drawn from a breach dump."}},
{id:"s2_02",domain:2,question:"A SIEM raises an alert because a user account authenticated successfully from an office in Chicago at 09:12 and again from an IP address geolocated to Bucharest at 09:41. Which indicator is this, and what is the MOST appropriate immediate action?",options:{A:"Out-of-cycle logging; adjust the SIEM's time correlation window",B:"Impossible travel; suspend the session and force reauthentication while investigating",C:"Concurrent session usage; increase the session timeout to reduce alerts",D:"Resource consumption; throttle the account's bandwidth allocation"},answer:"B",lead:"Impossible travel flags authentications from locations too far apart to be reached in the elapsed time, which strongly indicates credential compromise or a session token stolen and replayed. The right response is to terminate the sessions and force reauthentication with MFA while the investigation proceeds.",why:{A:"A and D describe entirely different indicator types and propose actions that ignore a probable compromise.",C:"Names a related but distinct indicator and then proposes a change that suppresses detection rather than investigating.",D:"A and D describe entirely different indicator types and propose actions that ignore a probable compromise."}},
{id:"s2_03",domain:2,question:"A web application checks whether a user has permission to write to a file, then opens and writes to that file a moment later. An attacker replaces the file with a symbolic link to a system file between the two operations. Which vulnerability class does this represent?",options:{A:"A directory traversal vulnerability",B:"A buffer overflow in the file handling routine",C:"A time-of-check to time-of-use race condition",D:"An insecure deserialization flaw"},answer:"C",lead:"TOCTOU is a race condition in which state validated at one moment changes before it is acted upon. The permission check was accurate when performed, but the resource it referred to was swapped in the interval, so the privileged write lands somewhere the attacker chose. Mitigation is to perform the check and the operation atomically, using a file handle rather than a path.",why:{A:"Manipulates path input directly to escape a directory.",B:"Involves writing beyond an allocated memory boundary.",D:"Involves untrusted serialized objects being reconstructed into executable state."}},
{id:"s2_04",domain:2,question:"An analyst finds the request below in a web server log. Which attack is being attempted, and which control MOST directly prevents it?",pre:"GET /reports/view.php?file=....//....//....//etc/passwd HTTP/1.1\nHost: intranet.example.com\nUser-Agent: Mozilla/5.0",options:{A:"Server-side request forgery; prevented by blocking outbound requests from the server",B:"Cross-site scripting; prevented by output encoding",C:"SQL injection; prevented by using parameterized queries",D:"Directory traversal; prevented by canonicalizing and validating file paths against an allow list"},answer:"D",lead:"The doubled dot-slash sequences are an encoding trick designed to survive naive filtering that strips ../ once, leaving a valid traversal sequence behind. The goal is escaping the intended directory to read arbitrary files. The correct defense is resolving the path to its canonical form and confirming it falls inside a permitted directory, ideally selecting files by identifier rather than by user-supplied path.",why:{A:"A, B, and C are all real attack classes with correct mitigations listed, but none match a request manipulating filesystem path traversal.",B:"A, B, and C are all real attack classes with correct mitigations listed, but none match a request manipulating filesystem path traversal.",C:"A, B, and C are all real attack classes with correct mitigations listed, but none match a request manipulating filesystem path traversal."}},
{id:"s2_05",domain:2,question:"An attacker tricks an authenticated user's browser into submitting a state-changing request to a banking application without the user's knowledge, exploiting the fact that the browser automatically attaches the session cookie. Which attack is this, and what is the standard mitigation?",options:{A:"Cross-site request forgery; mitigated by anti-CSRF tokens and SameSite cookie attributes",B:"Cross-site scripting; mitigated by input sanitization",C:"Clickjacking; mitigated by the X-Frame-Options header",D:"Session hijacking; mitigated by rotating session identifiers"},answer:"A",lead:"CSRF abuses the browser's automatic inclusion of credentials for a site. The application cannot distinguish the forged request from a legitimate one because the cookie is valid. The fix is a secret, unpredictable token tied to the session that must accompany state-changing requests, plus SameSite cookie attributes limiting cross-site cookie transmission.",why:{B:"Injects script into a page viewed by others, a different mechanism.",C:"Tricks a user into clicking a hidden element, which is related but distinct.",D:"Involves stealing the session identifier itself, whereas CSRF never needs to read it."}},
{id:"s2_06",domain:2,question:"An attacker positioned between a client and server forces the TLS negotiation to settle on an obsolete cipher suite with known weaknesses, then decrypts the traffic. Which attack is this?",options:{A:"A replay attack",B:"A downgrade attack",C:"A collision attack",D:"A birthday attack"},answer:"B",lead:"A downgrade attack manipulates protocol negotiation so that both parties agree on a weaker version or cipher than each supports, allowing the attacker to exploit known weaknesses in the older option. Mitigations include disabling legacy protocol versions entirely and enforcing TLS_FALLBACK_SCSV or strict minimum-version policies.",why:{A:"Retransmits captured valid traffic.",C:"Produces two different inputs with the same hash value, which is a component of forgery attacks rather than protocol negotiation.",D:"Exploits the mathematics of hash collision probability to find two inputs with the same digest more efficiently than brute force."}},
{id:"s2_07",domain:2,question:"A security team discovers that a widely used third-party software update, digitally signed by the legitimate vendor, contained a backdoor that was distributed to thousands of customers. Which threat vector does this represent, and which control class BEST reduces exposure?",options:{A:"Insider threat; reduced by separation of duties and mandatory vacation",B:"Shadow IT; reduced by asset discovery and application allow listing",C:"Supply chain compromise; reduced by vendor risk assessment, staged rollouts, and egress monitoring",D:"Watering hole attack; reduced by web filtering and browser isolation"},answer:"C",lead:"When the trusted software distribution channel itself is compromised, the malicious code arrives with a valid signature through the normal update process, so signature verification alone provides no protection. Reducing exposure means assessing vendor security practices contractually, staging updates in a test group before enterprise rollout, and monitoring egress for the unexpected outbound connections such implants require.",why:{A:"A, B, and D describe different vectors entirely.",B:"A, B, and D describe different vectors entirely.",D:"A, B, and D describe different vectors entirely."},note:"The distinguishing detail is that the vendor's own signed update was the delivery mechanism."},
{id:"s2_08",domain:2,question:"An organization discovers that several departments purchased and deployed cloud SaaS applications with corporate data, without involving IT or security. Which risk category is this, and which TWO controls MOST directly address it? (Select TWO)",options:{A:"A procurement policy routing all software purchases through a security review",B:"Deploying an intrusion prevention system at the perimeter",C:"Mandatory annual phishing simulation training",D:"Full disk encryption on all corporate endpoints",E:"Discovery through a cloud access security broker monitoring outbound SaaS usage"},answer:["A", "E"],lead:"This is shadow IT, and it is dangerous because security has no visibility into where corporate data now lives, what its access controls are, or whether it is covered by any contract. A CASB discovers which SaaS services are actually in use by inspecting outbound traffic, and a procurement gate prevents new instances from appearing.",why:{B:"Inspects traffic for attacks but does not inventory sanctioned versus unsanctioned services.",C:"Addresses social engineering.",D:"Protects data on the endpoint, not data placed in an unapproved cloud service."}},
{id:"s2_09",domain:2,question:"Malware on a compromised host loads entirely into memory, executes through legitimate signed system utilities such as PowerShell and WMI, and writes no files to disk. Which detection approach is MOST likely to catch it?",options:{A:"Weekly vulnerability scanning of the affected hosts",B:"Signature-based antivirus scanning the filesystem on a schedule",C:"A network intrusion detection signature for known malware file hashes",D:"Endpoint detection and response monitoring process behavior and command-line arguments"},answer:"D",lead:"Fileless malware living off the land defeats file-based detection because there is no malicious file and the binaries it abuses are legitimate and signed. EDR observes behavior — unusual parent-child process relationships, encoded PowerShell command lines, unexpected WMI subscriptions, and memory injection — which is where the malicious intent is actually visible.",why:{A:"Identifies missing patches and misconfigurations, not an active intrusion.",B:"Scans files that do not exist.",C:"Matches hashes of files that are never written."}},
{id:"s2_10",domain:2,question:"An administrator notices that a departed employee's scheduled task remains on a production server, configured to delete critical directories if a specific account is ever removed from Active Directory. Which type of malicious code is this?",options:{A:"A logic bomb",B:"A worm",C:"A remote access trojan",D:"A rootkit"},answer:"A",lead:"A logic bomb is dormant code that executes when a defined condition is met — a date, a file's presence, or in this case the absence of an account. It is a classic insider technique because the perpetrator is often gone by the time it detonates.",why:{B:"Self-propagates across the network without user interaction.",C:"Provides an attacker with interactive remote control of the host.",D:"Conceals its presence at a privileged level within the operating system."}},
{id:"s2_11",domain:2,question:"Analysts observe a workstation making thousands of DNS queries per hour to subdomains of a single unfamiliar domain, each query containing a long random-looking label, with responses in TXT records. What is the MOST likely explanation?",options:{A:"Normal behavior for a content delivery network's edge selection",B:"DNS tunneling being used for command and control or data exfiltration",C:"A misconfigured DNS resolver retrying failed lookups",D:"A DNS amplification attack originating from the workstation"},answer:"B",lead:"Encoding data into the subdomain labels of queries and receiving instructions back in TXT records is the signature of DNS tunneling. Attackers favor it because DNS is almost always permitted outbound and is frequently unmonitored. The tells are the volume, the high-entropy labels, and the use of TXT responses.",why:{A:"Uses ordinary hostnames and A or CNAME responses.",C:"Would repeat the SAME query rather than generate thousands of unique high-entropy names.",D:"Would involve spoofed queries sent toward open resolvers with a victim's address, and the traffic pattern would differ."}},
{id:"s2_12",domain:2,question:"A penetration tester escapes from a guest virtual machine and executes code on the underlying hypervisor, gaining access to other tenants' virtual machines. Which vulnerability class is this, and which mitigation is MOST relevant?",options:{A:"Container breakout; mitigated by running containers as non-root",B:"Side channel attack; mitigated by disabling simultaneous multithreading",C:"VM escape; mitigated by prompt hypervisor patching and separating tenants onto distinct physical hosts",D:"Resource reuse; mitigated by zeroing memory pages between allocations"},answer:"C",lead:"VM escape breaks the isolation boundary the hypervisor is supposed to enforce, which is the most severe possible failure in a virtualized environment because it compromises every workload on the host. The primary defenses are keeping hypervisor firmware and software patched and, for high-sensitivity workloads, dedicated hosts so a successful escape reaches no other tenant.",why:{A:"Describes the container equivalent, and the stem specifies a hypervisor.",B:"Infers information from timing or power characteristics rather than executing code.",D:"Involves memory or storage handed to a new consumer with the previous tenant's data still present."}},
{id:"s2_13",domain:2,question:"A threat actor with substantial funding conducts a multi-year campaign against a defense contractor, using custom malware and previously unknown vulnerabilities, with the goal of stealing design documents rather than money. Which actor type and motivation BEST describe this?",options:{A:"Organized crime motivated by financial gain",B:"Unskilled attacker motivated by notoriety",C:"Hacktivist motivated by philosophical beliefs",D:"Nation-state actor motivated by espionage"},answer:"D",lead:"The combination of very high resources, long dwell time, custom tooling, zero-day exploits, and a target of intellectual property rather than monetizable data is the profile of a state-sponsored advanced persistent threat conducting espionage.",why:{A:"Would monetize access quickly through ransomware, fraud, or resale, not maintain quiet multi-year access.",B:"Lacks the resources and sophistication described, typically relying on prebuilt tools.",C:"Seeks publicity and disruption aligned with a cause."}},
{id:"s2_14",domain:2,question:"An analyst reviews the application log below from a customer lookup page. What is occurring, and what is the correct remediation?",pre:"[14:22:07] query: SELECT * FROM customers WHERE id = '1042'\n[14:22:31] query: SELECT * FROM customers WHERE id = '1042' OR '1'='1'\n[14:22:44] query: SELECT * FROM customers WHERE id = '1042' UNION SELECT username,password,NULL FROM users--'\n[14:22:51] query: SELECT * FROM customers WHERE id = '1042'; DROP TABLE audit_log--'",options:{A:"SQL injection; remediated with parameterized queries and least-privilege database accounts",B:"Cross-site scripting; remediated with output encoding and a content security policy",C:"LDAP injection; remediated by escaping distinguished name special characters",D:"Command injection; remediated by avoiding shell interpreters in application code"},answer:"A",lead:"User input is being concatenated directly into SQL statements, letting the attacker alter query logic with a tautology, append a UNION to extract credentials from another table, and stack a destructive statement. Parameterized queries (prepared statements) separate code from data so input can never change the query's structure, and a least-privilege database account limits the damage if injection is ever achieved.",why:{B:"B, C, and D name injection variants that target different interpreters — a browser, a shell, and a directory service.",C:"B, C, and D name injection variants that target different interpreters — a browser, a shell, and a directory service.",D:"B, C, and D name injection variants that target different interpreters — a browser, a shell, and a directory service."},note:"The syntax here is unambiguously SQL."},
{id:"s2_15",domain:2,question:"Employees receive a text message claiming to be from the IT help desk, warning that their VPN access expires today and providing a shortened link to a credential reset page. Which attack is this, and which technical control MOST directly reduces its success rate?",options:{A:"Watering hole; reduced by DNS filtering of compromised sites",B:"Smishing; reduced by phishing-resistant MFA such as FIDO2 security keys",C:"Whaling; reduced by executive-specific awareness training",D:"Vishing; reduced by call recording and monitoring"},answer:"B",lead:"Smishing is phishing delivered by SMS. Because the payload is credential harvesting, the strongest technical mitigation is authentication that cannot be replayed by a stolen password — FIDO2 or WebAuthn keys are bound to the legitimate origin, so a credential entered on a lookalike site is useless to the attacker.",why:{A:"Compromises a legitimate site the victims visit rather than contacting them directly.",C:"Targets senior executives specifically, and nothing in the stem indicates that.",D:"Is voice-based."}},
{id:"s2_16",domain:2,question:"A finance employee receives an email that appears to come from the CEO's correct display name, referencing a real ongoing acquisition, and requesting an urgent wire transfer to a new vendor account. The message passed SPF because it originated from a lookalike domain the attacker registered. Which TWO controls would MOST directly prevent a loss? (Select TWO)",options:{A:"A mandatory out-of-band callback procedure for payment changes using known-good contact details",B:"Full disk encryption on the finance workstation",C:"A network intrusion prevention system inspecting SMTP traffic",D:"Email gateway rules flagging newly registered and lookalike domains",E:"Quarterly password rotation for all finance staff"},answer:["A", "D"],lead:"This is business email compromise, and no malware is involved — the attack succeeds entirely through process manipulation. A mandatory callback to a number from the corporate directory, never one supplied in the message, breaks the attack because the real CEO will not confirm it. Flagging lookalike and recently registered domains addresses the technical delivery, since SPF passed for the attacker's own domain and proves nothing about legitimacy.",why:{B:"Protects data at rest on a stolen device.",C:"Cannot distinguish a fraudulent business request from a legitimate one.",E:"Does nothing when no credential is being stolen."}},
{id:"s2_17",domain:2,question:"An attacker compromises a niche industry news website that engineers at a specific defense firm read daily, planting a browser exploit that fires only for visitors from that firm's IP range. Which attack is this?",options:{A:"A pharming attack",B:"A typosquatting attack",C:"A watering hole attack",D:"A supply chain attack"},answer:"C",lead:"A watering hole compromises a legitimate third-party site the target population is known to visit, then waits for them to arrive. It is favored against organizations that are hard to phish directly, and the IP-based targeting shown here is typical, since it limits exposure and avoids alerting researchers.",why:{A:"Redirects users who typed the correct address, usually via DNS manipulation.",B:"Registers misspelled domains to catch typing errors.",D:"Compromises a vendor in the target's software or hardware supply chain."}},
{id:"s2_18",domain:2,question:"During an investigation, analysts find that a server's system binaries have been replaced, the kernel is loading an unsigned module, and standard tools such as ps and netstat no longer show a process that is clearly generating network traffic. What is the MOST likely explanation, and what is the correct response?",options:{A:"Bloatware from the vendor image; the unnecessary software should be uninstalled",B:"A polymorphic virus; the antivirus signature database should be updated and a full scan run",C:"A worm; the host should be patched and rescanned",D:"A kernel-level rootkit; the system should be rebuilt from known-good media rather than cleaned"},answer:"D",lead:"Concealment achieved by subverting the kernel and replacing system utilities is the defining behavior of a rootkit. Once the operating system itself is lying to every tool that runs on it, no result from that system can be trusted, so remediation means rebuilding from trusted media and restoring data from a verified clean backup.",why:{A:"Is unwanted preinstalled software with no concealment.",B:"Changes its own code to evade signatures but does not subvert the kernel.",C:"Self-propagates, and patching alone would not remove an established kernel implant."}},
{id:"s2_19",domain:2,question:"An attacker captures an authentication exchange on a wireless network and later retransmits the captured packets to gain access. Which mitigation MOST directly defeats this?",options:{A:"Including a nonce or timestamp so each exchange is valid only once",B:"Increasing the length of the pre-shared key",C:"Disabling SSID broadcast on the access point",D:"Enabling MAC address filtering on the access point"},answer:"A",lead:"A replay attack works because the captured exchange remains valid when resubmitted. Introducing a nonce (a number used once), a sequence number, or a timestamp makes each exchange unique and time-bound, so a replayed copy is rejected.",why:{B:"Raises the cost of cracking the key but does nothing about replaying a valid exchange.",C:"C and D are both weak obscurity measures — the SSID appears in other frames and MAC addresses are trivially spoofed — and neither addresses replay.",D:"C and D are both weak obscurity measures — the SSID appears in other frames and MAC addresses are trivially spoofed — and neither addresses replay."}},
{id:"s2_20",domain:2,question:"Which set of indicators would MOST strongly suggest that an attacker is attempting to cover their tracks after gaining access?",options:{A:"Multiple concurrent sessions for a single service account",B:"Missing log entries for a specific time window and out-of-cycle logging activity",C:"High CPU utilization and slow application response",D:"An increase in blocked outbound content and account lockouts"},answer:"B",lead:"Gaps in otherwise continuous logs, cleared event logs, and logging activity occurring outside normal patterns all indicate deliberate tampering with the audit trail — a hallmark of anti-forensic behavior. This is why forwarding logs off-host to a SIEM in near real time matters so much: the attacker can clear the local copy but not the one already shipped.",why:{A:"Is a meaningful indicator of credential misuse but does not point specifically to track covering.",C:"Indicates resource consumption, which could be cryptomining or a denial of service.",D:"Suggests attack attempts being blocked rather than successful concealment."}},
{id:"s2_21",domain:2,question:"A vulnerability scan identifies a critical flaw in a customer-facing application, but the vendor has not yet released a patch and the vulnerability is being actively exploited in the wild. Which term describes this situation, and which response is MOST appropriate in the interim?",options:{A:"A false positive; validate the finding and close it",B:"A misconfiguration; apply the vendor's hardening baseline",C:"A zero-day; apply virtual patching at the WAF and increase monitoring on the affected service",D:"A legacy vulnerability; schedule decommissioning of the application"},answer:"C",lead:"A zero-day is a vulnerability for which no vendor fix exists. Since patching is impossible, the response is compensating: a web application firewall rule that blocks the exploit pattern (virtual patching), tightened access controls, and heightened monitoring for exploitation attempts until an official patch ships.",why:{A:"Dismisses a confirmed, actively exploited finding.",B:"Is contradicted by the stem, which describes a code flaw rather than a setting.",D:"Mischaracterizes an actively exploited flaw in a current product, and decommissioning is not an interim measure."}},
