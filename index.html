{id:"s2_f01",domain:2,term:"Threat Actor Types",definition:"Nation-state (highly resourced, espionage), Organized crime (financial), Hacktivist (ideological), Insider (authorized access), Unskilled attacker (uses others' tools), Shadow IT (unsanctioned internal technology).",example:"A 14-month stealth intrusion with custom zero-days points to a nation-state; a fast encrypt-and-demand-payment attack points to organized crime."},
{id:"s2_f02",domain:2,term:"Phishing Family",definition:"Phishing (email), Spear phishing (targeted), Whaling (executives), Vishing (voice), Smishing (SMS), Pharming (DNS redirection), Watering hole (compromising a site the target visits).",example:"A call impersonating the CFO demanding an urgent wire is vishing; a fake login page on a lookalike domain reached by email is classic phishing."},
{id:"s2_f03",domain:2,term:"Business Email Compromise (BEC)",definition:"An attack impersonating a trusted executive, vendor, or partner to induce fraudulent payments or data disclosure — often with no malware at all.",example:"An 'urgent and confidential' request from the CEO's lookalike address instructs accounting to wire funds to a new vendor account before quarter close."},
{id:"s2_f04",domain:2,term:"Ransomware",definition:"Malware that encrypts data and demands payment. Double extortion adds data theft with a threat to publish, so backups alone do not remove the leverage.",example:"Files across the network share are renamed with a new extension, a ransom note appears, and the attacker posts a sample of stolen records on a leak site."},
{id:"s2_f05",domain:2,term:"Trojan / Worm / Virus",definition:"A Trojan masquerades as legitimate software, a worm self-propagates across networks without user action, and a virus attaches to a host file and needs the user to run it.",example:"A worm spreading through an unpatched SMB service needs no clicks; a Trojan disguised as a free PDF tool needs the user to install it."},
{id:"s2_f06",domain:2,term:"Rootkit",definition:"Malware operating at kernel or firmware level that subverts the operating system to hide its own files, processes, and network activity from standard tools.",example:"Task Manager shows nothing unusual, but boot-level integrity checks and offline forensic imaging reveal hidden persistence."},
{id:"s2_f07",domain:2,term:"Logic Bomb",definition:"Dormant malicious code that executes when a specific condition is met, such as a date, a file change, or the absence of an account.",example:"A departing administrator leaves a script that wipes records if their account disappears from the payroll database."},
{id:"s2_f08",domain:2,term:"SQL Injection",definition:"Inserting SQL syntax into input that is concatenated into a query, allowing an attacker to read, modify, or destroy database contents. Prevented by parameterized queries.",example:"Entering ' OR '1'='1 into a login field makes the WHERE clause always true, bypassing authentication entirely."},
{id:"s2_f09",domain:2,term:"XSS (Cross-Site Scripting)",definition:"Injecting script that executes in other users' browsers. Stored XSS persists on the server; reflected XSS requires a crafted link; DOM-based XSS occurs entirely client side.",example:"A script saved in a forum post steals the session cookie of every user who views the thread — stored XSS."},
{id:"s2_f10",domain:2,term:"Buffer Overflow",definition:"Writing more data into a fixed-length memory buffer than it can hold, corrupting adjacent memory and potentially overwriting the return address to redirect execution.",example:"Submitting 500 bytes into a 64-byte stack buffer overwrites the saved return address, pointing execution at attacker-supplied shellcode."},
{id:"s2_f11",domain:2,term:"Race Condition (TOC/TOU)",definition:"A flaw where system state validated at time-of-check changes before time-of-use, letting an attacker substitute a different resource in the gap.",example:"A program verifies a file's owner, then opens it a moment later — an attacker swaps the file for a symlink to /etc/shadow in between."},
{id:"s2_f12",domain:2,term:"Privilege Escalation",definition:"Gaining higher permissions than originally granted. Vertical escalation moves to a higher privilege level; horizontal escalation moves to another user's access at the same level.",example:"A compromised low-privilege service account exploits a misconfigured sudo rule to obtain root — vertical escalation."},
{id:"s2_f13",domain:2,term:"On-Path Attack",definition:"An attacker inserts themselves between two communicating parties to intercept or modify traffic. Formerly called man-in-the-middle.",example:"ARP poisoning maps the gateway IP to the attacker's MAC, routing all victim traffic through the attacker before it reaches the real gateway."},
{id:"s2_f14",domain:2,term:"Credential Stuffing vs Password Spraying",definition:"Credential stuffing replays real username/password pairs from prior breaches against many sites. Password spraying tries a few common passwords across many accounts to avoid lockout.",example:"Thousands of accounts hit once each with a known-valid leaked pair is stuffing; every account tried with 'Winter2026!' is spraying."},
{id:"s2_f15",domain:2,term:"Supply Chain Attack",definition:"Compromising a trusted vendor, library, or update mechanism so that malicious code reaches customers through a legitimate, often signed, channel.",example:"A poisoned build server inserts a backdoor into a vendor's signed update, which thousands of customers install as routine maintenance."},
{id:"s2_f16",domain:2,term:"Zero-Day",definition:"A vulnerability exploited before the vendor has released a patch, leaving defenders zero days of remediation lead time.",example:"With no patch available, the team relies on segmentation, virtual patching at the WAF, and behavioral detection until a fix ships."},

// Domain 3 — Security Architecture
{id:"s3_f01",domain:3,term:"Shared Responsibility Model",definition:"Defines the split of security duties between cloud provider and customer. Provider secures 'of the cloud'; customer secures 'in the cloud'. The line moves with IaaS, PaaS, and SaaS.",example:"In IaaS you patch the guest OS and configure the security groups; in SaaS the provider handles nearly everything except your data, identities, and access settings."},
{id:"s3_f02",domain:3,term:"IDS vs IPS",definition:"An IDS detects and alerts on suspicious traffic, typically deployed out of band and passive. An IPS sits inline and can actively block traffic in real time.",example:"An IDS on a SPAN port raises an alert about an exploit attempt; an inline IPS drops the packet before it ever reaches the server."},
{id:"s3_f03",domain:3,term:"Fail-Open vs Fail-Closed",definition:"Fail-open permits traffic when a control fails, prioritizing availability. Fail-closed blocks traffic when a control fails, prioritizing security.",example:"A data-center firewall is set fail-closed so a crash cannot expose systems; a fire-exit door is fail-open so people can always escape."},
{id:"s3_f04",domain:3,term:"Jump Server (Bastion Host)",definition:"A single hardened, heavily monitored host that serves as the only entry point into a protected network zone, concentrating access control and audit.",example:"Admins SSH to the bastion with MFA and session recording; only that host is permitted to reach production management interfaces."},
{id:"s3_f05",domain:3,term:"WAF (Web Application Firewall)",definition:"A Layer 7 firewall that parses HTTP and blocks application attacks such as SQL injection, XSS, and directory traversal — including as virtual patching for unpatched apps.",example:"A WAF rule blocks requests containing traversal sequences while developers work on a permanent code fix."},
{id:"s3_f06",domain:3,term:"IPsec Tunnel vs Transport Mode",definition:"Tunnel mode encrypts the entire original packet and adds a new IP header, hiding internal addressing. Transport mode protects only the payload, keeping the original header.",example:"Site-to-site VPNs between gateways use tunnel mode; host-to-host protection inside a trusted network can use transport mode."},
{id:"s3_f07",domain:3,term:"SASE",definition:"Secure Access Service Edge — converges SD-WAN connectivity with cloud-delivered security (SWG, CASB, ZTNA, FWaaS) so policy follows the user anywhere.",example:"A remote employee's traffic is inspected by the nearest cloud PoP under the same rules they would get in the office."},
{id:"s3_f08",domain:3,term:"802.1X",definition:"Port-based network access control. The supplicant (client) requests access, the authenticator (switch or AP) controls the port, and the authentication server (RADIUS) decides.",example:"A laptop without a valid certificate is placed on a quarantine VLAN instead of the corporate network."},
{id:"s3_f09",domain:3,term:"Encryption at Rest vs In Transit",definition:"At rest protects stored data against theft of media or backups. In transit protects data moving across networks against interception.",example:"Full-disk encryption defends a stolen laptop (at rest); TLS defends the same data as it travels to the server (in transit)."},
{id:"s3_f10",domain:3,term:"Data Sovereignty",definition:"The principle that data is subject to the laws of the jurisdiction where it physically resides, which may mandate in-region storage and processing.",example:"EU customer records must remain on EU-based servers to satisfy regulatory obligations, constraining which cloud regions may be used."},
{id:"s3_f11",domain:3,term:"Hot / Warm / Cold Site",definition:"Hot — fully equipped and running, near-instant failover. Warm — hardware and connectivity ready, data must be loaded. Cold — space and power only, everything must be built.",example:"A hot site takes over in minutes at high cost; a cold site is cheap but may take weeks to bring online."},
{id:"s3_f12",domain:3,term:"RAID vs Backup",definition:"RAID provides fault tolerance against drive failure and keeps systems running. Backups provide recovery from deletion, corruption, and ransomware. RAID is not a backup.",example:"RAID 5 survives one failed disk, but ransomware encrypts the array instantly — only an offline backup restores the data."},
{id:"s3_f13",domain:3,term:"3-2-1 Backup Rule",definition:"Keep three copies of data, on two different media types, with at least one copy offsite — ideally immutable or air-gapped.",example:"Production data, a local NAS copy, and an immutable cloud copy in another region satisfies 3-2-1 and survives site loss."},
{id:"s3_f14",domain:3,term:"UPS vs Generator",definition:"A UPS supplies immediate battery power for seconds to minutes, covering sags and enabling clean transition. A generator sustains power for extended outages once started.",example:"The UPS carries the load during the 30 seconds the generator needs to start and stabilize."},

// Domain 4 — Security Operations
{id:"s4_f01",domain:4,term:"Incident Response Lifecycle",definition:"Preparation → Detection and Analysis → Containment → Eradication → Recovery → Lessons Learned. Preparation is continuous and lessons learned feeds back into it.",example:"Isolating infected hosts is containment; wiping and rebuilding them is eradication; restoring verified-clean service is recovery."},
{id:"s4_f02",domain:4,term:"Order of Volatility",definition:"Collect evidence most-volatile first: CPU registers and cache → RAM → network state → disk → backups and archives.",example:"Responders capture a memory image before powering down, since RAM may hold encryption keys and injected code that vanish on shutdown."},
{id:"s4_f03",domain:4,term:"Chain of Custody",definition:"Documentation of every person who handled evidence, when, and why — required to demonstrate integrity and admissibility.",example:"Each transfer of the imaged drive is signed and timestamped, with the hash recorded to prove the copy never changed."},
{id:"s4_f04",domain:4,term:"Legal Hold",definition:"A directive suspending normal data destruction and retention schedules because the data may be relevant to litigation or investigation.",example:"Upon notice of a lawsuit, the 90-day mailbox purge is halted for named custodians until counsel releases the hold."},
{id:"s4_f05",domain:4,term:"SIEM",definition:"Security Information and Event Management — aggregates logs from many sources, normalizes and correlates them, and generates alerts and reports.",example:"Correlating VPN logs with domain authentication reveals an impossible-travel login that neither source would flag alone."},
{id:"s4_f06",domain:4,term:"EDR / XDR",definition:"EDR records endpoint telemetry, detects behavioral threats, and enables remote isolation and remediation. XDR extends the same correlation across network, email, cloud, and identity.",example:"EDR shows the full process tree from the malicious macro to the encryption routine, and the analyst isolates the host with one click."},
{id:"s4_f07",domain:4,term:"DLP (Data Loss Prevention)",definition:"Inspects data in motion, at rest, and in use against classification rules, then blocks, quarantines, or alerts on policy violations.",example:"An outbound email containing a spreadsheet of card numbers is blocked at the gateway and routed to a reviewer."},
{id:"s4_f08",domain:4,term:"False Positive vs False Negative",definition:"A false positive alerts on something benign, wasting analyst time and eroding trust. A false negative misses a real threat, leaving genuine exposure undetected.",example:"A scanner flagging a patched service is a false positive; missing an actively exploited flaw is the far more dangerous false negative."},
{id:"s4_f09",domain:4,term:"CVE vs CVSS",definition:"CVE is the unique public identifier for a specific vulnerability. CVSS is the 0.0–10.0 severity score derived from base, temporal, and environmental metrics.",example:"CVE-2024-XXXX identifies the flaw; its CVSS base score of 9.8 tells you to prioritize it — adjusted by your own environmental context."},
{id:"s4_f10",domain:4,term:"SAST vs DAST",definition:"SAST analyzes source code without executing it, catching flaws early. DAST tests a running application from the outside, finding runtime and configuration issues.",example:"SAST flags an unsanitized query in the repository; DAST confirms the deployed endpoint is actually injectable."},
{id:"s4_f11",domain:4,term:"Penetration Test Environments",definition:"Known (white box) — full information supplied. Partially known (gray box) — limited information. Unknown (black box) — no information, simulating an external attacker.",example:"An unknown-environment engagement measures what a real outsider could achieve; a known-environment test maximizes coverage per hour."},
{id:"s4_f12",domain:4,term:"Passive vs Active Reconnaissance",definition:"Passive gathers information from public and third-party sources without touching the target. Active interacts directly with target systems and is detectable.",example:"Reading WHOIS records and LinkedIn profiles is passive; running an Nmap scan against the perimeter is active."},
{id:"s4_f13",domain:4,term:"Access Control Models",definition:"DAC — owner decides. MAC — system enforces labels and clearances. RBAC — permissions attach to job roles. ABAC — decisions evaluate multiple attributes. Rule-based — global conditional rules.",example:"A government system uses MAC so no user can share Secret data downward; a corporate file server uses RBAC tied to department."},
{id:"s4_f14",domain:4,term:"SAML vs OAuth vs OIDC",definition:"SAML exchanges signed XML assertions for federated SSO. OAuth 2.0 authorizes delegated access via tokens. OpenID Connect adds an identity layer on top of OAuth for authentication.",example:"SAML logs you into the enterprise HR portal; OAuth lets an app read your calendar without your password; OIDC tells the app who you are."},
{id:"s4_f15",domain:4,term:"PAM (Privileged Access Management)",definition:"Controls administrative access through just-in-time elevation, credential vaulting, ephemeral credentials, and session recording — eliminating standing privilege.",example:"A DBA checks out a time-limited credential for a maintenance window; it expires automatically and the session is recorded."},
{id:"s4_f16",domain:4,term:"SPF, DKIM, DMARC",definition:"SPF lists authorized sending hosts. DKIM cryptographically signs messages. DMARC publishes the enforcement policy for failures and requests reports.",example:"With DMARC set to reject, mail spoofing your domain that fails SPF and DKIM is discarded by receiving servers rather than delivered."},

// Domain 5 — Security Program Management and Oversight
{id:"s5_f01",domain:5,term:"SLE, ARO, ALE",definition:"SLE = Asset Value × Exposure Factor (loss per event). ARO = expected occurrences per year. ALE = SLE × ARO (expected annual loss).",example:"A $200,000 asset with a 40% exposure factor gives an SLE of $80,000; at one flood every 20 years (ARO 0.05) the ALE is $4,000."},
{id:"s5_f02",domain:5,term:"Risk Management Strategies",definition:"Mitigate (reduce likelihood or impact), Transfer (shift financial impact, e.g. insurance), Avoid (stop the activity), Accept (acknowledge and proceed, formally documented).",example:"Cyber insurance transfers breach cost; discontinuing a risky product line avoids the risk entirely."},
{id:"s5_f03",domain:5,term:"Risk Appetite vs Risk Tolerance vs Threshold",definition:"Appetite is the broad level of risk leadership will pursue (expansionary, neutral, conservative). Tolerance is acceptable variation. Threshold is the specific value triggering action.",example:"An expansionary appetite accepts higher risk in new markets, but a risk score above 15 still triggers mandatory escalation."},
{id:"s5_f04",domain:5,term:"Inherent vs Residual Risk",definition:"Inherent risk exists before any controls are applied. Residual risk remains after controls, and must be formally accepted by management or the risk owner.",example:"After MFA and segmentation reduce a critical risk from high to low, that remaining low risk is signed off by the business owner."},
{id:"s5_f05",domain:5,term:"RTO vs RPO",definition:"RTO is the maximum tolerable time to restore service after an outage. RPO is the maximum tolerable amount of data loss, measured backward from the incident.",example:"An RTO of 4 hours and RPO of 15 minutes requires fast failover plus replication or backups no less frequent than every 15 minutes."},
{id:"s5_f06",domain:5,term:"MTTR vs MTBF",definition:"Mean Time To Repair is the average time to restore a failed system (maintainability). Mean Time Between Failures is the average operating time between failures (reliability).",example:"A component with high MTBF fails rarely; low MTTR means that when it does fail, service returns quickly."},
{id:"s5_f07",domain:5,term:"Business Impact Analysis (BIA)",definition:"Identifies critical business functions, the impact of their loss over time, and their dependencies — producing the RTO and RPO values that drive continuity planning.",example:"The BIA shows order processing loses $50,000 per hour, justifying a hot site that other systems do not warrant."},
{id:"s5_f08",domain:5,term:"Risk Register",definition:"The central record of identified risks, each with a description, owner, likelihood and impact scores, treatment plan, threshold, and key risk indicators.",example:"Each entry names an accountable owner so risks are actively managed and escalated rather than sitting unreviewed."},
{id:"s5_f09",domain:5,term:"Agreement Types",definition:"SLA — measurable performance commitments. MOU/MOA — statements of intent. MSA — overarching terms. SOW/WO — specific deliverables. NDA — confidentiality. BPA — business partnership terms.",example:"The MSA sets the general legal terms once, and each project then issues its own SOW under it."},
{id:"s5_f10",domain:5,term:"Right-to-Audit Clause",definition:"A contractual provision preserving the customer's ability to assess a vendor's security controls directly or through an independent assessor.",example:"Without this clause, a cloud customer may be limited to whatever SOC 2 report the vendor chooses to provide."},
{id:"s5_f11",domain:5,term:"Data Controller vs Processor",definition:"The controller determines the purposes and means of processing personal data and holds primary accountability. The processor acts only on the controller's documented instructions.",example:"A retailer is the controller of its customer list; the email platform it hires to send campaigns is the processor."},
{id:"s5_f12",domain:5,term:"Due Diligence vs Due Care",definition:"Due diligence is the investigation performed before a decision or engagement. Due care is the ongoing, reasonable action taken to maintain protection afterward.",example:"Vetting a vendor's security posture before signing is due diligence; monitoring their compliance quarterly thereafter is due care."},
// Domain 1 — added
{id:"s1_f13",domain:1,term:"Gap Analysis",definition:"A structured comparison of the current security posture against a target framework or standard, producing the specific list of missing controls and the work needed to close them.",example:"Mapping current controls against a required framework shows encryption at rest is absent on three systems, which becomes the remediation roadmap."},
{id:"s1_f14",domain:1,term:"Change Management",definition:"The governance process for modifying systems: request, impact and risk assessment, approval, test, scheduled implementation inside a maintenance window, and a documented backout plan.",example:"An unapproved firewall rule pushed at noon takes the payment system down; with change management it would have been tested, scheduled, and reversible."},
{id:"s1_f15",domain:1,term:"Digital Signature",definition:"A hash of a message encrypted with the sender's private key. Anyone can verify it with the public key, which proves authenticity, integrity, and non-repudiation — but not confidentiality.",example:"A signed software update proves it came from the vendor and was not altered, though the file itself is still readable by anyone."},
{id:"s1_f16",domain:1,term:"Diffie-Hellman and Perfect Forward Secrecy",definition:"Diffie-Hellman lets two parties derive a shared secret over an untrusted channel without transmitting it. Ephemeral variants give perfect forward secrecy, so compromising the long-term key does not decrypt past sessions.",example:"Captured TLS traffic from last year stays unreadable even if the server private key leaks today, because each session used a unique ephemeral key."},
{id:"s1_f17",domain:1,term:"Key Escrow",definition:"Storing a copy of cryptographic keys with a trusted third party or internal authority so data can be recovered if keys are lost. It enables recovery and lawful access but creates a high-value target.",example:"An employee leaves without sharing their disk encryption key; escrow lets the organization recover the data rather than lose it permanently."},
{id:"s1_f18",domain:1,term:"CRL vs OCSP",definition:"A Certificate Revocation List is a downloaded list of revoked serial numbers that grows over time. OCSP queries a responder about one certificate and returns good, revoked, or unknown. OCSP stapling has the server present a signed status during the handshake.",example:"Stapling avoids every client separately contacting the CA, which improves both privacy and handshake speed."},
{id:"s1_f19",domain:1,term:"Blockchain and Open Public Ledger",definition:"A distributed, append-only record where each block cryptographically references the previous one, so altering history requires redoing all subsequent blocks and outvoting the network. It provides integrity and transparency, not confidentiality.",example:"A supply chain ledger lets any participant verify that a shipment record has not been retroactively edited."},
{id:"s1_f20",domain:1,term:"Steganography and Obfuscation",definition:"Steganography hides the existence of data inside other media such as images or audio. Obfuscation makes data or code hard to interpret without truly protecting it. Neither is a substitute for encryption.",example:"Exfiltrated data embedded in the low-order bits of vacation photos passes a filter that would have blocked an encrypted archive."},
{id:"s1_f21",domain:1,term:"Encryption Levels",definition:"Encryption can be applied at full-disk, partition, volume, file, database, or individual record level. Broader scope is simpler; narrower scope keeps data protected while the system is running and limits blast radius.",example:"Full-disk encryption protects a stolen laptop but not a logged-in session, so a record-level scheme is used for the card numbers inside the database."},
{id:"s1_f22",domain:1,term:"Key Stretching",definition:"Deliberately slowing password hashing with many iterations and memory cost, using PBKDF2, bcrypt, scrypt, or Argon2, so offline brute force becomes impractical even for weak passwords.",example:"A stolen hash database that would fall to plain SHA-256 in hours resists cracking for far longer when each guess costs 100 ms."},
// Domain 2 — added
{id:"s2_f17",domain:2,term:"DNS Attacks",definition:"Cache poisoning inserts false records into a resolver, domain hijacking steals control of registration, typosquatting registers lookalike domains, and DNS tunneling smuggles data inside queries. DNSSEC signs records to prevent forgery.",example:"Users typing the bank's name with one letter transposed land on an attacker-controlled clone that harvests credentials."},
{id:"s2_f18",domain:2,term:"Directory Traversal",definition:"Manipulating file path input with sequences such as dot-dot-slash to read files outside the intended directory. Mitigated by input validation, canonicalization, and running the service with least privilege.",example:"A document viewer that accepts a filename parameter is coaxed into returning the system password file instead of a PDF."},
{id:"s2_f19",domain:2,term:"CSRF (Cross-Site Request Forgery)",definition:"Tricking an authenticated browser into submitting an unintended request, since the session cookie is attached automatically. Defended with anti-CSRF tokens, SameSite cookies, and re-authentication for sensitive actions.",example:"A hidden image tag on a forum triggers a funds transfer on a banking site where the victim is still logged in."},
{id:"s2_f20",domain:2,term:"Replay Attack",definition:"Capturing valid traffic and resending it later to repeat an action or authentication. Defended with nonces, timestamps, sequence numbers, and session tokens that expire.",example:"A recorded authentication exchange is replayed to open a door; a challenge-response scheme makes each exchange unique and useless to replay."},
{id:"s2_f21",domain:2,term:"Session Hijacking",definition:"Taking over an authenticated session by stealing its token, usually through XSS, network capture, or a predictable session ID. Countered with TLS everywhere, HttpOnly and Secure cookie flags, and regenerating the ID after login.",example:"A stolen session cookie lets an attacker act as the user without ever knowing the password or triggering MFA."},
{id:"s2_f22",domain:2,term:"Pass-the-Hash",definition:"Authenticating with a captured password hash rather than the plaintext password, because some protocols accept the hash as proof. Mitigated by restricting privileged logons, credential guard features, and unique local admin passwords.",example:"An attacker who dumps hashes from one workstation moves laterally to others where the same local administrator hash is reused."},
{id:"s2_f23",domain:2,term:"Insider Threat",definition:"Risk originating from someone with legitimate access — malicious, negligent, or compromised. Hardest to detect because the activity uses authorized credentials. Countered with least privilege, separation of duties, and behaviour analytics.",example:"A departing employee downloads the full customer list in their final week, which looks like normal file access until volume is compared to their baseline."},
{id:"s2_f24",domain:2,term:"Watering Hole Attack",definition:"Compromising a legitimate site the target population is known to visit, so victims are infected during normal browsing rather than by a message sent to them.",example:"An industry association site is compromised so that every member firm visiting it receives a drive-by payload."},
{id:"s2_f25",domain:2,term:"Spyware, Adware, and Keyloggers",definition:"Spyware silently collects activity and data. Adware injects unwanted advertising and tracking. Keyloggers record keystrokes to capture credentials, and exist in both software and hardware form.",example:"A small inline device between keyboard and USB port captures every password typed and leaves no trace on disk for antivirus to find."},
{id:"s2_f26",domain:2,term:"Fileless Malware",definition:"Malicious code that runs in memory and abuses built-in tools such as scripting engines and management frameworks, leaving little or nothing on disk for signature-based scanners to detect.",example:"A macro launches an in-memory payload through a legitimate system binary, so the endpoint scan finds no malicious file to quarantine."},
{id:"s2_f27",domain:2,term:"Command and Control (C2) and Beaconing",definition:"The channel a compromised host uses to receive instructions and exfiltrate data. Beaconing is the regular check-in pattern, often disguised as ordinary web traffic, and its regularity is what detection keys on.",example:"A workstation contacting the same external host every 60 seconds with identical small requests is beaconing, even though it is plain HTTPS."},
{id:"s2_f28",domain:2,term:"Indicators of Compromise",definition:"Observable artifacts suggesting a breach: unusual outbound traffic, impossible travel logins, account lockouts, new scheduled tasks, disabled logging, unexpected privilege changes, or files with mismatched hashes.",example:"An account authenticating from two countries twenty minutes apart is an impossible travel indicator that warrants immediate investigation."},
{id:"s2_f29",domain:2,term:"Memory Injection and DLL Injection",definition:"Writing code into the address space of a running, trusted process so the malicious code inherits that process's privileges and reputation, evading controls that judge by process identity.",example:"Malicious code injected into a signed system process makes outbound connections that the firewall allows because it trusts that executable."},
{id:"s2_f30",domain:2,term:"Cryptographic Attacks",definition:"Birthday attacks exploit collision probability, collision attacks find two inputs with the same hash, downgrade attacks force a weaker protocol version, and brute force exhausts the key space.",example:"An on-path attacker strips the negotiation down to an obsolete cipher suite, then breaks traffic that would have been safe under the modern one."},
// Domain 3 — added
{id:"s3_f15",domain:3,term:"Microsegmentation",definition:"Applying security policy at the individual workload level so east-west traffic is controlled, rather than relying on a perimeter that only sees north-south flows. A core mechanism for implementing zero trust internally.",example:"Even after compromising a web server, the attacker cannot reach the file server because policy permits only that server to that database on one port."},
{id:"s3_f16",domain:3,term:"Segmentation Methods",definition:"VLANs separate broadcast domains logically, screened subnets isolate internet-facing services, physical separation uses distinct hardware, and an air gap removes network connectivity entirely.",example:"An industrial control network is air gapped, so the only path in is removable media — which is precisely how such networks have been compromised."},
{id:"s3_f17",domain:3,term:"Forward vs Reverse Proxy",definition:"A forward proxy sits in front of clients, filtering and logging their outbound requests. A reverse proxy sits in front of servers, terminating client connections and hiding the backend while adding caching and TLS offload.",example:"Employee web filtering uses a forward proxy; publishing an internal application safely to the internet uses a reverse proxy."},
{id:"s3_f18",domain:3,term:"NGFW vs UTM",definition:"A next-generation firewall adds application awareness, user identity, and integrated intrusion prevention to stateful inspection. Unified threat management bundles many security functions into one appliance, trading depth for simplicity.",example:"An NGFW rule can permit a collaboration application while blocking its file transfer feature, which a port-based rule cannot express."},
{id:"s3_f19",domain:3,term:"Load Balancer Resiliency",definition:"Distributes requests across backend servers using health checks to remove failed nodes automatically. It supports availability and enables maintenance without downtime, and often terminates TLS centrally.",example:"Patching happens by draining one node at a time out of the pool, so users never see an outage."},
{id:"s3_f20",domain:3,term:"VM Escape and Hypervisor Risk",definition:"A VM escape breaks out of a guest to reach the hypervisor or other guests, collapsing the isolation boundary. VM sprawl creates unmanaged and unpatched instances that nobody tracks.",example:"A hypervisor vulnerability lets code in a low-value test VM reach a production VM on the same host, so hypervisor patching is treated as critical."},
{id:"s3_f21",domain:3,term:"Container Security",definition:"Containers share the host kernel, so isolation is weaker than virtual machines. Risks include vulnerable base images, running as root, exposed orchestration APIs, and secrets baked into image layers.",example:"Scanning images in the registry catches a vulnerable library before it is deployed to hundreds of running containers."},
{id:"s3_f22",domain:3,term:"Serverless Architecture",definition:"Code runs in provider-managed ephemeral functions with no server to patch. The provider secures the platform while you remain responsible for code, dependencies, function permissions, and data.",example:"A function granted broad storage permissions becomes an exfiltration path even though there is no server for an attacker to log into."},
{id:"s3_f23",domain:3,term:"ICS and SCADA",definition:"Industrial control and supervisory systems run physical processes. They prioritize availability and safety over confidentiality, often run unpatchable legacy software, and use protocols with no built-in authentication.",example:"A controller that cannot be taken offline for patching is isolated behind a firewall and monitored — a compensating control rather than a fix."},
{id:"s3_f24",domain:3,term:"IoT Security",definition:"Embedded devices frequently ship with default credentials, no update mechanism, and weak or absent encryption. They are best isolated onto their own segment with tightly restricted outbound access.",example:"Cameras left on default passwords are enrolled into a botnet; placing them on an isolated VLAN with no internet egress removes the exposure."},
{id:"s3_f25",domain:3,term:"Secure Protocol Substitutions",definition:"Replace cleartext protocols with encrypted equivalents: Telnet with SSH, FTP with SFTP or FTPS, HTTP with HTTPS, SNMPv1 and v2c with SNMPv3, LDAP with LDAPS, and POP or IMAP with their TLS versions.",example:"An SNMPv2c community string crosses the network in the clear, so a capture hands an attacker read access to every device."},
{id:"s3_f26",domain:3,term:"SD-WAN",definition:"Software-defined WAN steers traffic across multiple transports — broadband, cellular, private circuits — using centrally defined application-aware policy, with encrypted overlay tunnels between sites.",example:"Voice traffic is pinned to the low-latency circuit while backups use cheap broadband, and policy is pushed from one controller to every branch."},
{id:"s3_f27",domain:3,term:"Hardening and Baselines",definition:"Reducing attack surface by disabling unneeded services and ports, removing default accounts, applying secure configuration baselines, and enforcing least functionality. Baselines make drift measurable.",example:"A standard server build closes unused ports and removes sample applications, and any host that later drifts from the baseline is flagged automatically."},
// Domain 4 — added
{id:"s4_f17",domain:4,term:"Authentication Factors",definition:"Something you know (password, PIN), something you have (token, phone, smart card), and something you are (biometric). Location and behaviour are attributes, not factors. True MFA combines different categories.",example:"A password plus a security question is still single factor, because both are things you know."},
{id:"s4_f18",domain:4,term:"Modern Password Policy",definition:"Current guidance favours length over complexity, screens against known-breached passwords, removes forced periodic expiration absent evidence of compromise, and pairs the password with MFA.",example:"Forcing a change every 30 days produced Summer2026 followed by Summer2026a — long passphrases plus breach screening protect far better."},
{id:"s4_f19",domain:4,term:"Federation and SSO",definition:"Federation lets one organization's identity provider vouch for a user to another organization's service. Single sign-on gives one authentication event access to many applications within a trust relationship.",example:"Signing in to the corporate identity provider once grants access to dozens of applications without re-entering credentials at each one."},
{id:"s4_f20",domain:4,term:"Kerberos",definition:"A ticket-based authentication protocol using a Key Distribution Center. The client obtains a ticket-granting ticket, then service tickets for individual resources. It requires closely synchronized clocks and provides mutual authentication.",example:"A clock skew of more than five minutes causes Kerberos logons to fail outright, which is why NTP is a security dependency."},
{id:"s4_f21",domain:4,term:"RADIUS vs TACACS+",definition:"RADIUS uses UDP, encrypts only the password, and combines authentication with authorization — common for network access and 802.1X. TACACS+ uses TCP, encrypts the whole payload, and separates the three AAA functions, making it better for device administration.",example:"TACACS+ can permit a junior admin to run show commands but not configuration commands, because authorization is evaluated per command."},
{id:"s4_f22",domain:4,term:"Identity Lifecycle (Joiner, Mover, Leaver)",definition:"Provisioning grants access on hire, access is adjusted on role change, and deprovisioning removes it promptly on departure. Failing to revoke on role change causes privilege creep.",example:"Someone who moved from finance to marketing years ago still holds finance permissions — a recertification review is what catches this."},
{id:"s4_f23",domain:4,term:"Separation of Duties and Job Rotation",definition:"Separation of duties splits a sensitive process so no single person can complete it alone. Job rotation and mandatory vacation expose fraud that depends on one person continuously controlling a process.",example:"The person who creates a vendor record cannot also approve payments to it, so an invented vendor requires collusion rather than one bad actor."},
{id:"s4_f24",domain:4,term:"Credentialed vs Non-Credentialed Scanning",definition:"A credentialed scan logs in and inspects installed software and configuration, producing accurate results with fewer false positives. A non-credentialed scan probes from outside and sees what an unauthenticated attacker would.",example:"The external view shows a handful of exposed services; the credentialed scan reveals dozens of missing patches invisible from the network."},
{id:"s4_f25",domain:4,term:"Vulnerability Management Workflow",definition:"Identify through scanning and intelligence, analyse and validate, prioritize by exploitability and asset value, remediate or mitigate, then rescan to confirm. Exceptions are documented with compensating controls.",example:"A critical finding on an internet-facing server outranks the same CVSS score on an isolated lab host, because environmental context drives priority."},
{id:"s4_f26",domain:4,term:"Threat Hunting",definition:"Proactively searching for adversary activity that automated detection missed, driven by hypotheses about attacker behaviour rather than by alerts. It assumes compromise and looks for evidence.",example:"Rather than waiting for an alert, the analyst queries for processes spawning scripting engines from document applications across all endpoints."},
{id:"s4_f27",domain:4,term:"Threat Intelligence Sources",definition:"Open-source intelligence, commercial feeds, information-sharing organizations, vendor advisories, dark web monitoring, and internal telemetry. Value depends on relevance, timeliness, and accuracy for your environment.",example:"A sector information-sharing group circulates indicators from an attack on a peer, letting members block the infrastructure before being targeted."},
{id:"s4_f28",domain:4,term:"SOAR",definition:"Security orchestration, automation, and response connects tools and executes playbooks automatically, handling routine triage and containment so analysts spend their time on judgement rather than repetition.",example:"On a confirmed phishing report, a playbook pulls the message from every mailbox, blocks the sender, and opens a ticket without human steps."},
{id:"s4_f29",domain:4,term:"Log Aggregation and Correlation",definition:"Collecting logs from endpoints, servers, network devices, applications, and cloud services into one platform where rules correlate events across sources. Requires synchronized time and protected, tamper-evident storage.",example:"A failed VPN logon means little alone, but correlated with a successful logon from another country minutes later it becomes an incident."},
{id:"s4_f30",domain:4,term:"Agent vs Agentless Monitoring",definition:"An agent runs on the host, giving deep visibility, offline collection, and response capability at the cost of deployment and resource overhead. Agentless collects remotely with nothing installed but sees less.",example:"Agentless scanning covers appliances that cannot run software, while endpoints get agents so a compromised host can be isolated remotely."},
{id:"s4_f31",domain:4,term:"Tabletop vs Simulation Exercises",definition:"A tabletop is a discussion-based walkthrough of roles and decisions. A simulation rehearses the response technically without affecting production. A full interruption test actually fails over and is the most conclusive and most disruptive.",example:"The tabletop revealed nobody knew who could declare an incident, a gap no amount of documentation review had surfaced."},
// Domain 5 — added
{id:"s5_f13",domain:5,term:"Governance Structures",definition:"Boards set direction and accept risk, committees provide oversight, executives own outcomes, and data owners make decisions about specific information assets. Governance decides policy; management executes it.",example:"A steering committee approves the security program and its budget, while the security team carries out the controls it authorized."},
{id:"s5_f14",domain:5,term:"Policy, Standard, Procedure, Guideline",definition:"A policy states intent and is mandatory. A standard specifies mandatory technical requirements. A procedure gives the step-by-step method. A guideline is recommended but optional.",example:"The policy requires encrypting sensitive data, the standard names the algorithm and key length, the procedure shows how to enable it, and the guideline suggests good key naming."},
{id:"s5_f15",domain:5,term:"Acceptable Use Policy",definition:"Defines permitted and prohibited use of organizational systems and data, and the consequences of violation. It is a directive control and the basis for enforcing action against misuse.",example:"Without a signed AUP, disciplining someone for running a personal business on company systems is far harder to defend."},
{id:"s5_f16",domain:5,term:"Vendor Risk Assessment",definition:"Evaluating a third party before and during engagement through questionnaires, audit reports, penetration test results, and evidence review — because their risk becomes yours when they hold your data or reach your network.",example:"A supplier with network access is assessed annually and contractually required to notify of any breach within a defined window."},
{id:"s5_f17",domain:5,term:"Internal vs External Compliance Reporting",definition:"Internal reporting informs management and the board about control effectiveness. External reporting satisfies regulators, customers, and certification bodies, and carries legal consequences for inaccuracy.",example:"A monthly internal dashboard tracks patch coverage, while an annual external attestation reports to customers on the same control."},
{id:"s5_f18",domain:5,term:"Audits and Attestation",definition:"First-party audits are internal self-assessment, second-party are conducted by a customer or partner, and third-party are independent. Attestation is a formal statement that findings are accurate, carrying accountability.",example:"An independent third-party audit satisfies customers in a way that an internal review of the same controls does not."},
{id:"s5_f19",domain:5,term:"Rules of Engagement",definition:"The agreed scope, timing, permitted techniques, in-scope and out-of-scope targets, escalation contacts, and handling of discovered data for a penetration test. Authorization in writing is what separates testing from crime.",example:"Rules of engagement exclude the production payment system and forbid denial of service, so the tester documents the weakness rather than exploiting it."},
{id:"s5_f20",domain:5,term:"Privacy Regulation Concepts",definition:"Common requirements include lawful basis for processing, consent, purpose limitation, data minimization, subject rights of access and erasure, breach notification deadlines, and restrictions on cross-border transfer.",example:"A customer requesting deletion forces the organization to locate every copy of their data, which is why a data inventory is a prerequisite."},
{id:"s5_f21",domain:5,term:"Owner, Custodian, and Steward",definition:"The data owner is accountable and sets classification and access decisions. The custodian implements and maintains the technical controls. The steward manages quality, definitions, and appropriate use.",example:"The finance director owns payroll data, IT operations acts as custodian running the backups, and the steward maintains the field definitions."},
{id:"s5_f22",domain:5,term:"Security Awareness Training",definition:"Recurring education covering phishing recognition, social engineering, safe handling of data, reporting procedures, and role-specific risks. Effectiveness is measured by reporting rates, not only by click rates.",example:"Phishing simulations paired with an easy report button turn the workforce into a detection sensor instead of just a smaller target."},
{id:"s5_f23",domain:5,term:"Change Management Controls",definition:"Formal approval, impact and risk analysis, testing, scheduled maintenance windows, stakeholder communication, documented backout procedures, and updated diagrams and records after the change.",example:"The backout plan is what turns a failed 2 a.m. upgrade into a thirty-minute event instead of an all-night outage."},
{id:"s5_f24",domain:5,term:"Quantitative vs Qualitative Risk Analysis",definition:"Quantitative assigns monetary values and calculates expected loss using SLE, ARO, and ALE. Qualitative ranks risk by judgement on scales such as high, medium, and low when reliable numbers are unavailable.",example:"An annualized loss expectancy of 40,000 justifies a 15,000 control on arithmetic, while reputational damage is ranked qualitatively as high."},
