{id:"n2_10",domain:2,question:"A multi-area OSPF network needs to add a new area for a recently acquired branch. The design team wants to connect it directly to an existing non-backbone area because no physical path to the backbone exists. Which statement is correct?",options:{A:"A virtual link through the transit area is required to logically attach the new area to area 0",B:"OSPF permits any area to connect to any other area without restriction",C:"Route redistribution from EIGRP will supply the missing backbone adjacency",D:"The new area must be configured as a stub area to bypass the backbone requirement"},answer:"A",lead:"OSPF requires every area to connect to the backbone, area 0. When physical topology makes that impossible, a virtual link tunnels the adjacency across a transit area — a non-backbone, non-stub area — to logically extend area 0 to the disconnected ABR.",why:{B:"Contradicts the fundamental hub-and-spoke area rule.",C:"Is unrelated; redistribution injects routes between protocols and does not create OSPF adjacencies.",D:"Confuses stub area behavior, which filters external LSAs but still requires backbone connectivity."}},
{id:"n2_11",domain:2,question:"A dual-homed enterprise wants inbound Internet traffic to prefer its primary ISP while keeping the secondary available for failover. Which BGP attribute should the enterprise manipulate on its advertisements to influence how external neighbors choose a path?",options:{A:"MED on inbound routes from the primary",B:"AS path prepending on the secondary link",C:"Weight on the primary link",D:"Local preference on the secondary link"},answer:"B",lead:"Inbound traffic is decided by other autonomous systems, so the enterprise must make one path look worse from the outside. Prepending its own AS number several times to advertisements sent out the secondary link lengthens the AS path, and since a shorter AS path is preferred, remote networks favor the primary.",why:{A:"A (MED) can influence inbound but only from a directly connected neighbor AS and is frequently ignored, making it far less reliable than prepending.",C:"C (weight) is Cisco-proprietary and local to a single router, also affecting outbound only.",D:"D (local preference) influences how routers inside the local AS choose OUTBOUND paths and is never advertised to eBGP peers."}},
{id:"n2_12",domain:2,question:"An access port intended for a single workstation is configured with port security, a maximum of one MAC address, and violation mode set to restrict. A user connects a small hub with two laptops. What happens?",options:{A:"The port shuts down and automatically recovers after 300 seconds",B:"Both laptops work normally because restrict mode only logs the event",C:"Frames from the additional MAC are dropped and a violation counter increments, while the port stays up",D:"The port is immediately placed into err-disabled state and must be manually reset"},answer:"C",lead:"Port security has three violation modes. Restrict drops offending frames, increments the violation counter, and generates a syslog or SNMP notification, but leaves the port operational for the permitted MAC.",why:{A:"Describes shutdown mode combined with err-disable recovery, which is not configured here.",B:"Describes protect mode, which drops silently without any counter or notification.",D:"Describes shutdown mode, which is the default and the most aggressive."}},
{id:"n2_13",domain:2,question:"A wireless survey of a three-floor office shows heavy retransmissions and low throughput in the 2.4 GHz band, with APs on channels 1, 3, 6, 9, and 11. Which change will MOST improve performance?",options:{A:"Raise the transmit power on every AP to the maximum",B:"Disable the 5 GHz radios so clients concentrate on 2.4 GHz",C:"Increase the channel width on all 2.4 GHz radios to 40 MHz",D:"Reconfigure all APs to use only channels 1, 6, and 11"},answer:"D",lead:"In the 2.4 GHz band only channels 1, 6, and 11 are non-overlapping in North America. Channels 3 and 9 partially overlap their neighbors, producing adjacent-channel interference, which is more damaging than co-channel interference because the radios cannot even hear each other well enough to take turns.",why:{A:"Increases the size of every interference zone and creates clients that hear the AP but cannot be heard back.",B:"Removes the cleaner band and pushes more load onto the congested one.",C:"Makes it dramatically worse, since a 40 MHz channel consumes most of the usable 2.4 GHz spectrum."}},
{id:"n2_14",domain:2,question:"A company must deploy wireless in a warehouse where each employee authenticates with their own domain credentials, and a compromised account must be revocable without touching any other device. Which wireless security configuration meets this requirement?",options:{A:"WPA2-Enterprise with 802.1X and a RADIUS server",B:"WPA3-Personal with SAE and a strong passphrase",C:"Open authentication with a captive portal and MAC filtering",D:"WPA2-Personal with a pre-shared key rotated quarterly"},answer:"A",lead:"Enterprise mode uses 802.1X with a RADIUS server so every user authenticates with unique credentials against the directory. Disabling one account instantly revokes that user's access while everyone else is unaffected — the specific requirement in the stem.",why:{B:"B and D both use a shared secret; revoking one person means changing the key on every device.",C:"Provides no link-layer encryption, and MAC filtering is trivially defeated by spoofing.",D:"B and D both use a shared secret; revoking one person means changing the key on every device."}},
{id:"n2_15",domain:2,question:"Users on laptops report that voice-over-WiFi calls drop for one to two seconds every time they walk between areas of a large building. The wireless network uses WPA2-Enterprise with EAP-TLS. Which standard should be enabled to MOST directly reduce this delay?",options:{A:"802.11e wireless multimedia",B:"802.11r fast BSS transition",C:"802.11w management frame protection",D:"802.11k neighbor reports"},answer:"B",lead:"With 802.1X, a normal roam requires a full reauthentication against RADIUS, which takes hundreds of milliseconds or more and is audible on a call. 802.11r (Fast BSS Transition) caches key material so the client can complete the handoff without repeating the full EAP exchange.",why:{A:"Provides QoS prioritization for media but does not affect roaming time.",C:"Protects deauthentication and disassociation frames from spoofing, a security control.",D:"Helps the client choose a better target AP faster but does not shorten the authentication itself."}},
{id:"n2_16",domain:2,question:"An engineer needs to establish a wireless bridge between two buildings 1.5 km apart with clear line of sight. Which antenna type is the MOST appropriate at each end?",options:{A:"Patch panel antenna with 90-degree coverage",B:"Omnidirectional",C:"Parabolic dish",D:"Dipole rubber duck"},answer:"C",lead:"A parabolic dish is a highly directional, high-gain antenna that concentrates RF energy into a narrow beam. This is what makes a long-distance point-to-point bridge viable and simultaneously reduces interference from and toward other directions.",why:{A:"Is semi-directional and suited to covering a wall-mounted area indoors or a short outdoor span.",B:"Radiates a doughnut pattern in all horizontal directions, wasting nearly all energy on a point-to-point link.",D:"Is a low-gain omnidirectional antenna intended for local client coverage."}},
{id:"n2_17",domain:2,question:"A high-density lecture hall using Wi-Fi 6 shows acceptable signal strength but poor throughput when 200 students connect simultaneously. Which Wi-Fi 6 feature MOST directly addresses many small, simultaneous transmissions from dense client populations?",options:{A:"Band steering",B:"Channel bonding to 160 MHz",C:"Beamforming",D:"OFDMA"},answer:"D",lead:"OFDMA subdivides a channel into resource units so a single transmission opportunity can serve multiple clients at once. In dense environments where most frames are small, this dramatically reduces the airtime overhead of contending for the medium one client at a time.",why:{A:"Moves capable clients to 5 GHz, which helps but does not address contention within a band.",B:"Increases per-client peak rate but reduces the number of available channels, worsening co-channel interference in a dense deployment.",C:"Focuses energy toward a specific client and improves individual signal quality, not multi-client efficiency."}},
{id:"n2_18",domain:2,question:"A technician is documenting a new IDF. Which pair of terms correctly describes the termination point where horizontal cabling from workstations lands, and the space where the building's incoming service provider circuits terminate?",options:{A:"Patch panel in the IDF, and demarcation point in the MDF",B:"Cross-connect in the MDF, and patch panel at the workstation",C:"66 block in the IDF, and smart jack in the workstation area",D:"Demarcation point in the IDF, and patch panel in the MDF"},answer:"A",lead:"Horizontal runs from work areas terminate on a patch panel in the intermediate distribution frame serving that floor or zone. The demarcation point is where the service provider's responsibility ends and the customer's begins, and it lives in the main distribution frame or entrance facility.",why:{B:"Places a patch panel at the workstation, where a wall jack belongs.",C:"Misplaces the smart jack, which is provider equipment at the demarc, not in the work area.",D:"Reverses both roles."}},
{id:"n2_19",domain:2,question:"Two routers provide redundant gateways for VLAN 50. Hosts are configured with a single default gateway of 10.50.0.1, which must remain reachable if either router fails. Which technology provides this, and what does it use?",options:{A:"A routing protocol adjacency that reconverges when a router fails",B:"A first hop redundancy protocol presenting a shared virtual IP and virtual MAC",C:"DHCP option 121 pushing an alternate gateway to hosts",D:"An EtherChannel bundle spanning both routers"},answer:"B",lead:"FHRPs such as HSRP, VRRP, and GLBP let two or more routers share a virtual IP and virtual MAC address. Hosts point at the virtual IP and never need to change; if the active router fails, the standby assumes both addresses and forwarding continues.",why:{A:"Reconverges router-to-router paths but does nothing for a host whose statically configured gateway address is gone.",C:"Can push classless static routes but hosts will not fail over on their own in the required timeframe.",D:"Bundles links between two devices and does not provide gateway redundancy."}},
{id:"n2_20",domain:2,question:"An administrator needs a specific printer to always receive the same IP address from DHCP while remaining centrally managed, and the address must fall inside the existing scope range. Which approach is correct?",options:{A:"Set the printer's DHCP lease duration to unlimited",B:"Shrink the scope so the desired address falls outside it, then assign it statically",C:"Create a DHCP reservation binding the printer's MAC to the desired address",D:"Configure a static IP on the printer inside the scope range"},answer:"C",lead:"A reservation maps a client's MAC address to a fixed IP within the scope. The printer still uses DHCP, so it also receives gateway, DNS, and option updates centrally, and the server will never hand that address to anyone else.",why:{A:"Does not guarantee the same address after a long outage or server rebuild.",B:"Works but is administratively clumsy and loses central management, which the stem requires.",D:"Risks a duplicate address conflict because the server does not know the address is taken, and it bypasses centralized option management."}},
{id:"n2_21",domain:2,question:"After deploying lightweight access points at a branch, the APs obtain IP addresses but never join the wireless LAN controller located at headquarters. Which TWO items should the technician verify FIRST? (Select TWO)",options:{A:"That the branch switch ports are configured as trunks with all VLANs allowed",B:"That UDP ports 5246 and 5247 are permitted end to end for CAPWAP",C:"That the APs have 802.11r enabled",D:"That DHCP option 43 or a DNS entry directs the APs to the controller",E:"That the APs are configured with matching SSIDs locally"},answer:["B", "D"],lead:"A lightweight AP must first discover the controller and then build a CAPWAP tunnel. Discovery commonly relies on DHCP option 43 or a DNS record such as CISCO-CAPWAP-CONTROLLER. The tunnel itself uses UDP 5246 for control and 5247 for data, so a firewall between the branch and headquarters must permit both.",why:{A:"Is unnecessary since the AP typically needs only its management VLAN as an access port.",C:"Is a roaming feature and has no bearing on joining.",E:"Is wrong because SSIDs are pushed from the controller after the join, not configured on the AP."}},
{id:"n2_22",domain:2,question:"A guest wireless network must allow Internet access while preventing guest devices from reaching each other or any internal resource. Which combination of controls BEST enforces this?",options:{A:"A separate SSID with WPA3-Personal and a rotating passphrase",B:"MAC filtering on the guest SSID with a captive portal",C:"Reduced transmit power on the guest radios and a shortened DHCP lease",D:"Client isolation on the SSID plus an ACL permitting only Internet-bound traffic"},answer:"D",lead:"Two distinct requirements need two controls. Client isolation (also called peer-to-peer blocking) prevents wireless clients on the same SSID from communicating with each other. An ACL applied at the guest VLAN's gateway denies traffic toward internal subnets while permitting Internet destinations.",why:{A:"Encrypts the air but leaves guests fully able to reach one another and internal subnets.",B:"Addresses authentication only and is easily bypassed by MAC spoofing.",C:"Is a coverage adjustment and provides no traffic separation."}},
{id:"n2_23",domain:2,question:"A field technician terminates both ends of a new patch cable, using T568B on one end and T568A on the other, and uses it to connect a modern switch to a modern router. What is the MOST likely outcome?",options:{A:"The link comes up normally because Auto-MDIX corrects the pinout",B:"The link comes up but negotiates only 10 Mbps half duplex",C:"The link comes up but exhibits continuous CRC errors",D:"The link fails entirely because the wire map is incorrect"},answer:"A",lead:"Terminating T568A on one end and T568B on the other produces a crossover cable, which is a valid and correctly wired configuration. Modern gigabit interfaces implement Auto-MDIX and detect the crossover automatically, so the link comes up without issue. On legacy fixed-pinout equipment the crossover would actually have been required between certain device types.",why:{B:"Describes a duplex or autonegotiation failure, not a pinout convention.",C:"Indicates physical damage, EMI, or excessive length.",D:"Would apply to a genuinely miswired cable with split pairs or crossed individual conductors."}},
{id:"n2_24",domain:2,question:"A data center is standardizing on a fiber connector that houses two fibers in a single small housing, doubling port density compared with the older square connector it replaces. Which connector is being described?",options:{A:"SC",B:"LC",C:"MPO",D:"ST"},answer:"B",lead:"The LC (Lucent Connector) is a small form factor connector, roughly half the size of SC, and duplex LC housings carry both transmit and receive fibers in one clip. It is the standard connector for SFP and SFP+ optics in modern data centers.",why:{A:"A (SC) is the larger square push-pull connector being replaced.",C:"C (MPO/MTP) is a high-density ribbon connector carrying 12 or more fibers, used for parallel optics such as 40G and 100G breakouts, not a two-fiber duplex replacement.",D:"D (ST) is a round bayonet-style connector common in older multimode installations."}},
{id:"n2_25",domain:2,question:"An older 802.3af switch must power a new outdoor access point that requires 802.3at. Purchasing a new switch is not an option this quarter. What is the MOST appropriate solution?",options:{A:"Shorten the cable run to reduce voltage drop below the af limit",B:"Use a PoE splitter at the AP to combine two switch ports",C:"Install a PoE+ injector inline between the switch port and the AP",D:"Configure the switch port to force maximum power output"},answer:"C",lead:"A midspan PoE+ injector has its own power supply and inserts 802.3at power onto the Ethernet run, independent of the switch's capability. The switch continues to provide data only.",why:{A:"Reduces cable loss slightly but cannot raise the source beyond the af ceiling.",B:"Describes a splitter's opposite function — a splitter separates power and data at the powered device end and cannot aggregate two ports.",D:"Cannot exceed the hardware's 802.3af design limit of 15.4 W."}},
{id:"n2_26",domain:2,question:"An engineer configures a Layer 3 switch port with the command sequence that removes it from Layer 2 operation and assigns it an IP address directly. Which term describes the resulting interface, and when is it preferred over an SVI?",options:{A:"A trunk port, preferred for carrying multiple VLANs to another switch",B:"A management port, preferred for out-of-band administration",C:"An access port, preferred for connecting end-user workstations",D:"A routed port, preferred for point-to-point links to another router or Layer 3 device"},answer:"D",lead:"Disabling switchport mode converts the interface into a routed port with its own IP address and no VLAN association. It is the right choice for a Layer 3 point-to-point link — for example, a leaf-to-spine uplink — because it removes the interface from spanning tree and eliminates the need for a VLAN that carries only two devices.",why:{A:"A and C are both Layer 2 modes that a routed port explicitly is not.",B:"Describes a dedicated out-of-band interface, which is a separate physical port on most platforms.",C:"A and C are both Layer 2 modes that a routed port explicitly is not."}},
{id:"n2_27",domain:2,question:"A technician runs a discovery command on a switch and sees the output below. Which conclusion is BEST supported?",pre:"Device ID       Local Intf   Hold-time  Capability   Port ID\nAP-3F-WEST      Gi1/0/14     120        B,R          GigabitEthernet0\nSW-FLOOR3-B     Gi1/0/47     120        B,R          GigabitEthernet1/0/48\nPHONE-SEA0142   Gi1/0/22     180        B,T          Port 1",options:{A:"Gi1/0/47 connects to another switch and is the logical uplink to verify for trunking",B:"Gi1/0/22 should be reconfigured as a trunk to support the phone",C:"All three neighbors are wireless access points on the same VLAN",D:"The switch has lost its neighbor relationship with the core"},answer:"A",lead:"The capability flags identify device roles: B is bridge or switch, R is router, T is telephone. SW-FLOOR3-B advertises bridge and router capability with a port ID of GigabitEthernet1/0/48, which is the signature of a switch-to-switch uplink. That is the interface to check for trunk configuration.",why:{B:"Is wrong because a phone port normally uses an access VLAN plus a voice VLAN, not a trunk.",C:"Misreads the flags, since only the AP entry represents a wireless device.",D:"Is unsupported, as the output shows active neighbors with valid hold times."}},
{id:"n2_28",domain:2,question:"An administrator must permit only branch office subnets 10.20.0.0/24 through 10.20.3.0/24 in an access control entry, using a single line with a wildcard mask. Which wildcard mask is correct?",options:{A:"0.0.0.255",B:"0.0.3.255",C:"255.255.252.0",D:"0.0.255.255"},answer:"B",lead:"A wildcard mask is the inverse of a subnet mask; zero bits must match and one bits are ignored. Covering four consecutive /24s means summarizing to 10.20.0.0/22, whose subnet mask is 255.255.252.0. Inverting that gives 0.0.3.255.",why:{A:"A (0.0.0.255) matches only a single /24.",C:"Is the subnet mask itself, not its inverse — a very common mix-up.",D:"D (0.0.255.255) matches all of 10.20.0.0/16, far more than intended."}},
{id:"n2_29",domain:2,question:"During a migration, an engineer needs a router to prefer a backup path only if the primary next hop becomes unreachable, using static routes alone with no dynamic protocol. Which configuration accomplishes this?",options:{A:"A static route to the backup with a lower administrative distance than the primary",B:"A default route pointing at both next hops with a longer prefix on the backup",C:"A floating static route with an administrative distance higher than the primary route",D:"Two equal-cost static routes so the router load-balances and drops the failed path"},answer:"C",lead:"A floating static route is configured to the same destination as the primary but with a deliberately higher administrative distance. It stays out of the routing table while the primary is valid, and installs automatically the moment the primary is withdrawn.",why:{A:"Makes the backup the preferred path at all times, inverting the requirement.",B:"Would produce inconsistent behavior and is not how default-route failover is implemented.",D:"Causes both paths to be used simultaneously, which is load sharing rather than failover."}},
{id:"n2_30",domain:2,question:"An organization wants its wireless network to resist offline dictionary attacks against captured handshakes and to provide forward secrecy, while still using a shared passphrase because it has no RADIUS infrastructure. Which standard should be deployed?",options:{A:"WPA2-Enterprise with PEAP",B:"WPA3-Enterprise with 192-bit mode",C:"WPA2-Personal with a 20-character passphrase",D:"WPA3-Personal using SAE"},answer:"D",lead:"WPA3-Personal replaces the WPA2 four-way handshake's PSK exchange with Simultaneous Authentication of Equals, a dragonfly key exchange. An attacker who captures the handshake cannot mount an offline dictionary attack against it, and each session derives unique keys, providing forward secrecy — all while keeping a shared passphrase.",why:{A:"A and B both require the RADIUS infrastructure the organization explicitly lacks.",B:"A and B both require the RADIUS infrastructure the organization explicitly lacks.",C:"Remains vulnerable to offline cracking regardless of passphrase length; length only raises the cost."}},
{id:"n2_31",domain:2,question:"A branch router must translate all internal traffic from 192.168.7.0/24 to its outside interface address. Which NAT configuration element specifically enables many-to-one translation?",options:{A:"The overload keyword applied to the NAT statement",B:"A route map matching the inside interface",C:"A NAT pool with a single address defined",D:"An inside static translation for each host"},answer:"A",lead:"Overload is what turns NAT into PAT. It instructs the router to track unique source port numbers so hundreds of inside hosts can share a single outside address, with the translation table distinguishing sessions by port.",why:{B:"Can influence which traffic is translated but does not by itself enable port multiplexing.",C:"Without overload creates dynamic NAT, which is one-to-one — the first host takes the address and every subsequent host fails until it is released.",D:"Is one-to-one and does not scale to a whole subnet."}},
{id:"n2_32",domain:2,question:"A new switch is installed and every access port is configured with PortFast. Users on those ports connect normally, but the network team is concerned about the risk this introduces. Which risk are they MOST likely concerned about?",options:{A:"PortFast disables MAC address learning on the port",B:"A user connecting a switch could create a loop that PortFast allows to form instantly",C:"PortFast forces the port to become the spanning tree root",D:"PortFast prevents the port from ever entering the forwarding state"},answer:"B",lead:"PortFast bypasses the listening and learning states so a port jumps straight to forwarding. That is safe for an end host but dangerous if someone plugs in a switch or loops two ports together, because the loop begins forwarding before spanning tree can react. This is exactly why PortFast should always be paired with BPDU Guard.",why:{A:"Is false; MAC learning continues normally.",C:"Describes what Root Guard prevents and is not a PortFast behavior.",D:"Is the opposite of what PortFast does."}},
{id:"n2_33",domain:2,question:"A rack of network equipment must ride through short utility interruptions and shut down gracefully during extended outages. The equipment draws 1,400 W. Which specification should the engineer verify FIRST when sizing the UPS?",options:{A:"The input receptacle type required by the circuit",B:"The physical rack unit height of the chassis",C:"The VA rating adjusted for power factor, plus runtime at the expected load",D:"The number of outlets on the rear panel"},answer:"C",lead:"UPS capacity is published in volt-amperes, which is apparent power, while equipment draws real power in watts. Dividing watts by the power factor gives the required VA. Runtime then depends on battery capacity at that specific load, and it is nonlinear — a UPS rated for 20 minutes at half load may deliver only a few minutes at full load.",why:{A:"A, B, and D are all real installation considerations, but none determine whether the UPS can actually carry the load for the needed duration.",B:"A, B, and D are all real installation considerations, but none determine whether the UPS can actually carry the load for the needed duration.",D:"A, B, and D are all real installation considerations, but none determine whether the UPS can actually carry the load for the needed duration."}},
{id:"n2_34",domain:2,question:"An engineer configures a switch virtual interface for VLAN 60 and assigns it an address, but the interface remains in a down/down state. VLAN 60 exists in the VLAN database. What is the MOST likely reason?",options:{A:"The IP address assigned overlaps another SVI on the same switch",B:"The SVI requires the no switchport command before it can come up",C:"An SVI cannot come up until a routing protocol is enabled",D:"No access port in VLAN 60 is up, and the VLAN is not allowed on any active trunk"},answer:"D",lead:"An SVI stays down until VLAN 60 is active on the switch, which requires at least one access port in that VLAN in the up state, or the VLAN carried on an up trunk. Simply creating the VLAN and the interface is not enough.",why:{A:"Would produce an explicit overlapping address error, and the stem gives no indication of that.",B:"Applies to converting a physical port to a routed port, not to an SVI.",C:"Is false — an SVI comes up as a connected interface with no routing protocol at all."}},
{id:"n2_35",domain:2,question:"A campus is replacing autonomous access points with a controller-based deployment. Which TWO operational advantages does the controller-based model provide? (Select TWO)",options:{A:"Configuration pushed to all APs from a single point rather than per device",B:"Centralized RF management including automatic channel and power assignment",C:"Guaranteed operation of all wireless services if the controller fails",D:"Removal of the requirement for a wireless site survey",E:"Elimination of the need for PoE at the access layer"},answer:["A", "B"],lead:"Controller-based deployments centralize both the radio resource management — the controller observes the whole RF environment and assigns channels and power to minimize interference — and the configuration, so SSIDs, security policy, and firmware are managed once and applied everywhere.",why:{C:"Is false in a centralized model, where controller loss can disrupt service unless local switching or controller redundancy is deployed.",D:"Is false, since a survey remains essential to plan physical placement and coverage.",E:"Is unrelated; APs still need power regardless of architecture."}},
{id:"n3_01",domain:3,question:"A syslog collector is configured to record messages at severity level 4 and below. Which of the following will be recorded?",options:{A:"Emergency, alert, critical, error, and warning messages",B:"Only warning messages",C:"Warning, notice, informational, and debug messages",D:"Informational and debug messages only"},answer:"A",lead:"Syslog severity runs from 0 (emergency) to 7 (debug), and lower numbers are MORE severe. Configuring level 4 captures level 4 (warning) plus everything more severe: 3 error, 2 critical, 1 alert, and 0 emergency.",why:{B:"Ignores that the setting is a threshold, not an exact match.",C:"Lists level 4 and everything LESS severe, which reverses the numbering — the single most common syslog mistake.",D:"Captures only levels 6 and 7, the least severe messages."}},
{id:"n3_02",domain:3,question:"A security policy requires that all SNMP polling be both authenticated and encrypted. Which SNMP version and security level satisfies this?",options:{A:"SNMPv3 with noAuthNoPriv",B:"SNMPv3 with authPriv",C:"SNMPv2c with a complex community string",D:"SNMPv3 with authNoPriv"},answer:"B",lead:"SNMPv3 defines three security levels. Only authPriv provides both authentication of the message source and encryption of the payload, satisfying a requirement for confidentiality as well as integrity.",why:{A:"Provides neither authentication nor encryption and is effectively SNMPv1 behavior with a v3 header.",C:"Sends the community string and all data in cleartext, providing neither.",D:"Authenticates but sends data in cleartext, so it fails the encryption requirement."}},
{id:"n3_03",domain:3,question:"A WAN circuit is saturated during business hours. Management asks which internal hosts and applications consume the most bandwidth, broken down over the last 30 days. Which data source BEST answers this?",options:{A:"A full packet capture taken during a saturated period",B:"SNMP interface counters polled every five minutes",C:"Flow data such as NetFlow or IPFIX exported from the WAN router",D:"Syslog messages from the WAN router"},answer:"C",lead:"Flow records summarize every conversation by source, destination, port, protocol, and byte count. That is exactly the per-host and per-application breakdown requested, and because flow records are compact they can be retained for 30 days economically.",why:{A:"Provides complete detail but is impractical to store for a month and only covers the window it was running.",B:"Shows total utilization on the interface but cannot attribute it to any host or application.",D:"Records events, not traffic volumes."}},
{id:"n3_04",domain:3,question:"A business function can tolerate losing at most 15 minutes of transactions, and must be operational again within 4 hours of an outage. Which values are being described?",options:{A:"MTTR of 15 minutes and MTBF of 4 hours",B:"RTO of 15 minutes and RPO of 4 hours",C:"RPO of 4 hours and MTTR of 15 minutes",D:"RPO of 15 minutes and RTO of 4 hours"},answer:"D",lead:"Recovery Point Objective measures acceptable DATA loss and therefore looks backward from the outage — 15 minutes of transactions. Recovery Time Objective measures acceptable DOWNTIME and looks forward — 4 hours to restore service. A useful memory hook is that RPO drives backup frequency while RTO drives recovery infrastructure.",why:{A:"A and C introduce mean time metrics, which describe reliability and repair averages rather than recovery targets.",B:"Swaps the two definitions.",C:"A and C introduce mean time metrics, which describe reliability and repair averages rather than recovery targets."}},
{id:"n3_05",domain:3,question:"A device has a mean time between failures of 4,000 hours and a mean time to repair of 4 hours. What is its approximate availability?",options:{A:"99.9%",B:"99.5%",C:"99%",D:"99.99%"},answer:"A",lead:"Availability equals MTBF divided by the sum of MTBF and MTTR: 4000 / (4000 + 4) = 4000 / 4004 = 0.999001, or approximately 99.9 percent.",why:{B:"B and C understate the result of the calculation.",C:"B and C understate the result of the calculation.",D:"D (99.99%) would require MTTR to drop to about 0.4 hours at the same MTBF."},note:"Note that 99.9 percent still permits roughly 8.8 hours of downtime per year."},
{id:"n3_06",domain:3,question:"An organization runs a full backup every Sunday and a differential backup every weeknight. The file server fails Thursday afternoon. Which backup sets are required for a complete restore, and why?",options:{A:"Wednesday's differential only, since differentials are self-contained",B:"Sunday's full plus Wednesday's differential only",C:"Sunday's full plus Monday, Tuesday, and Wednesday differentials",D:"Sunday's full plus Thursday's differential, which has not yet run"},answer:"B",lead:"A differential backup captures everything changed since the last FULL backup, so each night's differential supersedes the previous one and grows larger. Restoring requires only the full plus the single most recent differential — Wednesday's, since Thursday's had not yet run at the time of failure.",why:{A:"Ignores that a differential contains only changes, not a complete data set.",C:"Describes an INCREMENTAL restore chain, where each backup captures only changes since the last backup of any type.",D:"References a backup that does not exist."}},
{id:"n3_07",domain:3,question:"A company's disaster recovery plan calls for a facility with hardware, network connectivity, and current data replicas, capable of assuming production within about two hours. Which site type is required?",options:{A:"Warm site",B:"Mobile site",C:"Hot site",D:"Cold site"},answer:"C",lead:"A hot site is fully equipped and continuously synchronized with production data, so cutover takes minutes to a couple of hours. It is the most expensive option, justified only when the RTO is very short.",why:{A:"A (warm site) has hardware and connectivity but data must be restored from backup, typically requiring a day or more.",B:"Is a deployable trailer or container and does not inherently meet a two-hour RTO.",D:"D (cold site) provides only space, power, and cooling, requiring hardware procurement and taking days to weeks."}},
{id:"n3_08",domain:3,question:"An organization applies the 3-2-1 backup rule. Which arrangement satisfies it?",options:{A:"Three copies at one site, two of which are encrypted, and one verified restore",B:"Three full backups per week, retained for two months, at one location",C:"Three backup servers, two administrators, and one restore test per year",D:"Three copies of the data, on two different media types, with one copy off site"},answer:"D",lead:"The 3-2-1 rule specifies three total copies of the data (the production copy plus two backups), stored on at least two distinct media or storage types, with at least one copy kept off site to survive a site-level disaster such as fire, flood, or ransomware that spreads across the LAN.",why:{A:"A, B, and C all describe reasonable practices, but none of them match the actual definition of the rule.",B:"A, B, and C all describe reasonable practices, but none of them match the actual definition of the rule.",C:"A, B, and C all describe reasonable practices, but none of them match the actual definition of the rule."}},
{id:"n3_09",domain:3,question:"A change advisory board is reviewing a firmware upgrade for a core switch. Which element of the change request is MOST critical to approve before the maintenance window begins?",options:{A:"A tested rollback plan that restores the prior known-good state",B:"An updated network diagram reflecting the new firmware version",C:"A communication plan notifying users of the outage",D:"A purchase order for replacement hardware"},answer:"A",lead:"Firmware upgrades on core infrastructure carry real risk of an unbootable device or unexpected behavior. A documented and tested rollback (backout) plan is what bounds the blast radius, allowing the team to return to a working state inside the maintenance window rather than extending an outage into business hours.",why:{B:"Is post-change documentation.",C:"Is genuinely important but does not reduce technical risk.",D:"Is procurement, not change control."}},
{id:"n3_10",domain:3,question:"An administrator needs to reach the console of a router at a remote site after a misconfigured ACL cut off all IP connectivity to it. Which access method makes this possible?",options:{A:"An HTTPS session to the device's web management page",B:"Out-of-band management through a console server on a cellular or separate circuit",C:"A jump box located inside the remote site's server VLAN",D:"An SSH session sourced from the loopback interface"},answer:"B",lead:"Out-of-band management uses a completely independent path — a console server or terminal server reached via cellular modem or a dedicated circuit — that does not depend on the production network being functional. That independence is exactly what makes it valuable when a configuration error severs in-band access.",why:{A:"A, C, and D are all in-band methods that traverse the very network path the ACL has broken, so none of them can reach the device.",C:"A, C, and D are all in-band methods that traverse the very network path the ACL has broken, so none of them can reach the device.",D:"A, C, and D are all in-band methods that traverse the very network path the ACL has broken, so none of them can reach the device."}},
{id:"n3_11",domain:3,question:"Remote employees need access to internal applications, but the security team requires that all Internet browsing also be inspected by the corporate proxy while users are connected. Which VPN configuration meets this?",options:{A:"Clientless SSL VPN through a web portal",B:"A site-to-site IPsec tunnel to each employee's home router",C:"Full tunnel, which sends all client traffic through the VPN",D:"Split tunnel, which sends only corporate subnets through the VPN"},answer:"C",lead:"Full tunnel forces every packet the client generates — including public Internet requests — through the VPN, where corporate proxies, filters, and inspection apply. The cost is higher bandwidth consumption at the concentrator.",why:{A:"Provides browser-based access to specific applications and does not control the rest of the device's traffic.",B:"Is impractical to manage per employee and does not address client traffic policy.",D:"Sends Internet traffic directly out the user's local connection, bypassing corporate inspection entirely — the opposite of the requirement."}},
{id:"n3_12",domain:3,question:"A monitoring team wants to capture a copy of all traffic traversing a specific switch port for analysis, without introducing a device into the physical path or risking a link outage. Which approach is MOST appropriate?",options:{A:"Enable promiscuous mode on the monitoring workstation's NIC",B:"Increase SNMP polling frequency on the switch interface",C:"Insert a passive network TAP inline on the link",D:"Configure a SPAN session mirroring the port to a monitoring port"},answer:"D",lead:"A SPAN or port mirror copies frames from a source port to a destination port entirely within the switch, so nothing is inserted into the cable path and there is no risk of dropping the link. The tradeoff is that under heavy load the switch may drop mirrored frames, since production forwarding takes priority.",why:{A:"Only lets the workstation process frames already delivered to it and does nothing on a switched network.",B:"Returns counters, not packets.",C:"Is technically excellent for fidelity but requires breaking the link to install, which the stem rules out."}},
{id:"n3_13",domain:3,question:"A network team establishes a performance baseline for the first time. Which describes the PRIMARY operational value of doing so?",options:{A:"It provides a normal reference so deviations can be recognized as problems",B:"It documents the physical cabling layout for future installers",C:"It satisfies a regulatory requirement for data retention",D:"It determines the administrative distance for routing decisions"},answer:"A",lead:"A baseline records how the network behaves under normal conditions — utilization, latency, error rates, and typical traffic patterns. Without it, an engineer cannot tell whether 60 percent utilization on a link is a crisis or a Tuesday. It also underpins capacity planning by revealing growth trends.",why:{B:"Describes network diagrams and cable documentation.",C:"Is unrelated to performance measurement.",D:"Is a routing protocol concept with no connection to baselining."}},
{id:"n3_14",domain:3,question:"A vendor announces that a switch model has reached end of support. Which consequence is MOST significant from a security operations perspective?",options:{A:"Existing support contracts are automatically converted to a higher tier",B:"No further security patches will be released for newly discovered vulnerabilities",C:"The device's warranty is extended to cover replacement parts",D:"The device will stop forwarding traffic on the announced date"},answer:"B",lead:"End of support means the vendor stops issuing fixes, including security patches. Any vulnerability disclosed afterward remains permanently open, so the device becomes an accumulating risk that must be mitigated by compensating controls or replaced.",why:{A:"A and C invert what actually happens, since support and warranty coverage end rather than expand.",C:"A and C invert what actually happens, since support and warranty coverage end rather than expand.",D:"Is false; the hardware keeps working, which is exactly why organizations are tempted to leave it in place."}},
{id:"n3_15",domain:3,question:"A service level agreement guarantees 99.99 percent availability. Approximately how much unplanned downtime does that permit over a full year?",options:{A:"About 8.8 hours",B:"About 3.7 days",C:"About 53 minutes",D:"About 4.4 hours"},answer:"C",lead:"A year contains roughly 525,600 minutes. Multiplying by 0.0001 yields approximately 52.6 minutes of permitted downtime. This tier is commonly called four nines.",why:{A:"A (8.8 hours) corresponds to 99.9 percent, or three nines.",B:"B (3.7 days) corresponds to 99 percent.",D:"D (4.4 hours) corresponds to about 99.95 percent."}},
{id:"n3_16",domain:3,question:"An engineer is asked to distinguish between three metrics on a video conferencing report: the link's capacity, the actual data rate achieved, and the variation in packet arrival times. Which set of terms correctly maps to those three, in order?",options:{A:"Throughput, bandwidth, latency",B:"Bandwidth, latency, throughput",C:"Latency, jitter, bandwidth",D:"Bandwidth, throughput, jitter"},answer:"D",lead:"Bandwidth is the theoretical maximum capacity of the link. Throughput is the data rate actually achieved, which is always lower because of overhead, contention, and loss. Jitter is the variation in inter-packet delay, and it is the metric that most directly degrades real-time voice and video.",why:{A:"Reverses bandwidth and throughput and substitutes latency for jitter.",B:"B and C scramble the mappings.",C:"B and C scramble the mappings."},note:"Latency is one-way or round-trip delay, which is a fourth distinct metric."},
{id:"n3_17",domain:3,question:"An organization adopts infrastructure as code for network device configuration. Which TWO benefits are the MOST directly attributable to this approach? (Select TWO)",options:{A:"Physical cabling errors are automatically detected and corrected",B:"Identical configuration can be applied consistently across many devices without drift",C:"Devices no longer require firmware updates",D:"Configuration changes are version controlled and reviewable before deployment",E:"Spanning tree convergence time is reduced"},answer:["B", "D"],lead:"Treating configuration as code puts it in a repository, so every change carries an author, a timestamp, a diff, and a peer review before it reaches production. Because the same definition is applied programmatically to every device, configuration drift — the gradual divergence caused by ad hoc manual edits — is eliminated.",why:{A:"Is a physical layer issue that automation cannot see.",C:"Is false; firmware lifecycle is unaffected.",E:"Is a protocol timer behavior unrelated to how configuration is delivered."}},
{id:"n3_18",domain:3,question:"A WAN link is bursting above its committed rate, causing the carrier to discard traffic. The team wants excess traffic buffered and released smoothly instead of dropped, accepting some added delay. Which technique should be applied?",options:{A:"Traffic shaping",B:"Weighted random early detection",C:"Traffic policing",D:"Class-based queuing without a shaper"},answer:"A",lead:"Shaping buffers traffic that exceeds the configured rate and releases it as capacity allows, smoothing bursts at the cost of added latency and buffer memory. That matches the stated preference for delay over loss and prevents the carrier from dropping the excess.",why:{B:"Manages congestion by selectively dropping packets to prevent TCP global synchronization, which is still loss-based.",C:"C (policing) enforces the rate by dropping or remarking excess immediately, with no buffering — the very behavior the team wants to avoid.",D:"Allocates bandwidth among classes but does not constrain the aggregate rate leaving the interface."}},
{id:"n3_19",domain:3,question:"A DHCP client receives a lease with a duration of 8 days. At what point will the client first attempt to renew the lease, and with whom?",options:{A:"At 87.5 percent of the lease, broadcasting to any available server",B:"At 50 percent of the lease, unicasting directly to the original server",C:"At 50 percent of the lease, broadcasting to any available server",D:"Immediately at lease expiration, broadcasting a new DISCOVER"},answer:"B",lead:"At T1, which is 50 percent of the lease, the client unicasts a DHCPREQUEST to the server that issued the lease. If that fails, at T2 (87.5 percent) it broadcasts a REQUEST hoping any server will extend it. Only when the lease fully expires does the client abandon the address and start over with DISCOVER.",why:{A:"Describes the T2 rebinding stage, which happens second, not first.",C:"Correctly identifies the timing but uses broadcast, which belongs to the rebinding stage.",D:"Skips the entire renewal mechanism."}},
{id:"n3_20",domain:3,question:"An incident review finds that correlating events across the firewall, the domain controller, and the web servers was impossible because the timestamps disagreed by several minutes. Which control should be implemented to prevent a recurrence?",options:{A:"Increase the syslog retention period on all devices",B:"Raise the syslog severity threshold to capture debug messages",C:"Synchronize all devices to a common NTP source",D:"Deploy agents that forward logs more frequently"},answer:"C",lead:"Log correlation depends entirely on a shared, accurate time reference. Without NTP synchronization across every device, a SIEM cannot reliably order events, which makes reconstructing an attack chain guesswork. This is also why unsynchronized timestamps can undermine evidence in legal proceedings.",why:{A:"Keeps unusable logs longer.",B:"Generates far more data without fixing the ordering problem, and debug logging on production devices can itself cause performance issues.",D:"Changes delivery latency, not the timestamps recorded in the messages."}},
{id:"n3_21",domain:3,question:"Which document would an engineer consult to determine which physical switch port in which rack a specific server's NIC is connected to?",options:{A:"The organization's acceptable use policy",B:"A logical network diagram showing VLANs and subnets",C:"The IP address management database",D:"A physical network diagram with rack and port mapping"},answer:"D",lead:"Physical diagrams and the accompanying rack elevations, cable schedules, and port maps record where equipment physically sits and what plugs into which port. This is the documentation a technician needs when tracing a cable or dispatching hands to a data center.",why:{A:"Governs user behavior and is unrelated.",B:"Shows how traffic flows logically — VLANs, subnets, routing — without physical placement.",C:"Tracks address assignments and subnet allocations, not cabling."}},
{id:"n3_22",domain:3,question:"A data center technician notices that intake temperatures on several racks are climbing even though the CRAC units are functioning and the room's overall temperature is normal. Which condition is the MOST likely cause?",options:{A:"Hot and cold aisle containment has been broken by missing blanking panels",B:"Humidity sensors are miscalibrated and reporting low readings",C:"The racks are drawing more amperage than the PDU is rated for",D:"The UPS is operating on battery and reducing cooling output"},answer:"A",lead:"Hot aisle and cold aisle design depends on air being forced through equipment rather than around it. Empty rack units without blanking panels let hot exhaust recirculate to the front of the rack, raising intake temperatures at specific racks even while the room average looks fine.",why:{B:"Relates to static discharge and condensation risk, not intake temperature.",C:"Is a power capacity problem that would trip a breaker rather than produce localized heat recirculation.",D:"Would typically trigger alarms and affect the whole room, not specific racks."}},
{id:"n3_23",domain:3,question:"An organization requires that its clustered database remain available if any single server fails, and it has determined that two servers are needed to carry production load. Which redundancy model should be specified?",options:{A:"N+1, provisioning two servers",B:"N+1, provisioning three servers",C:"2N, provisioning two servers",D:"N-1, provisioning one server"},answer:"B",lead:"In N+1, N is the number of components required to carry the load and the plus one is a spare that can absorb any single failure. With N equal to two, N+1 means three servers, so losing one still leaves two carrying production.",why:{A:"Miscounts, since two servers with no spare is simply N.",C:"C (2N) would mean four servers, providing full duplication — more resilient but beyond the stated requirement.",D:"Describes running below capacity, which is not a redundancy model."}},
{id:"n3_24",domain:3,question:"A technician must produce a report showing wireless coverage strength across each floor of an office to justify additional access points. Which deliverable is required?",options:{A:"A packet capture from the wireless controller",B:"A logical diagram of the wireless VLANs",C:"A heat map produced from a site survey",D:"A spectrum analyzer capture of the 2.4 GHz band"},answer:"C",lead:"A site survey walks the floor plan measuring RSSI and signal-to-noise ratio, and renders the results as a color-coded heat map overlaid on the building layout. This is the standard artifact for demonstrating coverage gaps and justifying AP placement.",why:{A:"Captures frames but does not map signal strength to physical space.",B:"Documents logical segmentation.",D:"Identifies non-802.11 interference sources such as microwaves and cordless phones, which is a different diagnostic."}},
{id:"n3_25",domain:3,question:"A monitoring system sends an alert every time a WAN interface exceeds 70 percent utilization, and the team now receives hundreds of alerts per day and has begun ignoring them. Which action BEST addresses the underlying problem?",options:{A:"Route all alerts to a separate mailbox reviewed weekly",B:"Disable alerting on that interface until the circuit is upgraded",C:"Lower the threshold to 60 percent so problems are caught earlier",D:"Tune the threshold and add a sustained-duration condition before alerting"},answer:"D",lead:"The problem is alert fatigue, and the fix is tuning. Raising the threshold to a level that reflects the actual baseline and requiring the condition to persist — for example, above 85 percent for 10 consecutive minutes — filters out normal bursts while still catching genuine sustained congestion.",why:{A:"Delays awareness of real incidents to weekly, which defeats monitoring.",B:"Creates a blind spot on a circuit that is already known to be under pressure.",C:"Generates even more noise and accelerates the fatigue."}},
{id:"n3_26",domain:3,question:"An IPAM system is being deployed. Which TWO problems does it MOST directly address? (Select TWO)",options:{A:"Excessive broadcast traffic within a large VLAN",B:"Duplicate IP address assignments caused by uncoordinated manual allocation",C:"Wireless clients failing to roam between access points",D:"Slow spanning tree convergence after a link failure",E:"Difficulty locating which subnets have available address space during expansion"},answer:["B", "E"],lead:"IP address management maintains an authoritative record of every subnet, allocation, and free range, usually integrated with DHCP and DNS. That eliminates conflicting manual assignments and answers capacity questions instantly during network expansion.",why:{A:"Is addressed by subnet sizing and VLAN segmentation design.",C:"Is a wireless roaming feature question. None of the three are within the scope of address management tooling.",D:"Is a spanning tree tuning matter."}},
{id:"n3_27",domain:3,question:"A newly hired technician asks why the organization performs a restore test each quarter when backups already complete successfully every night. What is the BEST justification?",options:{A:"A successful backup job does not prove the data is recoverable or complete",B:"Restore tests are required to reset the backup software's retention counters",C:"Quarterly restores are needed to keep the backup media from degrading",D:"Testing restores compresses the backup catalog and improves performance"},answer:"A",lead:"Backup jobs report on whether the write operation completed, not on whether the resulting data set is consistent, uncorrupted, and actually restorable. Silent corruption, missed files due to open handles, incorrect scope, and unusable encryption keys are all discovered only by performing an actual restore.",why:{B:"B, C, and D invent technical mechanisms that do not exist.",C:"B, C, and D invent technical mechanisms that do not exist.",D:"B, C, and D invent technical mechanisms that do not exist."},note:"Media integrity is addressed by verification passes and rotation policy, not by test restores."},
{id:"n3_28",domain:3,question:"An engineer must give a contractor temporary administrative access to three internal servers while ensuring every session is logged and the contractor never connects to those servers directly from the Internet. Which solution is MOST appropriate?",options:{A:"A split-tunnel VPN profile scoped to the three server addresses",B:"A hardened jump box that the contractor authenticates to before reaching the servers",C:"Port forwarding rules on the perimeter firewall for RDP to each server",D:"A shared local administrator account created on each of the three servers"},answer:"B",lead:"A jump box, or bastion host, is a single hardened, heavily monitored system that is the only permitted path into a protected zone. All administrative sessions funnel through it, giving one place to enforce multifactor authentication, record session activity, and revoke access.",why:{A:"Grants direct network reachability to the servers, with no session recording.",C:"Exposes RDP to the Internet, one of the most heavily attacked services in existence.",D:"Destroys accountability because actions cannot be attributed to an individual."}},
{id:"n3_29",domain:3,question:"A network engineer is documenting the standard steps for replacing a failed access switch, so that any technician on the team can perform the task identically. Which document type is being created?",options:{A:"A service level agreement",B:"A memorandum of understanding",C:"A standard operating procedure",D:"An acceptable use policy"},answer:"C",lead:"An SOP is a step-by-step, repeatable procedure for a routine operational task. Its purpose is consistency and reduced error regardless of who executes it, and it typically references the relevant configuration templates and verification checks.",why:{A:"Defines service commitments and metrics between provider and customer.",B:"Is a non-binding statement of intent between organizations.",D:"Governs how end users may use company resources."}},
{id:"n3_30",domain:3,question:"Which statement correctly distinguishes a vulnerability scan from a penetration test?",options:{A:"A scan is performed by external consultants; a penetration test is performed internally",B:"A scan requires production downtime; a penetration test does not",C:"A scan tests network devices only; a penetration test covers applications only",D:"A scan identifies and reports known weaknesses; a penetration test attempts to exploit them"},answer:"D",lead:"A vulnerability scan is largely automated, broad, and non-destructive — it enumerates systems and flags known issues by signature and version. A penetration test is a goal-directed engagement in which a tester actively exploits weaknesses to demonstrate real business impact and chain findings together.",why:{A:"Confuses who performs the work with what the work is.",B:"Reverses the risk profile, since penetration testing carries more potential for disruption.",C:"Invents a scope split that neither activity observes."}},
{id:"n3_31",domain:3,question:"A technician reviews the interface counters below on a switch uplink that users report as slow. What is the MOST likely cause?",pre:"GigabitEthernet1/0/24 is up, line protocol is up\n  Full-duplex, 1000Mb/s, media type is 10/100/1000BaseTX\n  Input queue: 0/75/0/0  Total output drops: 481203\n  5 minute input rate 12,000 bits/sec\n  5 minute output rate 984,000,000 bits/sec\n     0 input errors, 0 CRC, 0 frame, 0 overrun\n     0 late collision, 0 deferred",options:{A:"The uplink is saturated in the outbound direction and is dropping queued traffic",B:"The interface has negotiated the wrong speed for the media type",C:"A failing cable is corrupting frames in transit",D:"A duplex mismatch is causing collisions on the link"},answer:"A",lead:"Output rate is running at roughly 984 Mbps on a 1 Gbps interface, essentially at line rate, and total output drops are very high. When the transmit queue fills faster than the interface can drain it, the switch discards the overflow. The fix is more capacity, an EtherChannel, or QoS to protect priority traffic.",why:{B:"Is contradicted by the interface reporting 1000 Mb/s full duplex.",C:"Would produce CRC and frame errors, all of which read zero.",D:"Would show late collisions and the interface reports full duplex with zero collisions."}},
{id:"n3_32",domain:3,question:"An organization's log retention policy must satisfy an industry regulation requiring one year of security event history, while the SIEM has only enough fast storage for 90 days. Which approach BEST satisfies both constraints?",options:{A:"Retain 90 days and document the storage limitation as an accepted risk",B:"Keep 90 days searchable in the SIEM and archive older logs to lower-cost storage for the remaining period",C:"Forward logs to each device's local storage after 90 days",D:"Reduce the logging severity threshold so fewer events are generated"},answer:"B",lead:"Tiered retention is the standard answer. Recent data stays in hot, indexed storage where analysts need fast search during active investigations, while older data moves to inexpensive cold or archival storage that still satisfies the regulatory retention window and can be rehydrated if needed.",why:{A:"Accepts a compliance failure when a workable solution exists.",C:"Is unworkable, as network devices have very limited local storage and lose it on reboot.",D:"Reduces the completeness of the record and would likely violate the regulation's content requirements."}},
{id:"n3_33",domain:3,question:"Following a major outage, the team holds a blameless review to document the timeline, contributing factors, and specific improvements. Which TWO outcomes should this review produce? (Select TWO)",options:{A:"A commitment to avoid documenting the incident externally",B:"Action items with owners and target dates",C:"An updated runbook or monitoring rule reflecting what was learned",D:"A decision to remove change management for routine work to move faster",E:"A disciplinary recommendation for the engineer who made the change"},answer:["B", "C"],lead:"A post-incident review exists to convert an outage into durable improvement. Concrete action items with named owners and dates are what make the findings stick, and updating the runbooks, alerts, or automation ensures the next occurrence is detected or prevented rather than rediscovered.",why:{A:"Conflicts with transparency and, in regulated environments, with disclosure obligations.",D:"Removes a control in response to a failure, increasing risk.",E:"Undermines the blameless premise and suppresses the honest reporting these reviews depend on."}},
{id:"n4_01",domain:4,question:"An attacker on an access port in VLAN 1 crafts frames with two 802.1Q tags, an outer tag of VLAN 1 and an inner tag of VLAN 300, and successfully delivers traffic into VLAN 300. Which mitigation MOST directly prevents this attack?",options:{A:"Increase the STP priority on the access switch",B:"Enable BPDU Guard on all access ports",C:"Change the trunk's native VLAN to an unused VLAN and never assign hosts to it",D:"Apply port security with a maximum of one MAC address"},answer:"C",lead:"This is double-tagging VLAN hopping. It works only when the attacker's access VLAN matches the trunk's native VLAN: the first switch strips the outer native tag and forwards the frame with the inner tag still attached, so the next switch delivers it into the target VLAN. Moving the native VLAN to an unused, host-free VLAN — or explicitly tagging the native VLAN — breaks the precondition.",why:{A:"Influences root bridge election and is irrelevant to frame tagging.",B:"Defends against rogue switches and STP manipulation.",D:"Limits MAC addresses per port and does not inspect tags."}},
{id:"n4_02",domain:4,question:"A technician discovers that an attacker on the LAN is answering ARP requests for the default gateway with their own MAC address, intercepting traffic. Which control prevents this, and what does it depend on?",options:{A:"BPDU Guard, which err-disables ports that receive spanning tree BPDUs",B:"Port security, which limits the number of MAC addresses learned per port",C:"802.1X, which authenticates the device before granting network access",D:"Dynamic ARP Inspection, which validates ARP packets against the DHCP snooping binding table"},answer:"D",lead:"Dynamic ARP Inspection intercepts ARP packets on untrusted ports and verifies that the advertised IP-to-MAC pairing matches a legitimate binding. Those bindings come from the DHCP snooping database, which is why DHCP snooping is a prerequisite for DAI. Mismatched ARP replies are dropped.",why:{A:"Addresses spanning tree attacks.",B:"Counts MAC addresses but does not validate what a host claims in an ARP reply, so a single spoofing host passes freely.",C:"Authenticates the endpoint, but an authenticated device can still poison ARP."}},
{id:"n4_03",domain:4,question:"Users near a conference room intermittently connect to a wireless network with the same SSID as the corporate network but are prompted for credentials on an unfamiliar portal page. Which attack is occurring?",options:{A:"An evil twin",B:"A rogue access point on the corporate wired network",C:"A deauthentication flood",D:"A war driving reconnaissance sweep"},answer:"A",lead:"An evil twin is an attacker-controlled AP that impersonates a legitimate SSID to lure clients into associating with it, then harvests credentials through a fake captive portal or performs on-path interception. The duplicated SSID plus the unfamiliar credential prompt is the defining signature.",why:{B:"Is an unauthorized AP plugged into the corporate network, which creates an unmanaged entry point but does not necessarily impersonate the corporate SSID.",C:"Forces clients off an AP and is often a precursor to an evil twin, but by itself produces disconnections, not credential prompts.",D:"Is passive discovery of wireless networks from a vehicle."}},
{id:"n4_04",domain:4,question:"A network monitoring appliance must be able to drop malicious traffic before it reaches the protected servers, not merely alert on it. How must the device be deployed?",options:{A:"Connected to a SPAN port, operating as an IDS",B:"Inline in the traffic path, operating as an IPS",C:"Attached to a passive TAP outside the traffic path",D:"On the management VLAN receiving syslog from the servers"},answer:"B",lead:"Blocking requires the device to be in the forwarding path so it can decide whether each packet continues. That is an intrusion PREVENTION system. The tradeoff is that an inline device becomes a potential point of failure and a source of latency, and a false positive drops legitimate traffic.",why:{A:"A and C both place the sensor out of band, where it receives copies of traffic.",C:"A and C both place the sensor out of band, where it receives copies of traffic.",D:"Receives log messages after the fact."},note:"Such a device can detect and alert, and even send TCP resets, but the original packets have already been delivered."},
{id:"n4_05",domain:4,question:"An access control list on a router interface is configured with the entries below, and users report that they cannot reach the internal file server at 10.10.5.20 on TCP 445 even though a permit for it exists. What is the cause?",pre:"access-list 120 permit tcp 10.20.0.0 0.0.255.255 any eq 443\naccess-list 120 deny   ip  10.20.0.0 0.0.255.255 10.10.0.0 0.0.255.255\naccess-list 120 permit tcp 10.20.0.0 0.0.255.255 host 10.10.5.20 eq 445\naccess-list 120 permit ip  any any",options:{A:"TCP 445 must be permitted as UDP for SMB to function",B:"The wildcard mask on line 3 is incorrect for a single host",C:"The broader deny on line 2 matches first, so line 3 is never evaluated",D:"The implicit deny at the end of the list overrides all permits"},answer:"C",lead:"ACLs are evaluated top down and stop at the first match. Line 2 denies all IP traffic from 10.20.0.0/16 to 10.10.0.0/16, which includes the file server, so the packet is discarded before line 3 is ever reached. The permit must be moved above the deny.",why:{A:"Is false; SMB uses TCP 445.",B:"Is wrong, since the host keyword is the correct syntax for a single address.",D:"Is wrong because the explicit permit ip any any on line 4 precedes the implicit deny, and in any case the packet never reaches the end."}},
{id:"n4_06",domain:4,question:"Which statement correctly describes the difference between a stateless packet filter and a stateful firewall?",options:{A:"A stateless filter inspects application payloads while a stateful firewall inspects only headers",B:"A stateful firewall operates only at Layer 2 while a stateless filter operates at Layer 3",C:"A stateless filter requires more memory because it stores every session in a table",D:"A stateful firewall tracks connection state and automatically permits return traffic for established sessions"},answer:"D",lead:"A stateful firewall maintains a connection table recording each session's source, destination, ports, and TCP state. Return traffic matching an established entry is permitted automatically, so the administrator writes rules for one direction only. A stateless filter evaluates each packet in isolation against static rules, which forces explicit rules for return traffic and is far easier to bypass.",why:{A:"Reverses inspection depth.",B:"Misassigns the layers.",C:"Reverses the memory characteristic, since state tables are what consume the memory."}},
{id:"n4_07",domain:4,question:"An organization deploys 802.1X on its access switches. Which component acts as the authenticator?",options:{A:"The access switch",B:"The workstation's operating system",C:"The Active Directory domain controller",D:"The RADIUS server"},answer:"A",lead:"802.1X defines three roles. The supplicant is the client software on the endpoint. The authenticator is the network access device — the switch or wireless access point — which controls the port and relays EAP messages. The authentication server, typically RADIUS, makes the accept or reject decision.",why:{B:"Is the supplicant.",C:"Is the identity store the RADIUS server queries, one step further back.",D:"Is the authentication server."}},
{id:"n4_08",domain:4,question:"A company requires that any laptop connecting to the corporate LAN must have current antivirus definitions and an approved patch level, and that non-compliant devices be placed on a remediation VLAN. Which technology provides this?",options:{A:"An intrusion prevention system in inline mode",B:"Network access control with posture assessment",C:"MAC address filtering on the access switches",D:"A next-generation firewall with application awareness"},answer:"B",lead:"NAC evaluates the security posture of an endpoint at connection time — patch level, antivirus state, encryption, and required agents — and applies the corresponding policy, commonly by dynamically assigning a VLAN. Non-compliant hosts land in a quarantine or remediation VLAN where they can only reach update servers.",why:{A:"Detects and blocks malicious traffic patterns, not compliance state.",C:"Only checks a hardware address, which is trivially spoofed and reveals nothing about posture.",D:"Inspects traffic but cannot query a client's patch state or move it between VLANs."}},
{id:"n4_09",domain:4,question:"Which pair correctly describes IPsec's two protocols and what each provides?",options:{A:"AH provides confidentiality; ESP provides authentication only",B:"Both AH and ESP provide identical services and are interchangeable",C:"AH provides authentication and integrity without confidentiality; ESP provides confidentiality, authentication, and integrity",D:"AH encrypts the payload; ESP encrypts the header"},answer:"C",lead:"Authentication Header authenticates the packet and protects integrity, including portions of the outer IP header, but performs no encryption — so the data remains readable. Encapsulating Security Payload encrypts the payload and also provides authentication and integrity, which is why ESP is used in virtually all modern deployments.",why:{A:"Reverses both roles.",B:"Ignores that AH offers no confidentiality at all.",D:"Describes neither protocol accurately."}},
{id:"n4_10",domain:4,question:"Two offices are connected by an IPsec VPN in which the entire original IP packet is encrypted and encapsulated inside a new packet with new outer headers. Which mode is in use, and why is it appropriate here?",options:{A:"Transport mode, because the original header must remain visible for routing",B:"Tunnel mode, because transport mode cannot carry TCP traffic",C:"Transport mode, because it adds less overhead for site-to-site links",D:"Tunnel mode, because gateway-to-gateway VPNs must conceal the original addressing"},answer:"D",lead:"Tunnel mode encrypts the complete original packet, header included, and wraps it in a new IP header addressed between the two VPN gateways. Intermediate routers see only the gateway addresses, so the internal topology stays hidden. This is the standard mode for site-to-site VPNs.",why:{A:"A and C describe transport mode, which protects only the payload and leaves the original header exposed — it is intended for host-to-host protection, not gateway-to-gateway.",B:"Is false, since transport mode carries TCP normally.",C:"A and C describe transport mode, which protects only the payload and leaves the original header exposed — it is intended for host-to-host protection, not gateway-to-gateway."}},
{id:"n4_11",domain:4,question:"A security team places an intentionally vulnerable-looking server on an isolated segment, instruments it heavily, and monitors any interaction with it. What is the PRIMARY purpose of this deployment?",options:{A:"To detect and study attacker activity with an extremely low false positive rate",B:"To load-test applications before they enter production",C:"To provide a backup authentication path if the domain controller fails",D:"To absorb DDoS traffic and protect production servers from saturation"},answer:"A",lead:"A honeypot has no legitimate business function, so any connection to it is by definition unexpected. That produces very high signal with almost no false positives, and it lets defenders observe tools and techniques safely. A honeynet extends the concept to an entire decoy network.",why:{B:"B and C describe unrelated infrastructure roles.",C:"B and C describe unrelated infrastructure roles.",D:"Describes scrubbing services and upstream mitigation."}},
{id:"n4_12",domain:4,question:"An organization is adopting a zero trust architecture. Which TWO principles are foundational to this model? (Select TWO)",options:{A:"Verify explicitly on every request rather than trusting based on network location",B:"Treat all traffic inside the perimeter as inherently trusted to reduce overhead",C:"Enforce least privilege access scoped to the specific resource and session",D:"Rely on a hardened perimeter firewall as the primary security boundary",E:"Assign permanent administrative rights to reduce authentication friction"},answer:["A", "C"],lead:"Zero trust replaces implicit trust based on location with continuous, explicit verification of identity, device health, and context on every request. Access granted is the minimum necessary for the specific resource, and it is time and scope bound rather than standing.",why:{B:"B and D describe the traditional castle-and-moat model that zero trust exists to replace, since an attacker who breaches the perimeter otherwise moves laterally at will.",D:"B and D describe the traditional castle-and-moat model that zero trust exists to replace, since an attacker who breaches the perimeter otherwise moves laterally at will.",E:"Is the direct opposite of least privilege."}},
{id:"n4_13",domain:4,question:"An attacker sends a small volume of spoofed DNS queries to open resolvers, each request generating a much larger response directed at the victim's address. Which attack is this, and which characteristic makes it effective?",options:{A:"A SYN flood, effective because half-open connections exhaust the server backlog",B:"A reflection and amplification DDoS, effective because the response is far larger than the request",C:"A domain hijacking attack, effective because registrar credentials are weak",D:"A DNS cache poisoning attack, effective because resolvers accept unsolicited answers"},answer:"B",lead:"The attacker spoofs the victim's source address so responses are reflected to the victim, and chooses query types whose replies are many times larger than the request — the amplification factor. A modest uplink can therefore generate an overwhelming flood. NTP and memcached have been abused the same way.",why:{A:"Exhausts TCP connection state on a single server.",C:"Takes control of a domain's registration rather than flooding a target.",D:"Corrupts a resolver's cached records to redirect users, a different goal."}},
{id:"n4_14",domain:4,question:"A switch's CAM table fills with thousands of bogus MAC addresses, after which the switch begins flooding all frames out every port and an attacker captures traffic not destined for them. Which attack is this, and which control stops it?",options:{A:"DHCP starvation, stopped by DHCP snooping rate limits",B:"VLAN hopping, stopped by disabling DTP negotiation",C:"MAC flooding, stopped by port security limiting learned addresses per port",D:"ARP poisoning, stopped by Dynamic ARP Inspection"},answer:"C",lead:"MAC flooding exhausts the switch's content addressable memory table. Once full, the switch can no longer learn which port a destination lives on and fails open by flooding frames to every port in the VLAN, turning a switch into a hub. Port security caps the number of MAC addresses learned per port, so the attacking port is shut down or restricted long before the table fills.",why:{A:"Exhausts the DHCP pool rather than switch memory.",B:"Crosses VLAN boundaries.",D:"Poisons IP-to-MAC mappings rather than filling the CAM table."}},
{id:"n4_15",domain:4,question:"Workstations begin receiving IP addresses from an unexpected 192.168.1.0/24 range with a gateway that is not the corporate router, after a user connects a home wireless router to a wall jack. Which switch feature would have prevented this?",options:{A:"Dynamic ARP Inspection on all access ports",B:"Root Guard on the uplink to the distribution switch",C:"Storm control limiting broadcast traffic per port",D:"DHCP snooping with only the uplink toward the legitimate server marked trusted"},answer:"D",lead:"DHCP snooping classifies ports as trusted or untrusted. Server-side messages such as OFFER and ACK are permitted only from trusted ports, so a rogue DHCP server on a user port has its offers dropped at the switch. This also builds the binding table that DAI and IP Source Guard depend on.",why:{A:"Validates ARP but does not filter DHCP offers.",B:"Prevents an unauthorized switch from becoming the STP root, which is a different aspect of the same rogue device problem.",C:"Limits broadcast volume without inspecting message type."}},
{id:"n4_16",domain:4,question:"A company hosts a public web server that must be reachable from the Internet while ensuring that a compromise of that server does not give an attacker direct access to internal systems. Which design element addresses this?",options:{A:"Placing the server in a screened subnet with firewall rules restricting it from initiating connections inward",B:"Placing the server on the internal LAN in a dedicated VLAN with no ACLs",C:"Placing the server on the internal LAN with a host-based firewall enabled",D:"Assigning the server a public IP address and disabling NAT for that host"},answer:"A",lead:"A screened subnet, historically called a DMZ, sits between the Internet and the internal network with firewall enforcement on both sides. Inbound rules permit public access to the service, while rules on the internal side deny the server from initiating connections toward internal systems — so a compromised host is contained.",why:{B:"Creates a VLAN without any enforcement, and a VLAN alone is not a security boundary.",C:"Places a heavily exposed system on the trusted network, where a host firewall is the only barrier.",D:"Removes translation but does nothing about segmentation."}},
{id:"n4_17",domain:4,question:"An organization installs a small enclosed entryway with two interlocking doors, where the second door will not open until the first has closed and the individual has been verified. What is the PRIMARY threat this control addresses?",options:{A:"Denial of service against the badge reader system",B:"Tailgating by an unauthorized person following an employee inside",C:"Theft of equipment from an unattended loading dock",D:"Shoulder surfing of credentials at the entry keypad"},answer:"B",lead:"An access control vestibule, sometimes called a mantrap, physically prevents more than one person from passing through per authorization event. Tailgating — an unauthorized person walking in behind an authorized one — is precisely the threat it counters, and it is one of the most common physical breach techniques.",why:{A:"Is a system availability concern unrelated to the vestibule's design.",C:"Is addressed by dock procedures and cameras.",D:"Is addressed by keypad shielding and privacy screens."}},
