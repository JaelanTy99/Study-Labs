{id:"r01",domain:1,title:"OSI Model",tags:["osi","layers","encapsulation","model","seven layer"],content:"<p>The OSI (Open Systems Interconnection) model is a seven-layer conceptual framework that standardizes how data moves through a network. From bottom to top: Physical (Layer 1) deals with electrical signals and cables. Data Link (Layer 2) handles MAC addressing and frame construction. Network (Layer 3) manages logical addressing and routing. Transport (Layer 4) ensures end-to-end delivery via TCP or UDP. Session (Layer 5) manages connections between applications. Presentation (Layer 6) handles data formatting, encryption, and compression. Application (Layer 7) interfaces directly with end-user software.</p><p>For the Network+ exam, focus on what happens at each layer. When data moves down the stack, each layer adds its own header (encapsulation). A Layer 7 HTTP request gets wrapped in a TCP segment (Layer 4), then an IP packet (Layer 3), then an Ethernet frame (Layer 2), and finally transmitted as bits on the wire (Layer 1). On the receiving end, each layer strips its header (de-encapsulation) until the original data is delivered to the application.</p><p>Key devices per layer: Layer 1 — hubs, cables, repeaters. Layer 2 — switches, bridges. Layer 3 — routers, Layer 3 switches. Layers 4-7 — firewalls, load balancers, application gateways. Understanding which layer a problem occurs at is fundamental to efficient troubleshooting.</p>"},
{id:"r02",domain:1,title:"TCP vs UDP",tags:["tcp","udp","transport","layer 4","protocol","connection"],content:"<p>TCP (Transmission Control Protocol) and UDP (User Datagram Protocol) are the two primary Layer 4 transport protocols. TCP is connection-oriented — it establishes a session using a three-way handshake (SYN, SYN-ACK, ACK), guarantees delivery through acknowledgments and retransmissions, maintains packet ordering via sequence numbers, and implements flow control with sliding windows. This reliability comes at the cost of higher overhead and latency.</p><p>UDP is connectionless — it sends datagrams without establishing a session, provides no delivery guarantee, no ordering, and no flow control. What it lacks in reliability it gains in speed and efficiency. UDP's minimal overhead makes it ideal for applications where occasional packet loss is acceptable: real-time voice/video (VoIP, streaming), DNS queries, SNMP, DHCP, TFTP, and online gaming.</p><p>For the exam, know the key port numbers. TCP: HTTP (80), HTTPS (443), FTP (20/21), SSH (22), Telnet (23), SMTP (25), RDP (3389). UDP: DNS (53, also TCP for zone transfers), DHCP (67/68), TFTP (69), SNMP (161/162), NTP (123), Syslog (514). Some protocols like DNS use both TCP and UDP depending on the operation.</p><p>A common exam scenario: 'A user is experiencing choppy VoIP calls.' Understanding that VoIP uses UDP and is sensitive to latency, jitter, and packet loss points you toward QoS configuration or network congestion as the root cause — not TCP retransmission issues.</p>"},
{id:"r03",domain:1,title:"Subnetting",tags:["subnet","subnetting","cidr","mask","ip addressing","slash notation"],content:"<p>Subnetting divides a larger network into smaller, more manageable subnetworks. Each subnet has its own network address, usable host range, and broadcast address. The subnet mask determines where the network portion ends and the host portion begins. In CIDR notation, /24 means the first 24 bits are the network portion (255.255.255.0), leaving 8 bits for hosts.</p><p>The key formula: number of hosts per subnet = 2^(host bits) - 2 (subtracting network and broadcast addresses). A /24 gives 254 usable hosts. A /25 gives 126. A /26 gives 62. A /27 gives 30. A /28 gives 14. A /29 gives 6. A /30 gives 2 (ideal for point-to-point links).</p><p>To determine which subnet an IP belongs to, AND the IP with the subnet mask. Example: 192.168.10.67 with /26. The /26 mask is 255.255.255.192. Subnets increment by 64 (256 - 192): .0, .64, .128, .192. So 192.168.10.67 falls in the .64 subnet (192.168.10.64/26), with usable hosts .65 through .126 and broadcast .127.</p><p>For the exam, practice quickly identifying: the network address, first usable host, last usable host, broadcast address, and number of subnets/hosts for any given CIDR prefix. Speed matters — these questions are common and you don't want to spend too long on the math.</p>"},
{id:"r04",domain:1,title:"VLAN Concepts",tags:["vlan","virtual lan","trunking","802.1q","segmentation"],content:"<p>VLANs (Virtual Local Area Networks) logically segment a physical switch into multiple independent broadcast domains at Layer 2. Devices on the same VLAN can communicate directly; traffic between VLANs requires a Layer 3 device (router or L3 switch). This provides security isolation, broadcast containment, and simplified management without needing separate physical switches for each department or function.</p><p>VLAN trunking (IEEE 802.1Q) allows a single physical link between switches to carry traffic for multiple VLANs. The switch inserts a 4-byte VLAN tag into each Ethernet frame on the trunk link, identifying its VLAN membership. The native VLAN (default: VLAN 1) carries untagged traffic on a trunk — best practice is to change this from VLAN 1 for security.</p><p>Access ports belong to a single VLAN and connect to end devices (PCs, printers, phones). Trunk ports carry multiple VLANs and typically connect switches to other switches, routers, or servers. Voice VLANs are a special case — a single port can be configured with both an access VLAN (for a PC) and a voice VLAN (for an IP phone) using CDP/LLDP.</p><p>Common exam scenarios include troubleshooting devices that can't communicate despite being on the same switch (wrong VLAN), trunk link issues (missing VLAN in allowed list), and inter-VLAN routing problems (no L3 path between VLANs).</p>"},
{id:"r05",domain:1,title:"NAT (Network Address Translation)",tags:["nat","pat","snat","dnat","private ip","public ip"],content:"<p>NAT translates private (RFC 1918) IP addresses to public IP addresses at a network boundary, typically on a router or firewall. This serves two purposes: it conserves the limited IPv4 address space by allowing many internal devices to share fewer public IPs, and it provides a basic layer of security by hiding internal network addressing from the internet.</p><p>The three main NAT types are: Static NAT — a permanent one-to-one mapping between a private and public IP, commonly used for servers that need to be reachable from the internet. Dynamic NAT — maps private IPs to a pool of public IPs on a first-come-first-served basis. PAT (Port Address Translation, also called NAT overload) — maps many private IPs to a single public IP by using unique source port numbers to track each session. PAT is by far the most common form — it is what your home router uses.</p><p>When troubleshooting NAT issues, verify the translation table (e.g., 'show ip nat translations' on Cisco), confirm inside and outside interfaces are correctly designated, and check that the correct addresses are in the NAT rules. A common symptom of misconfigured NAT is internal users unable to reach the internet while all internal communication works fine.</p>"},
{id:"r06",domain:2,title:"STP (Spanning Tree Protocol)",tags:["stp","spanning tree","rstp","loop","root bridge","802.1d"],content:"<p>STP (IEEE 802.1D) prevents Layer 2 loops in networks with redundant switch connections. Without STP, broadcast frames would circulate endlessly, causing broadcast storms that consume all available bandwidth and crash the network. STP works by electing a root bridge (the switch with the lowest bridge ID), calculating the shortest path from each switch to the root, and blocking redundant ports to create a loop-free logical topology.</p><p>Port roles: Root Port — the port on each non-root switch with the best path to the root bridge. Designated Port — the port on each network segment closest to the root bridge (forwards traffic). Blocked Port — redundant ports that do not forward traffic (prevents loops). Port states: Blocking → Listening → Learning → Forwarding. Classic STP convergence takes 30-50 seconds.</p><p>RSTP (Rapid STP, 802.1w) drastically improves convergence to just a few seconds by introducing new port roles (Alternate and Backup) and active negotiation between switches instead of passive timer-based transitions. Most modern networks use RSTP or MSTP (Multiple STP, 802.1s, which supports per-VLAN spanning tree instances).</p><p>For troubleshooting: if a network suddenly experiences a broadcast storm, check for STP issues — a failed STP election or a newly connected device causing topology changes. Use 'show spanning-tree' to verify root bridge identity and port states.</p>"},
{id:"r07",domain:2,title:"OSPF Fundamentals",tags:["ospf","routing","link state","dijkstra","area","cost"],content:"<p>OSPF (Open Shortest Path First) is a link-state interior gateway protocol (IGP) that builds a complete topology map of the network and uses Dijkstra's SPF algorithm to calculate the shortest path to every destination. Unlike distance-vector protocols (RIP), every OSPF router has an identical view of the network topology within its area, enabling fast and loop-free convergence.</p><p>OSPF uses cost as its metric, calculated from interface bandwidth (reference bandwidth / interface bandwidth). Lower cost = better path. The default reference is 10^8, so a 100 Mbps link has cost 1 and a 10 Mbps link has cost 10. Key OSPF concepts: Areas (logical groupings to reduce LSA flooding — Area 0 is the backbone and all areas must connect to it), Router ID (unique identifier, usually the highest loopback IP), LSAs (Link-State Advertisements — the building blocks of the topology database), and adjacencies (full neighbor relationships formed between routers).</p><p>OSPF neighbor states progress through: Down → Init → 2-Way → ExStart → Exchange → Loading → Full. The 2-Way state is where DR/BDR election occurs on broadcast networks. If neighbors are stuck in a state other than Full, common causes are mismatched area IDs, hello/dead timer mismatches, MTU mismatches, or authentication failures.</p><p>For the exam, understand OSPF areas, the DR/BDR election process, how cost is calculated, and basic neighbor troubleshooting. Know that OSPF uses multicast addresses 224.0.0.5 (all OSPF routers) and 224.0.0.6 (DR/BDR) and runs directly over IP (protocol 89).</p>"},
{id:"r08",domain:1,title:"DHCP Process (DORA)",tags:["dhcp","dora","ip address","lease","dynamic"],content:"<p>DHCP (Dynamic Host Configuration Protocol) automates IP address assignment using a four-step process called DORA: Discover, Offer, Request, Acknowledge. The client broadcasts a DHCP Discover message (UDP port 68 to port 67). Any DHCP server on the broadcast domain responds with a DHCP Offer containing an available IP address, subnet mask, default gateway, DNS servers, and lease duration.</p><p>The client broadcasts a DHCP Request accepting the offered address (broadcast so all DHCP servers know which offer was accepted). The server confirms with a DHCP Acknowledge, and the client configures its network interface. The entire process typically completes in under a second.</p><p>Key concepts: Lease time determines how long a client can use the assigned address before renewal. At 50% of the lease, the client attempts to renew directly with the server. At 87.5%, it broadcasts a renewal request to any server. DHCP relay agents (ip helper-address) forward DHCP broadcasts across router boundaries, since broadcasts don't cross subnets. Scopes define the range of addresses available for assignment, and reservations map specific MAC addresses to fixed IP assignments.</p><p>Common DHCP troubleshooting: client gets 169.254.x.x (APIPA) = DHCP unreachable. Scope exhaustion = no addresses left to assign. Rogue DHCP server = unauthorized server handing out wrong configurations. DHCP snooping on switches helps mitigate rogue servers.</p>"},
{id:"r09",domain:1,title:"DNS Deep Dive",tags:["dns","resolution","records","a record","mx","cname","zone"],content:"<p>DNS (Domain Name System) translates human-readable domain names into IP addresses through a hierarchical, distributed database. The resolution process starts when a client sends a query to its configured recursive DNS server (resolver). If the resolver doesn't have the answer cached, it queries root servers → TLD (Top-Level Domain) servers → authoritative nameservers in an iterative process until it finds the answer.</p><p>Essential DNS record types: A record maps a hostname to an IPv4 address. AAAA maps to IPv6. CNAME creates an alias (www.example.com → example.com). MX specifies mail servers for a domain (with priority values). PTR is a reverse lookup record (IP → hostname). NS identifies authoritative nameservers for a zone. SOA (Start of Authority) contains zone metadata including serial numbers and refresh timers. TXT holds arbitrary text data — commonly used for SPF, DKIM, and domain verification.</p><p>DNS uses UDP port 53 for standard queries (fast, low overhead) and TCP port 53 for zone transfers (reliable, full replication of DNS data between primary and secondary servers) and responses exceeding 512 bytes. DNSSEC adds cryptographic signatures to prevent DNS spoofing and cache poisoning.</p><p>Troubleshooting DNS: Use nslookup or dig to query specific servers and record types. 'nslookup -type=MX example.com' shows mail server records. 'ipconfig /flushdns' clears the local DNS cache on Windows. If a user can reach sites by IP but not by name, DNS is the issue — not routing.</p>"},
{id:"r10",domain:1,title:"BGP Basics",tags:["bgp","autonomous system","exterior","internet routing","as path"],content:"<p>BGP (Border Gateway Protocol) is the routing protocol that makes the internet work. As an exterior gateway protocol (EGP), it exchanges routing information between autonomous systems (AS) — independently managed networks identified by unique AS numbers. Every ISP, large enterprise, and cloud provider runs BGP to advertise their networks and learn paths to others.</p><p>BGP uses TCP port 179 to form neighbor relationships (peers). Unlike IGPs that optimize for shortest path, BGP uses path attributes to make routing decisions. The most important: AS-Path (list of AS numbers traversed — shorter is preferred), Next-Hop (IP of the next router), Local Preference (internal policy — higher is preferred), and MED (Multi-Exit Discriminator — influences inbound traffic from neighbors).</p><p>There are two types: eBGP (external BGP) between different autonomous systems and iBGP (internal BGP) within the same AS. eBGP is what connects ISPs and organizations to each other. iBGP distributes externally learned routes within an organization's network.</p><p>For the Network+ exam, you don't need to configure BGP, but you should understand what it does (inter-AS routing), that it's the protocol behind internet routing, it uses AS-Path as a key decision factor, and it runs over TCP 179. Know the difference between IGP (OSPF, EIGRP, RIP — routing within an AS) and EGP (BGP — routing between ASes).</p>"},
{id:"r11",domain:4,title:"Network Security Fundamentals",tags:["security","firewall","ids","ips","defense","zero trust"],content:"<p>Network security protects the confidentiality, integrity, and availability (CIA triad) of network resources. The modern approach is defense in depth — layering multiple security controls so that no single point of failure compromises the network. Key layers include perimeter security (firewalls, DMZ), network segmentation (VLANs, micro-segmentation), access control (802.1X, NAC), monitoring (IDS/IPS, SIEM), endpoint protection, encryption, and user awareness training.</p><p>Firewalls are the primary perimeter defense. Packet-filtering firewalls examine headers (source/dest IP, ports) at Layers 3-4. Stateful firewalls track active connections and allow return traffic automatically. Next-Generation Firewalls (NGFWs) add Layer 7 inspection, application awareness, intrusion prevention, and content filtering. Web Application Firewalls (WAFs) specifically protect web applications from attacks like SQL injection and XSS.</p><p>IDS (Intrusion Detection System) passively monitors traffic and alerts on suspicious activity. IPS (Intrusion Prevention System) sits inline and can actively block malicious traffic. Both use signature-based detection (matching known attack patterns) and anomaly-based detection (identifying deviations from normal behavior). A SIEM (Security Information and Event Management) system aggregates logs from all these sources for correlation and analysis.</p><p>Zero Trust is the modern security philosophy: never trust any user, device, or network location by default. Every access request must be authenticated, authorized, and continuously validated regardless of whether it originates inside or outside the corporate network.</p>"},
{id:"r12",domain:5,title:"Network Troubleshooting Methodology",tags:["troubleshooting","methodology","comptia","steps","diagnose"],content:"<p>CompTIA defines a seven-step troubleshooting methodology that provides a structured approach to diagnosing and resolving network issues. Following these steps prevents wasted time and ensures problems are fully resolved and documented.</p><p>Step 1: Identify the problem. Gather information from the user, check for recent changes, verify the scope (single user vs. many), and reproduce the issue if possible. Ask: What changed? When did it start? Who is affected? Step 2: Establish a theory of probable cause. Start simple — question the obvious. Use the OSI model to categorize potential causes from Layer 1 up. Step 3: Test the theory. Use diagnostic tools (ping, traceroute, nslookup, cable tester) to confirm or eliminate your theory. If the theory is not confirmed, go back to Step 2.</p><p>Step 4: Establish a plan of action. Document the fix, assess risk, plan for potential side effects, and determine if a maintenance window is needed. Step 5: Implement the solution or escalate. Apply the fix carefully and follow the plan. If the solution is beyond your scope, escalate to the appropriate team. Step 6: Verify full system functionality. Confirm the fix resolved the original issue and didn't create new problems. Have the affected user confirm. Step 7: Document findings, actions, and outcomes. Update tickets, knowledge bases, and network documentation.</p><p>The most commonly tested aspect: always start at the physical layer (cables, link lights, power) before investigating higher-layer issues. A surprising number of real-world network problems are caused by loose cables, bad patch cords, or unplugged devices.</p>"},
{id:"r13",domain:3,title:"Network Monitoring and Management",tags:["snmp","syslog","netflow","monitoring","baseline","management"],content:"<p>Effective network management relies on three core monitoring technologies: SNMP, Syslog, and NetFlow. SNMP (Simple Network Management Protocol) uses agents on network devices and a central manager to poll status data (interface utilization, CPU, memory, errors) stored in MIBs (Management Information Bases). SNMPv3 adds authentication and encryption — always use v3 in production. SNMP traps are unsolicited alerts sent from devices to the manager when thresholds are exceeded.</p><p>Syslog centralizes log messages from all network devices to a single server. Messages include a severity level (0-Emergency through 7-Debug), facility code, timestamp, and message text. Centralized logging is essential for troubleshooting, compliance, and security incident investigation. Modern deployments often feed syslog into a SIEM for correlation.</p><p>NetFlow (Cisco), sFlow, and IPFIX collect traffic flow data — source/destination IPs, ports, protocols, and byte counts — without capturing full packet payloads. This data is invaluable for capacity planning, detecting anomalies, identifying top talkers, and understanding traffic patterns. It answers 'who is talking to whom and how much.'</p><p>A network baseline combines data from all three sources to document normal operating conditions. Without a baseline, you can't objectively determine whether current performance is abnormal. Baselines should be updated periodically as the network grows and traffic patterns evolve.</p>"},
{id:"r14",domain:4,title:"Common Network Attacks",tags:["attacks","ddos","phishing","mitm","spoofing","flooding","social engineering"],content:"<p>Network attacks target different layers and exploit various vulnerabilities. Layer 2 attacks include MAC flooding (overwhelming a switch's MAC table to force hub behavior), ARP spoofing/poisoning (falsifying ARP replies to redirect traffic through the attacker), VLAN hopping (exploiting trunk ports via switch spoofing or double tagging), and DHCP starvation (exhausting the address pool with spoofed requests) followed by rogue DHCP server deployment.</p><p>Layer 3-4 attacks include DDoS (Distributed Denial of Service — overwhelming a target with traffic from a botnet), SYN floods (exhausting server connection tables with half-open TCP sessions), IP spoofing (forging source addresses), and DNS poisoning (corrupting DNS cache to redirect traffic to malicious sites). On-path attacks (man-in-the-middle) intercept traffic between two parties for eavesdropping or modification.</p><p>Application-layer and social engineering attacks include phishing (fraudulent emails to steal credentials), spear phishing (targeted phishing at specific individuals), vishing (voice phishing), smishing (SMS phishing), pretexting (fabricating scenarios to manipulate people), and tailgating (following authorized personnel through secured doors).</p><p>Mitigations: Port security and DHCP snooping for Layer 2. Firewalls, IPS, and rate limiting for DDoS. Encryption (TLS, IPsec) for on-path attacks. User awareness training for social engineering. Defense in depth means no single control is sufficient — layer multiple protections.</p>"},
{id:"r15",domain:5,title:"Essential CLI Tools for Troubleshooting",tags:["cli","ping","tracert","ipconfig","netstat","nslookup","nmap","arp"],content:"<p>Every network technician needs fluency with command-line diagnostic tools. ping sends ICMP Echo Requests to test Layer 3 connectivity and measure round-trip time. Key options: -t (continuous), -n count (number of pings), -l size (packet size). If ping works by IP but not by hostname, DNS is the issue.</p><p>traceroute (Linux) / tracert (Windows) maps the path to a destination by incrementing TTL values. Each hop that decrements TTL to 0 sends back an ICMP Time Exceeded message. Useful for identifying where in the path a failure or bottleneck occurs. Request timeouts (***) at a hop may indicate a firewall blocking ICMP.</p><p>ipconfig (Windows) / ip addr or ifconfig (Linux) displays current IP configuration. Key variations: ipconfig /all (full details including DHCP and DNS), ipconfig /release + /renew (get a new DHCP lease), ipconfig /flushdns (clear DNS cache). nslookup and dig query DNS servers directly — essential for verifying DNS resolution. arp -a displays the local ARP cache (IP-to-MAC mappings).</p><p>netstat (Windows) / ss (Linux) shows active connections and listening ports. netstat -an shows all connections with numeric addresses. nmap is a powerful network scanner for host discovery and port scanning. route print (Windows) / ip route (Linux) displays the routing table. Know when to use each tool — the exam tests both tool selection and interpretation of output.</p>"}

{id:"r16",domain:1,title:"Advanced Subnetting & VLSM (Worked Examples)",tags:["subnetting","vlsm","cidr","wildcard","supernet","math"],content:"<p>Speed and accuracy with subnetting separate passing scores from failing ones. Memorize the block-size table: /25 = 128, /26 = 64, /27 = 32, /28 = 16, /29 = 8, /30 = 4. The block size is 256 minus the value of the 'interesting' octet in the mask. To find which subnet an address belongs to, find the largest multiple of the block size that is less than or equal to the address in the interesting octet. Example: 172.16.77.45/20. A /20 mask is 255.255.240.0 (block size 16 in the third octet). Multiples of 16: 64, 80. Since 77 falls between 64 and 79, the network is 172.16.64.0, broadcast 172.16.79.255, usable .65 through .78 in that octet's range — 4,094 usable hosts total.</p><p>VLSM (Variable-Length Subnet Masking) means using different mask lengths within the same address space to right-size each subnet and avoid waste. Always allocate from largest requirement to smallest. Example: from 192.168.1.0/24, a LAN needing 100 hosts takes a /25 (126 usable: .0–.127). A second LAN needing 50 hosts takes the next available /26 (.128–.191, 62 usable). A point-to-point link takes a /30 (.192–.195, 2 usable). Allocating small subnets first would fragment the space and strand larger blocks.</p><p>Wildcard masks (used in ACLs and OSPF) are the bitwise inverse of a subnet mask. A /24 (255.255.255.0) becomes wildcard 0.0.0.255. A 0 bit means 'must match exactly'; a 1 bit means 'don't care.' So 'permit 10.20.0.0 0.0.255.255' matches all of 10.20.0.0/16. For the exam, practice converting between prefix length, dotted-decimal mask, and wildcard mask instantly, and be ready to compute network, first host, last host, and broadcast for any prefix.</p>"},
{id:"r17",domain:1,title:"IPv6 In Depth",tags:["ipv6","slaac","dhcpv6","link-local","dual stack","eui-64","nd"],content:"<p>IPv6 uses 128-bit addresses written as eight hextets of four hex digits, separated by colons. Two compression rules apply: leading zeros in a hextet may be dropped (2001:0db8 → 2001:db8), and one run of consecutive all-zero hextets may be replaced with '::' a single time per address. So 2001:0db8:0000:0000:0000:0000:0000:0001 becomes 2001:db8::1. Knowing how to expand and compress addresses is commonly tested.</p><p>Key address types: Global unicast (typically 2000::/3) are internet-routable. Unique local (fc00::/7, in practice fd00::/8) are the IPv6 equivalent of RFC1918 private space. Link-local (fe80::/10) are auto-assigned to every interface and used for neighbor discovery and next-hop addressing — they are never routed off the link. Multicast (ff00::/8) replaces IPv4 broadcast; for example ff02::1 is all-nodes and ff02::2 is all-routers on the link. There is no broadcast in IPv6.</p><p>Address assignment can be stateless (SLAAC), where the host learns the /64 prefix from a Router Advertisement and builds its own interface ID using EUI-64 or a random value, or stateful (DHCPv6), where a server assigns full addresses and options. Neighbor Discovery Protocol (NDP) uses ICMPv6 messages — Router Solicitation/Advertisement and Neighbor Solicitation/Advertisement — to replace ARP and router discovery. Most organizations run dual stack (IPv4 and IPv6 simultaneously) during migration; transition tools include tunneling (6to4, Teredo) and translation (NAT64/DNS64).</p>"},
{id:"r18",domain:2,title:"Wireless Standards & RF Fundamentals",tags:["wifi","802.11","2.4ghz","5ghz","6ghz","channels","mimo","interference"],content:"<p>The 802.11 family has evolved through several generations. 802.11b/g operate at 2.4 GHz; 802.11a at 5 GHz; 802.11n (Wi-Fi 4) added MIMO and works in both bands; 802.11ac (Wi-Fi 5) is 5 GHz only with wider channels and MU-MIMO; 802.11ax (Wi-Fi 6, and Wi-Fi 6E when extended into 6 GHz) adds OFDMA, improved efficiency in dense environments, and target wake time. Higher throughput generally comes from wider channels, more spatial streams (MIMO), and higher-order modulation.</p><p>Band trade-offs matter for design. The 2.4 GHz band has longer range and better wall penetration but only three non-overlapping 20 MHz channels in the US (1, 6, 11) and heavy interference from microwaves, Bluetooth, and cordless phones. The 5 GHz band offers many more non-overlapping channels and less interference but shorter range; some channels require DFS (Dynamic Frequency Selection) to avoid radar. The 6 GHz band (Wi-Fi 6E/7) adds a large block of clean spectrum but the shortest range. In dense deployments, plan a channel reuse pattern, keep channel widths conservative on 2.4 GHz, and tune transmit power to limit co-channel interference.</p><p>Common RF concepts and problems: attenuation (signal loss over distance/obstacles), absorption (walls, water, people), reflection/multipath, and interference (co-channel from same-channel APs, adjacent-channel from overlapping channels). Tools include a Wi-Fi analyzer for channel utilization and a site survey/heat map for coverage planning. SNR (signal-to-noise ratio) and RSSI are the metrics to watch — low SNR causes retransmissions and slow throughput even with a 'full bars' RSSI reading."},
{id:"r19",domain:2,title:"Spanning Tree Protocol Deep Dive",tags:["stp","rstp","root bridge","bpdu","portfast","bpdu guard","loop"],content:"<p>Spanning Tree Protocol (802.1D) prevents Layer 2 loops in networks with redundant switch links. Without it, broadcasts circulate endlessly, creating a broadcast storm, MAC table instability, and multiple frame copies — symptoms that look like a total outage with near-100% link utilization. STP logically blocks redundant paths while keeping them ready as backups.</p><p>The process: first, switches elect a root bridge — the switch with the lowest bridge ID (a 2-byte priority plus its MAC address). Lower priority wins; the MAC breaks ties. Administrators set a low priority on the desired root (often a core switch) rather than leaving it to MAC luck. Each non-root switch then selects one root port (its lowest-cost path toward the root). Each segment elects one designated port. Remaining ports are placed in a blocking state. Classic STP port states are Blocking → Listening → Learning → Forwarding, taking 30–50 seconds to converge.</p><p>Rapid STP (802.1w) converges in seconds using port roles (root, designated, alternate, backup) and proposal/agreement handshakes; it is backward compatible and now the default on most switches. Edge features harden the design: PortFast moves an access port directly to forwarding (use only on host ports), BPDU Guard shuts a PortFast port if it receives a BPDU (catching a rogue switch), and Root Guard prevents an unexpected switch from becoming root. For the exam, know how the root is elected, the port roles/states, the symptoms of a missing STP, and what PortFast/BPDU Guard do."},
{id:"r20",domain:2,title:"High Availability & First-Hop Redundancy",tags:["hsrp","vrrp","glbp","redundancy","failover","nic teaming","ha"],content:"<p>High availability removes single points of failure so the network keeps working through component failures. At the gateway, first-hop redundancy protocols (FHRPs) let two or more routers present a single virtual IP and virtual MAC that hosts use as their default gateway. If the active router fails, a standby takes over the virtual address transparently — no client reconfiguration. HSRP (Cisco) uses active/standby with one forwarding router; VRRP is the open-standard equivalent (master/backup); GLBP additionally load-balances across multiple forwarding routers.</p><p>Redundancy applies at every layer. Link level: LACP/EtherChannel bundles multiple physical links so traffic continues if one fails, while also adding bandwidth. Switch level: redundant uplinks protected by RSTP, or stacking/MLAG so two switches act as one. Server/NIC level: NIC teaming (bonding) provides link failover and aggregation for hosts. Power: dual power supplies and UPS/generator. Path level: dynamic routing (OSPF/EIGRP) reroutes around failed links automatically.</p><p>Design metrics tie back to operations: redundancy improves availability (more 'nines'), reduces MTTR by enabling failover instead of repair-before-recovery, and supports SLA commitments. Beware of introducing loops when adding redundant Layer 2 paths — that is exactly what STP exists to manage. For the exam, recognize which protocol solves which single point of failure: FHRP for the gateway, LACP for links, RSTP for switch loops, dynamic routing for paths."},
{id:"r21",domain:4,title:"VPNs & IPsec",tags:["vpn","ipsec","ike","tunnel","site-to-site","remote access","ssl","split tunnel"],content:"<p>A VPN creates an encrypted tunnel across an untrusted network (usually the Internet), protecting confidentiality and integrity in transit. Two deployment models dominate. Site-to-site VPNs connect entire networks — for example, two branch offices — with the tunnel terminating on firewalls or routers; users are unaware it exists. Client-to-site (remote access) VPNs let individual roaming devices connect back to the corporate network using client software, ideal for work-from-anywhere employees.</p><p>IPsec is the most common framework for VPNs. It has two modes: transport mode encrypts only the payload (used host-to-host), while tunnel mode encrypts the entire original packet and adds a new header (used for site-to-site gateways). IPsec uses IKE (Internet Key Exchange) to authenticate peers and negotiate keys in two phases, then protects traffic with AH (integrity/authentication only) or, far more commonly, ESP (encryption plus integrity). Know that IPsec relies on UDP 500 for IKE and either ESP (protocol 50) directly or UDP 4500 when NAT traversal is required.</p><p>SSL/TLS VPNs (often clientless, via a browser) are an alternative that traverses firewalls easily on TCP 443 and is popular for remote access to specific applications. A key design decision is split tunneling versus full tunneling: with split tunneling only corporate-bound traffic enters the tunnel (better performance, less inspection), while full tunneling forces all traffic through the corporate gateway (more control and security). For the exam, match the VPN type to the scenario and remember IPsec's modes, components, and ports."},
{id:"r22",domain:1,title:"Cloud, Virtualization, SDN & SD-WAN",tags:["cloud","iaas","paas","saas","sdn","sd-wan","virtualization","nfv"],content:"<p>Cloud service models define who manages what. IaaS (Infrastructure as a Service) provides virtual compute, storage, and networking — you manage the OS and apps. PaaS (Platform as a Service) provides a managed runtime/platform — you manage only your application and data. SaaS (Software as a Service) delivers complete applications over the web — the provider manages almost everything. Deployment models include public, private, hybrid, and community clouds. Connectivity to the cloud may use the Internet, a VPN, or a dedicated private circuit (direct connect) for predictable performance.</p><p>Virtualization underpins both data centers and cloud. A hypervisor runs multiple virtual machines on one physical host; Type 1 (bare-metal) hypervisors run directly on hardware for production, while Type 2 run atop a host OS. Virtual switches connect VMs to the physical network, and concepts like VXLAN extend Layer 2 segments across Layer 3 fabrics, enabling large multi-tenant environments beyond the 4,094 VLAN limit.</p><p>Software-defined networking (SDN) separates the control plane (decisions) from the data plane (forwarding), centralizing intelligence in a controller that programs devices via APIs — enabling network-wide policy from one place. SD-WAN applies these ideas to the WAN: it abstracts multiple transports (MPLS, broadband, LTE) and uses application-aware policy from a central controller to steer each flow over the best path, improving cost, performance, and resilience versus traditional single-transport WANs. NFV (Network Function Virtualization) runs functions like firewalls and load balancers as software instances rather than dedicated appliances."},
{id:"r23",domain:4,title:"AAA, 802.1X, RADIUS & TACACS+",tags:["aaa","802.1x","radius","tacacs","authentication","authorization","accounting","nac"],content:"<p>AAA stands for Authentication (proving identity), Authorization (what you're allowed to do), and Accounting (recording what you did). Centralizing AAA means credentials and policy live on a server rather than on each device, improving security and auditability. Two protocols dominate. RADIUS (UDP 1812/1813, originally 1645/1646) is widely used for network access — Wi-Fi, VPN, and 802.1X — and combines authentication with authorization while encrypting only the password. TACACS+ (TCP 49) is favored for device administration because it separates the three AAA functions and encrypts the entire payload, enabling granular per-command authorization and accounting.</p><p>802.1X is port-based network access control with three roles: the supplicant (the device/software requesting access), the authenticator (the switch or AP that gates the port), and the authentication server (typically RADIUS). Until the supplicant authenticates — often via EAP methods such as EAP-TLS using certificates or PEAP using credentials — the port allows only authentication traffic. After success, the server can return a VLAN or policy to apply dynamically. This stops unauthorized devices from simply plugging in.</p><p>Network Access Control (NAC) builds on this by adding posture assessment: before granting access, it checks endpoint health (OS patch level, antivirus status, configuration) and can quarantine or remediate non-compliant devices. For the exam, be ready to choose RADIUS vs TACACS+ for a scenario (network access vs device admin), identify the 802.1X roles, and recognize NAC posture checks."},
{id:"r24",domain:3,title:"DNS In Depth & DNS Security",tags:["dns","records","recursion","caching","dnssec","ttl","forward","reverse"],content:"<p>DNS resolves names to addresses through a hierarchy: a client asks its recursive resolver, which queries root servers, then TLD servers (.com), then the domain's authoritative servers, caching each answer for its TTL (time to live). Understanding record types is essential. A maps a name to an IPv4 address; AAAA to IPv6. CNAME is an alias pointing one name to another canonical name. MX designates mail servers (with priority values). NS lists a zone's authoritative name servers. PTR provides reverse lookups (IP to name) and lives in a special reverse zone. SOA holds zone authority and timers. TXT stores arbitrary text, widely used for email authentication (SPF, DKIM, DMARC) and domain ownership verification.</p><p>Forward lookups (name to IP) are the common case; reverse lookups (IP to name via PTR) matter for mail server reputation and logging. TTL governs caching: long TTLs reduce query load but slow propagation of changes, so administrators often lower TTLs before a planned migration. Internal (split-horizon) DNS can return different answers to internal versus external clients for the same name.</p><p>DNS is a frequent attack target and troubleshooting source. DNS cache poisoning/spoofing inserts forged records to redirect users; DNSSEC mitigates this by cryptographically signing records so resolvers can validate authenticity (it provides integrity/authentication, not confidentiality). Operationally, 'ping by IP works but by name fails' is the classic sign of a DNS problem — verify with nslookup or dig against a specific server, check the configured resolver, and flush the local cache if stale entries are suspected."},
{id:"r25",domain:2,title:"Cabling, Connectors & Transceivers",tags:["cabling","cat6","fiber","sfp","qsfp","singlemode","multimode","standards","poe"],content:"<p>Copper twisted-pair categories define supported speed and distance, all capped at 100 meters: Cat5e (1 Gbps), Cat6 (1 Gbps to 100 m, 10 Gbps to ~55 m), Cat6a (10 Gbps to 100 m), and Cat7/Cat8 for higher-frequency/data-center use. Shielding (UTP vs STP/F/UTP) reduces electromagnetic interference in noisy environments. Beyond 100 m, or where EMI or electrical isolation matters, fiber is required. Plenum-rated cable is mandatory in air-handling spaces because of its fire/smoke characteristics.</p><p>Fiber comes in two families. Multimode (larger core, LED/VCSEL source, OM3/OM4/OM5) is cheaper and used for shorter runs — typically within a building or data center, up to a few hundred meters at 10–100 Gbps. Single-mode (small core, laser source, OS1/OS2) supports much longer distances — many kilometers — and higher speeds, used for campus backbones and carrier links. Common connectors include LC (small form factor, most common today), SC, and ST; copper uses RJ-45.</p><p>Transceivers are pluggable optics that match a port to a media type and distance: SFP (1 Gbps), SFP+ (10 Gbps), SFP28 (25 Gbps), QSFP+ (40 Gbps), and QSFP28 (100 Gbps). Choosing the right transceiver and matching fiber type (and wavelength) on both ends is essential — a multimode optic will not interoperate with single-mode fiber. Termination standards T568A/T568B define pin-outs; mixing them end-to-end yields a crossover. Always verify category, distance, connector, and optic type when planning or troubleshooting a physical link."},
{id:"r26",domain:3,title:"Quality of Service (QoS)",tags:["qos","dscp","cos","queuing","shaping","policing","jitter","latency"],content:"<p>QoS lets the network prioritize traffic so latency-sensitive applications perform well even under congestion. It matters most for real-time flows — VoIP and video conferencing — which are intolerant of delay (latency), variation in delay (jitter), and loss. The first step is classification and marking: traffic is identified (by port, application, or DSCP value) and tagged so downstream devices treat it consistently. Layer 3 marking uses DSCP in the IP header (for example, EF — Expedited Forwarding — for voice); Layer 2 marking uses CoS (802.1p) in the VLAN tag.</p><p>Once marked, devices apply policies. Queuing schemes such as priority queuing or low-latency queuing service high-priority traffic first; weighted fair queuing shares bandwidth proportionally. Congestion management decides what to drop when buffers fill (e.g., WRED drops lower-priority traffic earlier). Traffic shaping buffers and smooths bursts to a target rate (delaying rather than dropping), while traffic policing enforces a hard rate and drops or remarks excess immediately. Shaping suits outbound smoothing toward a slower WAN; policing suits enforcing a contracted rate.</p><p>A practical example: a branch with a congested WAN suffers choppy calls. Marking voice as DSCP EF, placing it in a priority queue, and shaping bulk traffic ensures voice is served first and bursts don't starve it — without buying more bandwidth. For the exam, connect symptoms (jitter, choppy voice) to the right tool (classification/marking plus prioritized queuing), and distinguish shaping (buffers/delays) from policing (drops/remarks)."},
{id:"r27",domain:5,title:"Structured Troubleshooting: Symptoms to Causes",tags:["troubleshooting","duplex","mtu","crc","loop","apipa","gateway","tools"],content:"<p>Effective troubleshooting pairs the CompTIA methodology with pattern recognition. Work the layers from the bottom up unless evidence says otherwise, because physical issues are common and cheap to rule out. Build a mental map from symptom to likely cause: 'ping by IP works, by name fails' → DNS; 'works on own subnet, nothing beyond' → default gateway; address in 169.254.x.x → APIPA, meaning no DHCP reachable; intermittent connectivity with an OS 'IP conflict' message → duplicate/overlapping address.</p><p>Physical-layer signatures are distinctive. Rising CRC and input errors point to a bad cable, EMI, a dirty fiber connector, or a failing transceiver. Late collisions and runts on a good cable indicate a speed/duplex mismatch. A gigabit-capable port negotiating only 100 Mbps (≈94 Mbps throughput) usually means a low-category or damaged cable, a 100 Mbps NIC, or a forced-speed mismatch. Large transfers stalling while small ones succeed — especially across a VPN — signals an MTU/fragmentation problem; lower the MTU/MSS. A cabling change that triggers near-100% utilization everywhere is a switching loop/broadcast storm caused by missing or disabled STP.</p><p>Match the tool to the question. Use ping for reachability, traceroute/tracert for path and where it breaks (remembering that '* * *' often just means a hop filters ICMP), nslookup/dig to test a specific DNS server, ipconfig/ip addr to verify addressing, arp -a for IP-to-MAC mappings, and a cable tester or TDR for physical faults and distance-to-break. After fixing anything, verify full functionality and document — confirming you didn't introduce a new problem and leaving a record for next time.</p>"}
,
{id:"r28",domain:3,title:"Change & Configuration Management",tags:["change management","configuration","baseline","rollback","documentation","approval"],content:"<p>Change management is the disciplined process for making network changes without causing avoidable outages. A formal change request captures what is changing, why, who is affected, and the risk level. It moves through review and approval (often a Change Advisory Board for higher-risk work), gets scheduled into a maintenance window to limit user impact, and is only then implemented. The two elements that matter most operationally are a clear implementation plan and a documented rollback (backout) plan so the team can return to the last known-good state quickly if the change fails.</p><p>Configuration management keeps the actual device state consistent and recoverable. Maintain a configuration baseline (the approved standard build) and store known-good configuration backups so any device can be restored or replaced from a template. Version control and automated config backups let you diff current against baseline to catch unauthorized or drifted changes. This is also how you enforce standardization across dozens or hundreds of devices.</p><p>Supporting documentation ties it together: physical and logical network diagrams, an IP address plan (IPAM), asset inventories, and rack/port mappings. When a change goes wrong at 2 a.m., accurate diagrams and a tested rollback plan are what separate a five-minute recovery from an all-night outage. For the exam, know the order of a change process, the purpose of a backout plan, and why baselines and config backups are essential."},
{id:"r29",domain:3,title:"Disaster Recovery, RPO & RTO",tags:["disaster recovery","backup","rpo","rto","high availability","redundancy","site"],content:"<p>Business continuity and disaster recovery (DR) planning define how the organization keeps running through failures ranging from a dead switch to a lost data center. Two metrics anchor every DR plan. RPO (Recovery Point Objective) is the maximum acceptable data loss, measured in time — an RPO of one hour means backups/replication must be no more than an hour apart. RTO (Recovery Time Objective) is the maximum acceptable downtime — how fast service must be restored. Tighter RPO/RTO cost more (more frequent replication, warmer standby sites).</p><p>Backup strategy supports the RPO. A full backup copies everything; incremental backups copy only what changed since the last backup (fast to create, slower to restore — you need the full plus every increment); differential backups copy everything changed since the last full (larger each day, but restore needs only the full plus the latest differential). The classic 3-2-1 rule — three copies, on two media types, one off-site — protects against site-level loss. Always test restores; an untested backup is a hope, not a plan.</p><p>Recovery-site options trade cost against speed: a hot site is fully running and can take over almost immediately (lowest RTO, highest cost); a warm site has equipment and data staged but needs setup; a cold site is just space and power (cheapest, slowest). High-availability designs — redundant power, links, FHRP gateways, clustered servers — reduce the chance you ever invoke DR. For the exam, be able to match a stated tolerance for data loss and downtime to the right RPO/RTO, backup type, and site tier."},
{id:"r30",domain:4,title:"Authentication, Authorization & Access Control",tags:["aaa","802.1x","radius","tacacs","nac","mfa","least privilege","rbac"],content:"<p>AAA — Authentication, Authorization, and Accounting — is the framework behind controlled network access. Authentication proves identity (something you know/have/are; multifactor combines categories). Authorization determines what an authenticated identity may do. Accounting logs what was done, for auditing and forensics. Two protocols implement AAA for network devices: RADIUS (open standard, UDP, encrypts only the password, commonly used for network/user access) and TACACS+ (Cisco-originated, TCP, encrypts the entire payload, separates AAA functions — favored for administrative device access with granular command authorization).</p><p>Port-based access uses 802.1X: the supplicant (client) authenticates through the authenticator (switch/AP) to an authentication server (RADIUS) before the port is opened. Network Access Control (NAC) extends this with posture checks — verifying patch level, antivirus, or certificate status — and can quarantine noncompliant devices onto a remediation VLAN. This is how organizations keep unmanaged or unhealthy devices off the production network.</p><p>Access-control models shape authorization. RBAC (role-based) grants permissions by job role — the practical default in most enterprises. Least privilege gives each identity only the access it needs, and separation of duties splits sensitive tasks across people to prevent abuse. These map directly to your IAM work: provisioning by role, removing orphaned accounts, and pruning privilege creep. For the exam, contrast RADIUS vs TACACS+, know the 802.1X roles, and recognize NAC's posture/quarantine function."},
{id:"r31",domain:4,title:"Network Hardening & Physical Security",tags:["hardening","port security","physical security","patching","default credentials","segmentation"],content:"<p>Hardening reduces a device's attack surface before an attacker ever probes it. Core steps: change default credentials immediately, disable unused services and ports, use secure management protocols (SSH not Telnet, HTTPS not HTTP, SNMPv3 not v1/v2c), apply firmware/patches on a schedule, and restrict management access to a dedicated management VLAN or out-of-band network with ACLs. Every one of these closes a common, well-known avenue of compromise.</p><p>Switch-port protections defend Layer 2. Port security limits which and how many MAC addresses a port accepts, stopping MAC flooding and unauthorized devices. DHCP snooping blocks rogue DHCP servers on untrusted ports; Dynamic ARP Inspection uses the snooping table to stop ARP spoofing; BPDU Guard shuts a PortFast edge port that unexpectedly receives BPDUs (a rogue switch). Disabling unused ports and placing them in an unused VLAN removes easy footholds. Segmentation (VLANs, and micro-segmentation in zero-trust designs) contains any breach to a small blast radius.</p><p>Physical security is the foundation — if someone can touch the hardware, most logical controls can be bypassed. Lock wiring closets and data centers, use badge access with logging, deploy cameras, secure console ports, and control for tailgating. Environmental controls (HVAC, fire suppression, UPS/generator) protect availability. For the exam, connect a hardening requirement to the specific control that satisfies it, and remember that changing defaults, patching, and disabling the unused are the highest-value first moves."},
{id:"r32",domain:5,title:"Wireless Troubleshooting",tags:["wireless","wifi","rssi","snr","interference","roaming","channel","dfs"],content:"<p>Wireless problems usually trace to RF conditions, not the client. Distinguish the key metrics: RSSI measures received signal strength (how strong), while SNR measures signal relative to the noise floor (how usable). A client can show strong RSSI yet perform terribly if the SNR is low because of interference — the classic 'full bars, slow speeds' complaint near microwaves, motors, or dense neighboring APs. Fixing throughput often means reducing noise or moving the client to a cleaner band/channel, not boosting power (which can worsen co-channel interference).</p><p>Channel and band planning prevents self-interference. In 2.4 GHz, only channels 1, 6, and 11 are non-overlapping — anything else causes adjacent-channel interference. The 5 GHz band offers many more clean channels but shorter range; some require DFS and will briefly change channels if radar is detected. Overlapping cells on the same channel cause co-channel interference and airtime contention. A site survey / heat map validates coverage and channel reuse; a Wi-Fi analyzer shows channel utilization and rogue APs.</p><p>Other recurring issues: sticky clients that won't roam to a closer AP (tune roaming thresholds), coverage holes and dead spots (attenuation from walls, distance), band steering pushing capable clients to 5 GHz, and authentication failures (wrong PSK, expired certificate, or a RADIUS/NPS problem for enterprise Wi-Fi). Mismatched security settings and captive-portal quirks also break association. For the exam, tie the symptom to the cause — low SNR to interference, poor roaming to thresholds, and 'works on 5 GHz but not 2.4' to band-specific interference or channel overlap."}
];

{id:"sx1_01",domain:1,question:"A company installs bollards, a mantrap vestibule, and motion-activated lighting at its data center entrance. In control TERMINOLOGY, how are these BEST categorized?",options:{A:"Technical controls that are preventive",B:"Physical controls that are preventive and deterrent",C:"Managerial controls that are directive",D:"Operational controls that are corrective"},answer:"B",explanation:"Bollards, vestibules, and lighting are physical controls — they act on the tangible environment rather than through software or policy. Functionally they prevent entry (bollards, vestibule) and deter attempts (lighting). Technical controls are implemented in technology, managerial controls are policies and risk decisions, and corrective controls act after an incident."},
{id:"sx1_02",domain:1,question:"An organization cannot patch a legacy medical device because the vendor no longer supports it. The team instead isolates the device on its own VLAN with strict ACLs. What TYPE of control has been implemented?",options:{A:"Corrective control",B:"Detective control",C:"Compensating control",D:"Deterrent control"},answer:"C",explanation:"A compensating control is deployed when the primary control (patching) cannot be applied, providing an alternative that reduces the same risk to an acceptable level. Segmentation and ACLs compensate for the missing patch. Corrective controls restore after an event, and detective controls identify events in progress."},
{id:"sx1_03",domain:1,question:"A user authenticates with a password, then approves a push notification on an enrolled phone. Which AAA element does this describe, and which factors are in use?",options:{A:"Authorization — something you know and somewhere you are",B:"Authentication — something you know and something you have",C:"Accounting — something you are and something you have",D:"Authentication — something you know and something you are"},answer:"B",explanation:"Verifying identity is authentication. A password is something you know; an enrolled phone receiving the push is something you have. Authorization determines what an authenticated identity may access, and accounting records what was done. Biometrics would be something you are."},
{id:"sx1_04",domain:1,question:"Which statement BEST captures the core principle of a Zero Trust architecture?",options:{A:"Devices inside the corporate perimeter are trusted by default",B:"A strong perimeter firewall makes internal segmentation unnecessary",C:"No implicit trust is granted based on network location; every request is verified",D:"Trust is established once at login and persists for the session"},answer:"C",explanation:"Zero Trust removes implicit trust based on network position — 'never trust, always verify.' Every request is authenticated, authorized, and continuously evaluated against policy regardless of whether it originates inside or outside the traditional perimeter. The other options describe the legacy castle-and-moat model Zero Trust replaces."},
{id:"sx1_05",domain:1,question:"In the Zero Trust model, which plane makes the access decision, and which enforces it?",options:{A:"The data plane decides; the control plane enforces",B:"The control plane decides via the Policy Engine; the data plane enforces via the Policy Enforcement Point",C:"Both decision and enforcement occur in the data plane",D:"The Policy Administrator enforces while the Policy Enforcement Point decides"},answer:"B",explanation:"In Zero Trust, the control plane holds the Policy Engine (which evaluates policy and makes the grant/deny decision) and the Policy Administrator (which communicates it). The data plane contains the Policy Enforcement Point, which actually allows or blocks the subject's access to the resource."},
{id:"sx1_06",domain:1,question:"A security team deploys a decoy server containing realistic but fake customer records to observe attacker behavior. What is this called?",options:{A:"A honeypot",B:"A honeyfile",C:"A honeytoken",D:"A sandbox"},answer:"A",explanation:"A honeypot is a full decoy system deployed to attract and study attackers. A honeyfile is a single bait file, and a honeytoken is a bait credential or record whose use signals compromise. A sandbox is an isolated execution environment for analyzing untrusted code, not a decoy for attackers."},
{id:"sx1_07",domain:1,question:"Two parties who have never communicated before need to derive a shared symmetric key over an untrusted network without transmitting the key itself. Which mechanism accomplishes this?",options:{A:"AES in GCM mode",B:"SHA-256 hashing",C:"Diffie-Hellman key exchange",D:"A hardware security module"},answer:"C",explanation:"Diffie-Hellman lets two parties independently compute the same shared secret by exchanging only public values, so the key is never transmitted. AES is the symmetric cipher that would then use the key, SHA-256 provides integrity not key agreement, and an HSM stores and protects keys rather than negotiating them."},
{id:"sx1_08",domain:1,question:"A developer signs a software package with their private key. What does a recipient who verifies the signature with the matching public key learn?",options:{A:"Only that the package is encrypted and confidential",B:"That the package came from the holder of the private key and has not been altered",C:"That the package is free of malware",D:"That the package was transmitted over a secure channel"},answer:"B",explanation:"A digital signature provides authenticity, integrity, and non-repudiation: successful verification proves the signer held the private key and that the content is unmodified. It does NOT provide confidentiality (the package is not encrypted), nor does it certify the code is benign — a signed package can still be malicious."},
{id:"sx1_09",domain:1,question:"A database stores user passwords. Which approach BEST protects them against precomputed rainbow-table attacks?",options:{A:"Encrypt each password with AES-256 using a shared key",B:"Hash each password with MD5",C:"Hash each password with a unique random salt using a slow key-derivation function",D:"Store passwords with reversible base64 encoding"},answer:"C",explanation:"A unique per-user salt makes precomputed tables useless because identical passwords hash differently, and a deliberately slow KDF (bcrypt, scrypt, Argon2, PBKDF2) makes brute forcing expensive. Encryption is reversible and creates key-management risk, MD5 is fast and broken, and base64 is encoding, not protection."},
{id:"sx1_10",domain:1,question:"A payment processor replaces stored card numbers with randomly generated surrogate values held in a separate secure vault. Which technique is in use?",options:{A:"Tokenization",B:"Data masking",C:"Steganography",D:"Symmetric encryption"},answer:"A",explanation:"Tokenization substitutes sensitive data with a non-sensitive surrogate that has no mathematical relationship to the original; the mapping lives in a protected vault. Masking obscures part of a value for display (e.g., ****1234), steganography hides data inside other media, and encryption produces ciphertext that can be reversed with a key."},
{id:"sx1_11",domain:1,question:"An organization requires that all production changes go through a documented approval workflow with a defined backout plan and maintenance window. Which benefit is MOST directly gained?",options:{A:"Elimination of all unplanned outages",B:"Reduced risk of unreviewed changes causing outages, with a defined path to restore service",C:"Automatic compliance with every regulatory framework",D:"Removal of the need for configuration baselines"},answer:"B",explanation:"Formal change management ensures changes are reviewed, scheduled, and reversible. The backout plan specifically provides the defined path to restore service if a change fails. It reduces — but cannot eliminate — unplanned outages, and it supports rather than guarantees compliance."},
{id:"sx1_12",domain:1,question:"A certificate presented by a web server is signed by an intermediate CA. What must the client do to establish trust?",options:{A:"Verify the chain up to a root CA present in its trust store",B:"Contact the server's administrator to confirm the certificate",C:"Verify only that the certificate has not expired",D:"Decrypt the certificate using the server's private key"},answer:"A",explanation:"Trust is established by validating the certificate chain — the server cert is signed by the intermediate, which is signed (directly or through further intermediates) by a root CA the client already trusts. The client also checks validity dates and revocation status, but chain validation to a trusted root is the essential step."},
{id:"sx1_13",domain:1,question:"Which mechanism allows a client to check certificate revocation status in real time with a single lightweight query, rather than downloading a large list?",options:{A:"CRL (Certificate Revocation List)",B:"OCSP (Online Certificate Status Protocol)",C:"CSR (Certificate Signing Request)",D:"SAN (Subject Alternative Name)"},answer:"B",explanation:"OCSP queries a responder about one specific certificate and returns good, revoked, or unknown. A CRL is the full downloadable list of revoked serial numbers, which scales poorly. A CSR requests issuance, and a SAN extension lists additional names a certificate covers."},
{id:"sx1_14",domain:1,question:"A laptop uses a dedicated chip soldered to the motherboard to store the keys that protect full-disk encryption, releasing them only if boot integrity measurements match. What is this component?",options:{A:"HSM (Hardware Security Module)",B:"TPM (Trusted Platform Module)",C:"KMS (Key Management Service)",D:"Secure enclave co-processor for biometric templates"},answer:"B",explanation:"A TPM is an on-board chip that stores keys and platform measurements, releasing the disk-encryption key only when boot state is unchanged. An HSM is typically a removable or network-attached appliance for high-volume enterprise key operations, and a KMS is a cloud/software key-management service."},
