{id:"n4_18",domain:4,question:"A network engineer disables all unused switch ports and assigns them to an unused VLAN with no routing. Which security principle does this action MOST directly implement?",options:{A:"Separation of duties",B:"Least privilege for administrative accounts",C:"Reducing the attack surface",D:"Non-repudiation"},answer:"C",lead:"Every enabled port is an entry point an intruder with physical access could use. Shutting them down and parking them in a black-hole VLAN removes those entry points, which is the definition of reducing attack surface. It is a core hardening step alongside disabling unnecessary services and closing unused ports.",why:{A:"Splits sensitive tasks among multiple people to prevent unilateral abuse.",B:"Constrains what accounts can do rather than what physical ports are available.",D:"Ensures an action cannot be credibly denied by its performer."}},
{id:"n4_19",domain:4,question:"A remote user must access a single internal web application from a personal, unmanaged device, with no software installed on that device. Which access method is MOST appropriate?",options:{A:"A site-to-site VPN from the user's home router",B:"A full tunnel IPsec VPN client",C:"An RDP session published directly to the Internet",D:"A clientless SSL VPN through a browser-based portal"},answer:"D",lead:"A clientless SSL VPN publishes specific applications through an HTTPS portal, so the user needs only a browser. Nothing is installed, and because only the published applications are reachable, an unmanaged and potentially compromised device is never given broad network access.",why:{A:"Requires managing infrastructure at the user's home and still grants network-layer reachability.",B:"Requires client installation and grants full network-layer access, which is inappropriate for an unmanaged endpoint.",C:"Exposes RDP directly to the Internet, a well-documented ransomware entry vector."}},
{id:"n4_20",domain:4,question:"A firewall administrator wants to block employees from reaching gambling and known malware-hosting websites regardless of which port or protocol is used. Which control is BEST suited?",options:{A:"A content and URL filter with reputation-based categories",B:"An IPS signature matching HTTP GET requests",C:"A port-based firewall rule denying nonstandard ports",D:"A stateless ACL blocking outbound TCP 80 and 443"},answer:"A",lead:"URL and content filtering evaluates the destination by category and reputation, using continuously updated feeds. It blocks the site regardless of the port used, and modern implementations inspect TLS via decryption or SNI so HTTPS is covered as well.",why:{B:"Can catch specific known payloads but is not a practical mechanism for categorizing millions of sites.",C:"Addresses evasion by port but does not distinguish permitted sites from prohibited ones.",D:"Would block virtually all web browsing, not just the targeted categories."}},
{id:"n4_21",domain:4,question:"An accounting clerk receives a phone call from someone claiming to be the CFO, who states that a wire transfer must be completed within the hour to close an acquisition and that normal approval steps should be skipped for confidentiality. Which control would MOST reliably prevent a loss?",options:{A:"Annual security awareness training for all staff",B:"An out-of-band verification procedure using a known-good contact number before any transfer",C:"An email gateway rule quarantining messages from external senders",D:"Multifactor authentication on the accounting application"},answer:"B",lead:"This is business email compromise executed by voice — vishing combined with pretexting and manufactured urgency. The defining feature is a request to bypass normal process. A mandatory callback to a number from the corporate directory, never one supplied by the caller, breaks the attack because the real executive will not confirm the request.",why:{A:"Helps but is a general control rather than the specific procedural barrier that stops this transaction.",C:"Does not apply to a phone call.",D:"Protects login, while here the authorized user is being manipulated into performing a legitimate-looking action."}},
{id:"n4_22",domain:4,question:"An organization layers a perimeter firewall, network segmentation, endpoint protection, application allow-listing, and encrypted backups. Which security principle does this combination illustrate, and what is its core assumption?",options:{A:"Least privilege, assuming users request more access than they need",B:"Separation of duties, assuming no individual should control an entire process",C:"Defense in depth, assuming any single control may fail or be bypassed",D:"Implicit deny, assuming anything not expressly permitted is forbidden"},answer:"C",lead:"Defense in depth deliberately overlaps independent controls at different layers so that the failure of any one does not result in compromise. The assumption is that every control eventually fails — through a zero day, a misconfiguration, or a determined attacker — so the question becomes what stands behind it.",why:{A:"A, B, and D are all real principles, but each describes a single specific control philosophy rather than the layering of multiple independent defenses described in the stem.",B:"A, B, and D are all real principles, but each describes a single specific control philosophy rather than the layering of multiple independent defenses described in the stem.",D:"A, B, and D are all real principles, but each describes a single specific control philosophy rather than the layering of multiple independent defenses described in the stem."}},
{id:"n4_23",domain:4,question:"A regional bank must ensure that account balance data cannot be altered without detection during transmission between branches. Which element of the CIA triad is the primary concern, and which mechanism addresses it?",options:{A:"Confidentiality, addressed by symmetric encryption of the channel",B:"Availability, addressed by redundant WAN circuits",C:"Integrity, addressed by role-based access control on the database",D:"Integrity, addressed by cryptographic hashing and digital signatures"},answer:"D",lead:"Integrity is the assurance that data has not been modified. A cryptographic hash detects any change, and a digital signature additionally proves origin, so an alteration in transit is both detectable and attributable.",why:{A:"Protects data from being read, which is valuable but is not what the stem asks about.",B:"Keeps the link up but says nothing about whether data was altered.",C:"Correctly names integrity but pairs it with an access control mechanism that governs who may change data at rest, not detection of modification in transit."}},
{id:"n4_24",domain:4,question:"During a security review, an engineer finds that a switch port connected to a lobby kiosk is configured with switchport mode dynamic auto. Why is this a concern, and what should it be changed to?",options:{A:"It can be negotiated into a trunk by an attacker; it should be set to a static access port with DTP disabled",B:"It prevents the kiosk from obtaining a DHCP address; it should be set to trunk mode",C:"It disables spanning tree on the port; it should have PortFast enabled",D:"It limits the port to 100 Mbps; it should be set to auto-negotiate gigabit speed"},answer:"A",lead:"Dynamic auto will form a trunk if the neighbor sends DTP frames requesting one. An attacker connecting a device that speaks DTP can negotiate a trunk and gain access to every VLAN allowed on it — switch spoofing. The port should be hardcoded as an access port with negotiation turned off.",why:{B:"Is false, as an access-mode port passes DHCP normally.",C:"Misstates the effect on spanning tree.",D:"Confuses DTP with speed negotiation."}},
{id:"n4_25",domain:4,question:"A retail chain must ensure that a tablet used for inventory can only authenticate to the corporate application while physically inside a store location. Which control MOST directly enforces this?",options:{A:"Full disk encryption on the tablet",B:"Geofencing based on the device's location",C:"A time-based access restriction during store hours",D:"Certificate-based device authentication"},answer:"B",lead:"Geofencing defines a virtual boundary around a physical location and permits or denies access based on whether the device is inside it. This is the control that ties authorization to physical presence.",why:{A:"Protects data at rest if the tablet is stolen and has no bearing on where authentication succeeds.",C:"Restricts when rather than where.",D:"Proves the device's identity but works from anywhere in the world."}},
{id:"n5_01",domain:5,question:"A technician has tested a theory, confirmed the probable cause, and established a plan of action to resolve the problem. According to the CompTIA troubleshooting methodology, what is the NEXT step?",options:{A:"Verify full system functionality and implement preventive measures",B:"Document findings, actions, and outcomes",C:"Implement the solution or escalate as necessary",D:"Establish a new theory of probable cause"},answer:"C",lead:"The seven steps are: identify the problem, establish a theory, test the theory, establish a plan of action, implement the solution or escalate, verify full system functionality and implement preventive measures, and document findings. Having just completed step four, implementation is next.",why:{A:"Is step six, which follows implementation.",B:"Is step seven, the final step.",D:"Would be required only if testing had DISPROVEN the theory, but the stem says it was confirmed."}},
{id:"n5_02",domain:5,question:"A user reports intermittent slowness. Before escalating, the technician asks the user to reproduce the issue while observing, and notes the exact time, application, and destination. Which step of the methodology does this represent?",options:{A:"Verify full system functionality",B:"Establish a plan of action to resolve the problem",C:"Test the theory to determine the cause",D:"Identify the problem, by gathering information and duplicating the issue"},answer:"D",lead:"The first step involves gathering information, questioning users, identifying symptoms, determining whether anything changed, and — critically — duplicating the problem if possible. Watching the user reproduce it converts a vague report into observable, specific data.",why:{A:"A and B both come later in the sequence, after a cause has been established.",B:"A and B both come later in the sequence, after a cause has been established.",C:"Requires a theory to exist first, which has not yet been formed."}},
{id:"n5_03",domain:5,question:"A technician runs a traceroute to a remote server. Hops 4 and 5 return asterisks, but hops 6 through 9 respond normally and the destination is reached. What is the correct interpretation?",pre:"  1    1 ms   1 ms   1 ms  10.1.1.1\n  2    4 ms   3 ms   4 ms  10.255.0.9\n  3    9 ms   8 ms   9 ms  203.0.113.5\n  4    *      *      *     Request timed out.\n  5    *      *      *     Request timed out.\n  6   22 ms  21 ms  22 ms  198.51.100.30\n  7   24 ms  23 ms  24 ms  198.51.100.61\n  8   26 ms  27 ms  26 ms  198.51.100.90\n  9   28 ms  27 ms  28 ms  203.0.113.200",options:{A:"Routers 4 and 5 are not replying to the probes, but they are forwarding traffic normally",B:"The destination server is unreachable and the trace failed",C:"A routing loop exists between hops 4 and 5",D:"The path is broken at hop 4 and traffic is being dropped there"},answer:"A",lead:"Timeouts in the MIDDLE of a trace that later completes mean those routers did not generate ICMP Time Exceeded replies — commonly because ICMP is filtered or rate limited on that device — while still forwarding the packets. Since hops 6 through 9 answered, traffic clearly passed through 4 and 5.",why:{B:"Is contradicted by hop 9 replying.",C:"Would show the same addresses repeating with climbing TTLs.",D:"Is disproven by every subsequent hop responding."}},
{id:"n5_04",domain:5,question:"A workstation is configured with the address 192.168.10.100, subnet mask 255.255.255.240, and default gateway 192.168.10.1. The user can reach a printer at 192.168.10.105 but cannot reach anything outside the local network. What is the cause?",options:{A:"The default gateway is correct but the DNS server address is missing",B:"The gateway address falls outside the subnet the mask defines, so the host cannot reach it",C:"The mask is too large, creating a broadcast storm on the segment",D:"The printer and workstation are on different subnets and should not communicate"},answer:"B",lead:"A 255.255.255.240 mask is a /28 with a block size of 16. The address .100 falls in the .96 through .111 range, so the host believes its local subnet is 192.168.10.96/28. The printer at .105 is inside that range and is reachable directly by ARP. The gateway at .1 is NOT, so the host has no way to send traffic off-subnet. The mask should be 255.255.255.0.",why:{A:"Would break name resolution but leave IP connectivity intact.",C:"Describes a condition a subnet mask cannot cause.",D:"Is backwards, since the two ARE in the same computed subnet, which is why that part works."}},
{id:"n5_05",domain:5,question:"Users on one floor report that the network is fine in the morning but nearly unusable by mid-afternoon. The access switch uplink shows the counters below. What is the MOST likely root cause?",pre:"GigabitEthernet0/1 is up, line protocol is up\n  Half-duplex, 100Mb/s\n  312,884 packets input, 1,441,204 bytes\n     94,120 input errors, 88,205 CRC, 5,915 frame\n  418,220 packets output\n     72,441 output errors, 0 collisions, 68,102 late collision",options:{A:"The uplink is oversubscribed and dropping traffic during peak hours",B:"Electromagnetic interference from a nearby motor affecting the cable run",C:"A duplex mismatch, with this side at half duplex and the far end at full duplex",D:"A failing transceiver that intermittently loses light"},answer:"C",lead:"Late collisions are the diagnostic signature of a duplex mismatch. A collision detected after the first 64 bytes means the far end transmitted while this half-duplex side was already sending, which is exactly what a full-duplex partner does because it never listens before transmitting. The accompanying CRC and frame errors are the corrupted results. Symptoms worsen with load, matching the afternoon degradation.",why:{A:"Would show output drops rather than collisions, and the interface is only at 100 Mb.",B:"Produces CRC and frame errors but not late collisions.",D:"Applies to fiber, while this is a copper interface."}},
{id:"n5_06",domain:5,question:"A newly installed 60-meter copper run between a switch and a workstation shows a link, but the interface logs continuous CRC errors and throughput is a fraction of expected. The cable passes directly alongside fluorescent light ballasts for part of its route. Which TWO remediations are MOST appropriate? (Select TWO)",options:{A:"Replace the run with shielded twisted pair and bond the shield to ground",B:"Reroute the cable away from the interference source",C:"Increase the switch port's MTU to 9000",D:"Reduce the cable length to under 55 meters",E:"Change both interfaces to half duplex"},answer:["A", "B"],lead:"CRC errors on a run passing next to fluorescent ballasts point to electromagnetic interference corrupting frames in transit. The two correct responses are physical: move the cable away from the source, or use shielded twisted pair with a properly bonded shield so induced noise is drained to ground rather than into the conductors.",why:{C:"Would make matters worse by increasing the amount of data lost per corrupted frame.",D:"Is irrelevant, since 60 meters is well within the 100-meter limit and length is not the fault.",E:"Degrades performance and does not stop noise."}},
{id:"n5_07",domain:5,question:"After a technician patches two ports in the same closet to the same VLAN with a spare cable, the entire building experiences near-total outage. Switch CPU is at 100 percent, and the console shows repeated MAC flapping messages. What should the technician do FIRST?",options:{A:"Enable spanning tree globally on all switches",B:"Increase the CPU threshold alarm on the affected switches",C:"Reboot the core switch to clear the MAC address table",D:"Physically disconnect the newly added cable to break the loop"},answer:"D",lead:"MAC flapping plus saturated CPU plus a network-wide outage immediately following a cabling change is a Layer 2 loop causing a broadcast storm. The fastest and safest first action is to remove the change that caused it. Restoring service comes before root cause analysis, and this also confirms the theory.",why:{A:"Is a valid long-term fix but takes far longer than pulling one cable, and the loop persists in the meantime.",B:"Acknowledges the symptom while doing nothing about it.",C:"Clears the table momentarily but the loop instantly refills it, and it extends the outage."}},
{id:"n5_08",domain:5,question:"A user reports being unable to reach an internal application server. The technician gathers the output below. What is the MOST likely cause?",pre:"C:\\> ipconfig\n   IPv4 Address. . . . . . . . . . . : 10.4.12.61\n   Subnet Mask . . . . . . . . . . . : 255.255.255.0\n   Default Gateway . . . . . . . . . : 10.4.12.1\n\nC:\\> ping 10.4.12.1\nReply from 10.4.12.1: bytes=32 time<1ms TTL=255\n\nC:\\> ping 10.9.30.40\nRequest timed out.\n\nC:\\> arp -a\n  Internet Address      Physical Address      Type\n  10.4.12.1             00-1a-2b-3c-4d-5e     dynamic\n  10.4.12.61            00-1a-2b-99-88-77      dynamic",options:{A:"An ARP entry shows the workstation's own IP mapped to a different MAC, indicating a duplicate address",B:"The subnet mask is too small for the 10.0.0.0 network",C:"The default gateway is unreachable and must be corrected",D:"DNS resolution is failing for the application server"},answer:"A",lead:"The host's own address 10.4.12.61 appears in its ARP cache as a dynamic entry with a MAC that is not its own. A host never ARPs for itself, so this entry means another device on the segment is answering for that address — a duplicate IP. The result is unpredictable connectivity, since return traffic reaches whichever host answered most recently.",why:{B:"Is a design opinion, not a fault — a /24 inside 10.0.0.0/8 is perfectly valid.",C:"Is disproven by the successful ping to the gateway.",D:"Is not indicated, since the test used an IP address and not a name."}},
{id:"n5_09",domain:5,question:"Users can browse the Internet and reach internal servers by IP address, but every attempt to reach a resource by hostname fails immediately with a name-not-found error. What is the MOST likely cause?",options:{A:"A firewall rule is blocking outbound TCP 443",B:"The clients are configured with an unreachable or incorrect DNS server",C:"The default gateway on the clients is misconfigured",D:"The DHCP scope has been exhausted"},answer:"B",lead:"Working IP connectivity with failing name resolution isolates the fault to DNS. Note the detail that browsing the Internet still works — which occurs when clients hold cached entries or when a secondary resolver answers public queries while the internal zone cannot be reached.",why:{A:"Would break HTTPS specifically, not name lookups.",C:"Would break all off-subnet connectivity, including by IP address.",D:"Would leave clients with APIPA addresses and no connectivity at all."}},
{id:"n5_10",domain:5,question:"An engineer needs to confirm whether a 1400-byte payload can traverse a path without fragmentation. Which command accomplishes this on a Windows host?",options:{A:"pathping -q 1400 <destination>",B:"tracert -h 1400 <destination>",C:"ping -f -l 1400 <destination>",D:"ping -n 1400 <destination>"},answer:"C",lead:"The -f flag sets the Do Not Fragment bit and -l specifies the payload size. If a link along the path has a smaller MTU, the router must drop the packet and return an ICMP fragmentation-needed message, which the ping reports. Decrementing the size until it succeeds identifies the path MTU.",why:{A:"Sets the number of queries per hop.",B:"Sets the maximum hop count for the trace.",D:"Sets the NUMBER of echo requests to send, not the size."}},
{id:"n5_11",domain:5,question:"A security analyst reviews the scan output below from a server that is supposed to host only an internal web application. Which finding warrants the MOST immediate attention?",pre:"Nmap scan report for appsrv04 (10.8.20.44)\nPORT     STATE    SERVICE\n22/tcp   open     ssh\n80/tcp   open     http\n443/tcp  open     https\n3389/tcp open     ms-wbt-server\n23/tcp   open     telnet\n445/tcp  filtered microsoft-ds",options:{A:"Port 80 is open alongside 443, creating a redundant service",B:"SSH on port 22 should be moved to a nonstandard port",C:"Port 445 is filtered, which prevents legitimate file sharing",D:"Telnet on port 23 is open, exposing credentials and sessions in cleartext"},answer:"D",lead:"Telnet transmits usernames, passwords, and all session data in cleartext, and it has no place on a modern server — especially one that already has SSH available. It should be disabled immediately and the exposure investigated, since it may indicate the host was not built from the approved baseline.",why:{A:"Is a normal configuration where 80 typically redirects to 443.",B:"Is security through obscurity and provides minimal real benefit compared with an unencrypted protocol being open.",C:"Is a hardening success, since filtered means the port is being blocked as intended."}},
{id:"n5_12",domain:5,question:"A client's application connects successfully to a load-balanced service, but a small percentage of sessions reset immediately after the TCP handshake. The security team recently deployed an asymmetric routing design in which outbound traffic exits through a different firewall than the one that saw the inbound flow. What explains the resets?",options:{A:"The stateful firewall on the return path has no session entry and drops the traffic",B:"The application server has exhausted its connection backlog",C:"The load balancer is using round robin instead of least connections",D:"The client's MTU is too large for the path"},answer:"A",lead:"A stateful firewall permits return traffic only when it matches an entry in its connection table. Asymmetric routing sends the return packets through a firewall that never observed the handshake, so it has no state, treats the packets as out of window, and drops or resets them. Fixes include making the path symmetric, using state synchronization between firewall peers, or source NAT at the load balancer.",why:{B:"Would cause connections to be refused or time out during the handshake, not reset just after it.",C:"Affects distribution fairness, not connection validity.",D:"Would cause hangs on large transfers, not immediate resets."}},
{id:"n5_13",domain:5,question:"A user in a corner office reports that Wi-Fi shows three of five bars but downloads are extremely slow, while a colleague sitting near the access point has no issues. A wireless analyzer shows RSSI at -72 dBm and SNR at 8 dB in the corner office. What is the MOST likely cause?",options:{A:"The access point has reached its maximum client association limit",B:"A low signal-to-noise ratio is forcing the client to a very low data rate with heavy retransmission",C:"The client's wireless adapter driver is out of date",D:"The client has associated to the wrong SSID and is on the guest network"},answer:"B",lead:"RSSI alone is a poor quality indicator. An SNR of 8 dB means the signal is barely above the noise floor, so the radio negotiates down to a very low modulation rate and still suffers frequent retransmission. Around 20 dB or better is the target for solid data performance, and 25 dB or more for voice.",why:{A:"Would prevent association entirely or cause disconnects, and the colleague nearby is unaffected.",C:"Is possible but does not explain a measurement showing the RF conditions are genuinely poor.",D:"Would typically produce different addressing and a captive portal, not merely slowness."}},
{id:"n5_14",domain:5,question:"A technician must determine whether a newly terminated fiber pair has excessive loss and locate the exact distance to a suspected break. Which tool is required?",options:{A:"A light meter with a source",B:"A TDR",C:"An OTDR",D:"A tone generator and probe"},answer:"C",lead:"An optical time domain reflectometer injects light and analyzes backscatter and reflections, producing a trace that shows loss events, splices, connectors, and breaks along with their distance from the origin. That distance-to-fault capability is what the scenario requires.",why:{A:"Measures total end-to-end loss accurately but cannot indicate where along the run the loss occurs.",B:"Performs the same function for COPPER cable, not fiber.",D:"Traces which cable is which in a bundle and identifies pairs, with no loss measurement."}},
{id:"n5_15",domain:5,question:"After a power outage, an entire VLAN loses connectivity while other VLANs work. The technician finds that the switch's uplink is up and the VLAN exists, but the SVI on the distribution switch shows administratively down. What is the FASTEST path to restoration, and what should follow?",options:{A:"Replace the uplink fiber and transceiver on the access switch",B:"Reload the distribution switch to restore its saved configuration",C:"Re-create the VLAN on the access switch and reassign all ports",D:"Bring the SVI up with the no shutdown command, then investigate why it was shut and document the change"},answer:"D",lead:"Administratively down means an operator or a stored configuration explicitly shut the interface — it is not a hardware fault. Issuing no shutdown restores routing for that VLAN immediately. Because the state survived a reload, the running configuration likely differs from what was expected, so the follow-up is to determine why and document it.",why:{A:"A and C address components the stem has already confirmed are healthy.",B:"Risks loading a configuration that also has the interface shut, and causes an outage for all VLANs.",C:"A and C address components the stem has already confirmed are healthy."}},
{id:"n5_16",domain:5,question:"Users complain that a file transfer to a branch office achieves only 3 Mbps despite a 100 Mbps circuit. The round trip time is 180 ms and the TCP window size is 64 KB. What is the MOST likely limiting factor?",options:{A:"The bandwidth-delay product is limiting throughput because the TCP window is too small",B:"The circuit is misprovisioned and the carrier must be engaged",C:"A duplex mismatch on the WAN interface is causing retransmissions",D:"The file server's disk subsystem cannot read fast enough"},answer:"A",lead:"A single TCP session can only have one window's worth of unacknowledged data in flight. With a 64 KB window and 180 ms round trip, maximum throughput is approximately 65536 bytes x 8 bits / 0.180 seconds, which is about 2.9 Mbps — matching the observed 3 Mbps almost exactly. The link is not the constraint; the window is. Window scaling or parallel streams resolves it.",why:{B:"Is contradicted by the arithmetic explaining the result precisely.",C:"Would produce errors and collisions, which are not mentioned.",D:"Would not correlate so cleanly with latency."}},
{id:"n5_17",domain:5,question:"A technician needs to confirm which local process is listening on TCP 8080 on a Linux server and identify its process ID. Which command is MOST appropriate?",options:{A:"nmap -p 8080 localhost",B:"ss -tlnp",C:"tcpdump -i any port 8080",D:"traceroute localhost"},answer:"B",lead:"The ss utility with -t for TCP, -l for listening, -n for numeric, and -p for process information lists listening sockets alongside the owning program and PID. The older netstat -tlnp does the same thing.",why:{A:"Confirms the port is open but reveals nothing about which local process owns it.",C:"Captures traffic on the port but does not map it to a PID.",D:"Traces a network path and is meaningless against the loopback interface."}},
{id:"n5_18",domain:5,question:"A branch reports that only one specific web application is unreachable, while all other Internet and internal traffic works. The application uses TCP 8443. Testing from the branch shows the connection times out with no response, and testing from headquarters succeeds. What is the MOST likely cause?",options:{A:"DNS at the branch is returning a stale address for the application",B:"The branch router's default route has been removed",C:"A firewall or ACL along the branch path is silently dropping TCP 8443",D:"The application server has crashed and is not accepting connections"},answer:"C",lead:"A timeout with no response indicates a silent drop, which is characteristic of a firewall or ACL configured to deny rather than reject. The fact that a single port is affected while all other traffic works, and that the same test succeeds from another site, points to a path-specific filtering rule rather than a server or client problem.",why:{A:"Would produce a connection to the wrong host, and other resolution would likely be affected too.",B:"Would break all off-network traffic, not one port.",D:"Would affect headquarters too, and a stopped service usually returns a reset rather than a timeout."}},
{id:"n5_19",domain:5,question:"After a switch stack member was replaced, several access ports on that member show up/up but the attached workstations get no connectivity and no DHCP address. Ports on the other stack members are unaffected. What should the technician check FIRST?",options:{A:"Whether the core switch's routing table contains the VLAN's subnet",B:"Whether the DHCP scope has enough addresses remaining",C:"Whether the workstations have current network adapter drivers",D:"Whether the replacement member loaded the stack's configuration or came up with defaults"},answer:"D",lead:"When a stack member is replaced, it must adopt the stack's configuration and software version from the master. If it joined with a mismatched image or failed to inherit the port configuration, its interfaces come up in default VLAN 1 with no meaningful configuration — link lights on, no usable connectivity. The scoping of the fault to exactly one member is the decisive clue.",why:{A:"A, B, and C would all affect ports across multiple members, not just the replaced one.",B:"A, B, and C would all affect ports across multiple members, not just the replaced one.",C:"A, B, and C would all affect ports across multiple members, not just the replaced one."}},
{id:"n5_20",domain:5,question:"A VoIP deployment suffers from choppy audio in one direction only. Packet captures show consistent 40 ms one-way latency but wide variation in inter-packet arrival times on the affected direction. Which metric is out of specification, and what is the typical remedy?",options:{A:"Jitter, remedied by a jitter buffer and QoS prioritization of the voice queue",B:"Packet loss, remedied by enabling TCP retransmission for the media stream",C:"Latency, remedied by shortening the physical path to the provider",D:"Bandwidth, remedied by upgrading the circuit to a higher committed rate"},answer:"A",lead:"Consistent 40 ms latency is well within the acceptable range for voice, so delay itself is not the fault. Variation in arrival times is jitter, and it is what causes choppy audio because the decoder cannot reconstruct a smooth stream. A jitter buffer absorbs modest variation, and QoS keeps voice packets out of queues where they experience variable delay behind bulk traffic.",why:{B:"Is invalid because RTP media rides on UDP and never retransmits.",C:"Addresses a metric already shown to be acceptable.",D:"May be a contributing factor but is not what the measurement identifies."}},
{id:"n5_21",domain:5,question:"An engineer suspects a specific switch port is dropping frames intermittently. Which sequence of actions BEST follows the troubleshooting methodology?",options:{A:"Open a vendor support case and wait for their analysis before taking action",B:"Review interface counters and logs, form a theory, test it by moving the device to a known-good port, then plan the fix",C:"Replace the switch immediately to eliminate the hardware variable",D:"Reboot the switch during business hours and observe whether the issue clears"},answer:"B",lead:"The methodology begins with gathering information — counters, logs, and error types — then forming a theory, then testing it in the least disruptive way available. Moving the device to a port known to be healthy is a clean, low-risk test that either confirms or eliminates the port as the cause.",why:{A:"Abdicates the first-line steps a technician should perform before escalation.",C:"Skips diagnosis entirely and is expensive and disruptive.",D:"Is an untargeted action taken at the worst possible time and destroys the very counters needed for diagnosis."}},
{id:"n5_22",domain:5,question:"A wireless network in an open-plan office has 14 access points all transmitting at maximum power on 5 GHz. Clients show strong signal but frequently disconnect and roam erratically. Which condition BEST explains this?",options:{A:"Insufficient access point density for the client population",B:"Clients are being steered to the 2.4 GHz band automatically",C:"Excessive co-channel interference and overlapping cells caused by high transmit power",D:"The DHCP lease time is too short for the number of clients"},answer:"C",lead:"Turning every AP to maximum power makes cells overlap heavily, so clients hear many APs at strong signal and have no clear best choice, producing constant roaming — sometimes called ping-ponging. It also increases co-channel interference, since APs on the same channel must share airtime with more neighbors. The fix is reducing transmit power to create smaller, cleaner cells and tuning channel assignment.",why:{A:"Is contradicted by 14 APs and strong signal.",B:"Would be visible as clients on the wrong band, and band steering pushes toward 5 GHz, not away.",D:"Would cause address renewal activity, not roaming behavior."}},
{id:"n5_23",domain:5,question:"A technician captures the following DHCP exchange while troubleshooting a client that ends up with an unexpected gateway. What does the capture reveal?",pre:"11:04:02.117  0.0.0.0        > 255.255.255.255  DHCP Discover  xid 0x8a41\n11:04:02.119  192.168.1.1    > 255.255.255.255  DHCP Offer     yiaddr 192.168.1.57\n11:04:02.144  10.4.12.10     > 255.255.255.255  DHCP Offer     yiaddr 10.4.12.203\n11:04:02.146  0.0.0.0        > 255.255.255.255  DHCP Request   192.168.1.57\n11:04:02.148  192.168.1.1    > 255.255.255.255  DHCP ACK       yiaddr 192.168.1.57",options:{A:"The client rejected the first offer and requested a second address",B:"The legitimate DHCP server is out of addresses and deferred to a backup",C:"DHCP relay is duplicating requests to two servers by design",D:"An unauthorized DHCP server responded faster than the legitimate one and won the client"},answer:"D",lead:"Two servers offered addresses on different subnets. The 10.4.12.10 server matches the corporate addressing, while 192.168.1.1 is a typical consumer router default — a rogue. Clients accept the FIRST offer they receive, and the rogue answered 25 milliseconds sooner, so the client requested and received the wrong address and gateway. DHCP snooping with trusted ports prevents this.",why:{A:"Reverses the sequence, as the client requested the first offer received.",B:"Is contradicted by the corporate server successfully offering an address.",C:"Would still produce offers from the same subnet, not a consumer range."}},
{id:"n5_24",domain:5,question:"An organization's Internet performance degrades every day at 9:00 a.m. Flow data shows a large volume of traffic to a cloud backup provider during that window. Which action addresses the root cause with the LEAST disruption?",options:{A:"Reschedule the backup window to off-hours and apply a QoS policy limiting its rate",B:"Upgrade the Internet circuit to double the bandwidth",C:"Instruct users to avoid heavy applications between 9:00 and 10:00 a.m.",D:"Block the cloud backup provider's address range at the firewall"},answer:"A",lead:"Flow data has already identified the cause. Moving the backup outside business hours removes the contention entirely, and a rate limit ensures that even if the job overruns, it cannot consume the whole circuit. This targets the specific traffic rather than penalizing everyone.",why:{B:"Is expensive and treats the symptom, since an unconstrained backup will simply consume the additional capacity.",C:"Shifts the burden to users without solving anything.",D:"Breaks a legitimate business function."}},
{id:"n5_25",domain:5,question:"After an ISP maintenance window, a branch can reach the Internet but cannot reach headquarters over the site-to-site VPN. The tunnel shows phase 1 established but phase 2 fails. Which item should be examined FIRST?",options:{A:"The branch router's default route toward the ISP",B:"The phase 2 proposal and the interesting traffic definitions on both peers",C:"The public IP address of the branch router",D:"The pre-shared key configured on the branch device"},answer:"B",lead:"Phase 1 establishing successfully proves that the peers can reach each other, that the pre-shared key or certificates match, and that phase 1 policy is compatible. A phase 2 failure isolates the problem to the IPsec SA negotiation — mismatched encryption or hashing transforms, PFS settings, lifetimes, or, most commonly, crypto ACLs that do not mirror each other exactly.",why:{A:"A, C, and D would all prevent phase 1 from completing, and the stem confirms it did.",C:"A, C, and D would all prevent phase 1 from completing, and the stem confirms it did.",D:"A, C, and D would all prevent phase 1 from completing, and the stem confirms it did."}},
{id:"n5_26",domain:5,question:"A newly installed application server can reach hosts on its own subnet and can reach the default gateway, but cannot reach any host on a remote subnet, while other servers on the same VLAN reach remote subnets normally. What should be examined NEXT?",options:{A:"The VLAN assignment of the server's switch port",B:"The physical cabling between the access switch and the server",C:"A host-based firewall or local route table entry on the new server",D:"The routing protocol adjacency on the distribution switch"},answer:"C",lead:"When peers on the same VLAN behave correctly, the network path is proven functional. The variable is the new host itself — a host-based firewall blocking outbound traffic, a missing or incorrect default route in the local table, or an incorrect secondary interface preferred over the primary.",why:{A:"A, B, and D would all affect the other servers on the same VLAN, which the stem states are working fine.",B:"A, B, and D would all affect the other servers on the same VLAN, which the stem states are working fine.",D:"A, B, and D would all affect the other servers on the same VLAN, which the stem states are working fine."}},
{id:"n5_27",domain:5,question:"Which TWO symptoms are the MOST characteristic indicators of a broadcast storm in progress? (Select TWO)",options:{A:"Switch CPU utilization near 100 percent",B:"Fiber transceivers reporting low receive power",C:"MAC address flapping messages in the switch log",D:"A gradual rise in DNS query latency",E:"An increase in TCP retransmissions on a single server"},answer:["A", "C"],lead:"A Layer 2 loop causes broadcasts to circulate endlessly and multiply. The switch's control plane is overwhelmed processing them, driving CPU to saturation, and because the same source MAC arrives on multiple ports as frames loop, the switch logs MAC flapping. Together these two are the classic storm signature.",why:{B:"Indicates an optical problem on a specific link, unrelated to a loop.",D:"D and E are downstream effects that could stem from many causes and are not diagnostic.",E:"D and E are downstream effects that could stem from many causes and are not diagnostic."}},
{id:"n5_28",domain:5,question:"A technician needs to measure achievable throughput between two internal hosts to determine whether a reported slowness complaint is a network problem or an application problem. Which tool is MOST appropriate?",options:{A:"Continuous ping with a large payload between the hosts",B:"SNMP polling of the interface counters on the path",C:"An Internet speed test from each host's browser",D:"iperf, run as a server on one host and a client on the other"},answer:"D",lead:"iperf generates a controlled TCP or UDP stream directly between the two endpoints of interest and reports achievable throughput, jitter, and loss. That isolates the internal network path from any application behavior and from Internet variables.",why:{A:"Confirms reachability and rough latency but is a poor throughput measurement.",B:"Shows utilization on individual interfaces without establishing what the two hosts can actually achieve end to end.",C:"Measures the path to a public server, not between the two hosts in question."}},
{id:"n5_29",domain:5,question:"After a domain controller's battery failed and its clock drifted 12 minutes ahead, users across the site can no longer log in and receive authentication errors, although network connectivity is unaffected. What is the underlying cause?",options:{A:"Kerberos rejects tickets when the time skew between systems exceeds the allowed tolerance",B:"DNS SRV records for the domain expired when the clock changed",C:"DHCP leases were invalidated by the timestamp change",D:"The TLS certificate on the domain controller was revoked automatically"},answer:"A",lead:"Kerberos embeds timestamps in tickets specifically to prevent replay attacks, and the default maximum tolerance is five minutes. A 12-minute skew puts every ticket outside the acceptable window, so authentication fails while IP connectivity remains perfectly healthy. This is why NTP is considered a security dependency, not just an operational convenience.",why:{B:"Is wrong because SRV records are governed by DNS TTL, not system clock.",C:"Is wrong because DHCP leases are duration-based and would not produce login errors.",D:"Is wrong because certificates are not revoked by clock drift, though a badly skewed clock can make a valid certificate appear expired."}},
{id:"n5_30",domain:5,question:"A cable tester reports correct continuity on all eight conductors of a newly terminated run, yet the link negotiates only 100 Mbps and shows high error rates at gigabit. A certifier reports excessive near-end crosstalk. What is the MOST likely termination fault?",options:{A:"A short between two adjacent conductors",B:"A split pair, where conductors are continuous but not twisted as matched pairs",C:"Transmit and receive pairs reversed between the two ends",D:"An open on the blue pair"},answer:"B",lead:"A split pair passes a simple wire map test because every pin connects end to end. However, the conductors are drawn from different twisted pairs, so the noise-cancelling geometry is destroyed and crosstalk becomes severe. Gigabit uses all four pairs and is far less tolerant of this than 100BASE-TX, which explains why the link works at the lower speed.",why:{A:"A and D would both fail the basic continuity test the stem says passed.",C:"Produces a crossover, which Auto-MDIX handles transparently on modern equipment.",D:"A and D would both fail the basic continuity test the stem says passed."}},
{id:"n5_31",domain:5,question:"An access point powered over Ethernet reboots several times per day. The switch reports no errors, the AP is 85 meters from the closet on Cat 5e, and the switch is an 802.3af model while the AP is rated 802.3at. What is the MOST likely cause?",options:{A:"Spanning tree is repeatedly transitioning the port through listening and learning",B:"The Cat 5e cable exceeds the maximum supported length for PoE",C:"The AP draws more power than the 802.3af switch can supply, causing brownout resets",D:"The AP's firmware has a memory leak requiring a scheduled reboot"},answer:"C",lead:"An 802.3at device can draw up to 25.5 W at the powered device, while an 802.3af source can supply at most 12.95 W. Under load — many clients, both radios active — the AP exceeds what the switch can deliver and browns out. Between load peaks it boots fine, producing the intermittent pattern described.",why:{A:"Would cause brief forwarding delays, not device reboots.",B:"Is wrong because 85 meters is within the 100-meter limit, and Cat 5e supports PoE.",D:"Is possible in general but does not explain the af/at mismatch the stem specifically provides."}},
{id:"n5_32",domain:5,question:"A user cannot print to a network printer on the same wireless SSID, although the printer responds to ping from a wired workstation. Other wireless users report the same problem, while wired users print normally. Which configuration is MOST likely responsible?",options:{A:"The printer's IP address has changed due to an expired DHCP lease",B:"The wireless clients are on a different subnet than the printer with no route",C:"The printer's spooler service has stopped",D:"Client isolation is enabled on the wireless SSID"},answer:"D",lead:"Client isolation, also called peer-to-peer blocking, prevents devices on the same SSID from communicating with one another, permitting only traffic to the gateway. It is standard on guest networks and frequently enabled by accident on employee SSIDs. The precise split — wireless clients fail, wired clients succeed — is the giveaway.",why:{A:"A and C would affect wired users equally, and the stem says wired printing works.",B:"Is possible but would typically break more than printing, and routing between subnets is normally in place.",C:"A and C would affect wired users equally, and the stem says wired printing works."}},
{id:"n5_33",domain:5,question:"A branch router's routing table shows a route learned via OSPF for the headquarters subnet, but traffic to that subnet is discarded. The output below is captured on the branch router. What is the problem?",pre:"BR-R1# show ip route 10.50.0.0\nRouting entry for 10.50.0.0/24\n  Known via ospf 1, distance 110, metric 30\n  Last update from 172.16.9.2 on GigabitEthernet0/1\n  Routing Descriptor Blocks:\n  * 172.16.9.2, from 10.0.0.5, via GigabitEthernet0/1\n\nBR-R1# ping 172.16.9.2\n.....\nSuccess rate is 0 percent (0/5)",options:{A:"The next hop is unreachable, so the route is present but cannot be used to forward traffic",B:"OSPF cannot be used to advertise a /24 subnet",C:"The administrative distance of 110 is too high for the route to be installed",D:"The metric of 30 exceeds the maximum permitted by OSPF"},answer:"A",lead:"A route being in the table only means the control plane learned it. Forwarding additionally requires that the next hop be reachable. The next hop 172.16.9.2 does not respond, so packets have nowhere to go. This is a classic case of a stale route persisting because the OSPF adjacency has not yet aged out, or because a Layer 2 problem exists on the segment while the interface stays up.",why:{B:"Is simply untrue.",C:"Misunderstands AD, which is a tiebreaker rather than a usability threshold, and the route is clearly installed.",D:"Is false, as 30 is a trivial OSPF cost."}},
{id:"n5_34",domain:5,question:"A user reports that a specific internal website shows a certificate warning, while other internal sites do not. The technician confirms the certificate is valid and not expired, and that the site works from a different computer. What should be checked NEXT on the affected computer?",options:{A:"Whether the computer's default gateway is correctly configured",B:"Whether the issuing internal CA's root certificate is present in that computer's trust store",C:"Whether the website's DNS record has been updated recently",D:"Whether the user's account has permission to access the site"},answer:"B",lead:"A certificate is trusted only if the client can build a chain to a root certificate it already trusts. If the internal CA's root is missing from that one machine's trust store — a common outcome when a device misses Group Policy or was imaged before the CA was deployed — the certificate appears untrusted even though it is perfectly valid.",why:{A:"Would break connectivity entirely.",C:"Would cause the browser to reach the wrong host, producing a name mismatch rather than a trust error, and would likely affect other machines.",D:"Would produce an authorization error after a successful TLS handshake."}},
{id:"n5_35",domain:5,question:"An engineer notices that traffic between two internal subnets takes a path through the WAN router rather than the direct Layer 3 link between the two distribution switches. Both paths are up. What is the MOST likely reason?",options:{A:"The two subnets are in different VLANs and cannot communicate directly",B:"The direct link is administratively shut down",C:"The direct link's routing metric or cost makes it less preferred than the WAN path",D:"A duplicate IP address exists on the direct link"},answer:"C",lead:"When multiple valid paths exist, the routing protocol installs the one with the best metric. If the direct link was configured with a high OSPF cost, or if its bandwidth statement is wrong, the protocol legitimately prefers the WAN path. This is a configuration issue, not a failure, and it is corrected by adjusting the cost or the reference bandwidth.",why:{A:"Is false, since routing between VLANs is exactly what the Layer 3 devices are doing.",B:"Is contradicted by the stem stating both paths are up.",D:"Would cause intermittent adjacency problems, not consistent path preference."}},
{id:"n5_36",domain:5,question:"Users on a specific subnet cannot access any Internet resources, while internal resources work normally. The firewall's NAT translation table is examined and shows the message below. What is the cause?",pre:"FW-01# show ip nat statistics\nTotal active translations: 65,530 (2 static, 65,528 dynamic; 65,528 extended)\nOutside interfaces: GigabitEthernet0/0\nInside interfaces: GigabitEthernet0/1\nHits: 8,441,203  Misses: 214,905\nPool NAT-POOL: netmask 255.255.255.248\n   start 203.0.113.10 end 203.0.113.10\n   allocated 1 (100%), misses 214,905",options:{A:"The NAT pool has been configured with the wrong subnet mask",B:"Static translations are consuming the entire pool",C:"The inside and outside interfaces have been reversed",D:"The PAT pool has exhausted its available port translations, so new sessions fail"},answer:"D",lead:"A single public address supports roughly 65,000 concurrent port translations. The table shows 65,528 dynamic entries with 214,905 misses climbing, meaning new sessions cannot be allocated a free port. Internal traffic is unaffected because it never traverses NAT. Remedies include adding addresses to the pool, shortening translation timeouts, or identifying a host generating abnormal session volume.",why:{A:"Would produce translation errors from the start, not after exhaustion.",B:"Is contradicted by the count of just two static entries.",C:"Would break all outbound traffic immediately."}},
{id:"n5_37",domain:5,question:"A technician needs to identify which of 48 unlabeled cables terminating in a patch panel corresponds to a specific wall jack, with no active link on the run. Which tool combination is appropriate?",options:{A:"A tone generator connected at the jack and an inductive probe at the panel",B:"An OTDR connected to the patch panel port",C:"A loopback plug inserted at the wall jack",D:"A cable certifier run from the panel end only"},answer:"A",lead:"A toner injects an audible signal onto the pair, and the inductive probe detects that signal without needing to make contact, letting the technician sweep across the punch-down field until the tone is loudest. It is the standard method for identifying an unlabeled run and requires no active link.",why:{B:"Is a fiber tool and inapplicable to copper.",C:"Tests a port's ability to loop signal, revealing nothing about cable identity.",D:"Validates performance of a known cable but does not identify which one it is."}},
{id:"n5_38",domain:5,question:"After a firewall change, users report that a legacy application intermittently fails. Packet captures show the client sends data and the server acknowledges, but sessions idle for more than 30 minutes are silently dropped and the client hangs. What is the MOST likely cause?",options:{A:"An MTU mismatch is dropping large segments after the handshake",B:"The firewall's idle session timeout is shorter than the application's keepalive interval",C:"The client's TCP window has closed and never reopens",D:"The application server is running out of memory during long sessions"},answer:"B",lead:"Stateful firewalls remove idle entries from the connection table after a configured timeout. When an application holds a session open for long periods without traffic, the firewall silently discards the state, and the next packet in either direction no longer matches an entry and is dropped. The client, unaware, waits indefinitely. Fixes are lengthening the firewall timeout for that traffic or enabling TCP keepalives more frequently than the timeout.",why:{A:"Would break large transfers regardless of idle time.",C:"Would stall throughput rather than kill idle sessions specifically.",D:"Would produce server-side errors and affect all sessions."}},
{id:"n5_39",domain:5,question:"Several users on 5 GHz report excellent throughput near their access point but complete loss of connection when they move two rooms away, while 2.4 GHz clients maintain a usable connection at the same distance. What is the BEST explanation?",options:{A:"The 5 GHz radios are configured with a lower transmit power than permitted",B:"The 2.4 GHz band supports more simultaneous clients than 5 GHz",C:"Higher frequency signals attenuate more rapidly and penetrate obstacles less effectively",D:"The 5 GHz clients are being deauthenticated by an attacker"},answer:"C",lead:"RF attenuation increases with frequency. A 5 GHz signal loses energy faster over distance and is absorbed more heavily by walls, floors, and furniture than a 2.4 GHz signal, which is precisely why 5 GHz offers higher throughput over shorter range. The observed behavior is normal physics, and the remedy is additional access points rather than more power.",why:{A:"Could contribute but the described pattern is expected even at correct power settings.",B:"Is unrelated to range.",D:"Would affect both bands and produce disconnect patterns not tied to distance."}},
{id:"n5_40",domain:5,question:"A technician resolves a recurring issue by replacing a failing SFP. Which TWO actions complete the troubleshooting process correctly? (Select TWO)",options:{A:"Document the symptoms, the root cause, the actions taken, and the outcome",B:"Close the ticket immediately once the link comes up",C:"Verify full system functionality and confirm the original symptoms are gone",D:"Restore the previous configuration to confirm the fault returns",E:"Replace the SFPs on all similar devices as a precaution"},answer:["A", "C"],lead:"The final two steps of the methodology are verifying full system functionality — including implementing preventive measures where appropriate — and documenting findings, actions, and outcomes. Documentation is what turns a one-time fix into organizational knowledge and speeds the next occurrence.",why:{B:"Skips verification, and a link light does not prove the user's original problem is resolved.",D:"Deliberately reintroduces an outage for no diagnostic benefit.",E:"Is unjustified expense without evidence of a broader defect."}},
{id:"n5_41",domain:5,question:"A remote site's connectivity drops for roughly 30 seconds several times a day. Logs on the branch router show the entries below. What is the MOST likely cause?",pre:"%LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to down\n%LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to down\n%OSPF-5-ADJCHG: Nbr 10.0.0.5 on Gi0/0 from FULL to DOWN, Neighbor Down: Interface down\n%LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up\n%LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up\n%OSPF-5-ADJCHG: Nbr 10.0.0.5 on Gi0/0 from LOADING to FULL, Loading Done",options:{A:"An MTU mismatch prevents the OSPF database exchange from completing",B:"The OSPF hello and dead intervals are mismatched between the neighbors",C:"OSPF authentication is misconfigured and the adjacency resets periodically",D:"A physical layer problem is flapping the interface, taking the OSPF adjacency down with it"},answer:"D",lead:"Read the order of events. The interface goes down FIRST, and the OSPF adjacency drops as a consequence, with the reason explicitly logged as Interface down. That points to a physical cause — a marginal transceiver, a damaged cable, a loose connector, or a provider circuit fault — not a protocol issue.",why:{A:"Would leave neighbors stuck in EXSTART or EXCHANGE rather than reaching FULL, which the log shows it does.",B:"B and C would drop the adjacency while the interface stayed up, and the log would show a different reason such as Dead timer expired.",C:"B and C would drop the adjacency while the interface stayed up, and the log would show a different reason such as Dead timer expired."}},
{id:"n5_42",domain:5,question:"A newly deployed application server intermittently fails to reach a database server in the same data center. The technician confirms both hosts are on the same VLAN, both have correct addressing, and pings succeed. Captures show the application server sending to a MAC address that no longer exists on the network. What is the MOST likely cause?",options:{A:"A stale ARP cache entry pointing to a decommissioned server's MAC address",B:"The application server's DNS cache holds an outdated address",C:"A routing loop is redirecting traffic to an incorrect gateway",D:"The database server's NIC has failed and is not responding"},answer:"A",lead:"When a server is replaced or its NIC changes, hosts that cached the old IP-to-MAC binding keep sending frames to a MAC that no longer exists until the entry ages out. Because the ARP cache is consulted before transmission, the traffic is silently discarded by the switch. Clearing the ARP cache resolves it immediately; gratuitous ARP from the new host normally prevents it.",why:{B:"Would cause traffic to a wrong IP address, whereas the capture shows the correct IP with a wrong MAC.",C:"Would involve a gateway, but both hosts are on the same VLAN and no routing is required.",D:"Is contradicted by successful pings."}},

{id:"n1_41",domain:1,question:"A mail server must accept mail relayed from other mail servers on the internet, allow employees to submit outgoing mail over an encrypted client connection, and allow employees to read mail that remains stored on the server with the session encrypted in transit. Which THREE ports must be permitted inbound? (Select THREE)",options:{A:"TCP 25",B:"TCP 110",C:"TCP 587",D:"TCP 993",E:"TCP 995"},answer:["A", "C", "D"],lead:"Three separate requirements map to three separate ports. Server-to-server mail transfer is SMTP on TCP 25. Client submission of outgoing mail is the submission port, TCP 587, which negotiates STARTTLS. Reading mail that stays on the server is IMAP, and the encrypted variant is IMAPS on TCP 993. The trap is treating retrieval as one idea rather than two independent constraints: mail must stay server-side (IMAP, not POP3) and the session must be encrypted (993, not 143).",why:{B:"Is POP3 in cleartext. It fails the encryption requirement, and POP3 by default downloads and removes mail, failing the requirement that mail stay stored on the server.",E:"Is POP3S. The encryption requirement is met, but it is still POP3, so mail does not remain on the server. Encryption alone does not rescue the wrong protocol."}},
{id:"n1_42",domain:1,question:"A workstation is configured with 10.30.7.201 and a mask of 255.255.255.224. What are the network address and broadcast address of its subnet?",options:{A:"Network 10.30.7.192, broadcast 10.30.7.223",B:"Network 10.30.7.200, broadcast 10.30.7.231",C:"Network 10.30.7.192, broadcast 10.30.7.255",D:"Network 10.30.7.160, broadcast 10.30.7.191",E:"Network 10.30.7.224, broadcast 10.30.7.255"},answer:"A",lead:"A 255.255.255.224 mask is a /27, which leaves 5 host bits and a block size of 32. Subnet boundaries in the last octet therefore fall at 0, 32, 64, 96, 128, 160, 192, 224. The host .201 falls in the block that starts at 192 and ends at 223. Network is .192, broadcast is .223, and usable range is .193 through .222.",why:{B:"Treats the host address itself as the start of the block. Subnet boundaries are fixed by the mask, not by wherever a host happens to sit.",C:"Finds the correct network address but then uses the /24 broadcast. Once the mask is /27 the broadcast is the top of the 32-address block, not the top of the octet.",D:"Lands one block low. 160 through 191 is the block immediately below the one containing .201.",E:"Lands one block high. 224 through 255 is the block immediately above, and .201 is not in it."}},
{id:"n1_43",domain:1,question:"An administrator subnets 192.168.16.0/20 into /26 subnets. How many subnets are created, and how many usable host addresses does each contain?",options:{A:"64 subnets, 62 usable hosts each",B:"64 subnets, 64 usable hosts each",C:"32 subnets, 62 usable hosts each",D:"16 subnets, 62 usable hosts each",E:"62 subnets, 64 usable hosts each"},answer:"A",lead:"Two separate calculations. Subnet count comes from borrowed bits: moving from /20 to /26 borrows 6 bits, and 2 to the power of 6 is 64 subnets. Host count comes from remaining host bits: a /26 leaves 6 host bits, 2 to the power of 6 is 64 total addresses, minus the network address and the broadcast address gives 62 usable. The two exponents are both 6 here by coincidence, which is exactly why the answers must be derived separately rather than reused.",why:{B:"Gets the subnet count right but reports total addresses rather than usable ones. Every subnet loses two addresses to the network and broadcast.",C:"Counts 5 borrowed bits instead of 6. Five bits would be a /25.",D:"Counts 4 borrowed bits instead of 6. Four bits would be a /24.",E:"Reverses the two figures entirely, reporting the usable host count as the subnet count and the total address count as usable hosts."}},
{id:"n1_44",domain:1,question:"A public DNS resolver is reachable at a single IP address, yet packet captures from offices in three different countries show each office being served by a different physical datacenter, with no change to the destination address. Which delivery method is in use, and by what mechanism?",options:{A:"Anycast, with the same prefix advertised via BGP from multiple sites so each client reaches the topologically nearest one",B:"Multicast, with each office joining a different IGMP group",C:"Broadcast, with the resolver flooding responses within each broadcast domain",D:"Unicast, with a GeoDNS service returning a different address per region",E:"Unicast, with round-robin DNS cycling through datacenter addresses"},answer:"A",lead:"The defining detail is that the destination address never changes and yet different sites answer. That is anycast: identical addressing advertised from many locations, with routing deciding which instance is closest. It is one-to-nearest delivery.",why:{B:"Multicast is one-to-many delivery to hosts that have explicitly joined a group. Clients querying a resolver never join a group, and multicast is not used across the public internet this way.",C:"Broadcast is one-to-all and does not cross a router boundary, so it cannot reach offices in other countries.",D:"GeoDNS is a real technique, but it works by returning different IP addresses to different regions. The stem rules it out by stating the address is the same everywhere.",E:"Round-robin DNS also hands out different addresses, and it distributes without regard to client location. The stem rules out both properties."}},
{id:"n2_36",domain:2,question:"A packet arrives at a router destined for 172.16.24.77. The routing table contains all of the following entries, and all next hops are reachable. Which entry does the router use to forward the packet?",options:{A:"0.0.0.0/0 via the ISP edge",B:"172.16.0.0/16 via CoreA",C:"172.16.24.0/22 via CoreB",D:"172.16.24.64/26 via CoreC",E:"172.16.24.0/24 via CoreD"},answer:"D",lead:"Forwarding is decided by longest prefix match: of all entries that contain the destination, the router selects the one with the most specific mask, regardless of how the route was learned or what its metric is. A /26 has a block size of 64, so 172.16.24.64/26 covers .64 through .127, and .77 falls inside it. At 26 bits it is more specific than every other matching entry.",why:{A:"Matches every possible destination, which is precisely why it has a prefix length of zero. A default route is used only when no more specific entry exists.",B:"Genuinely matches the destination, but 16 bits of specificity loses to 26. Being a valid match is not the same as being the selected match.",C:"Also matches, at 22 bits. Still less specific than the /26.",E:"Is the strongest distractor because a /24 feels like the natural subnet boundary, but 24 bits still loses to 26. Specificity, not familiarity, decides."}},
{id:"n2_37",domain:2,question:"A router learns the identical prefix 10.50.0.0/24 from three sources at the same time: an OSPF neighbor, an EIGRP neighbor, and a floating static route that was deliberately configured with an administrative distance of 130. Which route is installed in the routing table, and why?",options:{A:"The EIGRP route, because its administrative distance of 90 is the lowest of the three",B:"The OSPF route, because link-state protocols build a more accurate topology than distance-vector protocols",C:"The static route, because statically configured routes always take precedence over dynamically learned ones",D:"All three, load-balanced equally across the available next hops",E:"The OSPF route, because it has the lowest metric of the three"},answer:"A",lead:"When several sources offer the same prefix, administrative distance is the tiebreaker, and the lowest value wins. Internal EIGRP is 90, OSPF is 110, and this static route was explicitly given 130. EIGRP wins. Worth memorizing: directly connected 0, static 1, EIGRP 90, OSPF 110, RIP 120.",why:{B:"Describes a design argument about protocol quality. Routers do not evaluate which protocol is conceptually better; they compare a numeric administrative distance.",C:"Would be a reasonable instinct because a normal static route carries an AD of 1. The stem defeats it: a floating static is one whose AD has been raised on purpose so it stays out of the table until the dynamic routes disappear.",D:"Equal-cost load balancing happens between multiple paths within a single protocol, not across different routing sources.",E:"Metrics are only comparable within one protocol. An OSPF cost cannot be weighed against an EIGRP composite metric or against a static route, which has no metric at all."}},
{id:"n2_38",domain:2,question:"Devices in VLAN 10 and VLAN 20 communicate normally across the trunk between two switches, but a server attached to an untagged port on SwitchA cannot reach a server attached to an untagged port on SwitchB. Given the output below, what is the cause?",pre:"SwitchA# show interfaces trunk\nPort        Mode         Encapsulation  Status        Native vlan\nGi0/1       on           802.1q         trunking      1\nPort        Vlans allowed and active in management domain\nGi0/1       1,10,20\n\nSwitchB# show interfaces trunk\nPort        Mode         Encapsulation  Status        Native vlan\nGi0/1       on           802.1q         trunking      99\nPort        Vlans allowed and active in management domain\nGi0/1       10,20,99",options:{A:"A native VLAN mismatch is placing untagged frames into different VLANs on each side",B:"Spanning tree has placed the trunk in a blocking state",C:"A duplex mismatch is corrupting frames on the trunk",D:"VLAN pruning has removed the affected VLAN from the trunk",E:"Inter-VLAN routing has not been configured on the Layer 3 device"},answer:"A",lead:"Native VLAN traffic crosses a trunk untagged, so both ends must agree on which VLAN untagged frames belong to. SwitchA places untagged frames in VLAN 1 and SwitchB places them in VLAN 99, so untagged traffic is silently delivered into the wrong VLAN and never reaches its destination. Tagged VLANs 10 and 20 carry an explicit 802.1Q tag and are unaffected, which is exactly the pattern in the stem.",why:{B:"A blocked port forwards nothing at all. VLANs 10 and 20 are working, which proves the trunk is forwarding.",C:"A duplex mismatch degrades all traffic on the link and produces CRC errors and late collisions. It does not selectively break one VLAN while leaving others clean.",D:"Pruning restricts tagged VLANs from crossing a trunk. The failing traffic here is untagged, and the output shows both VLANs 10 and 20 allowed.",E:"Inter-VLAN routing is needed to move traffic between different VLANs. Each server is in its own switch native VLAN and the intent is same-VLAN communication, so no routing should be required."}},
{id:"n2_39",domain:2,question:"A network printer is connected to a switch port configured as an access port in VLAN 30. A junior technician proposes configuring 802.1Q tagging on the printer so that it can participate in VLAN 30. Which statement is correct?",options:{A:"The switch applies the VLAN association internally and frames exchanged with the printer are untagged, so no configuration is required on the printer",B:"The printer must tag its frames with VLAN 30 or the switch will discard them",C:"The switch tags frames with VLAN 30 as they egress the access port toward the printer",D:"Access ports do not participate in VLANs, so the port must be converted to a trunk",E:"Frames from the printer will be placed into the trunk native VLAN rather than VLAN 30"},answer:"A",lead:"The purpose of an access port is to connect VLAN-unaware devices. The switch associates the port with a VLAN in its own tables and adds a tag only if the frame later needs to cross a trunk, stripping it again before delivery to another access port. The printer neither sends nor receives tags and needs no configuration at all.",why:{B:"Describes trunk port behavior. Requiring endpoints to tag their own traffic would defeat the purpose of access ports.",C:"Would break the printer. Ordinary network interfaces are not VLAN-aware and discard 802.1Q-tagged frames they do not understand.",D:"Is backwards. Access ports are the standard mechanism for placing an endpoint into a VLAN; trunks carry multiple VLANs between infrastructure devices.",E:"Confuses two concepts. The native VLAN is a trunk property that governs untagged traffic on a trunk link. Access ports have no native VLAN."}},
{id:"n2_40",domain:2,question:"Two buildings on a campus are 1.8 kilometers apart and require a single 25 Gbps link between their distribution switches. Which media and transceiver combination meets both requirements?",options:{A:"Cat 8 shielded twisted pair with 25GBASE-T",B:"OM4 multimode fiber with a 25GBASE-SR transceiver",C:"Single-mode fiber with a 25GBASE-LR transceiver",D:"Cat 6a unshielded twisted pair",E:"OM3 multimode fiber with a 25GBASE-SR transceiver"},answer:"C",lead:"Two constraints must be satisfied at once, speed and distance, and distance is the one that eliminates most options. Any copper Ethernet run is bounded by 100 meters and Cat 8 is bounded far more tightly than that. Multimode fiber at 25 Gbps reaches only on the order of 70 to 100 meters. Only single-mode fiber spans kilometers, and 25GBASE-LR is the matching long-reach transceiver.",why:{A:"Cat 8 does reach 25 Gbps, but only to roughly 30 meters, and no copper Ethernet standard exceeds 100 meters regardless of category.",B:"OM4 is the best multimode grade in common use, yet at 25 Gbps it reaches only about 100 meters. Multimode is a data center and in-building medium, not a campus medium.",D:"Cat 6a tops out at 10 Gbps and is still bound by the 100 meter copper limit, so it fails both constraints.",E:"OM3 is a lower grade of multimode than OM4 and reaches an even shorter distance at 25 Gbps."}},
{id:"n3_34",domain:3,question:"A business states that it can tolerate losing no more than 1 hour of transaction data and must have the service restored within 2 hours of an outage. The current design takes a full backup every 6 hours and, in tested restores, brings the service back in 90 minutes. Which statement is correct?",options:{A:"The backup interval violates the stated RPO and must be shortened",B:"The restore duration violates the stated RTO and must be shortened",C:"The design satisfies both objectives as stated",D:"The design satisfies the RPO but the RTO is undefined because MTTR has not been measured",E:"The design violates both objectives and MTBF must be increased"},answer:"A",lead:"RPO is a data loss objective and it points backward from the moment of failure to the last usable recovery point. A 6 hour backup interval means up to 6 hours of data can be lost, which breaches a 1 hour RPO. RTO is a downtime objective and it points forward from the failure to service restoration. A 90 minute restore sits inside the 2 hour RTO, so that objective is met. One objective is breached, the other is satisfied.",why:{B:"Reverses the analysis. 90 minutes is less than the 2 hour RTO, so restore duration is within tolerance.",C:"Overlooks the backup interval. Meeting the downtime target does not compensate for exceeding the acceptable data loss window.",D:"Confuses an objective with a measurement. RTO is a target the business sets in advance; MTTR is an observed average repair time and is not required to define an RTO.",E:"MTBF is mean time between failures, a reliability measurement describing how often failures occur. It has no bearing on either the data loss or the restoration target."}},
{id:"n3_35",domain:3,question:"An organization wants two routers to share responsibility for a single default gateway address, so that if the active router fails, clients continue to send traffic to the same gateway IP with no reconfiguration. The solution must be vendor-neutral because the two routers come from different manufacturers. Which technology should be deployed?",options:{A:"HSRP",B:"VRRP",C:"GLBP",D:"LACP",E:"STP"},answer:"B",lead:"This describes a First Hop Redundancy Protocol: multiple routers present one virtual IP address that clients use as their gateway, and a standby takes over if the active router fails. VRRP is the open standard defined by the IETF, which satisfies the multi-vendor requirement.",why:{A:"HSRP performs exactly the same function and would be correct in a single-vendor environment, but it is Cisco proprietary and so fails the vendor-neutral requirement stated in the stem.",C:"GLBP is also a first hop redundancy protocol and additionally load balances across gateways, but it too is Cisco proprietary.",D:"LACP bundles multiple physical links into one logical link. It provides link redundancy and added bandwidth, not gateway redundancy.",E:"STP prevents Layer 2 loops by blocking redundant paths. It has no role in presenting a gateway address to clients."}},
{id:"n4_26",domain:4,question:"In an 802.1X deployment, a laptop presents credentials, the access switch relays the EAP exchange, a RADIUS server evaluates the request, and the RADIUS server queries Active Directory to validate the account. Which component is the authenticator?",options:{A:"The laptop presenting credentials",B:"The access switch relaying the EAP exchange",C:"The RADIUS server evaluating the request",D:"The Active Directory domain controller",E:"The certificate authority that issued the machine certificate"},answer:"B",lead:"802.1X defines three roles. The supplicant is the endpoint requesting access. The authenticator is the network device controlling the port, typically a switch or wireless access point, which relays EAP between supplicant and server and enforces the resulting decision. The authentication server, almost always RADIUS, makes the decision. The authenticator is a gatekeeper, not a decision maker, and that distinction is what the question tests.",why:{A:"Is the supplicant. It requests access rather than controlling it.",C:"Is the authentication server. It renders the accept or reject decision but does not physically control the port.",D:"Is the identity store the RADIUS server consults. It is a backend directory and not one of the three defined 802.1X roles.",E:"Issues certificates used in EAP-TLS. It participates in trust establishment but has no role in the 802.1X exchange itself."}},
{id:"n5_43",domain:5,question:"A technician has identified the problem, established and successfully tested a theory of probable cause, established a plan of action, and implemented the fix. The user confirms that the application they originally reported now loads correctly. According to the CompTIA troubleshooting methodology, what is the NEXT step?",options:{A:"Document the findings, actions, and outcomes",B:"Verify full system functionality and implement applicable preventive measures",C:"Establish a new theory of probable cause",D:"Escalate the incident to a senior engineer for review",E:"Re-test the original theory to confirm it still holds"},answer:"B",lead:"The seven steps run: identify the problem, establish a theory of probable cause, test the theory, establish a plan of action, implement the solution or escalate, verify full system functionality and implement preventive measures, then document findings, actions, and outcomes. The user confirming their one reported symptom is resolved is not the same as verifying the system as a whole, which is precisely why verification is its own step.",why:{A:"Is the final step, step seven. Documenting before verifying risks recording a fix that did not fully work, and skipping straight to it is the single most common sequencing error on this question type.",C:"Belongs to step two and applies only when a theory has been disproven. This theory was confirmed and the fix worked.",D:"Sits inside step five and is appropriate when the technician cannot resolve the issue. The issue has already been resolved.",E:"Is step three, already completed. The methodology does not loop back once the solution has been implemented successfully."}}
