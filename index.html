<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JAEBEASTY Cyber Lab — Network+ N10-009</title>
<meta name="theme-color" content="#0e0e10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ═══ BRUTALIST INK · SLATE PALETTE ═══ */
  --bg:#0e0e10;
  --bg-2:#0a0a0c;
  --surface:#161619;
  --surface-2:#1e1e23;
  --card:#1a1a1e;
  --card-2:#222228;
  --border:#54545e;
  --border-bright:#f0f0f2;      /* white brutalist edge */

  --text:#f2f2f4;
  --text-2:#b4b4bc;
  --text-3:#83838c;

  /* Accent system — steel blue primary, teal correct, mauve wrong */
  --primary:#6f9bc7;
  --primary-bright:#8fb4d8;
  --secondary:#6f9bc7;
  --secondary-bright:#8fb4d8;
  --tertiary:#5fa88c;
  --tertiary-bright:#7dbfa5;

  --warn:#d9a441;
  --danger:#9b5f72;             /* mauve */
  --success:#5fa88c;            /* teal */

  --ink:#0e0e10;                /* text on filled accents */

  /* No glows in brutalism — kept as vars so existing shadows resolve flat */
  --glow-pri:transparent;
  --glow-sec:transparent;
  --glow-ter:transparent;
  --glow-warn:transparent;

  --grid-line:transparent;
  --grid-size:44px;
  --grid-mask:0;

  /* Type — heavy grotesk for a brutalist voice */
  --font-display:'Archivo',sans-serif;
  --font-body:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  /* Motion */
  --t-fast:0.12s;
  --t-mid:0.2s;
  --t-slow:0.4s;
  --ease:cubic-bezier(0.2,0,0,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);

  --sb-width:248px;
}

html{font-size:16px}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:var(--grid-size) var(--grid-size);
  pointer-events:none;z-index:0;opacity:var(--grid-mask);
  mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 80%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 80%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grid-mask);
  background:
    radial-gradient(ellipse 900px 560px at 50% -12%,var(--glow-pri) 0%,transparent 62%),
    radial-gradient(ellipse 620px 420px at 100% 100%,var(--glow-ter) 0%,transparent 62%),
    radial-gradient(ellipse 520px 360px at 0% 100%,var(--glow-sec) 0%,transparent 62%);
}
/* Scanlines are OFF by default; opt in via Preferences → CRT overlay */
.scan{display:none}
html[data-fx="crt"] .scan{display:block;position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(255,255,255,0.02) 2px,rgba(255,255,255,0.02) 3px)}

::selection{background:var(--primary);color:#000}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:0;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--secondary)}

/* ───── LAYOUT ───── */
.layout{display:grid;grid-template-columns:var(--sb-width) 1fr;min-height:100vh;position:relative;z-index:2}

/* ───── SIDEBAR ───── */
.sidebar{
  background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 100%);
  border-right:1px solid var(--border);
  padding:1.25rem 0.85rem;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
  display:flex;flex-direction:column;
  box-shadow:1px 0 0 var(--border);
  z-index:30;
}
.brand{
  display:flex;align-items:center;gap:0.65rem;
  padding:0.4rem 0.5rem 1.5rem;
  margin-bottom:0.85rem;
  border-bottom:2px solid var(--border);
  cursor:pointer;
}
.brand-mark{
  width:38px;height:38px;
  background:#000;
  border:2px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  position:relative;flex-shrink:0;
  box-shadow:0 0 20px var(--glow-pri),inset 0 0 12px rgba(111,155,199,0.3);
}
.brand-mark svg{width:20px;height:20px;color:var(--primary-bright);filter:drop-shadow(0 0 4px var(--primary))}
.brand-name{
  font-family:var(--font-display);
  font-size:1.05rem;
  letter-spacing:0.04em;
  color:var(--primary-bright);
  text-shadow:0 0 8px var(--glow-pri),0 0 16px var(--glow-pri);
}
.brand-sub{font-family:var(--font-mono);font-size:0.62rem;color:var(--tertiary);text-transform:uppercase;letter-spacing:0.2em;text-shadow:0 0 4px var(--glow-ter)}

.nav-section{margin-bottom:1.4rem}
.nav-label{
  font-family:var(--font-mono);font-size:0.62rem;
  color:var(--tertiary);text-transform:uppercase;letter-spacing:0.18em;
  padding:0 0.5rem 0.5rem;font-weight:700;
  text-shadow:0 0 4px var(--glow-ter);
}
.nav-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.65rem 0.8rem;
  margin-bottom:0.2rem;
  color:var(--text-2);
  font-size:0.85rem;font-weight:500;
  cursor:pointer;
  transition:all var(--t-fast) var(--ease);
  position:relative;
  border:1px solid transparent;
  border-radius:0;
  background:transparent;
  width:100%;
  text-align:left;
  font-family:var(--font-body);
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;transition:filter var(--t-fast),color var(--t-fast)}
.nav-item:hover{
  color:var(--text);
  border-color:var(--border-bright);
  background:rgba(111,155,199,0.10);
}
.nav-item:hover svg{color:var(--secondary-bright);filter:drop-shadow(0 0 4px var(--glow-sec))}
.nav-item.active{
  background:linear-gradient(90deg,rgba(111,155,199,0.18) 0%,rgba(111,155,199,0.10) 100%);
  color:var(--primary-bright);
  font-weight:700;
  border-color:var(--primary);
  text-shadow:0 0 8px var(--glow-pri);
  box-shadow:0 0 16px rgba(111,155,199,0.22),inset 0 0 8px rgba(111,155,199,0.08);
}
.nav-item.active svg{color:var(--primary-bright);filter:drop-shadow(0 0 6px var(--primary))}
.nav-badge{
  margin-left:auto;
  font-family:var(--font-mono);font-size:0.65rem;
  padding:0.1rem 0.4rem;
  background:var(--tertiary);color:#000;
  border-radius:0;font-weight:700;letter-spacing:0.04em;
  box-shadow:0 0 8px var(--glow-ter);
}
.nav-badge.warn{background:var(--warn);box-shadow:0 0 8px var(--glow-warn);color:#000}

.sidebar-bottom{margin-top:auto;padding-top:1rem;border-top:2px solid var(--border)}
.retro-stat{
  padding:0.5rem 0.75rem;
  font-family:var(--font-mono);font-size:0.78rem;
  color:var(--text-2);
  display:flex;align-items:center;gap:0.5rem;
  letter-spacing:0.04em;
}
.retro-stat .num{color:var(--tertiary);font-weight:700;text-shadow:0 0 6px var(--glow-ter)}
.retro-stat .num.pri{color:var(--primary-bright);text-shadow:0 0 6px var(--glow-pri)}

/* ───── MOBILE NAV ───── */
.mobile-bar{display:none;position:sticky;top:0;z-index:50;background:var(--bg-2);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0.65rem 0.85rem;gap:0.7rem;align-items:center;box-shadow:0 4px 16px rgba(111,155,199,0.15)}
.hamburger{
  width:38px;height:38px;
  background:#000;border:1.5px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  cursor:pointer;
  color:var(--primary-bright);
  box-shadow:0 0 8px var(--glow-pri);
  flex-shrink:0;
}
.hamburger svg{width:20px;height:20px}
.mobile-brand{
  font-family:var(--font-display);
  font-size:0.95rem;letter-spacing:0.05em;
  color:var(--primary-bright);
  text-shadow:0 0 8px var(--glow-pri);
  flex:1;
}
.sidebar-overlay{
  display:none;
  position:fixed;inset:0;z-index:25;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
}

/* ───── MAIN ───── */
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}

.topbar{
  background:var(--surface);
  backdrop-filter:blur(16px) saturate(150%);
  border-bottom:2px solid var(--primary);
  padding:0.85rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;gap:1rem;
  box-shadow:0 4px 20px rgba(111,155,199,0.15);
}
.topbar-title{
  font-family:var(--font-display);font-size:1rem;
  color:var(--text);letter-spacing:0.05em;
  text-shadow:0 0 8px rgba(255,255,255,0.4);
  display:flex;align-items:center;gap:0.6rem;
}
.topbar-title small{
  color:var(--tertiary);font-weight:400;font-size:0.7rem;
  font-family:var(--font-mono);letter-spacing:0.18em;
  text-shadow:0 0 4px var(--glow-ter);
}
.stat-pills{display:flex;gap:0.5rem;flex-wrap:wrap}
.pill{
  display:flex;align-items:center;gap:0.4rem;
  padding:0.45rem 0.85rem;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  font-family:var(--font-mono);font-size:0.78rem;font-weight:700;
  color:var(--secondary-bright);
  letter-spacing:0.04em;
  box-shadow:0 0 10px rgba(111,155,199,0.25),inset 0 0 6px rgba(111,155,199,0.05);
  transition:all var(--t-fast) var(--ease);
}
.pill svg{width:13px;height:13px}
.pill.xp{border-color:var(--secondary);color:var(--secondary-bright)}
.pill.streak{
  border-color:var(--primary);color:var(--primary-bright);
  box-shadow:0 0 16px var(--glow-pri),inset 0 0 6px rgba(111,155,199,0.10);
  text-shadow:0 0 6px var(--glow-pri);
}
.pill.streak.fire{
  border-color:var(--warn);color:var(--warn);
  box-shadow:0 0 16px var(--glow-warn),inset 0 0 6px rgba(217,164,65,0.10);
  text-shadow:0 0 6px var(--glow-warn);
  animation:flameP 1.6s var(--ease) infinite alternate;
}
@keyframes flameP{from{box-shadow:0 0 12px var(--glow-warn)}to{box-shadow:0 0 24px var(--glow-warn)}}
.pill.timer{
  border-color:var(--tertiary);color:var(--tertiary);
  box-shadow:0 0 12px var(--glow-ter),inset 0 0 6px rgba(95,168,140,0.05);
  text-shadow:0 0 4px var(--glow-ter);
  cursor:pointer;
}
.pill.timer.running{
  background:rgba(95,168,140,0.06);
  animation:tick 1s linear infinite;
}
@keyframes tick{0%,100%{box-shadow:0 0 12px var(--glow-ter)}50%{box-shadow:0 0 22px var(--glow-ter)}}
.pill.timer.break{border-color:var(--success);color:var(--success);box-shadow:0 0 16px rgba(95,168,140,0.4)}

.content{padding:1.5rem 1.75rem 4rem;flex:1;max-width:1200px;width:100%;margin:0 auto}

/* ───── HERO LEVEL CARD ───── */
.hero-card{
  position:relative;
  border:2px solid var(--primary);
  border-radius:0;
  padding:1.5rem 1.75rem;
  margin-bottom:1.25rem;
  overflow:hidden;
  background:linear-gradient(135deg,var(--card) 0%,var(--surface-2) 100%);
  box-shadow:0 0 32px rgba(111,155,199,0.25),inset 0 0 24px rgba(111,155,199,0.05);
}
.hero-card::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 500px 350px at 100% 0%,rgba(111,155,199,0.18) 0%,transparent 60%),
    radial-gradient(ellipse 400px 280px at 0% 100%,rgba(95,168,140,0.10) 0%,transparent 60%);
  pointer-events:none;
}
.hero-card-inner{position:relative;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.level-badge{
  width:78px;height:78px;
  background:#000;
  border:2px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  font-family:var(--font-display);font-size:1.4rem;
  color:var(--primary-bright);flex-shrink:0;
  box-shadow:0 0 28px var(--glow-pri),inset 0 0 16px rgba(111,155,199,0.2);
  text-shadow:0 0 12px var(--glow-pri);
  letter-spacing:0.04em;
}
.level-info{flex:1;min-width:240px}
.level-title{font-family:var(--font-display);font-size:1.3rem;color:var(--text);letter-spacing:0.04em;margin-bottom:0.25rem;text-shadow:0 0 12px rgba(255,255,255,0.3)}
.level-rank{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-2);text-transform:uppercase;letter-spacing:0.1em}
.level-rank b{color:var(--tertiary);font-weight:700;text-shadow:0 0 6px var(--glow-ter)}
.xp-track{
  margin-top:0.85rem;height:12px;
  background:#000;border:1.5px solid var(--secondary);
  overflow:hidden;position:relative;
}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--tertiary));
  position:relative;
  box-shadow:0 0 16px var(--glow-pri);
  transition:width var(--t-slow) var(--ease-out);
}
.xp-fill::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,0.3) 8px 9px);
}
.xp-text{margin-top:0.45rem;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:0.74rem;color:var(--text-3);letter-spacing:0.04em}

.daily-goal{
  display:flex;align-items:center;gap:0.85rem;
  padding:1rem 1.15rem;
  background:#000;
  border:1.5px solid var(--tertiary);
  border-radius:0;
  min-width:220px;
  box-shadow:0 0 16px var(--glow-ter),inset 0 0 8px rgba(95,168,140,0.05);
}
.goal-ring{position:relative;width:62px;height:62px;flex-shrink:0}
.goal-ring svg{transform:rotate(-90deg)}
.goal-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:1rem;color:var(--tertiary);text-shadow:0 0 8px var(--glow-ter);letter-spacing:0.04em}
.goal-info{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em}
.goal-info b{display:block;font-family:var(--font-display);font-size:1rem;color:var(--text);text-transform:none;letter-spacing:0.03em;margin-top:0.2rem;text-shadow:0 0 6px rgba(255,255,255,0.3)}
.goal-info.complete b{color:var(--success);text-shadow:0 0 8px rgba(95,168,140,0.5)}

/* ───── QUICK CARDS GRID ───── */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0.85rem;margin-bottom:1.5rem}
.quick-card{
  position:relative;
  padding:1.1rem 1.25rem;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  cursor:pointer;
  transition:all var(--t-fast) var(--ease);
  overflow:hidden;
  box-shadow:0 0 14px rgba(111,155,199,0.18),inset 0 0 6px rgba(111,155,199,0.04);
  text-align:left;
  font-family:inherit;
  color:inherit;
  width:100%;
}
.quick-card:hover{
  border-color:var(--primary);
  transform:translateY(-3px);
  box-shadow:0 8px 28px var(--glow-pri),inset 0 0 8px rgba(111,155,199,0.08);
}
.quick-icon{
  width:36px;height:36px;
  background:rgba(111,155,199,0.12);
  border:1.5px solid var(--secondary);
  border-radius:0;
  display:grid;place-items:center;
  color:var(--secondary-bright);
  margin-bottom:0.65rem;
  box-shadow:0 0 8px rgba(111,155,199,0.3),inset 0 0 4px rgba(111,155,199,0.1);
}
.quick-icon svg{width:18px;height:18px;filter:drop-shadow(0 0 3px currentColor)}
.quick-icon.pri{background:rgba(111,155,199,0.12);border-color:var(--primary);color:var(--primary-bright);box-shadow:0 0 8px var(--glow-pri),inset 0 0 4px rgba(111,155,199,0.1)}
.quick-icon.ter{background:rgba(95,168,140,0.10);border-color:var(--tertiary);color:var(--tertiary);box-shadow:0 0 8px var(--glow-ter),inset 0 0 4px rgba(95,168,140,0.08)}
.quick-icon.warn{background:rgba(217,164,65,0.10);border-color:var(--warn);color:var(--warn);box-shadow:0 0 8px var(--glow-warn)}
.quick-title{font-family:var(--font-display);font-size:0.95rem;letter-spacing:0.04em;margin-bottom:0.25rem;color:var(--text);text-shadow:0 0 6px rgba(255,255,255,0.2)}
.quick-meta{font-family:var(--font-mono);font-size:0.74rem;color:var(--text-2);letter-spacing:0.02em}

/* ───── PANELS ───── */
.panel{
  background:var(--surface);
  border:1.5px solid var(--secondary);
  border-radius:0;
  padding:1.25rem 1.5rem;
  margin-bottom:1.25rem;
  box-shadow:0 0 14px rgba(111,155,199,0.18);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:0.75rem;flex-wrap:wrap}
.panel-title{
  font-family:var(--font-display);font-size:0.95rem;
  letter-spacing:0.04em;color:var(--text);
  text-shadow:0 0 6px rgba(255,255,255,0.25);
  display:flex;align-items:center;gap:0.55rem;
}
.panel-title svg{width:18px;height:18px;color:var(--primary-bright);filter:drop-shadow(0 0 4px var(--primary))}
.panel-meta{font-family:var(--font-mono);font-size:0.72rem;color:var(--tertiary);text-transform:uppercase;letter-spacing:0.1em;text-shadow:0 0 4px var(--glow-ter)}

/* ───── HEATMAP ───── */
.heatmap{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-bottom:0.85rem}
.heat-cell{
  aspect-ratio:1;
  border-radius:0;
  background:rgba(111,155,199,0.06);
  border:1px solid rgba(111,155,199,0.12);
  transition:transform var(--t-fast);
  position:relative;
}
.heat-cell:hover{transform:scale(1.5);z-index:2}
.heat-cell.today{border:1.5px solid var(--warn);box-shadow:0 0 6px var(--glow-warn)}
.heat-cell.l1{background:rgba(111,155,199,0.3)}
.heat-cell.l2{background:rgba(111,155,199,0.6);box-shadow:0 0 4px rgba(111,155,199,0.4)}
.heat-cell.l3{background:var(--primary);box-shadow:0 0 6px var(--glow-pri)}
.heat-cell.l4{background:var(--tertiary);box-shadow:0 0 8px var(--glow-ter)}
.heatmap-legend{display:flex;align-items:center;gap:0.5rem;font-family:var(--font-mono);font-size:0.7rem;color:var(--text-3);letter-spacing:0.04em}
.legend-cells{display:flex;gap:3px}
.legend-cells span{width:11px;height:11px;border-radius:0}

/* ───── DOMAIN PROGRESS ───── */
.dom-list{display:flex;flex-direction:column;gap:0.5rem}
.dom-row{display:flex;align-items:center;gap:0.85rem;padding:0.65rem 0.85rem;background:#000;border:1px solid var(--border);border-radius:0;transition:all var(--t-fast) var(--ease)}
.dom-row:hover{border-color:var(--primary);box-shadow:0 0 10px rgba(111,155,199,0.20)}
.dom-num{font-family:var(--font-display);font-size:0.78rem;padding:0.25rem 0.55rem;background:rgba(111,155,199,0.15);color:var(--primary-bright);border:1px solid var(--primary);border-radius:0;letter-spacing:0.04em;text-shadow:0 0 4px var(--glow-pri)}
.dom-name{flex:1;font-size:0.88rem;font-weight:500;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom-bar{flex:1;max-width:200px;height:10px;background:#000;border:1.5px solid var(--secondary);overflow:hidden;position:relative}
.dom-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--tertiary));box-shadow:0 0 10px var(--glow-pri);transition:width var(--t-slow) var(--ease-out)}
.dom-fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,0.25) 6px 7px)}
.dom-fill.warn{background:linear-gradient(90deg,var(--warn),#fde68a)}
.dom-fill.danger{background:linear-gradient(90deg,var(--danger),#fca5a5)}
.dom-pct{font-family:var(--font-mono);font-size:0.8rem;font-weight:700;color:var(--tertiary);width:50px;text-align:right;letter-spacing:0.04em;text-shadow:0 0 4px var(--glow-ter)}
.dom-pct.muted{color:var(--text-3);text-shadow:none}

/* ───── BUTTONS ───── */
.btn{
  padding:0.6rem 1.15rem;
  border-radius:0;
  border:1.5px solid var(--secondary);
  background:#000;
  font-family:var(--font-body);font-size:0.82rem;font-weight:600;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:0.45rem;
  transition:all var(--t-fast) var(--ease);
  white-space:nowrap;
  color:var(--secondary-bright);
  letter-spacing:0.02em;
  box-shadow:0 0 10px rgba(111,155,199,0.2),inset 0 0 6px rgba(111,155,199,0.04);
}
.btn svg{width:14px;height:14px}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-bright);box-shadow:0 0 18px var(--glow-pri),inset 0 0 6px rgba(111,155,199,0.08)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#000;
  border-color:var(--primary);
  text-shadow:none;
  box-shadow:0 0 16px var(--glow-pri);
  font-weight:700;
}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--primary-bright),var(--secondary-bright));box-shadow:0 0 24px var(--glow-pri);transform:translateY(-1px)}
.btn-warn{border-color:var(--warn);color:var(--warn);box-shadow:0 0 10px var(--glow-warn)}
.btn-warn:hover:not(:disabled){background:rgba(217,164,65,0.10);box-shadow:0 0 18px var(--glow-warn)}
.btn-ghost{border:1.5px solid transparent;background:transparent;color:var(--text-2);box-shadow:none}
.btn-ghost:hover{color:var(--text);border-color:var(--border-bright);background:rgba(111,155,199,0.06);box-shadow:none}
.btn-danger{border-color:var(--danger);color:var(--danger);box-shadow:0 0 10px rgba(155,95,114,0.3)}
.btn-danger:hover:not(:disabled){background:rgba(155,95,114,0.10)}
.btn-sm{padding:0.4rem 0.85rem;font-size:0.74rem}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
.btn-icon{padding:0.4rem;width:34px;height:34px;justify-content:center}
.btn-icon svg{width:14px;height:14px}

/* ───── QUIZ ───── */
.q-meta{
  display:flex;align-items:center;gap:0.5rem;
  font-family:var(--font-mono);font-size:0.72rem;
  color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;
  margin-bottom:0.85rem;flex-wrap:wrap;
}
.q-meta-tag{
  padding:0.2rem 0.55rem;
  background:#000;
  border:1px solid var(--border);
  border-radius:0;
  color:var(--text-2);
}
.q-meta-tag.review{background:rgba(217,164,65,0.10);border-color:var(--warn);color:var(--warn);text-shadow:0 0 4px var(--glow-warn)}
.q-meta-tag.streak{background:rgba(111,155,199,0.10);border-color:var(--primary);color:var(--primary-bright);text-shadow:0 0 4px var(--glow-pri)}
.q-meta-tag.weak{background:rgba(155,95,114,0.10);border-color:var(--danger);color:var(--danger)}
.q-meta-tag.exam{background:rgba(95,168,140,0.10);border-color:var(--tertiary);color:var(--tertiary);text-shadow:0 0 4px var(--glow-ter)}
.q-actions{margin-left:auto;display:flex;gap:0.4rem}

.question-text{
  font-family:var(--font-display);
  font-size:1.1rem;
  font-weight:400;
  line-height:1.5;
  letter-spacing:0.01em;
  color:var(--text);
  margin-bottom:1.25rem;
  text-shadow:0 0 8px rgba(255,255,255,0.15);
}

.options{display:flex;flex-direction:column;gap:0.55rem;margin-bottom:1.25rem}
.option{
  display:flex;align-items:flex-start;gap:0.85rem;
  padding:0.95rem 1.1rem;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  cursor:pointer;
  transition:all var(--t-fast) var(--ease);
  position:relative;
  overflow:hidden;
  font-family:inherit;
  color:inherit;
  width:100%;
  text-align:left;
}
.option::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--primary);transition:width var(--t-fast) var(--ease)}
.option:hover:not(.disabled){border-color:var(--primary);box-shadow:0 0 14px rgba(111,155,199,0.25)}
.option:hover:not(.disabled)::before{width:3px}
.option.selected{border-color:var(--primary);background:rgba(111,155,199,0.08);box-shadow:0 0 16px rgba(111,155,199,0.3)}
.option.selected::before{width:4px}
.option.correct{border-color:var(--success)!important;background:rgba(95,168,140,0.10)!important;box-shadow:0 0 18px rgba(95,168,140,0.4)!important;animation:pop 0.4s var(--ease-out)}
.option.correct::before{width:4px!important;background:var(--success)!important}
.option.incorrect{border-color:var(--danger)!important;background:rgba(155,95,114,0.10)!important;box-shadow:0 0 18px rgba(155,95,114,0.35)!important;animation:shake 0.4s var(--ease)}
.option.incorrect::before{width:4px!important;background:var(--danger)!important}
.option.disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.option-letter{
  width:30px;height:30px;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  display:grid;place-items:center;
  font-family:var(--font-mono);font-weight:700;font-size:0.82rem;
  color:var(--secondary-bright);
  flex-shrink:0;
  transition:all var(--t-fast) var(--ease);
}
.option:hover:not(.disabled) .option-letter,
.option.selected .option-letter{border-color:var(--primary);color:var(--primary-bright);box-shadow:0 0 8px var(--glow-pri);text-shadow:0 0 4px var(--glow-pri)}
.option.correct .option-letter{border-color:var(--success);color:var(--success);background:rgba(95,168,140,0.10);box-shadow:0 0 8px rgba(95,168,140,0.4)}
.option.incorrect .option-letter{border-color:var(--danger);color:var(--danger);background:rgba(155,95,114,0.10);box-shadow:0 0 8px rgba(155,95,114,0.4)}
.option-text{font-size:0.92rem;line-height:1.55;padding-top:0.2rem;color:var(--text);flex:1}

.explanation{
  position:relative;
  padding:1rem 1.15rem 1rem 1.25rem;
  background:rgba(111,155,199,0.06);
  border:1.5px solid var(--primary);
  border-radius:0;
  margin-bottom:1rem;
  font-size:0.9rem;line-height:1.65;
  color:var(--text);
  animation:slideUp 0.3s var(--ease-out);
  box-shadow:0 0 14px rgba(111,155,199,0.15);
}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.explanation-label{
  font-family:var(--font-mono);font-weight:700;
  color:var(--primary-bright);font-size:0.7rem;
  text-transform:uppercase;letter-spacing:0.12em;
  margin-bottom:0.4rem;
  display:flex;align-items:center;gap:0.4rem;
  text-shadow:0 0 4px var(--glow-pri);
}
.explanation-label svg{width:14px;height:14px}

.quiz-controls{display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap}
.score-display{
  margin-left:auto;
  display:flex;align-items:center;gap:0.45rem;
  font-family:var(--font-mono);font-size:0.78rem;color:var(--text-2);
  padding:0.4rem 0.75rem;
  background:#000;
  border:1px solid var(--border);
  border-radius:0;
}
.score-num{font-weight:700;font-size:0.85rem;letter-spacing:0.04em}
.score-num.good{color:var(--success);text-shadow:0 0 4px rgba(95,168,140,0.5)}
.score-num.ok{color:var(--warn);text-shadow:0 0 4px var(--glow-warn)}
.score-num.bad{color:var(--danger);text-shadow:0 0 4px rgba(155,95,114,0.5)}

/* Question note inline editor */
.q-note{
  margin-top:1rem;
  padding:0.85rem 1rem;
  background:rgba(95,168,140,0.05);
  border:1.5px solid var(--tertiary);
  border-radius:0;
  box-shadow:0 0 10px rgba(95,168,140,0.15);
}
.q-note-label{font-family:var(--font-mono);font-size:0.7rem;color:var(--tertiary);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.4rem;display:flex;align-items:center;gap:0.4rem;text-shadow:0 0 4px var(--glow-ter)}
.q-note textarea{
  width:100%;min-height:64px;
  background:#000;
  border:1px solid var(--border);
  border-radius:0;
  padding:0.6rem 0.75rem;
  color:var(--text);
  font-family:var(--font-mono);font-size:0.82rem;
  resize:vertical;
}
.q-note textarea:focus{outline:none;border-color:var(--tertiary);box-shadow:0 0 8px var(--glow-ter)}
.q-note-actions{display:flex;justify-content:flex-end;gap:0.4rem;margin-top:0.5rem}

/* ───── FLASHCARDS ───── */
.fc-progress{
  text-align:center;
  font-family:var(--font-mono);font-size:0.74rem;
  color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;
  margin-bottom:0.6rem;
}
.fc-progress b{color:var(--primary-bright);text-shadow:0 0 6px var(--glow-pri)}
.fc-progress-track{
  height:4px;background:#000;border:1px solid var(--secondary);
  overflow:hidden;margin:0 auto 1rem;max-width:280px;
}
.fc-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--tertiary));transition:width var(--t-slow) var(--ease-out);box-shadow:0 0 8px var(--glow-pri)}

.flashcard-container{perspective:1400px;margin-bottom:1.25rem}
.flashcard{
  position:relative;width:100%;min-height:340px;
  transform-style:preserve-3d;
  transition:transform 0.7s var(--ease-out);
  cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;top:0;left:0;width:100%;min-height:340px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:2px solid var(--primary);
  border-radius:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;text-align:center;
  background:linear-gradient(135deg,var(--card),var(--surface-2));
  box-shadow:0 0 28px rgba(111,155,199,0.25),inset 0 0 16px rgba(111,155,199,0.04);
  overflow:hidden;
}
.flashcard-front-mark{
  font-family:var(--font-mono);font-size:0.66rem;
  color:var(--tertiary);
  text-transform:uppercase;letter-spacing:0.18em;
  margin-bottom:1rem;
  padding:0.3rem 0.7rem;
  background:#000;
  border:1px solid var(--tertiary);
  text-shadow:0 0 4px var(--glow-ter);
}
.flashcard-term{
  font-family:var(--font-display);
  font-size:1.5rem;font-weight:400;
  color:var(--primary-bright);
  line-height:1.25;letter-spacing:0.04em;
  margin-bottom:0.85rem;
  text-shadow:0 0 12px var(--glow-pri),0 0 24px var(--glow-pri);
}
.flashcard-hint{
  font-family:var(--font-mono);font-size:0.7rem;
  color:var(--text-3);text-transform:uppercase;letter-spacing:0.12em;
  margin-top:1.5rem;
  display:flex;align-items:center;gap:0.45rem;
}
.flashcard-hint .kbd{
  padding:0.15rem 0.4rem;
  background:#000;border:1px solid var(--border);
  border-radius:0;font-size:0.65rem;color:var(--text-2);
}
.flashcard-back{transform:rotateY(180deg)}
.flashcard-def{
  font-size:1rem;line-height:1.7;
  color:var(--text);
  margin-bottom:1.1rem;text-align:left;width:100%;
}
.flashcard-example{
  font-size:0.88rem;line-height:1.6;
  color:var(--text-2);
  padding:0.85rem 1rem;
  background:rgba(111,155,199,0.06);
  border-left:3px solid var(--primary);
  text-align:left;width:100%;
  box-shadow:0 0 10px rgba(111,155,199,0.15);
}
.flashcard-example b{color:var(--primary-bright);font-weight:700;font-family:var(--font-mono);font-size:0.74rem;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:0.3rem;text-shadow:0 0 4px var(--glow-pri)}

/* ───── REFERENCE ───── */
.search-bar{display:flex;gap:0.5rem;margin-bottom:1rem}
.search-input-wrap{flex:1;position:relative}
.search-input{
  width:100%;
  padding:0.75rem 1rem 0.75rem 2.6rem;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  color:var(--text);
  font-family:var(--font-body);font-size:0.9rem;
  transition:all var(--t-fast) var(--ease);
}
.search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 12px var(--glow-pri)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--text-3);width:16px;height:16px;pointer-events:none}

.quick-picks{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.25rem}
.quick-pick{
  padding:0.4rem 0.8rem;
  background:#000;
  border:1px solid var(--border);
  border-radius:0;
  color:var(--text-2);
  cursor:pointer;
  font-family:var(--font-mono);font-size:0.74rem;font-weight:500;
  transition:all var(--t-fast) var(--ease);
  letter-spacing:0.02em;
}
.quick-pick:hover,.quick-pick.active{border-color:var(--primary);color:var(--primary-bright);box-shadow:0 0 10px var(--glow-pri);text-shadow:0 0 4px var(--glow-pri)}

.ref-list{display:flex;flex-direction:column;gap:0.5rem}
.ref-item{
  display:flex;align-items:center;gap:0.85rem;
  padding:0.85rem 1.1rem;
  background:#000;
  border:1.5px solid var(--secondary);
  border-radius:0;
  cursor:pointer;
  transition:all var(--t-fast) var(--ease);
  position:relative;overflow:hidden;
  box-shadow:0 0 10px rgba(111,155,199,0.15);
  font-family:inherit;color:inherit;width:100%;text-align:left;
}
.ref-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,var(--primary),var(--tertiary));transition:width var(--t-fast) var(--ease)}
.ref-item:hover{border-color:var(--primary);box-shadow:0 0 16px var(--glow-pri)}
.ref-item:hover::before{width:3px}
.ref-icon{
  width:36px;height:36px;
  background:rgba(111,155,199,0.10);
  border:1.5px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  flex-shrink:0;
  color:var(--primary-bright);
  box-shadow:0 0 8px var(--glow-pri);
}
.ref-icon svg{width:18px;height:18px}
.ref-meta{flex:1;min-width:0}
.ref-item-title{font-family:var(--font-display);font-weight:400;font-size:0.95rem;color:var(--text);margin-bottom:0.15rem;letter-spacing:0.04em}
.ref-item-domain{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em}
.ref-item-arrow{color:var(--text-3);transition:transform var(--t-fast) var(--ease)}
.ref-item:hover .ref-item-arrow{color:var(--primary);transform:translateX(3px)}

/* Topics: domain overview cards */
.dom-grid{display:flex;flex-direction:column;gap:0.6rem;margin-top:0.25rem}
.dom-card{
  display:flex;align-items:center;gap:1rem;
  padding:1.05rem 1.2rem;background:#000;
  border:1.5px solid var(--secondary);border-radius:0;cursor:pointer;
  transition:all var(--t-fast) var(--ease);
  position:relative;overflow:hidden;
  box-shadow:0 0 10px rgba(111,155,199,0.15);
  font-family:inherit;color:inherit;width:100%;text-align:left;
}
.dom-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,var(--primary),var(--tertiary));transition:width var(--t-fast) var(--ease)}
.dom-card:hover{border-color:var(--primary);box-shadow:0 0 18px var(--glow-pri)}
.dom-card:hover::before{width:4px}
.dom-card-badge{
  width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--font-display);font-size:1.1rem;letter-spacing:0.02em;
  color:var(--primary-bright);background:rgba(111,155,199,0.10);
  border:1.5px solid var(--primary);border-radius:0;box-shadow:0 0 10px var(--glow-pri);
}
.dom-card-body{flex:1;min-width:0}
.dom-card-title{font-family:var(--font-display);font-weight:400;font-size:1rem;color:var(--text);letter-spacing:0.04em;margin-bottom:0.25rem}
.dom-card-sub{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-2);line-height:1.5}
.dom-card-count{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-top:0.35rem}
.dom-card-arrow{color:var(--text-3);flex-shrink:0;transition:transform var(--t-fast) var(--ease)}
.dom-card:hover .dom-card-arrow{color:var(--primary);transform:translateX(3px)}
.ref-domain-head{display:flex;align-items:center;gap:0.75rem;margin:0 0 1rem}
.ref-domain-head .rh-badge{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;font-family:var(--font-display);color:var(--primary-bright);background:rgba(111,155,199,0.10);border:1.5px solid var(--primary);border-radius:0;box-shadow:0 0 10px var(--glow-pri)}
.ref-domain-head .rh-title{font-family:var(--font-display);font-size:1.05rem;color:var(--text);letter-spacing:0.04em}
.ref-domain-head .rh-sub{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-top:0.15rem}

.ref-back{margin-bottom:1rem}
.ref-detail{animation:slideUp 0.3s var(--ease-out)}
.ref-detail-header{
  display:flex;align-items:center;gap:0.85rem;
  margin-bottom:1.25rem;
  padding-bottom:1rem;
  border-bottom:2px solid var(--border);
  flex-wrap:wrap;
}
.ref-detail-icon{
  width:48px;height:48px;
  background:#000;
  border:2px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  color:var(--primary-bright);
  box-shadow:0 0 16px var(--glow-pri);
  flex-shrink:0;
}
.ref-detail-icon svg{width:22px;height:22px}
.ref-detail-info{flex:1;min-width:200px}
.ref-detail-title{font-family:var(--font-display);font-size:1.4rem;letter-spacing:0.03em;line-height:1.2;color:var(--text);text-shadow:0 0 8px rgba(255,255,255,0.25)}
.ref-detail-meta{font-family:var(--font-mono);font-size:0.72rem;color:var(--tertiary);text-transform:uppercase;letter-spacing:0.1em;margin-top:0.3rem;text-shadow:0 0 4px var(--glow-ter)}
.ref-content{font-size:0.95rem;line-height:1.75;color:var(--text)}
.ref-content p{margin-bottom:1rem}
.ref-content p:last-child{margin-bottom:0}

/* ───── EMPTY STATE ───── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-3)}
.empty-icon{
  width:60px;height:60px;
  margin:0 auto 1rem;
  background:#000;
  border:2px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  color:var(--primary-bright);
  box-shadow:0 0 20px var(--glow-pri);
}
.empty-icon svg{width:28px;height:28px}
.empty-state p{font-size:0.95rem;color:var(--text-2);margin-bottom:0.3rem}

/* ───── TOAST ───── */
.toast-container{position:fixed;top:5rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none}
.toast{
  pointer-events:auto;
  background:#000;
  border:2px solid var(--primary);
  border-radius:0;
  padding:0.85rem 1.1rem;
  display:flex;align-items:center;gap:0.7rem;
  box-shadow:0 0 24px var(--glow-pri),0 8px 32px rgba(0,0,0,0.6);
  min-width:240px;max-width:340px;
  animation:toastIn 0.4s var(--ease-out),toastOut 0.4s var(--ease) 3.6s forwards;
}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
.toast-icon{
  width:34px;height:34px;
  background:rgba(111,155,199,0.15);
  border:1.5px solid var(--primary);
  border-radius:0;
  display:grid;place-items:center;
  color:var(--primary-bright);flex-shrink:0;
  box-shadow:0 0 8px var(--glow-pri);
}
.toast-icon svg{width:18px;height:18px;filter:drop-shadow(0 0 3px currentColor)}
.toast-text{flex:1;min-width:0}

.hm-cd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.hm-cd .num{font-family:var(--font-display);font-weight:900;font-size:60px;color:var(--text);line-height:.82;letter-spacing:-.02em}

.hm-track{height:3px;background:var(--hair)}

.hm-hr{height:1px;background:var(--hair);margin:22px 0}
.hm-slab{font-family:var(--font-mono);font-size:9.5px;color:var(--primary);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.hm-tl{position:relative;padding-left:26px}
.hm-tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--hair)}
.hm-tp{position:relative;padding:8px 0}

.hm-tp:before{content:'';position:absolute;left:-24px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--border)}
.hm-tp.done:before{background:var(--success);border-color:var(--success)}
.hm-tp.now:before{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px rgba(217,164,65,.16)}
.hm-tp.goal:before{background:var(--primary);border-color:var(--primary);width:13px;height:13px;left:-25px}
.hm-tp .h{font-size:13px;font-weight:600;color:var(--text-2)}
.hm-tp.now .h,.hm-tp.done .h{color:var(--text)}
.hm-tp .m{font-family:var(--font-mono);font-size:9px;color:var(--text-3);letter-spacing:.06em;margin-top:2px}
.hm-tp.now .m{color:var(--warn)}
.hm-tp.goal .h{color:var(--primary-bright);font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:14px}
.hm-tp[data-action]:hover .h{color:var(--primary-bright)}
.hm-stats{display:flex;gap:0}
.hm-st{flex:1;padding:0 16px}
.hm-st:first-child{padding-left:0}
.hm-st+.hm-st{border-left:1px solid var(--hair)}
.hm-st .v{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--text);line-height:1}
.hm-st .l{font-family:var(--font-mono);font-size:8.5px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.hm-act{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair-soft);font-size:12px}
.hm-act:last-child{border-bottom:0}
.hm-act .t{flex:1;min-width:0;color:var(--text);font-weight:600}
.hm-act .t span{display:block;font-family:var(--font-mono);font-size:9px;color:var(--text-3);font-weight:500;margin-top:2px;letter-spacing:.04em}
.hm-act .sc{font-family:var(--font-display);font-weight:900;font-size:15px}
.hm-mast{display:flex;align-items:center;gap:12px;margin:11px 0;font-size:11px}
.hm-mast .n{flex:0 0 154px;color:var(--text-2);font-weight:600}
.hm-mast .db{flex:1;height:2px;background:var(--hair)}
.hm-mast .db i{display:block;height:100%}
.hm-mast .p{font-family:var(--font-mono);font-size:10px;color:var(--text-2);flex:0 0 34px;text-align:right}
.hm-empty{color:var(--text-3);font-size:12px;font-family:var(--font-mono)}
.hm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

<script>
const DOMAINS = [
