function stat(l,v,sub,p,cls){
  return '<div class="stat"><div class="stat-l">'+l+'</div><div class="stat-v">'+v+'</div>'+
    (sub?'<div style="font-size:.755rem;color:var(--text-3);margin-top:.15rem">'+sub+'</div>':'')+
    (p!==null&&p!==undefined?'<div class="bar '+(cls||'')+'"><i style="width:'+Math.min(100,p)+'%"></i></div>':'')+'</div>';
}
function ringSvg(p,size,sw){
  const r=(size-sw)/2, c=2*Math.PI*r;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'+
    '<circle class="bgc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+sw+'"/>'+
    '<circle class="fgc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+sw+
    '" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*Math.min(100,p)/100)+'"/></svg>';
}
function activityHeat(){
  const days=84, counts={};
  Object.values(P.answered).forEach(a=>{ if(a.day) counts[a.day]=(counts[a.day]||0)+1; });
  let h='<div class="hm">';
  for(let i=days-1;i>=0;i--){
    const d=new Date(Date.now()-i*DAY).toISOString().slice(0,10), n=counts[d]||0;
    const lv=n===0?'':n<3?'l1':n<8?'l2':n<16?'l3':'l4';
    h+='<i class="'+lv+'" title="'+d+': '+n+'"></i>';
  }
  return h+'</div>';
}

// ── QUIZ ─────────────────────────────────────────────────────────────
function newQuiz(){
  let pool = ui.weakMode ? weakDomains().flatMap(w=>qsFor(w.domain))
           : ui.markMode ? CERT.questions.filter(q=>P.marks['q:'+q.id])
           : qsFor(ui.domain);
  if(!pool.length) pool=qsFor(0);
  // prefer unseen, then least-recently-seen
  const unseen=pool.filter(q=>!P.seen[q.id]);
  const src=unseen.length?unseen:pool;
  const q=src[Math.floor(Math.random()*src.length)];
  ui.quiz={ q, picked:null, sel:[], order:S.shuffleOpts?shuffle(optKeys(q)):optKeys(q) };
}
function quiz(){
  if(!ui.quiz) newQuiz();
  const {q,picked}=ui.quiz;
  const done=picked!==null;
  const key=ansArr(q), multi=isMulti(q);
  const correct=done&&sameSet(picked,key);
  const o=P.scores[ui.domain]||P.scores[0];

  let h='<div class="page-head"><div><div class="page-title">Quiz</div>'+
    '<div class="page-sub">'+(ui.weakMode?'Weak-domain drill':ui.markMode?'Saved questions':(ui.domain===0?'All domains':CERT.domains[ui.domain].name))+
    ' · '+(o.t?pct(o)+'% accuracy over '+o.t:'no answers yet')+'</div></div></div>';

  h+='<div class="chip-row" style="margin-bottom:1.15rem">'+
    CERT.domains.map((d,i)=>'<button class="chip '+(!ui.weakMode&&!ui.markMode&&ui.domain===i?'on':'')+'" data-dom="'+i+'">'+
      esc(i===0?'All':shortDom(d.name))+'</button>').join('')+
    '<button class="chip '+(ui.weakMode?'on':'')+'" data-weakquiz="1">'+ICON.weak+'Weak</button>'+
    (countMarks()?'<button class="chip '+(ui.markMode?'on':'')+'" data-markquiz="1">'+ICON.mark+'Saved</button>':'')+
  '</div>';

  h+='<div class="grid g-two"><div class="card card-pad">'+
    '<div class="kicker">'+(S.hideDomain?'Question'+selBadge(q):'Domain '+q.domain+' · '+esc(shortDom(CERT.domains[q.domain].name))+selBadge(q))+'</div>'+
    '<div class="q-text">'+esc(q.question)+'</div>'+preBlock(q);

  ui.quiz.order.forEach(k=>{
    let cls='';
    if(done){ if(key.includes(k)) cls='ok'; else if(picked.includes(k)) cls='no'; }
    else if(multi&&ui.quiz.sel.includes(k)) cls='sel';
    h+='<button class="opt '+cls+'" data-pick="'+k+'"'+(done?' disabled':'')+'>'+
       '<span class="k">'+k+'</span><span>'+esc(q.options[k])+'</span></button>';
  });

  if(!done&&multi){
    h+='<div class="btn-row" style="margin-top:.95rem"><button class="btn btn-pri" id="checkQ"'+(ui.quiz.sel.length?'':' disabled')+'>Check answer</button>'+
       '<span style="font-size:.79rem;color:var(--text-3)">'+ui.quiz.sel.length+' of '+key.length+' selected</span></div>';
  }
  if(done){
    h+='<div class="explain '+(correct?'ok':'no')+'" style="padding:.7rem .85rem"><span class="eh" style="margin:0">'+
       (correct?'Correct':'Not quite — the answer is '+key.join(' and '))+'</span></div>';
    h+='<div class="btn-row" style="margin-top:1.15rem">'+
       '<button class="btn btn-pri" id="nextQ">Next question'+ICON.right+'</button>'+
       '<button class="btn" data-mark="q:'+q.id+'">'+ICON.mark+(P.marks['q:'+q.id]?'Saved':'Save')+'</button>'+
       '</div>';
  } else {
    h+='<div class="btn-row" style="margin-top:1.15rem"><button class="btn btn-ghost btn-sm" id="skipQ">Skip this one</button></div>';
  }
  h+='</div>';

  // right column — the breakdown once answered, session stats before that
  if(done){
    h+='<div class="card card-pad">'+
      '<div class="sec-title">'+ICON.check+'Why '+key.join(' and ')+(key.length>1?' are':' is')+' right</div>';
    key.forEach(k=>{ h+='<div class="reb ok"><span class="k">'+k+'</span><span>'+esc(q.options[k])+'</span></div>'; });
    h+='<div class="lead-txt" style="margin-top:.75rem">'+nlbr(q.lead)+'</div>';
    const wr=wrongKeys(q);
    if(wr.length){
      h+='<div class="sec-title" style="margin-top:1.25rem">'+ICON.weak+'Why the others are not</div>';
      wr.forEach(k=>{
        const yours=picked.includes(k);
        h+='<div class="reb'+(yours?' no':'')+'"><span class="k">'+k+'</span><span>'+
           (yours?'<span class="yours">You chose this. </span>':'')+esc(q.why[k]||'')+'</span></div>';
      });
    }
    if(q.note) h+='<div class="reb-note">'+esc(q.note)+'</div>';
    h+='</div></div>';
    return h;
  }

  h+='<div class="stack"><div class="card card-pad"><div class="sec-title">'+ICON.target+'This session</div>'+
     '<div class="stat-v" style="font-size:1.5rem">'+todayCount()+' <small>today</small></div>'+
     '<div class="bar"><i style="width:'+Math.min(100,Math.round(todayCount()/S.dailyGoal*100))+'%"></i></div>'+
     '<div style="font-size:.775rem;color:var(--text-3);margin-top:.45rem">Goal: '+S.dailyGoal+' questions</div></div>';
  h+='<div class="card card-pad"><div class="sec-title">'+ICON.chart+'By domain</div>';
  for(let i=1;i<=5;i++){ const s=P.scores[i],p=pct(s);
    h+='<div class="dom-row"><span class="dom-n">'+esc(shortDom(CERT.domains[i].name))+'</span>'+
       '<span class="dom-bar"><span class="bar '+(s.t?(p>=75?'ok':p>=60?'warn':'no'):'')+'"><i style="width:'+(s.t?p:0)+'%"></i></span></span>'+
       '<span class="dom-p">'+(s.t?p+'%':'—')+'</span></div>'; }
  h+='</div></div></div>';
  return h;
}

function answer(sel){
  const q=ui.quiz.q; if(ui.quiz.picked!==null) return;
  ui.quiz.picked=sel.slice().sort();
  const ok=sameSet(sel,ansArr(q));
  P.scores[0].t++; P.scores[q.domain].t++;
  if(ok){ P.scores[0].c++; P.scores[q.domain].c++; P.xp+=10; } else { P.xp+=2; }
  P.answered[q.id]={ok,day:todayKey(),ts:Date.now()};
  P.seen[q.id]=Date.now();
  bumpStreak(); saveP(); render();
  if(ok) toast('+10 XP');
}

// ── FLASHCARDS ───────────────────────────────────────────────────────
// Which way round the current card is asked. 'term' shows the name and asks
// for the meaning; 'def' shows the meaning and asks for the name. In mixed
// mode the direction is rolled once per card and held until the next one.
function rollDir(){ return S.cardMode==='mix' ? (Math.random()<.5?'term':'def') : (S.cardMode||'term'); }
function cardDir(){ return S.cardMode==='mix' ? (ui.cardDir||'term') : (S.cardMode||'term'); }
function pickCard(){
  const due=dueCards(ui.domain);
  const pool=due.length?due:cardsFor(ui.domain);
  ui.cardDir=rollDir();
  if(!pool.length){ ui.card=null; return; }
  ui.card=pool[Math.floor(Math.random()*pool.length)];
  ui.cardFlip=false;
}
function cards(){
  if(!ui.card||!cardsFor(ui.domain).some(c=>c.id===ui.card.id)) pickCard();
  const dueN=dueCards(ui.domain).length, total=cardsFor(ui.domain).length;

  let h='<div class="page-head"><div><div class="page-title">Flashcards</div>'+
    '<div class="page-sub">'+dueN+' due · '+total+' in '+(ui.domain===0?'this track':CERT.domains[ui.domain].name)+'</div></div></div>';

  h+='<div class="chip-row" style="margin-bottom:.7rem">'+
    CERT.domains.map((d,i)=>'<button class="chip '+(ui.domain===i?'on':'')+'" data-dom="'+i+'">'+esc(i===0?'All':shortDom(d.name))+'</button>').join('')+'</div>';

  h+='<div class="chip-row" style="margin-bottom:1.15rem;align-items:center">'+
    '<span style="font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-right:.15rem">Ask me</span>'+
    CARD_MODES.map(m=>'<button class="chip '+((S.cardMode||'term')===m.k?'on':'')+'" data-cardmode="'+m.k+'" title="'+esc(m.tip)+'">'+esc(m.l)+'</button>').join('')+'</div>';

  if(!ui.card) return h+empty(ICON.cards,'No cards here','This domain has no flashcards yet.');

  const c=ui.card, box=P.box[c.id]||0, dir=cardDir(), rev=dir==='def';
  const domTag='<div class="kicker" style="position:absolute;top:1.3rem;left:1.6rem">Domain '+c.domain+' · '+esc(shortDom(CERT.domains[c.domain].name))+'</div>';
  const front = rev
    ? domTag+'<div class="fc-label">What is it?</div>'+
      '<div class="fc-prompt">'+esc(c.definition)+'</div>'+
      '<div class="fc-hint">Name the term, then click to check</div>'
    : domTag+'<div class="fc-label">What does it do?</div>'+
      '<div class="fc-term">'+esc(c.term)+'</div>'+
      '<div class="fc-hint">Say the meaning, then click to check</div>';
  const back = rev
    ? '<div class="fc-ans">'+esc(c.term)+'</div>'+
      '<div class="fc-ex"><b>In practice</b>'+esc(c.example)+'</div>'
    : '<div class="fc-def">'+esc(c.definition)+'</div>'+
      '<div class="fc-ex"><b>In practice</b>'+esc(c.example)+'</div>';
  h+='<div class="grid g-main"><div><div class="fc-wrap"><div class="fc'+(ui.cardFlip?' flip':'')+'" id="fcard">'+
    '<div class="fc-side">'+front+'</div>'+
    '<div class="fc-side fc-back">'+back+'</div>'+
  '</div></div>';

  if(ui.cardFlip){
    h+='<div class="btn-row"><button class="btn btn-danger" data-grade="0">'+ICON.x+'Missed it</button>'+
       '<button class="btn" data-grade="1">Hard</button>'+
       '<button class="btn btn-pri" data-grade="2">'+ICON.check+'Got it</button>'+
       '<button class="btn btn-ghost btn-sm" data-mark="c:'+c.id+'">'+ICON.mark+(P.marks['c:'+c.id]?'Saved':'Save')+'</button></div>';
  } else {
    h+='<div class="btn-row"><button class="btn btn-pri" id="flipBtn">'+(rev?'Reveal the term':'Reveal the meaning')+'</button>'+
       '<button class="btn btn-ghost btn-sm" id="skipCard">Skip</button></div>';
  }
  h+='</div>';

  h+='<div class="stack"><div class="card card-pad"><div class="sec-title">'+ICON.cards+'This card</div>'+
     '<div style="font-size:.85rem;color:var(--text-2);line-height:1.6">Leitner box <b style="color:var(--text)">'+(box+1)+' of 5</b><br>'+
     (box>=4?'Mastered — long interval.':'Next review in '+BOX_DAYS[Math.min(box,4)]+' day'+(BOX_DAYS[Math.min(box,4)]===1?'':'s')+' if correct.')+'</div>'+
     '<div class="bar" style="margin-top:.75rem"><i style="width:'+((box)/4*100)+'%"></i></div>'+
     '<div style="font-size:.78rem;color:var(--text-3);margin-top:.7rem;line-height:1.5">Asked '+(rev?'definition first — name the term.':'term first — give the meaning.')+(S.cardMode==='mix'?' (mixed)':'')+'</div></div>'+
     '<div class="card card-pad"><div class="sec-title">'+ICON.chart+'Progress</div>'+
     boxSpread()+'</div></div></div>';
  return h;
}
function boxSpread(){
  const counts=[0,0,0,0,0];
  cardsFor(ui.domain).forEach(c=>counts[Math.min(4,P.box[c.id]||0)]++);
  const tot=Math.max(1,counts.reduce((a,b)=>a+b,0));
  return counts.map((n,i)=>'<div class="dom-row"><span class="dom-n">Box '+(i+1)+'</span>'+
    '<span class="dom-bar"><span class="bar"><i style="width:'+Math.round(n/tot*100)+'%"></i></span></span>'+
    '<span class="dom-p">'+n+'</span></div>').join('');
}
function gradeCard(g){
  const c=ui.card; if(!c) return;
  let box=P.box[c.id]||0;
  if(g===0) box=0; else if(g===1) box=Math.max(0,box); else box=Math.min(4,box+1);
  P.box[c.id]=box;
  P.due[c.id]=Date.now()+BOX_DAYS[Math.min(box,4)]*DAY;
  P.xp+= g===2?6:g===1?3:1;
  bumpStreak(); saveP(); pickCard(); render();
}

// ── EXAM ─────────────────────────────────────────────────────────────
function buildExam(){
  // weight by official domain percentages
  const picks=[];
  for(let d=1;d<=5;d++){
    const w=parseInt(CERT.domains[d].weight)||20;
    const n=Math.round(EXLEN()*w/100);
    picks.push(...shuffle(qsFor(d)).slice(0,n));
  }
  let list=shuffle(picks).slice(0,EXLEN());
  if(list.length<EXLEN()){
    const have=new Set(list.map(q=>q.id));
    list=list.concat(shuffle(CERT.questions.filter(q=>!have.has(q.id))).slice(0,EXLEN()-list.length));
  }
  P.exam={ ids:list.map(q=>q.id), i:0, ans:{}, start:Date.now(), done:false, score:0 };
  saveP();
}
function exam(){
  const e=P.exam;
  if(!e) return examIntro();
  // an exam saved by an older question bank may reference ids that no longer exist
  if(!e.done && !e.ids.every(id=>CERT.questions.some(q=>q.id===id))){
    P.exam=null; saveP();
    toast('Question bank updated — start a fresh exam');
    return examIntro();
  }
  if(e.done) return examResult();
  return examRun();
}
function examIntro(){
  const last=P.history[P.history.length-1];
  return '<div class="page-head"><div><div class="page-title">Practice exam</div>'+
    '<div class="page-sub">'+EXLEN()+' questions · '+(EXMINS()?EXMINS()+' minutes':'untimed')+' · '+PASSNOW()+'% to pass</div></div></div>'+
    '<div class="grid g-main"><div class="card card-pad">'+
    '<div class="prose"><p>Questions are drawn at random and weighted by the official '+CERT.code+' domain percentages, so the mix reflects the real exam:</p></div>'+
    '<div style="margin:1.1rem 0">'+[1,2,3,4,5].map(d=>'<div class="dom-row"><span class="dom-n">'+esc(CERT.domains[d].name)+'</span>'+
      '<span class="dom-bar"><span class="bar"><i style="width:'+parseInt(CERT.domains[d].weight)+'%"></i></span></span>'+
      '<span class="dom-p">'+CERT.domains[d].weight+'</span></div>').join('')+'</div>'+
    '<div class="prose"><p>'+(EXMINS()?'The timer runs down from '+EXMINS()+' minutes.':'This attempt is untimed.')+' You can leave and come back — progress is saved. Explanations are shown only after you finish, as on the real thing.</p></div>'+
    '<div class="btn-row" style="margin-top:1.2rem"><button class="btn btn-pri btn-lg" id="startExam">'+ICON.play+'Begin exam</button></div></div>'+
    '<div class="stack">'+(last?'<div class="card card-pad"><div class="sec-title">'+ICON.exam+'Last attempt</div>'+
      '<div class="stat-v">'+last.score+'%</div><div style="font-size:.78rem;color:var(--text-3)">'+last.correct+' of '+last.total+' · '+
      new Date(last.at).toLocaleDateString()+'</div><div class="bar '+(last.score>=PASSNOW()?'ok':'no')+'"><i style="width:'+last.score+'%"></i></div></div>':'')+
    '<div class="card card-pad"><div class="sec-title">'+ICON.target+'Attempts</div><div class="stat-v">'+P.history.length+'</div>'+
    '<div style="font-size:.78rem;color:var(--text-3)">'+(P.history.filter(x=>x.score>=PASSNOW()).length)+' passing</div></div></div></div>';
}
function examRun(){
  const e=P.exam, q=CERT.questions.find(x=>x.id===e.ids[e.i]);
  const left=EXMINS()?Math.max(0,EXMINS()*60000-(Date.now()-e.start)):Infinity;
  const m=EXMINS()?Math.floor(left/60000):0, s=EXMINS()?Math.floor(left%60000/1000):0;
  const answered=Object.keys(e.ans).length;
  if(EXMINS()&&left<=0){ finishExam(); return examResult(); }

  let h='<div class="page-head"><div><div class="page-title">Question '+(e.i+1)+' of '+e.ids.length+'</div>'+
    '<div class="page-sub">'+answered+' answered · '+(e.ids.length-answered)+' remaining</div></div>'+
    '<div class="page-head-right"><span id="examClock" class="chip'+(m<5?' no':m<15?' warn':'')+'" style="font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums">'+
    (EXMINS()?m+':'+String(s).padStart(2,'0'):'untimed')+'</span>'+
    '<button class="btn btn-sm" id="endExam">Finish</button></div></div>';

  h+='<div class="bar" style="margin-bottom:1.2rem"><i style="width:'+Math.round((e.i+1)/e.ids.length*100)+'%"></i></div>';

  const cur=toArr(e.ans[q.id]);
  h+='<div class="card card-pad"><div class="kicker">Domain '+q.domain+' · '+esc(shortDom(CERT.domains[q.domain].name))+selBadge(q)+'</div>'+
    '<div class="q-text">'+esc(q.question)+'</div>'+preBlock(q);
  optKeys(q).forEach(k=>{
    h+='<button class="opt '+(cur.includes(k)?'sel':'')+'" data-epick="'+k+'"><span class="k">'+k+'</span><span>'+esc(q.options[k])+'</span></button>';
  });
  h+='<div class="btn-row" style="margin-top:1.15rem">'+
    '<button class="btn" id="ePrev"'+(e.i===0?' disabled':'')+'>'+ICON.left+'Previous</button>'+
    '<button class="btn btn-pri" id="eNext">'+(e.i===e.ids.length-1?'Review':'Next')+ICON.right+'</button>'+
    '<span style="font-size:.79rem;color:var(--text-3);margin-left:.3rem">Unanswered questions are marked wrong</span></div></div>';
  return h;
}
function finishExam(){
  const e=P.exam; if(!e||e.done) return;
  let c=0; const byDom={};
  e.ids.forEach(id=>{
    const q=CERT.questions.find(x=>x.id===id); if(!q) return;
    byDom[q.domain]=byDom[q.domain]||{c:0,t:0}; byDom[q.domain].t++;
    if(sameSet(toArr(e.ans[id]),ansArr(q))){ c++; byDom[q.domain].c++; }
  });
  e.done=true; e.correct=c; e.score=Math.round(c/e.ids.length*100); e.byDom=byDom;
  P.history.push({at:Date.now(),score:e.score,correct:c,total:e.ids.length});
  P.xp+=Math.round(c*4);
  bumpStreak(); saveP();
}
function examResult(){
  const e=P.exam, passed=e.score>=PASSNOW();
  let h='<div class="page-head"><div><div class="page-title">'+(passed?'Passed':'Not yet')+'</div>'+
    '<div class="page-sub">'+e.correct+' of '+e.ids.length+' correct · '+PASSNOW()+'% required</div></div>'+
    '<div class="page-head-right"><button class="btn" id="retakeExam">'+ICON.reset+'New exam</button></div></div>';

  h+='<div class="grid g-main"><div class="stack">'+
    '<div class="card card-pad" style="text-align:center;padding:2rem">'+
      '<div style="display:inline-block;position:relative">'+ringSvg(e.score,132,10)+
      '<div style="position:absolute;inset:0;display:grid;place-items:center"><div>'+
      '<div style="font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1">'+e.score+'%</div>'+
      '<div style="font-size:.76rem;color:var(--text-3);font-weight:600">'+(passed?'PASS':'BELOW '+PASSNOW()+'%')+'</div></div></div></div>'+
    '</div>'+
    '<div class="card card-pad"><div class="sec-title">'+ICON.chart+'By domain</div>';
  Object.keys(e.byDom).sort().forEach(d=>{
    const b=e.byDom[d], p=Math.round(b.c/b.t*100);
    h+='<div class="dom-row"><span class="dom-n">'+esc(shortDom(CERT.domains[d].name))+'</span>'+
      '<span class="dom-bar"><span class="bar '+(p>=75?'ok':p>=60?'warn':'no')+'"><i style="width:'+p+'%"></i></span></span>'+
      '<span class="dom-p">'+p+'%</span></div>';
  });
  h+='</div>';

  const wrong=e.ids.map(id=>CERT.questions.find(x=>x.id===id)).filter(q=>q&&!sameSet(toArr(e.ans[q.id]),ansArr(q)));
  if(wrong.length){
    h+='<div class="card card-pad"><div class="sec-title">'+ICON.weak+'Review — '+wrong.length+' missed</div><div class="stack" style="gap:1rem">';
    wrong.slice(0,25).forEach(q=>{
      h+='<div style="border-left:3px solid var(--no);padding-left:.9rem">'+
        '<div style="font-size:.875rem;font-weight:600;line-height:1.5;margin-bottom:.4rem">'+esc(q.question)+'</div>'+
        '<div style="font-size:.82rem;color:var(--text-2);margin-bottom:.3rem">You chose: <b style="color:var(--no)">'+(toArr(e.ans[q.id]).length?toArr(e.ans[q.id]).map(k=>esc(q.options[k])).join(' + '):'nothing')+'</b></div>'+
        '<div style="font-size:.82rem;color:var(--text-2);margin-bottom:.45rem">Correct: <b style="color:var(--ok)">'+ansArr(q).map(k=>esc(q.options[k])).join(' + ')+'</b></div>'+
        '<div style="font-size:.83rem;color:var(--text-2);line-height:1.6">'+nlbr(explText(q))+'</div></div>';
    });
    if(wrong.length>25) h+='<div style="font-size:.82rem;color:var(--text-3)">…and '+(wrong.length-25)+' more.</div>';
    h+='</div></div>';
  }
  h+='</div><div class="stack"><div class="card card-pad"><div class="sec-title">'+ICON.exam+'History</div>';
  P.history.slice(-8).reverse().forEach(x=>{
    h+='<div class="dom-row"><span class="dom-n">'+new Date(x.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>'+
      '<span class="chip '+(x.score>=PASSNOW()?'ok':'no')+'">'+x.score+'%</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

    const s=P.scores[x.domain];
    return '<div class="card card-pad"><div class="sec-title">Domain '+x.domain+'</div>'+

let pomInt=null;

  const left=p.running?Math.max(0,p.endsAt-Date.now()):p.left*1000;

    '<div style="display:inline-block;position:relative;margin-bottom:1.6rem">'+ringSvg(prog*100,190,11)+
    '<div style="position:absolute;inset:0;display:grid;place-items:center"><div>'+
    '<div class="timer">'+m+':'+String(s).padStart(2,'0')+'</div>'+
    '<div style="font-size:.79rem;color:var(--text-3);font-weight:600;margin-top:.3rem">'+(p.mode==='work'?'FOCUS':'BREAK')+'</div>'+
    '</div></div></div>'+
    '<div class="btn-row" style="justify-content:center">'+
      '<button class="btn btn-pri btn-lg" id="pomToggle">'+(p.running?ICON.pause+'Pause':ICON.play+'Start')+'</button>'+
      '<button class="btn" id="pomReset">'+ICON.reset+'Reset</button>'+
      '<button class="btn" id="pomSwitch">'+(p.mode==='work'?'Switch to break':'Switch to work')+'</button>'+
    '</div></div>'+
    '<div class="stack"><div class="card card-pad"><div class="sec-title">'+ICON.cog+'Durations</div>'+
    '<div class="set-row"><div class="set-i"><div class="set-n">Work</div><div class="set-d">minutes per focus block</div></div>'+
    '<div class="set-c"><input type="number" class="input num" id="workMins" min="1" max="120" value="'+S.workMins+'"></div></div>'+
    '<div class="set-row"><div class="set-i"><div class="set-n">Break</div><div class="set-d">minutes between blocks</div></div>'+
    '<div class="set-c"><input type="number" class="input num" id="breakMins" min="1" max="60" value="'+S.breakMins+'"></div></div></div>'+
    '<div class="card card-pad"><div class="sec-title">'+ICON.check+'Completed</div>'+
    '<div class="stat-v">'+p.done+' <small>blocks</small></div></div></div></div>';
}
function tickPom(){
  const p=S.pom; if(!p.running) return;
  if(Date.now()>=p.endsAt){
    p.running=false; p.done++;
    p.mode = p.mode==='work'?'break':'work';
    p.left=(p.mode==='work'?S.workMins:S.breakMins)*60;
    saveS(); toast(p.mode==='break'?'Focus block complete — take a break':'Break over — back to it');
    if(ui.page==='timer') render();
    return;
  }
  if(ui.page==='timer'){
    const secs=Math.ceil((p.endsAt-Date.now())/1000);
    const el=document.querySelector('.timer');
    if(el) el.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
    const total=(p.mode==='work'?S.workMins:S.breakMins)*60;
    const c=document.querySelector('.ring .fgc');
    if(c){ const r=+c.getAttribute('r'), cc=2*Math.PI*r; c.setAttribute('stroke-dashoffset',cc-cc*(1-secs/total)); }
  }
}


// ═══════════════════════════════════════════════════════════════════
// PBQ LABS — performance-based question engine
// A small Cisco-style IOS interpreter plus four task formats.
// ═══════════════════════════════════════════════════════════════════

// ── Interface name normalisation ─────────────────────────────────────
function normIf(n){
  if(!n) return null;
  let s=String(n).trim().toLowerCase().replace(/\s+/g,'');
  const m=s.match(/^([a-z\-]+)([\d\/\.]+)$/); if(!m) return null;
  const p=m[1], num=m[2];
  let full;
  if(/^(g|gi|gig|gigabitethernet)$/.test(p)) full='GigabitEthernet';
  else if(/^(f|fa|fast|fastethernet)$/.test(p)) full='FastEthernet';
  else if(/^(e|eth|ethernet)$/.test(p)) full='Ethernet';
  else if(/^(te|tengig|tengigabitethernet)$/.test(p)) full='TenGigabitEthernet';
  else if(/^(s|se|serial)$/.test(p)) full='Serial';
  else if(/^(vl|vlan)$/.test(p)) full='Vlan';
  else if(/^(lo|loop|loopback)$/.test(p)) full='Loopback';
  else return null;
  return full+num;
}
function shortIf(n){ return n.replace(/^GigabitEthernet/,'Gi').replace(/^FastEthernet/,'Fa')
  .replace(/^TenGigabitEthernet/,'Te').replace(/^Ethernet/,'Et').replace(/^Serial/,'Se')
  .replace(/^Loopback/,'Lo').replace(/^Vlan/,'Vl'); }
const isIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s)&&s.split('.').every(o=>+o>=0&&+o<=255);

// ── Fresh IOS device state ───────────────────────────────────────────
function newIos(spec){
  const st={ mode:'user', host:spec.host||'Router', curIf:null, curAcl:null, curVlan:null, inLine:false,
    ifaces:{}, vlans:{1:'default'}, routes:[], acls:{},
    secret:null, users:{}, ssh:{version:null,keys:false,domain:null},
    svc:{http:true,telnet:true,pwEncrypt:false},
    vty:{transport:'all',login:null} };
  (spec.ifaces||[]).forEach(n=>{ const k=normIf(n)||n;
    st.ifaces[k]={ip:null,mask:null,shut:true,desc:'',swmode:null,vlan:null,trunkVlans:null,aclIn:null,aclOut:null}; });
  if(spec.kind==='switch') st.kind='switch'; else st.kind='router';
  return st;
}
function iosPrompt(st){
  if(st.mode==='user') return st.host+'>';
  if(st.mode==='priv') return st.host+'#';
  if(st.mode==='if')   return st.host+'(config-if)#';
  if(st.mode==='vlan') return st.host+'(config-vlan)#';
  if(st.mode==='line') return st.host+'(config-line)#';
  if(st.mode==='acl')  return st.host+'(config-ext-nacl)#';
  return st.host+'(config)#';
}

// ── Interpreter. Returns array of {t:text, c:class} ──────────────────
function iosExec(st, raw){
  const out=[]; const say=(t,c)=>out.push({t,c:c||''});
  let line=raw.trim(); if(!line) return out;
  const noPre=/^no\s+/i.test(line);
  const cmd=line.replace(/^no\s+/i,'').trim();
  const w=cmd.split(/\s+/); const w0=(w[0]||'').toLowerCase();
  const bad=()=>say('% Invalid input detected at \'^\' marker.','err');
  const needCfg=()=>say('% This command is only available in configuration mode.','err');

  // ---- help ----
  if(line==='?'||w0==='help'){
    say('Available in this simulator:','dim');
    say('  enable · configure terminal · exit · end','dim');
    say('  hostname · interface · ip address · no shutdown · description','dim');
    say('  vlan · name · switchport mode · switchport access vlan · switchport trunk allowed vlan','dim');
    say('  ip route · ip access-list extended · permit · deny · ip access-group','dim');
    say('  enable secret · username · line vty · login local · transport input · ip ssh version','dim');
    say('  crypto key generate rsa · ip domain-name · service password-encryption','dim');
    say('  show ip interface brief · show ip route · show vlan brief · show access-lists · show run','dim');
    return out;
  }
  // ---- mode movement ----
  // bare "enable" changes mode; "enable secret ..." is a config command handled below
  if((w0==='enable'||w0==='en')&&!/^(sec|pass)/i.test(w[1]||'')){ if(st.mode==='user'){st.mode='priv';} else bad(); return out; }
  if(w0==='disable'){ st.mode='user'; return out; }
  if((w0==='configure'&&/^t/i.test(w[1]||''))||(w0==='conf'&&/^t/i.test(w[1]||''))){
    if(st.mode!=='priv'){ say('% Enter privileged mode first (enable).','err'); return out; }
    st.mode='config'; say('Enter configuration commands, one per line. End with CNTL/Z.','dim'); return out;
  }
  if(w0==='end'){ if(st.mode==='user'||st.mode==='priv') bad(); else st.mode='priv'; return out; }
  if(w0==='exit'){
    if(st.mode==='if'||st.mode==='vlan'||st.mode==='line'||st.mode==='acl'){ st.mode='config'; st.curIf=null; st.curAcl=null; st.curVlan=null; }
    else if(st.mode==='config') st.mode='priv';
    else if(st.mode==='priv') st.mode='user';
    return out;
  }

  // ---- show (priv or user) ----
  if(w0==='show'||w0==='sh'){
    const s1=(w[1]||'').toLowerCase(), s2=(w[2]||'').toLowerCase();
    if(s1==='ip'&&/^int/.test(s2)){
      say('Interface                  IP-Address      OK? Method Status                Protocol');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        const status=f.shut?'administratively down':'up';
        say(pad(k,27)+pad(f.ip||'unassigned',16)+'YES manual '+pad(status,22)+(f.shut?'down':'up')); });
      return out;
    }
    if(s1==='ip'&&/^rou/.test(s2)){
      if(!st.routes.length&&!Object.values(st.ifaces).some(f=>f.ip&&!f.shut)){ say('% No routes.','dim'); return out; }
      say('Codes: C - connected, S - static, S* - candidate default','dim');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        if(f.ip&&!f.shut) say('C        '+f.ip+'/'+maskBits(f.mask)+' is directly connected, '+shortIf(k)); });
      st.routes.forEach(r=>say((r.dest==='0.0.0.0'?'S*       0.0.0.0/0 [1/0] via ':'S        '+r.dest+'/'+maskBits(r.mask)+' [1/0] via ')+r.nh));
      return out;
    }
    if(/^vlan/.test(s1)){
      say('VLAN Name                             Status    Ports');
      Object.keys(st.vlans).forEach(v=>{
        const ports=Object.keys(st.ifaces).filter(k=>String(st.ifaces[k].vlan)===String(v)).map(shortIf).join(', ');
        say(pad(v,5)+pad(st.vlans[v],33)+pad('active',10)+ports); });
      return out;
    }
    if(/^acc/.test(s1)){
      const names=Object.keys(st.acls);
      if(!names.length){ say('% No access lists configured.','dim'); return out; }
      names.forEach(n=>{ say('Extended IP access list '+n);
        st.acls[n].forEach((r,i)=>say('    '+((i+1)*10)+' '+r.raw)); });
      return out;
    }
    if(/^run/.test(s1)||(s1==='running-config')){
      say('Building configuration...','dim'); say('!');
      say('hostname '+st.host);
      if(st.secret) say('enable secret *****');
      if(st.svc.pwEncrypt) say('service password-encryption');
      if(!st.svc.http) say('no ip http server');
      Object.keys(st.users).forEach(u=>say('username '+u+' privilege 15 secret *****'));
      if(st.ssh.domain) say('ip domain-name '+st.ssh.domain);
      if(st.ssh.version) say('ip ssh version '+st.ssh.version);
      say('!');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        say('interface '+k);
        if(f.desc) say(' description '+f.desc);
        if(f.ip) say(' ip address '+f.ip+' '+f.mask);
        if(f.swmode) say(' switchport mode '+f.swmode);
        if(f.vlan) say(' switchport access vlan '+f.vlan);
        if(f.trunkVlans) say(' switchport trunk allowed vlan '+f.trunkVlans);
        if(f.aclIn) say(' ip access-group '+f.aclIn+' in');
        if(f.aclOut) say(' ip access-group '+f.aclOut+' out');
        say(f.shut?' shutdown':' no shutdown'); say('!'); });
      st.routes.forEach(r=>say('ip route '+r.dest+' '+r.mask+' '+r.nh));
      Object.keys(st.acls).forEach(n=>{ say('ip access-list extended '+n);
        st.acls[n].forEach(r=>say(' '+r.raw)); say('!'); });
      say('line vty 0 4');
      if(st.vty.login) say(' login '+st.vty.login);
      if(st.vty.transport!=='all') say(' transport input '+st.vty.transport);
      say('end');
      return out;
    }
    bad(); return out;
  }

  if(w0==='ping'){
    const t=w[1];
    if(!isIp(t)){ bad(); return out; }
    const reachable=Object.values(st.ifaces).some(f=>f.ip&&!f.shut&&sameNet(f.ip,f.mask,t))||st.routes.length>0;
    say(reachable?'!!!!! Success rate is 100 percent (5/5)':'..... Success rate is 0 percent (0/5)', reachable?'ok2':'err');
    return out;
  }
  if(w0==='write'||w0==='copy'){ say('Building configuration... [OK]','ok2'); return out; }
  if(w0==='reload'){ say('% Simulator: reload is disabled. Use Reset lab.','dim'); return out; }
  if(w0==='clear'){ return [{t:'__CLEAR__'}]; }

  // ---- everything below needs config mode ----
  if(st.mode==='user'||st.mode==='priv'){ needCfg(); return out; }

  if(w0==='hostname'){ if(!w[1]){bad();return out;} st.host=w[1]; return out; }

  if(w0==='interface'||w0==='int'){
    const n=normIf(w.slice(1).join(''));
    if(!n){ bad(); return out; }
    if(!st.ifaces[n]){ say('% Interface '+n+' does not exist on this device.','err'); return out; }
    st.curIf=n; st.mode='if'; return out;
  }
  if(w0==='vlan'&&st.mode==='config'){
    const v=w[1]; if(!/^\d+$/.test(v)){bad();return out;}
    if(noPre){ delete st.vlans[v]; return out; }
    if(!st.vlans[v]) st.vlans[v]='VLAN'+String(v).padStart(4,'0');
    st.curVlan=v; st.mode='vlan'; return out;
  }
  if(w0==='name'&&st.mode==='vlan'){ st.vlans[st.curVlan]=w.slice(1).join(' '); return out; }

  if(w0==='ip'&&(w[1]||'').toLowerCase()==='route'){
    const [d,m,nh]=[w[2],w[3],w[4]];
    if(!isIp(d)||!isIp(m)||!isIp(nh)){ bad(); return out; }
    if(noPre){ st.routes=st.routes.filter(r=>!(r.dest===d&&r.mask===m&&r.nh===nh)); return out; }
    st.routes.push({dest:d,mask:m,nh}); return out;
  }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='access-list'){
    if(!/^ext/i.test(w[2]||'')){ say('% This simulator supports extended named ACLs only.','err'); return out; }
    const n=w[3]; if(!n){bad();return out;}
    st.acls[n]=st.acls[n]||[]; st.curAcl=n; st.mode='acl'; return out;
  }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='domain-name'){ st.ssh.domain=w[2]||null; return out; }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='ssh'&&(w[2]||'').toLowerCase()==='version'){ st.ssh.version=w[3]; return out; }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='http'&&(w[2]||'').toLowerCase()==='server'){ st.svc.http=!noPre; return out; }
  if(w0==='crypto'&&/^key/i.test(w[1]||'')){
    if(!st.ssh.domain){ say('% Configure ip domain-name before generating keys.','err'); return out; }
    st.ssh.keys=true; say('The name for the keys will be: '+st.host+'.'+st.ssh.domain,'dim');
    say('% Generating 2048 bit RSA keys ...[OK]','ok2'); return out;
  }
  if(w0==='enable'&&/^sec/i.test(w[1]||'')){ st.secret=w[2]||''; return out; }
  if(w0==='username'){ const u=w[1]; if(!u){bad();return out;} st.users[u]=true; return out; }
  if(w0==='service'&&/^password-enc/i.test(w[1]||'')){ st.svc.pwEncrypt=!noPre; return out; }
  if(w0==='line'){
    if(/^vty/i.test(w[1]||'')){ st.mode='line'; st.inLine=true; return out; }
    st.mode='line'; return out;
  }
  if(st.mode==='line'){
    if(w0==='transport'&&/^in/i.test(w[1]||'')){ st.vty.transport=w.slice(2).join(' ').toLowerCase()||'all'; return out; }
    if(w0==='login'){ st.vty.login=w[1]?w[1].toLowerCase():'password'; return out; }
    if(w0==='password'){ return out; }
    if(w0==='exec-timeout'){ return out; }
  }

  // interface sub-commands
  if(st.mode==='if'){
    const f=st.ifaces[st.curIf];
    if(w0==='ip'&&/^add/i.test(w[1]||'')){
      const ip=w[2], mk=w[3];
      if(!isIp(ip)||!isIp(mk)){ say('% Invalid IP address or mask.','err'); return out; }
      f.ip=ip; f.mask=mk; return out;
    }
    if(w0==='shutdown'){ f.shut=!noPre; return out; }
    if(w0==='description'){ f.desc=w.slice(1).join(' '); return out; }
    if(w0==='switchport'){
      const a=(w[1]||'').toLowerCase();
      if(a==='mode'){ f.swmode=(w[2]||'').toLowerCase(); return out; }
      if(a==='access'&&/^vl/i.test(w[2]||'')){ const v=w[3];
        if(!st.vlans[v]) st.vlans[v]='VLAN'+String(v).padStart(4,'0');
        f.vlan=v; return out; }
      if(a==='trunk'&&/^all/i.test(w[2]||'')&&/^vl/i.test(w[3]||'')){ f.trunkVlans=w[4]; return out; }
      bad(); return out;
    }
    if(w0==='ip'&&/^access-group/i.test(w[1]||'')){
      const n=w[2], dir=(w[3]||'').toLowerCase();
      if(dir==='in') f.aclIn=noPre?null:n; else if(dir==='out') f.aclOut=noPre?null:n; else { bad(); return out; }
      return out;
    }
  }

  // ACL entries
  if(st.mode==='acl'&&(w0==='permit'||w0==='deny')){
    st.acls[st.curAcl].push({act:w0, proto:(w[1]||'').toLowerCase(), raw:cmd.toLowerCase(), parts:w.map(x=>x.toLowerCase())});
    return out;
  }

  bad(); return out;
}
function pad(s,n){ s=String(s); return s.length>=n?s+' ':s+' '.repeat(n-s.length); }
function maskBits(m){ if(!m) return 0; return m.split('.').reduce((a,o)=>a+((+o).toString(2).match(/1/g)||[]).length,0); }
function sameNet(ip,mask,t){
  if(!ip||!mask) return false;
  const n=(a)=>a.split('.').map(Number);
  const [i,m,x]=[n(ip),n(mask),n(t)];
  return i.every((o,k)=>(o&m[k])===(x[k]&m[k]));
}

// ── Checking ─────────────────────────────────────────────────────────
const normAns=v=>String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');
function checkLab(){
  const L=labById(ui.lab), S2=ui.labS;
  let total=0, hit=0; const per={}, miss=[];

  if(L.type==='cli'){
    L.goals.forEach(g=>{ total++; let ok=false; try{ ok=g.check(S2.sh); }catch(e){}
      per[g.id]=ok; if(ok) hit++; else miss.push(g.text); });
  }
  if(L.type==='fields'){
    L.fields.forEach(f=>{ total++;
      const v=normAns(S2.vals[f.id]);
      const acc=(f.accept||[f.answer]).map(normAns);
      const ok=!!v&&acc.includes(v);
      per[f.id]=ok; if(ok) hit++; else miss.push(f.label+' — expected '+(f.show||f.answer)); });
  }
  if(L.type==='order'){
    L.items.forEach((it,i)=>{ total++;
      const ok=S2.order[i]===L.correct[i];
      per[L.correct[i]]=S2.order.indexOf(L.correct[i])===i;
      if(ok) hit++; });
    S2.order.forEach((id,i)=>{ per[id]=(id===L.correct[i]); });
    if(hit<total) miss.push('The sequence is not yet in the correct order — correctly placed steps are shown in green.');
  }
  if(L.type==='match'){
    L.items.forEach(i=>{ total++;
      const ok=S2.match[i.id]===i.target;
      per[i.id]=ok; if(ok) hit++;
      else miss.push('"'+i.text+'" is not in the right category.'); });
  }
  if(L.type==='rules'){
    const rows=S2.vals.rows||[];
    L.rows.forEach((want,i)=>{ total++;
      const got=rows[i]||{};
      const ok=Object.keys(want).every(k=>normAns(got[k])===normAns(want[k]));
      per['row'+i]=ok; if(ok) hit++;
      else miss.push('Rule '+(i+1)+' should be: '+want.act+' '+want.proto+' '+want.src+' → '+want.dst+(want.port?' port '+want.port:'')); });
  }

  const score=total?Math.round(hit/total*100):0;
  S2.res={score,per,miss}; S2.checked=true;

  const rec=labRec(L.id);
  const first=!rec.done&&score===100;
  P.labs[L.id]={ done:rec.done||score===100, best:Math.max(rec.best||0,score), tries:(rec.tries||0)+1, at:Date.now() };
  if(score===100){ P.xp+=first?45:12; bumpStreak(); }
  saveP();
  render();
  toast(score===100?(first?'Lab complete — +45 XP':'Lab complete'):'Score: '+score+'% — check the notes');
}

// ── Terminal execution (updates DOM in place, keeps focus) ───────────
function runLabCmd(text){
  const L=labById(ui.lab), S2=ui.labS;
  const term=document.getElementById('labTerm');
  const add=(t,c)=>{ S2.out.push({t,c:c||''});
    if(term){ const d=document.createElement('div'); if(c) d.className=c; d.textContent=t; term.appendChild(d); } };

  add(iosPrompt(S2.sh)+' '+text,'cmd');
  if(text.trim()){ S2.hist.push(text); S2.hi=S2.hist.length; }
  const res=iosExec(S2.sh,text);
  if(res.length===1&&res[0].t==='__CLEAR__'){
    S2.out=[]; if(term) term.innerHTML='';
  } else res.forEach(l=>add(l.t,l.c));

  if(term) term.scrollTop=term.scrollHeight;
  const p=document.getElementById('labPrompt'); if(p) p.textContent=iosPrompt(S2.sh);
  const g=document.getElementById('labGoals'); if(g){ g.innerHTML=goalsHtml(L,S2); bindLabCheck(); }
}
function bindLabCheck(){ const b=document.getElementById('labCheck'); if(b) b.onclick=checkLab; }

// ── Events ───────────────────────────────────────────────────────────
function bindLabs(){
  document.querySelectorAll('[data-lab]').forEach(el=>el.onclick=()=>{ startLab(el.dataset.lab); render(); });
  const back=document.getElementById('labBack'); if(back) back.onclick=()=>{ ui.lab=null; ui.labS=null; render(); };
  const rst=document.getElementById('labReset'); if(rst) rst.onclick=()=>{ startLab(ui.lab); render(); toast('Lab reset'); };
  bindLabCheck();
  if(!ui.lab) return;
  const L=labById(ui.lab), S2=ui.labS; if(!L) return;

  if(L.type==='cli'){
    const inp=document.getElementById('labCmd');
    const term=document.getElementById('labTerm');
    if(term) term.scrollTop=term.scrollHeight;
    if(inp){
      inp.onkeydown=e=>{
        if(e.key==='Enter'){ const v=inp.value; inp.value=''; runLabCmd(v); e.preventDefault(); }
        else if(e.key==='ArrowUp'){ if(S2.hi>0){ S2.hi--; inp.value=S2.hist[S2.hi]||''; } e.preventDefault(); }
        else if(e.key==='ArrowDown'){ if(S2.hi<S2.hist.length-1){ S2.hi++; inp.value=S2.hist[S2.hi]||''; } else { S2.hi=S2.hist.length; inp.value=''; } e.preventDefault(); }
      };
      setTimeout(()=>inp.focus(),30);
    }
  }
  if(L.type==='fields'){
    document.querySelectorAll('[data-fld]').forEach(el=>{
      const k=el.dataset.fld;
      el.oninput=el.onchange=()=>{ S2.vals[k]=el.value; };
    });
  }
  if(L.type==='order'){
    const move=(id,d)=>{ const i=S2.order.indexOf(id), j=i+d;
      if(i<0||j<0||j>=S2.order.length) return;
      S2.order.splice(j,0,S2.order.splice(i,1)[0]); S2.res=null; render(); };
    document.querySelectorAll('[data-up]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); move(el.dataset.up,-1); });
    document.querySelectorAll('[data-down]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); move(el.dataset.down,1); });
    let dragId=null;
    document.querySelectorAll('[data-ord]').forEach(el=>{
      el.ondragstart=()=>{ dragId=el.dataset.ord; el.classList.add('drag'); };
      el.ondragend=()=>{ el.classList.remove('drag'); document.querySelectorAll('.ord-i').forEach(x=>x.classList.remove('over')); };
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
      el.ondragleave=()=>el.classList.remove('over');
      el.ondrop=e=>{ e.preventDefault();
        const t=el.dataset.ord; if(!dragId||dragId===t) return;
        const from=S2.order.indexOf(dragId), to=S2.order.indexOf(t);
        S2.order.splice(to,0,S2.order.splice(from,1)[0]); S2.res=null; render(); };
    });
  }
  if(L.type==='match'){
    document.querySelectorAll('[data-mi]').forEach(el=>{
      const id=el.dataset.mi;
      el.onclick=()=>{
        if(S2.match[id]){ delete S2.match[id]; S2.sel=null; }
        else S2.sel = S2.sel===id?null:id;
        S2.res=null; render();
      };
      el.ondragstart=()=>{ S2.sel=id; };
    });
    document.querySelectorAll('[data-mt]').forEach(el=>{
      const t=el.dataset.mt;
      el.onclick=()=>{ if(S2.sel){ S2.match[S2.sel]=t; S2.sel=null; S2.res=null; render(); } };
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('hot'); };
      el.ondragleave=()=>el.classList.remove('hot');
      el.ondrop=e=>{ e.preventDefault(); el.classList.remove('hot');
        if(S2.sel){ S2.match[S2.sel]=t; S2.sel=null; S2.res=null; render(); } };
    });
  }
  if(L.type==='rules'){
    document.querySelectorAll('[data-row]').forEach(el=>{
      el.onchange=()=>{ const i=+el.dataset.row, k=el.dataset.k;
        S2.vals.rows[i][k]=el.value; };
    });
  }
}

function settings(){

// ── Sound ────────────────────────────────────────────────────────────
let actx;
function beep(ok){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value=ok?720:280; o.type='sine';
    g.gain.setValueAtTime(.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.22);
    o.start(); o.stop(actx.currentTime+.22);
  }catch(e){}
}

function effTheme(){
  if(S.mode==='system')
    return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  return S.mode==='light'?'light':'dark';
}
function applyLook(){
  S.theme=effTheme();
  const r=document.documentElement;
  r.setAttribute('data-theme',S.theme);
  r.setAttribute('data-scheme',S.scheme||'slate');
  r.style.setProperty('--fs',(S.textSize||16)+'px');
}
function toggleTheme(){
  S.mode = effTheme()==='dark'?'light':'dark';
  applyLook(); saveS(); render();
}
function switchCert(id){
  if(id===CERT.id) return;
  S.active=id; saveS();
  loadCert(id);
  if(S.examDates[id]) CERT.exam=S.examDates[id];
  initUI();
  render();
  toast('Switched to '+CERT.track+' '+CERT.code);
}
async function exportData(){
  const data={ v:4, at:Date.now(), settings:S, progress:{} };
  Object.keys(CERTS).forEach(id=>{ data.progress[id]=lsGet('p_'+id,null); });
  const json=JSON.stringify(data,null,2);
  const filename='cyber-lab-progress-'+todayKey()+'.json';

  // Hosted on claude.ai the page cannot download directly — it asks the viewer,
  // who confirms. Opened as a local file, fall back to an ordinary link.
  let dl=null;
  try{ if(typeof claude!=='undefined'&&claude.use) dl=await claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename,data:json}); toast('Backup saved'); }
    catch(err){
      const c=err&&err.code;
      if(c==='declined') toast('Download cancelled');
      else if(c==='rate_limited') toast('One at a time — try again in a moment');
      else if(c==='too_large') toast('Backup is too large to save');
      else toast('Could not save the backup');
    }
    return;
  }
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded');
}
function importData(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!d.progress) throw 0;
      Object.keys(d.progress).forEach(id=>{ if(CERTS[id]&&d.progress[id]) lsSet('p_'+id,d.progress[id]); });
      if(d.settings) lsSet('settings',d.settings);
      toast('Progress restored'); setTimeout(()=>location.reload(),700);
    }catch(err){ toast('That file could not be read'); }
  };
  r.readAsText(f);
}

// keyboard
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(ui&&ui.confirm){ if(e.key==='Escape'){ ui.confirm=null; render(); } return; }
  if(ui.page==='quiz'&&ui.quiz){
    const k=e.key.toUpperCase();
    if(!ui.quiz.picked&&'ABCDE'.includes(k)&&ui.quiz.q.options[k]){
      const q=ui.quiz.q;
      if(isMulti(q)){ const s=ui.quiz.sel, i=s.indexOf(k); if(i>=0) s.splice(i,1); else s.push(k); render(); }
      else { beep(ansArr(q).includes(k)); answer([k]); }
      e.preventDefault();
    }
    else if(ui.quiz.picked&&(e.key==='Enter'||e.key===' ')){ newQuiz(); render(); e.preventDefault(); }
  }
  if(ui.page==='cards'&&ui.card){
    if(e.key===' '){ ui.cardFlip=!ui.cardFlip; render(); e.preventDefault(); }
    else if(ui.cardFlip&&['1','2','3'].includes(e.key)){ gradeCard(+e.key-1); e.preventDefault(); }
  }
});

applyLook();
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onSys=()=>{ if(S.mode==='system'){ applyLook(); render(); } };
  if(mq.addEventListener) mq.addEventListener('change',onSys); else if(mq.addListener) mq.addListener(onSys);
}
loadCert(S.active);
if(S.examDates[CERT.id]) CERT.exam=S.examDates[CERT.id];
initUI();
render();
pomInt=setInterval(tickPom,1000);
// Exam clock: update the countdown chip in place rather than re-rendering,
// so a click never lands mid-repaint. Only re-render when time runs out.
setInterval(()=>{
  if(ui.page!=='exam'||!P.exam||P.exam.done) return;
  if(!EXMINS()) return;
  const left=Math.max(0,EXMINS()*60000-(Date.now()-P.exam.start));
  if(left<=0){ finishExam(); render(); return; }
  const el=document.querySelector('#examClock');
  if(el){
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    el.textContent=m+':'+String(s).padStart(2,'0');
    el.className='chip'+(m<5?' no':m<15?' warn':'');
  }
},1000);

})();


</script>
</body>
</html>
