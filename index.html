// ═══════════════════════════════════════════════════════════════════════════════
// EVENT BINDING — wire up DOM to state engine
// ═══════════════════════════════════════════════════════════════════════════════

function bindEvents() {
  // ─── Sidebar nav ───
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.onclick = () => {
      const page = el.dataset.page;
      setPage(page);
      if (window.innerWidth <= 900) state.sidebarOpen = false;
    };
  });

  // ─── Brand/logo → dashboard ───
  const brand = document.getElementById('brandBtn');
  if (brand) brand.onclick = () => setPage('dashboard');

  // ─── Mobile drawer ───
  const ham = document.getElementById('hamburger');
  if (ham) ham.onclick = () => { state.sidebarOpen = !state.sidebarOpen; render(); };
  const overlay = document.getElementById('sidebarOverlay');
  if (overlay) {
    overlay.classList.toggle('open', state.sidebarOpen);
    overlay.onclick = () => { state.sidebarOpen = false; render(); };
  }

  // ─── Top pomodoro pill ───
  const topPom = document.getElementById('topPomBtn');
  if (topPom) topPom.onclick = () => setPage('pomodoro');

  // ─── Quick action cards ───
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = () => {
      const action = el.dataset.action;
      if (action === 'quiz') {
        state.weakMode = false; state.reviewMode = false;
        if (el.dataset.domain != null) state.domain = parseInt(el.dataset.domain, 10) || 0;
        state.page = 'quiz';
        initQuizQueue();
        saveAll();
      } else if (action === 'weak') {
        state.page = 'weak';
        render(); saveAll();
      } else if (action === 'startWeakQuiz') {
        state.weakMode = true; state.reviewMode = false;
        state.page = 'quiz';
        initQuizQueue();
        saveAll();
      } else if (action === 'exam') {
        setPage('exam');
      } else if (action === 'pomodoro') {
        setPage('pomodoro');
      } else if (action === 'dashboard') {
        state.weakMode = false; state.reviewMode = false;
        setPage('dashboard');
      } else if (action === 'review') {
        state.weakMode = false; state.reviewMode = true;
        state.page = 'quiz';
        initQuizQueue();
        saveAll();
      }
    };
  });

  // ─── Domain tabs ───
  document.querySelectorAll('[data-setdomain]').forEach(el => {
    el.onclick = () => {
      state.domain = parseInt(el.dataset.setdomain, 10);
      saveAll();
      if (state.page === 'quiz') initQuizQueue();
      else if (state.page === 'flashcards') initCardQueue();
      else render();
    };
  });

  // ─── Quiz options ───
  document.querySelectorAll('[data-option]').forEach(el => {
    el.onclick = () => selectAnswer(el.dataset.option);
  });
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.onclick = submitAnswer;
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = nextQuestion;
  const resetScoreBtn = document.getElementById('resetScoreBtn');
  if (resetScoreBtn) resetScoreBtn.onclick = () => {
    if (confirm('Reset score for current domain?')) resetScore();
  };

  // Bookmark / note buttons (quiz)
  const bm = document.getElementById('bookmarkBtn');
  if (bm) bm.onclick = () => {
    const q = state.currentQuestion;
    if (!q) return;
    state.bookmarks[q.id] = !state.bookmarks[q.id];
    if (!state.bookmarks[q.id]) delete state.bookmarks[q.id];
    saveAll(); render();
  };
  const nb = document.getElementById('noteBtn');
  if (nb) nb.onclick = () => {
    const q = state.currentQuestion;
    if (!q) return;
    state.noteEditing = state.noteEditing === q.id ? null : q.id;
    render();
  };
  const noteSave = document.getElementById('noteSave');
  if (noteSave) noteSave.onclick = () => {
    const targetId = state.noteEditing;
    const inp = document.getElementById('noteInput');
    if (targetId && inp) {
      const val = inp.value.trim();
      if (val) state.notes[targetId] = val;
      else delete state.notes[targetId];
      state.noteEditing = null;
      saveAll(); render();
    }
  };
  const noteCancel = document.getElementById('noteCancel');
  if (noteCancel) noteCancel.onclick = () => { state.noteEditing = null; render(); };

  // ─── Flashcards ───
  const fc = document.getElementById('flashcard');
  if (fc) fc.onclick = (e) => {
    // Don't flip if click was on a button inside note editor
    if (e.target.closest('button') || e.target.closest('textarea')) return;
    state.cardFlipped = !state.cardFlipped;
    render();
  };
  const flipBtn = document.getElementById('flipCardBtn');
  if (flipBtn) flipBtn.onclick = () => { state.cardFlipped = !state.cardFlipped; render(); };
  const nextCardBtn = document.getElementById('nextCardBtn');
  if (nextCardBtn) nextCardBtn.onclick = nextCard;
  const cbm = document.getElementById('cardBookmarkBtn');
  if (cbm) cbm.onclick = (e) => {
    e.stopPropagation();
    const c = state.currentCard;
    if (!c) return;
    state.bookmarks[c.id] = !state.bookmarks[c.id];
    if (!state.bookmarks[c.id]) delete state.bookmarks[c.id];
    saveAll(); render();
  };
  const cnb = document.getElementById('cardNoteBtn');
  if (cnb) cnb.onclick = (e) => {
    e.stopPropagation();
    const c = state.currentCard;
    if (!c) return;
    state.noteEditing = state.noteEditing === c.id ? null : c.id;
    render();
  };

  // ─── Reference ───
  const refSearch = document.getElementById('refSearch');
  if (refSearch) {
    let to;
    refSearch.oninput = (e) => {
      clearTimeout(to);
      to = setTimeout(() => {
        state.searchQuery = e.target.value;
        render();
        const r = document.getElementById('refSearch');
        if (r) { r.focus(); r.setSelectionRange(state.searchQuery.length, state.searchQuery.length); }
      }, 150);
    };
  }
  document.querySelectorAll('[data-topic]').forEach(el => {
    el.onclick = () => {
      state.searchQuery = el.dataset.topic;
      render();
    };
  });
  document.querySelectorAll('[data-ref]').forEach(el => {
    el.onclick = () => {
      const ref = REFERENCES.find(r => r.id === el.dataset.ref);
      if (ref) { state.activeRef = ref; render(); }
    };
  });
  document.querySelectorAll('[data-refdomain]').forEach(el => {
    el.onclick = () => {
      state.refDomain = parseInt(el.dataset.refdomain, 10);
      state.searchQuery = '';
      render();
    };
  });
  const refDomainBack = document.getElementById('refDomainBack');
  if (refDomainBack) refDomainBack.onclick = () => { state.refDomain = null; render(); };
  const refBack = document.getElementById('refBackBtn');
  if (refBack) refBack.onclick = () => { state.activeRef = null; state.noteEditing = null; render(); };
  const rbm = document.getElementById('refBookmarkBtn');
  if (rbm) rbm.onclick = () => {
    const r = state.activeRef;
    if (!r) return;
    state.bookmarks[r.id] = !state.bookmarks[r.id];
    if (!state.bookmarks[r.id]) delete state.bookmarks[r.id];
    saveAll(); render();
  };
  const rnb = document.getElementById('refNoteBtn');
  if (rnb) rnb.onclick = () => {
    const r = state.activeRef;
    if (!r) return;
    state.noteEditing = state.noteEditing === r.id ? null : r.id;
    render();
  };

  // ─── Exam ───
  const examStart = document.getElementById('examStartBtn');
  if (examStart) examStart.onclick = startExam;
  document.querySelectorAll('[data-examopt]').forEach(el => {
    el.onclick = () => answerExam(el.dataset.examopt);
  });
  const examPrev = document.getElementById('examPrev');
  if (examPrev) examPrev.onclick = () => examNav(-1);
  const examNext = document.getElementById('examNext');
  if (examNext) examNext.onclick = () => examNav(1);
  const examFinish = document.getElementById('examFinish');
  if (examFinish) examFinish.onclick = () => {
    const ans = Object.keys(state.exam.answers).length;
    const total = state.exam.questions.length;
    if (ans < total) {
      if (!confirm(`You've only answered ${ans} of ${total} questions. Finish anyway?`)) return;
    }
    finishExam();
  };
  document.querySelectorAll('[data-jump]').forEach(el => {
    el.onclick = () => jumpExam(parseInt(el.dataset.jump, 10));
  });
  const examPauseToggle = document.getElementById('examPauseToggle');
  if (examPauseToggle) examPauseToggle.onclick = () => {
    if (state.exam && state.exam.paused) resumeExam(); else pauseExam();
  };
  const examAbandon = document.getElementById('examAbandon');
  if (examAbandon) examAbandon.onclick = () => {
    if (confirm('Abandon this exam? All progress will be lost.')) abandonExam();
  };
  const examNew = document.getElementById('examNewBtn');
  if (examNew) examNew.onclick = () => { stopExamClock(); state.exam = null; render(); };

  // ─── Pomodoro ───
  const pomStartWork = document.getElementById('pomStartWorkBtn');
  if (pomStartWork) pomStartWork.onclick = () => pomStart('work');
  const pomStartBreak = document.getElementById('pomStartBreakBtn');
  if (pomStartBreak) pomStartBreak.onclick = () => pomStart('break');
  const pomPauseBtn = document.getElementById('pomPauseBtn');
  if (pomPauseBtn) pomPauseBtn.onclick = pomPause;
  const pomResumeBtn = document.getElementById('pomResumeBtn');
  if (pomResumeBtn) pomResumeBtn.onclick = pomResume;
  const pomStopBtn = document.getElementById('pomStopBtn');
  if (pomStopBtn) pomStopBtn.onclick = pomStop;

  const pomWorkInput = document.getElementById('pomWorkInput');
  if (pomWorkInput) pomWorkInput.onchange = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v > 0 && v <= 120) {
      state.settings.workMins = v;
      if (state.pom.mode === 'idle') state.pom.remaining = v * 60;
      saveAll(); render();
    }
  };
  const pomBreakInput = document.getElementById('pomBreakInput');
  if (pomBreakInput) pomBreakInput.onchange = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v > 0 && v <= 60) { state.settings.breakMins = v; saveAll(); }
  };

  // ─── Bookmarks list ───
  document.querySelectorAll('[data-bookmark]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-unbookmark]')) return;
      const id = el.dataset.bookmark;
      const type = el.dataset.bktype;
      jumpToItem(id, type);
    };
  });
  document.querySelectorAll('[data-unbookmark]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      delete state.bookmarks[el.dataset.unbookmark];
      saveAll(); render();
    };
  });

  // ─── Notes list ───
  document.querySelectorAll('[data-noteitem]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-deletenote]')) return;
      const id = el.dataset.noteitem;
      const type = el.dataset.noteitemtype;
      jumpToItem(id, type);
    };
  });
  document.querySelectorAll('[data-deletenote]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.deletenote;
      delete state.notes[id];
      saveAll(); render();
    };
  });

  // ─── Settings ───
  const soundToggle = document.getElementById('soundToggle');
  if (soundToggle) soundToggle.onclick = () => {
    state.settings.soundEnabled = !state.settings.soundEnabled;
    if (state.settings.soundEnabled) playSound('correct');
    saveAll(); render();
  };
  document.querySelectorAll('#soundPackSeg button').forEach(b => {
    b.onclick = () => {
      state.settings.soundPack = b.dataset.pack;
      playSound('correct');
      saveAll(); render();
    };
  });
  const dailyGoalInput = document.getElementById('dailyGoalInput');
  if (dailyGoalInput) dailyGoalInput.onchange = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v >= 5 && v <= 500) { state.dailyGoal = v; saveAll(); }
  };
  const workMinsInput = document.getElementById('workMinsInput');
  if (workMinsInput) workMinsInput.onchange = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v > 0 && v <= 120) {
      state.settings.workMins = v;
      if (state.pom.mode === 'idle') state.pom.remaining = v * 60;
      saveAll();
    }
  };
  const breakMinsInput = document.getElementById('breakMinsInput');
  if (breakMinsInput) breakMinsInput.onchange = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v > 0 && v <= 60) { state.settings.breakMins = v; saveAll(); }
  };
  const weakMixToggle = document.getElementById('weakMixToggle');
  if (weakMixToggle) weakMixToggle.onclick = () => {
    state.settings.weakSilentMix = !state.settings.weakSilentMix;
    saveAll(); render();
  };

  // Reset all data buttons
  ['resetAllBtn', 'resetAllBtn2'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.onclick = () => {
      if (confirm('Reset ALL data — progress, scores, bookmarks, notes, history, exam? This cannot be undone.')) {
        Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k));
        location.reload();
      }
    };
  });

  // ─── Keyboard shortcuts (skip if typing) ───
  document.onkeydown = (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') return;
    if (e.key === 'Escape') {
      if (state.sidebarOpen) { state.sidebarOpen = false; render(); }
      return;
    }
    if (state.page === 'quiz' && state.currentQuestion) {
      if (!state.answerRevealed) {
        if (['1','A','a'].includes(e.key)) selectAnswer('A');
        else if (['2','B','b'].includes(e.key)) selectAnswer('B');
        else if (['3','C','c'].includes(e.key)) selectAnswer('C');
        else if (['4','D','d'].includes(e.key)) selectAnswer('D');
        else if (e.key === 'Enter' && state.selectedAnswer) submitAnswer();
      } else if (e.key === 'Enter' || e.key === 'ArrowRight') nextQuestion();
    } else if (state.page === 'flashcards' && state.currentCard) {
      if (e.key === ' ') { e.preventDefault(); state.cardFlipped = !state.cardFlipped; render(); }
      else if (e.key === 'ArrowRight' || e.key === 'Enter') nextCard();
    }
  };
}

// Helper — jump to source item (used by bookmarks/notes list)
function jumpToItem(id, type) {
  if (type === 'question') {
    const q = QUESTIONS.find(x => x.id === id);
    if (q) {
      state.weakMode = false; state.reviewMode = false;
      state.domain = q.domain;
      state.questionQueue = [q];
      state.currentQuestion = null;
      state.page = 'quiz';
      nextQuestion();
      saveAll();
    }
  } else if (type === 'card') {
    const c = FLASHCARDS.find(x => x.id === id);
    if (c) {
      state.domain = c.domain;
      state.cardQueue = [c];
      state.currentCard = null;
      state.page = 'flashcards';
      nextCard();
      saveAll();
    }
  } else if (type === 'ref') {
    const r = REFERENCES.find(x => x.id === id);
    if (r) {
      state.activeRef = r;
      state.page = 'reference';
      saveAll(); render();
    }
  }
}

// ─── Page transition helper ───
function setPage(key) {
  if (key === 'weak') {
    // Sidebar's "Weak Spots" entry → show the dedicated landing page (not auto-start)
    state.page = 'weak';
  } else {
    if (key !== 'quiz') { state.weakMode = false; state.reviewMode = false; }
    state.page = key;
    if (key !== 'reference') state.activeRef = null;
    // Topics always opens on the clean 5-domain overview
    state.refDomain = null;
    if (key === 'reference') { state.activeRef = null; state.searchQuery = ''; }
  }
  state.noteEditing = null;
  saveAll();
  if (key === 'quiz') initQuizQueue();
  else if (key === 'flashcards') initCardQueue();
  else render();
}

// ═══════════════════════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════════════════════

// Initialize quiz queue if landing on quiz page
if (state.page === 'quiz') {
  initQuizQueue();
} else if (state.page === 'flashcards') {
  initCardQueue();
} else {
  render();
}

// Resume Pomodoro if it was running when page closed
// (We don't auto-resume the interval — user has to click Resume —
//  but we do restore the remaining time correctly)
if (state.pom && state.pom.runningSince) {
  // It was paused effectively — clear runningSince to keep it paused on reload
  state.pom.runningSince = null;
}

// Auto-pause an in-progress exam on reload so closing the tab/browser
// (e.g. stepping away at work) never burns exam time. The user resumes
// manually when ready.
if (state.exam && !state.exam.finished) {
  if (!state.exam.paused) {
    state.exam.pausedRemainingMs = Math.max(0, state.exam.endTs - Date.now());
    state.exam.paused = true;
  }
  render();
}

// Save once on load to migrate any defaulted fields
saveAll();

})();
</script>
</body>
</html>
