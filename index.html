{id:"s2_22",domain:2,question:"A mobile device management report flags several corporate Android devices that have been rooted by their users to install applications from outside the official store. Which TWO risks does this MOST directly introduce? (Select TWO)",options:{A:"Cellular carrier billing becomes unencrypted",B:"The device's screen lock is permanently disabled",C:"The device becomes unable to connect to corporate Wi-Fi networks",D:"The device's security sandbox and permission model can be bypassed by installed applications",E:"Applications from unvetted sources may contain malware that the store's review would have caught"},answer:["D", "E"],lead:"Rooting or jailbreaking removes the operating system's integrity protections, so an application can escape its sandbox, read other applications' data, and defeat the controls MDM relies on. Sideloading then bypasses the vetting that catches a substantial fraction of malicious applications before distribution.",why:{A:"A, B, and C are all fabricated consequences.",B:"A, B, and C are all fabricated consequences.",C:"A, B, and C are all fabricated consequences."},note:"Rooted devices connect to networks normally, which is precisely why they are dangerous — they look ordinary."},
{id:"s2_23",domain:2,question:"A cloud security review finds an object storage bucket containing customer records configured to allow public read access, with no evidence of exploitation. Which vulnerability class is this, and which control would MOST reliably prevent recurrence?",options:{A:"Race condition; prevented by adding locking to the deployment pipeline",B:"Supply chain vulnerability; prevented by vendor security questionnaires",C:"Cryptographic vulnerability; prevented by rotating the storage encryption keys",D:"Misconfiguration; prevented by policy-as-code guardrails that block public access at the account level"},answer:"D",lead:"Publicly exposed storage is the archetypal cloud misconfiguration. The durable fix is preventive and automated: account-level public access blocks and policy-as-code that rejects non-compliant infrastructure before it deploys, so the safe configuration does not depend on any individual remembering it.",why:{A:"A, B, and C name unrelated vulnerability classes.",B:"A, B, and C name unrelated vulnerability classes.",C:"A, B, and C name unrelated vulnerability classes."},note:"Note that encryption at rest would not have helped here, because the service decrypts transparently for anyone authorized — and public access made everyone authorized."},
{id:"s2_24",domain:2,question:"An organization must reduce the blast radius of a ransomware infection that begins on a single user workstation. Which control MOST directly limits lateral movement across the environment?",options:{A:"Network segmentation with east-west filtering between user and server zones",B:"Deploying an additional perimeter firewall",C:"Increasing the frequency of full backups",D:"Requiring longer passwords for all users"},answer:"A",lead:"Ransomware's damage is largely a function of how far it can spread. Segmenting the network and filtering east-west traffic means a compromised workstation cannot freely reach file servers, hypervisors, and backup infrastructure. Combined with disabling unnecessary SMB and RDP between endpoints, this is what turns an enterprise event into a single-host event.",why:{B:"Inspects north-south traffic while the spread here is internal.",C:"Is essential for recovery but does not limit spread, and unsegmented backups are frequently encrypted too.",D:"Helps against credential attacks but not against malware already executing with a user's rights."}},
{id:"s2_25",domain:2,question:"A security team wants to ensure that only explicitly approved executables can run on servers in a regulated environment, regardless of whether malware signatures exist. Which control provides this?",options:{A:"An application deny list of known malicious binaries",B:"Application allow listing",C:"Signature-based antivirus with daily updates",D:"A host-based intrusion detection system"},answer:"B",lead:"Allow listing operates on a default-deny principle: anything not explicitly approved cannot execute. That means novel and unsigned malware is blocked without any prior knowledge of it, which is why it is so effective on servers where the software inventory is stable and changes rarely.",why:{A:"A and C are both default-allow — they block only what is already known to be bad, so new variants execute freely.",C:"A and C are both default-allow — they block only what is already known to be bad, so new variants execute freely.",D:"Detects and alerts on suspicious host activity but does not prevent execution."}},
{id:"s2_26",domain:2,question:"An attacker in a hotel lobby uses a device to read and duplicate an employee's proximity badge from inside their bag, then uses the clone to enter the building. Which attack occurred, and which mitigation is MOST appropriate?",options:{A:"Shoulder surfing; mitigated by privacy screens and awareness training",B:"Skimming of magnetic stripe data; mitigated by chip-based cards",C:"RFID cloning; mitigated by moving to cryptographically authenticated smart cards and shielded badge holders",D:"Tailgating; mitigated by an access control vestibule"},answer:"C",lead:"Legacy proximity cards transmit a static identifier with no authentication, so any reader in range can capture and replay it. The fix is a credential that performs mutual cryptographic authentication with the reader, making the exchange non-replayable, plus shielded sleeves that block the read entirely.",why:{A:"Involves observing credentials visually.",B:"Describes magnetic stripe capture, which requires physical contact rather than a contactless read.",D:"Involves following an authorized person through a door."}},
{id:"s2_27",domain:2,question:"An application accepts a 512-byte user-supplied string into a 64-byte stack buffer without bounds checking, allowing an attacker to overwrite the saved return address and redirect execution. Which TWO mitigations MOST directly reduce the exploitability of this class of flaw? (Select TWO)",options:{A:"Data execution prevention marking the stack non-executable",B:"Enabling full disk encryption on the server",C:"Requiring multifactor authentication for the application",D:"Address space layout randomization",E:"Increasing the buffer size to 1024 bytes"},answer:["A", "D"],lead:"ASLR randomizes the memory layout at each execution, so the attacker cannot reliably predict the address to jump to. DEP or NX marks the stack as non-executable, so injected shellcode placed there cannot run. Together they raise exploitation cost substantially — though the real fix is bounds checking in the code itself.",why:{B:"B and C are valuable controls that have no effect on memory corruption exploitation once code is running.",C:"B and C are valuable controls that have no effect on memory corruption exploitation once code is running.",E:"Merely moves the boundary, and an attacker simply sends more data."}},
{id:"s2_28",domain:2,question:"A vulnerability allows an attacker to store a malicious script in a forum post's body, which then executes in the browser of every user who later views that post. Which specific attack variant is this?",options:{A:"DOM-based cross-site scripting",B:"Reflected cross-site scripting",C:"Cross-site request forgery",D:"Stored cross-site scripting"},answer:"D",lead:"Stored, or persistent, XSS occurs when the injected script is saved on the server and served to every subsequent visitor. It is the most damaging XSS variant because it requires no interaction from the victim beyond visiting a legitimate page and can affect large numbers of users, including administrators.",why:{A:"Executes entirely in the browser through client-side script manipulating the DOM, with the payload often never reaching the server.",B:"Requires the victim to click a crafted link, and the payload is echoed back in that single response.",C:"Forces a request rather than executing script."}},
{id:"s2_29",domain:2,question:"A standard user on a Windows workstation exploits an unquoted service path to have a malicious executable launched by a service running as SYSTEM. Which attack occurred, and which hardening step would have prevented it?",options:{A:"Privilege escalation; prevented by correcting service path quoting and restricting write access to directories in the path",B:"Lateral movement; prevented by network segmentation",C:"Persistence; prevented by disabling scheduled tasks",D:"Credential harvesting; prevented by enabling Credential Guard"},answer:"A",lead:"Gaining higher privileges than originally held is privilege escalation, and this is a well-known local variant. When a service's executable path contains spaces and is not quoted, Windows attempts each partial path in turn; if a user can write a file at one of those locations, it executes with the service's privileges. The fix is quoting the path and ensuring unprivileged users cannot write into any directory along it.",why:{B:"Moves between hosts, and this attack stays on one machine.",C:"Maintains access over time rather than raising privilege.",D:"Targets stored credentials specifically."}},
{id:"s2_30",domain:2,question:"During an incident, analysts determine that an attacker intercepted and modified traffic between employees and an internal application by responding to broadcast name resolution requests with their own address. Which attack category is this, and what is a key mitigation?",options:{A:"Password spraying; mitigated by account lockout thresholds",B:"On-path attack; mitigated by disabling legacy broadcast name resolution protocols and enforcing mutual TLS",C:"Denial of service; mitigated by rate limiting broadcast traffic",D:"Replay attack; mitigated by session timeouts"},answer:"B",lead:"Answering broadcast name resolution requests — LLMNR and NBT-NS poisoning — inserts the attacker between client and server, which is an on-path (formerly man-in-the-middle) position enabling interception, modification, and credential capture. Disabling those legacy protocols removes the mechanism, and mutual TLS ensures a client will not accept an impostor even if it is redirected.",why:{A:"A, C, and D describe different attack classes; nothing here denies service, guesses passwords, or resubmits captured traffic.",C:"A, C, and D describe different attack classes; nothing here denies service, guesses passwords, or resubmits captured traffic.",D:"A, C, and D describe different attack classes; nothing here denies service, guesses passwords, or resubmits captured traffic."}},
{id:"s2_31",domain:2,question:"A newly hired database administrator is granted access to production financial data on their first day as part of a standard onboarding template that has not been reviewed in three years. Which risk does this MOST directly illustrate?",options:{A:"A supply chain risk arising from third-party access",B:"A misconfiguration in the identity provider's federation settings",C:"Excessive privilege granted through unreviewed role definitions, violating least privilege",D:"Shadow IT introduced by an unapproved application"},answer:"C",lead:"Least privilege requires that access be limited to what the role genuinely needs, and role definitions must be reviewed as job functions change. Stale templates accumulate permissions over time, so new hires inherit far more access than their work requires, expanding both insider risk and the value of a compromised account.",why:{A:"Involves external parties.",B:"Would be a technical fault in federation configuration rather than an entitlement design problem.",D:"Involves unsanctioned technology, which is not described."}},
{id:"s2_32",domain:2,question:"A manufacturing plant operates control systems running an operating system that reached end of support four years ago. The vendor certification prohibits upgrading. Which approach BEST manages this risk?",options:{A:"Accept the risk and document it without additional controls",B:"Connect the systems to the corporate domain so group policy can harden them",C:"Apply the latest operating system patches from an unofficial community source",D:"Isolate the systems on a dedicated segment with strict unidirectional controls and compensating monitoring"},answer:"D",lead:"When a system cannot be patched or replaced, the answer is to shrink its exposure and increase visibility around it. Strong network isolation, tightly controlled and ideally unidirectional data flows, host allow listing where possible, and dedicated monitoring form a compensating control set that keeps the system usable while limiting what an attacker could reach.",why:{A:"Leaves a known, exploitable exposure untreated.",B:"Increases connectivity and exposure rather than reducing it.",C:"Introduces unvetted code and voids the vendor certification the stem says must be maintained."}},
{id:"s2_33",domain:2,question:"A vulnerability assessment finds that several network devices still use the manufacturer's documented administrative credentials. Why is this considered a critical finding rather than a low-severity one?",options:{A:"Default credentials are published publicly and are among the first things automated attacks attempt",B:"Default credentials disable the device's built-in encryption",C:"Default credentials prevent the device from generating audit logs",D:"Default credentials cannot be changed without replacing the device firmware"},answer:"A",lead:"Vendor default credentials appear in freely available documentation and in curated lists used by scanning tools and botnets. Exploiting them requires no skill, no exploit code, and no vulnerability — just a connection. Devices exposed with defaults are typically compromised within hours of being reachable.",why:{B:"B, C, and D invent technical consequences.",C:"B, C, and D invent technical consequences.",D:"B, C, and D invent technical consequences."},note:"The severity comes entirely from how trivially and how quickly the credentials are abused."},
{id:"s2_34",domain:2,question:"Which distinction correctly separates a worm from a virus?",options:{A:"A worm requires a host file; a virus spreads independently over the network",B:"A worm self-propagates across networks without user action; a virus requires a host file and user execution",C:"A worm encrypts data for ransom; a virus only destroys data",D:"A worm operates only in memory; a virus only operates on disk"},answer:"B",lead:"The defining difference is propagation. A worm exploits network-reachable vulnerabilities or services to copy itself to new hosts autonomously, which is why worm outbreaks spread at machine speed. A virus attaches to a file or program and spreads only when a user runs or shares that host object.",why:{A:"Reverses the definitions.",C:"Describes payloads, which either type can carry.",D:"Describes execution location, which does not distinguish the two categories."}},
{id:"s2_35",domain:2,question:"A code review discovers an API key hardcoded in an application's source repository, which is mirrored to a public code hosting service. Which TWO actions should be taken, in the correct priority? (Select TWO)",options:{A:"Move the secret to a managed secrets vault referenced at runtime",B:"Delete the commit containing the key and consider the matter resolved",C:"Change the key's permissions to read-only and leave it in the code",D:"Revoke and rotate the exposed key immediately",E:"Add the repository to a private visibility setting and retain the key"},answer:["A", "D"],lead:"Once a secret reaches a public repository it must be considered compromised, because automated scanners harvest such repositories within minutes. Revocation and rotation is the urgent first action. The durable fix is removing secrets from source entirely, injecting them at runtime from a secrets manager with access control and audit logging.",why:{B:"Is dangerously incomplete, since git history, forks, caches, and scrapers retain the value.",C:"C and E both keep a known-exposed credential in service.",E:"C and E both keep a known-exposed credential in service."}},
{id:"s2_36",domain:2,question:"Employees at a company are targeted by an attacker who registers the domain rnicrosoft.com, relying on the visual similarity between rn and m in common fonts. Which technique is this, and which control detects it MOST reliably?",options:{A:"Brand impersonation via display name spoofing; detected by DMARC enforcement",B:"Domain hijacking; detected by registrar transfer lock monitoring",C:"Typosquatting with a homoglyph domain; detected by email gateways scoring lookalike domains against corporate and vendor names",D:"Pharming; detected by DNSSEC validation on the corporate resolver"},answer:"C",lead:"Registering a visually confusable domain is typosquatting using homoglyphs. Because the attacker owns the domain, SPF, DKIM, and DMARC will all pass legitimately for it — the message is authentic, just not from who the reader thinks. Detection therefore relies on similarity scoring against known brand and vendor names, plus flagging newly registered domains.",why:{A:"Is a real technique, but DMARC does not help when the sending domain genuinely belongs to the attacker.",B:"Takes over an existing registration.",D:"Redirects users who typed the correct name."}},
{id:"s2_37",domain:2,question:"An analyst observes a server generating a sustained 40 Gbps of inbound traffic consisting of large UDP responses from thousands of distinct source addresses on port 123, none of which the server requested. Which attack is this?",options:{A:"A DNS cache poisoning campaign against the server's resolver",B:"A SYN flood exhausting the server's connection backlog",C:"An application-layer denial of service targeting the web tier",D:"A reflected and amplified distributed denial of service using NTP"},answer:"D",lead:"Unsolicited large UDP responses arriving from many sources on a service port indicates reflection: the attacker spoofed the victim's address in requests sent to open NTP servers, whose replies are far larger than the requests. Port 123 and the amplification ratio make NTP the specific vector. Mitigation is upstream scrubbing, since the volume overwhelms the link itself.",why:{A:"Corrupts DNS records rather than flooding.",B:"Uses TCP SYN packets and consumes state rather than bandwidth.",C:"Uses low-volume, legitimate-looking requests to exhaust application resources."}},
{id:"s2_38",domain:2,question:"An organization decommissions a set of storage arrays that held regulated health data. Which action BEST ensures the data cannot be recovered, and what documentation is required?",options:{A:"Cryptographic erasure or physical destruction, with a certificate of destruction retained",B:"Deleting all files and emptying the recycle bin, with a ticket closure note",C:"Overwriting the partition table, with a photograph of the racks",D:"A quick format of each volume, with an inventory update recorded"},answer:"A",lead:"Sanitization must render data unrecoverable, not merely unreferenced. Cryptographic erasure destroys the encryption keys so ciphertext becomes permanently unreadable, and physical destruction such as shredding or degaussing removes the media entirely. Regulated environments additionally require a certificate of destruction as evidence for auditors, identifying each device and the method used.",why:{B:"B, C, and D all leave the underlying data blocks intact and trivially recoverable with forensic tooling, and none produce the evidentiary record required.",C:"B, C, and D all leave the underlying data blocks intact and trivially recoverable with forensic tooling, and none produce the evidentiary record required.",D:"B, C, and D all leave the underlying data blocks intact and trivially recoverable with forensic tooling, and none produce the evidentiary record required."}},
{id:"s2_39",domain:2,question:"A user reports that their browser homepage changed, unfamiliar toolbars appeared, and they now see pop-up advertisements. Investigation shows software that also logs visited URLs and transmits them to a third party. Which malware classification BEST fits?",options:{A:"A logic bomb",B:"Spyware",C:"A rootkit",D:"Ransomware"},answer:"B",lead:"Spyware covertly gathers information about a user's activity and transmits it without consent. Adware behavior such as injected advertisements and browser hijacking frequently accompanies it, and the URL logging and exfiltration described is the defining spyware characteristic.",why:{A:"Waits for a trigger condition before executing a payload.",C:"Conceals its presence at a privileged level, which is not what is described here — this malware is highly visible.",D:"Encrypts data and demands payment."}},
{id:"s3_01",domain:3,question:"An inline security appliance protecting a hospital's patient monitoring network must be configured for its behavior during a hardware failure. Clinical staff state that loss of monitoring data could endanger patients. Which failure mode should be selected, and what is the tradeoff?",options:{A:"Fail-closed, accepting that monitoring stops in order to preserve confidentiality",B:"Fail-open, because it also preserves confidentiality during the outage",C:"Fail-open, accepting that traffic passes uninspected during the failure in order to preserve availability",D:"Fail-closed, because availability is always the highest priority in healthcare"},answer:"C",lead:"Fail-open (fail-safe for availability) lets traffic pass unfiltered if the device fails, keeping the service running at the cost of temporarily losing inspection. Where loss of the service creates a safety risk to human life, availability outweighs the inspection gap, and the gap is managed with redundancy and heightened monitoring.",why:{A:"Correctly describes fail-closed but chooses it against the stated safety requirement.",B:"Is self-contradictory, since fail-open explicitly stops enforcing protection.",D:"Reaches the right priority but names the mode that contradicts it."}},
{id:"s3_02",domain:3,question:"An organization needs to protect a public-facing application against SQL injection, cross-site scripting, and malicious HTTP request patterns, with rules written against HTTP semantics. Which device type is purpose-built for this?",options:{A:"A stateful Layer 4 firewall",B:"A forward proxy with content filtering",C:"A unified threat management appliance",D:"A web application firewall"},answer:"D",lead:"A WAF operates at Layer 7 with an understanding of HTTP structure — methods, headers, parameters, cookies, and body content — so it can identify injection and scripting payloads inside otherwise well-formed requests, and can virtually patch a known application flaw.",why:{A:"Makes decisions on addresses, ports, and connection state and cannot see inside the HTTP payload.",B:"Mediates OUTBOUND user requests rather than protecting an inbound application.",C:"Bundles many functions in one appliance but is generalized rather than application-aware to the depth required."}},
{id:"s3_03",domain:3,question:"A company with a largely remote workforce wants network security controls and access policy enforced consistently in the cloud rather than by backhauling all traffic to headquarters, combining SD-WAN with cloud-delivered security services. Which architecture is being described?",options:{A:"Secure Access Service Edge",B:"A software-defined data center fabric",C:"A screened subnet with a bastion host",D:"A traditional hub-and-spoke VPN concentrator design"},answer:"A",lead:"SASE converges network connectivity (SD-WAN) with security functions delivered from the cloud — secure web gateway, CASB, firewall as a service, and zero trust network access — enforced at a point of presence near the user. That removes the performance penalty of hairpinning all traffic through a central data center while keeping policy uniform.",why:{B:"Describes data center networking rather than distributed user access.",C:"Is a perimeter design for hosting exposed services.",D:"Is exactly the backhaul model the scenario rejects."}},
{id:"s3_04",domain:3,question:"Which statement correctly distinguishes load balancing from clustering as availability mechanisms?",options:{A:"They are interchangeable terms for the same technology",B:"Load balancing distributes requests across independent nodes; clustering coordinates nodes that share state and can take over a workload",C:"Clustering distributes requests across nodes; load balancing provides failover for a single application instance",D:"Load balancing requires shared storage; clustering does not"},answer:"B",lead:"A load balancer sits in front of multiple independent servers and spreads incoming requests among them, improving both capacity and availability. A cluster is a group of coordinated nodes that share state or storage and provide failover, so a workload can resume on another node — often with the cluster presenting a single logical service.",why:{A:"Ignores a meaningful architectural difference frequently tested.",C:"Swaps the definitions.",D:"Reverses the shared storage relationship."}},
{id:"s3_05",domain:3,question:"A financial services firm must ensure that customer data belonging to EU residents is stored and processed only within EU borders, regardless of where its cloud provider has capacity. Which concept governs this requirement, and which control enforces it?",options:{A:"Data classification; enforced through labeling policies applied at creation",B:"Data masking; enforced through views that hide sensitive fields",C:"Data sovereignty; enforced through region pinning and geographic restrictions in the cloud provider's configuration",D:"Data retention; enforced through lifecycle policies that expire objects"},answer:"C",lead:"Data sovereignty is the principle that data is subject to the laws of the jurisdiction where it physically resides. Meeting it requires technical enforcement — pinning storage and compute to specific regions, disabling cross-region replication, and restricting administrative access by geography — not merely a contractual promise.",why:{A:"A, B, and D are all legitimate data protection concepts, but none of them constrain the physical location where data lives and is processed.",B:"A, B, and D are all legitimate data protection concepts, but none of them constrain the physical location where data lives and is processed.",D:"A, B, and D are all legitimate data protection concepts, but none of them constrain the physical location where data lives and is processed."}},
{id:"s3_06",domain:3,question:"An organization needs to protect sensitive data while it is actively being processed in memory, such that even a compromised host operating system or a cloud administrator cannot read it. Which technology addresses this?",options:{A:"TLS 1.3 with perfect forward secrecy",B:"Transparent database encryption",C:"Full disk encryption with a TPM-sealed key",D:"A trusted execution environment providing confidential computing"},answer:"D",lead:"Data in use is the hardest of the three states to protect, because processing normally requires plaintext in memory. A trusted execution environment or secure enclave creates a hardware-isolated region that even the hypervisor and operating system cannot inspect, which is the basis of confidential computing.",why:{A:"Protects data in transit.",B:"Protects at rest and likewise decrypts for anyone with database access.",C:"Protects data at rest and decrypts transparently once the system is running."}},
{id:"s3_07",domain:3,question:"An organization's disaster recovery strategy places its alternate site 15 miles from the primary data center. A regional review finds both sites lie within the same flood plain and are served by the same power grid. Which principle has been violated?",options:{A:"Geographic dispersion, since correlated regional events can affect both sites simultaneously",B:"Capacity planning, since the alternate site cannot carry full production load",C:"Platform diversity, since both sites use the same hardware vendor",D:"Risk transference, since no insurance policy covers flood damage"},answer:"A",lead:"Geographic dispersion requires enough separation that a single regional event — flood, earthquake, hurricane, grid failure, or a wide-area network outage — cannot affect both sites. Fifteen miles inside the same flood plain and on the same grid provides protection against a building-level event only, which is a much narrower threat model than the plan assumes.",why:{B:"B, C, and D name real resilience concepts, but the specific defect described is shared exposure to the same regional hazards.",C:"B, C, and D name real resilience concepts, but the specific defect described is shared exposure to the same regional hazards.",D:"B, C, and D name real resilience concepts, but the specific defect described is shared exposure to the same regional hazards."}},
{id:"s3_08",domain:3,question:"A business continuity team wants to validate its recovery plan by having stakeholders discuss their roles and walk through a hypothetical ransomware scenario in a conference room, without touching production systems. Which test type is this?",options:{A:"A simulation",B:"A tabletop exercise",C:"A parallel processing test",D:"A failover test"},answer:"B",lead:"A tabletop exercise is a discussion-based walkthrough in which participants talk through their responsibilities and decisions against a scenario. It is low cost, carries no operational risk, and is excellent for surfacing gaps in roles, communication paths, and assumptions.",why:{A:"Injects realistic conditions and has participants perform real actions, going further than discussion.",C:"Brings recovery systems online alongside production to compare results without cutting over.",D:"Actually shifts production to the alternate environment, which is the most rigorous and most disruptive test."}},
{id:"s3_09",domain:3,question:"Which statement correctly describes the difference between a snapshot and a backup for protecting a virtual machine?",options:{A:"They are equivalent, and either satisfies a recovery point objective",B:"A snapshot is stored offsite by definition, while a backup is always local",C:"A snapshot captures point-in-time state usually on the same storage and is not a substitute for a backup stored independently",D:"A snapshot protects against storage array failure, while a backup does not"},answer:"C",lead:"A snapshot records the state of a VM or volume at a moment in time, typically as a delta on the same underlying storage. It is excellent for fast rollback after a failed change, but if the array, the datastore, or the hypervisor is lost — or if ransomware reaches the storage — the snapshots are lost with the original. A backup writes an independent copy to separate media or a separate system.",why:{A:"Encourages a dangerous and common misunderstanding.",B:"Reverses the typical locations.",D:"Is exactly backwards, since a same-array snapshot does not survive array loss."}},
{id:"s3_10",domain:3,question:"A data center has both a UPS and a diesel generator. Which statement correctly describes the role of each during a utility power failure?",options:{A:"Both start simultaneously and share the load equally",B:"The generator carries the load instantly; the UPS provides long-term power",C:"The UPS conditions power only and cannot carry load during an outage",D:"The UPS carries the load instantly for a short period; the generator assumes the load once started and can run for hours"},answer:"D",lead:"The two are complementary and sized for different time horizons. A UPS transfers to battery with no perceptible interruption but sustains the load for only minutes. A generator takes time to start and stabilize, so the UPS bridges that gap, after which the generator carries the facility for as long as fuel is available.",why:{A:"Misdescribes the sequence, since the transfer switch moves load rather than sharing it.",B:"Reverses the timing characteristics.",C:"Ignores the UPS's primary purpose, though conditioning is a genuine secondary benefit."}},
{id:"s3_11",domain:3,question:"A company deploys an application as serverless functions on a cloud platform. Under the shared responsibility model, which responsibility remains with the customer?",options:{A:"The security of the function's code, its dependencies, and its IAM permissions",B:"Physical security of the data center hosting the compute",C:"Maintaining the runtime's language interpreter version patches",D:"Patching the underlying operating system that executes the function"},answer:"A",lead:"Serverless shifts more responsibility to the provider than IaaS or PaaS, but the customer still owns everything they author: the function code itself, third-party libraries pulled in as dependencies, the data it handles, and — critically — the IAM role attached to the function, which is a very common source of over-permissioned access.",why:{B:"B, C, and D all fall to the provider in a serverless model, which is precisely its operational appeal.",C:"B, C, and D all fall to the provider in a serverless model, which is precisely its operational appeal.",D:"B, C, and D all fall to the provider in a serverless model, which is precisely its operational appeal."}},
{id:"s3_12",domain:3,question:"An ICS environment controls physical processes and cannot tolerate unplanned restarts or latency. Which TWO architectural decisions BEST reflect the constraints of this environment? (Select TWO)",options:{A:"Segment the OT network from IT with a tightly controlled data diode or gateway",B:"Apply operating system patches automatically on release across all controllers",C:"Enable aggressive IPS blocking on the process control segment",D:"Join all controllers to the corporate Active Directory domain for management",E:"Deploy passive monitoring sensors on a tap rather than inline blocking devices"},answer:["A", "E"],lead:"Operational technology prioritizes availability and safety above confidentiality, and many controllers cannot be restarted on demand or tolerate added latency. Passive monitoring gives visibility with zero risk of interrupting a process, and strict segmentation between OT and IT — often through a data diode enforcing one-way flow — limits exposure without touching the controllers themselves.",why:{B:"Ignores vendor certification and change windows and risks unplanned outages.",C:"Introduces a device that can drop legitimate control traffic on a false positive.",D:"Extends the IT attack surface directly into the process network."}},
{id:"s3_13",domain:3,question:"A security architect must choose between EAP-TLS and PEAP-MSCHAPv2 for enterprise wireless authentication. Which statement correctly captures the key security difference?",options:{A:"PEAP-MSCHAPv2 authenticates the client with a certificate and the server with a password",B:"EAP-TLS uses client certificates for mutual authentication with no password to steal or crack",C:"EAP-TLS requires no PKI, making it simpler to deploy securely",D:"PEAP-MSCHAPv2 provides stronger cryptography because it uses a TLS tunnel"},answer:"B",lead:"EAP-TLS requires a certificate on both the client and the server, so both sides authenticate cryptographically and no password ever crosses the link. That removes credential theft, phishing, and offline cracking from the threat model. Its cost is the PKI needed to issue and manage client certificates.",why:{A:"Inverts which side presents what.",C:"Is backwards, as PKI is EAP-TLS's main deployment burden.",D:"Is misleading, since PEAP's tunnel protects a password-derived exchange that remains crackable if the client is tricked into trusting a rogue server certificate."}},
{id:"s3_14",domain:3,question:"An organization is designing its network security zones. Where should a jump server used for administering production systems be placed, and how should access to it be controlled?",options:{A:"In the screened subnet alongside public-facing web servers for external accessibility",B:"In the same subnet as the production servers it administers, with password authentication",C:"In a dedicated management zone, reachable only through MFA with all sessions recorded",D:"On the general user LAN so administrators can reach it from their workstations directly"},answer:"C",lead:"A jump server is a chokepoint that concentrates administrative access, which makes it an extremely high-value target. It belongs in an isolated management zone, hardened, with multifactor authentication required to enter and full session recording so every administrative action is attributable and reviewable.",why:{A:"Places the most sensitive access path in the most exposed zone.",B:"Eliminates the segmentation benefit and uses weak authentication for the most privileged path.",D:"Makes it reachable from the segment most likely to host a compromised endpoint."}},
{id:"s3_15",domain:3,question:"A company classifies a document set as containing information whose disclosure would cause severe harm, restricted to a named list of individuals. Which classification label is MOST appropriate, and what control follows from it?",options:{A:"Public; access unrestricted with integrity controls only",B:"Sensitive; access granted to any authenticated user with a business justification",C:"Private; access granted to all employees within the organization",D:"Restricted; access granted individually on a need-to-know basis with mandatory logging"},answer:"D",lead:"Restricted, sometimes called critical or highly confidential, is the strictest tier, reserved for data whose exposure would cause severe damage. It drives the tightest controls: explicit per-individual authorization, need-to-know enforcement, encryption, and audit logging of every access.",why:{A:"Is data intended for release.",B:"B and C both grant far broader access than a named-individual restriction permits, and the specific detail in the stem is that access is limited to an enumerated list.",C:"B and C both grant far broader access than a named-individual restriction permits, and the specific detail in the stem is that access is limited to an enumerated list."}},
{id:"s3_16",domain:3,question:"An architect is evaluating whether to run a critical workload as containers or as full virtual machines. Which statement accurately describes the security tradeoff?",options:{A:"Containers share the host kernel, so a kernel vulnerability can affect all containers, while VMs are isolated by the hypervisor",B:"Neither provides isolation, so the choice is purely operational",C:"Containers provide stronger isolation than VMs because they are smaller",D:"VMs share the host kernel, making them less isolated than containers"},answer:"A",lead:"Containers are process-level isolation sharing one kernel. A kernel exploit or a container escape therefore has the potential to affect every container on the host. Virtual machines each run their own kernel behind a hypervisor boundary, which is a stronger isolation guarantee — at the cost of more resource overhead and slower startup.",why:{B:"Ignores a genuine and well-defined difference in the isolation boundary.",C:"Confuses image size with isolation strength.",D:"Reverses which technology shares the kernel."}},
{id:"s3_17",domain:3,question:"An organization purchases cyber insurance to cover a portion of potential breach response costs. Which risk management strategy does this represent, and what does it NOT accomplish?",options:{A:"Risk avoidance; it does not eliminate the underlying threat",B:"Risk transference; it does not reduce the likelihood of a breach or transfer reputational damage and regulatory liability",C:"Risk mitigation; it does not address residual risk",D:"Risk acceptance; it does not require executive approval"},answer:"B",lead:"Insurance shifts financial consequence to a third party, which is the definition of transference. What it cannot transfer is the probability of the event, the loss of customer trust, or the organization's regulatory and legal accountability — those remain entirely with the organization, which is why insurance supplements controls rather than substituting for them.",why:{A:"Would mean ceasing the activity entirely.",C:"Would mean applying controls to reduce likelihood or impact.",D:"Would mean formally choosing to bear the risk with no action."}},
{id:"s3_18",domain:3,question:"A retailer runs its primary application in one cloud provider and maintains a warm standby in a second, unrelated provider. Which TWO risks does this multi-cloud strategy MOST directly address? (Select TWO)",options:{A:"SQL injection vulnerabilities in the application code",B:"Weak password policies for customer accounts",C:"A provider-wide outage affecting an entire region or service",D:"Vendor lock-in constraining future negotiating position and portability",E:"Insider threat from the retailer's own administrators"},answer:["C", "D"],lead:"Running across independent providers means a control-plane failure, regional outage, or account-level problem at one provider does not take the business offline. It also preserves portability, since the application must be built to run in more than one environment, which limits dependence on any single vendor's proprietary services.",why:{A:"A, B, and E all travel with the application and the organization regardless of where the workload runs — multi-cloud replicates them rather than mitigating them.",B:"A, B, and E all travel with the application and the organization regardless of where the workload runs — multi-cloud replicates them rather than mitigating them.",E:"A, B, and E all travel with the application and the organization regardless of where the workload runs — multi-cloud replicates them rather than mitigating them."}},
{id:"s3_19",domain:3,question:"A security team must monitor traffic on a critical link with absolute certainty that the monitoring device cannot affect production traffic, even if the device fails completely. Which deployment satisfies this?",options:{A:"A SPAN session on the adjacent switch",B:"An inline IDS operating in detection-only mode",C:"A passive network tap providing a copy of the traffic to the sensor",D:"An inline IPS configured to fail-open"},answer:"C",lead:"A passive tap splits the signal optically or electrically and delivers a copy to the sensor. Because the sensor is not in the forwarding path at all, its failure — including total power loss — cannot affect the production link. That is the strongest possible guarantee.",why:{A:"Is out of band and reasonable, but mirrored frames can be dropped under switch load and the SPAN session consumes switch resources.",B:"Is inline by definition despite not blocking.",D:"Is inline, and while fail-open reduces risk it still introduces a device into the path with latency and potential failure modes."}},
{id:"s3_20",domain:3,question:"An architecture review recommends replacing a monolithic application with microservices. Which security consideration becomes MORE important as a direct result of this change?",options:{A:"Protecting a single large database from SQL injection",B:"Preventing physical access to the one server hosting the application",C:"Ensuring the single deployment artifact is signed before release",D:"Securing service-to-service communication and managing many more east-west authentication boundaries"},answer:"D",lead:"Decomposing a monolith converts internal function calls into network calls between independently deployed services. Each of those becomes an authentication and authorization boundary and a potential interception point, which is why service meshes, mutual TLS, and workload identity become central concerns in microservices architectures.",why:{A:"A, B, and C describe concerns of the monolithic model the organization is moving away from — one database, one artifact, one host.",B:"A, B, and C describe concerns of the monolithic model the organization is moving away from — one database, one artifact, one host.",C:"A, B, and C describe concerns of the monolithic model the organization is moving away from — one database, one artifact, one host."}},
{id:"s3_21",domain:3,question:"A financial institution requires that if its authentication service becomes unavailable, no user is granted access rather than allowing unauthenticated entry. Which configuration implements this, and what is the operational consequence?",options:{A:"Fail-closed, accepting that a service outage denies all access until restored",B:"Fail-closed, accepting that access continues with cached credentials indefinitely",C:"Fail-open, because financial systems must prioritize availability",D:"Fail-open, accepting that access continues without verification"},answer:"A",lead:"Fail-closed, or fail-secure, denies access when the enforcing control cannot function. For systems where unauthorized access is more damaging than downtime — financial transactions, vaults, sensitive data stores — this is the correct posture, and the operational cost is a hard outage that must be addressed with redundancy in the authentication tier itself.",why:{B:"Names the right mode but describes fail-open behavior in its explanation.",C:"C and D describe the opposite behavior and the opposite priority.",D:"C and D describe the opposite behavior and the opposite priority."}},
{id:"s3_22",domain:3,question:"An organization must retain the ability to restore any file to any point within the last 24 hours, not merely to the nightly backup. Which technology provides this?",options:{A:"Nightly snapshots retained for 30 days",B:"Continuous data protection with journaling of every write",C:"Synchronous replication to a secondary array",D:"Weekly full backups supplemented by nightly differentials"},answer:"B",lead:"Continuous data protection journals each write, so recovery can target essentially any moment rather than a scheduled backup boundary. That drives the recovery point objective toward zero, which is what a requirement for any point in the last 24 hours demands.",why:{A:"A and D both restore only to discrete scheduled points, leaving hours of potential data loss between them.",C:"Keeps a real-time mirror, but corruption or ransomware is replicated to the secondary immediately — replication is not recovery.",D:"A and D both restore only to discrete scheduled points, leaving hours of potential data loss between them."}},
{id:"s3_23",domain:3,question:"An enterprise deploys hundreds of IoT sensors that cannot run endpoint agents, use a vendor cloud service, and receive firmware updates irregularly. Which architectural approach BEST manages the resulting risk?",options:{A:"Require each sensor to authenticate to the corporate domain before joining",B:"Disable the sensors' network connectivity and collect data manually",C:"Place them on a dedicated segment with egress restricted to the vendor's required destinations and monitor that traffic",D:"Place them on the corporate user VLAN so existing network controls apply"},answer:"C",lead:"IoT devices typically cannot be hardened, patched on demand, or instrumented, so the control must live in the network around them. A dedicated segment with an explicit egress allow list to only the destinations the vendor requires, plus monitoring of that constrained traffic, contains a compromised device and makes anomalous behavior easy to spot.",why:{A:"Is generally impossible on constrained devices with no domain support.",B:"Defeats the purpose of the deployment and is not a security architecture.",D:"Places unmanageable devices next to user workstations and corporate resources."}},
{id:"s3_24",domain:3,question:"Two data centers each run a full copy of an application, both actively serving user traffic, with a global load balancer distributing requests. Which availability model is this, and what is its principal advantage over the alternative?",options:{A:"Active-active; it eliminates the need for data replication between sites",B:"Active-passive; the secondary site remains idle until needed, reducing cost",C:"Active-passive; it provides higher aggregate throughput than active-active",D:"Active-active; capacity is used continuously and failover is immediate with no idle standby"},answer:"D",lead:"In active-active both sites carry production load, so there is no idle investment and no cold-start delay when one site fails — the remaining site simply absorbs more traffic. The complexity cost is real: state and data must be kept consistent across sites, and each site must have enough headroom to carry the full load alone.",why:{A:"Is false and in fact understates active-active's replication demands.",B:"Correctly describes active-passive but does not match the scenario.",C:"Reverses which model provides more throughput."}},
{id:"s3_25",domain:3,question:"A company is choosing between a site-to-site IPsec VPN and a TLS-based remote access solution for connecting a branch office network to headquarters. Which factor MOST strongly favors IPsec here?",options:{A:"It operates at the network layer, transparently carrying all protocols between the two subnets",B:"It requires no key management because it uses pre-shared secrets",C:"It provides per-application access control by default",D:"It traverses restrictive firewalls more easily because it uses TCP 443"},answer:"A",lead:"IPsec secures traffic at Layer 3, so once the tunnel is established every protocol between the two networks passes transparently without application awareness. That is exactly what a site-to-site connection needs, since arbitrary internal services must work as though the sites were directly connected.",why:{B:"Is misleading; pre-shared keys are still key material requiring management, and certificates are preferred.",C:"Describes TLS VPN and ZTNA behavior, since IPsec grants broad network-layer reachability.",D:"Describes TLS VPNs, which is one of their main advantages."}},
{id:"s3_26",domain:3,question:"Which statement BEST describes why zero trust network access is often preferred over a traditional VPN for third-party contractor access?",options:{A:"ZTNA encrypts traffic while a VPN does not",B:"ZTNA grants access to specific applications rather than placing the contractor on the network",C:"ZTNA requires no authentication, simplifying contractor onboarding",D:"ZTNA operates at Layer 2, providing better performance"},answer:"B",lead:"A traditional VPN gives a network-layer foothold, and from there the user — or malware on their unmanaged device — can attempt to reach anything reachable at Layer 3. ZTNA brokers access per application after evaluating identity, device posture, and context, so a contractor sees only the specific applications authorized and nothing else exists from their perspective.",why:{A:"Is false, since VPNs encrypt by definition.",C:"Is the opposite of zero trust, which verifies explicitly and continuously.",D:"Misstates the layer and the rationale."}},
{id:"s3_27",domain:3,question:"A backup strategy stores encrypted copies offsite. During a recovery test the team discovers they cannot decrypt the backups because the key management server was itself only backed up to the same encrypted repository. Which planning failure does this illustrate?",options:{A:"Inadequate offsite storage capacity for the retention period",B:"Insufficient backup frequency relative to the recovery point objective",C:"A circular dependency in recovery, where restoring requires a component that can only be restored from the backup itself",D:"Failure to encrypt backups in transit as well as at rest"},answer:"C",lead:"Recovery planning must account for dependencies, and the classic failure is a component required to perform the restore being recoverable only from that restore. Encryption keys, the backup catalog, directory services, and DNS all fall into this category and must be preserved independently — commonly in escrow, offline, or in a separate system with its own recovery path.",why:{A:"A, B, and D are real backup concerns, but none of them describe the specific dependency loop that made the data unrecoverable.",B:"A, B, and D are real backup concerns, but none of them describe the specific dependency loop that made the data unrecoverable.",D:"A, B, and D are real backup concerns, but none of them describe the specific dependency loop that made the data unrecoverable."}},
{id:"s3_28",domain:3,question:"A security team must reduce an application server's attack surface. Which set of actions MOST directly accomplishes this?",options:{A:"Deploy an additional intrusion detection sensor on the same segment",B:"Increase logging verbosity and extend log retention",C:"Schedule more frequent vulnerability scans of the host",D:"Remove unnecessary software, disable unused services and ports, and delete default accounts"},answer:"D",lead:"Attack surface is the sum of exposed, reachable, and exploitable entry points. Every removed package, closed port, disabled service, and deleted default account eliminates a potential entry point outright, which is qualitatively stronger than detecting or monitoring an attack against it.",why:{A:"A, B, and C all improve visibility into attacks against the surface but leave the surface itself unchanged.",B:"A, B, and C all improve visibility into attacks against the surface but leave the surface itself unchanged.",C:"A, B, and C all improve visibility into attacks against the surface but leave the surface itself unchanged."},note:"They are detective, while the question asks for reduction."},
{id:"s3_29",domain:3,question:"An architect must select a security control for data that must be provably unaltered but never needs to be recovered in its original form, such as stored password verifiers. Which method is appropriate, and why?",options:{A:"Hashing, because it is one-way and any change produces a different digest",B:"Data masking, because it preserves format while hiding content",C:"Tokenization, because the original can be retrieved from the vault",D:"Symmetric encryption, because it is fast and reversible when needed"},answer:"A",lead:"Hashing is deliberately irreversible, which is exactly the right property when the original value should never be recoverable. Verification is performed by hashing the presented input and comparing digests, and because any modification changes the digest completely, it also proves integrity.",why:{B:"B, C, and D are all reversible or recoverable by design, which is a liability rather than a feature for password storage — anything that can be reversed can be reversed by an attacker who obtains the key or the vault.",C:"B, C, and D are all reversible or recoverable by design, which is a liability rather than a feature for password storage — anything that can be reversed can be reversed by an attacker who obtains the key or the vault.",D:"B, C, and D are all reversible or recoverable by design, which is a liability rather than a feature for password storage — anything that can be reversed can be reversed by an attacker who obtains the key or the vault."}},
{id:"s3_30",domain:3,question:"A cloud architecture uses infrastructure as code with automated pipeline deployment. Which security benefit is MOST specific to this approach?",options:{A:"Encryption keys are automatically rotated by the pipeline without configuration",B:"Security configuration is reviewed and tested as code before deployment, and drift can be detected and corrected automatically",C:"Vulnerability scanning becomes unnecessary because deployments are automated",D:"The cloud provider assumes responsibility for application-layer security"},answer:"B",lead:"When infrastructure is defined declaratively, its security properties become reviewable artifacts. Policy-as-code checks can reject non-compliant definitions before they ever deploy, and because the declared state is authoritative, any manual change that causes drift can be detected and automatically reverted.",why:{A:"Is a separate capability that must be explicitly configured.",C:"Is false, since automation deploys vulnerable images just as reliably as secure ones.",D:"Misstates the shared responsibility model, which automation does not change."}},
{id:"s3_31",domain:3,question:"An organization's continuity plan must account for the loss of key personnel as well as systems. Which element of capacity planning addresses this, and how?",options:{A:"Infrastructure capacity planning, through expanded data center floor space",B:"Technology capacity planning, through additional server headroom",C:"People capacity planning, through cross-training, documented procedures, and identified successors for critical roles",D:"Financial capacity planning, through a larger insurance policy"},answer:"C",lead:"Continuity depends on people as much as on systems. If only one engineer knows how to execute a recovery procedure, that person is a single point of failure. Cross-training, runbooks written so someone other than the author can follow them, and named successors for critical roles are what make the plan executable when key staff are unavailable.",why:{A:"A, B, and D address compute, facilities, and financial exposure, none of which restore the operational knowledge required to execute a recovery.",B:"A, B, and D address compute, facilities, and financial exposure, none of which restore the operational knowledge required to execute a recovery.",D:"A, B, and D address compute, facilities, and financial exposure, none of which restore the operational knowledge required to execute a recovery."}},
{id:"s3_32",domain:3,question:"A security zone design places an internal database server behind an application tier, which is itself behind a web tier in a screened subnet. Which principle does this layered placement implement, and what does it achieve?",options:{A:"Non-repudiation, so database actions can be attributed to individuals",B:"Separation of duties, so different administrators manage each tier",C:"Least privilege, so the database enforces per-user permissions",D:"Defense in depth through segmentation, so compromise of the exposed tier does not directly expose the data tier"},answer:"D",lead:"A tiered architecture forces an attacker to compromise each layer in sequence, with a filtering boundary between each. The web tier can reach only the application tier on defined ports, and only the application tier can reach the database, so a compromised web server provides no direct path to the data.",why:{A:"A, B, and C are all valid principles, but each describes a control over identities and permissions rather than the network placement and boundary enforcement the stem describes.",B:"A, B, and C are all valid principles, but each describes a control over identities and permissions rather than the network placement and boundary enforcement the stem describes.",C:"A, B, and C are all valid principles, but each describes a control over identities and permissions rather than the network placement and boundary enforcement the stem describes."}},
{id:"s4_01",domain:4,question:"A user logs into a corporate identity provider once and is then able to access a partner organization's cloud application without entering credentials again. The partner receives a signed XML assertion describing the user. Which protocol is in use?",options:{A:"SAML",B:"Kerberos",C:"RADIUS",D:"OAuth 2.0"},answer:"A",lead:"SAML is the XML-based standard for exchanging authentication and authorization assertions between an identity provider and a service provider, and it is the dominant protocol for browser-based federated single sign-on across organizational boundaries. The signed XML assertion is the definitive clue.",why:{B:"Provides SSO within a single realm using tickets, not cross-organization assertions.",C:"Authenticates network access with a client-server protocol, not browser federation.",D:"Is an authorization delegation framework using JSON tokens, and it does not by itself authenticate a user — OpenID Connect adds that layer on top."}},
{id:"s4_02",domain:4,question:"A photo application asks a user for permission to post to their social media account. The user approves, and the application receives a token allowing it to post but not to read private messages or change the password. Which framework is being used, and what does it provide?",options:{A:"Kerberos, providing mutual authentication using tickets",B:"OAuth 2.0, providing delegated authorization scoped to specific permissions",C:"LDAP, providing directory lookup of the user's attributes",D:"SAML, providing federated authentication between the two services"},answer:"B",lead:"OAuth exists to let a user grant a third-party application limited access to their resources without sharing their password. The scope of the issued token defines exactly what the application may do, and it can be revoked independently — which is why the application can post but cannot read messages.",why:{A:"Authenticates principals within a realm.",C:"Queries directory information.",D:"Handles authentication assertions, and OAuth is commonly and incorrectly described as an authentication protocol for exactly this reason."}},
{id:"s4_03",domain:4,question:"A government system labels every document Confidential, Secret, or Top Secret, and the operating system itself prevents a user cleared only to Secret from opening a Top Secret file, regardless of what the file's owner wants. Which access control model is in use?",options:{A:"Attribute-based access control",B:"Role-based access control",C:"Mandatory access control",D:"Discretionary access control"},answer:"C",lead:"MAC enforces access centrally based on labels — a subject's clearance compared against an object's classification — and the decision is made by the system, not the data owner. Even the file's creator cannot grant access beyond what policy permits, which is the defining characteristic.",why:{A:"Evaluates multiple attributes and policies, which is more flexible but not the label-and-clearance model described.",B:"Grants permissions through job roles.",D:"Lets the owner decide who gets access, which the stem explicitly rules out."}},
{id:"s4_04",domain:4,question:"A policy states that a contractor may access the finance application only from a corporate-managed device, only during business hours, and only while their project assignment is active. Which access control model supports all three conditions natively?",options:{A:"Role-based access control",B:"Discretionary access control",C:"Mandatory access control",D:"Attribute-based access control"},answer:"D",lead:"ABAC evaluates policies against attributes of the subject, the resource, the action, and the environment — device compliance, time of day, and project status are all attributes. That combination is what ABAC is designed for, and it is the most granular and context-aware of the models.",why:{A:"Assigns permissions by role and cannot express device state or time conditions without bolting on additional mechanisms.",B:"Leaves decisions to resource owners.",C:"Uses classification labels and clearances."}},
{id:"s4_05",domain:4,question:"A system requires users to enter a password and then answer a security question about their first pet. Does this constitute multifactor authentication, and why?",options:{A:"No, because both are something you know, which is a single factor",B:"Yes, because two distinct credentials are required",C:"Yes, because the security question is something you are",D:"No, because security questions are never a valid authentication method"},answer:"A",lead:"Multifactor requires credentials from DIFFERENT categories: something you know, something you have, something you are, and contextually somewhere you are. A password and a security answer are both knowledge, so an attacker who obtains one through phishing or research is likely to obtain the other by the same means. This is multi-step, not multifactor.",why:{B:"Is the common misconception the question tests.",C:"Misclassifies knowledge as an inherence factor.",D:"Overstates the case; security questions are weak but they are a recognized knowledge factor."}},
{id:"s4_06",domain:4,question:"An organization implements privileged access management. Administrators no longer hold standing domain admin rights; instead they request elevation, which is granted for 60 minutes and automatically revoked. Which capability is this, and what risk does it reduce?",options:{A:"Attestation, reducing the accumulation of unnecessary entitlements over time",B:"Just-in-time permissions, reducing the window in which a compromised admin account is useful",C:"Federation, reducing the number of identity stores to manage",D:"Password vaulting, reducing the risk of credentials being written down"},answer:"B",lead:"Just-in-time elevation eliminates standing privilege. Because the account holds elevated rights only during an approved, time-boxed window, an attacker who compromises it outside that window gets an ordinary user, dramatically shrinking the value of the credential and the opportunity for lateral movement.",why:{A:"Is periodic access review, which addresses privilege creep rather than standing privilege.",C:"Links identity systems.",D:"Stores and rotates credentials, which is a related PAM capability but not what the stem describes."}},
{id:"s4_07",domain:4,question:"During an audit, it is discovered that an employee who transferred from finance to marketing 14 months ago retains full access to the financial reporting system. Which control failure does this represent, and which process would have caught it?",options:{A:"Excessive password age; caught by an expiration policy",B:"Improper deprovisioning; caught by an offboarding checklist",C:"Privilege creep; caught by periodic access reviews and attestation by resource owners",D:"Weak identity proofing; caught by stronger enrollment verification"},answer:"C",lead:"Privilege creep is the accumulation of entitlements as a person changes roles without old access being removed. The specific control is recertification: periodically requiring resource owners to affirm that each person still needs their access, with anything unattested automatically revoked.",why:{A:"Addresses credential age rather than entitlements.",B:"Applies when someone leaves the organization, whereas this employee is still employed.",D:"Governs verification of identity at enrollment."}},
{id:"s4_08",domain:4,question:"Which password policy set BEST reflects current NIST guidance for user-chosen passwords?",options:{A:"Require exactly eight characters with at least one symbol and monthly rotation",B:"Require frequent expiration every 30 days with mandatory complexity of four character classes",C:"Require security questions in addition to a short complex password",D:"Require substantial minimum length, screen against known-breached password lists, and avoid mandatory periodic expiration"},answer:"D",lead:"Modern guidance favors length over composition rules, because complexity requirements push users toward predictable substitutions and passwords written down. Screening against breach corpora blocks the passwords attackers actually try. Forced periodic rotation is discouraged unless compromise is suspected, since it drives incremental, guessable changes.",why:{A:"A and B both apply the older model that research has shown weakens rather than strengthens real-world password quality.",B:"A and B both apply the older model that research has shown weakens rather than strengthens real-world password quality.",C:"Adds a second weak knowledge factor rather than improving the primary credential."}},
{id:"s4_09",domain:4,question:"A company deploys FIDO2 security keys and eliminates passwords for its workforce. Which attack class does this MOST directly defeat, and why?",options:{A:"Credential phishing, because the key's response is cryptographically bound to the legitimate origin",B:"Denial of service, because authentication requests are rate limited by the key",C:"Privilege escalation, because keys enforce role boundaries in the operating system",D:"SQL injection, because no credentials are stored in the database"},answer:"A",lead:"A FIDO2 authenticator performs a challenge-response signed against the specific origin requesting it. A phishing site at a lookalike domain presents a different origin, so the key simply will not produce a valid response. There is also no shared secret to steal, replay, or crack.",why:{B:"B, C, and D describe unrelated attack classes.",C:"B, C, and D describe unrelated attack classes.",D:"B, C, and D describe unrelated attack classes."},note:"The distinctive property of FIDO2 is origin binding, which is what makes it phishing resistant."},
{id:"s4_10",domain:4,question:"An identity provider must verify that a new remote employee is genuinely the person they claim to be before issuing credentials. Which process is this, and which method provides the strongest assurance?",options:{A:"Authorization; strongest through role assignment in the directory",B:"Identity proofing; strongest through verified government-issued document validation combined with a liveness-checked biometric comparison",C:"Federation; strongest through trusting the employee's personal email provider",D:"Attestation; strongest through a manager approving the account request"},answer:"B",lead:"Identity proofing establishes that a real-world person corresponds to the digital identity being created, and it happens before any credential is issued. Higher assurance levels require validating an authoritative document and binding it to the applicant, typically by comparing a live capture against the document photo with liveness detection to defeat replay.",why:{A:"Determines what an authenticated identity may do.",C:"Trusts an external provider that performed no meaningful proofing itself.",D:"Confirms that access is still appropriate for an existing identity."}},
{id:"s4_11",domain:4,question:"An organization automates user provisioning so that creating a record in the HR system triggers account creation, group membership assignment, and mailbox setup. Which TWO security benefits are the MOST direct results? (Select TWO)",options:{A:"The organization no longer needs periodic access reviews",B:"Entitlements are granted consistently from a defined template, eliminating ad hoc over-permissioning",C:"Deprovisioning becomes equally automatic when the HR record is terminated, closing the orphaned account gap",D:"Multifactor authentication becomes unnecessary for provisioned accounts",E:"The HR system inherits the security controls of the directory"},answer:["B", "C"],lead:"Driving identity lifecycle from an authoritative HR source makes both directions deterministic. Joiners receive exactly the entitlements their role defines rather than whatever an administrator copies from a colleague, and leavers are disabled immediately rather than lingering as orphaned accounts — historically one of the most exploited gaps in enterprises.",why:{A:"Is false, since role definitions themselves still drift and require review.",D:"D and E are unrelated claims that automation does not deliver.",E:"D and E are unrelated claims that automation does not deliver."}},
{id:"s4_12",domain:4,question:"A security team must grant a vendor's support engineer temporary access to a production server. Which PAM approach BEST limits risk while allowing the work to proceed?",options:{A:"Add the vendor's account to the domain administrators group for the week",B:"Share the existing local administrator password and change it after the engagement",C:"Issue an ephemeral credential valid for the session, brokered through a vault with full session recording",D:"Create a permanent named account for the vendor with administrator rights"},answer:"C",lead:"Ephemeral credentials exist only for the duration of the session and are never known to the user, since the vault injects them. Combined with session recording, this provides accountability for exactly what was done, and there is no credential left behind to be reused, shared, or leaked.",why:{A:"Grants far broader rights than the task requires and for far longer.",B:"Relies on a manual rotation that is frequently forgotten and provides no attribution while shared.",D:"Leaves standing privilege in place indefinitely."}},
{id:"s4_13",domain:4,question:"A vulnerability scanner reports a CVSS base score of 9.8 for a flaw on an internal test server that is powered off, unreachable from any network, and holds no data. A separate finding scores 6.5 on an Internet-facing server processing customer payments. How should remediation be prioritized?",options:{A:"Neither, because remediation should wait for the next scheduled patch cycle",B:"Both simultaneously, because CVSS scores above 6.0 are all critical",C:"The 9.8 finding first, because CVSS base score is the authoritative ranking",D:"The 6.5 finding first, because environmental context and asset criticality modify real risk"},answer:"D",lead:"The CVSS base score measures the intrinsic characteristics of a vulnerability, independent of any environment. Real risk requires combining it with exposure, asset criticality, data sensitivity, and existing compensating controls — which is exactly what the CVSS environmental metric group is for. An unreachable, powered-off, dataless host presents almost no risk regardless of base score.",why:{A:"Defers a live risk on a payment system.",B:"Ignores prioritization entirely.",C:"Treats the base score as the whole answer, which is the single most common vulnerability management error."}},
{id:"s4_14",domain:4,question:"An analyst investigates a scanner finding reporting a critical vulnerability in a service, but manual verification shows the service is running a patched version and is not vulnerable. What has occurred, and what should the analyst do?",options:{A:"A false positive; document the verification, tune the scanner or add an exception, and rescan to confirm",B:"A true positive; escalate for emergency patching",C:"A false negative; increase scan sensitivity and rescan immediately",D:"A scan failure; rebuild the scanner's plugin database"},answer:"A",lead:"A false positive is a reported vulnerability that does not actually exist, and it is common when scanners infer from banner versions rather than testing behavior. The correct handling is to verify, document the evidence, suppress the finding through a tuned plugin or a documented exception, and rescan so the record reflects reality — never simply ignore it, since undocumented dismissals accumulate.",why:{B:"Contradicts the verification performed.",C:"Is the opposite error, a real vulnerability the scanner missed.",D:"Misattributes a detection accuracy issue to a tooling failure."}},
{id:"s4_15",domain:4,question:"A vulnerability team switches from unauthenticated scanning to credentialed scanning. Which outcome should they expect?",options:{A:"Faster scans, because credentials allow the scanner to skip host discovery",B:"More accurate results with greater depth and fewer false positives, at the cost of managing scan credentials securely",C:"Fewer findings overall, because authenticated scans only check for configuration issues",D:"Identical results, since credentials only affect reporting format"},answer:"B",lead:"A credentialed scan logs into the host and enumerates installed packages, patch levels, registry settings, and configuration directly, rather than inferring from network-visible banners. That produces far more complete and accurate results. The tradeoff is real: the scanner now holds privileged credentials, which must themselves be vaulted, restricted, and monitored.",why:{A:"Is false, and authenticated scans generally take longer.",C:"Is backwards, since authenticated scans typically find substantially more.",D:"Ignores the fundamental difference in visibility."}},
{id:"s4_16",domain:4,question:"A development team wants to identify injection flaws and insecure coding patterns as early as possible, before the application is ever deployed. Which testing method fits, and what is its main limitation?",options:{A:"Software composition analysis; it inventories dependencies but does not review first-party code",B:"Penetration testing; it simulates a real attacker but is performed only annually",C:"Static application security testing; it analyzes source code without executing it, so it cannot see runtime or environment issues and tends toward false positives",D:"Dynamic application security testing; it requires a running application, so it cannot be used early"},answer:"C",lead:"SAST examines source code, bytecode, or binaries without running them, so it can run on every commit and catch flaws at the cheapest point to fix. Its limitations are inherent: without execution it cannot observe configuration, authentication flow, or environment-specific behavior, and its lack of runtime context produces a high false positive rate requiring triage.",why:{A:"A, B, and D are all accurately described, but each fails the requirement to find coding flaws before deployment — DAST and pen testing need a running system, and SCA examines third-party components rather than the team's own code.",B:"A, B, and D are all accurately described, but each fails the requirement to find coding flaws before deployment — DAST and pen testing need a running system, and SCA examines third-party components rather than the team's own code.",D:"A, B, and D are all accurately described, but each fails the requirement to find coding flaws before deployment — DAST and pen testing need a running system, and SCA examines third-party components rather than the team's own code."}},
{id:"s4_17",domain:4,question:"A security team receives a curated feed of indicators from a sector-specific member organization that shares threat intelligence among peer companies in the same industry. What type of source is this?",options:{A:"Open source intelligence",B:"A proprietary commercial threat feed",C:"A dark web monitoring service",D:"An ISAC"},answer:"D",lead:"An Information Sharing and Analysis Center is an industry-specific body through which member organizations share threat intelligence with peers facing the same adversaries and regulatory environment. Sector relevance is what makes ISAC intelligence unusually actionable compared with generic feeds.",why:{A:"Is publicly available information gathered from open sources.",B:"Is purchased from a vendor rather than shared among industry members.",C:"Monitors criminal marketplaces and forums for leaked data or targeting."}},
{id:"s4_18",domain:4,question:"An organization cannot patch a vulnerable legacy application within its stated remediation SLA because the vendor's fix requires an upgrade that breaks integration. Which response is MOST appropriate, and what must accompany it?",options:{A:"A documented exception with compensating controls, an assigned owner, and a defined review date",B:"Accepting the risk permanently without further review since the constraint is technical",C:"Silently extending the SLA for that finding until the vendor releases a compatible fix",D:"Removing the finding from the vulnerability register to keep metrics accurate"},answer:"A",lead:"Exceptions are a legitimate part of vulnerability management, but only when they are formal: the business justification recorded, compensating controls applied to reduce exposure, an accountable owner named, risk accepted at the appropriate level of authority, and an expiry date that forces reassessment. That prevents a temporary constraint from quietly becoming permanent.",why:{B:"Removes the review that would catch the day a compatible fix ships.",C:"C and D hide risk from the people responsible for accepting it.",D:"C and D hide risk from the people responsible for accepting it."}},
