// ── Domain 1 — General Security Concepts ──
{id:"sr01",domain:1,title:"The CIA Triad and Core Security Goals",tags:["cia","confidentiality","integrity","availability","non-repudiation","authenticity"],content:"<p>The CIA triad defines the three fundamental goals of information security. <b>Confidentiality</b> ensures only authorized parties can read data, enforced through encryption, access controls, and classification. <b>Integrity</b> ensures data is accurate and unaltered, enforced through hashing, digital signatures, and file integrity monitoring. <b>Availability</b> ensures systems and data are accessible when needed, enforced through redundancy, load balancing, backups, and capacity planning.</p><p>These goals frequently conflict, and security work is largely the practice of balancing them. Aggressive encryption and multi-step authentication strengthen confidentiality but can reduce availability by adding failure points and friction. A fail-closed firewall protects confidentiality at the cost of availability when it crashes. Exam questions often describe a scenario and ask which element is primarily affected — read for what actually broke: data disclosed (confidentiality), data altered (integrity), or service unreachable (availability).</p><p>Two related properties extend the triad. <b>Non-repudiation</b> prevents a party from credibly denying an action, achieved through digital signatures and thorough logging. <b>Authenticity</b> confirms that data or a message genuinely originates from its claimed source. Together with the triad these form the vocabulary used throughout the rest of the exam objectives.</p>"},
{id:"sr02",domain:1,title:"Security Control Categories and Types",tags:["controls","preventive","detective","corrective","compensating","deterrent","directive","technical","managerial","operational","physical"],content:"<p>CompTIA divides controls along two independent axes, and exam questions routinely ask for both. The first axis is <b>category</b> — how the control is implemented. <b>Technical</b> controls are implemented in technology (firewalls, encryption, MFA). <b>Managerial</b> controls are administrative decisions and policy (risk assessments, security policies, change management). <b>Operational</b> controls are executed by people day to day (security guards, awareness training, incident handling). <b>Physical</b> controls are tangible barriers (locks, fences, bollards, lighting).</p><p>The second axis is <b>type</b> — what the control does functionally. <b>Preventive</b> controls stop an event (a locked door, an ACL). <b>Deterrent</b> controls discourage an attempt (warning signage, visible cameras). <b>Detective</b> controls identify an event (logs, IDS, motion sensors). <b>Corrective</b> controls restore after an event (backups, patching, failover). <b>Compensating</b> controls substitute when the primary control cannot be applied (isolating an unpatchable legacy device on its own VLAN). <b>Directive</b> controls instruct desired behavior (acceptable use policy, procedures).</p><p>A single control often carries multiple type labels. A visible camera deters attempts and detects incidents; a security guard deters, detects, and can physically prevent. When a question asks for the BEST answer, focus on the control's primary intent in that specific scenario. The compensating control in particular is a favorite exam topic — look for the phrase 'cannot be patched' or 'vendor no longer supports,' which signals that an alternative safeguard is standing in for the missing primary control.</p>"},
{id:"sr03",domain:1,title:"Zero Trust Architecture",tags:["zero trust","policy engine","policy enforcement point","control plane","data plane","microsegmentation","never trust"],content:"<p>Zero Trust replaces the traditional perimeter model, in which anything inside the network was implicitly trusted. Its governing principle is 'never trust, always verify': no access is granted based on network location alone. Every request is authenticated, authorized, and continuously evaluated against policy, whether it originates from a coffee shop or a desk in headquarters.</p><p>The architecture separates two planes. The <b>control plane</b> contains the <b>Policy Engine</b>, which evaluates policy and renders the grant or deny decision, and the <b>Policy Administrator</b>, which communicates that decision and establishes or terminates the session. The <b>data plane</b> contains the <b>Policy Enforcement Point</b>, which actually permits or blocks the subject's access to the resource. Exam questions frequently ask which component decides versus which enforces — the Policy Engine decides, the PEP enforces.</p><p>Supporting concepts include the <b>implicit trust zone</b> (the area a subject reaches after passing the PEP, which should be kept as small as possible), <b>adaptive identity</b> (weighing context such as device posture, location, and behavior rather than credentials alone), and <b>threat scope reduction</b> through microsegmentation. Practical Zero Trust implementations combine strong identity, device health attestation, least-privilege authorization, encrypted transport, and continuous monitoring — no single product delivers it.</p>"},
{id:"sr04",domain:1,title:"Cryptography Fundamentals",tags:["encryption","symmetric","asymmetric","aes","rsa","key exchange","diffie-hellman","perfect forward secrecy","ecc"],content:"<p><b>Symmetric encryption</b> uses one shared key for both encryption and decryption. It is fast and efficient for bulk data — AES is the dominant standard, with 128, 192, and 256-bit key lengths. Its weakness is key distribution: both parties must already share the key securely, which is difficult at scale (n parties require n(n-1)/2 keys).</p><p><b>Asymmetric encryption</b> uses a mathematically related public/private key pair. Data encrypted with the public key can only be decrypted with the private key, and vice versa. RSA, ECC, and DSA are the common algorithms. Asymmetric cryptography is far slower, so it is used to solve key exchange and provide digital signatures rather than to encrypt bulk data. ECC achieves equivalent strength with much smaller keys, making it well suited to mobile and IoT devices.</p><p>Real systems combine both in a <b>hybrid</b> approach. TLS uses asymmetric cryptography during the handshake to authenticate the server and negotiate a symmetric session key, then switches to AES for the actual data transfer. <b>Diffie-Hellman</b> key exchange lets two parties derive a shared secret over an untrusted network without ever transmitting it. Ephemeral variants (DHE, ECDHE) generate a fresh key per session, providing <b>perfect forward secrecy</b> — compromise of the server's long-term private key does not retroactively decrypt previously captured sessions.</p><p>Know the distinctions the exam tests: encryption is reversible and protects confidentiality; hashing is one-way and protects integrity; encoding (base64) is neither and provides no protection at all. A digital signature uses the sender's private key to provide authenticity, integrity, and non-repudiation — but not confidentiality.</p>"},
{id:"sr05",domain:1,title:"PKI, Certificates, and Trust",tags:["pki","certificate","ca","csr","ocsp","crl","root of trust","self-signed","san","wildcard"],content:"<p>Public Key Infrastructure binds public keys to verified identities through a hierarchy of certificate authorities. The process begins when an entity generates a key pair and submits a <b>Certificate Signing Request (CSR)</b> containing its public key and identifying information. The CA validates the request and issues a signed certificate. Clients then trust that certificate because they can verify the signature chain up to a <b>root CA</b> already present in their trust store.</p><p>Root CAs are kept offline and protected because their compromise invalidates everything beneath them. <b>Intermediate CAs</b> perform day-to-day issuance, so a compromised intermediate can be revoked without replacing the root. Chain validation — server certificate signed by intermediate, intermediate signed by root — is the essential trust step, alongside checking validity dates, the subject name against the requested host, and revocation status.</p><p>Revocation is handled two ways. A <b>CRL</b> is a downloadable list of revoked serial numbers, which scales poorly as it grows. <b>OCSP</b> queries a responder about one specific certificate and returns good, revoked, or unknown. <b>OCSP stapling</b> improves privacy and performance by having the server present a recent, CA-signed status response during the handshake rather than making the client query separately.</p><p>Certificate variations matter on the exam. A <b>wildcard</b> certificate (*.example.com) covers all first-level subdomains. A <b>SAN</b> (Subject Alternative Name) certificate covers multiple explicitly listed names. A <b>self-signed</b> certificate provides encryption but no third-party identity validation, which is why browsers warn on it — acceptable for internal testing, not for public services.</p>"},
{id:"sr06",domain:1,title:"Change Management in Security",tags:["change management","approval","backout plan","maintenance window","cab","impact analysis","version control"],content:"<p>Change management is a managerial control that reduces the risk of self-inflicted outages and unreviewed security regressions. The formal process requires a documented request, an <b>impact analysis</b> identifying affected systems and dependencies, approval by a change advisory board or designated authority, a scheduled <b>maintenance window</b>, and a tested <b>backout plan</b> that defines how to restore service if the change fails.</p><p>From a security perspective, undocumented changes are a major source of vulnerability. Configuration drift away from an approved baseline reintroduces weaknesses that were previously remediated, and unreviewed firewall rule additions accumulate into permissive rule sets nobody understands. Change records also provide crucial context during incident response — when an outage or alert begins shortly after a change window, that correlation is often the fastest route to root cause.</p><p>Technical implications the exam highlights include <b>allow list and deny list updates</b>, <b>restricted activities</b> that require elevated approval, <b>downtime</b> planning, <b>service and application restarts</b>, <b>legacy application</b> constraints, and <b>dependency</b> mapping. Supporting documentation must be kept current: updated diagrams, revised policies and procedures, and proper <b>version control</b> so that any configuration can be compared against its approved state and rolled back cleanly.</p>"},

// ── Domain 2 — Threats, Vulnerabilities, and Mitigations ──
{id:"sr07",domain:2,title:"Threat Actors and Motivations",tags:["threat actor","nation-state","apt","hacktivist","insider","organized crime","unskilled","shadow it","motivation"],content:"<p>Exam scenarios describe an attack and ask you to identify the actor, so learn the distinguishing signals rather than memorizing definitions. <b>Nation-state actors</b> (advanced persistent threats) have effectively unlimited resources, develop custom zero-day tooling, and prioritize long-term stealth over speed — dwell times of many months and an absence of financial motive point here. Their motivations are espionage, intellectual property theft, and disruption of critical infrastructure.</p><p><b>Organized crime</b> is financially motivated and moves quickly to monetize access through ransomware, fraud, and data resale. <b>Hacktivists</b> pursue ideological or political goals and want visibility — website defacement, data leaks, and DDoS against a symbolic target. <b>Unskilled attackers</b> (formerly script kiddies) use publicly available tools without deep understanding; their attacks are noisy and opportunistic. <b>Insider threats</b> hold legitimate authorized access, which makes them uniquely dangerous and difficult to detect; motivations range from financial gain and revenge to inadvertent negligence.</p><p><b>Shadow IT</b> is a distinct category: unsanctioned technology adopted by employees without approval. The intent is usually benign — staff working around a slow process — but the result is unmanaged data in unvetted services with no logging, backup, or access review. Distinguish it from a malicious insider, whose defining characteristic is deliberate harm.</p><p>Attributes worth comparing across actors: internal versus external, resources and funding, and level of sophistication. Common motivations tested include data exfiltration, espionage, service disruption, blackmail, financial gain, philosophical or political belief, ethical hacking, revenge, disruption or chaos, and war.</p>"},
{id:"sr08",domain:2,title:"Social Engineering Attacks",tags:["social engineering","phishing","vishing","smishing","pretexting","bec","watering hole","typosquatting","impersonation","misinformation"],content:"<p>Social engineering targets people rather than technology, and it remains the most common initial access vector. The delivery channel usually determines the term: <b>phishing</b> by email, <b>vishing</b> by voice call, <b>smishing</b> by SMS. Targeting determines another axis: generic phishing is broad, <b>spear phishing</b> is tailored to a specific individual or group, and <b>whaling</b> targets senior executives.</p><p><b>Pretexting</b> is the invented scenario that gives the request plausibility — 'I'm from the vendor's support team and need to verify your credentials.' <b>Business Email Compromise</b> impersonates an executive, vendor, or partner to induce fraudulent payments or data disclosure, frequently with no malware involved at all, which is why technical controls alone do not stop it. <b>Impersonation</b> and <b>brand impersonation</b> exploit trust in a known identity.</p><p>Web-based variants include the <b>watering hole</b> attack, which compromises a legitimate third-party site the victims habitually visit rather than contacting them directly, and <b>typosquatting</b>, which registers lookalike domains exploiting misreading or mistyping. <b>Pharming</b> redirects users who typed the correct address, usually via DNS manipulation.</p><p>Attackers rely on consistent psychological levers: authority, urgency, scarcity, fear, social proof, familiarity, and trust. The presence of urgency combined with a request that bypasses normal process is the strongest single indicator. Mitigation is layered — user awareness training with realistic phishing simulations, out-of-band verification for financial requests, DMARC/DKIM/SPF to reduce spoofing, and easy one-click reporting so the workforce functions as a detection sensor.</p>"},
{id:"sr09",domain:2,title:"Malware Types and Behavior",tags:["malware","ransomware","trojan","worm","virus","rootkit","keylogger","logic bomb","spyware","bloatware"],content:"<p>Distinguish malware by propagation method and behavior. A <b>virus</b> attaches to a host file and requires user action to execute and spread. A <b>worm</b> self-propagates across networks autonomously by exploiting vulnerabilities — no user interaction needed, which is why worms spread explosively. A <b>Trojan</b> masquerades as legitimate software; a <b>remote access Trojan (RAT)</b> specifically provides ongoing attacker control.</p><p><b>Ransomware</b> encrypts data and demands payment for the key. Modern <b>double extortion</b> adds data theft with a threat to publish, meaning even organizations with solid backups face leverage. Response priorities are isolation to stop spread, preservation of volatile evidence, and restoration from verified-clean offline backups — paying is discouraged and does not guarantee recovery.</p><p><b>Rootkits</b> operate at kernel or firmware level and subvert the operating system itself to hide their files, processes, and network connections from standard tools; detection typically requires offline analysis or boot-level integrity verification. <b>Logic bombs</b> lie dormant until a condition triggers them — a date, a file change, or the removal of an account. <b>Keyloggers</b> capture keystrokes, <b>spyware</b> harvests activity and data, and <b>bloatware</b> is unwanted preinstalled software that expands the attack surface without malicious intent.</p><p>Indicators of compromise worth recognizing include unexpected outbound connections to unfamiliar destinations, new scheduled tasks or services, disabled security tooling, unusual account creation, spikes in CPU or disk activity, and files with changed extensions or missing headers.</p>"},
{id:"sr10",domain:2,title:"Application Vulnerabilities and Injection Attacks",tags:["sql injection","xss","csrf","buffer overflow","race condition","toctou","directory traversal","input validation","parameterized query"],content:"<p><b>SQL injection</b> occurs when user input is concatenated directly into a database query, allowing an attacker to alter its logic. The classic payload ' OR '1'='1 makes a WHERE clause always true, bypassing authentication. The definitive mitigation is <b>parameterized (prepared) statements</b>, which separate code from data so injected syntax is treated as a literal value. Input validation against an allow list and least-privilege database accounts provide defense in depth.</p><p><b>Cross-site scripting (XSS)</b> injects script that executes in other users' browsers. <b>Stored</b> XSS persists on the server and fires for everyone who views the content; <b>reflected</b> XSS requires the victim to follow a crafted link; <b>DOM-based</b> XSS occurs entirely in client-side code. Mitigation is contextual output encoding, input validation, a Content Security Policy, and HttpOnly cookies to limit token theft.</p><p><b>Buffer overflow</b> writes more data into a fixed-length buffer than it can hold, corrupting adjacent memory. Overwriting the saved return address can redirect execution into attacker-supplied code. Modern defenses include ASLR, DEP/NX, stack canaries, and memory-safe languages, but legacy C/C++ code remains exposed.</p><p><b>Race conditions</b>, specifically <b>time-of-check to time-of-use (TOC/TOU)</b>, exploit the gap between validating state and acting on it — an attacker swaps the resource in between. <b>Directory traversal</b> uses sequences like ../../ to escape the intended directory and read arbitrary files; canonicalize paths and validate against an allow list. <b>CSRF</b> tricks an authenticated browser into submitting an unwanted request and is countered with anti-CSRF tokens and SameSite cookies; <b>SSRF</b> makes the server itself issue attacker-chosen requests and is countered by egress restrictions and allow-listing destinations.</p>"},
{id:"sr11",domain:2,title:"Network Attacks",tags:["ddos","amplification","reflection","on-path","arp poisoning","dns poisoning","replay","downgrade","wireless","deauthentication"],content:"<p><b>DDoS</b> attacks exhaust a target's resources. <b>Volumetric</b> attacks saturate bandwidth, <b>protocol</b> attacks exhaust connection state (SYN floods), and <b>application-layer</b> attacks consume server processing with expensive requests. <b>Reflection</b> spoofs the victim's source address so third-party servers send responses to the victim; <b>amplification</b> chooses protocols where the response is much larger than the request (DNS, NTP, memcached). The two combine into reflected, amplified floods that are difficult to trace.</p><p><b>On-path attacks</b> (formerly man-in-the-middle) place the attacker between two communicating parties. <b>ARP poisoning</b> forges ARP replies mapping the gateway IP to the attacker's MAC, redirecting local traffic; mitigate with Dynamic ARP Inspection and DHCP snooping. <b>DNS poisoning</b> corrupts resolver caches to send users to attacker-controlled addresses; DNSSEC provides origin authentication for DNS records.</p><p><b>Replay attacks</b> capture valid authentication data and resend it. Countermeasures are timestamps, nonces, and sequence numbers. <b>Pass-the-hash</b> reuses a captured credential hash without ever cracking it. <b>Downgrade attacks</b> manipulate negotiation so both parties settle on a weaker protocol or cipher the attacker can break — mitigated by disabling legacy versions entirely rather than merely deprioritizing them.</p><p>Wireless-specific attacks include <b>evil twin</b> access points impersonating a legitimate SSID, <b>rogue AP</b> deployment inside the environment, <b>deauthentication</b> frames forcing clients to reconnect (and potentially to the attacker's AP), and <b>jamming</b>. WPA3, 802.1X enterprise authentication, and management frame protection are the primary defenses.</p>"},
{id:"sr12",domain:2,title:"Password Attacks and Credential Threats",tags:["brute force","dictionary","rainbow table","credential stuffing","password spraying","salting","mfa","kdf"],content:"<p><b>Brute force</b> tries every possible combination and is defeated by length far more than by complexity — each added character multiplies the search space. <b>Dictionary attacks</b> try likely words and common substitutions. <b>Rainbow tables</b> use precomputed hash chains to reverse unsalted hashes quickly; unique per-user <b>salts</b> defeat them entirely because identical passwords produce different digests.</p><p><b>Credential stuffing</b> replays real username/password pairs harvested from unrelated breaches. Complexity requirements provide no protection here — the credentials are already valid — so MFA and anomaly detection (impossible travel, unfamiliar device, distributed source addresses) are the effective controls. <b>Password spraying</b> inverts the approach, trying a small number of common passwords across many accounts specifically to stay under lockout thresholds; detect it by correlating failures across accounts rather than per account.</p><p>Defensive storage practice is to hash with a unique salt using a deliberately slow key derivation function — bcrypt, scrypt, Argon2, or PBKDF2 — so that offline cracking is computationally expensive. Never encrypt passwords (reversible, creates key management risk) and never store them encoded, which offers no protection at all.</p><p>Current guidance favors longer passphrases over forced complexity and periodic rotation, since aggressive rotation drives predictable patterns. Pair this with MFA — ideally phishing-resistant FIDO2/WebAuthn security keys, which cryptographically bind authentication to the legitimate site's origin so a relayed response from a fake site fails.</p>"},
{id:"sr13",domain:2,title:"Mitigation Techniques",tags:["segmentation","least privilege","hardening","patching","acl","monitoring","decommissioning","configuration enforcement","isolation"],content:"<p><b>Segmentation</b> divides the network into zones so a compromise in one area cannot move freely into another, directly limiting blast radius and lateral movement. Microsegmentation extends this to individual workloads. Segmentation is also the standard compensating control for systems that cannot be patched — legacy medical devices, ICS equipment, and end-of-life operating systems.</p><p><b>Least privilege</b> grants only the permissions required for a role, and no more. Combined with <b>access control lists</b> and regular access reviews, it limits what a compromised account can reach. Standing administrative privileges should be replaced with just-in-time elevation wherever possible.</p><p><b>Hardening</b> applies a secure configuration baseline: remove or change default credentials, disable unnecessary services and close unused ports, uninstall unneeded software, enforce secure protocols, enable host firewalls and endpoint protection, and apply vendor benchmarks such as CIS. <b>Configuration enforcement</b> continuously detects and corrects drift away from that baseline.</p><p><b>Patching</b> remains the single highest-value technical control, applied on a risk-prioritized schedule with testing and a rollback path. <b>Monitoring</b> provides the detection layer when prevention fails. <b>Decommissioning</b> closes an often-overlooked gap: systems that are no longer used but remain powered and reachable accumulate unpatched vulnerabilities with no owner watching them, so formal retirement including sanitization and removal from the network is part of the security lifecycle.</p>"},

// ── Domain 3 — Security Architecture ──
{id:"sr14",domain:3,title:"Cloud Models and Shared Responsibility",tags:["cloud","iaas","paas","saas","shared responsibility","hybrid","multi-cloud","casb","serverless"],content:"<p>The <b>shared responsibility model</b> defines where the provider's duties end and the customer's begin, and it shifts with the service model. In <b>IaaS</b>, the provider secures the physical facility, hardware, and hypervisor; the customer owns the guest OS, patching, configuration, network rules, applications, and data. In <b>PaaS</b>, the provider additionally manages the operating system and runtime, leaving the customer responsible for application code, configuration, and data. In <b>SaaS</b>, the provider manages nearly the entire stack, and the customer retains responsibility for data, identity and access management, and configuration settings.</p><p>The customer <i>always</i> retains responsibility for data classification, identity and access, and their own configuration choices — a point the exam tests repeatedly. Most publicized 'cloud breaches' are customer misconfigurations (publicly readable storage buckets, overly permissive IAM roles) rather than provider failures.</p><p>Deployment models include <b>public</b>, <b>private</b>, <b>hybrid</b> (mixing both, with attention to the connection between them), and <b>community</b>. <b>Multi-cloud</b> spreads workloads across providers for platform diversity and reduced vendor lock-in, at the cost of operational complexity and broader required skill sets.</p><p><b>Serverless</b> computing removes server management entirely, shifting infrastructure security to the provider while concentrating customer risk in function code, dependencies, and permissions. A <b>CASB</b> (Cloud Access Security Broker) sits between users and cloud services to enforce visibility, compliance, data security, and threat protection — particularly valuable for discovering and governing shadow IT.</p>"},
{id:"sr15",domain:3,title:"Network Security Devices and Placement",tags:["firewall","ngfw","waf","utm","ids","ips","proxy","jump server","screened subnet","load balancer","inline","tap"],content:"<p>Firewall types differ by inspection depth. A <b>packet-filtering</b> firewall examines headers only. A <b>stateful</b> firewall tracks connection state and permits return traffic for established sessions. A <b>next-generation firewall (NGFW)</b> adds application awareness, user identity integration, and integrated intrusion prevention. A <b>web application firewall (WAF)</b> operates at Layer 7 and understands HTTP semantics, blocking SQL injection, XSS, and traversal — and serving as virtual patching for applications awaiting a code fix. <b>UTM</b> appliances consolidate multiple functions into one device, trading some depth for simplicity.</p><p><b>IDS versus IPS</b> is a recurring exam distinction. An IDS is typically deployed <b>out of band</b> receiving mirrored traffic from a SPAN port or tap; it is <b>passive</b> and can only alert. An IPS is deployed <b>inline</b> in the traffic path and is <b>active</b>, able to drop malicious packets — at the cost of becoming a potential bottleneck and a point of failure, which is why its fail-open or fail-closed behavior must be a deliberate decision.</p><p>Placement concepts matter as much as device choice. A <b>screened subnet</b> (formerly DMZ) hosts internet-facing services in a zone isolated from the internal network. A <b>jump server</b> or bastion host provides the single hardened, logged entry point into a protected zone. A <b>forward proxy</b> mediates outbound user traffic for filtering and logging; a <b>reverse proxy</b> fronts published services for inbound clients. A <b>load balancer</b> distributes traffic across nodes and removes unhealthy members, supporting availability and scalability.</p><p><b>Failure mode</b> is an explicit design decision. <b>Fail-closed</b> blocks traffic when the control fails, prioritizing security. <b>Fail-open</b> permits traffic, prioritizing availability. Choose based on whether an outage or unfiltered traffic is the greater risk for that specific system — a data-center firewall usually fails closed, while a physical fire exit always fails open.</p>"},
{id:"sr16",domain:3,title:"Secure Protocols and Their Insecure Predecessors",tags:["ssh","sftp","ftps","https","tls","snmpv3","ldaps","dnssec","ipsec","protocol selection","ports"],content:"<p>A large share of hardening work is replacing cleartext protocols with encrypted equivalents. Memorize these pairs: <b>Telnet (23) → SSH (22)</b>, <b>FTP (20/21) → SFTP (22, over SSH)</b> or <b>FTPS (990, over TLS)</b>, <b>HTTP (80) → HTTPS (443)</b>, <b>SNMPv1/v2c (161) → SNMPv3</b>, <b>LDAP (389) → LDAPS (636)</b>, <b>POP3 (110) → POP3S (995)</b>, <b>IMAP (143) → IMAPS (993)</b>, and <b>SMTP (25) → SMTPS (587 with STARTTLS)</b>.</p><p><b>TLS</b> is the dominant transport protection. Versions 1.0 and 1.1 are deprecated and should be disabled outright rather than merely deprioritized, since leaving them enabled invites downgrade attacks. TLS 1.2 remains widely acceptable and TLS 1.3 is preferred — it removes legacy cipher suites, mandates forward secrecy, and reduces handshake round trips.</p><p><b>IPsec</b> provides network-layer protection through two protocols: <b>AH</b> offers integrity and authentication but no encryption, while <b>ESP</b> offers encryption plus integrity. <b>Tunnel mode</b> encapsulates the entire original packet inside a new one, hiding internal addressing — the standard for gateway-to-gateway VPNs. <b>Transport mode</b> protects only the payload and retains the original header, used for host-to-host communication.</p><p><b>DNSSEC</b> adds origin authentication and integrity to DNS records, defending against cache poisoning; note that it signs but does not encrypt, so DNS queries remain visible unless DoH or DoT is used. When a question asks about 'protocol selection,' the expected answer is nearly always to choose the encrypted variant and disable the legacy one.</p>"},
{id:"sr17",domain:3,title:"Data Classification, Protection, and Sovereignty",tags:["data classification","at rest","in transit","in use","sovereignty","masking","tokenization","obfuscation","retention","dlp"],content:"<p>Effective data protection begins with <b>classification</b>: labeling data by sensitivity so controls can be applied proportionately. Common commercial tiers are public, internal, confidential, and restricted; government schemes use unclassified, confidential, secret, and top secret. Classification drives encryption requirements, access restrictions, retention periods, and handling procedures.</p><p>Data exists in three states, each requiring different controls. <b>At rest</b> — stored on disk or in backups — is protected by full-disk or database encryption, guarding against physical media theft. <b>In transit</b> — moving across a network — is protected by TLS, IPsec, or VPN tunnels. <b>In use</b> — loaded in memory and being processed — is the hardest to protect, addressed by technologies such as confidential computing and secure enclaves.</p><p>Obfuscation techniques differ meaningfully. <b>Tokenization</b> replaces sensitive values with unrelated surrogates stored in a protected vault, and is reversible through lookup — widely used for payment card data to reduce compliance scope. <b>Masking</b> permanently obscures part of a value for display and is not reversible. <b>Encryption</b> is reversible with the correct key. <b>Steganography</b> hides data within other media entirely.</p><p><b>Data sovereignty</b> holds that data is subject to the laws of the jurisdiction where it physically resides, so regulations may mandate in-region storage and processing and restrict cross-border transfer. Related governance concerns include maintaining a <b>data inventory</b>, defining <b>retention</b> schedules that satisfy legal requirements without keeping data longer than necessary, and identifying <b>data owners</b>, <b>controllers</b>, <b>processors</b>, and <b>custodians/stewards</b>.</p>"},
{id:"sr18",domain:3,title:"Resilience, Redundancy, and Recovery",tags:["high availability","redundancy","raid","backup","3-2-1","hot site","warm site","cold site","failover","tabletop","ups","generator"],content:"<p>Resilience planning distinguishes <b>fault tolerance</b> (continuing operation despite component failure) from <b>recovery</b> (restoring service after failure). <b>RAID</b> provides fault tolerance against drive failure — RAID 1 mirrors, RAID 5 stripes with distributed parity surviving one disk loss, RAID 6 survives two, RAID 10 combines mirroring and striping. Critically, <b>RAID is not a backup</b>: it protects against hardware failure, not deletion, corruption, or ransomware, which propagate instantly across the array.</p><p>Backups follow the <b>3-2-1 rule</b> — three copies, on two different media types, with at least one offsite, ideally immutable or air-gapped so ransomware cannot reach it. Backup types trade speed against restore complexity: <b>full</b> backs up everything; <b>incremental</b> backs up changes since the last backup of any type (fastest to create, slowest to restore, requires the full chain); <b>differential</b> backs up changes since the last full backup (larger each day, but restore needs only the full plus the latest differential). Untested backups are assumptions — regular restore testing is mandatory.</p><p>Recovery sites vary by readiness and cost. A <b>hot site</b> is fully equipped and running with current data, enabling near-immediate failover at the highest expense. A <b>warm site</b> has hardware and connectivity in place but requires data loading and configuration. A <b>cold site</b> provides only space and utilities, taking days or weeks to activate. <b>Geographic dispersion</b> ensures a regional disaster cannot affect both primary and recovery locations.</p><p>Testing validates the plan. A <b>tabletop exercise</b> is a discussion-based walkthrough with no production impact. A <b>simulation</b> adds realistic injects. <b>Parallel processing</b> runs the recovery environment alongside production without cutting over. A <b>failover test</b> actually shifts production. Power resilience layers a <b>UPS</b> for immediate battery coverage during the seconds before a <b>generator</b> starts and stabilizes for extended outages.</p>"},
{id:"sr19",domain:3,title:"Specialized and Embedded Systems",tags:["ics","scada","iot","rtos","embedded","ot","medical devices","legacy","segmentation"],content:"<p>Specialized systems share a defining constraint: they often cannot be patched, rebooted, or scanned like general-purpose IT. <b>ICS/SCADA</b> systems control physical industrial processes — power generation, water treatment, manufacturing. Downtime carries safety and physical consequences, and vendor certification may prohibit modification, so aggressive patching is frequently impossible.</p><p>A <b>real-time operating system (RTOS)</b> provides deterministic, guaranteed task timing, which these environments require. That determinism is incompatible with unpredictable background processes, so conventional endpoint agents and scheduled scans may be unsafe to deploy. <b>Embedded systems</b> ship with fixed firmware and long service lives measured in decades, meaning they routinely outlive vendor support.</p><p><b>IoT</b> devices multiply the problem through scale and weak defaults: hardcoded or default credentials, unencrypted communication, infrequent or absent firmware updates, and minimal logging. Medical devices add regulatory constraints that can prevent modification entirely without recertification.</p><p>Because the primary control (patching) is unavailable, security relies on <b>compensating controls</b>. Network segmentation and strict ACLs isolate these systems from general IT and the internet. Unidirectional gateways or data diodes permit monitoring data out while blocking inbound traffic. Enhanced network monitoring detects anomalous behavior in place of host agents. Strict physical access control, disabled unused ports and services, and documented exceptions with defined review dates complete the approach.</p>"},

// ── Domain 4 — Security Operations ──
{id:"sr20",domain:4,title:"Incident Response Lifecycle",tags:["incident response","preparation","detection","containment","eradication","recovery","lessons learned","playbook","tabletop"],content:"<p>The standard lifecycle has six phases, and the exam tests both their order and their purpose. <b>Preparation</b> is continuous and comes first: building the team, writing playbooks, deploying tooling, establishing communication paths, and training. <b>Detection and Analysis</b> identifies that an incident is occurring and determines its scope, severity, and affected assets — separating true incidents from false positives.</p><p><b>Containment</b> limits the damage and prevents spread. Short-term containment might isolate hosts from the network immediately; long-term containment applies temporary fixes allowing business to continue while a permanent solution is prepared. A crucial detail: isolate but generally do <i>not</i> power off, since shutdown destroys volatile memory evidence including encryption keys, running processes, and active network connections.</p><p><b>Eradication</b> removes the root cause — deleting malware, closing the exploited vulnerability, removing attacker persistence mechanisms and unauthorized accounts. Rebuilding from known-good images is often more reliable than cleaning in place. <b>Recovery</b> restores systems to normal operation with validation and heightened monitoring to confirm the adversary is genuinely gone before declaring the incident closed.</p><p><b>Lessons Learned</b> conducts a blameless post-incident review, documenting the timeline, what worked, what failed, and concrete improvements — which feed directly back into Preparation. Supporting practices include <b>root cause analysis</b>, <b>threat hunting</b> (proactive, hypothesis-driven searching for adversaries already present without a triggering alert), and regular <b>tabletop exercises</b> and <b>simulations</b> that surface gaps before a real incident does.</p>"},
{id:"sr21",domain:4,title:"Digital Forensics",tags:["forensics","chain of custody","order of volatility","legal hold","acquisition","e-discovery","preservation","imaging","hashing"],content:"<p>Forensics preserves evidence so it remains credible and admissible. <b>Chain of custody</b> documents every person who handled evidence, when, and for what purpose — any unexplained gap can render evidence inadmissible. <b>Legal hold</b> suspends routine deletion and retention schedules once litigation is anticipated, and failing to implement it promptly can itself carry sanctions.</p><p>The <b>order of volatility</b> dictates collection sequence, most volatile first: CPU registers and cache, then RAM, then network state and running processes, then disk, then remote logging and archival backups. Capturing a memory image before shutdown is essential — RAM may hold encryption keys, injected code, and connections that vanish on power-off.</p><p><b>Acquisition</b> creates a forensically sound copy, typically a bit-for-bit image made through a write blocker so the original is never modified. Both the original and the copy are cryptographically hashed, and matching hashes prove the image is faithful and has not changed since collection. All analysis is performed on the copy.</p><p><b>Preservation</b> maintains evidence in unaltered condition throughout the investigation. <b>E-discovery</b> is the legal process of identifying, collecting, and producing electronically stored information for proceedings. <b>Reporting</b> documents methodology, findings, and conclusions in a form that a non-technical audience — including a court — can follow and that another examiner could reproduce.</p>"},
{id:"sr22",domain:4,title:"Vulnerability Management",tags:["vulnerability scan","cve","cvss","false positive","patching","remediation","validation","exception","sast","dast","pen test"],content:"<p>Vulnerability management is a continuous cycle: identification, analysis, response, validation, and reporting. <b>Identification</b> draws on authenticated and unauthenticated vulnerability scans, <b>SAST</b> (static analysis of source code without execution), <b>DAST</b> (dynamic testing of a running application), package and dependency monitoring, threat feeds and OSINT, penetration testing, bug bounty and responsible disclosure programs, and system and process audits.</p><p><b>Analysis</b> begins with confirmation: distinguishing a <b>true positive</b> from a <b>false positive</b> (an alert with no real underlying issue) and remaining alert to <b>false negatives</b> (real vulnerabilities the tooling missed, which are more dangerous precisely because they are invisible). Prioritization uses <b>CVSS</b> scores (0.0–10.0 across base, temporal, and environmental metrics) alongside <b>CVE</b> identifiers, but raw score is not the whole story — exposure, asset criticality, exploit availability, compensating controls, and organizational impact all adjust real priority. A CVSS 9.8 on an isolated lab host may rank below a 7.5 on an internet-facing production system.</p><p><b>Response</b> options are patching (preferred), segmentation or isolation, compensating controls, purchasing insurance, or documenting a formal <b>exception</b>. Exceptions must be time-bounded, owned, approved at an appropriate level, and reviewed at expiry — an exception is a governance record of accepted risk, not a technical safeguard.</p><p><b>Validation</b> confirms remediation actually worked through rescanning, audit, and verification — never assume a patch applied cleanly. <b>Reporting</b> communicates posture and trend over time to technical teams and leadership, ideally showing time-to-remediate by severity rather than raw open counts.</p>"},
{id:"sr23",domain:4,title:"Identity and Access Management",tags:["iam","rbac","abac","mac","dac","sso","saml","oauth","oidc","mfa","pam","provisioning","least privilege"],content:"<p>Access control models define how permissions are decided. <b>DAC</b> lets the data owner grant access at their discretion — flexible but prone to sprawl. <b>MAC</b> enforces system-wide labels and clearances that users cannot override, used in government and military contexts. <b>RBAC</b> attaches permissions to job roles rather than individuals, greatly simplifying joiner/mover/leaver processes. <b>ABAC</b> evaluates multiple attributes — user, device, location, time, sensitivity — for fine-grained, context-aware decisions. <b>Rule-based</b> access applies global conditional rules regardless of identity.</p><p><b>Federation</b> extends identity across organizational boundaries. <b>SAML</b> exchanges signed XML assertions between an identity provider and service providers for enterprise SSO. <b>OAuth 2.0</b> is an authorization framework issuing access tokens for delegated resource access without sharing passwords. <b>OpenID Connect</b> layers authentication on top of OAuth via an ID token. A frequent exam trap: OAuth alone is authorization, not authentication — OIDC supplies the identity layer.</p><p><b>Multifactor authentication</b> requires factors from different categories: something you know (password, PIN), something you have (token, security key, phone), something you are (biometrics), and contextual attributes such as somewhere you are. Two passwords are not MFA. Phishing-resistant FIDO2/WebAuthn security keys bind authentication cryptographically to the legitimate origin, defeating relay attacks that defeat SMS and push-based methods.</p><p><b>Privileged Access Management</b> eliminates standing administrative rights through just-in-time elevation, credential vaulting, ephemeral credentials, and session recording. Lifecycle discipline matters equally: prompt <b>provisioning</b> at onboarding, permission adjustment on role change, immediate <b>deprovisioning</b> at termination, and periodic access reviews and <b>attestation</b> to catch accumulated privilege creep.</p>"},
{id:"sr24",domain:4,title:"Monitoring, Logging, and Security Tooling",tags:["siem","log aggregation","edr","xdr","dlp","fim","netflow","snmp","alert tuning","scap","benchmarks","agent"],content:"<p><b>SIEM</b> platforms aggregate logs from firewalls, endpoints, applications, identity providers, and cloud services, then normalize and correlate them to surface patterns no single source reveals. Correlating VPN logs with domain authentication, for example, exposes impossible-travel logins that neither log would flag alone. Effective SIEM use depends on consistent time synchronization (NTP) across all sources, without which correlation breaks down.</p><p><b>EDR</b> continuously records endpoint telemetry — process lineage, file and registry changes, network connections — detects behavioral indicators, and gives responders remote isolation and remediation. <b>XDR</b> extends that correlation across network, email, identity, and cloud. <b>DLP</b> inspects content in motion, at rest, and in use against classification rules and blocks or quarantines violations. <b>FIM</b> hashes critical files and alerts on deviation from a trusted baseline, catching tampering that signature-based antivirus misses.</p><p>Infrastructure telemetry adds context: <b>NetFlow</b> describes traffic flows and volumes without full packet capture, <b>SNMP traps</b> report device events, and full <b>packet captures</b> provide definitive detail at high storage cost. <b>SCAP</b> standardizes automated configuration and vulnerability assessment, while <b>benchmarks</b> such as CIS provide vetted hardening baselines. Collection can be <b>agent-based</b> (richer detail, deployment overhead) or <b>agentless</b> (easier to deploy, less visibility).</p><p><b>Alert tuning</b> is an ongoing operational necessity rather than a one-time setup task. Excessive false positives cause alert fatigue, and a queue analysts have learned to ignore provides no protection regardless of detection quality. Tuning refines thresholds, adds validated exceptions, and suppresses known-benign patterns so genuine detections remain visible.</p>"},
{id:"sr25",domain:4,title:"Hardening and Secure Baselines",tags:["hardening","baseline","default credentials","attack surface","group policy","selinux","patch management","configuration drift","mdm"],content:"<p>A <b>secure baseline</b> is the documented, approved configuration for a system class. Establishing it, deploying it consistently, and continuously verifying against it is the core of hardening. Baseline creation removes default and unnecessary accounts, changes default credentials, disables unneeded services and closes unused ports, uninstalls superfluous software, enforces encrypted protocols, enables host firewalls and endpoint protection, and configures logging to a central collector.</p><p><b>Attack surface</b> is the sum of exposed entry points, so every disabled service and closed port measurably reduces risk. Default credentials deserve special attention — they are published in vendor documentation and are among the first things attackers try, and they appear repeatedly in exam scenarios about newly deployed devices.</p><p>Enforcement mechanisms vary by platform: <b>Group Policy</b> on Windows domains, <b>SELinux</b> or AppArmor mandatory access control on Linux, <b>MDM</b> for mobile devices, and configuration management tooling for servers and cloud resources. <b>Configuration drift</b> — gradual divergence from the baseline through ad hoc changes — reintroduces previously remediated weaknesses, so automated detection and correction of drift is as important as the initial deployment.</p><p>Hardening targets named in the objectives span mobile devices, workstations, servers, switches and routers, cloud infrastructure, wireless devices, ICS/SCADA, embedded systems, RTOS, and IoT. Each has different constraints — patch cadence, reboot tolerance, vendor certification requirements — so baselines must be tailored per class rather than applied uniformly.</p>"},
{id:"sr26",domain:4,title:"Automation and Orchestration in Security Operations",tags:["automation","orchestration","soar","provisioning","guard rails","api","ticketing","ci/cd","escalation"],content:"<p>Automation applies repeatable workflows to routine security tasks; orchestration coordinates multiple systems into an end-to-end process. Typical use cases include user and resource provisioning, security group management, ticket creation and escalation, enabling or disabling services, and continuous integration and testing pipelines.</p><p>The benefits are efficiency (faster execution), consistency (the same vetted steps every time), reduced human error, workforce multiplication (a small team covering more ground), and improved reaction time — automated containment can isolate a host in seconds rather than the minutes or hours a human takes to notice and act. Automation also serves as an enforcement mechanism for baselines, continuously correcting drift.</p><p><b>Guard rails</b> are automated policy constraints that prevent unsafe configurations from being deployed at all — blocking a public storage bucket or an overly permissive IAM role before it reaches production. This shifts security left, catching misconfiguration at deployment rather than during a later audit or breach.</p><p>Considerations and risks deserve equal weight. Complexity grows as workflows multiply, and poorly understood automation becomes fragile. Cost includes both tooling and the skill set to maintain it. A single point of failure emerges if the orchestration platform itself goes down or is compromised — and automation with broad privileges is an extremely attractive target. Technical debt accumulates when scripts outlive their authors, so ongoing supportability must be planned rather than assumed.</p>"},

// ── Domain 5 — Security Program Management and Oversight ──
{id:"sr27",domain:5,title:"Risk Analysis and Quantification",tags:["risk","sle","aro","ale","exposure factor","qualitative","quantitative","risk register","appetite","tolerance","residual"],content:"<p><b>Quantitative</b> risk analysis assigns monetary values and is the source of the exam's calculation questions. <b>SLE</b> (Single Loss Expectancy) = Asset Value × <b>Exposure Factor</b>, the loss from one occurrence. <b>ARO</b> (Annualized Rate of Occurrence) is how many times per year the event is expected — once every 20 years is 0.05. <b>ALE</b> (Annualized Loss Expectancy) = SLE × ARO, the expected annual loss. ALE is then compared against the annual cost of a proposed control to determine whether the control is economically justified.</p><p>Work an example carefully: a $200,000 asset with a 40% exposure factor gives SLE = $80,000. At one event every 20 years, ARO = 0.05, so ALE = $80,000 × 0.05 = $4,000. A control costing $10,000 per year is not justified by that figure alone.</p><p><b>Qualitative</b> analysis uses relative scales — high/medium/low or numeric heat maps — when reliable monetary data is unavailable. It is faster and more subjective, and most organizations use both approaches together.</p><p>Governance vocabulary is tested precisely. <b>Inherent risk</b> exists before controls; <b>residual risk</b> remains after them and must be formally accepted by management or the designated risk owner, never by technical staff. <b>Risk appetite</b> is the broad level of risk leadership will pursue (expansionary, neutral, conservative); <b>risk tolerance</b> is acceptable variation; a <b>risk threshold</b> is the specific value that triggers action. The <b>risk register</b> records each risk with an owner, scores, treatment plan, threshold, and <b>key risk indicators</b> — the owner field exists so risks are actively managed rather than left to sit.</p>"},
{id:"sr28",domain:5,title:"Risk Treatment Strategies",tags:["mitigate","transfer","avoid","accept","exemption","exception","insurance","risk reporting"],content:"<p>Four strategies address identified risk, and exam questions describe a business action and ask which applies. <b>Mitigation</b> reduces likelihood or impact through controls while continuing the activity — patching, segmentation, MFA. It is the most common response.</p><p><b>Transference</b> shifts financial impact to a third party, typically through cyber insurance or contractual terms with a vendor. A critical nuance: reputational damage and regulatory accountability generally cannot be transferred. You can insure the cost of a breach; you cannot outsource the obligation or the loss of customer trust.</p><p><b>Avoidance</b> eliminates the risk by ceasing the activity that creates it — discontinuing a product line, declining to enter a market, or removing a system entirely. It is the only strategy that reduces risk to zero, but it also forfeits whatever business value the activity provided.</p><p><b>Acceptance</b> acknowledges the risk and proceeds without additional controls, appropriate when treatment costs exceed potential loss. Acceptance must be documented and approved at the right level of authority. An <b>exemption</b> is a standing carve-out from a policy requirement; an <b>exception</b> is a time-bounded deviation with a defined expiry and review date. Both are governance records of a deliberate decision — not technical safeguards, and not a substitute for compensating controls.</p>"},
{id:"sr29",domain:5,title:"Business Continuity and Disaster Recovery Metrics",tags:["bia","rto","rpo","mttr","mtbf","continuity","disaster recovery","critical function","dependencies"],content:"<p>A <b>Business Impact Analysis</b> identifies critical business functions, quantifies the impact of losing them over time, maps their dependencies, and produces the recovery objectives that drive continuity investment. Without a BIA, recovery spending is guesswork.</p><p><b>RTO</b> (Recovery Time Objective) is the maximum tolerable duration of the outage — how long the business can function without the system. <b>RPO</b> (Recovery Point Objective) is the maximum tolerable data loss, measured backward from the moment of failure. These drive different technical solutions: a tight RTO demands fast failover capability such as a hot site or clustering, while a tight RPO demands frequent backups or continuous replication. An RPO of 15 minutes cannot be met by nightly backups regardless of how quickly systems restart.</p><p><b>MTTR</b> (Mean Time To Repair) is the average time to restore a failed system, reflecting maintainability. <b>MTBF</b> (Mean Time Between Failures) is the average operating time between failures, reflecting reliability. <b>MTTF</b> applies to non-repairable components. Distinguish them carefully — the exam mixes them into scenario questions where only one fits.</p><p>Continuity planning also covers <b>continuity of operations</b> procedures for working without primary systems, defined communication paths when normal channels are unavailable, succession planning for key personnel, and regular testing. A plan that has never been exercised is an assumption, not a capability.</p>"},
{id:"sr30",domain:5,title:"Third-Party and Vendor Risk Management",tags:["vendor","due diligence","right to audit","sla","mou","msa","sow","nda","bpa","supply chain","questionnaire","rules of engagement"],content:"<p>Third parties extend your attack surface beyond your direct control, and many significant breaches originate through a supplier. <b>Due diligence</b> is the pre-contract investigation of a prospective vendor's financial stability, security posture, compliance history, and legal standing. <b>Conflict of interest</b> screening belongs to vendor selection as well.</p><p>Assessment methods include security <b>questionnaires</b>, review of <b>independent assessments</b> and third-party audit reports (SOC 2, ISO 27001 certification), evidence of internal audits, penetration testing results, and <b>supply chain analysis</b> that examines the vendor's own upstream dependencies.</p><p>Know the agreement types precisely, as the exam tests them directly. <b>SLA</b> — measurable performance commitments (uptime, response time) with remedies for failure. <b>MOU/MOA</b> — statements of intent, generally non-binding. <b>MSA</b> — overarching legal terms governing an ongoing relationship. <b>SOW/WO</b> — the specific deliverables and timeline for a particular project, issued under an MSA. <b>NDA</b> — confidentiality obligations. <b>BPA</b> — terms of a business partnership. A <b>right-to-audit clause</b> preserves your ability to assess the vendor's controls directly or through an assessor; without it you are limited to whatever the vendor volunteers.</p><p>Vendor risk management continues after signing through ongoing <b>monitoring</b>, periodic reassessment, and clearly defined <b>rules of engagement</b> for any testing performed against vendor-hosted systems. Offboarding matters too: revoking vendor access and confirming secure return or destruction of your data at contract end.</p>"},
{id:"sr31",domain:5,title:"Governance, Policies, and Compliance",tags:["governance","policy","aup","standards","procedures","compliance","regulation","attestation","privacy","gdpr","right to be forgotten"],content:"<p>Governance establishes the structures and documents that direct a security program. The hierarchy runs from broad to specific: <b>policies</b> state intent and requirements (acceptable use, information security, business continuity, disaster recovery, incident response, SDLC, change management); <b>standards</b> define mandatory specifics (password composition, encryption algorithms, access control, physical security); <b>procedures</b> give step-by-step instructions (onboarding and offboarding, change execution, playbooks); and <b>guidelines</b> offer recommended but non-mandatory practice.</p><p>Governance structures include boards, committees, government entities, and centralized or decentralized models. <b>Centralized</b> governance concentrates decision authority for consistency and easier compliance demonstration, at the cost of local flexibility. <b>Decentralized</b> governance gains responsiveness but risks inconsistent control application. Roles must be explicit: data <b>owners</b> (accountable for the data), <b>controllers</b> (determine purpose and means of processing), <b>processors</b> (act on the controller's instructions), and <b>custodians/stewards</b> (handle day-to-day technical safeguarding).</p><p>Compliance obligations arise from regulatory, legal, industry, and contractual sources, and vary across local, regional, national, and global jurisdictions. Consequences of non-compliance escalate from fines and sanctions through reputational damage and contractual penalties to <b>loss of license</b> — the most severe, since it removes legal authorization to operate at all. Compliance monitoring uses due diligence and due care, <b>attestation</b> and acknowledgement, internal and external review, and automation.</p><p>Privacy adds its own requirements: maintaining a <b>data inventory</b>, defining <b>retention</b> schedules, honoring data subject rights including the <b>right to be forgotten</b> (deletion on request unless a lawful basis requires retention), and managing cross-border transfer under data sovereignty rules.</p>"},
{id:"sr32",domain:5,title:"Audits, Assessments, and Security Awareness",tags:["audit","internal audit","external audit","attestation","penetration testing","reconnaissance","awareness","phishing campaign","training"],content:"<p><b>Internal audits</b> are performed by a group independent of the function being reviewed, typically reporting to an audit committee to preserve objectivity. <b>Self-assessments</b> are performed by the team itself — useful for continuous improvement but insufficient where independence is required. <b>External audits</b> come from regulators, certification bodies, or independent third parties and carry greater weight with customers and regulators. <b>Attestation</b> is management's formal assertion that specified controls are in place and operating.</p><p><b>Penetration testing</b> actively attempts exploitation, going beyond the identification a vulnerability scan provides. Environment knowledge defines the type: <b>known</b> (white box) supplies full documentation and credentials for maximum coverage; <b>partially known</b> (gray box) supplies limited information; <b>unknown</b> (black box) supplies nothing, most closely simulating an external attacker. Engagements may be <b>offensive</b> (red team), <b>defensive</b> (blue team), <b>integrated</b> (purple team), or <b>physical</b>.</p><p><b>Reconnaissance</b> divides into <b>passive</b> — gathering from public and third-party sources such as WHOIS, DNS records, and social media without touching the target, generating no logs there — and <b>active</b> — directly interacting through port scanning and banner grabbing, which is detectable. Written <b>rules of engagement</b> and explicit authorization must precede any testing.</p><p><b>Security awareness</b> converts the workforce from a vulnerability into a detection layer. Effective programs run realistic <b>phishing campaigns</b> that measure not only click rate (susceptibility) but <b>report rate</b> — whether users actively flag suspicious mail, which shortens response time to real campaigns. Training should cover anomalous behavior recognition, insider threat indicators, secure handling of sensitive data, password and MFA practice, and clear, frictionless reporting channels. Programs require ongoing development, execution, and effectiveness measurement rather than an annual checkbox.</p>"},
];

// ── Storage ──────────────────────────────────────────────────────────
function lsGet(k,fb){ try{ const v=localStorage.getItem(LS+k); return v!==null?JSON.parse(v):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,JSON.stringify(v)); }catch(e){} }

function blankProgress(cert){
  const sc={}; for(let d=0;d<=5;d++) sc[d]={c:0,t:0};
  return { scores:sc, xp:0, streak:0, lastDay:null, answered:{}, box:{}, due:{},
           marks:{}, notes:{}, history:[], exam:null, seen:{}, labs:{} };
}

let CERT, P, S, ui;

function loadCert(id){
  CERT=CERTS[id];
  P=lsGet('p_'+id,null) || blankProgress(id);
  // heal shape
  if(!P.scores) P.scores={}; for(let d=0;d<=5;d++) if(!P.scores[d]) P.scores[d]={c:0,t:0};
  ['answered','box','due','marks','notes','seen','labs'].forEach(k=>{ if(!P[k]||typeof P[k]!=='object') P[k]={}; });
  if(!Array.isArray(P.history)) P.history=[];
  document.documentElement.setAttribute('data-cert',id);
  document.title='JAEBEASTY Cyber Lab — '+CERT.track+' '+CERT.code;
}
function saveP(){ lsSet('p_'+CERT.id,P); }
function saveS(){ lsSet('settings',S); }

// ── Helpers ──────────────────────────────────────────────────────────
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey=()=>new Date().toISOString().slice(0,10);
const pct=o=>o&&o.t>0?Math.round(o.c/o.t*100):0;
const shortDom=n=>n.replace(/^Network(ing)? /,'').replace(/^Security /,'').replace(/ & Mitigations$/,'');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rank(xp){ const r=CERT.ranks; let cur=r[0],next=r[1]||r[0],i=0;
  for(let k=0;k<r.length;k++) if(xp>=r[k].min){ cur=r[k]; next=r[k+1]||r[k]; i=k; }
  return {cur,next,level:i+1,isMax:i===r.length-1}; }
function daysToExam(){ const d=Math.ceil((new Date(CERT.exam+'T00:00:00')-new Date())/DAY); return d; }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2100); }

function bumpStreak(){
  const t=todayKey();
  if(P.lastDay===t) return;
  const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
  P.streak = (P.lastDay===y) ? (P.streak||0)+1 : 1;
  P.lastDay=t;
}
function todayCount(){ const t=todayKey(); return Object.values(P.answered).filter(a=>a.day===t).length; }

// ── Question pools ───────────────────────────────────────────────────
const qsFor=d=>d===0?CERT.questions:CERT.questions.filter(q=>q.domain===d);
const cardsFor=d=>d===0?CERT.flashcards:CERT.flashcards.filter(f=>f.domain===d);
const refsFor=d=>d===0?CERT.references:CERT.references.filter(r=>r.domain===d);
function dueCards(d){ const now=Date.now(); return cardsFor(d).filter(f=>!P.due[f.id]||P.due[f.id]<=now); }
function weakDomains(){
  const out=[];
  for(let d=1;d<=5;d++){ const s=P.scores[d]; if(s.t>=5&&pct(s)<70) out.push({domain:d,acc:pct(s),n:s.t}); }
  return out.sort((a,b)=>a.acc-b.acc);
}
const countMarks=()=>Object.keys(P.marks).filter(k=>P.marks[k]).length;
const countNotes=()=>Object.keys(P.notes).filter(k=>P.notes[k]&&P.notes[k].trim()).length;

function render(){
  const app=$('#app');
  app.innerHTML = topbar() + '<main class="page fade">' + pageHtml() + footer() + '</main>' + (ui.confirm?confirmModal():'');
  bind();
  window.scrollTo({top:0,behavior:'instant'});

function topbar(){
  const nb=k=>{
    if(k==='exam'&&P.exam&&!P.exam.done) return '<span class="nb warn">•</span>';
    if(k==='weak'){ const n=weakDomains().length; return n?'<span class="nb">'+n+'</span>':''; }
    if(k==='marks'){ const n=countMarks(); return n?'<span class="nb">'+n+'</span>':''; }
    if(k==='notes'){ const n=countNotes(); return n?'<span class="nb">'+n+'</span>':''; }
    if(k==='cards'){ const n=dueCards(0).length; return n?'<span class="nb">'+n+'</span>':''; }
    return '';
  };
  return '<header class="topbar">'+
    '<button class="brand" data-go="home"><span class="brand-mark">JB</span>'+
      '<span><span class="brand-txt">Cyber Lab</span><br><span class="brand-sub">'+CERT.track+' · '+CERT.code+'</span></span></button>'+
    '<nav class="nav">'+NAV.map(n=>'<button data-go="'+n.k+'" class="'+(ui.page===n.k?'on':'')+'">'+ICON[n.i]+'<span>'+n.l+'</span>'+nb(n.k)+'</button>').join('')+'</nav>'+
    '<div class="tb-right">'+
      '<div class="seg">'+Object.values(CERTS).map(c=>'<button data-cert="'+c.id+'" class="'+(c.id===CERT.id?'on':'')+'">'+c.short+'</button>').join('')+'</div>'+
      '<button class="icon-btn" id="themeBtn" title="Toggle theme">'+(S.theme==='dark'?ICON.sun:ICON.moon)+'</button>'+
    '</div></header>';
}

function footer(){
  return '<div class="foot">'+CERT.track+' '+CERT.code+' · '+CERT.questions.length+' questions · '+
    CERT.flashcards.length+' flashcards · '+CERT.references.length+' reading topics · '+CERT.labs.length+' labs<br>'+
    'Progress saves automatically in this browser, separately for each track.</div>';

function pageHtml(){
  switch(ui.page){
    case 'home': return home();
    case 'quiz': return quiz();
    case 'cards': return cards();
    case 'labs': return labs();
    case 'read': return reading();
    case 'exam': return exam();
    case 'weak': return weak();
    case 'marks': return marks();
    case 'notes': return notes();
    case 'stats': return stats();
    case 'timer': return timer();

    '<div class="page-sub">'+CERT.track+' '+CERT.code+' · '+(d>0?d+' days until exam day':d===0?'Exam is today':'Exam date passed')+'</div>'+

      '<button class="btn btn-pri" data-go="quiz">'+ICON.bolt+'Start a quiz</button>'+
      (dueN?'<button class="btn" data-go="cards">'+ICON.cards+'Review '+dueN+'</button>':'')+
    '</div></div>';

  h+='<div class="grid g-4" style="margin-bottom:1rem">'+
    stat('Accuracy',o.t?acc+'%':'—',o.t?o.c+' of '+o.t+' correct':'no answers yet',acc,acc>=75?'ok':acc>=60?'warn':'no')+
    stat('Day streak',(P.streak||0),(P.streak?'keep it alive':'answer one question'),null)+
    stat('Experience',P.xp,r.cur.name,null)+
    stat("Today's goal",done+' / '+goal,gp>=100?'goal met':'questions answered',gp)+

  h+='<div class="grid g-main">';

  // left
  h+='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-title">'+ICON.chart+'Domain mastery</div>';
  let any=false;
  for(let i=1;i<=5;i++){
    const s=P.scores[i], p=pct(s); if(s.t) any=true;
    h+='<div class="dom-row"><span class="dom-n">'+esc(shortDom(CERT.domains[i].name))+'</span>'+
       '<span class="dom-bar"><span class="bar '+(s.t?(p>=75?'ok':p>=60?'warn':'no'):'')+'"><i style="width:'+(s.t?p:0)+'%"></i></span></span>'+
       '<span class="dom-p">'+(s.t?p+'%':'—')+'</span></div>';

  if(!any) h+='<div style="font-size:.83rem;color:var(--text-3);margin-top:.7rem">Answer questions to build your mastery profile.</div>';
  h+='</div>';

  const w=weakDomains();

    h+='<div class="card card-pad"><div class="sec-title">'+ICON.weak+'Needs work</div>'+

  }

  if(P.history.length){
    h+='<div class="card card-pad"><div class="sec-title">'+ICON.exam+'Recent practice exams</div><div>';
    P.history.slice(-4).reverse().forEach(x=>{
      h+='<div class="dom-row"><span class="dom-n">'+new Date(x.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})+
        ' · '+x.correct+'/'+x.total+'</span>'+
        '<span class="chip '+(x.score>=PASSNOW()?'ok':'no')+'">'+x.score+'%</span></div>';
    });
    h+='</div></div>';

  h+='</div>';

  // right rail
  h+='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-title">'+ICON.bolt+'Level</div>'+
     '<div class="badge-lvl"><div class="lvl-ring">'+ringSvg(r.isMax?100:Math.round((P.xp-r.cur.min)/Math.max(1,r.next.min-r.cur.min)*100),44,4)+
     '<span>'+r.level+'</span></div><div><div style="font-weight:700;font-size:.93rem;letter-spacing:-.015em">'+esc(r.cur.name)+'</div>'+
     '<div style="font-size:.78rem;color:var(--text-3)">'+(r.isMax?'Max level reached':(r.next.min-P.xp)+' XP to '+esc(r.next.name))+'</div></div></div></div>';

  h+='<div class="card card-pad"><div class="sec-title">'+ICON.cards+'Flashcards</div>'+
     '<div class="stat-v" style="font-size:1.35rem">'+dueN+' <small>due now</small></div>'+
     '<div style="font-size:.8rem;color:var(--text-3);margin-top:.3rem">'+CERT.flashcards.length+' cards in this track</div>'+
