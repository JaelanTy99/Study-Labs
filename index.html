// ── Interface name normalisation ─────────────────────────────────────
function normIf(n){
  if(!n) return null;
  let s=String(n).trim().toLowerCase().replace(/\s+/g,'');
  const m=s.match(/^([a-z\-]+)([\d\/\.]+)$/); if(!m) return null;
  const p=m[1], num=m[2];
  let full;
  if(/^(g|gi|gig|gigabitethernet)$/.test(p)) full='GigabitEthernet';
  else if(/^(f|fa|fast|fastethernet)$/.test(p)) full='FastEthernet';
  else if(/^(e|eth|ethernet)$/.test(p)) full='Ethernet';
  else if(/^(te|tengig|tengigabitethernet)$/.test(p)) full='TenGigabitEthernet';
  else if(/^(s|se|serial)$/.test(p)) full='Serial';
  else if(/^(vl|vlan)$/.test(p)) full='Vlan';
  else if(/^(lo|loop|loopback)$/.test(p)) full='Loopback';
  else return null;
  return full+num;
}
function shortIf(n){ return n.replace(/^GigabitEthernet/,'Gi').replace(/^FastEthernet/,'Fa')
  .replace(/^TenGigabitEthernet/,'Te').replace(/^Ethernet/,'Et').replace(/^Serial/,'Se')
  .replace(/^Loopback/,'Lo').replace(/^Vlan/,'Vl'); }
const isIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s)&&s.split('.').every(o=>+o>=0&&+o<=255);

// ── Fresh IOS device state ───────────────────────────────────────────
function newIos(spec){
  const st={ mode:'user', host:spec.host||'Router', curIf:null, curAcl:null, curVlan:null, inLine:false,
    ifaces:{}, vlans:{1:'default'}, routes:[], acls:{},
    secret:null, users:{}, ssh:{version:null,keys:false,domain:null},
    svc:{http:true,telnet:true,pwEncrypt:false},
    vty:{transport:'all',login:null} };
  (spec.ifaces||[]).forEach(n=>{ const k=normIf(n)||n;
    st.ifaces[k]={ip:null,mask:null,shut:true,desc:'',swmode:null,vlan:null,trunkVlans:null,aclIn:null,aclOut:null}; });
  if(spec.kind==='switch') st.kind='switch'; else st.kind='router';
  return st;
}
function iosPrompt(st){
  if(st.mode==='user') return st.host+'>';
  if(st.mode==='priv') return st.host+'#';
  if(st.mode==='if')   return st.host+'(config-if)#';
  if(st.mode==='vlan') return st.host+'(config-vlan)#';
  if(st.mode==='line') return st.host+'(config-line)#';
  if(st.mode==='acl')  return st.host+'(config-ext-nacl)#';
  return st.host+'(config)#';
}

// ── Interpreter. Returns array of {t:text, c:class} ──────────────────
function iosExec(st, raw){
  const out=[]; const say=(t,c)=>out.push({t,c:c||''});
  let line=raw.trim(); if(!line) return out;
  const noPre=/^no\s+/i.test(line);
  const cmd=line.replace(/^no\s+/i,'').trim();
  const w=cmd.split(/\s+/); const w0=(w[0]||'').toLowerCase();
  const bad=()=>say('% Invalid input detected at \'^\' marker.','err');
  const needCfg=()=>say('% This command is only available in configuration mode.','err');

  // ---- help ----
  if(line==='?'||w0==='help'){
    say('Available in this simulator:','dim');
    say('  enable · configure terminal · exit · end','dim');
    say('  hostname · interface · ip address · no shutdown · description','dim');
    say('  vlan · name · switchport mode · switchport access vlan · switchport trunk allowed vlan','dim');
    say('  ip route · ip access-list extended · permit · deny · ip access-group','dim');
    say('  enable secret · username · line vty · login local · transport input · ip ssh version','dim');
    say('  crypto key generate rsa · ip domain-name · service password-encryption','dim');
    say('  show ip interface brief · show ip route · show vlan brief · show access-lists · show run','dim');
    return out;
  }
  // ---- mode movement ----
  // bare "enable" changes mode; "enable secret ..." is a config command handled below
  if((w0==='enable'||w0==='en')&&!/^(sec|pass)/i.test(w[1]||'')){ if(st.mode==='user'){st.mode='priv';} else bad(); return out; }
  if(w0==='disable'){ st.mode='user'; return out; }
  if((w0==='configure'&&/^t/i.test(w[1]||''))||(w0==='conf'&&/^t/i.test(w[1]||''))){
    if(st.mode!=='priv'){ say('% Enter privileged mode first (enable).','err'); return out; }
    st.mode='config'; say('Enter configuration commands, one per line. End with CNTL/Z.','dim'); return out;
  }
  if(w0==='end'){ if(st.mode==='user'||st.mode==='priv') bad(); else st.mode='priv'; return out; }
  if(w0==='exit'){
    if(st.mode==='if'||st.mode==='vlan'||st.mode==='line'||st.mode==='acl'){ st.mode='config'; st.curIf=null; st.curAcl=null; st.curVlan=null; }
    else if(st.mode==='config') st.mode='priv';
    else if(st.mode==='priv') st.mode='user';
    return out;
  }

  // ---- show (priv or user) ----
  if(w0==='show'||w0==='sh'){
    const s1=(w[1]||'').toLowerCase(), s2=(w[2]||'').toLowerCase();
    if(s1==='ip'&&/^int/.test(s2)){
      say('Interface                  IP-Address      OK? Method Status                Protocol');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        const status=f.shut?'administratively down':'up';
        say(pad(k,27)+pad(f.ip||'unassigned',16)+'YES manual '+pad(status,22)+(f.shut?'down':'up')); });
      return out;
    }
    if(s1==='ip'&&/^rou/.test(s2)){
      if(!st.routes.length&&!Object.values(st.ifaces).some(f=>f.ip&&!f.shut)){ say('% No routes.','dim'); return out; }
      say('Codes: C - connected, S - static, S* - candidate default','dim');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        if(f.ip&&!f.shut) say('C        '+f.ip+'/'+maskBits(f.mask)+' is directly connected, '+shortIf(k)); });
      st.routes.forEach(r=>say((r.dest==='0.0.0.0'?'S*       0.0.0.0/0 [1/0] via ':'S        '+r.dest+'/'+maskBits(r.mask)+' [1/0] via ')+r.nh));
      return out;
    }
    if(/^vlan/.test(s1)){
      say('VLAN Name                             Status    Ports');
      Object.keys(st.vlans).forEach(v=>{
        const ports=Object.keys(st.ifaces).filter(k=>String(st.ifaces[k].vlan)===String(v)).map(shortIf).join(', ');
        say(pad(v,5)+pad(st.vlans[v],33)+pad('active',10)+ports); });
      return out;
    }
    if(/^acc/.test(s1)){
      const names=Object.keys(st.acls);
      if(!names.length){ say('% No access lists configured.','dim'); return out; }
      names.forEach(n=>{ say('Extended IP access list '+n);
        st.acls[n].forEach((r,i)=>say('    '+((i+1)*10)+' '+r.raw)); });
      return out;
    }
    if(/^run/.test(s1)||(s1==='running-config')){
      say('Building configuration...','dim'); say('!');
      say('hostname '+st.host);
      if(st.secret) say('enable secret *****');
      if(st.svc.pwEncrypt) say('service password-encryption');
      if(!st.svc.http) say('no ip http server');
      Object.keys(st.users).forEach(u=>say('username '+u+' privilege 15 secret *****'));
      if(st.ssh.domain) say('ip domain-name '+st.ssh.domain);
      if(st.ssh.version) say('ip ssh version '+st.ssh.version);
      say('!');
      Object.keys(st.ifaces).forEach(k=>{ const f=st.ifaces[k];
        say('interface '+k);
        if(f.desc) say(' description '+f.desc);
        if(f.ip) say(' ip address '+f.ip+' '+f.mask);
        if(f.swmode) say(' switchport mode '+f.swmode);
        if(f.vlan) say(' switchport access vlan '+f.vlan);
        if(f.trunkVlans) say(' switchport trunk allowed vlan '+f.trunkVlans);
        if(f.aclIn) say(' ip access-group '+f.aclIn+' in');
        if(f.aclOut) say(' ip access-group '+f.aclOut+' out');
        say(f.shut?' shutdown':' no shutdown'); say('!'); });
      st.routes.forEach(r=>say('ip route '+r.dest+' '+r.mask+' '+r.nh));
      Object.keys(st.acls).forEach(n=>{ say('ip access-list extended '+n);
        st.acls[n].forEach(r=>say(' '+r.raw)); say('!'); });
      say('line vty 0 4');
      if(st.vty.login) say(' login '+st.vty.login);
      if(st.vty.transport!=='all') say(' transport input '+st.vty.transport);
      say('end');
      return out;
    }
    bad(); return out;
  }

  if(w0==='ping'){
    const t=w[1];
    if(!isIp(t)){ bad(); return out; }
    const reachable=Object.values(st.ifaces).some(f=>f.ip&&!f.shut&&sameNet(f.ip,f.mask,t))||st.routes.length>0;
    say(reachable?'!!!!! Success rate is 100 percent (5/5)':'..... Success rate is 0 percent (0/5)', reachable?'ok2':'err');
    return out;
  }
  if(w0==='write'||w0==='copy'){ say('Building configuration... [OK]','ok2'); return out; }
  if(w0==='reload'){ say('% Simulator: reload is disabled. Use Reset lab.','dim'); return out; }
  if(w0==='clear'){ return [{t:'__CLEAR__'}]; }

  // ---- everything below needs config mode ----
  if(st.mode==='user'||st.mode==='priv'){ needCfg(); return out; }

  if(w0==='hostname'){ if(!w[1]){bad();return out;} st.host=w[1]; return out; }

  if(w0==='interface'||w0==='int'){
    const n=normIf(w.slice(1).join(''));
    if(!n){ bad(); return out; }
    if(!st.ifaces[n]){ say('% Interface '+n+' does not exist on this device.','err'); return out; }
    st.curIf=n; st.mode='if'; return out;
  }
  if(w0==='vlan'&&st.mode==='config'){
    const v=w[1]; if(!/^\d+$/.test(v)){bad();return out;}
    if(noPre){ delete st.vlans[v]; return out; }
    if(!st.vlans[v]) st.vlans[v]='VLAN'+String(v).padStart(4,'0');
    st.curVlan=v; st.mode='vlan'; return out;
  }
  if(w0==='name'&&st.mode==='vlan'){ st.vlans[st.curVlan]=w.slice(1).join(' '); return out; }

  if(w0==='ip'&&(w[1]||'').toLowerCase()==='route'){
    const [d,m,nh]=[w[2],w[3],w[4]];
    if(!isIp(d)||!isIp(m)||!isIp(nh)){ bad(); return out; }
    if(noPre){ st.routes=st.routes.filter(r=>!(r.dest===d&&r.mask===m&&r.nh===nh)); return out; }
    st.routes.push({dest:d,mask:m,nh}); return out;
  }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='access-list'){
    if(!/^ext/i.test(w[2]||'')){ say('% This simulator supports extended named ACLs only.','err'); return out; }
    const n=w[3]; if(!n){bad();return out;}
    st.acls[n]=st.acls[n]||[]; st.curAcl=n; st.mode='acl'; return out;
  }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='domain-name'){ st.ssh.domain=w[2]||null; return out; }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='ssh'&&(w[2]||'').toLowerCase()==='version'){ st.ssh.version=w[3]; return out; }
  if(w0==='ip'&&(w[1]||'').toLowerCase()==='http'&&(w[2]||'').toLowerCase()==='server'){ st.svc.http=!noPre; return out; }
  if(w0==='crypto'&&/^key/i.test(w[1]||'')){
    if(!st.ssh.domain){ say('% Configure ip domain-name before generating keys.','err'); return out; }
    st.ssh.keys=true; say('The name for the keys will be: '+st.host+'.'+st.ssh.domain,'dim');
    say('% Generating 2048 bit RSA keys ...[OK]','ok2'); return out;
  }
  if(w0==='enable'&&/^sec/i.test(w[1]||'')){ st.secret=w[2]||''; return out; }
  if(w0==='username'){ const u=w[1]; if(!u){bad();return out;} st.users[u]=true; return out; }
  if(w0==='service'&&/^password-enc/i.test(w[1]||'')){ st.svc.pwEncrypt=!noPre; return out; }
  if(w0==='line'){
    if(/^vty/i.test(w[1]||'')){ st.mode='line'; st.inLine=true; return out; }
    st.mode='line'; return out;
  }
  if(st.mode==='line'){
    if(w0==='transport'&&/^in/i.test(w[1]||'')){ st.vty.transport=w.slice(2).join(' ').toLowerCase()||'all'; return out; }
    if(w0==='login'){ st.vty.login=w[1]?w[1].toLowerCase():'password'; return out; }
    if(w0==='password'){ return out; }
    if(w0==='exec-timeout'){ return out; }
  }

  // interface sub-commands
  if(st.mode==='if'){
    const f=st.ifaces[st.curIf];
    if(w0==='ip'&&/^add/i.test(w[1]||'')){
      const ip=w[2], mk=w[3];
      if(!isIp(ip)||!isIp(mk)){ say('% Invalid IP address or mask.','err'); return out; }
      f.ip=ip; f.mask=mk; return out;
    }
    if(w0==='shutdown'){ f.shut=!noPre; return out; }
    if(w0==='description'){ f.desc=w.slice(1).join(' '); return out; }
    if(w0==='switchport'){
      const a=(w[1]||'').toLowerCase();
      if(a==='mode'){ f.swmode=(w[2]||'').toLowerCase(); return out; }
      if(a==='access'&&/^vl/i.test(w[2]||'')){ const v=w[3];
        if(!st.vlans[v]) st.vlans[v]='VLAN'+String(v).padStart(4,'0');
        f.vlan=v; return out; }
      if(a==='trunk'&&/^all/i.test(w[2]||'')&&/^vl/i.test(w[3]||'')){ f.trunkVlans=w[4]; return out; }
      bad(); return out;
    }
    if(w0==='ip'&&/^access-group/i.test(w[1]||'')){
      const n=w[2], dir=(w[3]||'').toLowerCase();
      if(dir==='in') f.aclIn=noPre?null:n; else if(dir==='out') f.aclOut=noPre?null:n; else { bad(); return out; }
      return out;
    }
  }

  // ACL entries
  if(st.mode==='acl'&&(w0==='permit'||w0==='deny')){
    st.acls[st.curAcl].push({act:w0, proto:(w[1]||'').toLowerCase(), raw:cmd.toLowerCase(), parts:w.map(x=>x.toLowerCase())});
    return out;
  }

  bad(); return out;
}
function pad(s,n){ s=String(s); return s.length>=n?s+' ':s+' '.repeat(n-s.length); }
function maskBits(m){ if(!m) return 0; return m.split('.').reduce((a,o)=>a+((+o).toString(2).match(/1/g)||[]).length,0); }
function sameNet(ip,mask,t){
  if(!ip||!mask) return false;
  const n=(a)=>a.split('.').map(Number);
  const [i,m,x]=[n(ip),n(mask),n(t)];
  return i.every((o,k)=>(o&m[k])===(x[k]&m[k]));
}

  ui.labS={ id, out:[], sh:L.type==='cli'?newIos(L.device):null,
            vals:{}, order:L.type==='order'?shuffle(L.items.map(i=>i.id)):[],

  if(L.type==='match'){

        '<button class="mt-i '+(S2.sel===i.id?'sel':'')+'" draggable="true" data-mi="'+i.id+'">'+esc(i.text)+'</button>').join('')
        :'<span class="mt-empty">All items placed — check your work.</span>')+'</div>';
    h+='<div class="mt-targets">'+L.targets.map(t=>{
      const mine=L.items.filter(i=>S2.match[i.id]===t.id);
      return '<div class="mt-t" data-mt="'+t.id+'"><div class="mt-t-l">'+esc(t.label)+'</div><div class="mt-t-drop">'+
        (mine.length?mine.map(i=>{
          const st=S2.res?(i.target===t.id?'good':'bad'):'';
          return '<button class="mt-i '+st+'" data-mi="'+i.id+'">'+esc(i.text)+'</button>';
        }).join(''):'<span class="mt-empty">drop here</span>')+'</div></div>';
    }).join('')+'</div>';
    return h;
  }
  if(L.type==='rules'){
    const rows=S2.vals.rows||(S2.vals.rows=L.rows.map(()=>({act:'',proto:'',src:'',dst:'',port:''})));
    return '<div style="overflow-x:auto"><table class="rt"><thead><tr><th>#</th><th>Action</th><th>Protocol</th><th>Source</th><th>Destination</th><th>Port</th></tr></thead><tbody>'+
      rows.map((r,i)=>{
        const st=S2.res?(S2.res.per['row'+i]?'good':'bad'):'';
        const sel=(k,opts)=>'<select data-row="'+i+'" data-k="'+k+'"><option value="">—</option>'+
          opts.map(o=>'<option'+(r[k]===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
        return '<tr class="'+st+'"><td>'+(i+1)+'</td><td>'+sel('act',['permit','deny'])+'</td>'+
          '<td>'+sel('proto',L.protos)+'</td>'+
          '<td>'+sel('src',L.hosts)+'</td><td>'+sel('dst',L.hosts)+'</td>'+
          '<td>'+sel('port',L.ports)+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
      '<div style="font-size:.78rem;color:var(--text-3);margin-top:.7rem">Rules are evaluated top to bottom — order matters, and there is an implicit deny at the end.</div>';
  }
  return '';
}

         :'<div>'+r.miss.length+' requirement'+(r.miss.length===1?'':'s')+' still unmet:<ul style="margin:.5rem 0 0 1.1rem;line-height:1.7">'+
          r.miss.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul></div>')+
    '</div>';
}

// ── Checking ─────────────────────────────────────────────────────────
const normAns=v=>String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');
function checkLab(){
  const L=labById(ui.lab), S2=ui.labS;
  let total=0, hit=0; const per={}, miss=[];

  if(L.type==='cli'){
    L.goals.forEach(g=>{ total++; let ok=false; try{ ok=g.check(S2.sh); }catch(e){}
      per[g.id]=ok; if(ok) hit++; else miss.push(g.text); });
  }
  if(L.type==='fields'){
    L.fields.forEach(f=>{ total++;
      const v=normAns(S2.vals[f.id]);
      const acc=(f.accept||[f.answer]).map(normAns);
      const ok=!!v&&acc.includes(v);
      per[f.id]=ok; if(ok) hit++; else miss.push(f.label+' — expected '+(f.show||f.answer)); });
  }
  if(L.type==='order'){
    L.items.forEach((it,i)=>{ total++;
      const ok=S2.order[i]===L.correct[i];
      per[L.correct[i]]=S2.order.indexOf(L.correct[i])===i;
      if(ok) hit++; });
    S2.order.forEach((id,i)=>{ per[id]=(id===L.correct[i]); });
    if(hit<total) miss.push('The sequence is not yet in the correct order — correctly placed steps are shown in green.');
  }
  if(L.type==='match'){
    L.items.forEach(i=>{ total++;
      const ok=S2.match[i.id]===i.target;
      per[i.id]=ok; if(ok) hit++;
      else miss.push('"'+i.text+'" is not in the right category.'); });
  }
  if(L.type==='rules'){
    const rows=S2.vals.rows||[];
    L.rows.forEach((want,i)=>{ total++;
      const got=rows[i]||{};
      const ok=Object.keys(want).every(k=>normAns(got[k])===normAns(want[k]));
      per['row'+i]=ok; if(ok) hit++;
      else miss.push('Rule '+(i+1)+' should be: '+want.act+' '+want.proto+' '+want.src+' → '+want.dst+(want.port?' port '+want.port:'')); });
  }

  const score=total?Math.round(hit/total*100):0;
  S2.res={score,per,miss}; S2.checked=true;

  const rec=labRec(L.id);
  const first=!rec.done&&score===100;
  P.labs[L.id]={ done:rec.done||score===100, best:Math.max(rec.best||0,score), tries:(rec.tries||0)+1, at:Date.now() };
  if(score===100){ P.xp+=first?45:12; bumpStreak(); }
  saveP();
  render();
  toast(score===100?(first?'Lab complete — +45 XP':'Lab complete'):'Score: '+score+'% — check the notes');
}

// ── Terminal execution (updates DOM in place, keeps focus) ───────────
function runLabCmd(text){
  const L=labById(ui.lab), S2=ui.labS;
  const term=document.getElementById('labTerm');
  const add=(t,c)=>{ S2.out.push({t,c:c||''});
    if(term){ const d=document.createElement('div'); if(c) d.className=c; d.textContent=t; term.appendChild(d); } };

  add(iosPrompt(S2.sh)+' '+text,'cmd');
  if(text.trim()){ S2.hist.push(text); S2.hi=S2.hist.length; }
  const res=iosExec(S2.sh,text);
  if(res.length===1&&res[0].t==='__CLEAR__'){
    S2.out=[]; if(term) term.innerHTML='';
  } else res.forEach(l=>add(l.t,l.c));

  if(term) term.scrollTop=term.scrollHeight;
  const p=document.getElementById('labPrompt'); if(p) p.textContent=iosPrompt(S2.sh);
  const g=document.getElementById('labGoals'); if(g){ g.innerHTML=goalsHtml(L,S2); bindLabCheck(); }
}
function bindLabCheck(){ const b=document.getElementById('labCheck'); if(b) b.onclick=checkLab; }

// ── Events ───────────────────────────────────────────────────────────
function bindLabs(){
  document.querySelectorAll('[data-lab]').forEach(el=>el.onclick=()=>{ startLab(el.dataset.lab); render(); });
  const back=document.getElementById('labBack'); if(back) back.onclick=()=>{ ui.lab=null; ui.labS=null; render(); };
  const rst=document.getElementById('labReset'); if(rst) rst.onclick=()=>{ startLab(ui.lab); render(); toast('Lab reset'); };
  bindLabCheck();
  if(!ui.lab) return;
  const L=labById(ui.lab), S2=ui.labS; if(!L) return;

  if(L.type==='cli'){
    const inp=document.getElementById('labCmd');
    const term=document.getElementById('labTerm');
    if(term) term.scrollTop=term.scrollHeight;
    if(inp){
      inp.onkeydown=e=>{
        if(e.key==='Enter'){ const v=inp.value; inp.value=''; runLabCmd(v); e.preventDefault(); }
        else if(e.key==='ArrowUp'){ if(S2.hi>0){ S2.hi--; inp.value=S2.hist[S2.hi]||''; } e.preventDefault(); }
        else if(e.key==='ArrowDown'){ if(S2.hi<S2.hist.length-1){ S2.hi++; inp.value=S2.hist[S2.hi]||''; } else { S2.hi=S2.hist.length; inp.value=''; } e.preventDefault(); }
      };
      setTimeout(()=>inp.focus(),30);
    }
  }
  if(L.type==='fields'){
    document.querySelectorAll('[data-fld]').forEach(el=>{
      const k=el.dataset.fld;
      el.oninput=el.onchange=()=>{ S2.vals[k]=el.value; };
    });
  }
  if(L.type==='order'){
    const move=(id,d)=>{ const i=S2.order.indexOf(id), j=i+d;
      if(i<0||j<0||j>=S2.order.length) return;
      S2.order.splice(j,0,S2.order.splice(i,1)[0]); S2.res=null; render(); };
    document.querySelectorAll('[data-up]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); move(el.dataset.up,-1); });
    document.querySelectorAll('[data-down]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); move(el.dataset.down,1); });
    let dragId=null;
    document.querySelectorAll('[data-ord]').forEach(el=>{
      el.ondragstart=()=>{ dragId=el.dataset.ord; el.classList.add('drag'); };
      el.ondragend=()=>{ el.classList.remove('drag'); document.querySelectorAll('.ord-i').forEach(x=>x.classList.remove('over')); };
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
      el.ondragleave=()=>el.classList.remove('over');
      el.ondrop=e=>{ e.preventDefault();
        const t=el.dataset.ord; if(!dragId||dragId===t) return;
        const from=S2.order.indexOf(dragId), to=S2.order.indexOf(t);
        S2.order.splice(to,0,S2.order.splice(from,1)[0]); S2.res=null; render(); };
    });
  }
  if(L.type==='match'){
    document.querySelectorAll('[data-mi]').forEach(el=>{
      const id=el.dataset.mi;
      el.onclick=()=>{
        if(S2.match[id]){ delete S2.match[id]; S2.sel=null; }
        else S2.sel = S2.sel===id?null:id;
        S2.res=null; render();
      };
      el.ondragstart=()=>{ S2.sel=id; };
    });
    document.querySelectorAll('[data-mt]').forEach(el=>{
      const t=el.dataset.mt;
      el.onclick=()=>{ if(S2.sel){ S2.match[S2.sel]=t; S2.sel=null; S2.res=null; render(); } };
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('hot'); };
      el.ondragleave=()=>el.classList.remove('hot');
      el.ondrop=e=>{ e.preventDefault(); el.classList.remove('hot');
        if(S2.sel){ S2.match[S2.sel]=t; S2.sel=null; S2.res=null; render(); } };
    });
  }
  if(L.type==='rules'){
    document.querySelectorAll('[data-row]').forEach(el=>{
      el.onchange=()=>{ const i=+el.dataset.row, k=el.dataset.k;
        S2.vals.rows[i][k]=el.value; };
    });
  }
}

// ── Sound ────────────────────────────────────────────────────────────
let actx;
function beep(ok){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value=ok?720:280; o.type='sine';
    g.gain.setValueAtTime(.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.22);
    o.start(); o.stop(actx.currentTime+.22);
  }catch(e){}
}

  const se=$('#startExam'); if(se) se.onclick=()=>{ buildExam(); render(); };

    const e=P.exam, q=CERT.questions.find(x=>x.id===e.ids[e.i]);

    render();

  const ra=$('#resetAll'); if(ra) ra.onclick=()=>{

function toggleTheme(){
  S.theme = S.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',S.theme);
  saveS(); render();

function switchCert(id){
  if(id===CERT.id) return;
  S.active=id; saveS();
  loadCert(id);
  if(S.examDates[id]) CERT.exam=S.examDates[id];
  initUI();
  render();
  toast('Switched to '+CERT.track+' '+CERT.code);
}
async function exportData(){
  const data={ v:4, at:Date.now(), settings:S, progress:{} };
  Object.keys(CERTS).forEach(id=>{ data.progress[id]=lsGet('p_'+id,null); });
  const json=JSON.stringify(data,null,2);
  const filename='cyber-lab-progress-'+todayKey()+'.json';

  // Hosted on claude.ai the page cannot download directly — it asks the viewer,
  // who confirms. Opened as a local file, fall back to an ordinary link.
  let dl=null;
  try{ if(typeof claude!=='undefined'&&claude.use) dl=await claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename,data:json}); toast('Backup saved'); }
    catch(err){
      const c=err&&err.code;
      if(c==='declined') toast('Download cancelled');
      else if(c==='rate_limited') toast('One at a time — try again in a moment');
      else if(c==='too_large') toast('Backup is too large to save');
      else toast('Could not save the backup');
    }
    return;
  }
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded');
}
function importData(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!d.progress) throw 0;
      Object.keys(d.progress).forEach(id=>{ if(CERTS[id]&&d.progress[id]) lsSet('p_'+id,d.progress[id]); });
      if(d.settings) lsSet('settings',d.settings);
      toast('Progress restored'); setTimeout(()=>location.reload(),700);
    }catch(err){ toast('That file could not be read'); }
  };
  r.readAsText(f);
}

// keyboard
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(ui&&ui.confirm){ if(e.key==='Escape'){ ui.confirm=null; render(); } return; }
  if(ui.page==='quiz'&&ui.quiz){
    const k=e.key.toUpperCase();

    else if(ui.quiz.picked&&(e.key==='Enter'||e.key===' ')){ newQuiz(); render(); e.preventDefault(); }
  }
  if(ui.page==='cards'&&ui.card){
    if(e.key===' '){ ui.cardFlip=!ui.cardFlip; render(); e.preventDefault(); }
    else if(ui.cardFlip&&['1','2','3'].includes(e.key)){ gradeCard(+e.key-1); e.preventDefault(); }
  }
});

// so a click never lands mid-repaint. Only re-render when time runs out.
setInterval(()=>{
  if(ui.page!=='exam'||!P.exam||P.exam.done) return;
  const left=Math.max(0,EXAM_MINS*60000-(Date.now()-P.exam.start));
  if(left<=0){ finishExam(); render(); return; }
  const el=document.querySelector('#examClock');
  if(el){
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    el.textContent=m+':'+String(s).padStart(2,'0');
    el.className='chip'+(m<5?' no':m<15?' warn':'');
  }
},1000);
