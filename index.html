// DOMAIN 2 — Threats, Vulnerabilities, and Mitigations (22%)
// ════════════════════════════════════════════════════════════════════
{id:"sx2_01",domain:2,question:"An attack against a defense contractor uses custom zero-day malware, maintains covert access for fourteen months, and shows no financial motive. Which threat actor is MOST likely responsible?",options:{A:"Unskilled attacker using downloaded tools",B:"Hacktivist seeking publicity",C:"Nation-state actor conducting espionage",D:"Organized crime group seeking ransom"},answer:"C",explanation:"Custom zero-days, long dwell time, high sophistication, and the absence of a financial or publicity motive are hallmarks of a nation-state APT pursuing espionage. Unskilled attackers reuse public tools, hacktivists want visibility, and organized crime monetizes access quickly."},
{id:"sx2_02",domain:2,question:"A finance employee receives a call from someone claiming to be the CFO, urgently demanding a wire transfer and citing a confidential acquisition. Which attack combination BEST describes this?",options:{A:"Smishing using typosquatting",B:"Vishing combined with business email compromise pretexting",C:"Watering hole attack",D:"Credential replay"},answer:"B",explanation:"The phone call makes it vishing (voice phishing), and impersonating an executive with an invented confidential scenario to justify an urgent transfer is pretexting in service of business email compromise. Smishing uses SMS, a watering hole compromises a site the target visits, and credential replay reuses captured authentication data."},
{id:"sx2_03",domain:2,question:"Attackers compromise an industry news site that engineers at a target company read daily, planting a browser exploit. What is this technique called?",options:{A:"Watering hole attack",B:"Brand impersonation",C:"Supply chain attack",D:"On-path attack"},answer:"A",explanation:"A watering hole attack compromises a legitimate third-party site the intended victims habitually visit, waiting for them to arrive rather than contacting them directly. A supply chain attack compromises a vendor's product or update path, and an on-path attack intercepts traffic between two parties."},
{id:"sx2_04",domain:2,question:"A user registers the domain 'micros0ft-support.com' to host a fake login page. Which technique does this represent?",options:{A:"Pharming",B:"Typosquatting and brand impersonation",C:"DNS poisoning",D:"Session hijacking"},answer:"B",explanation:"Registering a lookalike domain that exploits misreading is typosquatting, and presenting it as the legitimate brand is brand impersonation. Pharming and DNS poisoning redirect users who typed the correct domain, and session hijacking steals an already-authenticated session token."},
{id:"sx2_05",domain:2,question:"An application copies user-supplied input into a fixed-length stack buffer without checking length, allowing an attacker to overwrite the return address. Which vulnerability class is this?",options:{A:"Race condition",B:"Buffer overflow",C:"SQL injection",D:"Cross-site scripting"},answer:"B",explanation:"Writing past the end of a fixed-length buffer is a buffer overflow; overwriting the saved return address can redirect execution to attacker-controlled code. Race conditions involve timing between check and use, while SQLi and XSS are injection flaws against a database and a browser respectively."},
{id:"sx2_06",domain:2,question:"A program checks that a file is owned by the user, then opens it moments later. An attacker replaces the file with a symlink between those two operations. Which vulnerability is being exploited?",options:{A:"TOC/TOU race condition",B:"Directory traversal",C:"Memory injection",D:"Integer overflow"},answer:"A",explanation:"Time-of-check to time-of-use is a race condition in which state validated at check time changes before use time. Directory traversal abuses path input to escape a directory, and memory injection writes code into another process's address space."},
{id:"sx2_07",domain:2,question:"A web form passes user input directly into a database query, letting an attacker append \"' OR '1'='1\". Which mitigation is MOST effective?",options:{A:"Enabling TLS on the web server",B:"Using parameterized queries with input validation",C:"Increasing password complexity requirements",D:"Deploying a network IDS in monitor mode"},answer:"B",explanation:"Parameterized (prepared) statements separate code from data so injected syntax is treated as a literal value, and input validation adds defense in depth. TLS protects data in transit but not the query construction, stronger passwords are unrelated, and a passive IDS detects rather than prevents."},
{id:"sx2_08",domain:2,question:"An attacker stores a malicious script in a forum post so that every subsequent visitor's browser executes it. Which attack is this?",options:{A:"Reflected XSS",B:"Stored (persistent) XSS",C:"CSRF",D:"Server-side request forgery"},answer:"B",explanation:"Stored XSS persists the payload on the server so it executes for every user who views the content. Reflected XSS requires the victim to follow a crafted link, CSRF tricks a browser into submitting an authenticated request, and SSRF makes the server itself issue attacker-chosen requests."},
{id:"sx2_09",domain:2,question:"Thousands of small spoofed DNS queries produce large responses directed at a victim's address. Which attack characteristics apply?",options:{A:"Reflected and amplified DDoS",B:"On-path downgrade attack",C:"Credential stuffing",D:"ARP poisoning"},answer:"A",explanation:"Spoofing the victim's source address makes the DNS servers reflect responses to the victim, and the response being much larger than the query provides amplification. This combination defines a reflected, amplified volumetric DDoS."},
{id:"sx2_10",domain:2,question:"An attacker positions themselves between a client and server, forcing the negotiation to an older, weaker cipher suite. Which attack is this?",options:{A:"Birthday attack",B:"Collision attack",C:"Downgrade attack",D:"Pass-the-hash"},answer:"C",explanation:"A downgrade attack manipulates negotiation so both sides settle on a weaker protocol or cipher that the attacker can break. Birthday and collision attacks target hash functions mathematically, and pass-the-hash reuses a captured hash to authenticate."},
{id:"sx2_11",domain:2,question:"Malware encrypts files across a network share and demands payment, while also exfiltrating data and threatening publication. Which term BEST describes this?",options:{A:"Logic bomb",B:"Double-extortion ransomware",C:"Rootkit",D:"Bloatware"},answer:"B",explanation:"Double extortion combines encryption for ransom with data theft and threatened disclosure, so victims with good backups still face pressure. A logic bomb triggers on a condition, a rootkit hides at a privileged level, and bloatware is unwanted preinstalled software."},
{id:"sx2_12",domain:2,question:"An administrator discovers malware operating below the operating system that hides its own files and processes from standard tools. What is it MOST likely?",options:{A:"Keylogger",B:"Worm",C:"Rootkit",D:"Spyware"},answer:"C",explanation:"A rootkit gains privileged (kernel or firmware) access and subverts the OS so its artifacts are invisible to normal utilities. Keyloggers record input, worms self-propagate across networks, and spyware harvests user activity — none inherently operate below the OS to hide themselves."},
{id:"sx2_13",domain:2,question:"A former administrator's script deletes records if their account is ever removed from the payroll system. Which type of malicious code is this?",options:{A:"Trojan",B:"Logic bomb",C:"Virus",D:"Worm"},answer:"B",explanation:"A logic bomb is dormant code that executes when a specific condition is met — here, absence of the account. Trojans masquerade as legitimate software, viruses attach to host files and require user action to spread, and worms propagate autonomously."},
{id:"sx2_14",domain:2,question:"Attackers compromise a software vendor's build system and insert a backdoor into a signed update that customers then install. Which threat vector is this?",options:{A:"Supply chain attack",B:"Removable media attack",C:"Shadow IT",D:"Open service port exploitation"},answer:"A",explanation:"Compromising a trusted vendor so its legitimate, signed distribution channel delivers malicious code is a supply chain attack — the reason signature validity alone does not guarantee safety. Shadow IT is unsanctioned technology adopted by users, not an attack on a vendor."},
{id:"sx2_15",domain:2,question:"Employees deploy an unapproved cloud file-sharing service to move large files, bypassing IT review. Which risk category does this represent?",options:{A:"Nation-state threat",B:"Shadow IT",C:"Hacktivism",D:"Insider threat with malicious intent"},answer:"B",explanation:"Shadow IT is technology adopted without organizational approval or oversight, creating unmanaged data exposure even when users have benign intent. It differs from a malicious insider, whose defining feature is deliberate harm."},
{id:"sx2_16",domain:2,question:"A virtualization host is compromised when an attacker breaks out of a guest and executes code on the hypervisor. Which vulnerability is this?",options:{A:"Resource reuse",B:"VM escape",C:"Sideloading",D:"Jailbreaking"},answer:"B",explanation:"VM escape occurs when code in a guest breaches isolation and reaches the hypervisor or other guests. Resource reuse is data leakage through recycled memory or storage, while sideloading and jailbreaking are mobile-platform issues."},
{id:"sx2_17",domain:2,question:"An organization runs an operating system that the vendor stopped issuing security updates for two years ago. What is the PRIMARY risk?",options:{A:"Reduced performance on modern hardware",B:"Newly discovered vulnerabilities will never be patched",C:"Increased licensing costs",D:"Incompatibility with future file formats"},answer:"B",explanation:"An end-of-life or unsupported system accumulates permanently unpatched vulnerabilities, so exposure grows with every new disclosure. Compensating controls such as isolation, strict ACLs, and enhanced monitoring are required if the system cannot be replaced."},
{id:"sx2_18",domain:2,question:"A network device is deployed with the manufacturer's factory administrator credentials still active. Which mitigation addresses this MOST directly?",options:{A:"Applying a secure configuration baseline that removes default credentials",B:"Enabling jumbo frames",C:"Installing an additional antivirus agent",D:"Increasing log retention"},answer:"A",explanation:"Hardening through a secure baseline explicitly removes or changes default accounts and credentials before the device enters production. Log retention aids investigation after the fact, and antivirus does not address device credential configuration."},
{id:"sx2_19",domain:2,question:"Analysts observe authentication attempts against thousands of accounts using username/password pairs leaked from an unrelated breach. Which attack is this, and which control BEST mitigates it?",options:{A:"Brute force — enforce longer passwords",B:"Credential stuffing — enforce MFA and monitor for impossible travel",C:"Password spraying — disable account lockout",D:"Rainbow table — increase hash iterations"},answer:"B",explanation:"Credential stuffing replays real credential pairs from prior breaches, so complexity rules do not help — the passwords are already valid. MFA blocks reuse of a stolen password alone, and anomaly detection surfaces the distributed login pattern. Password spraying instead tries a few common passwords across many accounts."},
{id:"sx2_20",domain:2,question:"A user on a guest wireless network sees forged ARP replies mapping the gateway IP to an attacker's MAC address. What is the attacker MOST likely attempting?",options:{A:"An on-path attack to intercept traffic",B:"A DNS amplification attack",C:"A privilege escalation attack on the switch",D:"A directory traversal attack"},answer:"A",explanation:"ARP poisoning redirects the victim's traffic through the attacker's machine, establishing an on-path (formerly man-in-the-middle) position for interception or modification. Dynamic ARP Inspection with DHCP snooping is the standard mitigation."},
{id:"sx2_21",domain:2,question:"An attacker submits '../../etc/passwd' to a file-download parameter and receives the system password file. Which vulnerability is present?",options:{A:"Cross-site request forgery",B:"Directory traversal",C:"Server-side request forgery",D:"Command injection"},answer:"B",explanation:"Directory traversal uses relative path sequences to escape the intended directory and read arbitrary files. Canonicalizing paths and validating input against an allow list prevents it."},
{id:"sx2_22",domain:2,question:"After exploiting a low-privilege service account, an attacker abuses a misconfigured sudo rule to gain root. Which stage does this represent?",options:{A:"Reconnaissance",B:"Privilege escalation",C:"Initial access",D:"Exfiltration"},answer:"B",explanation:"Moving from limited to elevated permissions on an already-compromised host is privilege escalation. Least privilege, careful sudo configuration, and patching escalation vulnerabilities are the primary mitigations."},
{id:"sx2_23",domain:2,question:"A security team wants to reduce the blast radius if a single workstation is compromised. Which mitigation technique is MOST appropriate?",options:{A:"Segmentation with least-privilege access control lists",B:"Increasing password length to sixteen characters",C:"Enabling verbose application logging",D:"Deploying a honeypot in the DMZ"},answer:"A",explanation:"Segmentation limits lateral movement so a compromise is contained to a smaller zone, and least-privilege ACLs restrict what that zone can reach. Logging and honeypots improve detection and intelligence but do not by themselves limit blast radius."},
{id:"sx2_24",domain:2,question:"A vulnerability is actively exploited in the wild before the vendor has released any patch. What is this called?",options:{A:"A zero-day vulnerability",B:"A false positive",C:"A legacy vulnerability",D:"A misconfiguration"},answer:"A",explanation:"A zero-day is exploited before a fix exists, leaving defenders zero days of patch availability. Because patching is impossible, response relies on virtual patching, segmentation, behavioral detection, and threat intelligence."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 3 — Security Architecture (18%)
// ════════════════════════════════════════════════════════════════════
{id:"sx3_01",domain:3,question:"An organization uses IaaS. Under the shared responsibility model, who is responsible for patching the guest operating system on a provisioned virtual machine?",options:{A:"The cloud provider, as part of infrastructure maintenance",B:"The customer",C:"Responsibility is shared equally by contract",D:"Neither party — IaaS instances patch themselves"},answer:"B",explanation:"In IaaS the provider secures the physical facility, hardware, and hypervisor, while the customer owns everything from the guest OS upward — patching, configuration, applications, and data. Responsibility shifts toward the provider as you move to PaaS and SaaS."},
{id:"sx3_02",domain:3,question:"A firewall is configured so that if the inspection process crashes, all traffic is blocked until service is restored. Which design principle is this?",options:{A:"Fail-open",B:"Fail-closed",C:"Active-active clustering",D:"Passive tap deployment"},answer:"B",explanation:"Fail-closed (fail-secure) denies traffic when the control fails, favoring security over availability. Fail-open permits traffic to preserve availability. The correct choice depends on whether an outage or an unfiltered breach is the greater risk for that system."},
{id:"sx3_03",domain:3,question:"A monitoring appliance receives a copy of network traffic from a SPAN port and cannot drop packets. How is this device BEST described?",options:{A:"Inline and active",B:"Out-of-band and passive",C:"Inline and passive",D:"Out-of-band and active"},answer:"B",explanation:"Receiving mirrored traffic places the device out of band (a tap/monitor deployment), and its inability to affect traffic makes it passive — characteristic of an IDS. An IPS placed inline sits in the traffic path and can actively block."},
{id:"sx3_04",domain:3,question:"Administrators must reach production servers only through a single hardened, heavily logged host that sits between the user network and the secure zone. What is this host called?",options:{A:"Jump server",B:"Reverse proxy",C:"Load balancer",D:"Screened subnet"},answer:"A",explanation:"A jump server (bastion host) is a single hardened, monitored entry point into a protected zone, concentrating access control and audit. A reverse proxy fronts published services for clients, and a screened subnet is the network segment itself rather than the access host."},
{id:"sx3_05",domain:3,question:"Which device inspects HTTP requests for SQL injection and cross-site scripting patterns before they reach a web application?",options:{A:"Layer 4 stateful firewall",B:"Web application firewall",C:"Network access control appliance",D:"Forward proxy"},answer:"B",explanation:"A WAF operates at Layer 7 and understands HTTP semantics, so it can identify application-layer attacks such as SQLi and XSS. A Layer 4 firewall makes decisions on ports and connection state and cannot parse request payloads meaningfully."},
{id:"sx3_06",domain:3,question:"An organization wants remote users' internet-bound traffic inspected by cloud-delivered security services, with policy applied consistently regardless of location. Which architecture BEST fits?",options:{A:"Site-to-site IPsec VPN",B:"SASE (Secure Access Service Edge)",C:"Screened subnet with a jump server",D:"802.1X port-based authentication"},answer:"B",explanation:"SASE converges network connectivity (SD-WAN) with cloud-delivered security (secure web gateway, CASB, ZTNA, firewall as a service) so users receive uniform policy anywhere. A site-to-site VPN links fixed locations and does not deliver distributed cloud inspection."},
{id:"sx3_07",domain:3,question:"Which statement correctly distinguishes IPsec tunnel mode from transport mode?",options:{A:"Tunnel mode encrypts only the payload; transport mode encrypts the entire packet",B:"Tunnel mode encrypts the entire original packet and adds a new IP header; transport mode protects the payload only",C:"Both modes are identical except for the port used",D:"Transport mode is used only between security gateways"},answer:"B",explanation:"Tunnel mode encapsulates the whole original IP packet inside a new one, hiding the internal addressing — the standard for gateway-to-gateway VPNs. Transport mode protects only the payload and keeps the original header, typically for host-to-host communication."},
{id:"sx3_08",domain:3,question:"A control system running a plant's physical processes uses a deterministic operating system where task timing is guaranteed. Which term describes this environment?",options:{A:"RTOS within an ICS/SCADA environment",B:"Serverless computing platform",C:"Containerized microservice",D:"Software-defined network controller"},answer:"A",explanation:"A real-time operating system provides deterministic, time-guaranteed scheduling, which industrial control and SCADA systems require. These environments typically cannot tolerate reboots or aggressive patching, so segmentation and strict access control carry the security burden."},
{id:"sx3_09",domain:3,question:"Two data centers 800 miles apart both run production workloads and share traffic. Which resilience concepts does this implement?",options:{A:"Cold site with parallel processing",B:"Geographic dispersion with an active-active configuration",C:"Warm site with clustering",D:"Single point of failure with load balancing"},answer:"B",explanation:"Separating sites by significant distance provides geographic dispersion against regional disasters, and both sites serving live traffic makes the configuration active-active. A cold site holds no running systems, and a warm site holds partial capacity awaiting activation."},
{id:"sx3_10",domain:3,question:"An organization follows a 3-2-1 backup strategy. What does it require?",options:{A:"Three full backups taken two times daily to one location",B:"Three copies of data on two different media types with one copy offsite",C:"Three encryption keys, two administrators, and one vault",D:"Three-year retention with two audits and one restore test"},answer:"B",explanation:"3-2-1 means three copies of the data, stored on two distinct media types, with at least one copy kept offsite (often immutable or air-gapped) to survive site loss and ransomware that targets connected backups."},
{id:"sx3_11",domain:3,question:"Which recovery test validates the plan by having stakeholders discuss their roles against a scenario WITHOUT touching production systems?",options:{A:"Failover test",B:"Parallel processing test",C:"Tabletop exercise",D:"Full interruption test"},answer:"C",explanation:"A tabletop exercise is discussion based — participants walk through a scenario to surface gaps at minimal cost and zero operational risk. Failover and full interruption tests actually move or stop production workloads."},
{id:"sx3_12",domain:3,question:"A database column stores national ID numbers. The security team must ensure the data is unreadable if the storage media is stolen. Which control applies?",options:{A:"Encryption at rest",B:"Encryption in transit",C:"Hashing with a salt",D:"Network segmentation"},answer:"A",explanation:"Encryption at rest protects stored data against physical theft of drives or backups. Encryption in transit protects data moving over networks, and hashing is one-way — unsuitable when the original values must be retrieved."},
{id:"sx3_13",domain:3,question:"A multinational company must keep EU customer records on servers physically located in the EU. Which concept drives this requirement?",options:{A:"Data sovereignty",B:"Data masking",C:"Data classification",D:"Data retention"},answer:"A",explanation:"Data sovereignty holds that data is subject to the laws of the country where it resides, so regulations may mandate in-region storage and processing. Classification labels sensitivity, retention governs how long data is kept, and masking obscures values for display."},
{id:"sx3_14",domain:3,question:"An 802.1X deployment authenticates devices before granting network access. Which component acts as the authenticator?",options:{A:"The end-user device requesting access",B:"The switch or wireless access point",C:"The RADIUS server",D:"The certificate authority"},answer:"B",explanation:"In 802.1X the supplicant is the client device, the authenticator is the switch or AP controlling the port, and the authentication server (typically RADIUS) makes the decision. The authenticator enforces the result by opening or holding the port."},
{id:"sx3_15",domain:3,question:"Which infrastructure approach defines networks through code and centralized controllers rather than device-by-device configuration?",options:{A:"Software-defined networking",B:"Physical isolation",C:"Serverless computing",D:"Virtual desktop infrastructure"},answer:"A",explanation:"SDN separates the control plane from the data plane and manages forwarding centrally through programmable interfaces, enabling consistent, automated policy. Infrastructure as code applies the same philosophy to provisioning generally."},
{id:"sx3_16",domain:3,question:"A company deploys identical workloads across two different cloud providers to avoid dependence on either. Which consideration is being addressed?",options:{A:"Platform diversity and vendor lock-in reduction",B:"Data sovereignty",C:"Least privilege",D:"Non-repudiation"},answer:"A",explanation:"Multi-cloud and platform diversity reduce the impact of a single provider's outage, pricing change, or compromise, at the cost of added operational complexity and skill requirements."},
{id:"sx3_17",domain:3,question:"Which pair correctly matches an insecure protocol with its secure replacement?",options:{A:"Telnet → SSH and FTP → SFTP",B:"HTTPS → HTTP and SSH → Telnet",C:"SNMPv3 → SNMPv1 and LDAPS → LDAP",D:"SFTP → TFTP and SSH → rlogin"},answer:"A",explanation:"Telnet transmits credentials in cleartext and is replaced by SSH; FTP is replaced by SFTP (over SSH) or FTPS (over TLS). The other options invert the relationship, moving from secure to insecure protocols."},
{id:"sx3_18",domain:3,question:"An organization must minimize the attack surface of an internet-facing server. Which action contributes MOST directly?",options:{A:"Disabling unnecessary services and closing unused ports",B:"Increasing the log retention period",C:"Adding a second network interface",D:"Enabling verbose error messages for troubleshooting"},answer:"A",explanation:"Attack surface is the sum of exposed entry points, so removing unneeded services and ports directly shrinks it. Verbose errors actually increase exposure by leaking implementation detail to attackers."},
{id:"sx3_19",domain:3,question:"A load balancer distributes traffic across identical web servers and removes a node when its health check fails. Which two properties does this provide?",options:{A:"Confidentiality and non-repudiation",B:"Availability and scalability",C:"Integrity and authentication",D:"Accountability and auditability"},answer:"B",explanation:"Load balancing keeps the service reachable when individual nodes fail (availability) and allows capacity to grow by adding nodes (scalability). It does not by itself provide confidentiality, integrity, or identity assurance."},
{id:"sx3_20",domain:3,question:"An uninterruptible power supply and a backup generator are installed. Which role does each play?",options:{A:"The UPS provides long-term power; the generator bridges brief outages",B:"The UPS bridges brief outages and enables graceful transition; the generator sustains extended outages",C:"Both provide identical redundancy and either alone is sufficient",D:"Neither affects availability; both are detective controls"},answer:"B",explanation:"A UPS supplies immediate battery power for seconds to minutes, covering brief sags and allowing clean shutdown or transfer, while a generator supplies sustained power for long outages once it starts and stabilizes. They are complementary, not interchangeable."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 4 — Security Operations (28%)
// ════════════════════════════════════════════════════════════════════
{id:"sx4_01",domain:4,question:"Place the incident response phases in the correct order according to the standard model.",options:{A:"Detection → Preparation → Containment → Recovery → Eradication → Lessons learned",B:"Preparation → Detection and analysis → Containment → Eradication → Recovery → Lessons learned",C:"Preparation → Containment → Detection → Eradication → Lessons learned → Recovery",D:"Detection → Containment → Recovery → Eradication → Preparation → Lessons learned"},answer:"B",explanation:"Preparation comes first and is ongoing. After detection and analysis confirm an incident, containment limits spread, eradication removes the cause, recovery restores normal operations with validation, and lessons learned drives improvement back into preparation."},
{id:"sx4_02",domain:4,question:"During a ransomware incident, responders immediately disconnect affected hosts from the network while preserving them powered on. Which phase and goal does this serve?",options:{A:"Eradication — removing the malware binaries",B:"Containment — limiting spread while preserving volatile evidence",C:"Recovery — restoring service to users",D:"Preparation — building the response capability"},answer:"B",explanation:"Isolating hosts is containment, stopping lateral movement and further encryption. Keeping them powered on preserves volatile evidence such as memory contents, encryption keys, and network connections that would be lost on shutdown."},
{id:"sx4_03",domain:4,question:"In digital forensics, which document records every person who handled evidence, along with dates and purposes?",options:{A:"Legal hold notice",B:"Acquisition report",C:"E-discovery request",D:"Chain of custody"},answer:"D",explanation:"The chain of custody records each transfer and handler of evidence so its integrity can be demonstrated in court. A legal hold suspends routine deletion, e-discovery is the process of producing electronic evidence, and acquisition documents how a copy was made."},
{id:"sx4_04",domain:4,question:"Which order of volatility should an examiner follow when collecting evidence from a live system?",options:{A:"Disk, then memory, then CPU cache, then network connections",B:"CPU registers and cache, then memory, then network state, then disk, then backups",C:"Backups, then disk, then memory, then registers",D:"Memory, then registers, then backups, then disk"},answer:"B",explanation:"Collect the most volatile data first, because it disappears fastest: CPU registers and cache, then RAM, then network connections and running state, then persistent disk, and finally archival backups and remote logs."},
{id:"sx4_05",domain:4,question:"A SIEM correlates authentication logs from a domain controller with VPN logs and flags a login from two countries twelve minutes apart. What is this detection called?",options:{A:"Impossible travel",B:"Alert tuning",C:"Log aggregation",D:"False negative"},answer:"A",explanation:"Impossible travel (risky sign-in) flags authentications whose geographic separation could not be covered in the elapsed time, a strong indicator of credential compromise. Aggregation is the collection of logs; tuning adjusts rule thresholds."},
{id:"sx4_06",domain:4,question:"An IPS generates hundreds of daily alerts for benign internal scanning traffic, causing analysts to ignore the queue. Which action is MOST appropriate?",options:{A:"Disable the IPS entirely",B:"Perform alert tuning to suppress or refine the known-benign rule",C:"Increase alert volume to improve coverage",D:"Delete the historical alerts"},answer:"B",explanation:"Alert tuning refines thresholds, adds exceptions for verified benign sources, and reduces false positives so real detections are visible. Disabling the sensor removes coverage, and deleting history destroys investigative value."},
{id:"sx4_07",domain:4,question:"A vulnerability scanner reports a critical finding that investigation proves does not exist on the host. What is this?",options:{A:"False negative",B:"True positive",C:"False positive",D:"Zero-day"},answer:"C",explanation:"A false positive is an alert for a condition that is not actually present; it wastes analyst time and erodes trust in tooling. A false negative — a real vulnerability the scanner missed — is more dangerous because it leaves genuine exposure invisible."},
{id:"sx4_08",domain:4,question:"Which scoring system provides a standardized numeric severity rating for a vulnerability, incorporating factors such as attack vector and impact?",options:{A:"CVE",B:"CVSS",C:"SCAP",D:"OSINT"},answer:"B",explanation:"CVSS produces a 0.0–10.0 severity score from base, temporal, and environmental metrics. CVE is the unique identifier for a specific vulnerability, and SCAP is the protocol suite for automating security configuration and vulnerability assessment."},
{id:"sx4_09",domain:4,question:"A critical vulnerability exists on a system that cannot be patched before the next maintenance window. Management formally documents acceptance of the risk for 30 days. What has been created?",options:{A:"A compensating control",B:"An exception with a defined expiration",C:"A false positive",D:"A risk transfer"},answer:"B",explanation:"A documented, time-bounded exception records leadership's decision to accept a known risk temporarily, with an owner and expiry so it is revisited. It is a governance artifact — distinct from a compensating control, which is an actual technical or procedural safeguard."},
{id:"sx4_10",domain:4,question:"Which testing method analyzes application source code for vulnerabilities WITHOUT executing the program?",options:{A:"DAST",B:"SAST",C:"Fuzzing",D:"Penetration testing"},answer:"B",explanation:"Static application security testing inspects source or bytecode at rest, catching flaws early in development. DAST tests a running application from the outside, and fuzzing feeds malformed input to a running target to trigger faults."},
{id:"sx4_11",domain:4,question:"A penetration tester is given no prior information about the target environment and must discover everything independently. Which engagement type is this?",options:{A:"Known environment (white box)",B:"Partially known environment (gray box)",C:"Unknown environment (black box)",D:"Integrated assessment"},answer:"C",explanation:"An unknown-environment test most closely simulates an external attacker with no insider knowledge. Known-environment testing supplies full documentation and credentials for depth and efficiency, while partially known testing provides limited information."},
{id:"sx4_12",domain:4,question:"A tester queries public DNS records, WHOIS data, and employee LinkedIn profiles without touching the target's systems. Which activity is this?",options:{A:"Active reconnaissance",B:"Passive reconnaissance",C:"Privilege escalation",D:"Exploitation"},answer:"B",explanation:"Passive reconnaissance gathers information from third-party and public sources without interacting with target systems, so it generates no logs on the target. Active reconnaissance — port scanning, banner grabbing — touches the target directly and is detectable."},
{id:"sx4_13",domain:4,question:"Which control set BEST implements least privilege for a database administrator who needs elevated rights only during scheduled maintenance?",options:{A:"Permanent membership in the domain admins group",B:"Just-in-time access with credential checkout from a password vault and session recording",C:"A shared administrator account documented in a spreadsheet",D:"A local administrator account with a non-expiring password"},answer:"B",explanation:"Privileged access management grants elevation only for the window it is needed (just-in-time), issues ephemeral or vaulted credentials, and records the session for accountability. Standing privileges and shared accounts violate least privilege and destroy attribution."},
{id:"sx4_14",domain:4,question:"An access model grants permissions based on the user's job function, assigning rights to a position rather than to individuals. Which model is this?",options:{A:"Discretionary access control",B:"Mandatory access control",C:"Role-based access control",D:"Attribute-based access control"},answer:"C",explanation:"RBAC ties permissions to roles that users hold, simplifying administration and joiner/mover/leaver processes. DAC lets data owners grant access at their discretion, MAC enforces system-wide labels, and ABAC evaluates multiple attributes such as device, location, and time."},
{id:"sx4_15",domain:4,question:"Which access control model enforces classification labels and clearances that individual data owners cannot override?",options:{A:"Mandatory access control",B:"Discretionary access control",C:"Role-based access control",D:"Rule-based access control"},answer:"A",explanation:"MAC applies system-enforced labels (e.g., Confidential, Secret) against subject clearances, and users cannot change them — the model used in government and military environments. DAC, by contrast, places sharing decisions in the owner's hands."},
{id:"sx4_16",domain:4,question:"An enterprise wants users to authenticate once and access multiple cloud applications without re-entering credentials, using assertions between an identity provider and service providers. Which technology fits BEST?",options:{A:"SAML-based federated single sign-on",B:"RADIUS accounting",C:"Kerberos ticket renewal within a single domain",D:"Local password synchronization"},answer:"A",explanation:"SAML exchanges signed XML assertions between an identity provider and service providers, enabling federated SSO across organizational and cloud boundaries. Kerberos provides SSO but within a single realm, and password synchronization simply copies credentials without federating identity."},
{id:"sx4_17",domain:4,question:"Which pair correctly identifies OAuth 2.0 and OpenID Connect?",options:{A:"OAuth handles authentication; OIDC handles encryption",B:"OAuth handles authorization (delegated access); OIDC adds an authentication identity layer on top",C:"Both are authentication protocols with no authorization function",D:"OIDC replaces TLS for API traffic"},answer:"B",explanation:"OAuth 2.0 is an authorization framework that issues access tokens for delegated resource access without sharing passwords. OpenID Connect layers on top of OAuth to provide verified identity through an ID token — authentication."},
{id:"sx4_18",domain:4,question:"An organization requires a hardware security key that must be physically present and tapped to complete login. Which factor category does this satisfy, and what advantage does it hold over SMS codes?",options:{A:"Something you know — it is easier to remember",B:"Something you have — it resists SIM-swap and phishing relay attacks",C:"Something you are — it uses biometric matching",D:"Somewhere you are — it verifies geographic location"},answer:"B",explanation:"A security key is a possession factor. FIDO2/WebAuthn keys cryptographically bind the authentication to the legitimate site's origin, so a phished user cannot relay the response to a fake site — and unlike SMS, there is no SIM to hijack."},
{id:"sx4_19",domain:4,question:"A biometric system is tuned so that fewer unauthorized users are wrongly accepted, but more legitimate users are wrongly rejected. Which rates changed?",options:{A:"FAR decreased and FRR increased",B:"FAR increased and FRR decreased",C:"Both FAR and FRR decreased",D:"CER increased while FAR and FRR held constant"},answer:"A",explanation:"The false acceptance rate fell (fewer impostors admitted) while the false rejection rate rose (more valid users denied). These move inversely as sensitivity is adjusted; the crossover error rate is the point where they are equal and is used to compare systems."},
{id:"sx4_20",domain:4,question:"Which email authentication mechanism publishes a policy telling receivers what to do with messages that fail SPF and DKIM, and where to send reports?",options:{A:"SPF",B:"DKIM",C:"DMARC",D:"S/MIME"},answer:"C",explanation:"DMARC builds on SPF (authorized sending hosts) and DKIM (cryptographic signature) by publishing an enforcement policy — none, quarantine, or reject — plus reporting addresses. S/MIME encrypts and signs individual messages rather than validating the sending domain."},
{id:"sx4_21",domain:4,question:"A tool monitors endpoints for suspicious behavior, records process lineage, and allows analysts to isolate a host and roll back changes remotely. Which capability is this?",options:{A:"EDR (Endpoint Detection and Response)",B:"DLP (Data Loss Prevention)",C:"NAC (Network Access Control)",D:"FIM (File Integrity Monitoring)"},answer:"A",explanation:"EDR continuously records endpoint telemetry, detects behavioral indicators, and gives responders remote containment and remediation actions. DLP focuses on preventing data exfiltration, NAC governs network admission, and FIM watches for unauthorized file changes."},
{id:"sx4_22",domain:4,question:"An organization must prevent employees from emailing spreadsheets containing customer credit card numbers. Which control is designed for this?",options:{A:"Data loss prevention with content inspection",B:"Full-disk encryption",C:"Network access control",D:"Security information and event management"},answer:"A",explanation:"DLP inspects content in motion, at rest, and in use against patterns and classifications, then blocks or quarantines violations. Full-disk encryption protects stolen devices, and SIEM aggregates and correlates logs for detection rather than enforcement."},
{id:"sx4_23",domain:4,question:"Which tool detects unauthorized modification of critical system binaries and configuration files by comparing them against a known-good baseline?",options:{A:"File integrity monitoring",B:"Antivirus signature scanning",C:"NetFlow analysis",D:"SNMP trap collection"},answer:"A",explanation:"FIM hashes critical files and alerts when the current hash deviates from the trusted baseline, catching tampering that signature-based antivirus may miss. NetFlow describes traffic flows, and SNMP traps report device events."},
{id:"sx4_24",domain:4,question:"Before a decommissioned server leaves the building, the organization must guarantee stored data cannot be recovered, and must prove it. Which combination is appropriate?",options:{A:"Quick format and a disposal receipt",B:"Cryptographic erase or physical destruction, with a certificate of destruction",C:"Deleting files and emptying the recycle bin",D:"Overwriting the partition table only"},answer:"B",explanation:"Sanitization must render data unrecoverable — cryptographic erase (destroying the encryption key), degaussing, or physical destruction — and a certificate of destruction provides auditable proof. Formatting and deleting leave recoverable data intact."},
{id:"sx4_25",domain:4,question:"An organization allows employees to use personal phones for work email, enforcing containerization and remote wipe of corporate data only. Which deployment model is this?",options:{A:"COPE (Corporate-Owned, Personally Enabled)",B:"BYOD (Bring Your Own Device)",C:"CYOD (Choose Your Own Device)",D:"Kiosk mode deployment"},answer:"B",explanation:"BYOD uses employee-owned hardware, so controls must separate corporate data into a managed container that can be wiped without destroying personal content. COPE and CYOD both involve company-purchased devices with broader management authority."},
{id:"sx4_26",domain:4,question:"A security team automates account creation, group assignment, and mailbox provisioning triggered by an HR system event. Which benefit is MOST directly realized?",options:{A:"Elimination of the need for access reviews",B:"Consistent, faster provisioning with reduced human error",C:"Guaranteed prevention of privilege escalation attacks",D:"Removal of the requirement for MFA"},answer:"B",explanation:"Orchestrated provisioning applies the same vetted workflow every time, cutting turnaround and eliminating manual mistakes and omissions. It complements — but does not replace — periodic access reviews, MFA, and other controls."},
{id:"sx4_27",domain:4,question:"Analysts proactively search historical telemetry for signs of an adversary already in the environment, forming and testing hypotheses without any triggering alert. What is this practice?",options:{A:"Threat hunting",B:"Vulnerability scanning",C:"Penetration testing",D:"Root cause analysis"},answer:"A",explanation:"Threat hunting is hypothesis-driven and proactive, assuming compromise and looking for evidence that automated detection missed. Vulnerability scanning finds weaknesses rather than active intruders, and root cause analysis follows a known incident."},
{id:"sx4_28",domain:4,question:"During a phishing simulation, an organization measures how many users report the message rather than only how many click. Why does the reporting metric matter?",options:{A:"It replaces the need for email filtering",B:"It measures whether users act as active detection, shortening response time to real campaigns",C:"It determines the CVSS score of the campaign",D:"It satisfies the chain of custody requirement"},answer:"B",explanation:"Click rate measures susceptibility, but report rate measures whether the workforce functions as a sensor. Fast, frequent reporting lets the security team pull real malicious mail from other inboxes before more users engage."},

// DOMAIN 5 — Security Program Management and Oversight (20%)
// ════════════════════════════════════════════════════════════════════
{id:"sx5_01",domain:5,question:"A single asset is valued at $200,000. A flood would destroy 40% of it, and such floods are expected once every 20 years. What is the annualized loss expectancy?",options:{A:"$80,000",B:"$4,000",C:"$10,000",D:"$40,000"},answer:"B",explanation:"SLE = asset value × exposure factor = $200,000 × 0.40 = $80,000. ARO = 1/20 = 0.05. ALE = SLE × ARO = $80,000 × 0.05 = $4,000. ALE is the figure compared against the annual cost of a control to justify spending."},
{id:"sx5_02",domain:5,question:"An organization purchases cyber insurance to cover breach response costs. Which risk management strategy is this?",options:{A:"Risk avoidance",B:"Risk mitigation",C:"Risk transference",D:"Risk acceptance"},answer:"C",explanation:"Transference shifts financial impact to a third party, typically through insurance or contractual terms. Note that reputational damage and regulatory obligations generally cannot be transferred — only the monetary consequence is shifted."},
{id:"sx5_03",domain:5,question:"After analysis, a company decides to discontinue a product line entirely because its regulatory exposure is unacceptable. Which strategy is this?",options:{A:"Risk avoidance",B:"Risk acceptance",C:"Risk transference",D:"Risk mitigation"},answer:"A",explanation:"Avoidance eliminates the risk by ceasing the activity that creates it. Mitigation reduces likelihood or impact while continuing the activity, and acceptance continues it with the risk formally acknowledged."},
{id:"sx5_04",domain:5,question:"A business impact analysis defines RTO as 4 hours and RPO as 15 minutes for a system. What do these values mean?",options:{A:"The system may be down 15 minutes and lose 4 hours of data",B:"The system must be restored within 4 hours, and no more than 15 minutes of data may be lost",C:"Backups run every 4 hours and are retained 15 minutes",D:"Mean time to repair is 4 hours and mean time between failures is 15 minutes"},answer:"B",explanation:"Recovery time objective is the maximum tolerable duration of the outage; recovery point objective is the maximum tolerable data loss measured backward from the incident. An RPO of 15 minutes requires replication or backup intervals no longer than that."},
{id:"sx5_05",domain:5,question:"Which metric expresses the average time required to restore a failed system to service?",options:{A:"MTBF",B:"MTTR",C:"RPO",D:"ARO"},answer:"B",explanation:"Mean time to repair measures average restoration time and reflects maintainability. MTBF measures average operating time between failures (reliability), RPO expresses tolerable data loss, and ARO is annual frequency of a risk event."},
{id:"sx5_06",domain:5,question:"A risk register lists an entry with an assigned owner, a current score, a threshold, and a key risk indicator. What is the PURPOSE of the risk owner field?",options:{A:"To identify who caused the risk",B:"To name the individual accountable for monitoring and managing that risk",C:"To record who will be disciplined if the risk materializes",D:"To indicate which auditor reviewed the entry"},answer:"B",explanation:"The risk owner is accountable for tracking the risk, ensuring treatment progresses, and escalating when the score crosses the defined threshold. Assigning ownership prevents risks from sitting unmanaged in the register."},
{id:"sx5_07",domain:5,question:"An organization's leadership states it will pursue aggressive growth and tolerate elevated risk in new markets. Which term describes this stance?",options:{A:"Conservative risk appetite",B:"Expansionary risk appetite",C:"Risk threshold",D:"Residual risk"},answer:"B",explanation:"Risk appetite is the broad level of risk leadership is willing to pursue; an expansionary appetite accepts higher risk for growth, while a conservative appetite prioritizes protection. A threshold is the specific trigger value for action, and residual risk is what remains after controls."},
{id:"sx5_08",domain:5,question:"After implementing controls, some risk remains. What is this remaining risk called, and who must formally accept it?",options:{A:"Inherent risk — accepted by the security team",B:"Residual risk — accepted by senior management or the risk owner",C:"Transferred risk — accepted by the insurer",D:"Avoided risk — accepted by the auditor"},answer:"B",explanation:"Residual risk is what remains after mitigation, and formal acceptance is a business decision belonging to senior management or the designated risk owner — not to technical staff. Inherent risk is the level before any controls are applied."},
{id:"sx5_09",domain:5,question:"Which agreement type specifically defines measurable performance commitments such as uptime percentage and response times, with remedies for failure?",options:{A:"NDA",B:"MOU",C:"SLA",D:"BPA"},answer:"C",explanation:"A service level agreement sets quantifiable performance targets and the consequences of missing them. An NDA protects confidential information, an MOU expresses non-binding intent, and a BPA governs a partnership between businesses."},
{id:"sx5_10",domain:5,question:"An organization wants contractual authority to inspect a cloud vendor's security controls directly. Which clause should it negotiate?",options:{A:"Right-to-audit clause",B:"Non-disclosure agreement",C:"Memorandum of understanding",D:"Statement of work"},answer:"A",explanation:"A right-to-audit clause preserves the customer's ability to assess the vendor's controls, either directly or through an independent assessor. Without it, the customer may be limited to whatever attestations the vendor chooses to share."},
{id:"sx5_11",domain:5,question:"Under privacy regulation, which party determines the purposes and means of processing personal data?",options:{A:"The data processor",B:"The data controller",C:"The data custodian",D:"The data subject"},answer:"B",explanation:"The controller decides why and how personal data is processed and bears primary accountability. The processor acts on the controller's instructions, the custodian handles day-to-day technical safeguarding, and the data subject is the individual the data describes."},
{id:"sx5_12",domain:5,question:"A customer invokes their right to erasure. What must the organization generally do?",options:{A:"Retain the data indefinitely for audit purposes",B:"Delete the personal data unless a lawful basis requires retention",C:"Transfer the data to another controller only",D:"Anonymize the data but keep all identifiers"},answer:"B",explanation:"The right to be forgotten obliges deletion of personal data on request, subject to overriding legal obligations such as regulatory retention or ongoing litigation holds. A documented data inventory is what makes locating and honoring such requests feasible."},
{id:"sx5_13",domain:5,question:"Which document is a formal statement by management asserting that specified controls are in place and operating?",options:{A:"Attestation",B:"Risk register",C:"Playbook",D:"Acceptable use policy"},answer:"A",explanation:"An attestation is management's formal assertion regarding controls, frequently accompanying compliance reporting and independent audits. A playbook is a procedural response guide, and an AUP governs acceptable use of organizational systems."},
{id:"sx5_14",domain:5,question:"Which policy defines what employees may and may not do with corporate systems, and is typically acknowledged at onboarding?",options:{A:"Business continuity policy",B:"Acceptable use policy",C:"Incident response policy",D:"Change management policy"},answer:"B",explanation:"The acceptable use policy sets the boundaries of permitted system and network use and provides the documented basis for enforcement. Signed acknowledgement at onboarding establishes that the user was informed."},
{id:"sx5_15",domain:5,question:"Which consequence of non-compliance is MOST likely to permanently end an organization's ability to operate in a regulated industry?",options:{A:"Reputational damage",B:"Loss of license",C:"Contractual penalties",D:"Increased audit frequency"},answer:"B",explanation:"Losing a required operating license removes legal authorization to conduct the regulated business at all. Fines, contractual penalties, and reputational harm are serious but generally survivable; revocation is existential."},
{id:"sx5_16",domain:5,question:"An internal group independent of IT reviews control effectiveness and reports directly to the board. What is this function?",options:{A:"External regulatory examination",B:"Internal audit reporting to an audit committee",C:"Penetration testing team",D:"Change advisory board"},answer:"B",explanation:"Internal audit evaluates controls objectively and reports to an audit committee to preserve independence from the management it reviews. External examinations are conducted by regulators or third parties outside the organization."},
{id:"sx5_17",domain:5,question:"Which activity is performed BEFORE signing with a new vendor to evaluate its financial stability, security posture, and legal standing?",options:{A:"Due diligence",B:"Right-to-audit exercise",C:"Offboarding review",D:"Tabletop exercise"},answer:"A",explanation:"Due diligence is the pre-contract investigation of a prospective vendor's viability and control environment. Ongoing vendor monitoring, questionnaires, and audits continue the assessment throughout the relationship."},
{id:"sx5_18",domain:5,question:"Which governance structure characteristic distinguishes a centralized model from a decentralized one?",options:{A:"Centralized structures push decision authority to individual business units",B:"Centralized structures concentrate decision authority, improving consistency but reducing local flexibility",C:"Decentralized structures always produce stronger security outcomes",D:"The two are functionally identical in regulated industries"},answer:"B",explanation:"Centralized governance concentrates policy and decision-making for uniformity and easier compliance demonstration, at the cost of responsiveness to local needs. Decentralized governance gains agility but risks inconsistent control application."},
{id:"sx5_19",domain:5,question:"An organization conducts recurring risk assessments on a fixed quarterly cadence. How is this assessment type classified?",options:{A:"Ad hoc",B:"One-time",C:"Recurring",D:"Continuous"},answer:"C",explanation:"Recurring assessments happen on a defined schedule. Ad hoc assessments are triggered by a specific event or request, one-time assessments support a single decision such as an acquisition, and continuous assessment uses automated tooling for ongoing visibility."},
{id:"sx5_20",domain:5,question:"During offboarding, which action MOST directly reduces the risk of unauthorized access by a departing employee?",options:{A:"Scheduling an exit interview",B:"Disabling accounts and revoking credentials at or before the termination time",C:"Archiving the employee's email after 90 days",D:"Updating the org chart"},answer:"B",explanation:"Timely deprovisioning closes the window in which valid credentials could be used after employment ends — the core control in the offboarding procedure. It should be coordinated with HR so it happens at the moment of separation, along with asset return."},

const SEC_FLASHCARDS = [
// Domain 1 — General Security Concepts
{id:"s1_f01",domain:1,term:"CIA Triad",definition:"The three core goals of information security: Confidentiality (only authorized parties can read data), Integrity (data is accurate and unaltered), and Availability (data and systems are accessible when needed).",example:"Encrypting a database protects confidentiality, hashing files detects integrity loss, and clustering the database servers preserves availability during a node failure."},
{id:"s1_f02",domain:1,term:"Non-repudiation",definition:"Assurance that a party cannot credibly deny having performed an action. Achieved through digital signatures, logging, and audit trails.",example:"A contract signed with the sender's private key cannot later be disowned, because only that key holder could have produced the signature."},
{id:"s1_f03",domain:1,term:"AAA (Authentication, Authorization, Accounting)",definition:"Authentication proves identity, authorization determines what that identity may do, and accounting records what was actually done.",example:"You log in with MFA (authentication), your role grants read access to the finance share (authorization), and the SIEM logs every file you open (accounting)."},
{id:"s1_f04",domain:1,term:"Control Categories",definition:"Technical (implemented in technology), Managerial (policies and risk decisions), Operational (executed by people day to day), and Physical (tangible barriers).",example:"A firewall rule is technical, the change management policy is managerial, the guard's nightly walkthrough is operational, and the door lock is physical."},
{id:"s1_f05",domain:1,term:"Control Types",definition:"Preventive (stops it), Deterrent (discourages it), Detective (identifies it), Corrective (fixes it after), Compensating (substitutes when the primary control is impossible), and Directive (instructs).",example:"A locked door is preventive, a warning sign deterrent, a camera detective, a restore from backup corrective, VLAN isolation of an unpatchable device compensating, and the AUP directive."},
{id:"s1_f06",domain:1,term:"Zero Trust",definition:"A security model that grants no implicit trust based on network location. Every request is authenticated, authorized, and continuously evaluated against policy.",example:"An employee already on the corporate LAN still must satisfy device posture, identity, and context checks before the Policy Enforcement Point allows access to a finance app."},
{id:"s1_f07",domain:1,term:"Symmetric vs Asymmetric Encryption",definition:"Symmetric uses one shared key for both encryption and decryption — fast, but key distribution is hard. Asymmetric uses a public/private key pair — slower, but solves key exchange and enables signatures.",example:"TLS uses asymmetric cryptography to exchange a session key, then switches to symmetric AES for the bulk of the data because it is far faster."},
{id:"s1_f08",domain:1,term:"Hashing",definition:"A one-way function producing a fixed-length digest from input of any size. Used for integrity verification and password storage — it cannot be reversed.",example:"Comparing the SHA-256 hash of a downloaded ISO against the vendor's published hash confirms the file was not altered or corrupted in transit."},
{id:"s1_f09",domain:1,term:"Salting",definition:"Adding a unique random value to each password before hashing, so identical passwords produce different digests and precomputed rainbow tables become useless.",example:"Two users both choose 'Summer2026', but unique salts mean their stored hashes are completely different, forcing an attacker to crack each one individually."},
{id:"s1_f10",domain:1,term:"PKI (Public Key Infrastructure)",definition:"The framework of certificate authorities, registration authorities, certificates, and revocation mechanisms that binds public keys to verified identities.",example:"A browser trusts a bank's site because the certificate chains up through an intermediate CA to a root CA already in the browser's trust store."},
{id:"s1_f11",domain:1,term:"TPM vs HSM",definition:"A TPM is a chip on a device's motherboard storing keys and boot measurements for that one machine. An HSM is a dedicated appliance performing high-volume key operations for an enterprise.",example:"BitLocker seals its key to the laptop's TPM; a payment processor uses a network HSM to sign thousands of transactions per second."},
{id:"s1_f12",domain:1,term:"Tokenization vs Masking",definition:"Tokenization replaces sensitive data with an unrelated surrogate stored in a vault, and is reversible via lookup. Masking permanently obscures part of a value for display and is not reversible.",example:"A card number becomes token 8f3a-99b2 in the database (tokenization), while a support agent's screen shows ************4471 (masking)."},

// Domain 2 — Threats, Vulnerabilities, and Mitigations
{id:"s2_f01",domain:2,term:"Threat Actor Types",definition:"Nation-state (highly resourced, espionage), Organized crime (financial), Hacktivist (ideological), Insider (authorized access), Unskilled attacker (uses others' tools), Shadow IT (unsanctioned internal technology).",example:"A 14-month stealth intrusion with custom zero-days points to a nation-state; a fast encrypt-and-demand-payment attack points to organized crime."},
{id:"s2_f02",domain:2,term:"Phishing Family",definition:"Phishing (email), Spear phishing (targeted), Whaling (executives), Vishing (voice), Smishing (SMS), Pharming (DNS redirection), Watering hole (compromising a site the target visits).",example:"A call impersonating the CFO demanding an urgent wire is vishing; a fake login page on a lookalike domain reached by email is classic phishing."},
{id:"s2_f03",domain:2,term:"Business Email Compromise (BEC)",definition:"An attack impersonating a trusted executive, vendor, or partner to induce fraudulent payments or data disclosure — often with no malware at all.",example:"An 'urgent and confidential' request from the CEO's lookalike address instructs accounting to wire funds to a new vendor account before quarter close."},
{id:"s2_f04",domain:2,term:"Ransomware",definition:"Malware that encrypts data and demands payment. Double extortion adds data theft with a threat to publish, so backups alone do not remove the leverage.",example:"Files across the network share are renamed with a new extension, a ransom note appears, and the attacker posts a sample of stolen records on a leak site."},
{id:"s2_f05",domain:2,term:"Trojan / Worm / Virus",definition:"A Trojan masquerades as legitimate software, a worm self-propagates across networks without user action, and a virus attaches to a host file and needs the user to run it.",example:"A worm spreading through an unpatched SMB service needs no clicks; a Trojan disguised as a free PDF tool needs the user to install it."},
{id:"s2_f06",domain:2,term:"Rootkit",definition:"Malware operating at kernel or firmware level that subverts the operating system to hide its own files, processes, and network activity from standard tools.",example:"Task Manager shows nothing unusual, but boot-level integrity checks and offline forensic imaging reveal hidden persistence."},
{id:"s2_f07",domain:2,term:"Logic Bomb",definition:"Dormant malicious code that executes when a specific condition is met, such as a date, a file change, or the absence of an account.",example:"A departing administrator leaves a script that wipes records if their account disappears from the payroll database."},
{id:"s2_f08",domain:2,term:"SQL Injection",definition:"Inserting SQL syntax into input that is concatenated into a query, allowing an attacker to read, modify, or destroy database contents. Prevented by parameterized queries.",example:"Entering ' OR '1'='1 into a login field makes the WHERE clause always true, bypassing authentication entirely."},
{id:"s2_f09",domain:2,term:"XSS (Cross-Site Scripting)",definition:"Injecting script that executes in other users' browsers. Stored XSS persists on the server; reflected XSS requires a crafted link; DOM-based XSS occurs entirely client side.",example:"A script saved in a forum post steals the session cookie of every user who views the thread — stored XSS."},
{id:"s2_f10",domain:2,term:"Buffer Overflow",definition:"Writing more data into a fixed-length memory buffer than it can hold, corrupting adjacent memory and potentially overwriting the return address to redirect execution.",example:"Submitting 500 bytes into a 64-byte stack buffer overwrites the saved return address, pointing execution at attacker-supplied shellcode."},
{id:"s2_f11",domain:2,term:"Race Condition (TOC/TOU)",definition:"A flaw where system state validated at time-of-check changes before time-of-use, letting an attacker substitute a different resource in the gap.",example:"A program verifies a file's owner, then opens it a moment later — an attacker swaps the file for a symlink to /etc/shadow in between."},
{id:"s2_f12",domain:2,term:"Privilege Escalation",definition:"Gaining higher permissions than originally granted. Vertical escalation moves to a higher privilege level; horizontal escalation moves to another user's access at the same level.",example:"A compromised low-privilege service account exploits a misconfigured sudo rule to obtain root — vertical escalation."},
{id:"s2_f13",domain:2,term:"On-Path Attack",definition:"An attacker inserts themselves between two communicating parties to intercept or modify traffic. Formerly called man-in-the-middle.",example:"ARP poisoning maps the gateway IP to the attacker's MAC, routing all victim traffic through the attacker before it reaches the real gateway."},
{id:"s2_f14",domain:2,term:"Credential Stuffing vs Password Spraying",definition:"Credential stuffing replays real username/password pairs from prior breaches against many sites. Password spraying tries a few common passwords across many accounts to avoid lockout.",example:"Thousands of accounts hit once each with a known-valid leaked pair is stuffing; every account tried with 'Winter2026!' is spraying."},
{id:"s2_f15",domain:2,term:"Supply Chain Attack",definition:"Compromising a trusted vendor, library, or update mechanism so that malicious code reaches customers through a legitimate, often signed, channel.",example:"A poisoned build server inserts a backdoor into a vendor's signed update, which thousands of customers install as routine maintenance."},
{id:"s2_f16",domain:2,term:"Zero-Day",definition:"A vulnerability exploited before the vendor has released a patch, leaving defenders zero days of remediation lead time.",example:"With no patch available, the team relies on segmentation, virtual patching at the WAF, and behavioral detection until a fix ships."},

// Domain 3 — Security Architecture
{id:"s3_f01",domain:3,term:"Shared Responsibility Model",definition:"Defines the split of security duties between cloud provider and customer. Provider secures 'of the cloud'; customer secures 'in the cloud'. The line moves with IaaS, PaaS, and SaaS.",example:"In IaaS you patch the guest OS and configure the security groups; in SaaS the provider handles nearly everything except your data, identities, and access settings."},
{id:"s3_f02",domain:3,term:"IDS vs IPS",definition:"An IDS detects and alerts on suspicious traffic, typically deployed out of band and passive. An IPS sits inline and can actively block traffic in real time.",example:"An IDS on a SPAN port raises an alert about an exploit attempt; an inline IPS drops the packet before it ever reaches the server."},
{id:"s3_f03",domain:3,term:"Fail-Open vs Fail-Closed",definition:"Fail-open permits traffic when a control fails, prioritizing availability. Fail-closed blocks traffic when a control fails, prioritizing security.",example:"A data-center firewall is set fail-closed so a crash cannot expose systems; a fire-exit door is fail-open so people can always escape."},
{id:"s3_f04",domain:3,term:"Jump Server (Bastion Host)",definition:"A single hardened, heavily monitored host that serves as the only entry point into a protected network zone, concentrating access control and audit.",example:"Admins SSH to the bastion with MFA and session recording; only that host is permitted to reach production management interfaces."},
{id:"s3_f05",domain:3,term:"WAF (Web Application Firewall)",definition:"A Layer 7 firewall that parses HTTP and blocks application attacks such as SQL injection, XSS, and directory traversal — including as virtual patching for unpatched apps.",example:"A WAF rule blocks requests containing traversal sequences while developers work on a permanent code fix."},
{id:"s3_f06",domain:3,term:"IPsec Tunnel vs Transport Mode",definition:"Tunnel mode encrypts the entire original packet and adds a new IP header, hiding internal addressing. Transport mode protects only the payload, keeping the original header.",example:"Site-to-site VPNs between gateways use tunnel mode; host-to-host protection inside a trusted network can use transport mode."},
{id:"s3_f07",domain:3,term:"SASE",definition:"Secure Access Service Edge — converges SD-WAN connectivity with cloud-delivered security (SWG, CASB, ZTNA, FWaaS) so policy follows the user anywhere.",example:"A remote employee's traffic is inspected by the nearest cloud PoP under the same rules they would get in the office."},
{id:"s3_f08",domain:3,term:"802.1X",definition:"Port-based network access control. The supplicant (client) requests access, the authenticator (switch or AP) controls the port, and the authentication server (RADIUS) decides.",example:"A laptop without a valid certificate is placed on a quarantine VLAN instead of the corporate network."},
{id:"s3_f09",domain:3,term:"Encryption at Rest vs In Transit",definition:"At rest protects stored data against theft of media or backups. In transit protects data moving across networks against interception.",example:"Full-disk encryption defends a stolen laptop (at rest); TLS defends the same data as it travels to the server (in transit)."},
{id:"s3_f10",domain:3,term:"Data Sovereignty",definition:"The principle that data is subject to the laws of the jurisdiction where it physically resides, which may mandate in-region storage and processing.",example:"EU customer records must remain on EU-based servers to satisfy regulatory obligations, constraining which cloud regions may be used."},
{id:"s3_f11",domain:3,term:"Hot / Warm / Cold Site",definition:"Hot — fully equipped and running, near-instant failover. Warm — hardware and connectivity ready, data must be loaded. Cold — space and power only, everything must be built.",example:"A hot site takes over in minutes at high cost; a cold site is cheap but may take weeks to bring online."},
{id:"s3_f12",domain:3,term:"RAID vs Backup",definition:"RAID provides fault tolerance against drive failure and keeps systems running. Backups provide recovery from deletion, corruption, and ransomware. RAID is not a backup.",example:"RAID 5 survives one failed disk, but ransomware encrypts the array instantly — only an offline backup restores the data."},
{id:"s3_f13",domain:3,term:"3-2-1 Backup Rule",definition:"Keep three copies of data, on two different media types, with at least one copy offsite — ideally immutable or air-gapped.",example:"Production data, a local NAS copy, and an immutable cloud copy in another region satisfies 3-2-1 and survives site loss."},
{id:"s3_f14",domain:3,term:"UPS vs Generator",definition:"A UPS supplies immediate battery power for seconds to minutes, covering sags and enabling clean transition. A generator sustains power for extended outages once started.",example:"The UPS carries the load during the 30 seconds the generator needs to start and stabilize."},

// Domain 4 — Security Operations
{id:"s4_f01",domain:4,term:"Incident Response Lifecycle",definition:"Preparation → Detection and Analysis → Containment → Eradication → Recovery → Lessons Learned. Preparation is continuous and lessons learned feeds back into it.",example:"Isolating infected hosts is containment; wiping and rebuilding them is eradication; restoring verified-clean service is recovery."},
{id:"s4_f02",domain:4,term:"Order of Volatility",definition:"Collect evidence most-volatile first: CPU registers and cache → RAM → network state → disk → backups and archives.",example:"Responders capture a memory image before powering down, since RAM may hold encryption keys and injected code that vanish on shutdown."},
{id:"s4_f03",domain:4,term:"Chain of Custody",definition:"Documentation of every person who handled evidence, when, and why — required to demonstrate integrity and admissibility.",example:"Each transfer of the imaged drive is signed and timestamped, with the hash recorded to prove the copy never changed."},
{id:"s4_f04",domain:4,term:"Legal Hold",definition:"A directive suspending normal data destruction and retention schedules because the data may be relevant to litigation or investigation.",example:"Upon notice of a lawsuit, the 90-day mailbox purge is halted for named custodians until counsel releases the hold."},
{id:"s4_f05",domain:4,term:"SIEM",definition:"Security Information and Event Management — aggregates logs from many sources, normalizes and correlates them, and generates alerts and reports.",example:"Correlating VPN logs with domain authentication reveals an impossible-travel login that neither source would flag alone."},
{id:"s4_f06",domain:4,term:"EDR / XDR",definition:"EDR records endpoint telemetry, detects behavioral threats, and enables remote isolation and remediation. XDR extends the same correlation across network, email, cloud, and identity.",example:"EDR shows the full process tree from the malicious macro to the encryption routine, and the analyst isolates the host with one click."},
{id:"s4_f07",domain:4,term:"DLP (Data Loss Prevention)",definition:"Inspects data in motion, at rest, and in use against classification rules, then blocks, quarantines, or alerts on policy violations.",example:"An outbound email containing a spreadsheet of card numbers is blocked at the gateway and routed to a reviewer."},
{id:"s4_f08",domain:4,term:"False Positive vs False Negative",definition:"A false positive alerts on something benign, wasting analyst time and eroding trust. A false negative misses a real threat, leaving genuine exposure undetected.",example:"A scanner flagging a patched service is a false positive; missing an actively exploited flaw is the far more dangerous false negative."},
{id:"s4_f09",domain:4,term:"CVE vs CVSS",definition:"CVE is the unique public identifier for a specific vulnerability. CVSS is the 0.0–10.0 severity score derived from base, temporal, and environmental metrics.",example:"CVE-2024-XXXX identifies the flaw; its CVSS base score of 9.8 tells you to prioritize it — adjusted by your own environmental context."},
{id:"s4_f10",domain:4,term:"SAST vs DAST",definition:"SAST analyzes source code without executing it, catching flaws early. DAST tests a running application from the outside, finding runtime and configuration issues.",example:"SAST flags an unsanitized query in the repository; DAST confirms the deployed endpoint is actually injectable."},
{id:"s4_f11",domain:4,term:"Penetration Test Environments",definition:"Known (white box) — full information supplied. Partially known (gray box) — limited information. Unknown (black box) — no information, simulating an external attacker.",example:"An unknown-environment engagement measures what a real outsider could achieve; a known-environment test maximizes coverage per hour."},
{id:"s4_f12",domain:4,term:"Passive vs Active Reconnaissance",definition:"Passive gathers information from public and third-party sources without touching the target. Active interacts directly with target systems and is detectable.",example:"Reading WHOIS records and LinkedIn profiles is passive; running an Nmap scan against the perimeter is active."},
{id:"s4_f13",domain:4,term:"Access Control Models",definition:"DAC — owner decides. MAC — system enforces labels and clearances. RBAC — permissions attach to job roles. ABAC — decisions evaluate multiple attributes. Rule-based — global conditional rules.",example:"A government system uses MAC so no user can share Secret data downward; a corporate file server uses RBAC tied to department."},
{id:"s4_f14",domain:4,term:"SAML vs OAuth vs OIDC",definition:"SAML exchanges signed XML assertions for federated SSO. OAuth 2.0 authorizes delegated access via tokens. OpenID Connect adds an identity layer on top of OAuth for authentication.",example:"SAML logs you into the enterprise HR portal; OAuth lets an app read your calendar without your password; OIDC tells the app who you are."},
{id:"s4_f15",domain:4,term:"PAM (Privileged Access Management)",definition:"Controls administrative access through just-in-time elevation, credential vaulting, ephemeral credentials, and session recording — eliminating standing privilege.",example:"A DBA checks out a time-limited credential for a maintenance window; it expires automatically and the session is recorded."},
{id:"s4_f16",domain:4,term:"SPF, DKIM, DMARC",definition:"SPF lists authorized sending hosts. DKIM cryptographically signs messages. DMARC publishes the enforcement policy for failures and requests reports.",example:"With DMARC set to reject, mail spoofing your domain that fails SPF and DKIM is discarded by receiving servers rather than delivered."},

// Domain 5 — Security Program Management and Oversight
{id:"s5_f01",domain:5,term:"SLE, ARO, ALE",definition:"SLE = Asset Value × Exposure Factor (loss per event). ARO = expected occurrences per year. ALE = SLE × ARO (expected annual loss).",example:"A $200,000 asset with a 40% exposure factor gives an SLE of $80,000; at one flood every 20 years (ARO 0.05) the ALE is $4,000."},
{id:"s5_f02",domain:5,term:"Risk Management Strategies",definition:"Mitigate (reduce likelihood or impact), Transfer (shift financial impact, e.g. insurance), Avoid (stop the activity), Accept (acknowledge and proceed, formally documented).",example:"Cyber insurance transfers breach cost; discontinuing a risky product line avoids the risk entirely."},
{id:"s5_f03",domain:5,term:"Risk Appetite vs Risk Tolerance vs Threshold",definition:"Appetite is the broad level of risk leadership will pursue (expansionary, neutral, conservative). Tolerance is acceptable variation. Threshold is the specific value triggering action.",example:"An expansionary appetite accepts higher risk in new markets, but a risk score above 15 still triggers mandatory escalation."},
{id:"s5_f04",domain:5,term:"Inherent vs Residual Risk",definition:"Inherent risk exists before any controls are applied. Residual risk remains after controls, and must be formally accepted by management or the risk owner.",example:"After MFA and segmentation reduce a critical risk from high to low, that remaining low risk is signed off by the business owner."},
{id:"s5_f05",domain:5,term:"RTO vs RPO",definition:"RTO is the maximum tolerable time to restore service after an outage. RPO is the maximum tolerable amount of data loss, measured backward from the incident.",example:"An RTO of 4 hours and RPO of 15 minutes requires fast failover plus replication or backups no less frequent than every 15 minutes."},
{id:"s5_f06",domain:5,term:"MTTR vs MTBF",definition:"Mean Time To Repair is the average time to restore a failed system (maintainability). Mean Time Between Failures is the average operating time between failures (reliability).",example:"A component with high MTBF fails rarely; low MTTR means that when it does fail, service returns quickly."},
{id:"s5_f07",domain:5,term:"Business Impact Analysis (BIA)",definition:"Identifies critical business functions, the impact of their loss over time, and their dependencies — producing the RTO and RPO values that drive continuity planning.",example:"The BIA shows order processing loses $50,000 per hour, justifying a hot site that other systems do not warrant."},
{id:"s5_f08",domain:5,term:"Risk Register",definition:"The central record of identified risks, each with a description, owner, likelihood and impact scores, treatment plan, threshold, and key risk indicators.",example:"Each entry names an accountable owner so risks are actively managed and escalated rather than sitting unreviewed."},
