<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JAEBEASTY Cyber Lab v4</title>
<meta name="theme-color" content="#faf9f7">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#faf9f7;
  --surface:#ffffff;
  --surface-2:#f4f3f0;
  --surface-3:#eeece8;
  --border:#e8e5e0;
  --border-2:#dbd7d0;

  --text:#1c1b1f;
  --text-2:#63626b;
  --text-3:#96949e;

  --accent:#5b5bd6;
  --accent-2:#8b7bf0;
  --accent-soft:#f1f0fb;
  --accent-ink:#ffffff;

  --ok:#12864a;
  --ok-bg:#eefaf2;
  --ok-br:#8bd9ae;
  --no:#d11d45;
  --no-bg:#fff0f3;
  --no-br:#f5aebe;
  --warn:#b45309;
  --warn-bg:#fdf5e7;

  --r-lg:16px;
  --r-md:11px;
  --r-sm:8px;
  --shadow:0 1px 2px rgba(28,27,31,.05),0 1px 3px rgba(28,27,31,.04);
  --shadow-lg:0 8px 28px rgba(28,27,31,.10),0 2px 8px rgba(28,27,31,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --topbar-h:60px;
}

html[data-theme="dark"]{
  --bg:#131317;
  --surface:#1b1b20;
  --surface-2:#232329;
  --surface-3:#2c2c33;
  --border:#2e2e36;
  --border-2:#3a3a44;
  --text:#f0eff4;
  --text-2:#a9a7b4;
  --text-3:#7d7b88;
  --accent:#8b8bf5;
  --accent-2:#a99cff;
  --accent-soft:#242240;
  --accent-ink:#12121a;
  --ok:#4ade80;
  --ok-bg:#12261b;
  --ok-br:#2f6b47;
  --no:#fb7185;
  --no-bg:#2a1319;
  --no-br:#7a2d3d;
  --warn:#fbbf24;
  --warn-bg:#2a2113;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 10px 34px rgba(0,0,0,.45);
}
/* ═══ palette schemes — selected with html[data-scheme] ═══ */
html[data-scheme="slate"]{--bg:#eef1f5;--surface:#ffffff;--surface-2:#f5f7fa;--surface-3:#e8edf3;--border:#dbe2ea;--border-2:#c7d1dc;--text:#0f1720;--text-2:#4a5867;--text-3:#7d8b9a;--accent:#0b74d4;--accent-2:#3d9ae8;--accent-soft:#e4f0fd;--accent-ink:#ffffff;--ok:#0f7a43;--ok-bg:#e8f6ee;--ok-br:#86ceaa;--no:#c81e46;--no-bg:#fdecf0;--no-br:#f0a8bb;--warn:#a35a06;--warn-bg:#fdf3e6;}
html[data-scheme="slate"][data-theme="dark"]{--bg:#0e1319;--surface:#161d26;--surface-2:#1d2631;--surface-3:#26313e;--border:#2a3542;--border-2:#3a4756;--text:#e8eef5;--text-2:#a3b1c0;--text-3:#74838f;--accent:#4aa8f0;--accent-2:#7cc4f7;--accent-soft:#10283d;--accent-ink:#04121e;--ok:#3ddc84;--ok-bg:#0e2a1b;--ok-br:#2a6b46;--no:#ff6b8a;--no-bg:#2b1119;--no-br:#7a2f44;--warn:#f0b429;--warn-bg:#2b2110;}
html[data-scheme="slate"][data-cert="secplus"]{--accent:#0d7f74;--accent-2:#14a394;--accent-soft:#e2f4f1;--accent-ink:#ffffff;}
html[data-scheme="slate"][data-cert="secplus"][data-theme="dark"]{--accent:#2dd4bf;--accent-2:#5eead4;--accent-soft:#0d2b28;--accent-ink:#04201d;}
html[data-scheme="ember"]{--bg:#f7f5f2;--surface:#fffefc;--surface-2:#f2efea;--surface-3:#e9e4dc;--border:#e2dcd2;--border-2:#d2cabd;--text:#1b1815;--text-2:#5c554c;--text-3:#8d8478;--accent:#a06a00;--accent-2:#c98a10;--accent-soft:#fdf2dc;--accent-ink:#ffffff;--ok:#16794a;--ok-bg:#e9f5ef;--ok-br:#8ccdb0;--no:#c62a3d;--no-bg:#fdedee;--no-br:#efa9b0;--warn:#96601a;--warn-bg:#fbf1e0;}
html[data-scheme="ember"][data-theme="dark"]{--bg:#14120f;--surface:#1c1916;--surface-2:#242019;--surface-3:#2e2921;--border:#342f27;--border-2:#443d33;--text:#f2ede4;--text-2:#b3a998;--text-3:#857c6e;--accent:#e0a832;--accent-2:#f0c25e;--accent-soft:#2e2412;--accent-ink:#1a1408;--ok:#4ade80;--ok-bg:#12261b;--ok-br:#2f6b47;--no:#fb7185;--no-bg:#2a1319;--no-br:#7a3d4d;--warn:#fbbf24;--warn-bg:#2a2113;}
html[data-scheme="ember"][data-cert="secplus"]{--accent:#0f766e;--accent-2:#149289;--accent-soft:#e2f2f0;--accent-ink:#ffffff;}
html[data-scheme="ember"][data-cert="secplus"][data-theme="dark"]{--accent:#5eead4;--accent-2:#99f6e4;--accent-soft:#0f2a27;--accent-ink:#052220;}
html[data-scheme="nocturne"]{--bg:#f4f2f7;--surface:#ffffff;--surface-2:#f0edf5;--surface-3:#e6e1ee;--border:#ddd7e6;--border-2:#cbc2d9;--text:#17131f;--text-2:#554d63;--text-3:#877e96;--accent:#8b2bb8;--accent-2:#a855d6;--accent-soft:#f6e9fb;--accent-ink:#ffffff;--ok:#12864a;--ok-bg:#eafaf1;--ok-br:#8ad9ae;--no:#d11d45;--no-bg:#fdecf0;--no-br:#f2aabc;--warn:#a1610a;--warn-bg:#fdf4e5;}
html[data-scheme="nocturne"][data-theme="dark"]{--bg:#0d0b12;--surface:#15121c;--surface-2:#1d1826;--surface-3:#262032;--border:#2b2438;--border-2:#3a3149;--text:#eee9f5;--text-2:#ada4bd;--text-3:#7e7590;--accent:#c77dff;--accent-2:#dda6ff;--accent-soft:#2a1a3d;--accent-ink:#12081c;--ok:#4ade80;--ok-bg:#12261b;--ok-br:#2f6b47;--no:#fb7185;--no-bg:#2a1319;--no-br:#7a3d4d;--warn:#fbbf24;--warn-bg:#2a2113;}
html[data-scheme="nocturne"][data-cert="secplus"]{--accent:#0e7490;--accent-2:#1595b5;--accent-soft:#e2f3f8;--accent-ink:#ffffff;}
html[data-scheme="nocturne"][data-cert="secplus"][data-theme="dark"]{--accent:#22d3ee;--accent-2:#67e8f9;--accent-soft:#0d2b33;--accent-ink:#04202a;}
html[data-scheme="classic"]{--bg:#faf9f7;--surface:#ffffff;--surface-2:#f4f3f0;--surface-3:#eeece8;--border:#e8e5e0;--border-2:#dbd7d0;--text:#1c1b1f;--text-2:#63626b;--text-3:#96949e;--accent:#5b5bd6;--accent-2:#8b7bf0;--accent-soft:#f1f0fb;--accent-ink:#ffffff;--ok:#12864a;--ok-bg:#eefaf2;--ok-br:#8bd9ae;--no:#d11d45;--no-bg:#fff0f3;--no-br:#f5aebe;--warn:#b45309;--warn-bg:#fdf5e7;}
html[data-scheme="classic"][data-theme="dark"]{--bg:#131317;--surface:#1b1b20;--surface-2:#232329;--surface-3:#2c2c33;--border:#2e2e36;--border-2:#3a3a44;--text:#f0eff4;--text-2:#a9a7b4;--text-3:#7d7b88;--accent:#8b8bf5;--accent-2:#a99cff;--accent-soft:#242240;--accent-ink:#12121a;--ok:#4ade80;--ok-bg:#12261b;--ok-br:#2f6b47;--no:#fb7185;--no-bg:#2a1319;--no-br:#7a3d4d;--warn:#fbbf24;--warn-bg:#2a2113;}
html[data-scheme="classic"][data-cert="secplus"]{--accent:#0d8f80;--accent-2:#14b8a6;--accent-soft:#e6f6f4;--accent-ink:#ffffff;}
html[data-scheme="classic"][data-cert="secplus"][data-theme="dark"]{--accent:#2dd4bf;--accent-2:#5eead4;--accent-soft:#0f2e2b;--accent-ink:#06201d;}

html{font-size:var(--fs,16px);-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.5;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ═══════════ TOP BAR ═══════════ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  height:var(--topbar-h);
  display:flex;align-items:center;gap:1rem;
  padding:0 1.25rem;
}
.brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0;cursor:pointer;border-radius:var(--r-sm);padding:.25rem .3rem}
.brand:hover{background:var(--surface-2)}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:.72rem;letter-spacing:-.02em;
}
.brand-txt{font-weight:800;font-size:.95rem;letter-spacing:-.025em;white-space:nowrap}
.brand-sub{font-size:.68rem;color:var(--text-3);font-weight:500;letter-spacing:0}

.nav{display:flex;gap:.15rem;margin-left:.5rem;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  font-size:.845rem;font-weight:500;color:var(--text-2);
  padding:.42rem .7rem;border-radius:var(--r-sm);white-space:nowrap;
  display:flex;align-items:center;gap:.35rem;transition:background .12s,color .12s;
}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .nb{
  font-size:.62rem;font-weight:700;background:var(--accent);color:var(--accent-ink);
  border-radius:99px;padding:.05rem .32rem;line-height:1.5;
}
.nav button.on .nb{background:var(--accent);color:var(--accent-ink)}
.nav .nb.warn{background:var(--warn);color:#fff}

.tb-right{margin-left:auto;display:flex;align-items:center;gap:.55rem;flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{
  font-size:.76rem;font-weight:650;padding:.3rem .68rem;border-radius:7px;color:var(--text-3);
  transition:all .14s;white-space:nowrap;
}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.seg button:not(.on):hover{color:var(--text-2)}
.icon-btn{
  width:33px;height:33px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--text-2);transition:background .12s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}

/* ═══════════ LAYOUT ═══════════ */
.page{max-width:1180px;margin:0 auto;padding:1.6rem 1.25rem 4rem}
.page-head{margin-bottom:1.35rem;display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.page-title{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.page-sub{color:var(--text-2);font-size:.885rem;margin-top:.2rem}
.page-head-right{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:1.35rem}
.grid{display:grid;gap:1rem}
.g-main{grid-template-columns:minmax(0,1fr) 292px;align-items:start}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:1rem}

/* ═══════════ BUTTONS ═══════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-size:.855rem;font-weight:600;padding:.58rem 1.05rem;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--border-2);color:var(--text);
  transition:all .13s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{font-size:.79rem;padding:.4rem .75rem;border-radius:var(--r-sm)}
.btn-lg{font-size:.93rem;padding:.72rem 1.4rem}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--no);border-color:var(--no-br)}
.btn-danger:hover{background:var(--no-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}

.chip{
  display:inline-flex;align-items:center;gap:.32rem;
  font-size:.755rem;font-weight:600;padding:.26rem .6rem;border-radius:99px;
  background:var(--surface-2);color:var(--text-2);border:1px solid transparent;
}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--no)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip-row{display:flex;gap:.4rem;flex-wrap:wrap}
button.chip{cursor:pointer;transition:all .12s}
button.chip:hover{background:var(--surface-3)}
button.chip.on:hover{background:var(--accent-soft)}

/* ═══════════ STATS ═══════════ */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.95rem 1.05rem;box-shadow:var(--shadow)}
.stat-l{font-size:.735rem;color:var(--text-3);font-weight:600;margin-bottom:.25rem;letter-spacing:.01em}
.stat-v{font-size:1.6rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;display:flex;align-items:baseline;gap:.35rem}
.stat-v small{font-size:.72rem;font-weight:700;color:var(--text-3)}
.stat-v .up{color:var(--ok)}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:.6rem}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.16,1,.3,1)}
.bar.ok>i{background:var(--ok)}
.bar.no>i{background:var(--no)}
.bar.warn>i{background:var(--warn)}

.sec-title{font-size:.78rem;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.sec-title svg{width:14px;height:14px}

/* ═══════════ QUIZ ═══════════ */
.kicker{font-size:.735rem;font-weight:700;color:var(--accent);letter-spacing:.045em;text-transform:uppercase;margin-bottom:.55rem}
.q-text{font-size:1.075rem;line-height:1.52;font-weight:600;letter-spacing:-.012em;margin-bottom:1.15rem}
.opt{
  display:flex;align-items:flex-start;gap:.75rem;width:100%;text-align:left;
  border:1.5px solid var(--border);border-radius:var(--r-md);
  padding:.72rem .85rem;margin-bottom:.55rem;
  font-size:.895rem;color:var(--text-2);line-height:1.45;
  background:var(--surface);transition:all .13s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.opt .k{
  width:24px;height:24px;border-radius:7px;background:var(--surface-2);flex-shrink:0;
  display:grid;place-items:center;font-size:.755rem;font-weight:700;color:var(--text-3);margin-top:-1px;
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok-br);background:var(--ok-bg);color:var(--text);font-weight:550}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no-br);background:var(--no-bg);color:var(--text)}
.opt.no .k{background:var(--no);color:#fff}
.opt:disabled{cursor:default}

.grid.g-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.15rem;align-items:start}
@media (max-width:1080px){.grid.g-two{grid-template-columns:minmax(0,1fr)}}
.lead-txt{font-size:.9rem;line-height:1.62;color:var(--text-2)}
.reb{display:flex;gap:.65rem;padding:.6rem 0;border-top:1px solid var(--border);font-size:.855rem;line-height:1.55;color:var(--text-2)}
.reb:first-of-type{border-top:0;padding-top:.15rem}
.reb .k{flex:none;width:22px;height:22px;border-radius:7px;font-size:.7rem;font-weight:700;display:grid;place-items:center;background:var(--surface-3);color:var(--text-3);margin-top:.05rem}
.reb.ok{color:var(--text)}
.reb.ok .k{background:var(--ok);color:#fff}
.reb.no .k{background:var(--no);color:#fff}
.reb .yours{color:var(--no);font-weight:700}
.reb-note{margin-top:.9rem;padding:.65rem .75rem;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);font-size:.82rem;line-height:1.55;color:var(--text-2)}
.qpre{
  font-family:var(--mono);font-size:.79rem;line-height:1.55;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:.85rem .95rem;margin:0 0 1.15rem;
  overflow-x:auto;white-space:pre;color:var(--text-2);
}
.explain{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 var(--r-md) var(--r-md) 0;
  padding:.85rem 1rem;margin-top:.9rem;font-size:.875rem;line-height:1.62;color:var(--text);
}
.explain b{font-weight:700}
.explain .eh{font-size:.735rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem;display:block}
.explain.ok{border-color:var(--ok);background:var(--ok-bg)}
.explain.ok .eh{color:var(--ok)}
.explain.no{border-color:var(--no);background:var(--no-bg)}
.explain.no .eh{color:var(--no)}

/* ═══════════ FLASHCARDS ═══════════ */
.fc-wrap{perspective:1600px;margin-bottom:1rem}
.fc{
  position:relative;width:100%;min-height:310px;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.16,1,.3,1);cursor:pointer;
}
@media (max-width:820px){ .fc{min-height:400px} }
.fc.flip{transform:rotateY(180deg)}
.fc-side{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:3rem 1.6rem;
  display:flex;flex-direction:column;justify-content:center;
}
.fc-back{transform:rotateY(180deg)}
.fc-term{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.25;text-align:center}
.fc-hint{position:absolute;bottom:1.1rem;left:0;right:0;text-align:center;font-size:.735rem;color:var(--text-3)}
.fc-def{font-size:.955rem;line-height:1.62;margin-bottom:1rem}
.fc-ex{font-size:.865rem;line-height:1.6;color:var(--text-2);border-left:3px solid var(--accent);padding-left:.85rem}
.fc-ex b{color:var(--accent);font-weight:700;display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.fc-label{position:absolute;top:1.3rem;right:1.6rem;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.fc-prompt{font-size:1.02rem;line-height:1.6;font-weight:550;text-align:center;max-width:46ch;margin:0 auto;max-height:100%;overflow-y:auto}
.fc-ans{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.2;text-align:center;margin-bottom:1rem}

/* ═══════════ LISTS ═══════════ */
.row{
  display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;
  padding:.85rem 1rem;border-bottom:1px solid var(--border);transition:background .12s;
}
.row:last-child{border-bottom:none}
button.row:hover{background:var(--surface-2)}
.row-main{min-width:0;flex:1}
.row-t{font-size:.9rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.12rem}
.row-s{font-size:.775rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:.5rem}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}

.dom-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.7rem}
.dom-row:last-child{margin-bottom:0}
.dom-n{font-size:.83rem;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom-p{font-size:.79rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2);flex-shrink:0;width:3rem;text-align:right}
.dom-bar{width:104px;flex-shrink:0}

/* ═══════════ INPUTS ═══════════ */
.input,.select,.area{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);
  padding:.55rem .75rem;font-size:.875rem;width:100%;transition:border-color .13s;
}
.input:focus,.select:focus,.area:focus{outline:none;border-color:var(--accent)}
.area{min-height:110px;resize:vertical;line-height:1.55;font-family:var(--font)}
.num{width:88px}
.search{position:relative}
.search svg{position:absolute;left:.72rem;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
.search .input{padding-left:2.15rem}

.toggle{width:42px;height:24px;border-radius:99px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

.set-row{display:flex;align-items:center;gap:1.1rem;padding:.95rem 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-i{flex:1;min-width:0}
.set-n{font-size:.885rem;font-weight:600;margin-bottom:.1rem}
.set-d{font-size:.79rem;color:var(--text-3);line-height:1.45}
.set-c{flex-shrink:0;display:flex;align-items:center;gap:.5rem}

/* ═══════════ MISC ═══════════ */
.empty{text-align:center;padding:3rem 1.5rem;color:var(--text-3)}
.empty svg{width:34px;height:34px;margin-bottom:.7rem;opacity:.45}
.empty-t{font-size:.95rem;font-weight:600;color:var(--text-2);margin-bottom:.3rem}
.empty-s{font-size:.845rem;max-width:38ch;margin:0 auto;line-height:1.55}

.timer{font-size:3.4rem;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.ring{display:block;margin:0 auto}
/* stroke-width comes from the element attribute so each ring can size itself */
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:var(--surface-3)}
.ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)}

.prose{font-size:.925rem;line-height:1.72;color:var(--text-2)}
.prose p{margin-bottom:.95rem}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--text);font-weight:650}

.badge-lvl{display:flex;align-items:center;gap:.6rem}
.lvl-ring{width:44px;height:44px;flex-shrink:0;position:relative}
.lvl-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--accent)}

.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--surface-3)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 26%,var(--surface-3))}
.hm i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface-3))}
.hm i.l3{background:color-mix(in srgb,var(--accent) 74%,var(--surface-3))}
.hm i.l4{background:var(--accent)}

.toast{
  position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(140%);
  background:var(--text);color:var(--bg);font-size:.865rem;font-weight:600;
  padding:.7rem 1.15rem;border-radius:99px;box-shadow:var(--shadow-lg);z-index:200;
  transition:transform .34s cubic-bezier(.16,1,.3,1);pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(20,19,24,.5);backdrop-filter:blur(3px);z-index:150;display:grid;place-items:center;padding:1.25rem}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:430px;width:100%;padding:1.5rem}
.modal-t{font-size:1.1rem;font-weight:750;letter-spacing:-.02em;margin-bottom:.5rem}
.modal-d{font-size:.885rem;color:var(--text-2);line-height:1.6;margin-bottom:1.25rem}

.foot{text-align:center;font-size:.775rem;color:var(--text-3);padding:2.5rem 1rem 1rem;line-height:1.7}

.fade{animation:fade .3s cubic-bezier(.16,1,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .g-main{grid-template-columns:1fr}
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:1fr}
}
@media (max-width:720px){
  .nav{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    background:var(--surface);border-top:1px solid var(--border);
    padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));
    justify-content:flex-start;gap:.1rem;margin:0;z-index:60;
    box-shadow:0 -2px 14px rgba(0,0,0,.06);
  }
  .nav button{flex-direction:column;gap:.15rem;font-size:.66rem;padding:.4rem .55rem;min-width:60px}
  .page{padding-bottom:5.5rem}
  .brand-sub{display:none}
  .g-2{grid-template-columns:1fr}
  .page-title{font-size:1.32rem}
  .topbar{padding:0 .9rem;gap:.6rem}
}
@media print{.topbar,.nav,.btn-row{display:none}}

/* ═══════════ PBQ LABS ═══════════ */
.lab-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1.15rem 1.2rem;text-align:left;width:100%;transition:border-color .13s,transform .13s}
button.lab-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.lab-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.lab-kind{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:.2rem .45rem;border-radius:5px}
.lab-done{margin-left:auto;display:flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:var(--ok)}
.lab-done svg{width:13px;height:13px}
.lab-name{font-size:1rem;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:.3rem}
.lab-desc{font-size:.82rem;color:var(--text-2);line-height:1.5}
.lab-meta{display:flex;gap:.75rem;margin-top:.75rem;font-size:.735rem;color:var(--text-3);font-weight:500}

.scenario{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;padding:.9rem 1.05rem;font-size:.875rem;line-height:1.65}
.scenario p{margin-bottom:.7rem}
.scenario p:last-child{margin-bottom:0}
.scenario b{font-weight:700}
.scenario code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:.1rem .32rem;border-radius:4px}

/* terminal */
.term{background:#0d1117;border:1px solid #262d38;border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.term-bar{background:#161b22;border-bottom:1px solid #262d38;padding:.42rem .75rem;display:flex;align-items:center;gap:.45rem}
.term-bar i{width:9px;height:9px;border-radius:50%;background:#30363d;display:block}
.term-bar span{margin-left:.4rem;font-family:var(--mono);font-size:.68rem;color:#7d8590}
.term-out{padding:.8rem .9rem;font-family:var(--mono);font-size:.795rem;line-height:1.55;color:#c9d1d9;height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out::-webkit-scrollbar-thumb{background:#30363d;border-color:#0d1117}
.term-out .cmd{color:#e6edf3}
.term-out .err{color:#ff7b72}
.term-out .ok2{color:#7ee787}
.term-out .dim{color:#7d8590}
.term-in{display:flex;align-items:center;gap:.5rem;border-top:1px solid #262d38;padding:.5rem .9rem;background:#0d1117}
.term-in span{font-family:var(--mono);font-size:.795rem;color:#7ee787;white-space:nowrap}
.term-in input{flex:1;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:.795rem;color:#e6edf3;padding:0}

/* goals */
.goal{display:flex;align-items:flex-start;gap:.55rem;padding:.45rem 0;font-size:.83rem;line-height:1.45;border-bottom:1px solid var(--border)}
.goal:last-child{border-bottom:none}
.goal-b{width:17px;height:17px;border-radius:5px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;background:var(--surface-3);color:transparent}
.goal-b svg{width:11px;height:11px}
.goal.hit .goal-b{background:var(--ok);color:#fff}
.goal.hit{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}

/* fields */
.fld{margin-bottom:.9rem}
.fld:last-child{margin-bottom:0}
.fld-l{font-size:.82rem;font-weight:600;margin-bottom:.28rem;display:flex;align-items:center;gap:.4rem}
.fld-h{font-size:.755rem;color:var(--text-3);margin-bottom:.35rem;line-height:1.45}
.fld input,.fld select{font-family:var(--mono);font-size:.83rem}
.fld.bad input,.fld.bad select{border-color:var(--no);background:var(--no-bg)}
.fld.good input,.fld.good select{border-color:var(--ok-br);background:var(--ok-bg)}
.fld-msg{font-size:.755rem;margin-top:.28rem;line-height:1.45}
.fld.bad .fld-msg{color:var(--no)}
.fld.good .fld-msg{color:var(--ok)}
.fld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem}

/* order */
.ord{display:flex;flex-direction:column;gap:.45rem;counter-reset:o}
.ord-i{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:.6rem .75rem;font-size:.865rem;cursor:grab}
.ord-i[draggable="true"]:active{cursor:grabbing}
.ord-i.drag{opacity:.4}
.ord-i.over{border-color:var(--accent);background:var(--accent-soft)}
.ord-n{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:.755rem;font-weight:700;color:var(--text-3);flex-shrink:0}
.ord-t{flex:1;line-height:1.45}
.ord-b{display:flex;flex-direction:column;gap:2px}
.ord-b button{width:22px;height:16px;border-radius:4px;display:grid;place-items:center;color:var(--text-3);background:var(--surface-2)}
.ord-b button:hover{background:var(--accent);color:var(--accent-ink)}
.ord-b svg{width:11px;height:11px}
.ord-i.good{border-color:var(--ok-br);background:var(--ok-bg)}
.ord-i.good .ord-n{background:var(--ok);color:#fff}
.ord-i.bad{border-color:var(--no-br);background:var(--no-bg)}
.ord-i.bad .ord-n{background:var(--no);color:#fff}

/* match */
.mt-pool{display:flex;flex-wrap:wrap;gap:.45rem;padding:.8rem;background:var(--surface-2);border-radius:var(--r-md);min-height:56px;margin-bottom:1rem}
.mt-i{font-size:.815rem;font-weight:550;background:var(--surface);border:1.5px solid var(--border-2);border-radius:8px;padding:.4rem .7rem;cursor:pointer;transition:all .12s;line-height:1.35}
.mt-i:hover{border-color:var(--accent)}
.mt-i.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.mt-i.good{border-color:var(--ok-br);background:var(--ok-bg);color:var(--ok)}
.mt-i.bad{border-color:var(--no-br);background:var(--no-bg);color:var(--no)}
.mt-targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.7rem}
.mt-t{background:var(--surface);border:1.5px dashed var(--border-2);border-radius:var(--r-md);padding:.7rem .8rem;min-height:84px}
.mt-t.hot{border-color:var(--accent);background:var(--accent-soft)}
.mt-t-l{font-size:.75rem;font-weight:700;color:var(--text-2);margin-bottom:.5rem;letter-spacing:.01em}
.mt-t-drop{display:flex;flex-wrap:wrap;gap:.4rem}
.mt-empty{font-size:.755rem;color:var(--text-3);font-style:italic}

/* rules table */
.rt{width:100%;border-collapse:collapse;font-size:.82rem}
.rt th{text-align:left;font-size:.71rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:.45rem .5rem;border-bottom:1px solid var(--border);font-weight:700}
.rt td{padding:.35rem .5rem;border-bottom:1px solid var(--border)}
.rt select,.rt input{padding:.3rem .45rem;font-size:.8rem;font-family:var(--mono)}
.rt tr.good td{background:var(--ok-bg)}
.rt tr.bad td{background:var(--no-bg)}

.lab-result{border-radius:var(--r-md);padding:1rem 1.1rem;font-size:.885rem;line-height:1.6}
.lab-result.pass{background:var(--ok-bg);border-left:3px solid var(--ok)}
.lab-result.fail{background:var(--no-bg);border-left:3px solid var(--no)}
.lab-result h4{font-size:.95rem;font-weight:750;margin-bottom:.35rem}
.lab-result.pass h4{color:var(--ok)}
.lab-result.fail h4{color:var(--no)}

.hint-box{font-size:.815rem;color:var(--text-2);line-height:1.6;background:var(--surface-2);border-radius:var(--r-md);padding:.75rem .85rem}
.hint-box code{font-family:var(--mono);font-size:.86em;background:var(--surface);padding:.1rem .3rem;border-radius:4px;color:var(--accent)}
.cmd-list{font-family:var(--mono);font-size:.755rem;line-height:1.85;color:var(--text-2)}
.cmd-list b{color:var(--accent);font-weight:600}
@media (max-width:720px){ .term-out{height:250px} }

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>

// ═══ DATA: Network+ N10-009 ═══

const NET_DOMAINS = [
  {id:0,name:"All Domains",weight:"100%"},
  {id:1,name:"Networking Concepts",weight:"23%"},
  {id:2,name:"Network Implementation",weight:"20%"},
  {id:3,name:"Network Operations",weight:"19%"},
  {id:4,name:"Network Security",weight:"14%"},
  {id:5,name:"Network Troubleshooting",weight:"24%"}
];
const NET_QUESTIONS = [
{id:"n1_01",domain:1,question:"A wiring closet contains a single 24-port Layer 2 switch carrying three VLANs, uplinked to a router-on-a-stick for inter-VLAN routing. Two of the switch ports each feed a legacy 8-port Ethernet hub with 8 workstations attached. How many collision domains and broadcast domains exist in this closet?",options:{A:"24 collision domains and 1 broadcast domain",B:"3 collision domains and 24 broadcast domains",C:"38 collision domains and 3 broadcast domains",D:"24 collision domains and 3 broadcast domains"},answer:"D",lead:"Each switch port is its own collision domain, so 24 ports equal 24 collision domains. A hub does NOT segment collision domains — it extends the one belonging to the switch port it plugs into, so the 16 hub-attached workstations add zero new collision domains. Broadcast domains are defined by VLANs, and there are three.",why:{A:"Ignores that VLANs split broadcast domains.",B:"Reverses the two concepts entirely.",C:"Counts 22 non-hub ports plus 16 hub devices, which is the classic trap of treating each hub port as a collision domain."}},
{id:"n1_02",domain:1,question:"An engineer must carve 172.16.32.0/21 using VLSM, allocating largest-first in this order: 900 hosts, 400 hosts, 200 hosts, and 60 hosts. What is the network address and prefix of the 60-host subnet?",options:{A:"172.16.39.0/26",B:"172.16.38.0/26",C:"172.16.39.64/26",D:"172.16.39.0/25"},answer:"A",lead:"The /21 spans 172.16.32.0 through 172.16.39.255. Allocating largest-first: 900 hosts requires a /22 (1022 usable) at 172.16.32.0/22, consuming .32.0-.35.255. 400 hosts requires a /23 (510 usable) at 172.16.36.0/23, consuming .36.0-.37.255. 200 hosts requires a /24 (254 usable) at 172.16.38.0/24. 60 hosts requires a /26 (62 usable), which lands at 172.16.39.0/26.",why:{B:"Is the 200-host block's starting address.",C:"Is the second /26 in that range, which would only be correct if something else had already taken .39.0.",D:"Uses the right network address but a /25 wastes 126 addresses on a 60-host need."}},
{id:"n1_03",domain:1,question:"A regional office advertises 10.8.0.0/16, 10.9.0.0/16, 10.10.0.0/16, and 10.11.0.0/16. Which single summary route advertises exactly these four networks and no others?",options:{A:"10.8.0.0/13",B:"10.8.0.0/14",C:"10.0.0.0/12",D:"10.8.0.0/15"},answer:"B",lead:"Convert the second octet to binary: 8 = 00001000, 9 = 00001001, 10 = 00001010, 11 = 00001011. The first six bits (000010) are common to all four, and 8 network bits precede them, so the summary is /14 — 10.8.0.0/14, covering exactly 10.8.0.0 through 10.11.255.255.",why:{A:"A (/13) covers 10.8.0.0-10.15.255.255, advertising four networks the office does not own.",C:"C (/12) covers 10.0.0.0-10.15.255.255, which is far too broad.",D:"D (/15) covers only 10.8 and 10.9, missing half the range."}},
{id:"n1_04",domain:1,question:"A host with MAC address B8:27:EB:4C:9D:21 receives a Router Advertisement for prefix 2001:db8:1:5::/64 and builds its address using SLAAC with EUI-64. What is the resulting global unicast address?",options:{A:"2001:db8:1:5:b827:fffe:4c9d:2100",B:"2001:db8:1:5:b827:ebff:fe4c:9d21",C:"2001:db8:1:5:ba27:ebff:fe4c:9d21",D:"2001:db8:1:5:ba27:eb4c:9d21:0000"},answer:"C",lead:"EUI-64 does two things. First it inserts FFFE between the OUI and the device portion of the MAC: B827EB + FFFE + 4C9D21. Second, it flips the seventh bit of the first octet (the Universal/Local bit). B8 is 10111000 in binary; flipping bit seven yields 10111010, which is BA. The result is ba27:ebff:fe4c:9d21.",why:{A:"Inserts the wrong value in the wrong position.",B:"Performs the FFFE insertion but forgets the U/L bit flip, which is the single most commonly missed step.",D:"Flips the bit but omits FFFE entirely."}},
{id:"n1_05",domain:1,question:"Workstations on VLAN 30 are self-assigning 169.254.x.x addresses. The DHCP server sits on VLAN 10 and already has a correctly configured, non-exhausted scope for 10.30.0.0/24. The Layer 3 switch's VLAN 30 SVI is up/up and can ping the DHCP server. What is the MOST likely cause?",options:{A:"The DHCP scope has run out of available leases",B:"DHCP snooping is trusting the wrong interface",C:"The workstations need static DNS server entries",D:"The VLAN 30 SVI is missing an ip helper-address pointing to the DHCP server"},answer:"D",lead:"DHCP DISCOVER messages are broadcasts, and routers do not forward broadcasts between subnets. When the server is on a different VLAN than the clients, the client-side SVI needs a helper address (ip helper-address) to convert the broadcast into a unicast relay toward the server. APIPA addressing is the textbook symptom that DISCOVER never reached a server.",why:{A:"Is explicitly ruled out by the stem, which says the scope is not exhausted.",B:"Would be plausible if snooping were configured, but nothing indicates it is, and the stem's routing details point squarely at relay.",C:"Is unrelated — DNS has no role in address assignment."}},
{id:"n1_06",domain:1,question:"A technician captures the following exchange while testing connectivity to a web server. What does this pattern indicate?",pre:"10.4.2.19:51422 > 10.4.9.80:8443  [SYN]      Seq=0 Win=64240\n10.4.9.80:8443  > 10.4.2.19:51422  [RST, ACK] Seq=0 Ack=1\n10.4.2.19:51423 > 10.4.9.80:8443  [SYN]      Seq=0 Win=64240\n10.4.9.80:8443  > 10.4.2.19:51423  [RST, ACK] Seq=0 Ack=1",options:{A:"The host is reachable but nothing is listening on TCP 8443",B:"An MTU mismatch is preventing the handshake from completing",C:"A firewall along the path is silently dropping the traffic",D:"The server is under a SYN flood and has exhausted its backlog"},answer:"A",lead:"The server is answering, which proves the packets reach it and a return path exists. A RST/ACK in response to a SYN is the TCP way of saying no process is bound to that port. The fault is with the service, not the network path.",why:{B:"Would allow the small SYN through and only break once large data segments flowed, so the handshake itself would succeed.",C:"Would produce no response at all — silent drops mean timeouts, not resets.",D:"Would show the server failing to complete handshakes it accepted, not actively refusing them."}},
{id:"n1_07",domain:1,question:"After deploying a GRE tunnel between two sites, users report that they can ping across the tunnel and load small web pages, but large file transfers and some HTTPS sites hang indefinitely. The security team recently applied an ACL blocking all ICMP at the perimeter. What is the MOST likely cause?",options:{A:"The tunnel interface has a duplicate IP address",B:"Path MTU Discovery is broken because ICMP Type 3 Code 4 messages are filtered",C:"The GRE tunnel is missing a keepalive configuration",D:"Asymmetric routing is sending return traffic outside the tunnel"},answer:"B",lead:"GRE adds 24 bytes of overhead, reducing the effective MTU inside the tunnel. When a sender emits a full-size packet with the Do Not Fragment bit set, the router must return ICMP Type 3 Code 4 (Destination Unreachable — Fragmentation Needed). Blocking all ICMP kills that message, so the sender never learns to reduce its segment size. Small packets pass, large ones black-hole — the signature symptom. Fixes are permitting Type 3 Code 4 or clamping TCP MSS.",why:{A:"Would prevent the tunnel from establishing at all.",C:"Would cause the tunnel to stay up when the far end is down, not size-dependent failures.",D:"Would break small traffic too."}},
{id:"n1_08",domain:1,question:"To resolve a black-hole issue, an engineer decides to clamp TCP MSS on an IPv4 tunnel interface whose MTU is set to 1400 bytes. What MSS value should be configured?",options:{A:"1380",B:"1400",C:"1360",D:"1340"},answer:"C",lead:"MSS is the payload the TCP segment carries, so it must exclude both headers. With an IPv4 header of 20 bytes and a TCP header of 20 bytes, the calculation is 1400 - 20 - 20 = 1360.",why:{A:"Subtracts only one 20-byte header.",B:"Is the MTU itself, which ignores all header overhead.",D:"D (1400 - 40 - 20) is the correct answer for an IPv6 tunnel, where the base header is 40 bytes, making it a well-designed trap for anyone who memorized the wrong figure."}},
{id:"n1_09",domain:1,question:"An auditor requires that directory lookups and web management traffic both be encrypted in transit, and that the cleartext equivalents be blocked at the firewall. Which TWO destination ports should be permitted? (Select TWO)",options:{A:"636",B:"443",C:"80",D:"389",E:"3268"},answer:["A", "B"],lead:"LDAPS (LDAP over TLS) uses TCP 636, and HTTPS uses TCP 443. Those are the two encrypted services required.",why:{C:"C (80) is cleartext HTTP, likewise blocked.",D:"D (389) is cleartext LDAP, exactly what the auditor wants blocked.",E:"E (3268) is the Global Catalog port, and its cleartext form at that — the encrypted Global Catalog port would be 3269."}},
{id:"n1_10",domain:1,question:"An organization is migrating email to a cloud provider. Mail must be delivered to the new provider, and receiving servers must be able to verify that only the provider is authorized to send on the company's behalf. Which TWO DNS record types are required? (Select TWO)",options:{A:"MX",B:"CNAME",C:"AAAA",D:"SRV",E:"TXT"},answer:["A", "E"],lead:"MX records tell sending servers which hosts accept mail for the domain, handling delivery. SPF and DMARC policies — the mechanisms that declare which senders are authorized — are published as TXT records.",why:{B:"B (CNAME) creates aliases and is often used for provider autodiscover, but it is not required for delivery or authorization.",C:"C (AAAA) maps a name to an IPv6 address and plays no role here.",D:"D (SRV) advertises service locations for protocols like SIP, not mail routing."}},
{id:"n1_11",domain:1,question:"Mail sent from a company's on-premises server is being rejected by several large recipients with a message referencing failed reverse lookup, even though the sending host has a valid A record and the domain publishes SPF. What is the MOST likely missing element?",options:{A:"An additional MX record with a lower priority",B:"A CNAME pointing the mail host to the domain apex",C:"A DNSSEC signature on the zone",D:"A PTR record for the sending server's public IP"},answer:"D",lead:"Reverse DNS maps an IP address back to a hostname via a PTR record in the in-addr.arpa zone, and it is maintained by whoever controls the IP block — usually the ISP, not the domain owner. Many large mail receivers reject or heavily penalize senders whose IP has no matching PTR, which is precisely the error described.",why:{A:"Affects inbound delivery to the company, not outbound acceptance.",B:"Is invalid for a mail host and would break resolution.",C:"Protects against DNS spoofing but has no bearing on mail sender reputation checks."}},
{id:"n1_12",domain:1,question:"A company plans to cut over its public website to a new hosting provider during a Saturday maintenance window. Which action taken several days BEFORE the cutover will most effectively minimize the period during which users reach the old server?",options:{A:"Lower the TTL on the relevant DNS records",B:"Increase the TTL on the relevant DNS records",C:"Flush the recursive resolver cache on the internal DNS servers",D:"Pre-create the new A record alongside the existing one"},answer:"A",lead:"Resolvers cache records for the duration of the TTL. If the TTL is 86400 seconds, some users will keep hitting the old IP for up to a day after the change. Lowering the TTL to a few minutes well in advance — far enough ahead that the old, long TTL has expired everywhere — means the cutover propagates almost immediately.",why:{B:"Does the exact opposite and extends the stale window.",C:"Only clears the company's own internal resolvers, not the thousands of resolvers used by the public.",D:"Creates a round-robin that sends roughly half of all users to the old server, which is worse than the problem being solved."}},
{id:"n1_13",domain:1,question:"A DNS operator needs a single IP address advertised from data centers in Frankfurt, Singapore, and Virginia, with each client automatically served by the topologically nearest instance and traffic failing over to another site if one goes offline. Which addressing method accomplishes this?",options:{A:"Unicast with round-robin DNS",B:"Anycast",C:"Broadcast",D:"Multicast"},answer:"B",lead:"Anycast advertises the same IP address from multiple locations via routing protocols. Each client's packets follow the best BGP path, which naturally lands on the nearest instance, and withdrawal of a failed site's route reroutes traffic automatically. This is how public DNS resolvers and root servers operate.",why:{A:"Returns different addresses to different clients but has no topology awareness and fails slowly because of caching.",C:"Is limited to a single broadcast domain and does not exist in IPv6.",D:"Delivers one stream to many subscribed receivers, which is a different problem."}},
{id:"n1_14",domain:1,question:"A branch has 200 internal hosts sharing a single public IPv4 address for outbound Internet access. The branch also hosts an internally addressed web server that must be reachable from the Internet on TCP 443. Which combination of NAT configurations is required?",options:{A:"Static NAT for outbound traffic and PAT for the web server",B:"PAT alone, since it handles inbound and outbound sessions equally",C:"PAT for outbound traffic and a static NAT entry for the web server",D:"Dynamic NAT with a pool for both requirements"},answer:"C",lead:"PAT (NAT overload) multiplexes many internal hosts behind one public address by tracking unique source ports, which is exactly the outbound requirement. Inbound connections have no prior state to match, so the router needs a static, permanently mapped translation — a static NAT or port forward — to know where to send unsolicited traffic on 443.",why:{A:"Reverses the two roles; static NAT is one-to-one and cannot serve 200 hosts from one address.",B:"Fails because PAT builds translations only from inside-initiated traffic.",D:"Requires a pool of public addresses, which the branch does not have."}},
{id:"n1_15",domain:1,question:"An organization runs its workloads on cloud-provided virtual machines. During a compliance review, the auditor asks who is responsible for applying operating system security patches to those VMs. Under the shared responsibility model for IaaS, what is the correct answer?",options:{A:"The cloud provider, because it owns the underlying hardware",B:"Neither, because IaaS platforms patch automatically by design",C:"The provider for critical patches and the customer for all others",D:"The customer, because the guest OS is above the hypervisor boundary"},answer:"D",lead:"In IaaS the provider secures the physical facility, hardware, network fabric, and hypervisor. Everything from the guest operating system upward — OS patching, middleware, applications, data, and access control — belongs to the customer. This boundary is a heavily tested concept.",why:{A:"Describes the provider's responsibility for the host layer, not the guest.",B:"Is true for some managed PaaS and SaaS offerings but not for raw virtual machines.",C:"Invents a split that no major provider's model defines."}},
{id:"n1_16",domain:1,question:"A hospital needs a connection from its data center to a public cloud provider that delivers consistent low latency, guaranteed bandwidth, and traffic that never traverses the public Internet. Which option BEST meets these requirements?",options:{A:"A dedicated private circuit to the provider's colocation facility",B:"A cloud NAT gateway with a reserved public IP",C:"A site-to-site IPsec VPN over the existing Internet connection",D:"A software-defined WAN overlay using two broadband circuits"},answer:"A",lead:"A dedicated private interconnect — marketed as Direct Connect, ExpressRoute, or Cloud Interconnect — provisions a physical circuit from the customer's network into the provider's edge. Because it bypasses the Internet entirely, it delivers committed bandwidth and predictable latency along with an SLA.",why:{B:"Is an outbound address-translation service and provides no private connectivity at all.",C:"Rides the public Internet, so latency and throughput are best-effort no matter how the tunnel is configured.",D:"Improves resilience and path selection but still depends on Internet transport."}},
{id:"n1_17",domain:1,question:"In a software-defined network, an administrator uses a northbound REST API to push an application policy, and the controller then programs the forwarding tables on each switch. In which plane does the forwarding table itself operate?",options:{A:"Control plane",B:"Data plane",C:"Management plane",D:"Application plane"},answer:"B",lead:"The data plane, also called the forwarding plane, is where packets are actually moved based on the forwarding table. In SDN the control plane is centralized in the controller and computes those tables, but the tables execute in the data plane on each device.",why:{A:"Calculates and distributes forwarding decisions but does not move packets.",C:"Handles device administration such as SSH, SNMP, and logging.",D:"Is where the business applications consuming the northbound API live."}},
{id:"n1_18",domain:1,question:"A data center runs a leaf-and-spine fabric with all routing done at Layer 3. A virtualization team needs to live-migrate VMs between racks while preserving their IP addresses, which requires Layer 2 adjacency across the Layer 3 fabric. Which technology satisfies this?",options:{A:"802.1Q trunking",B:"Spanning Tree Protocol",C:"VXLAN",D:"Link aggregation"},answer:"C",lead:"VXLAN encapsulates Ethernet frames inside UDP, creating a Layer 2 overlay that rides across a routed Layer 3 underlay. VMs on different racks appear to share a broadcast domain, so their addresses survive migration, while the physical fabric keeps the loop-free efficiency of routing.",why:{A:"Carries multiple VLANs over a single link but cannot cross a routed boundary.",B:"Prevents loops within a Layer 2 domain and does not create one.",D:"Bundles parallel links between two adjacent devices for bandwidth and redundancy."}},
{id:"n1_19",domain:1,question:"An architect is comparing a traditional three-tier design against a leaf-and-spine fabric for a new data center that will host heavily virtualized, distributed applications. Which characteristic MOST justifies choosing leaf-and-spine?",options:{A:"It reduces the total number of switches required",B:"It eliminates the need for any Layer 3 routing in the data center",C:"It removes the need for redundant uplinks",D:"It provides predictable latency for east-west traffic between servers"},answer:"D",lead:"Distributed and virtualized applications generate mostly east-west traffic — server to server within the data center. In leaf-and-spine every leaf connects to every spine, so any two servers are separated by the same number of hops, giving uniform and predictable latency. The three-tier model was optimized for north-south traffic and forces east-west flows up through aggregation, creating variable delay and oversubscription.",why:{A:"Is false — these fabrics usually need more switches.",B:"Is backwards, since leaf-and-spine typically routes at the leaf using ECMP.",C:"Is false, as the design depends on multiple parallel uplinks."}},
{id:"n1_20",domain:1,question:"During a VoIP quality investigation, an engineer confirms that voice bearer traffic must receive strict-priority, low-latency treatment across the WAN. Which DSCP marking should the voice payload carry?",options:{A:"EF (46)",B:"AF41 (34)",C:"CS3 (24)",D:"BE (0)"},answer:"A",lead:"Expedited Forwarding, DSCP 46, is the standard marking for voice bearer traffic and maps to a strict-priority low-latency queue. It exists specifically for traffic that is intolerant of delay, jitter, and loss.",why:{B:"B (AF41) is the conventional marking for interactive video, which tolerates slightly more delay.",C:"C (CS3) is typically used for call signaling such as SIP, not the media stream itself.",D:"Is default best-effort with no guarantees, which is the condition causing the complaint."}},
{id:"n1_21",domain:1,question:"A switch has a total PoE power budget of 370 W and is currently powering 20 IP phones that each negotiate as 802.3af Class 3 devices. The network team wants to add 802.3at wireless access points to the same switch. How many APs can the switch support without exceeding its budget?",options:{A:"12",B:"2",C:"4",D:"6"},answer:"B",lead:"802.3af Class 3 reserves 15.4 W per port at the power sourcing equipment, so 20 phones consume 20 x 15.4 = 308 W. That leaves 370 - 308 = 62 W. Each 802.3at (PoE+) access point reserves 30 W at the PSE, so 62 / 30 = 2 APs with 2 W to spare.",why:{A:"A, C, and D all exceed the remaining budget.",C:"A, C, and D all exceed the remaining budget.",D:"A, C, and D all exceed the remaining budget."},note:"A common error is using the 12.95 W and 25.5 W powered-device figures instead of the PSE reservation values, which understates consumption and overcommits the switch."},
{id:"n1_22",domain:1,question:"An engineer is validating a single-mode fiber run before turn-up. The transmitter outputs -3 dBm and the receiver sensitivity is -19 dBm. The span is 20 km of fiber rated at 0.35 dB/km, with 4 connector pairs at 0.5 dB each and 2 fusion splices at 0.1 dB each. What is the remaining optical margin?",options:{A:"9.2 dB",B:"2.2 dB",C:"6.8 dB",D:"16.0 dB"},answer:"C",lead:"The link budget is the difference between transmit power and receiver sensitivity: -3 - (-19) = 16 dB. Losses total 20 x 0.35 = 7 dB for fiber, 4 x 0.5 = 2 dB for connectors, and 2 x 0.1 = 0.2 dB for splices, which is 9.2 dB. Margin is 16 - 9.2 = 6.8 dB.",why:{A:"Is the total loss, not the margin.",B:"Would result from miscounting the fiber attenuation.",D:"Is the raw budget before subtracting any loss."}},
{id:"n1_23",domain:1,question:"A contractor must run 10GBASE-T to a workstation 78 meters from the closet, through a ceiling shared with several other data bundles. Which cabling choice will reliably support the requirement?",options:{A:"Cat 6",B:"Cat 5e",C:"Cat 3",D:"Cat 6a"},answer:"D",lead:"Cat 6a is rated for 10GBASE-T at the full 100-meter channel and includes shielding or tighter construction to resist alien crosstalk from adjacent bundles — exactly the condition described.",why:{A:"A (Cat 6) supports 10 Gbps only to 55 meters, and that figure drops further in dense bundles, so 78 meters will not work.",B:"B (Cat 5e) tops out at 1 Gbps for a standards-compliant run.",C:"C (Cat 3) is a legacy 10 Mbps and voice-grade cable."}},
{id:"n1_24",domain:1,question:"Two buildings on a campus are 2 kilometers apart and must be linked at 10 Gbps. Which transceiver and media combination is appropriate?",options:{A:"10GBASE-LR over single-mode fiber",B:"10GBASE-SR over OM3 multimode fiber",C:"10GBASE-T over shielded Cat 6a",D:"10GBASE-SR over OM4 multimode fiber"},answer:"A",lead:"10GBASE-LR uses a 1310 nm long-range laser over single-mode fiber and reaches 10 kilometers, comfortably covering 2 km.",why:{B:"B (SR over OM3) reaches approximately 300 meters. Both fall far short.",C:"Is copper, limited to 100 meters regardless of shielding.",D:"D (SR over OM4) reaches approximately 400 meters."}},
{id:"n1_25",domain:1,question:"A newly installed fiber uplink stays down. Both switches show the interface as physically connected, the optical power reading at the receiver is far below the expected range, and the transceiver on each end reports a different nanometer rating. What is the MOST likely cause?",options:{A:"A duplex mismatch between the two switch ports",B:"Mismatched transceiver wavelengths on the two ends",C:"A transmit and receive fiber pair that has been reversed",D:"An incorrect VLAN configured on the trunk"},answer:"B",lead:"Optical transceivers must be matched in type and wavelength on both ends — an 850 nm short-range module cannot interoperate with a 1310 nm long-range module. The tell in the stem is that the modules report different nanometer ratings while receive power is present but far too low.",why:{A:"Is a copper-era and Layer 2 issue that produces errors and slowness on a link that comes up, not a link that stays down.",C:"Typically results in no receive light at all rather than weak light, and it is corrected by swapping strands.",D:"Would leave the interface up while blocking traffic."}},
{id:"n1_26",domain:1,question:"An e-commerce site is deployed behind a load balancer across four application servers. Users complain that items vanish from their shopping carts partway through checkout. The application stores session state locally on each server. Which load balancer setting will resolve this MOST directly?",options:{A:"Least connections distribution",B:"Health check probes on TCP 443",C:"Session persistence",D:"Round robin distribution"},answer:"C",lead:"With state held locally on each node, a user's requests must keep landing on the same server. Session persistence — also called sticky sessions or session affinity — pins a client to one backend for the life of the session, usually via a cookie or source IP hash.",why:{A:"A and D are distribution algorithms; both actively spread requests across servers, which is what causes the symptom.",B:"Detects failed servers but has no influence on which healthy server a given user reaches.",D:"A and D are distribution algorithms; both actively spread requests across servers, which is what causes the symptom."}},
{id:"n1_27",domain:1,question:"A company wants to terminate TLS at the network edge, hide the addresses of its internal web servers, and serve cached static content to Internet visitors. Which device placement accomplishes all three?",options:{A:"A forward proxy on the internal LAN",B:"A jump box in the server VLAN",C:"A NAT gateway at the perimeter",D:"A reverse proxy in the DMZ"},answer:"D",lead:"A reverse proxy sits in front of servers and represents them to external clients. It terminates TLS (offloading crypto from the servers), presents its own address so the real backends are never exposed, and can cache responses.",why:{A:"Faces the opposite direction, mediating outbound requests from internal users to the Internet.",B:"Provides administrative access to internal systems and serves no client-facing role.",C:"Rewrites addresses but performs no TLS termination or caching."}},
{id:"n1_28",domain:1,question:"Which IPv6 address is a unique local address, usable for internal routing between sites but not routable on the public Internet?",options:{A:"fd4a:1b2c:3d4e::10",B:"2001:db8:acad:1::10",C:"fe80::1c2d:3e4f:5a6b:7c8d",D:"ff02::1"},answer:"A",lead:"Unique local addresses occupy fc00::/7, and the half actually in use is fd00::/8 with a locally generated 40-bit global ID. They are routable within and between an organization's own sites but are not advertised on the public Internet — the IPv6 analogue of RFC 1918 space.",why:{B:"Is a global unicast address from the documentation range 2001:db8::/32.",C:"Is link-local (fe80::/10), valid only on a single link and never routed.",D:"Is the all-nodes link-local multicast address."}},
{id:"n1_29",domain:1,question:"An organization is deploying an IPv6-only client network, but a critical legacy application server remains reachable only over IPv4 with no vendor upgrade path. Which transition mechanism allows the IPv6 clients to reach that server?",options:{A:"Static IPv4 mapping in the client hosts file",B:"NAT64 with DNS64",C:"Dual stack on the client subnet",D:"A 6to4 tunnel to the server"},answer:"B",lead:"NAT64 translates between IPv6 and IPv4 at the network edge, while DNS64 synthesizes an AAAA record for the IPv4-only destination so the IPv6 client has something to connect to. Together they let an IPv6-only host reach an IPv4-only service without changing either endpoint.",why:{A:"Cannot help because an IPv6-only stack has no way to source an IPv4 packet.",C:"Would work but contradicts the stated requirement of an IPv6-only client network.",D:"Carries IPv6 traffic across an IPv4 network, which is the reverse of the need here."}},
{id:"n1_30",domain:1,question:"A host is configured as 10.62.148.77 with a subnet mask of 255.255.255.224. What are the broadcast address and the last usable host address for this subnet?",options:{A:"Broadcast 10.62.148.127, last host 10.62.148.126",B:"Broadcast 10.62.148.96, last host 10.62.148.95",C:"Broadcast 10.62.148.95, last host 10.62.148.94",D:"Broadcast 10.62.148.79, last host 10.62.148.78"},answer:"C",lead:"A 255.255.255.224 mask is a /27 with a block size of 32 (256 - 224). Fourth-octet boundaries are 0, 32, 64, 96, and so on. The address .77 falls in the 64-95 block, so the network is 10.62.148.64, the broadcast is 10.62.148.95, and the usable range is .65 through .94.",why:{A:"Uses a /25 block size of 128.",B:"Incorrectly treats the next network address as the broadcast.",D:"Uses a /28 block size of 16."}},
{id:"n1_31",domain:1,question:"A point-to-point WAN link between two routers requires exactly two usable addresses and no more. Which prefix length is the correct choice, and how many total addresses does it consume?",options:{A:"/29, consuming 8 addresses",B:"/32, consuming 1 address",C:"/31, consuming 2 addresses",D:"/30, consuming 4 addresses"},answer:"D",lead:"A /30 provides 4 total addresses: one network, one broadcast, and two usable — the classic sizing for a serial or routed point-to-point link. It is the answer CompTIA expects for this scenario.",why:{A:"Wastes six addresses.",B:"Is a host route and cannot address two ends of a link.",C:"C (/31, per RFC 3021) does exist for point-to-point links and is more efficient, but it is not the standard exam answer and requires explicit device support."}},
{id:"n1_32",domain:1,question:"An engineer must subnet 192.168.90.0/24 so that each department subnet supports at least 14 usable hosts, while creating as many subnets as possible. Which prefix should be used, and how many subnets result?",options:{A:"/28, producing 16 subnets",B:"/27, producing 8 subnets",C:"/28, producing 14 subnets",D:"/29, producing 32 subnets"},answer:"A",lead:"Usable hosts equal 2^h - 2. A /28 leaves 4 host bits, giving 2^4 - 2 = 14 usable — exactly the requirement and the smallest subnet that satisfies it. Borrowing 4 bits from a /24 yields 2^4 = 16 subnets.",why:{B:"Meets the host count but produces only half as many subnets, failing the maximize requirement.",C:"Applies the minus-two rule to the subnet count, where it does not belong.",D:"Leaves 3 host bits for 2^3 - 2 = 6 usable hosts, which is too few."}},
{id:"n1_33",domain:1,question:"A monitoring platform must receive unsolicited alert messages pushed from network devices when a threshold is crossed, and must also receive device event logs. Which TWO ports should be permitted inbound to the monitoring server? (Select TWO)",options:{A:"161",B:"123",C:"69",D:"162",E:"514"},answer:["D", "E"],lead:"SNMP traps and informs are pushed by the device to the manager on UDP 162. Syslog messages are sent to a collector on UDP 514. Both are device-initiated toward the monitoring server.",why:{A:"A (161) is the port the manager polls devices on, so it belongs inbound on the devices, not the server.",B:"B (123) is NTP.",C:"C (69) is TFTP, used for config and image transfer, not alerting."}},
{id:"n1_34",domain:1,question:"A storage team wants to enable jumbo frames on an iSCSI network to improve throughput. After setting an MTU of 9000 on the initiators and the storage array, performance collapses and sessions drop intermittently. Which oversight is the MOST likely cause?",options:{A:"iSCSI does not support frames larger than 1500 bytes",B:"The intermediate switches were left at the default 1500-byte MTU",C:"Jumbo frames require a dedicated VLAN to function",D:"The initiators need flow control disabled before jumbo frames work"},answer:"B",lead:"Jumbo frames must be configured end to end. Any device in the path still enforcing a 1500-byte MTU will drop the oversized frames, and because these are Layer 2 drops the endpoints often see silent loss and session resets rather than a clean error. Every switch and interface along the path must be raised together.",why:{A:"Is false; iSCSI benefits substantially from jumbo frames.",C:"Is a good design practice but not a functional requirement.",D:"Has the relationship backwards, since flow control is typically enabled to help, not disabled."}},
{id:"n1_35",domain:1,question:"A network engineer needs to synchronize time across all infrastructure. The core routers peer with an external source that is directly attached to a GPS clock. What stratum level will the core routers operate at?",options:{A:"Stratum 3",B:"Stratum 1",C:"Stratum 2",D:"Stratum 0"},answer:"C",lead:"Stratum 0 is the reference clock itself, such as GPS or an atomic clock. A server directly attached to that reference is stratum 1. A device synchronizing to a stratum 1 server is stratum 2 — which is what the core routers become.",why:{A:"Would apply to switches synchronizing to the core routers, one level further down.",B:"Is the external source described in the stem.",D:"Is the GPS hardware, which is not a network device."}},
{id:"n1_36",domain:1,question:"An application team reports that a real-time video conferencing product performs poorly across the WAN, with users describing frozen frames and dropouts, while file transfers on the same link complete normally. Which characteristic of the conferencing traffic BEST explains why it degrades first?",options:{A:"It uses TCP, so retransmissions consume all available bandwidth",B:"It requires a permanent virtual circuit that the WAN does not provide",C:"It is encrypted, which prevents QoS classification entirely",D:"It uses UDP, so lost packets are never retransmitted"},answer:"D",lead:"Real-time media rides on UDP because waiting for retransmission would arrive too late to be useful. UDP has no acknowledgment, ordering, or recovery, so any loss, latency, or jitter shows up immediately as frozen or dropped video. Bulk file transfers use TCP, which silently retransmits and simply takes longer — masking the same underlying loss.",why:{A:"Misassigns the transport protocol.",B:"Describes legacy WAN technology not in use here.",C:"Is overstated, since QoS can classify encrypted traffic by DSCP marking, port, or interface."}},
{id:"n1_37",domain:1,question:"A junior technician asks why a Layer 3 switch was purchased for the distribution layer instead of a cheaper Layer 2 switch and a separate router. Which capability MOST specifically distinguishes the Layer 3 switch in this role?",options:{A:"It performs inter-VLAN routing in hardware ASICs at wire speed",B:"It eliminates the need for spanning tree in the topology",C:"It is the only device type that can create VLANs",D:"It can terminate WAN circuits that a router cannot"},answer:"A",lead:"A Layer 3 switch routes between VLANs using switching ASICs rather than a general-purpose CPU, delivering routing at line rate for high-volume east-west traffic. A router-on-a-stick pushes all inter-VLAN traffic through a single physical link and a software forwarding path, which becomes the bottleneck.",why:{B:"Is false, as Layer 3 switches still run spanning tree within their Layer 2 domains.",C:"Is false, since any managed Layer 2 switch creates VLANs.",D:"Is backwards — routers carry the broader range of WAN interfaces."}},
{id:"n1_38",domain:1,question:"Which statement accurately describes the relationship between VLANs, broadcast domains, and IP subnets in a standard enterprise design?",options:{A:"IP subnets define broadcast domains, and VLANs are irrelevant at Layer 2",B:"Each VLAN is a separate broadcast domain and is normally mapped to one IP subnet",C:"Multiple VLANs share one broadcast domain when trunked over 802.1Q",D:"A single VLAN typically contains several broadcast domains for redundancy"},answer:"B",lead:"A VLAN is a Layer 2 broadcast domain, and standard practice assigns exactly one IP subnet to each VLAN so that Layer 2 and Layer 3 boundaries align. Traffic between them requires a Layer 3 device.",why:{A:"Ignores that broadcast containment happens at Layer 2.",C:"Is a common misunderstanding of trunking — 802.1Q tagging carries multiple VLANs over one link precisely so they stay separate, not so they merge.",D:"Inverts the relationship."}},
{id:"n1_39",domain:1,question:"A global media company needs to reduce page load times for users in South America who are served from origin servers in North America, without relocating those servers. Which solution BEST addresses this?",options:{A:"An increase in the origin server TCP window size",B:"A traffic shaper prioritizing HTTP at the origin",C:"A content delivery network with regional edge caches",D:"A second Internet circuit at the origin data center"},answer:"C",lead:"A CDN replicates static content to points of presence near the user. South American visitors then retrieve assets from a nearby edge node instead of crossing continents, cutting the round-trip time that dominates page load.",why:{A:"Can improve throughput on a high-latency link but does not reduce the latency itself.",B:"Reorders traffic leaving the origin, which is not the constraint.",D:"Adds capacity at the origin but does nothing about the geographic distance and latency."}},
{id:"n1_40",domain:1,question:"An administrator reviews the following output while troubleshooting a server that users cannot reach by name. Based solely on this output, what is the MOST accurate conclusion?",pre:"C:\\> nslookup intranet.corp.local\nServer:  dc01.corp.local\nAddress:  10.10.1.15\n\nName:    intranet.corp.local\nAddress:  10.10.4.60\n\nC:\\> ping 10.10.4.60\nReply from 10.10.4.60: bytes=32 time=2ms TTL=128\n\nC:\\> telnet 10.10.4.60 443\nConnecting To 10.10.4.60...Could not open connection to the host, on port 443: Connect failed",options:{A:"The client is using the wrong default gateway",B:"A routing loop is preventing traffic from reaching the server subnet",C:"The DNS record points to the wrong address and must be corrected",D:"Name resolution and IP connectivity are fine; the web service or a host firewall is the problem"},answer:"D",lead:"Work up the stack. DNS returns an answer, so resolution works. ICMP echo succeeds, so Layer 3 reachability and routing work. Only the TCP connection to 443 fails, which isolates the fault to the transport or application layer on the server — a stopped service, a service not bound to 443, or a host-based firewall rule.",why:{A:"A and B would both break the ping, which succeeded.",B:"A and B would both break the ping, which succeeded.",C:"Is contradicted by the successful ping to the resolved address."}},
{id:"n2_01",domain:2,question:"A router's table contains the entries below. A packet arrives destined for 172.20.44.9. Which entry is used to forward it?",pre:"S    172.20.0.0/16   [1/0]     via 10.0.0.1\nO    172.20.44.0/24  [110/20]  via 10.0.0.2\nD    172.20.44.0/26  [90/2195] via 10.0.0.3\nS*   0.0.0.0/0       [1/0]     via 10.0.0.9",options:{A:"D 172.20.44.0/26 via 10.0.0.3",B:"S 172.20.0.0/16 via 10.0.0.1, because static has the lowest administrative distance",C:"O 172.20.44.0/24 via 10.0.0.2",D:"S* 0.0.0.0/0 via 10.0.0.9"},answer:"A",lead:"Forwarding decisions apply longest prefix match FIRST, before administrative distance is ever consulted. The address 172.20.44.9 falls inside 172.20.44.0/26 (which covers .0 through .63), and /26 is the most specific match in the table, so that entry wins.",why:{B:"Is the classic trap — administrative distance only breaks ties between routes to the SAME prefix, not between prefixes of different lengths.",C:"Is a valid but less specific match.",D:"Is the route of last resort, used only when nothing else matches."}},
{id:"n2_02",domain:2,question:"A router learns a route to 192.168.50.0/24 from OSPF with a metric of 20 and from EIGRP with a metric of 3072. Which route is installed in the routing table, and why?",options:{A:"The OSPF route, because link-state protocols are always preferred over distance-vector",B:"The EIGRP route, because EIGRP has an administrative distance of 90 versus OSPF's 110",C:"Both routes, load-balanced equally across the two paths",D:"The OSPF route, because its metric of 20 is lower than 3072"},answer:"B",lead:"When two different routing protocols offer the same prefix, the router compares administrative distance, which measures trustworthiness of the source. Internal EIGRP is 90 and OSPF is 110, so EIGRP wins and its route is installed.",why:{A:"Invents a rule that does not exist.",C:"Would require equal AD and equal metric within one protocol.",D:"Compares metrics across protocols, which is meaningless — OSPF uses cost based on bandwidth and EIGRP uses a composite of bandwidth and delay, so the numbers are not on the same scale."}},
{id:"n2_03",domain:2,question:"Four switches share a VLAN. Their bridge priorities and MAC addresses are listed below. Which switch becomes the spanning tree root bridge?",pre:"SW1  priority 32768   MAC 0018.ba11.0a01\nSW2  priority 28672   MAC 0018.ba11.0f02\nSW3  priority 24576   MAC 0018.ba11.ff03\nSW4  priority 32768   MAC 0018.ba11.0004",options:{A:"SW2",B:"SW4",C:"SW3",D:"SW1"},answer:"C",lead:"The root bridge is the switch with the lowest bridge ID, and the bridge ID is evaluated as priority first, then MAC address as a tiebreaker. SW3 has the lowest priority at 24576, so it wins outright and its MAC is never examined.",why:{A:"A and D both have higher priorities than SW3.",B:"Has the lowest MAC address, but MAC is only consulted when priorities tie — this is the most common error on this question type.",D:"A and D both have higher priorities than SW3."}},
{id:"n2_04",domain:2,question:"After a contractor plugs an unmanaged switch into a conference room wall port, the entire building's network becomes unstable with high CPU on the core switches and repeated MAC address flapping messages. Which TWO configurations on the access ports would have prevented this? (Select TWO)",options:{A:"PortFast",B:"DHCP snooping",C:"Root Guard",D:"Port security with a low MAC limit",E:"BPDU Guard"},answer:["C", "E"],lead:"The described symptoms are a spanning tree disruption caused by an unauthorized switch. BPDU Guard shuts down (err-disables) an access port the moment it receives a BPDU, which is the direct defense against plugging a switch into a user port. Root Guard prevents a port from accepting superior BPDUs, so a rogue switch cannot take over as root and force a topology recalculation.",why:{A:"A (PortFast) skips listening and learning to speed host connectivity, but it does not block a rogue switch — in fact it makes the situation worse without BPDU Guard alongside it.",B:"Protects against rogue DHCP servers, a different attack.",D:"Limits MAC addresses per port and helps against MAC flooding, but it does not stop STP takeover."}},
{id:"n2_05",domain:2,question:"An engineer configures a two-port EtherChannel between SW1 and SW2. SW1's ports are set to LACP passive and SW2's ports are set to LACP passive. What is the result?",options:{A:"The bundle forms as a static (mode on) channel",B:"The bundle forms but only one link carries traffic",C:"The bundle forms normally with LACP negotiation",D:"The bundle does not form, because at least one side must be active"},answer:"D",lead:"LACP passive means the port will respond to LACP negotiation but will never initiate it. With both sides passive, neither ever sends the first LACP packet, so the channel never forms. At least one side must be active. Working combinations are active/active and active/passive.",why:{A:"Would require both sides set to mode on, which bypasses negotiation entirely.",B:"Describes an active/standby arrangement, not the outcome of failed LACP negotiation.",C:"Requires an initiator."}},
{id:"n2_06",domain:2,question:"Two switches are connected by a trunk. SW1's trunk has native VLAN 1 while SW2's trunk has native VLAN 99. Tagged VLANs continue to pass traffic normally. What is the MOST significant consequence of this mismatch?",options:{A:"Untagged traffic leaks between VLAN 1 and VLAN 99, merging two broadcast domains",B:"The trunk fails to form and all VLANs are blocked",C:"Only VLAN 1 and VLAN 99 stop passing traffic while others continue",D:"The switches automatically renegotiate a common native VLAN"},answer:"A",lead:"The native VLAN is the one whose frames traverse a trunk untagged. When the two ends disagree, SW1 sends VLAN 1 frames untagged and SW2 receives them into VLAN 99, and vice versa. The two broadcast domains are bridged together, creating a security bypass and potentially an STP inconsistency. The danger is precisely that the trunk keeps working for tagged VLANs, so the fault is easy to miss.",why:{B:"Overstates it, since the stem confirms tagged VLANs still pass.",C:"Understates the impact — the two VLANs do not stop, they merge.",D:"Is not a behavior of 802.1Q."}},
{id:"n2_07",domain:2,question:"A user's PC and IP phone share a single access switch port. The phone must tag its voice traffic on VLAN 200 while the PC's data remains untagged on VLAN 10. Which port configuration is correct?",options:{A:"A routed port with subinterfaces for VLAN 10 and VLAN 200",B:"An access port in VLAN 10 with a voice VLAN of 200",C:"An 802.1Q trunk allowing only VLANs 10 and 200",D:"An access port in VLAN 200 with PortFast enabled"},answer:"B",lead:"The voice VLAN feature was designed for exactly this case. The port operates as an access port for the untagged PC traffic in VLAN 10 while instructing the phone, via CDP or LLDP-MED, to tag its own traffic with VLAN 200. It is sometimes described as a multi-VLAN access port.",why:{A:"Applies to router interfaces, not access switch ports.",C:"Works technically on some platforms but requires the PC to handle tagging and loses the automatic phone provisioning, and it is not the expected answer.",D:"Would place the PC's data in the voice VLAN."}},
{id:"n2_08",domain:2,question:"After a switch replacement, hosts in VLAN 40 on the new switch cannot reach the rest of the network, while VLANs 10 and 20 work correctly. The VLAN exists in the database on both switches, the access ports are assigned correctly, and the trunk between switches is up. What should the technician verify NEXT?",options:{A:"The spanning tree root bridge priority for VLAN 40",B:"Whether the hosts have received DNS server addresses",C:"The allowed VLAN list on the trunk between the switches",D:"The speed and duplex settings on the access ports"},answer:"C",lead:"A trunk carries only the VLANs in its allowed list. If VLAN 40 was pruned or was never added to the allowed list on the replacement switch, its frames are dropped at the trunk while VLANs 10 and 20 continue normally — matching the symptom exactly.",why:{A:"Could cause a suboptimal path but not total isolation for one VLAN.",B:"Would break name resolution, not all connectivity, and would not be VLAN-specific.",D:"Would cause errors and slowness on affected ports regardless of VLAN."}},
{id:"n2_09",domain:2,question:"An OSPF area contains four routers on a shared Ethernet segment with the priorities and router IDs shown. Which router is elected the designated router?",pre:"R1  OSPF priority 1    Router ID 10.1.1.1\nR2  OSPF priority 0    Router ID 10.1.1.9\nR3  OSPF priority 5    Router ID 10.1.1.3\nR4  OSPF priority 5    Router ID 10.1.1.7",options:{A:"R3",B:"R2",C:"R1",D:"R4"},answer:"D",lead:"DR election uses the highest OSPF interface priority, with the highest router ID as the tiebreaker. R3 and R4 tie at priority 5, so the router ID decides: 10.1.1.7 is higher than 10.1.1.3, making R4 the DR. R3 becomes the BDR.",why:{A:"Loses the router ID tiebreak — note that OSPF prefers the HIGHEST router ID here, unlike STP which prefers the lowest.",B:"Has priority 0, which explicitly makes it ineligible for DR or BDR despite having the highest router ID.",C:"Has the lowest priority among eligible routers."}},
