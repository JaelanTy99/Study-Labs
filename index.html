// ── DOMAIN 1 — Networking Concepts ──
{id:"hx1_01",domain:1,question:"An engineer must carve 10.20.0.0/22 into VLSM subnets sized in this order: 500 hosts, 200 hosts, 100 hosts, then 50 hosts. What is the network address and mask of the THIRD subnet?",options:{A:"10.20.3.0/25",B:"10.20.2.0/24",C:"10.20.3.128/26",D:"10.20.2.0/25"},answer:"A",explanation:"VLSM allocates largest first. 500 hosts needs /23 (510 usable) = 10.20.0.0/23, consuming 10.20.0.0-10.20.1.255. 200 hosts needs /24 (254) = 10.20.2.0/24. 100 hosts needs /25 (126) = 10.20.3.0/25 — the third subnet. The 50-host /26 then falls at 10.20.3.128."},
{id:"hx1_02",domain:1,question:"A 100 Mbps WAN link has a 40 ms round-trip time. The hosts use a fixed 64 KB TCP receive window with window scaling disabled. What is the approximate MAXIMUM throughput of a single TCP session?",options:{A:"1.6 Mbps",B:"64 Mbps",C:"13 Mbps",D:"100 Mbps"},answer:"C",explanation:"Throughput is capped by window size divided by RTT. 64 KB = 65,536 bytes = 524,288 bits; 524,288 / 0.040 s ≈ 13.1 Mbps. The link is not the bottleneck — the unscaled window is. Enabling window scaling, not buying bandwidth, is the fix."},
{id:"hx1_03",domain:1,question:"Standard 1500-byte Ethernet MTU carries traffic through a GRE tunnel (24 bytes of overhead). What TCP MSS value should be clamped to prevent fragmentation of tunneled TCP traffic?",options:{A:"1500",B:"1436",C:"1476",D:"1460"},answer:"B",explanation:"1500 MTU minus 24 bytes GRE = 1476 tunnel MTU. TCP payload then subtracts the inner IPv4 header (20) and TCP header (20): 1476 - 40 = 1436. Note 1460 is the MSS for untunneled Ethernet and 1476 is the tunnel MTU, not the MSS — both are common trap answers."},
{id:"hx1_04",domain:1,question:"Which option correctly pairs a protocol with BOTH its standard transport protocol and port?",options:{A:"SNMP trap — TCP 162",B:"TFTP — TCP 69",C:"LDAPS — UDP 636",D:"ISAKMP/IKE — UDP 500"},answer:"D",explanation:"IKE phase 1 negotiation uses UDP 500 (with NAT-T on UDP 4500). TFTP is UDP 69, SNMP traps are UDP 162, and LDAPS is TCP 636. The exam frequently tests the transport protocol, not just the port number."},
{id:"hx1_05",domain:1,question:"An IPv6 router's routing table lists the next hop for a directly connected neighbor as fe80::2a1:b2ff:fec3:d4e5. Why is a link-local rather than a global address used here?",options:{A:"Global addresses cannot be used as next hops in any protocol",B:"SLAAC prohibits global addressing on router interfaces",C:"Link-local addresses are routable across the internet for redundancy",D:"Link-local next hops remain valid even if the global prefix is renumbered"},answer:"D",explanation:"IPv6 routing protocols use link-local next hops because they are automatically configured, always present on the interface, and unaffected by global prefix renumbering — the adjacency survives an addressing change. Link-local traffic is never routed off the link."},
{id:"hx1_06",domain:1,question:"Host A is 172.16.40.100/26 and Host B is 172.16.40.100/25. Both attempt to reach 172.16.40.60. How does each host forward the traffic?",options:{A:"Both forward to the default gateway",B:"Host A sends directly; Host B forwards to the gateway",C:"Host A forwards to the gateway; Host B sends directly",D:"Both send directly to the destination"},answer:"C",explanation:"A /26 has block size 64, so .100 falls in the .64-.127 subnet while .60 falls in .32-.63 — different subnets, so Host A hands the frame to its gateway. A /25 has block size 128, placing both .100 and .60 inside 172.16.40.0/25 — same subnet, so Host B ARPs and delivers directly. The mask, not the address, determines local versus remote."},
{id:"hx1_07",domain:1,question:"A network team must aggregate 192.168.16.0/24 through 192.168.23.0/24 into the single MOST specific summary route that covers all of them and nothing more. Which route is correct?",options:{A:"192.168.16.0/21",B:"192.168.0.0/19",C:"192.168.16.0/20",D:"192.168.16.0/22"},answer:"A",explanation:"Eight contiguous /24s (16 through 23) equal 8 × 256 = 2048 addresses = /21. 192.168.16.0/21 spans 192.168.16.0 through 192.168.23.255 exactly. A /22 covers only four of them; a /20 over-summarizes into 192.168.24-31."},
{id:"hx1_08",domain:1,question:"During a TCP three-way handshake, the client sends SYN with sequence number 1000. The server responds with SYN-ACK. What acknowledgment number does the server send?",options:{A:"1002",B:"1001",C:"1000",D:"0"},answer:"B",explanation:"The SYN flag consumes one sequence number, so the server acknowledges the next byte it expects: 1001. The server also includes its own independent initial sequence number in the same segment."},
{id:"hx1_09",domain:1,question:"A 10 Gbps link must run 8 km over existing single-mode fiber between two buildings. Which transceiver is the correct choice?",options:{A:"10GBASE-ER",B:"10GBASE-LR",C:"10GBASE-T",D:"10GBASE-SR"},answer:"B",explanation:"10GBASE-LR is rated to 10 km on single-mode fiber, covering the 8 km run. SR is multimode and limited to roughly 300 m, T is copper at 100 m, and ER (40 km) is unnecessarily expensive and can overdrive the receiver on a short span without attenuation."},
{id:"hx1_10",domain:1,question:"VoIP users report choppy, robotic audio while file transfers on the same link complete normally. Monitoring shows 0.4% packet loss, 120 ms one-way latency, and 45 ms jitter. Which metric is MOST responsible for the reported symptom?",options:{A:"Jitter at 45 ms",B:"Packet loss at 0.4%",C:"One-way latency at 120 ms",D:"Insufficient raw bandwidth"},answer:"A",explanation:"Jitter is variation in packet arrival timing; anything above roughly 30 ms overruns the de-jitter buffer and produces choppy, robotic audio. Loss under 1% and latency under 150 ms are within acceptable VoIP tolerances, and TCP file transfers mask jitter entirely because they are not real-time."},
{id:"hx1_11",domain:1,question:"In a software-defined network, an administrator pushes a policy change once and it propagates to every switch. Which plane did the administrator interact with, and via which interface?",options:{A:"Application plane, via the data plane",B:"Data plane, via the southbound interface",C:"Management plane, via the southbound interface",D:"Control plane, via the northbound interface"},answer:"D",explanation:"Administrators and applications talk to the SDN controller's control plane through the northbound API (often REST). The controller then programs individual devices' data planes through the southbound interface (OpenFlow, NETCONF). Direction matters: northbound faces applications, southbound faces hardware."},
{id:"hx1_12",domain:1,question:"IGMP snooping is enabled on a switch carrying a multicast video stream. What behavior changes on ports where no host has joined the group?",options:{A:"They receive the stream tagged with the native VLAN",B:"They convert the multicast to unicast for each host",C:"They stop receiving the multicast stream entirely",D:"They receive the stream but discard it in software"},answer:"C",explanation:"Without IGMP snooping a switch floods multicast like broadcast to every port in the VLAN. Snooping inspects IGMP join/leave messages and forwards the stream only out ports with interested receivers, eliminating wasted bandwidth on uninvolved ports."},

// ── DOMAIN 2 — Network Implementation ──
{id:"hx2_01",domain:2,question:"Four switches participate in STP. SW-A priority 32768 / MAC 00:1A:2B:00:00:10, SW-B priority 32768 / MAC 00:1A:2B:00:00:05, SW-C priority 4096 / MAC 00:1A:2B:00:00:99, SW-D priority 8192 / MAC 00:1A:2B:00:00:01. Which becomes root bridge?",options:{A:"SW-A",B:"SW-D",C:"SW-C",D:"SW-B"},answer:"C",explanation:"Root election compares the bridge ID: priority first, MAC only as a tiebreaker. SW-C's priority of 4096 is lowest and wins outright, regardless of it having the highest MAC address. MAC-based reasoning only applies when priorities are equal."},
{id:"hx2_02",domain:2,question:"An engineer configures LACP on both ends of a two-link bundle but the port channel never comes up. The local side is set to passive. What is the MOST likely configuration on the remote side?",options:{A:"Passive",B:"On (static, no protocol)",C:"Desirable",D:"Active"},answer:"A",explanation:"LACP passive ports wait to be asked and never initiate negotiation, so passive-to-passive never forms a bundle. At least one side must be active. Active-active and active-passive both work; 'on' is static bonding and 'desirable' belongs to Cisco's PAgP, not LACP."},
{id:"hx2_03",domain:2,question:"A PoE switch advertises a 370 W power budget. The design calls for 802.3at access points that each draw 25.5 W at the powered device. What is the MAXIMUM number of APs the switch can support?",options:{A:"14",B:"12",C:"15",D:"18"},answer:"B",explanation:"Budget is calculated at the PSE, not the PD. 802.3at Type 2 reserves 30 W per port to allow for cable loss, even though the PD receives 25.5 W. 370 / 30 = 12.3, so 12 APs. Using the 25.5 W figure yields 14 and is the intended trap."},
{id:"hx2_04",domain:2,question:"A router has these routes for destination 10.5.20.10: a static route to 10.5.0.0/16, an OSPF route to 10.5.20.0/24, and an eBGP route to 10.5.20.0/22. Which route is used to forward the packet?",options:{A:"The eBGP route, because AD 20 beats OSPF",B:"Traffic is load-balanced across all three",C:"The static route, because AD 1 is lowest",D:"The OSPF route, because /24 is the longest prefix match"},answer:"D",explanation:"Longest prefix match is evaluated BEFORE administrative distance. AD only breaks ties between routes to the identical prefix. The /24 is the most specific match containing 10.5.20.10, so OSPF wins even though static has a far lower AD — the single most commonly missed routing concept on the exam."},
{id:"hx2_05",domain:2,question:"Clients in VLAN 30 cannot obtain addresses; the DHCP server sits in VLAN 10 on a different subnet. Clients in VLAN 10 lease normally. What must be configured on the VLAN 30 gateway interface?",options:{A:"An ip helper-address pointing to the DHCP server",B:"DHCP snooping with VLAN 30 trusted",C:"A DHCP scope for VLAN 30",D:"A static route to the DHCP server"},answer:"A",explanation:"DHCP DISCOVER is a broadcast that routers do not forward. A DHCP relay agent (ip helper-address) converts it to a unicast toward the server and inserts the gateway address so the server selects the correct scope. Routing already works — that is why VLAN 10 succeeds."},
{id:"hx2_06",domain:2,question:"An internal web server at 10.0.5.20 must be reachable from the internet at the public address 203.0.113.40 on port 443. Which NAT configuration is required?",options:{A:"Dynamic NAT from a pool",B:"NAT64 translation",C:"Static NAT / port forwarding mapping 203.0.113.40:443 to 10.0.5.20:443",D:"PAT (NAT overload) on the outside interface"},answer:"C",explanation:"Inbound connections require a permanent, predictable mapping. Static NAT (or a destination NAT port-forward) creates a fixed one-to-one translation. Dynamic NAT and PAT build translations only when an inside host initiates outbound traffic, so unsolicited inbound sessions have no entry to match."},
{id:"hx2_07",domain:2,question:"After connecting two switches, the log shows a native VLAN mismatch between VLAN 1 and VLAN 99 on the trunk. What is the MOST significant consequence?",options:{A:"The switches negotiate a new native VLAN automatically",B:"All tagged VLANs stop passing traffic",C:"The trunk fails to form and all VLANs are blocked",D:"Untagged traffic leaks between VLAN 1 and VLAN 99, bridging the two broadcast domains"},answer:"D",explanation:"The trunk still passes tagged VLANs, which is what makes this dangerous and hard to spot. Untagged frames placed on VLAN 1 by one switch are received into VLAN 99 by the other, merging two broadcast domains, creating a security bypass, and potentially causing an STP inconsistency."},
{id:"hx2_08",domain:2,question:"A dense office deploys eight APs on the 2.4 GHz band in North America. Which channel plan avoids adjacent-channel interference?",options:{A:"40 MHz bonded channels on 1 and 11",B:"Channels 1, 6, 11 reused with non-adjacent cell placement",C:"A single channel across all eight APs",D:"Channels 1, 3, 5, 7, 9, 11 reused"},answer:"B",explanation:"Only channels 1, 6, and 11 are non-overlapping in 2.4 GHz, so they are reused with physical separation between same-channel cells. Channels like 3 or 5 overlap and raise the noise floor. 40 MHz bonding is inappropriate in 2.4 GHz because it consumes most of the band."},
{id:"hx2_09",domain:2,question:"An AP operating on 5 GHz channel 52 abruptly moves clients to another channel and briefly drops service. No configuration was changed. What is the MOST likely cause?",options:{A:"DFS radar detection triggered a mandatory channel change",B:"Band steering moved clients to 2.4 GHz",C:"A rogue AP forced a channel change",D:"The AP exceeded its client association limit"},answer:"A",explanation:"Channel 52 is in the DFS range. Regulations require the AP to vacate the channel immediately when it detects radar (commonly weather or airport radar), causing a short outage. Avoiding DFS channels near radar sources prevents recurrence."},
{id:"hx2_10",domain:2,question:"An engineer terminates a run using T568A on one end and T568B on the other between a PC and a switch. On a modern gigabit switch, what is the result?",options:{A:"No link at all",B:"The link works because Auto-MDI/MDIX compensates",C:"The link works but generates CRC errors",D:"The link runs at 10 Mbps half-duplex only"},answer:"B",explanation:"Mixing A and B produces a crossover cable. Gigabit ports include Auto-MDI/MDIX, which detects and swaps the pairs automatically, so the link comes up normally. It is still bad practice: standardize on one scheme for maintainability and for older equipment lacking auto-MDIX."},

// ── DOMAIN 3 — Network Operations ──
{id:"hx3_01",domain:3,question:"A syslog server is configured to capture severity level 3 and anything more severe. Which of the following is NOT captured?",options:{A:"Emergency (0)",B:"Error (3)",C:"Critical (2)",D:"Warning (4)"},answer:"D",explanation:"Syslog severity runs 0 (Emergency) through 7 (Debug), where LOWER numbers are MORE severe. Capturing level 3 and above in severity includes 3, 2, 1, and 0. Warning is level 4 — less severe than the threshold — and is excluded."},
{id:"hx3_02",domain:3,question:"A business defines a four-hour RTO and a 15-minute RPO for a database. Backups run nightly and restoration takes two hours. Which requirement is NOT met, and what fixes it?",options:{A:"Both are met by the current design",B:"RTO is not met; move to a cold site",C:"RPO is not met; implement transaction log shipping or replication",D:"RTO is not met; add more backup storage"},answer:"C",explanation:"RTO (how long to restore) is satisfied — two hours is inside the four-hour window. RPO (acceptable data loss) is not: nightly backups risk up to 24 hours of loss against a 15-minute target. Frequent log shipping, snapshots, or continuous replication closes that gap."},
{id:"hx3_03",domain:3,question:"An organization needs to identify which internal hosts consume the most WAN bandwidth and to which destinations, over the past 30 days, without storing packet payloads. Which tool is MOST appropriate?",options:{A:"Syslog aggregation",B:"A full packet capture with a protocol analyzer",C:"SNMP polling of interface counters",D:"NetFlow/IPFIX flow collection"},answer:"D",explanation:"Flow records capture conversation metadata — source, destination, ports, byte counts — which is exactly top-talker analysis, and they are compact enough for 30 days of retention. SNMP gives only per-interface totals with no per-host detail; full captures store payloads and are impractical at that duration."},
{id:"hx3_04",domain:3,question:"An organization must fail over within minutes of a data center loss and has budget for fully provisioned duplicate infrastructure with live replicated data. Which recovery site type fits?",options:{A:"Hot site",B:"Cold site",C:"Mobile site",D:"Warm site"},answer:"A",explanation:"A hot site is fully equipped, staffed, and continuously synchronized, enabling failover in minutes at the highest cost. A warm site has hardware but stale or partial data and takes hours to days. A cold site is empty space requiring everything to be procured and installed."},
{id:"hx3_05",domain:3,question:"An administrator must monitor devices with encrypted transport and per-user authentication. Which SNMP configuration meets this?",options:{A:"SNMPv3 with noAuthNoPriv",B:"SNMPv3 with authPriv",C:"SNMPv1 with a complex community string",D:"SNMPv2c with an ACL restricting managers"},answer:"B",explanation:"Only SNMPv3 supports user-based authentication and encryption. The authPriv security level provides both integrity/authentication and privacy (encryption). SNMPv1 and v2c send community strings in cleartext; noAuthNoPriv provides neither protection."},
{id:"hx3_06",domain:3,question:"A change to a core firewall ruleset is proposed. Which element of the change management process is specifically intended to limit damage if the change fails in production?",options:{A:"The maintenance window",B:"The impact analysis",C:"The rollback (back-out) plan",D:"The approval from the change advisory board"},answer:"C",explanation:"The rollback plan documents the exact steps to restore the prior state and is the control that bounds damage after a failure. Impact analysis and CAB approval assess risk beforehand, and the maintenance window limits exposure timing — none of them reverse a bad change."},
{id:"hx3_07",domain:3,question:"A monitoring system alerts that WAN utilization reached 65%. Historically this link runs at 20%. Which practice made this alert meaningful?",options:{A:"Enabling SNMP traps on the interface",B:"Establishing a performance baseline",C:"Configuring a syslog facility for the router",D:"Setting a static threshold at 65%"},answer:"B",explanation:"A baseline records normal behavior over time, which is what makes 65% recognizable as anomalous rather than merely a number below capacity. Without it, 65% looks acceptable on a link rated to 100%. Thresholds and traps are the delivery mechanism; the baseline supplies the meaning."},
{id:"hx3_08",domain:3,question:"Which documentation artifact BEST helps a technician trace a specific user's wall jack back to the exact switch port during a Layer 1 fault?",options:{A:"A cable/port labeling scheme with a wiring schematic",B:"A rack elevation diagram",C:"A logical network diagram",D:"An IP address management (IPAM) export"},answer:"A",explanation:"Physical fault isolation depends on knowing which jack maps to which patch panel position and switch port, which is precisely what labeling plus a wiring schematic provides. Logical diagrams show traffic flow, IPAM tracks addressing, and rack elevations show equipment placement — none map the horizontal cabling run."},
{id:"hx3_09",domain:3,question:"A remote closet houses a switch stack. Which sensor deployment would MOST directly prevent a heat-related outage rather than merely report one?",options:{A:"A humidity sensor logging to syslog",B:"A temperature sensor sending SNMP traps at 32 °C",C:"A temperature sensor integrated with HVAC control and alerting at a lower threshold",D:"A flood sensor at floor level"},answer:"C",explanation:"Reporting alone still requires human response time. Integrating the sensor with HVAC control lets cooling react automatically, and a lower alert threshold provides lead time for intervention before thermal shutdown. Humidity and flood sensors address different environmental risks."},

// ── DOMAIN 4 — Network Security ──
{id:"hx4_01",domain:4,question:"An organization deploys 802.1X with EAP-TLS. Which statement correctly describes the role assignment?",options:{A:"The client is both supplicant and authenticator",B:"RADIUS is the authenticator and the switch is the authentication server",C:"The switch is the supplicant and the client is the authenticator",D:"The client is the supplicant, the switch is the authenticator, and RADIUS is the authentication server"},answer:"D",explanation:"The endpoint requesting access is the supplicant; the switch or AP controlling the port is the authenticator; the RADIUS server making the decision is the authentication server. EAP-TLS additionally requires certificates on BOTH the client and the server, which is what distinguishes it from PEAP."},
{id:"hx4_02",domain:4,question:"Dynamic ARP Inspection is enabled to stop on-path (ARP spoofing) attacks, but legitimate statically addressed servers immediately lose connectivity. Why?",options:{A:"DAI blocks all ARP traffic by default",B:"DAI requires port security to be disabled",C:"DAI validates against the DHCP snooping binding table, which has no entry for static hosts",D:"DAI requires 802.1X on all ports"},answer:"C",explanation:"DAI checks ARP replies against the DHCP snooping binding database. Hosts with static addresses never appear in that table, so their ARP traffic is dropped. The fix is an ARP ACL entry for those hosts or trusting the port carrying them."},
{id:"hx4_03",domain:4,question:"An attacker on an access port in VLAN 1 crafts a double-tagged frame to reach VLAN 50. Which mitigation MOST directly defeats this attack?",options:{A:"Apply port security with a maximum of one MAC",B:"Change the trunk's native VLAN to an unused VLAN and disable DTP on access ports",C:"Enable BPDU guard on access ports",D:"Enable DHCP snooping on all access ports"},answer:"B",explanation:"Double tagging works because the first switch strips the outer tag matching the native VLAN and forwards the inner-tagged frame. Moving the native VLAN to an unused, non-user VLAN (and hard-coding access ports so DTP cannot negotiate a trunk) removes the condition. DHCP snooping, port security, and BPDU guard address different attacks."},
{id:"hx4_04",domain:4,question:"A switch port configured with port security in restrict mode receives a frame from an unauthorized MAC. What happens?",options:{A:"The frame is dropped, the violation counter increments, and a log/SNMP notification is generated",B:"The MAC is added to the running configuration as sticky",C:"The frame is dropped silently with no counter or log",D:"The port enters err-disabled state and must be reset"},answer:"A",explanation:"Restrict drops offending traffic and reports it via counters, syslog, and SNMP while keeping the port operational. Protect drops silently with no notification; shutdown err-disables the port entirely. The distinction between protect and restrict is the reporting behavior."},
{id:"hx4_05",domain:4,question:"An architecture places public-facing web servers in a network segment reachable from the internet but firewalled from the internal LAN, with no direct internal-to-internet path. Which principle is being applied?",options:{A:"Zero trust eliminating all network perimeters",B:"Defense in depth through host hardening",C:"Least privilege applied to user accounts",D:"A screened subnet limiting lateral movement after compromise"},answer:"D",explanation:"A screened subnet (DMZ) isolates internet-exposed hosts so that compromising a web server does not grant a path into internal systems. It is a segmentation control that contains lateral movement — a specific application of layered defense rather than an account or host control."},
{id:"hx4_06",domain:4,question:"Under a zero trust model, an authenticated user on the internal corporate LAN attempts to access a finance application. What happens?",options:{A:"Access is granted because the user is on the trusted internal network",B:"Access is evaluated per request against identity, device posture, and policy regardless of location",C:"Access is denied because zero trust blocks all internal traffic",D:"Access requires a VPN tunnel even from inside the LAN"},answer:"B",explanation:"Zero trust removes implicit trust based on network location — 'never trust, always verify.' Each request is authorized against identity, device health, and context. It does not block internal traffic wholesale, nor does it mandate a VPN; it replaces perimeter trust with continuous per-request verification."},
{id:"hx4_07",domain:4,question:"Users report that their machines received IP addresses from an unknown server with an incorrect gateway, and some traffic appears to be intercepted. Which control would have PREVENTED this?",options:{A:"DHCP snooping with only the authorized server's port trusted",B:"Enabling 802.1Q trunking on access ports",C:"Dynamic ARP Inspection alone",D:"An ACL blocking UDP 53 on access ports"},answer:"A",explanation:"This is a rogue DHCP server being used for on-path interception. DHCP snooping drops server-originated messages (OFFER, ACK) arriving on untrusted ports, so only the sanctioned server can lease addresses. DAI depends on the snooping binding table and addresses ARP, not DHCP."},

// ── DOMAIN 5 — Network Troubleshooting ──
{id:"hx5_01",domain:5,question:"A switch port shows a rising late-collision counter and FCS errors, and throughput on a 100 Mbps link is under 5 Mbps. The cable tests clean. What is the MOST likely cause?",options:{A:"A failing SFP transceiver",B:"An exceeded cable length limit",C:"A duplex mismatch between the switch and the NIC",D:"EMI from a nearby power run"},answer:"C",explanation:"Late collisions are the signature of duplex mismatch: the half-duplex side detects collisions after the 64-byte window because the full-duplex side transmits whenever it wants. Cable faults and EMI produce CRC/FCS errors but not late collisions, and a clean cable test rules them out."},
{id:"hx5_02",domain:5,question:"An interface reports a high count of giants along with CRC errors after a storage VLAN was added. Which explanation fits BEST?",options:{A:"An oversubscribed uplink causing congestion drops",B:"A duplex mismatch on the uplink",C:"A crossover cable used in place of a straight-through",D:"Jumbo frames enabled on one device but not on the switch port"},answer:"D",explanation:"Giants are frames larger than the configured MTU. A server sending 9000-byte jumbo frames into a port still set to 1500 registers giants and drops. Jumbo frame support must be configured end-to-end across every device in the path or the mismatch silently breaks large transfers."},
{id:"hx5_03",domain:5,question:"A technician must locate a break in a 900-meter single-mode fiber run between buildings and report its distance from the patch panel. Which tool is correct?",options:{A:"A time-domain reflectometer (TDR)",B:"An optical time-domain reflectometer (OTDR)",C:"A light meter with an optical source",D:"A tone generator and probe"},answer:"B",explanation:"An OTDR sends light pulses down fiber and measures reflections to report the distance to a fault, splice, or bend. A TDR performs the same function for copper. A light meter confirms loss end-to-end but cannot locate a fault, and a toner is for tracing copper runs."},
{id:"hx5_04",domain:5,question:"A traceroute shows three consecutive hops responding with asterisks, then subsequent hops and the destination respond normally. What does this indicate?",options:{A:"An MTU mismatch exists at those hops",B:"The path is broken at the first asterisk hop",C:"Those routers are configured not to send ICMP time-exceeded replies",D:"A routing loop is present"},answer:"C",explanation:"Because later hops and the destination reply, traffic is clearly transiting those routers. The asterisks simply mean those devices deprioritize or suppress ICMP time-exceeded messages — common on ISP and security-hardened routers. A genuine break shows asterisks continuing all the way to the destination."},
{id:"hx5_05",domain:5,question:"A user reports that a website resolves to an old IP address hours after DNS was updated, while a colleague on a different ISP reaches the new server. What is the MOST likely cause and immediate remedy?",options:{A:"A DNS poisoning attack; rebuild the resolver",B:"The user's DNS server is unreachable; change to a public resolver permanently",C:"The authoritative record was never updated; re-create it",D:"The record's TTL has not expired in the resolver/client cache; flush the cache or wait out the TTL"},answer:"D",explanation:"Cached records persist for the duration of the TTL, which is why one ISP's resolver still returns the old answer while another has already refreshed. Flushing the local and resolver cache resolves it immediately; lowering the TTL in advance of a planned migration prevents it."},
{id:"hx5_06",domain:5,question:"Users can ping the default gateway and external IP addresses by number, but no websites load by name. nslookup times out. Where should troubleshooting focus FIRST?",options:{A:"DNS server reachability and configured resolver addresses",B:"The switch's spanning tree topology",C:"The default gateway configuration",D:"The NIC driver on each affected client"},answer:"A",explanation:"Successful pings by IP confirm Layers 1 through 3 and the gateway are healthy. Failure limited to name resolution isolates the fault to DNS — either the configured resolver addresses are wrong, the DNS service is down, or a firewall is blocking port 53. Divide and conquer points directly there."},
{id:"hx5_07",domain:5,question:"After adding a second internet circuit for redundancy, some inbound connections to a published server fail while outbound traffic works. The firewall logs show packets arriving on one interface and replies leaving another. What is occurring?",options:{A:"A duplicate IP address conflict",B:"A routing loop",C:"Asymmetric routing causing stateful firewall drops",D:"An MTU black hole"},answer:"C",explanation:"When a reply exits a different path than the request arrived on, a stateful firewall on the return path sees traffic with no matching session entry and drops it. Fixes include policy-based routing to pin return traffic to the ingress interface, source NAT, or session synchronization between firewalls."},
{id:"hx5_08",domain:5,question:"A wireless client shows RSSI of -45 dBm but throughput is poor with heavy retransmissions. A spectrum analyzer shows a high noise floor at -60 dBm. What is the SNR and what does it indicate?",options:{A:"45 dB — the AP transmit power is too low",B:"15 dB — marginal SNR caused by interference",C:"-105 dB — the client is out of range",D:"105 dB — excellent SNR, problem is elsewhere"},answer:"B",explanation:"SNR is signal minus noise: -45 - (-60) = 15 dB. Data applications generally want 20 dB or better and voice around 25 dB, so 15 dB is marginal despite the strong signal. This is the classic 'full bars, slow speeds' case — raising transmit power would not help because it raises signal and noise for neighbors alike."},
{id:"hx5_09",domain:5,question:"Two hosts intermittently lose connectivity and the switch logs repeated MAC flapping between two ports. Which is the MOST likely cause?",options:{A:"A Layer 2 loop caused by a redundant link with STP disabled or blocked incorrectly",B:"A failing NIC on one host",C:"A duplicate IP address on the two hosts",D:"An oversized DHCP scope"},answer:"A",explanation:"MAC flapping means the same source MAC is being learned on multiple ports, which happens when frames circulate through a bridging loop. Without STP to block the redundant path, broadcasts amplify until the network saturates. A duplicate IP produces ARP conflicts, not MAC address table instability."},
{id:"hx5_10",domain:5,question:"A newly deployed site-to-site VPN passes small pings and allows SSH sessions, but web pages hang partway through loading and large file transfers stall. Which test would BEST confirm the suspected cause?",options:{A:"Run a traceroute to count hops through the tunnel",B:"Run nslookup against the remote DNS server",C:"Check the ARP cache on the local gateway",D:"Ping the remote host with the Don't-Fragment bit set at increasing payload sizes"},answer:"D",explanation:"The symptom pattern — small packets fine, large transfers stalling — points to an MTU/fragmentation problem from tunnel encapsulation overhead. A DF-bit ping sweep identifies the largest packet that survives the path, giving the exact MTU to clamp. Reducing MSS on the tunnel interface resolves it."},
{id:"hx5_11",domain:5,question:"A technician replaces a suspected faulty patch cable and connectivity is restored, but the same port fails again two days later. According to the troubleshooting methodology, what step was MOST likely skipped or done poorly?",options:{A:"Document findings",B:"Establish a theory of probable cause",C:"Implement the solution",D:"Verify full system functionality and identify the root cause"},answer:"D",explanation:"Recurrence indicates the actual root cause was never found — the cable was a symptom, possibly of a damaged jack, a pinched run, or a failing port. Verifying full functionality and confirming the underlying cause, rather than stopping when service returns, prevents the repeat failure."},
{id:"hx5_12",domain:5,question:"Throughput between two sites drops sharply every weekday at 09:00 and recovers by 10:00. Interface counters show no errors, discards, or duplex problems. What should the technician examine NEXT?",options:{A:"Review utilization graphs and flow data for that window to identify the traffic source",B:"Reseat the SFP transceivers",C:"Reset the switch to factory defaults",D:"Replace the fiber patch cables at both ends"},answer:"A",explanation:"A clean error profile with a precisely repeating time pattern indicates congestion from legitimate traffic, not a physical fault. Utilization and flow records reveal what is consuming the link at that hour — backups, replication, or a login surge — which then guides scheduling changes or QoS policy rather than hardware replacement."},

const NET_FLASHCARDS = [
// Domain 1
{id:"d1_f01",domain:1,term:"OSI Model",definition:"A seven-layer conceptual framework for understanding how data moves through a network: Physical, Data Link, Network, Transport, Session, Presentation, Application.",example:"When you visit a website, your browser (Layer 7) formats the request, TCP (Layer 4) ensures reliable delivery, IP (Layer 3) routes it, and Ethernet (Layer 2) frames it for the local network."},
{id:"d1_f02",domain:1,term:"TCP Three-Way Handshake",definition:"The process TCP uses to establish a reliable connection: SYN → SYN-ACK → ACK. Both endpoints agree on initial sequence numbers before data transfer begins.",example:"Your laptop sends SYN to a web server, the server replies with SYN-ACK, and your laptop confirms with ACK. Only then does the HTTP request begin."},
{id:"d1_f03",domain:1,term:"Subnet Mask",definition:"A 32-bit value that separates the network portion from the host portion of an IP address. It determines which addresses are on the local network vs. requiring routing.",example:"A mask of 255.255.255.0 (/24) means the first 3 octets are the network ID and the last octet identifies hosts — allowing 254 usable addresses per subnet."},
{id:"d1_f04",domain:1,term:"CIDR (Classless Inter-Domain Routing)",definition:"A method of IP address allocation that replaces classful (A/B/C) addressing with variable-length subnet masks, expressed as /prefix notation.",example:"Instead of wasting a full Class B (65,534 hosts), CIDR lets you assign 10.0.0.0/20 for exactly 4,094 hosts — right-sized for the requirement."},
{id:"d1_f05",domain:1,term:"DHCP (Dynamic Host Configuration Protocol)",definition:"Automatically assigns IP addresses, subnet masks, default gateways, and DNS servers to devices. Uses DORA process: Discover, Offer, Request, Acknowledge.",example:"When a laptop connects to Wi-Fi, it broadcasts a DHCP Discover. The server Offers an IP, the client Requests it, and the server Acknowledges — all within seconds."},
{id:"d1_f06",domain:1,term:"DNS (Domain Name System)",definition:"Translates human-readable domain names into IP addresses. Uses a hierarchical structure: root servers, TLD servers, authoritative servers.",example:"When you type google.com, your DNS resolver queries the hierarchy to find 142.250.80.46 (or similar) so your browser knows where to connect."},
{id:"d1_f07",domain:1,term:"NAT (Network Address Translation)",definition:"Translates private IP addresses to public IP addresses at the network boundary, allowing multiple internal devices to share fewer public IPs.",example:"Your home router translates your laptop's 192.168.1.50 to the single public IP (e.g., 73.45.123.10) assigned by your ISP."},
{id:"d1_f08",domain:1,term:"VLAN (Virtual LAN)",definition:"Logically segments a physical switch into multiple broadcast domains at Layer 2. Traffic between VLANs requires a Layer 3 device for routing.",example:"A 48-port switch can have ports 1-24 on VLAN 10 (Accounting) and ports 25-48 on VLAN 20 (Engineering) — completely isolated without separate hardware."},
{id:"d1_f09",domain:1,term:"ARP (Address Resolution Protocol)",definition:"Maps known IP addresses (Layer 3) to MAC addresses (Layer 2) within a local network segment using broadcast requests and unicast replies.",example:"When PC-A wants to send data to 10.0.0.5 on its subnet, it broadcasts 'Who has 10.0.0.5?' and the target replies with its MAC address."},
{id:"d1_f10",domain:1,term:"IPv6 Addressing",definition:"128-bit addressing system providing virtually unlimited addresses. Written in hexadecimal colon notation (e.g., 2001:0db8::1). Supports auto-configuration (SLAAC) and eliminates NAT.",example:"An IPv6 address like fe80::1 is a link-local address (similar to APIPA in IPv4). Global unicast addresses starting with 2xxx: or 3xxx: are internet-routable."},
{id:"d1_f11",domain:1,term:"UDP (User Datagram Protocol)",definition:"A connectionless Layer 4 protocol that sends datagrams without establishing a session or guaranteeing delivery. Faster than TCP with less overhead.",example:"VoIP calls use UDP because a dropped packet (brief audio glitch) is preferable to the delay caused by TCP retransmission. DNS queries also default to UDP."},
{id:"d1_f12",domain:1,term:"Default Gateway",definition:"The router interface address that a host sends traffic to when the destination is on a different subnet. Without it, a device can only communicate locally.",example:"If your PC is 192.168.1.50/24 and wants to reach 8.8.8.8, it sends the packet to its default gateway (e.g., 192.168.1.1) because 8.8.8.8 is not on the 192.168.1.0/24 subnet."},
{id:"d1_f13",domain:1,term:"Broadcast Domain",definition:"A logical division of a network where any broadcast sent by a device is received by all other devices in that domain. VLANs and routers define broadcast domain boundaries.",example:"All devices on VLAN 10 share a broadcast domain. An ARP broadcast from one device reaches all others on VLAN 10 but not devices on VLAN 20."},
{id:"d1_f14",domain:1,term:"Port Numbers",definition:"16-bit identifiers (0-65535) that direct traffic to specific services on a host. Well-known ports are 0-1023, registered ports 1024-49151, dynamic/ephemeral ports 49152-65535.",example:"A web server listens on port 443 (HTTPS). When your browser connects, it uses an ephemeral port (e.g., 52847) as its source."},
{id:"d1_f15",domain:1,term:"ICMP (Internet Control Message Protocol)",definition:"A Layer 3 protocol used for error reporting and diagnostic messages. Ping (Echo Request/Reply) and traceroute (TTL Exceeded) are the most common ICMP tools.",example:"When a router can't deliver a packet, it sends an ICMP Destination Unreachable message back to the source. Ping uses ICMP Echo to test connectivity."},

// Domain 2
{id:"d2_f01",domain:2,term:"802.1Q VLAN Trunking",definition:"The IEEE standard for VLAN tagging on trunk links. Inserts a 4-byte tag (including VLAN ID) into Ethernet frames so switches can identify VLAN membership across links.",example:"A trunk link between two switches carries VLAN 10, 20, and 30 traffic. Each frame gets a tag identifying its VLAN so the receiving switch puts it in the right broadcast domain."},
{id:"d2_f02",domain:2,term:"STP (Spanning Tree Protocol)",definition:"Prevents Layer 2 loops by electing a root bridge and blocking redundant paths. 802.1D is classic STP; RSTP (802.1w) converges faster.",example:"If two switches have redundant links, STP puts one port in blocking state. If the active link fails, STP unblocks the backup path — RSTP does this in seconds vs. 30-50 seconds for classic STP."},
{id:"d2_f03",domain:2,term:"OSPF (Open Shortest Path First)",definition:"A link-state IGP routing protocol that uses Dijkstra's algorithm and cost (based on bandwidth) as its metric. It supports areas for scalability and converges quickly.",example:"OSPF Area 0 is the backbone. All other areas must connect to it. A router advertises its link states, and all OSPF routers build an identical topology map of the network."},
{id:"d2_f04",domain:2,term:"BGP (Border Gateway Protocol)",definition:"The de facto exterior gateway protocol that routes traffic between autonomous systems on the internet. It uses path attributes (AS path, next hop, etc.) instead of traditional metrics.",example:"When you access a website hosted in Europe from the US, BGP determines the best AS-to-AS path across multiple ISPs to reach the destination network."},
{id:"d2_f05",domain:2,term:"PoE (Power over Ethernet)",definition:"Delivers DC power over standard Ethernet cabling. 802.3af provides 15.4W, 802.3at (PoE+) provides 30W, and 802.3bt (PoE++) provides up to 100W.",example:"IP cameras, wireless access points, and VoIP phones commonly use PoE — one cable provides both data connectivity and electrical power, eliminating the need for separate power outlets."},
{id:"d2_f06",domain:2,term:"LACP (Link Aggregation Control Protocol)",definition:"Bonds multiple physical links between switches into a single logical channel for increased bandwidth and redundancy. Part of IEEE 802.3ad.",example:"Two switches connected by four 1 Gbps links using LACP create a single 4 Gbps logical link. If one cable fails, the other three continue carrying traffic."},
{id:"d2_f07",domain:2,term:"Fiber Optic: Single-Mode vs Multimode",definition:"Single-mode (small core, laser, long distance — up to 200km) vs. Multimode (larger core, LED, shorter distance — up to 2km). Single-mode is more expensive but essential for long runs.",example:"A campus backbone between buildings 5km apart uses single-mode fiber. Within a data center, multimode OM4 handles 100 Gbps runs up to 150 meters at lower cost."},
{id:"d2_f08",domain:2,term:"Wireless Channels and Frequency Bands",definition:"2.4 GHz has 3 non-overlapping channels (1, 6, 11) with better range but more interference. 5 GHz has more channels with less interference but shorter range. 6 GHz is Wi-Fi 6E.",example:"In a dense office, APs are configured on channels 1, 6, and 11 in the 2.4 GHz band to avoid co-channel interference. 5 GHz APs use 36, 44, 52, etc."},
{id:"d2_f09",domain:2,term:"VRRP / HSRP (Gateway Redundancy)",definition:"Protocols that allow multiple routers to share a single virtual IP as the default gateway. If the primary fails, a backup takes over transparently.",example:"Two routers share virtual IP 10.0.0.1. Workstations point to 10.0.0.1 as their gateway. If Router A fails, Router B assumes the virtual IP with no client reconfiguration needed."},
{id:"d2_f10",domain:2,term:"QoS (Quality of Service)",definition:"Network mechanisms that prioritize certain traffic types to ensure performance for latency-sensitive applications. Uses DSCP markings, queuing, and traffic shaping.",example:"VoIP traffic is marked with DSCP EF (Expedited Forwarding) and given priority queuing so voice calls remain clear even when the network is congested."},
{id:"d2_f11",domain:2,term:"Static vs Dynamic Routing",definition:"Static routes are manually configured and don't change. Dynamic routing protocols (OSPF, EIGRP, BGP) automatically discover and adapt to topology changes.",example:"A small branch office with one WAN link uses a static default route. The enterprise core uses OSPF to automatically reroute around link failures."},
{id:"d2_f12",domain:2,term:"WPA3",definition:"The latest Wi-Fi security standard. Uses SAE (Simultaneous Authentication of Equals) for stronger key exchange, forward secrecy, and 192-bit security in Enterprise mode.",example:"WPA3-Personal replaces the PSK 4-way handshake with SAE, which is resistant to offline dictionary attacks — even if someone captures the handshake, they can't brute-force the password."},
{id:"d2_f13",domain:2,term:"SDN (Software-Defined Networking)",definition:"Separates the control plane (routing decisions) from the data plane (packet forwarding), centralizing network intelligence in a software controller.",example:"An SDN controller like OpenDaylight manages the forwarding rules on all switches centrally. An admin can push network-wide policy changes from a single dashboard instead of configuring each device."},
{id:"d2_f14",domain:2,term:"T568A / T568B Wiring Standards",definition:"Two standard pinout configurations for RJ-45 Ethernet termination. T568B is most common in commercial installations. Using different standards on each end creates a crossover cable.",example:"T568B: white-orange, orange, white-green, blue, white-blue, green, white-brown, brown. Most patch cables and wall jacks in the US follow T568B."},
{id:"d2_f15",domain:2,term:"Inter-VLAN Routing",definition:"The process of routing traffic between VLANs using a Layer 3 device. Methods include router-on-a-stick (subinterfaces on a trunk) and Layer 3 switch SVIs.",example:"A Layer 3 switch has SVI 192.168.10.1 on VLAN 10 and SVI 192.168.20.1 on VLAN 20. Devices on each VLAN use their SVI as the default gateway for cross-VLAN communication."},

// Domain 3
{id:"d3_f01",domain:3,term:"SNMP (Simple Network Management Protocol)",definition:"Protocol for monitoring and managing network devices. Uses agents (on devices), a manager (monitoring server), and MIBs (Management Information Bases) for data structure.",example:"A monitoring server polls a switch via SNMPv3 every 5 minutes to check port utilization, CPU load, and temperature. If CPU exceeds 90%, an SNMP trap triggers an alert."},
{id:"d3_f02",domain:3,term:"Syslog",definition:"A standard protocol for sending event log messages to a centralized server. Severity levels range from 0 (Emergency) to 7 (Debug). Uses UDP 514 or TCP for reliable delivery.",example:"When a switch port goes down, it generates a Syslog message at severity 3 (Error) and sends it to the syslog server. Admins can search and correlate events across all devices."},
{id:"d3_f03",domain:3,term:"Network Baseline",definition:"A documented snapshot of normal network performance metrics (bandwidth, latency, error rates, device utilization) used as a reference point for troubleshooting and capacity planning.",example:"The baseline shows typical WAN utilization is 40% during business hours. When users complain of slowness and monitoring shows 95%, the admin knows it's abnormal."},
{id:"d3_f04",domain:3,term:"SLA (Service Level Agreement)",definition:"A contract defining measurable service expectations: uptime guarantees, response/resolution times, performance thresholds, and penalties for non-compliance.",example:"An ISP SLA guarantees 99.99% uptime (52.6 minutes max downtime/year), <50ms latency, and 4-hour response for critical outages. Violations trigger service credits."},
{id:"d3_f05",domain:3,term:"RTO vs RPO",definition:"RTO (Recovery Time Objective): maximum acceptable downtime after failure. RPO (Recovery Point Objective): maximum acceptable data loss measured in time.",example:"An RTO of 4 hours means systems must be back online within 4 hours. An RPO of 1 hour means you can lose at most 1 hour of data — so backups must run at least hourly."},
{id:"d3_f06",domain:3,term:"Change Management",definition:"A structured process for evaluating, approving, and implementing network changes to minimize risk. Includes impact assessment, rollback plans, approval workflows, and documentation.",example:"Before upgrading switch firmware, the admin submits a change request documenting the scope, risk, rollback procedure, and maintenance window. The CAB reviews and approves it."},
{id:"d3_f07",domain:3,term:"NetFlow / sFlow / IPFIX",definition:"Flow-based monitoring protocols that collect traffic metadata (source/dest IP, ports, protocols, byte counts) from network devices for analysis and capacity planning.",example:"NetFlow data reveals that 60% of bandwidth is consumed by video streaming. The admin uses this to justify QoS policies prioritizing business applications."},
{id:"d3_f08",domain:3,term:"RAID Levels (0, 1, 5, 10)",definition:"RAID 0: Striping, no redundancy. RAID 1: Mirroring. RAID 5: Striping with distributed parity. RAID 10: Mirrored stripes — combines performance and redundancy.",example:"A file server uses RAID 5 (minimum 3 drives) for cost-effective storage with single-drive fault tolerance. A database server uses RAID 10 for maximum I/O performance with redundancy."},
{id:"d3_f09",domain:3,term:"Hot / Warm / Cold Sites",definition:"Disaster recovery facility types. Hot: fully equipped, real-time replica (minutes to failover). Warm: hardware ready, needs data restore (hours). Cold: empty facility (days to weeks).",example:"A bank runs a hot site with real-time database replication for immediate failover. A small business uses a cold site — just leased space where they can set up equipment after a disaster."},
{id:"d3_f10",domain:3,term:"MTBF / MTTR",definition:"MTBF (Mean Time Between Failures): average operational time between failures — indicates reliability. MTTR (Mean Time To Repair): average time to fix a failure — indicates maintainability.",example:"A switch with MTBF of 100,000 hours and MTTR of 2 hours means it rarely fails and recovers quickly. Low MTBF = unreliable hardware; high MTTR = difficult repairs."},
{id:"d3_f11",domain:3,term:"DNS Record Types",definition:"A: hostname→IPv4. AAAA: hostname→IPv6. CNAME: alias→canonical name. MX: mail server. PTR: reverse lookup (IP→hostname). TXT: arbitrary text (SPF, DKIM). NS: nameserver. SOA: zone authority.",example:"To set up email for example.com, you create MX records pointing to your mail server, TXT records for SPF (sender verification), and A records for the mail server's IP."},
{id:"d3_f12",domain:3,term:"Incremental vs Differential Backup",definition:"Incremental: backs up only changes since last backup (any type) — fast backup, slow restore. Differential: backs up changes since last full backup — slower backup, faster restore.",example:"Monday: Full backup. Tuesday: Incremental backs up Tuesday changes only. Wednesday: Incremental backs up Wednesday only. To restore Wednesday, you need Full + Tues + Wed incrementals."},

// Domain 4
{id:"d4_f01",domain:4,term:"Firewall Types",definition:"Packet-filtering: examines headers only. Stateful: tracks connection state. NGFW: adds application-layer inspection, IPS, and content filtering. WAF: protects web applications specifically.",example:"A packet filter allows port 443 inbound. A stateful firewall also tracks the session. An NGFW inspects the HTTPS payload to block specific applications like unauthorized cloud storage."},
{id:"d4_f02",domain:4,term:"802.1X (Port-Based NAC)",definition:"An IEEE standard requiring devices to authenticate before accessing the network. Uses three roles: supplicant (client), authenticator (switch/AP), authentication server (RADIUS).",example:"A laptop connects to a corporate switch port. The switch holds the port in unauthorized state until the laptop provides valid credentials via EAP to the RADIUS server."},
{id:"d4_f03",domain:4,term:"IDS vs IPS",definition:"IDS (Intrusion Detection System): monitors and alerts — passive, out of band. IPS (Intrusion Prevention System): monitors and blocks — active, inline. Both use signature and anomaly detection.",example:"An IDS on a SPAN port detects a port scan and emails the admin. An inline IPS detects a SQL injection attempt and drops the malicious packets before they reach the server."},
{id:"d4_f04",domain:4,term:"DMZ (Demilitarized Zone)",definition:"A network segment between the internet and internal LAN that hosts public-facing services. Isolated by firewalls so a compromised DMZ server cannot directly access internal resources.",example:"A company's web server and public DNS sit in the DMZ. The outer firewall allows HTTP/HTTPS from the internet. The inner firewall allows only specific database ports from the web server to the internal DB."},
{id:"d4_f05",domain:4,term:"VPN Types (Site-to-Site vs Remote Access)",definition:"Site-to-site: permanent encrypted tunnel between two networks (branch offices). Remote access: individual user connects to the corporate network via VPN client software.",example:"A site-to-site IPsec VPN connects the Charlotte and Atlanta offices permanently. Remote workers use a client VPN (like AnyConnect) to tunnel into the network from home."},
{id:"d4_f06",domain:4,term:"PKI (Public Key Infrastructure)",definition:"A framework for managing digital certificates and public-key encryption. Components: Certificate Authority (CA), Registration Authority (RA), Certificate Revocation List (CRL), and certificates.",example:"When you visit a bank website, your browser checks the site's SSL certificate against trusted CAs. If the CA vouches for the certificate, the padlock appears and TLS encryption begins."},
{id:"d4_f07",domain:4,term:"Zero Trust Architecture",definition:"A security model that assumes no implicit trust — every access request must be verified regardless of network location. Follows 'never trust, always verify' principles.",example:"Even a user on the corporate LAN must authenticate, authorize per-resource, and have their device posture checked before accessing a file server. Being 'inside the firewall' grants no automatic trust."},
{id:"d4_f08",domain:4,term:"DHCP Snooping",definition:"A switch security feature that inspects DHCP messages and builds a trusted binding table of IP-to-MAC-to-port mappings. Blocks rogue DHCP servers and invalid DHCP messages.",example:"Port 24 is marked as trusted (connected to the DHCP server). All other ports are untrusted. If a rogue server on port 5 sends DHCP Offers, the switch drops them."},
{id:"d4_f09",domain:4,term:"Port Security",definition:"A switch feature that restricts the number and identity of MAC addresses allowed on a port. Violation modes: protect (drop), restrict (drop+log), shutdown (err-disable port).",example:"An admin sets port security to allow only 1 MAC on access ports. If someone plugs in an unauthorized hub with multiple devices, the port shuts down (err-disable)."},
{id:"d4_f10",domain:4,term:"Principle of Least Privilege",definition:"Users and systems receive only the minimum access rights needed to perform their specific functions. Reduces attack surface and limits damage from compromised accounts.",example:"A help desk technician gets password-reset permissions but not domain admin rights. If their account is compromised, the attacker can only reset passwords — not control the entire domain."},
{id:"d4_f11",domain:4,term:"Social Engineering Attacks",definition:"Manipulation techniques that exploit human psychology rather than technical vulnerabilities. Types: phishing, vishing (voice), smishing (SMS), pretexting, tailgating, shoulder surfing.",example:"An attacker calls the help desk pretending to be a VP, urgently requesting a password reset. The pressure and authority make the tech comply without proper verification — that's pretexting."},
{id:"d4_f12",domain:4,term:"Defense in Depth",definition:"A layered security strategy where multiple overlapping controls protect assets. If one layer fails, others continue to provide protection. No single control is relied upon exclusively.",example:"Layers: perimeter firewall → IPS → network segmentation → host firewall → endpoint antivirus → encryption → user training. An attacker must bypass ALL layers to reach critical data."},

// Domain 5
{id:"d5_f01",domain:5,term:"CompTIA Troubleshooting Methodology",definition:"Seven steps: 1) Identify the problem, 2) Establish a theory, 3) Test the theory, 4) Establish a plan of action, 5) Implement the solution, 6) Verify functionality, 7) Document findings.",example:"User can't print. Step 1: Gather info (what changed?). Step 2: Theory — cable unplugged. Step 3: Check cable. Step 4: Plan — reseat cable. Step 5: Reseat it. Step 6: Test print. Step 7: Update ticket."},
{id:"d5_f02",domain:5,term:"Common CLI Tools: ping, traceroute, nslookup",definition:"ping: tests ICMP connectivity and latency. traceroute/tracert: shows each hop to destination. nslookup/dig: queries DNS servers to test name resolution.",example:"Can't reach a server? Ping it first (Layer 3 test). If ping fails, traceroute shows where it stops. If ping by IP works but not by name, nslookup reveals DNS is the issue."},
{id:"d5_f03",domain:5,term:"APIPA (169.254.x.x)",definition:"When a device fails to get a DHCP address, it self-assigns a 169.254.0.0/16 link-local address. This allows local communication only — no routed or internet access.",example:"A laptop showing 169.254.45.12 means DHCP failed. Check: Is the DHCP server running? Is the network cable connected? Is the DHCP scope full?"},
{id:"d5_f04",domain:5,term:"Speed/Duplex Mismatch",definition:"Occurs when two connected devices negotiate or are configured with different speed or duplex settings. Causes late collisions, CRC errors, poor performance, and packet loss.",example:"A NIC hard-set to 100 Mbps full-duplex connected to a switch port set to auto-negotiate may result in the switch selecting half-duplex — causing collisions and degraded throughput."},
{id:"d5_f05",domain:5,term:"Cable Testing: TDR, Certifier, Tone Generator",definition:"TDR (Time Domain Reflectometer): measures cable length and locates faults. Cable certifier: verifies cable meets Cat 5e/6/6a specifications. Tone generator + probe: traces cables through walls.",example:"A certifier reports a Cat 6a cable fails the return loss test — meaning the cable won't reliably support 10 Gbps. It needs to be re-terminated or replaced."},
{id:"d5_f06",domain:5,term:"Wireshark",definition:"An open-source packet analyzer that captures and inspects network traffic at the packet level. Supports display filters, protocol dissection, stream following, and statistics.",example:"To troubleshoot slow web browsing, capture traffic and filter with 'http'. Examine TCP retransmissions (filter: tcp.analysis.retransmission) to identify packet loss causing delays."},
{id:"d5_f07",domain:5,term:"Port Flapping",definition:"A network interface repeatedly transitioning between up and down states. Causes include bad cables, failing NIC, loose connections, or STP topology changes.",example:"Switch logs show 'Interface GigabitEthernet0/5 changed state to down' and 'up' every few seconds. The technician replaces the patch cable and the flapping stops — it was a physical fault."},
{id:"d5_f08",domain:5,term:"IP Conflict",definition:"Two devices on the same network configured with the same IP address. Causes unpredictable connectivity for both devices. Resolved by ensuring unique assignments or proper DHCP scoping.",example:"A server is statically assigned 10.0.1.50, but the DHCP scope also includes that address. When a laptop gets 10.0.1.50 via DHCP, both devices lose reliable connectivity."},
{id:"d5_f09",domain:5,term:"Layer-by-Layer Troubleshooting",definition:"Systematically working through the OSI model to isolate issues. Start at Layer 1 (physical) and work up, or start at Layer 7 (application) and work down, depending on symptoms.",example:"No connectivity at all → check Layer 1 (cables, link lights). Can ping by IP but not by name → Layer 7/DNS issue. Intermittent drops → could be Layer 1 (cable) or Layer 2 (duplex)."},
{id:"d5_f10",domain:5,term:"Attenuation",definition:"The loss of signal strength as it travels over distance through a medium. Exceeding maximum cable lengths causes unreliable connections. Measured in decibels (dB).",example:"A 150-meter Cat 6 run (exceeding the 100m limit) shows intermittent connectivity and CRC errors. The solution is adding a switch or media converter to keep runs under spec."},
{id:"d5_f11",domain:5,term:"Incorrect VLAN Assignment",definition:"A device placed on the wrong VLAN cannot reach resources on its intended network. Symptoms: device gets wrong IP range or can't communicate with expected peers despite good physical link.",example:"A new IP phone is plugged in but gets a 10.10.10.x address instead of the expected 10.20.20.x voice VLAN address. The switch port needs its voice VLAN reconfigured."},
{id:"d5_f12",domain:5,term:"netstat / ss",definition:"netstat (Windows/older Linux) and ss (modern Linux) display active connections, listening ports, routing tables, and interface statistics. Essential for verifying service availability.",example:"Running 'netstat -tlnp' on a Linux server shows that Apache is listening on port 80 and 443. If the service isn't listed, it's not running — explaining why clients can't connect."},
