// ═══════════════════════════════════════════════════════════════════════════════
// DATA: QUESTION BANK — exam-realistic, scenario & analysis heavy
// Both the Quiz (domain drill) and the timed Practice Exam draw from this bank.
// ═══════════════════════════════════════════════════════════════════════════════
const QUESTIONS = [
// ════════════════════════════════════════════════════════════════════
// DOMAIN 1 — Networking Concepts (scenario / calculation heavy)
// ════════════════════════════════════════════════════════════════════
{id:"ex1_01",domain:1,question:"A host is configured with the address 10.14.27.200/21. Which of the following is the network address of the subnet this host belongs to?",options:{A:"10.14.24.0",B:"10.14.16.0",C:"10.14.27.0",D:"10.14.0.0"},answer:"A",explanation:"A /21 mask is 255.255.248.0, giving a block size of 8 in the third octet (256-248). The third-octet boundaries are 0, 8, 16, 24, 32… Since 27 falls in the 24-31 block, the network address is 10.14.24.0."},
{id:"ex1_02",domain:1,question:"An administrator subnets 192.168.100.0/24 into /26 networks. What is the FIRST usable host address of the third subnet?",options:{A:"192.168.100.129",B:"192.168.100.128",C:"192.168.100.130",D:"192.168.100.193"},answer:"A",explanation:"A /26 has a block size of 64. Subnets are .0, .64, .128, .192. The third subnet is 192.168.100.128/26, whose first usable host is .129 (.128 is the network address, .191 the broadcast)."},
{id:"ex1_03",domain:1,question:"A capture shows a workstation repeatedly sending TCP SYN packets to a server on port 443 with no SYN-ACK returned, yet ICMP echo replies from that same server are received normally. What is the MOST likely cause?",options:{A:"DNS resolution is failing for the server name",B:"The service on TCP 443 is down or being filtered",C:"The default gateway is misconfigured",D:"There is a duplex mismatch on the link"},answer:"B",explanation:"Successful ICMP echo confirms Layer 3 reachability and a working path. A SYN with no SYN-ACK on a specific port points to that service being stopped, the port closed, or a firewall silently dropping it — not a gateway, DNS, or duplex problem (those would break ICMP too)."},
{id:"ex1_04",domain:1,question:"Which single summary (supernet) route EXACTLY covers the four networks 10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24, and 10.1.3.0/24?",options:{A:"10.1.0.0/23",B:"10.1.0.0/21",C:"10.1.0.0/22",D:"10.1.0.0/24"},answer:"C",explanation:"Four contiguous /24s aggregate into a /22 (4 × 256 = 1024 addresses = /22). 10.1.0.0/22 spans 10.1.0.0 through 10.1.3.255 exactly. A /23 covers only two /24s; a /21 would over-summarize into 10.1.4–7 as well."},
{id:"ex1_05",domain:1,question:"A device acquires an IPv6 address by listening to a Router Advertisement, learning the /64 prefix, and generating its own interface identifier. Which mechanism is in use?",options:{A:"Stateful DHCPv6",B:"APIPA",C:"NAT64",D:"SLAAC"},answer:"D",explanation:"Stateless Address Autoconfiguration (SLAAC) lets a host build a global address from the RA-advertised prefix plus a self-generated interface ID (EUI-64 or random). Stateful DHCPv6 hands out full addresses from a server instead."},
{id:"ex1_06",domain:1,question:"A real-time application cannot tolerate the delay introduced by retransmission but can accept occasional lost packets. Which transport protocol and example application BEST fit this requirement?",options:{A:"TCP — bulk file transfer",B:"UDP — VoIP audio",C:"TCP — email delivery",D:"UDP — database transaction replication"},answer:"B",explanation:"UDP is connectionless with no retransmission, so a dropped packet causes a brief glitch rather than a stall — ideal for VoIP/streaming. TCP's reliability adds retransmission delay, which is unacceptable for real-time voice. Database replication needs TCP's reliability."},
{id:"ex1_07",domain:1,question:"A user can reach a server by its IP address but not by its hostname. At which OSI layer does the responsible service PRIMARILY operate?",options:{A:"Layer 2 (Data Link)",B:"Layer 3 (Network)",C:"Layer 4 (Transport)",D:"Layer 7 (Application)"},answer:"D",explanation:"Name-to-IP resolution is performed by DNS, an application-layer (Layer 7) service. Because IP connectivity works, Layers 1-4 are functioning; the failure is in name resolution."},
{id:"ex1_08",domain:1,question:"As data is sent from a web browser down the protocol stack, which sequence correctly lists the resulting protocol data units?",options:{A:"Segment → Packet → Frame → Bits",B:"Packet → Segment → Frame → Bits",C:"Frame → Packet → Segment → Bits",D:"Bits → Frame → Packet → Segment"},answer:"A",explanation:"Encapsulation adds headers going down the stack: the transport layer creates a segment, the network layer wraps it in a packet, the data-link layer builds a frame, and the physical layer transmits bits."},
{id:"ex1_09",domain:1,question:"Which option correctly pairs a protocol with its standard transport protocol and port number?",options:{A:"RDP — UDP 3389",B:"SNMP — TCP 161",C:"Syslog — UDP 514",D:"LDAP — TCP 636"},answer:"C",explanation:"Syslog uses UDP 514 by default. RDP uses TCP 3389, SNMP uses UDP 161/162, and LDAP uses TCP 389 (636 is LDAPS). Knowing the transport, not just the port, is commonly tested."},
{id:"ex1_10",domain:1,question:"On an 802.1Q trunk, a frame arrives with no VLAN tag. How does the receiving switch handle it?",options:{A:"It drops the frame as invalid",B:"It places the frame on the native VLAN",C:"It assigns the frame to VLAN 4095",D:"It floods the frame to every VLAN"},answer:"B",explanation:"Untagged frames on a trunk are associated with the native VLAN (default VLAN 1). This is why native-VLAN mismatches between switches are a security and connectivity concern."},
{id:"ex1_11",domain:1,question:"A 1 Gbps uplink averages 250 Mbps but bursts to 900 Mbps, causing periodic packet drops during congestion. Which solution BEST mitigates the burst-related drops WITHOUT upgrading the link?",options:{A:"Enable jumbo frames on the link",B:"Implement QoS traffic shaping and prioritized queuing",C:"Increase the interface MTU to 9000",D:"Disable Ethernet flow control"},answer:"B",explanation:"QoS shaping smooths bursts and prioritized queuing protects sensitive traffic during congestion, addressing drops without more bandwidth. MTU/jumbo-frame and flow-control changes do not resolve congestion-based loss."},
{id:"ex1_12",domain:1,question:"Host 192.168.5.40 with mask 255.255.255.224 needs to communicate with 192.168.5.70. Will the traffic be sent to the default gateway, and why?",options:{A:"No — both addresses are in the same subnet",B:"Yes — .70 is in a different /27 subnet than .40",C:"No — .70 is the broadcast address of the subnet",D:"Yes — .40 is a network address and cannot send directly"},answer:"B",explanation:"A /27 (255.255.255.224) has a block size of 32: subnets are .0-.31, .32-.63, .64-.95… Host .40 is in the .32-.63 subnet while .70 is in the .64-.95 subnet, so the traffic is off-subnet and must go to the gateway."},
{id:"ex1_13",domain:1,question:"Small pings succeed across a VPN, but large file transfers stall and a ping with the Don't-Fragment bit set and a large payload fails. What is the MOST likely cause?",options:{A:"DNS resolution failure",B:"An MTU/fragmentation mismatch across the tunnel",C:"An empty ARP cache",D:"A duplex mismatch on the LAN"},answer:"B",explanation:"VPN/tunnel overhead reduces the effective MTU. Small packets pass, but full-size packets that cannot be fragmented (DF set) are dropped, stalling large transfers. Lowering the MTU/MSS resolves it."},
{id:"ex1_14",domain:1,question:"A Windows host displays an address of 169.254.23.10 and cannot reach other subnets. What does this MOST likely indicate?",options:{A:"A successful DHCP lease",B:"A static misconfiguration set by the user",C:"The host failed to obtain a DHCP address (APIPA)",D:"DNS cache poisoning"},answer:"C",explanation:"169.254.0.0/16 is the APIPA range, self-assigned when a DHCP client cannot reach a DHCP server. APIPA only allows local-link communication, so off-subnet traffic fails."},
{id:"ex1_15",domain:1,question:"A router-on-a-stick ACL is written with the source 192.168.10.0 and wildcard mask 0.0.0.255. Which addresses does this statement match?",options:{A:"Only 192.168.10.0",B:"All hosts in 192.168.10.0/24",C:"All hosts in 192.168.0.0/16",D:"Only the broadcast address"},answer:"B",explanation:"A wildcard mask of 0.0.0.255 means 'match the first three octets exactly, any value in the last octet,' which equals every host in 192.168.10.0/24. Wildcard masks are the inverse of subnet masks."},
{id:"ex1_16",domain:1,question:"Multiple geographically separated DNS servers respond to queries sent to a single shared IP address, with each client reaching the nearest server. Which addressing method enables this behavior?",options:{A:"Multicast",B:"Broadcast",C:"Anycast",D:"Unicast"},answer:"C",explanation:"Anycast advertises the same IP from multiple locations; routing delivers traffic to the topologically nearest instance. It is widely used for DNS root/recursive servers and CDNs for resilience and low latency."},
{id:"ex1_17",domain:1,question:"A client establishes an outbound HTTPS connection to a web server. Which statement about the client's SOURCE port is correct?",options:{A:"It is always port 443",B:"It is a well-known port below 1024",C:"It is an ephemeral port (typically 49152-65535)",D:"It is always port 80"},answer:"C",explanation:"The destination port is 443, but the client selects a dynamic/ephemeral source port (commonly 49152-65535) so the OS can track the specific session. The server replies to that ephemeral port."},
{id:"ex1_18",domain:1,question:"Replacing a hub with a switch in a workgroup PRIMARILY changes the network in which way?",options:{A:"It increases the size of the broadcast domain",B:"It creates a separate collision domain on each port",C:"It removes the need for a default gateway",D:"It merges multiple VLANs into one"},answer:"B",explanation:"A switch micro-segments the network, giving each port its own collision domain and enabling full-duplex. By default all switch ports remain in one broadcast domain (until VLANs are added)."},
{id:"ex1_19",domain:1,question:"A network has four VLANs, with inter-VLAN routing provided by a single router. How many broadcast domains exist?",options:{A:"1",B:"2",C:"4",D:"8"},answer:"C",explanation:"Each VLAN is its own broadcast domain regardless of how many switches carry it. Four VLANs equal four broadcast domains; the router connects (and bounds) them at Layer 3."},
{id:"ex1_20",domain:1,question:"A host with an empty ARP cache must send a packet to another host on the SAME subnet. What does it do first?",options:{A:"Forward the packet to its default gateway",B:"Send a DNS query for the destination",C:"Broadcast an ARP request for the destination's MAC address",D:"Send an ICMP redirect"},answer:"C",explanation:"For a same-subnet destination, the host needs the destination's MAC. With no cached entry it broadcasts an ARP request ('Who has this IP?') and the owner replies with its MAC. The gateway is only used for off-subnet traffic."},
{id:"ex1_21",domain:1,question:"192.168.0.0/24 is divided into /28 subnets. How many subnets are created and how many usable hosts does each contain?",options:{A:"8 subnets, 30 hosts each",B:"16 subnets, 14 hosts each",C:"14 subnets, 16 hosts each",D:"32 subnets, 6 hosts each"},answer:"B",explanation:"Going from /24 to /28 borrows 4 host bits: 2^4 = 16 subnets. Each /28 has 4 host bits remaining: 2^4 − 2 = 14 usable hosts."},
{id:"ex1_22",domain:1,question:"Which IPv6 address type begins in the FE80::/10 range and is valid only for communication on a single local link?",options:{A:"Global unicast",B:"Unique local",C:"Link-local",D:"Anycast"},answer:"C",explanation:"FE80::/10 is the link-local range, automatically assigned to every IPv6 interface and used for neighbor discovery and on-link communication. It is never routed off the link, similar in spirit to IPv4 APIPA."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 2 — Network Implementation
// ════════════════════════════════════════════════════════════════════
{id:"ex2_01",domain:2,question:"After adding a second link between two switches for redundancy, users experience intermittent outages, MAC table instability, and very high switch CPU. Which protocol was most likely disabled and should be re-enabled?",options:{A:"LACP",B:"Spanning Tree Protocol",C:"DHCP snooping",D:"802.1X"},answer:"B",explanation:"Those symptoms describe a Layer 2 loop. Spanning Tree Protocol (or RSTP) detects redundant paths and blocks one to prevent loops. Without it, broadcasts circulate endlessly, flooding the network and spiking CPU."},
{id:"ex2_02",domain:2,question:"A single router interface must route traffic between VLAN 10 and VLAN 20 over one physical trunk to a switch. What configuration accomplishes this?",options:{A:"A separate physical interface for each VLAN",B:"Subinterfaces with 802.1Q encapsulation, one per VLAN",C:"An access port assigned to VLAN 10",D:"A loopback interface per VLAN"},answer:"B",explanation:"This is router-on-a-stick: the physical interface is divided into subinterfaces, each tagged with 802.1Q for one VLAN and given that VLAN's gateway IP. The single trunk carries all tagged VLAN traffic."},
{id:"ex2_03",domain:2,question:"Two switches are connected by four 1 Gbps links bundled with LACP. One physical link fails. What is the result?",options:{A:"The entire bundle goes down until the link is repaired",B:"The bundle continues operating at roughly 3 Gbps",C:"Spanning Tree blocks all four ports",D:"Both switches reload to re-elect a root bridge"},answer:"B",explanation:"Link aggregation provides both added bandwidth and redundancy. Losing one member reduces aggregate throughput (≈3 Gbps remaining) but the logical channel stays up and traffic is redistributed across surviving links."},
{id:"ex2_04",domain:2,question:"Using Cisco's default OSPF reference bandwidth (100 Mbps), what cost does OSPF assign to a 1 Gbps interface?",options:{A:"1",B:"10",C:"100",D:"1000"},answer:"A",explanation:"OSPF cost = reference bandwidth ÷ interface bandwidth = 100,000,000 ÷ 1,000,000,000 = 0.1, which rounds up to the minimum cost of 1. This is why all links ≥100 Mbps get cost 1 by default unless the reference bandwidth is raised."},
{id:"ex2_05",domain:2,question:"A destination network is learned through both OSPF (administrative distance 110) and a configured static route (administrative distance 1). Which is installed in the routing table, and why?",options:{A:"OSPF, because it has the better metric",B:"The static route, because of its lower administrative distance",C:"Both, load-balanced equally",D:"Neither, because of the conflict"},answer:"B",explanation:"When the same prefix is learned from multiple sources, the router compares administrative distance first — lower wins. A static route (AD 1) is trusted over an OSPF route (AD 110), so it is installed."},
{id:"ex2_06",domain:2,question:"A 10 Gbps link is needed between two buildings 9 km apart. Which transmission medium is appropriate?",options:{A:"Cat6a copper",B:"Multimode OM3 fiber",C:"Single-mode fiber",D:"RG-6 coaxial"},answer:"C",explanation:"Copper is limited to ~100 m and multimode to a few hundred meters at 10 Gbps. Single-mode fiber, using a laser source, supports high data rates over many kilometers, making it the correct choice for a 9 km run."},
{id:"ex2_07",domain:2,question:"An access switch must power 24 access points that each draw about 25 W. Which standard and consideration apply?",options:{A:"802.3af (15.4 W); no further planning needed",B:"802.3at (PoE+, 30 W) per port, while staying within the switch's total power budget",C:"PoE is unnecessary for access points",D:"Only 802.3bt at 100 W per port will work"},answer:"B",explanation:"25 W exceeds 802.3af's 15.4 W, so 802.3at (PoE+, up to 30 W) is required per port. Just as important, 24 × 25 W can exceed the switch's overall PoE power budget, so total budget must be verified."},
{id:"ex2_08",domain:2,question:"To avoid co-channel interference among 2.4 GHz access points in the United States, which channel plan should be used?",options:{A:"Channels 1, 5, and 9",B:"Channels 1, 6, and 11",C:"Channels 2, 7, and 12",D:"All available channels at full power"},answer:"B",explanation:"In the 2.4 GHz band only channels 1, 6, and 11 are non-overlapping in the US. Using these three lets adjacent APs operate without interfering, which is essential in dense deployments."},
{id:"ex2_09",domain:2,question:"A client must achieve the highest throughput using the 6 GHz band. Which wireless standard is required?",options:{A:"802.11n (Wi-Fi 4)",B:"802.11ac (Wi-Fi 5)",C:"802.11ax (Wi-Fi 6E)",D:"802.11g"},answer:"C",explanation:"Only 802.11ax operating as Wi-Fi 6E extends into the 6 GHz band, which offers wide, interference-free channels. Wi-Fi 5 (ac) is limited to 5 GHz, and n/g are older and slower."},
{id:"ex2_10",domain:2,question:"Two routers must present a single virtual gateway IP so that hosts retain connectivity if one router fails. Which protocol family provides this?",options:{A:"STP / RSTP",B:"HSRP / VRRP",C:"OSPF / EIGRP",D:"LACP / PAgP"},answer:"B",explanation:"First-hop redundancy protocols (HSRP, VRRP, GLBP) let multiple routers share a virtual IP/MAC used as the default gateway. If the active router fails, a standby takes over transparently with no client reconfiguration."},
{id:"ex2_11",domain:2,question:"A trunk has native VLAN 1 configured on one switch and native VLAN 99 on the other. What is the consequence?",options:{A:"The trunk will not form under any circumstances",B:"A native-VLAN mismatch occurs, risking traffic leaking between VLANs and generating errors",C:"Spanning Tree converges faster",D:"There is no operational impact"},answer:"B",explanation:"Mismatched native VLANs cause untagged traffic from one VLAN to be received into a different VLAN on the far side — a security risk and a source of CDP/STP errors. Both ends must agree on the native VLAN."},
{id:"ex2_12",domain:2,question:"Which static route configuration correctly sends all traffic for unknown destinations to next-hop 203.0.113.1?",options:{A:"ip route 0.0.0.0 0.0.0.0 203.0.113.1",B:"ip route 203.0.113.1 255.255.255.255 0.0.0.0",C:"ip route 0.0.0.0 255.255.255.255 203.0.113.1",D:"ip route 203.0.113.0 255.255.255.0 0.0.0.0"},answer:"A",explanation:"A default route is written as ip route 0.0.0.0 0.0.0.0 <next-hop>. The all-zeros network and mask match any destination not found more specifically in the routing table."},
{id:"ex2_13",domain:2,question:"A patch cable is terminated with the T568A standard on one end and T568B on the other. What type of cable results?",options:{A:"Straight-through",B:"Rollover (console)",C:"Crossover",D:"Loopback"},answer:"C",explanation:"Mixing T568A and T568B on opposite ends swaps the transmit and receive pairs, producing a crossover cable. Modern Auto-MDI-X interfaces adapt automatically, but the wiring itself is a crossover."},
{id:"ex2_14",domain:2,question:"Clients on VLAN 30 receive no IP addresses, while the DHCP server resides on VLAN 10. What must be configured on the VLAN 30 gateway interface?",options:{A:"DHCP snooping",B:"An ip helper-address pointing to the DHCP server (DHCP relay)",C:"Static ARP entries for each client",D:"Port security"},answer:"B",explanation:"DHCP discovery is a broadcast that routers do not forward across subnets. Configuring ip helper-address (a DHCP relay/IP helper) on the VLAN 30 gateway forwards those requests as unicast to the DHCP server on VLAN 10."},
{id:"ex2_15",domain:2,question:"An enterprise wants to combine MPLS and broadband Internet circuits, dynamically steering application traffic by central policy. Which technology accomplishes this?",options:{A:"Frame Relay",B:"SD-WAN",C:"Dial-up backup",D:"Plain MPLS only"},answer:"B",explanation:"SD-WAN abstracts multiple underlying transports (MPLS, broadband, LTE) and uses a centralized controller with application-aware policies to choose the best path per flow, improving cost and resilience over single-transport WANs."},
{id:"ex2_16",domain:2,question:"Remote employees need encrypted access to internal resources from laptops on untrusted networks. Which VPN type fits BEST?",options:{A:"Site-to-site IPsec tunnel",B:"Client-to-site (remote-access) VPN",C:"Unencrypted GRE tunnel",D:"MPLS L3VPN"},answer:"B",explanation:"A client-to-site (remote-access) VPN lets individual user devices establish encrypted tunnels to the corporate network from anywhere. Site-to-site VPNs connect fixed locations, not roaming individual laptops."},
{id:"ex2_17",domain:2,question:"How does Spanning Tree Protocol determine which switch becomes the root bridge?",options:{A:"The switch with the highest MAC address",B:"The switch with the lowest bridge ID (priority combined with MAC address)",C:"The switch with the most active ports",D:"The first switch powered on"},answer:"B",explanation:"STP elects the root bridge by lowest bridge ID, which is the priority value followed by the MAC address. Lowering a switch's priority is how administrators deterministically choose the root."},
{id:"ex2_18",domain:2,question:"On a Layer 3 switch, what provides the routable default-gateway IP address for a given VLAN?",options:{A:"An access port in that VLAN",B:"A trunk port",C:"A Switch Virtual Interface (SVI)",D:"The console port"},answer:"C",explanation:"A Switch Virtual Interface (SVI) is a logical Layer 3 interface for a VLAN. Assigning it an IP enables inter-VLAN routing and gives hosts in that VLAN a gateway, eliminating the need for an external router."},
{id:"ex2_19",domain:2,question:"A new access-layer deployment requires that end-user ports transition to forwarding immediately while still being protected from accidental switch connections. Which combination is BEST?",options:{A:"PortFast with BPDU Guard",B:"Disable STP entirely on access ports",C:"Configure all access ports as trunks",D:"Enable LACP on every access port"},answer:"A",explanation:"PortFast skips STP listening/learning so host ports come up immediately, and BPDU Guard shuts the port down if it ever receives a BPDU (indicating a rogue switch), preserving loop protection. Disabling STP would remove that protection."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 3 — Network Operations
// ════════════════════════════════════════════════════════════════════
{id:"ex3_01",domain:3,question:"A monitoring platform must poll device metrics with both authentication and encryption of the management data. Which protocol version should be used?",options:{A:"SNMPv1",B:"SNMPv2c",C:"SNMPv3",D:"Telnet"},answer:"C",explanation:"Only SNMPv3 adds authentication and encryption (the authPriv security level). SNMPv1 and v2c rely on plaintext community strings, exposing credentials and data — never appropriate for production monitoring."},
{id:"ex3_02",domain:3,question:"A device generates a Syslog message at severity level 0. What does that level signify?",options:{A:"Debug-level detail",B:"Informational message",C:"Emergency — the system is unusable",D:"Notice — normal but significant"},answer:"C",explanation:"Syslog severity runs 0 (Emergency, system unusable) through 7 (Debug). Lower numbers are more severe, so level 0 is the most critical and warrants immediate attention."},
{id:"ex3_03",domain:3,question:"A business states that, after a failure, it can afford to lose no more than 15 minutes of data. Which metric does this statement define?",options:{A:"Recovery Time Objective (RTO)",B:"Recovery Point Objective (RPO)",C:"Mean Time Between Failures (MTBF)",D:"Mean Time To Repair (MTTR)"},answer:"B",explanation:"RPO defines the maximum acceptable data loss measured in time, which dictates backup frequency. A 15-minute RPO means backups/replication must occur at least every 15 minutes. RTO, by contrast, is the maximum acceptable downtime."},
{id:"ex3_04",domain:3,question:"A backup scheme runs a full backup Sunday, then each weeknight backs up only the data changed since the PREVIOUS night's backup. Which type is this, and what is required to restore Thursday's data?",options:{A:"Differential — restore the full backup plus Thursday only",B:"Incremental — restore the full backup plus every nightly backup since Sunday",C:"Full nightly — restore only Thursday",D:"Snapshot — no full backup needed"},answer:"B",explanation:"Backing up changes since the last backup of any type is an incremental backup. Restoring requires the last full plus each incremental in order (Mon, Tue, Wed, Thu). It minimizes backup time at the cost of a longer, multi-set restore."},
{id:"ex3_05",domain:3,question:"A company requires failover within minutes using real-time data replication. Which disaster-recovery facility meets this need?",options:{A:"Cold site",B:"Warm site",C:"Hot site",D:"Reciprocal agreement"},answer:"C",explanation:"A hot site is fully equipped and kept in near real-time sync, enabling failover in minutes. Warm sites need data restoration (hours) and cold sites are empty facilities requiring setup (days)."},
{id:"ex3_06",domain:3,question:"Management asks which internal hosts consume the most bandwidth and which destinations they talk to. Which technology answers this MOST directly?",options:{A:"SNMP interface polling",B:"Syslog collection",C:"NetFlow / IPFIX flow data",D:"ICMP ping sweeps"},answer:"C",explanation:"Flow technologies (NetFlow, sFlow, IPFIX) record conversation metadata — source/destination IPs, ports, protocols, and byte counts — which directly reveals top talkers and traffic patterns. SNMP shows utilization but not who-talks-to-whom."},
{id:"ex3_07",domain:3,question:"Before applying a firmware upgrade to a core switch, which item is MOST critical to prepare as part of the change request?",options:{A:"A marketing announcement",B:"A documented rollback/backout plan",C:"A new hardware purchase order",D:"An updated SLA with the ISP"},answer:"B",explanation:"Change management requires a rollback plan so that, if the upgrade fails or causes issues, the device can be restored to its prior working state quickly. Risk assessment and a maintenance window accompany it."},
{id:"ex3_08",domain:3,question:"An ISP SLA guarantees 99.9% availability. Approximately how much downtime per YEAR does that permit?",options:{A:"About 52 minutes",B:"About 8.8 hours",C:"About 4.4 hours",D:"About 88 hours"},answer:"B",explanation:"99.9% allows ~0.1% downtime: 8,760 hours/year × 0.001 ≈ 8.76 hours. For comparison, 99.99% ('four nines') allows only ~52 minutes/year."},
{id:"ex3_09",domain:3,question:"Users report the network 'feels slow,' but no metrics exist. What is needed to OBJECTIVELY determine whether current performance is abnormal?",options:{A:"Immediately add more bandwidth",B:"A previously captured performance baseline to compare against",C:"A new firewall",D:"A faster DNS server"},answer:"B",explanation:"A baseline documents normal utilization, latency, and error rates. Without it, you cannot tell whether current readings are abnormal. Comparing live data to the baseline is what turns a subjective complaint into a measurable problem."},
{id:"ex3_10",domain:3,question:"For log correlation in a SIEM to be reliable, timestamps across all devices must match. Which service should be deployed to ensure this?",options:{A:"Syslog",B:"NTP",C:"SNMP",D:"DHCP"},answer:"B",explanation:"NTP (Network Time Protocol) synchronizes clocks across devices. Without consistent time, correlating events between systems in a SIEM is unreliable, undermining troubleshooting and incident investigation."},
{id:"ex3_11",domain:3,question:"To reduce spoofed email that appears to come from your domain, which DNS-based mechanisms should be implemented?",options:{A:"PTR records only",B:"SPF, DKIM, and DMARC records (largely via TXT)",C:"Higher MX priority values",D:"Additional AAAA records"},answer:"B",explanation:"SPF lists authorized senders, DKIM signs messages, and DMARC sets policy and reporting — all published as DNS records (mostly TXT). Together they let receiving servers verify and reject forged mail from your domain."},
{id:"ex3_12",domain:3,question:"A database server needs both high I/O performance and the ability to keep running if a single disk fails. Which RAID level BEST fits?",options:{A:"RAID 0",B:"RAID 5",C:"RAID 10",D:"JBOD"},answer:"C",explanation:"RAID 10 (mirrored stripes) delivers high read/write performance and tolerates at least one drive failure with no write-parity penalty, making it the typical choice for performance-sensitive databases. RAID 5's parity writes hurt I/O performance."},
{id:"ex3_13",domain:3,question:"A technician must send a copy of all traffic on one switch port to a packet analyzer attached to another port. Which feature is required?",options:{A:"PoE",B:"Port mirroring (SPAN)",C:"Spanning Tree PortFast",D:"DHCP relay"},answer:"B",explanation:"Port mirroring (SPAN) copies frames from a source port (or VLAN) to a destination port where a sniffer is connected. Without it, a switch only sends each frame to its intended port, so the analyzer would see little traffic."},
{id:"ex3_14",domain:3,question:"Which metric reflects how quickly a failed component can typically be restored to service?",options:{A:"MTBF",B:"MTTR",C:"RPO",D:"SLA"},answer:"B",explanation:"Mean Time To Repair (MTTR) measures average restoration time and indicates maintainability. MTBF measures reliability (time between failures), while RPO and SLA address data loss and service commitments respectively."},
{id:"ex3_15",domain:3,question:"An organization wants every switch to run an approved, version-controlled configuration and to be alerted when a device drifts from that standard. Which practice supports this?",options:{A:"Ad-hoc edits applied directly on each device",B:"Configuration management with version control and drift detection",C:"Disabling logging to reduce noise",D:"Letting each technician keep personal config copies"},answer:"B",explanation:"Configuration management stores a known-good baseline in version control and compares running configs against it, flagging unauthorized changes (drift). This improves consistency, auditing, and rapid recovery."},
{id:"ex3_16",domain:3,question:"A company needs to track and approve who can make changes to network devices, with every command attributed to an individual. Which capability is MOST relevant?",options:{A:"Accounting within an AAA framework",B:"DHCP lease logging",C:"Spanning Tree topology change notices",D:"NetFlow export"},answer:"A",explanation:"The accounting component of AAA records what an authenticated, authorized user did — useful for auditing administrative actions. TACACS+ in particular supports per-command accounting for device administration."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 4 — Network Security
// ════════════════════════════════════════════════════════════════════
{id:"ex4_01",domain:4,question:"An attacker floods the LAN with forged ARP replies that map their own MAC to the default gateway's IP, intercepting other hosts' traffic. Which attack is this, and what mitigation is MOST appropriate?",options:{A:"MAC flooding — mitigated by port security",B:"ARP spoofing — mitigated by Dynamic ARP Inspection",C:"DDoS — mitigated by rate limiting",D:"VLAN hopping — mitigated by disabling trunking"},answer:"B",explanation:"Falsifying ARP replies to redirect traffic is ARP spoofing/poisoning, the basis of many on-path attacks. Dynamic ARP Inspection (DAI), working with DHCP snooping bindings, validates ARP messages and drops forged ones."},
{id:"ex4_02",domain:4,question:"Which two techniques are associated with VLAN hopping, and what mitigates them?",options:{A:"Switch spoofing and double tagging — mitigated by disabling DTP/auto-trunking and changing the native VLAN",B:"SYN flooding and IP spoofing — mitigated by a stateful firewall",C:"Phishing and pretexting — mitigated by user training",D:"ARP poisoning and MAC flooding — mitigated by DAI"},answer:"A",explanation:"VLAN hopping uses switch spoofing (negotiating a trunk via DTP) or double tagging (nested 802.1Q tags exploiting the native VLAN). Disabling DTP/auto-trunk, hard-setting access ports, and moving the native VLAN off VLAN 1 mitigate it."},
{id:"ex4_03",domain:4,question:"A company wants to authenticate each device at the switch port before granting any network access. Which standard provides port-based network access control?",options:{A:"WPA2-Personal",B:"802.1X with a RADIUS authentication server",C:"A standard ACL",D:"Static NAT"},answer:"B",explanation:"802.1X provides port-based access control: the switch (authenticator) blocks traffic until the supplicant authenticates to a RADIUS server. Only after successful authentication is the port opened to the appropriate VLAN."},
{id:"ex4_04",domain:4,question:"Traffic must be inspected at Layer 7 to block specific applications and to stop intrusions inline. Which device is MOST appropriate?",options:{A:"A packet-filtering firewall",B:"A basic stateful firewall",C:"A Next-Generation Firewall (NGFW)",D:"An unmanaged switch"},answer:"C",explanation:"An NGFW combines stateful inspection with application awareness, user identity, and integrated IPS — enabling Layer 7 control such as blocking specific apps and stopping attacks inline. Packet-filter and basic stateful firewalls only inspect headers/state."},
{id:"ex4_05",domain:4,question:"Public-facing web and email servers must be reachable from the Internet yet isolated from the internal LAN. Where should they be placed?",options:{A:"On the internal user VLAN",B:"In a DMZ / screened subnet",C:"On the switch management VLAN",D:"On a router loopback interface"},answer:"B",explanation:"A DMZ (screened subnet) sits between the Internet and the internal network. Public services are placed there so that, if compromised, the attacker is contained and cannot pivot directly into internal resources."},
{id:"ex4_06",domain:4,question:"Which Wi-Fi security standard uses Simultaneous Authentication of Equals (SAE) to resist offline dictionary attacks against the pre-shared key?",options:{A:"WEP",B:"WPA",C:"WPA2-PSK",D:"WPA3"},answer:"D",explanation:"WPA3 replaces the WPA2 4-way-handshake PSK exchange with SAE, which provides forward secrecy and resists offline dictionary attacks even if the handshake is captured. WEP and WPA are deprecated and weak."},
{id:"ex4_07",domain:4,question:"A security model that never implicitly trusts a user or device based on network location and continuously verifies every request is known as:",options:{A:"Perimeter (castle-and-moat) security",B:"Defense in depth",C:"Zero Trust",D:"Implicit deny only"},answer:"C",explanation:"Zero Trust assumes no inherent trust from being 'inside' the network; every access is authenticated, authorized, and continuously validated. It contrasts with the older perimeter model that trusted internal traffic by default."},
{id:"ex4_08",domain:4,question:"An employee receives a phone call from someone claiming to be IT support, urgently demanding the user's password to 'fix an outage.' Which attack is this BEST described as?",options:{A:"Smishing",B:"Vishing / pretexting",C:"Tailgating",D:"On-path attack"},answer:"B",explanation:"Voice-based social engineering is vishing, and inventing a believable scenario (the 'outage') to manipulate the target is pretexting. Smishing uses SMS, and tailgating is physically following someone through a secured door."},
{id:"ex4_09",domain:4,question:"To stop an attacker from connecting a rogue device or flooding the CAM table on an access port, which feature limits the MAC addresses allowed on that port?",options:{A:"DHCP snooping",B:"Port security",C:"Spanning Tree",D:"QoS marking"},answer:"B",explanation:"Port security restricts which (and how many) MAC addresses may use a switch port, and can shut the port or drop traffic on violation. This blocks rogue devices and MAC-flooding attempts at the access layer."},
{id:"ex4_10",domain:4,question:"Which switch feature prevents a rogue DHCP server from handing out addresses by allowing DHCP server responses only from designated trusted ports?",options:{A:"Dynamic ARP Inspection",B:"DHCP snooping",C:"802.1X",D:"Port mirroring"},answer:"B",explanation:"DHCP snooping classifies ports as trusted or untrusted and drops DHCP server messages (OFFER/ACK) arriving on untrusted ports, stopping rogue DHCP servers. It also builds the binding table that DAI relies on."},
{id:"ex4_11",domain:4,question:"A ransomware infection encrypts critical files so users can no longer open them. Which element of the CIA triad is MOST directly impacted?",options:{A:"Confidentiality",B:"Integrity",C:"Availability",D:"Non-repudiation"},answer:"C",explanation:"Ransomware's primary effect is denying access to data and systems, which targets availability. While integrity can be affected, the defining impact users experience is the loss of access to their files and services."},
{id:"ex4_12",domain:4,question:"A security appliance observes traffic and raises alerts on malicious activity but does NOT block it. Which type of system is this?",options:{A:"IPS",B:"IDS",C:"WAF",D:"Proxy"},answer:"B",explanation:"An IDS (Intrusion Detection System) monitors passively and alerts but does not stop traffic. An IPS sits inline and can actively block. The distinction — detection vs. prevention — is frequently tested."},
{id:"ex4_13",domain:4,question:"Which statement correctly compares TACACS+ and RADIUS?",options:{A:"RADIUS uses TCP port 49 and encrypts the entire packet",B:"TACACS+ encrypts the entire payload and separates the authentication, authorization, and accounting functions",C:"RADIUS fully separates authentication from authorization",D:"TACACS+ is an open standard that runs over UDP"},answer:"B",explanation:"TACACS+ (TCP 49) encrypts the whole payload and treats AAA as independent functions, which is ideal for granular device administration. RADIUS (UDP) encrypts only the password and combines authentication with authorization."},
{id:"ex4_14",domain:4,question:"Which control BEST protects sensitive data from being read if it is intercepted during an on-path (man-in-the-middle) attack?",options:{A:"Enforcing longer user passwords",B:"End-to-end encryption such as TLS or IPsec",C:"Increasing link bandwidth",D:"Enabling port security"},answer:"B",explanation:"Even if an attacker intercepts traffic, strong end-to-end encryption (TLS, IPsec) renders the contents unreadable and tamper-evident. Passwords, bandwidth, and port security do not protect data already in transit on the wire."},
{id:"ex4_15",domain:4,question:"Before a laptop is admitted to the network, the system checks its OS patch level and antivirus status, quarantining it if non-compliant. Which capability provides this?",options:{A:"Port mirroring",B:"NAC posture assessment",C:"Static NAT",D:"QoS classification"},answer:"B",explanation:"Network Access Control (NAC) performs posture assessment — verifying endpoint health (patches, AV, configuration) before granting access and quarantining or remediating non-compliant devices. It is often integrated with 802.1X."},
{id:"ex4_16",domain:4,question:"An IT administrator uses a single highly privileged account for routine web browsing and email as well as device administration. Which security principle is being violated?",options:{A:"Defense in depth",B:"Least privilege",C:"Zero Trust",D:"Implicit deny"},answer:"B",explanation:"Least privilege says users and accounts should hold only the access needed for the task at hand. Using an admin-level account for everyday activities greatly increases risk if that account is compromised."},
{id:"ex4_17",domain:4,question:"A decoy system is deliberately deployed to attract attackers and study their methods without exposing production assets. What is it called?",options:{A:"Web Application Firewall",B:"Honeypot",C:"Reverse proxy",D:"Jump host"},answer:"B",explanation:"A honeypot is an intentionally exposed decoy that lures attackers, lets defenders observe techniques, and diverts attention from real systems. A honeynet is a network of such decoys."},
{id:"ex4_18",domain:4,question:"Which protocol should replace Telnet for managing a switch's command-line interface, and why?",options:{A:"HTTP, because it is web-based",B:"SSH, because it encrypts the management session",C:"SNMPv2c, because it uses community strings",D:"FTP, because it is widely supported"},answer:"B",explanation:"Telnet transmits credentials and commands in plaintext. SSH encrypts the entire session, protecting administrative access from eavesdropping and credential theft, and is the standard for secure CLI management."},
{id:"ex4_19",domain:4,question:"A web server is being overwhelmed by half-open TCP connections from many spoofed source addresses, exhausting its connection table. Which attack is occurring?",options:{A:"ARP poisoning",B:"SYN flood",C:"DNS amplification reflection",D:"Evil twin"},answer:"B",explanation:"A SYN flood sends many SYNs without completing the handshake, filling the server's table of half-open connections and denying service to legitimate clients. SYN cookies and rate limiting are common mitigations."},

// ════════════════════════════════════════════════════════════════════
// DOMAIN 5 — Network Troubleshooting
// ════════════════════════════════════════════════════════════════════
{id:"ex5_01",domain:5,question:"A technician has just confirmed a theory of probable cause. According to CompTIA's troubleshooting methodology, what is the NEXT step?",options:{A:"Document the findings and outcomes",B:"Establish a plan of action to resolve the problem",C:"Identify the problem and gather information",D:"Verify full system functionality"},answer:"B",explanation:"The methodology order is: identify the problem → establish a theory → test the theory → establish a plan of action → implement → verify → document. After confirming the theory, the next step is to build a plan of action."},
{id:"ex5_02",domain:5,question:"A user reports a problem. Following best practice, what should the technician do FIRST?",options:{A:"Reboot the access switch",B:"Identify the problem by gathering information, scope, and recent changes",C:"Replace the user's network cable",D:"Escalate to the ISP"},answer:"B",explanation:"The first methodology step is to identify the problem: gather symptoms, determine who/what is affected, and ask what recently changed. Acting (rebooting, replacing, escalating) before understanding the issue wastes time and risks new problems."},
{id:"ex5_03",domain:5,question:"A link with a verified-good cable shows late collisions, runts, and poor throughput. What is the MOST likely cause?",options:{A:"DNS misconfiguration",B:"A speed/duplex mismatch between the two interfaces",C:"A VLAN assignment error",D:"DHCP scope exhaustion"},answer:"B",explanation:"Late collisions and runts on a known-good cable are classic signs of a duplex mismatch (one side full-duplex, the other half-duplex). Setting both ends the same — ideally auto/auto or matching hard-set values — resolves it."},
{id:"ex5_04",domain:5,question:"Pinging 8.8.8.8 succeeds, but pinging google.com fails. What is the MOST likely problem?",options:{A:"The default gateway is down",B:"DNS name resolution is failing",C:"The physical cable is faulty",D:"The NIC has failed"},answer:"B",explanation:"Reaching an IP but not a name isolates the fault to DNS. If the cable, NIC, or gateway were the issue, the IP ping would also fail. The next step is to check DNS server settings and resolution with nslookup/dig."},
{id:"ex5_05",domain:5,question:"A host communicates fine with devices on its own subnet but cannot reach any other subnet or the Internet. Which misconfiguration is MOST likely?",options:{A:"An incorrect or missing default gateway",B:"A wrong hostname",C:"A duplicate MAC address",D:"A disabled DNS cache"},answer:"A",explanation:"Same-subnet traffic uses local switching and does not need the gateway, but off-subnet traffic does. Working locally while failing everywhere else points squarely at a default-gateway problem (missing, wrong, or unreachable)."},
{id:"ex5_06",domain:5,question:"Devices at the far end of a copper Ethernet run measured at about 130 meters experience intermittent connectivity. What is the MOST likely cause?",options:{A:"The run exceeds the 100-meter copper limit",B:"The wrong VLAN is assigned",C:"DNS is slow",D:"A firewall is blocking traffic"},answer:"A",explanation:"Twisted-pair Ethernet is specified for a maximum of 100 meters (including patch cords). At 130 m, signal attenuation causes errors and intermittent links. Fiber or an intermediate switch/repeater is needed for longer runs."},
{id:"ex5_07",domain:5,question:"Which tool identifies the distance to a fault or break in a copper cable run?",options:{A:"A tone generator and probe",B:"A Time-Domain Reflectometer (TDR)",C:"A loopback plug",D:"A simple continuity multimeter"},answer:"B",explanation:"A TDR sends a signal and measures reflections to pinpoint the distance to an impedance change such as a break or short. A tone generator helps trace/locate a cable, but does not measure fault distance."},
{id:"ex5_08",domain:5,question:"A traceroute returns normal responses for the first several hops, then shows '* * *' for the remaining hops, yet the destination web page loads correctly. What does this indicate?",options:{A:"The destination server is down",B:"A device in the path is filtering ICMP/TTL-exceeded messages, which is often normal",C:"DNS resolution has failed",D:"There is a routing loop"},answer:"B",explanation:"Many routers and firewalls rate-limit or block the ICMP Time-Exceeded replies that traceroute relies on, producing timeouts even though traffic still flows. Since the page loads, end-to-end connectivity is fine."},
{id:"ex5_09",domain:5,question:"Immediately after a cabling change, every switch port shows near-100% utilization and the network becomes unusable. What is the MOST likely cause?",options:{A:"DNS cache poisoning",B:"A Layer 2 switching loop causing a broadcast storm",C:"DHCP scope exhaustion",D:"A slow DNS server"},answer:"B",explanation:"A cabling change that creates a redundant path without Spanning Tree active produces a switching loop. Broadcasts circulate endlessly (a broadcast storm), saturating links and crippling the network. STP/RSTP prevents this."},
{id:"ex5_10",domain:5,question:"Two workstations intermittently lose connectivity and Windows reports an IP address conflict. What is the MOST likely cause?",options:{A:"DHCP is functioning correctly",B:"A statically assigned IP overlaps a DHCP-assigned address or another static address",C:"A faulty network cable",D:"A DNS misconfiguration"},answer:"B",explanation:"IP conflicts occur when two devices use the same address — typically a static IP that was not excluded from the DHCP scope, or two devices hard-coded identically. Excluding statics from DHCP scopes prevents this."},
{id:"ex5_11",domain:5,question:"A newly configured host has IP 192.168.1.50, mask 255.255.255.0, and gateway 192.168.2.1. It cannot reach anything off its subnet. Why?",options:{A:"The subnet mask is too large",B:"The default gateway is not on the host's own subnet",C:"DNS is misconfigured",D:"The IP address is a broadcast address"},answer:"B",explanation:"With a /24 mask, the host's subnet is 192.168.1.0/24, but the gateway 192.168.2.1 lies in a different subnet. A host can only ARP for and use a gateway on its own subnet, so off-subnet traffic fails."},
{id:"ex5_12",domain:5,question:"An IP phone will not power on when connected to a particular switch port, although it works and has data connectivity on a different non-PoE switch using a power adapter. What is the MOST likely cause?",options:{A:"The phone hardware is defective",B:"The switch port is not supplying PoE, or the switch's PoE budget is exhausted",C:"The phone is in the wrong VLAN",D:"DNS resolution is failing"},answer:"B",explanation:"Since the phone works elsewhere with external power, the device is fine. Failure to power from the switch points to that port not delivering PoE (disabled, wrong standard) or the switch exceeding its total PoE power budget."},
{id:"ex5_13",domain:5,question:"Users near a break room report frequent Wi-Fi drops on the 2.4 GHz band, coinciding with microwave use. What is the BEST remediation?",options:{A:"Increase 2.4 GHz transmit power only",B:"Move clients to 5 GHz and/or change to a non-interfering channel",C:"Disable WPA3 security",D:"Broadcast additional SSIDs"},answer:"B",explanation:"Microwaves emit in the 2.4 GHz range, interfering with that band. Shifting clients to 5 GHz (or to a cleaner 2.4 GHz channel away from the interference) avoids the noise. Raising power can worsen co-channel interference."},
{id:"ex5_14",domain:5,question:"To verify that a server's local TCP/IP stack is functioning WITHOUT involving the physical network, which address should be pinged?",options:{A:"The default gateway",B:"127.0.0.1 (loopback)",C:"0.0.0.0",D:"255.255.255.255"},answer:"B",explanation:"Pinging the loopback address 127.0.0.1 tests the local TCP/IP stack internally. Success indicates the stack is healthy; the next steps are to ping the local IP, the gateway, and then a remote host to localize the fault."},
{id:"ex5_15",domain:5,question:"An interface shows steadily increasing CRC and input errors. What does this MOST likely indicate?",options:{A:"A DNS configuration error",B:"A physical-layer problem such as a bad cable, EMI, or a failing transceiver",C:"An incorrect default gateway",D:"DHCP scope exhaustion"},answer:"B",explanation:"CRC and input errors mean frames are arriving corrupted, which is a Layer 1 symptom — damaged cabling, electromagnetic interference, a dirty fiber connector, or a faulty SFP/NIC. Higher-layer settings do not cause CRC errors."},
{id:"ex5_16",domain:5,question:"Some clients receive correct addresses while others get addresses from an unexpected range and immediately lose connectivity. What is the MOST likely cause?",options:{A:"A slow DNS server",B:"A rogue DHCP server is answering some clients",C:"A bad default gateway on the router",D:"Spanning Tree is disabled"},answer:"B",explanation:"When clients receive valid addresses from the real server but others get bad addresses from a different range, an unauthorized (rogue) DHCP server is competing to answer requests. DHCP snooping blocks rogue servers on untrusted ports."},
{id:"ex5_17",domain:5,question:"Which tool BEST verifies whether a SPECIFIC DNS server correctly resolves a given hostname?",options:{A:"ping",B:"nslookup or dig",C:"arp -a",D:"netstat -an"},answer:"B",explanation:"nslookup and dig query DNS directly and can target a specific server, returning the records it provides. ping only tests reachability and uses the system resolver, so it cannot isolate which DNS server is at fault."},
{id:"ex5_18",domain:5,question:"A user on a switch port capable of 1 Gbps sees only ~94 Mbps transfers, and the link LED indicates 100 Mbps. What is the MOST likely cause?",options:{A:"The remote server is faulty",B:"Auto-negotiation settled at 100 Mbps due to a cable or NIC limitation",C:"DNS resolution is slow",D:"A firewall is throttling the traffic"},answer:"B",explanation:"A 100 Mbps link delivers roughly 94 Mbps of usable throughput. A gigabit-capable port running at 100 Mbps usually means auto-negotiation dropped to 100 — often a damaged/low-category cable, a 100 Mbps NIC, or a forced-speed mismatch."},
{id:"ex5_19",domain:5,question:"After exhausting internal troubleshooting, a technician confirms the root cause is an outage in the ISP's network, beyond the technician's control. According to methodology, what is the appropriate action?",options:{A:"Continue replacing internal equipment",B:"Escalate to the ISP or the appropriate responsible party",C:"Reconfigure all internal switches",D:"Close the ticket as resolved"},answer:"B",explanation:"When the cause lies outside one's scope or authority, the methodology calls for escalation to the appropriate party (here, the ISP). Continuing to change internal equipment would be wasted effort and could introduce new faults."},
{id:"ex5_20",domain:5,question:"A technician applies a fix and confirms the original symptom is gone. Which step remains, and why is it important?",options:{A:"Establish a theory, to be safe",B:"Verify full system functionality and implement preventive measures, then document",C:"Re-identify the problem from scratch",D:"Immediately escalate to a vendor"},answer:"B",explanation:"After implementing a solution you must verify FULL functionality (confirming nothing else broke and applying preventive measures) and then document findings, actions, and outcomes. Documentation closes the loop and aids future troubleshooting."},

// ── Additional hard bank: analysis, calculation & multi-step scenarios ──
// Domain 1 — Networking Concepts
{id:"nx1_01",domain:1,question:"From 172.20.16.0/24 you must allocate, in this order: LAN-A (100 hosts), LAN-B (50 hosts), LAN-C (25 hosts), and one point-to-point link. Using VLSM with no wasted space, which subnet is assigned to LAN-C?",options:{A:"172.20.16.192/27",B:"172.20.16.224/27",C:"172.20.16.192/26",D:"172.20.16.128/26"},answer:"A",explanation:"Largest-first: LAN-A takes /25 (.0-.127, 126 usable). LAN-B takes /26 (.128-.191, 62 usable). LAN-C needs 25 hosts → /27 (30 usable) at .192-.223. The /30 P2P link then fits at .224-.227."},
{id:"nx1_02",domain:1,question:"A host receives a Router Advertisement with the Managed (M) flag set to 1 and the Other (O) flag set to 1. How does the host obtain its IPv6 address and other options?",options:{A:"Address and options both via SLAAC",B:"Address via stateful DHCPv6; other options also via DHCPv6",C:"Address via SLAAC; other options via DHCPv6",D:"It uses a link-local address only"},answer:"B",explanation:"M=1 tells the host to obtain its address from a stateful DHCPv6 server rather than SLAAC. O=1 means other configuration (DNS, etc.) also comes from DHCPv6. When M=0/O=1 the host would use SLAAC for the address but DHCPv6 for options (stateless DHCPv6)."},
{id:"nx1_03",domain:1,question:"An engineer must advertise a single ISP-facing default route that is answered by whichever data center is topologically closest to each user, using one shared IP. Which addressing method achieves this?",options:{A:"Multicast",B:"Broadcast",C:"Anycast",D:"Unicast"},answer:"C",explanation:"Anycast assigns the same address to multiple nodes; routing delivers each client to the nearest instance. It is how root DNS and many CDNs work. Multicast delivers to a group, broadcast floods a segment, and unicast is one-to-one."},
{id:"nx1_04",domain:1,question:"Which pairing of protocol, transport, and default port is entirely correct?",options:{A:"SMTP submission — TCP 465",B:"LDAPS — TCP 636",C:"RDP — UDP 3389",D:"SNMP trap — TCP 162"},answer:"B",explanation:"LDAPS is LDAP over TLS on TCP 636 (plain LDAP is 389). SMTP submission is TCP 587 (465 is SMTPS); RDP is TCP 3389; SNMP traps use UDP 162. Knowing transport and port together is commonly tested."},
{id:"nx1_05",domain:1,question:"Users connect through a firewall doing NAT. Internal-to-internal traffic works, but new outbound sessions to the internet succeed while some return traffic for long-lived idle sessions is dropped. What is the MOST likely cause?",options:{A:"The default gateway is wrong",B:"NAT translation entries are timing out before the sessions resume",C:"DNS is failing",D:"An ACL blocks all inbound traffic"},answer:"B",explanation:"Stateful NAT keeps a translation table with idle timers. Long-idle sessions have their entries aged out, so returning packets have no mapping and are dropped. New sessions build fresh entries and work. Increasing the idle timeout or using keepalives resolves it."},
{id:"nx1_06",domain:1,question:"How many usable host addresses and how many /30 subnets can be created from a single 10.0.0.0/24 block?",options:{A:"62 subnets, 2 hosts each",B:"64 subnets, 2 hosts each",C:"32 subnets, 6 hosts each",D:"64 subnets, 4 hosts each"},answer:"B",explanation:"Going from /24 to /30 borrows 6 host bits → 2^6 = 64 subnets. Each /30 has 4 total addresses and 2 usable (network + broadcast subtracted). /30s are the standard for point-to-point router links."},
{id:"nx1_07",domain:1,question:"A frame must cross a router to reach a remote subnet. As it is forwarded by the router toward the destination host, which addresses change?",options:{A:"Source and destination IP addresses change",B:"Source and destination MAC addresses change; IP addresses stay the same",C:"Only the destination IP changes",D:"Nothing changes; the frame is forwarded as-is"},answer:"B",explanation:"Layer 3 (IP) source/destination remain constant end-to-end (barring NAT). At each hop the Layer 2 frame is rebuilt: the source MAC becomes the router's outgoing interface and the destination MAC becomes the next hop's MAC. This is a core encapsulation concept."},
{id:"nx1_08",domain:1,question:"A 100 ms round-trip WAN link with a 64 KB TCP window is achieving far less throughput than the 500 Mbps circuit allows. What is the MOST effective fix?",options:{A:"Switch the application to UDP",B:"Enable TCP window scaling to allow a larger window",C:"Lower the MTU to 1400",D:"Add a second default gateway"},answer:"B",explanation:"Throughput is limited by window size ÷ RTT (the bandwidth-delay product). A 64 KB window over 100 ms caps throughput near 5 Mbps. TCP window scaling permits much larger windows so the pipe can be filled on high-latency, high-bandwidth (long fat) links."},
{id:"nx1_09",domain:1,question:"Voice traffic must be prioritized end-to-end across both switches and routers. Which marking is preserved and honored at Layer 3 across routed hops?",options:{A:"802.1p CoS in the VLAN tag",B:"DSCP in the IP header",C:"The Ethernet preamble",D:"The TCP window size"},answer:"B",explanation:"802.1p CoS lives in the 802.1Q tag, which is stripped when a frame is routed, so it does not survive Layer 3 hops. DSCP is carried in the IP header's DS field and is preserved across routers, making it the correct end-to-end QoS marking."},
{id:"nx1_10",domain:1,question:"Which single summary route advertises 192.168.8.0/24 through 192.168.15.0/24 and no other networks?",options:{A:"192.168.8.0/20",B:"192.168.8.0/21",C:"192.168.0.0/20",D:"192.168.8.0/22"},answer:"B",explanation:"Eight contiguous /24s (8–15) = 2048 addresses = a /21. 192.168.8.0/21 covers 192.168.8.0 through 192.168.15.255 exactly. A /20 would also pull in .0–.7 or .16–.31; a /22 covers only four /24s."},

// Domain 2 — Network Implementation
{id:"nx2_01",domain:2,question:"Four switches run default STP. SW-A priority 32768 MAC ...0A:11, SW-B priority 4096 MAC ...0B:22, SW-C priority 4096 MAC ...0C:33, SW-D priority 8192 MAC ...0D:44. Which becomes the root bridge?",options:{A:"SW-A",B:"SW-B",C:"SW-C",D:"SW-D"},answer:"B",explanation:"Root election compares bridge priority first (lowest wins). SW-B and SW-C tie at 4096, so the lower MAC address breaks the tie — SW-B (...0B:22) is lower than SW-C (...0C:33). SW-B is root."},
{id:"nx2_02",domain:2,question:"Two switches are cabled with two links intended to form one LACP bundle. One side is set to LACP active and the other is left as standard access/no channel-group. What is the MOST likely result?",options:{A:"A fully working 2 Gbps aggregated link",B:"A Layer 2 loop or one link error-disabled / blocked; the bundle does not form",C:"Automatic failover with no issues",D:"The links negotiate to half duplex"},answer:"B",explanation:"An EtherChannel forms only when both ends agree. With one side bundling and the other treating the links as independent, you risk a bridging loop; STP or an EtherChannel misconfig guard will typically block or err-disable a port. Both ends must have matching channel configuration."},
{id:"nx2_03",domain:2,question:"In the US 2.4 GHz band, an administrator wants three adjacent access points with zero channel overlap using 20 MHz channels. Which channel plan is correct?",options:{A:"1, 3, 5",B:"1, 6, 11",C:"2, 7, 12",D:"1, 5, 9"},answer:"B",explanation:"Only channels 1, 6, and 11 are non-overlapping in the 2.4 GHz band with 20 MHz width. Any other combination causes adjacent-channel interference, which degrades throughput more than clean co-channel reuse would."},
{id:"nx2_04",domain:2,question:"An 802.3af (PoE) switch port must power a device that draws 22 W at the port. What is the correct conclusion?",options:{A:"802.3af supplies up to ~15.4 W at the port — insufficient; the device needs 802.3at (PoE+) or 802.3bt",B:"802.3af supplies 30 W — it is fine",C:"The device will work at reduced brightness",D:"PoE cannot power any device over 10 W"},answer:"A",explanation:"802.3af provides ~15.4 W at the PSE (about 12.95 W at the device). A 22 W load requires 802.3at (PoE+, ~30 W) or 802.3bt (PoE++, up to ~60–90 W). Matching the PoE standard to the device's power class is a common design/troubleshooting point."},
{id:"nx2_05",domain:2,question:"Two switches share a trunk. VLAN 10 works, but a specific untagged management flow between them intermittently lands in the wrong VLAN, and STP logs a native VLAN mismatch. What is the cause?",options:{A:"Duplex mismatch",B:"The native VLAN differs on each end of the trunk",C:"The trunk is actually an access port",D:"Jumbo frames are disabled"},answer:"B",explanation:"Untagged frames on an 802.1Q trunk are placed on the native VLAN. If each switch has a different native VLAN, untagged traffic crosses into the wrong VLAN and CDP/STP flags a native VLAN mismatch — a security and connectivity issue. Both ends must match."},
{id:"nx2_06",domain:2,question:"A 10 Gb link is required between buildings 800 meters apart. Which media and transceiver combination is appropriate?",options:{A:"Cat 6 copper with RJ45",B:"Multimode fiber with an SR transceiver",C:"Single-mode fiber with an LR transceiver",D:"Cat 6a copper with a DAC cable"},answer:"C",explanation:"Copper Ethernet is limited to ~100 m. Multimode (SR) reaches only ~300–400 m at 10 Gb. Single-mode fiber with a long-range (LR) transceiver supports 10 km, easily covering 800 m. Match distance to media: SMF for long runs, MMF for short."},
{id:"nx2_07",domain:2,question:"Hosts must keep their default gateway available if the primary router fails, without any client reconfiguration, using an open-standard protocol. Which should be deployed?",options:{A:"HSRP",B:"VRRP",C:"STP",D:"LACP"},answer:"B",explanation:"First-hop redundancy presents a virtual IP/MAC as the gateway. VRRP is the vendor-neutral (open standard) option; HSRP is Cisco-proprietary. STP handles Layer 2 loops and LACP bundles links — neither provides gateway redundancy."},
{id:"nx2_08",domain:2,question:"Clients on VLAN 30 (subnet 10.30.0.0/24) get no DHCP address, while VLAN 10 clients (same central DHCP server) work fine. The server has a valid VLAN 30 scope. What is the MOST likely missing configuration?",options:{A:"A static route on every client",B:"An ip helper-address (DHCP relay) on the VLAN 30 interface",C:"A second DNS server",D:"Port security on the uplink"},answer:"B",explanation:"DHCP discovery is a broadcast and does not cross a router. When the server is on another subnet, the client's gateway (SVI) needs a DHCP relay / ip helper-address to forward requests as unicast to the server. VLAN 10 likely already has it configured."},

// Domain 3 — Network Operations
{id:"nx3_01",domain:3,question:"A security policy requires that all network-management polling be both authenticated and encrypted. Which SNMPv3 security level meets this?",options:{A:"noAuthNoPriv",B:"authNoPriv",C:"authPriv",D:"There is no encrypted SNMP option"},answer:"C",explanation:"SNMPv3 defines three levels: noAuthNoPriv (no auth, no encryption), authNoPriv (authentication only), and authPriv (authentication + encryption). Only authPriv satisfies a requirement for both, and it is the recommended production setting."},
{id:"nx3_02",domain:3,question:"A syslog server is configured to record severity level 4 and lower-numbered (more severe) messages only. Which of these events would be LOGGED?",options:{A:"A level 6 (Informational) message",B:"A level 7 (Debug) message",C:"A level 2 (Critical) message",D:"A level 5 (Notice) message"},answer:"C",explanation:"Syslog severity runs 0 (Emergency) to 7 (Debug); lower numbers are more severe. Logging level 4 (Warning) and 'more severe' means levels 0–4 are recorded. Level 2 (Critical) qualifies; levels 5, 6, and 7 do not."},
{id:"nx3_03",domain:3,question:"An analyst must identify which internal hosts are generating the most traffic to a suspicious external IP over the past week, without storing full packet payloads. Which tool is BEST suited?",options:{A:"A continuous full packet capture on the core switch",B:"NetFlow/IPFIX flow records",C:"A single ping sweep",D:"SNMP interface counters"},answer:"B",explanation:"Flow data (NetFlow/IPFIX) records conversations — source/destination, ports, protocol, and byte counts — without payloads, making it ideal for 'who talked to whom and how much' over time. Full captures are storage-heavy; SNMP counters give totals, not per-conversation detail."},
{id:"nx3_04",domain:3,question:"During a change to core routing, the new configuration causes an outage. Which element of a well-formed change plan lets the team recover FASTEST?",options:{A:"The business justification",B:"The documented rollback (backout) plan",C:"The list of approvers",D:"The post-implementation review"},answer:"B",explanation:"A backout/rollback plan defines exactly how to revert to the last known-good state. When a change fails, executing the predefined rollback restores service fastest. Justifications, approvals, and reviews matter but do not restore service during the incident."},
{id:"nx3_05",domain:3,question:"A server is backed up with a full backup Sunday and differential backups each following night. To restore Wednesday's data, which backups are required?",options:{A:"Sunday full only",B:"Sunday full + Wednesday differential",C:"Sunday full + Monday, Tuesday, and Wednesday differentials",D:"Wednesday differential only"},answer:"B",explanation:"A differential captures everything changed since the last FULL backup, so each one grows over the week. Restoring needs only the last full plus the single most recent differential (Wednesday). Incremental backups, by contrast, would require every increment since the full."},
{id:"nx3_06",domain:3,question:"A device has an MTBF of 40,000 hours and an MTTR of 4 hours. Which statement is the correct interpretation for availability planning?",options:{A:"The device fails every 4 hours",B:"On average the device runs ~40,000 hours between failures and takes ~4 hours to repair once it fails",C:"The device can never be repaired",D:"MTBF and MTTR describe bandwidth"},answer:"B",explanation:"MTBF (Mean Time Between Failures) estimates how long a device typically operates before failing; MTTR (Mean Time To Repair) estimates recovery time. Together they drive availability: higher MTBF and lower MTTR both increase uptime and help meet SLAs."},
{id:"nx3_07",domain:3,question:"Certificate validation and log correlation across the network are failing intermittently, and devices show timestamps minutes apart. Which service should be verified FIRST?",options:{A:"DHCP",B:"NTP time synchronization",C:"DNS",D:"SNMP"},answer:"B",explanation:"Accurate, synchronized time (NTP) underpins certificate validity windows, Kerberos, and coherent log correlation. Clock skew of minutes breaks TLS/cert checks and makes cross-device log analysis unreliable. NTP uses a stratum hierarchy to distribute authoritative time."},
{id:"nx3_08",domain:3,question:"A team needs a single source of truth to prevent duplicate IP assignments and track subnet utilization across dozens of VLANs. Which is the MOST appropriate?",options:{A:"A physical network (wiring) diagram",B:"An IPAM system",C:"A syslog server",D:"A rack elevation diagram"},answer:"B",explanation:"IP Address Management (IPAM) centrally tracks address allocations, subnets, DHCP scopes, and DNS records, preventing conflicts and showing utilization. Physical/logical diagrams and rack elevations document topology and placement, not live address inventory."},

// Domain 4 — Network Security
{id:"nx4_01",domain:4,question:"In an 802.1X deployment, a laptop must authenticate to the network before being granted access. Which component acts as the authenticator?",options:{A:"The laptop's supplicant software",B:"The switch or wireless controller enforcing port access",C:"The RADIUS server",D:"The domain controller"},answer:"B",explanation:"802.1X has three roles: the supplicant (the client/laptop), the authenticator (the switch/AP/WLC that controls the port), and the authentication server (RADIUS). The switch relays credentials to RADIUS and enforces the accept/deny result on the port."},
{id:"nx4_02",domain:4,question:"An attacker on an access port sends crafted DHCP responses to hand clients a malicious gateway. Which switch feature DIRECTLY prevents this?",options:{A:"BPDU Guard",B:"DHCP snooping",C:"Storm control",D:"Root Guard"},answer:"B",explanation:"DHCP snooping designates trusted ports (toward the legitimate DHCP server) and drops DHCP server responses arriving on untrusted access ports, blocking rogue DHCP. It also builds the binding table that Dynamic ARP Inspection uses. BPDU/Root Guard protect STP; storm control limits broadcasts."},
{id:"nx4_03",domain:4,question:"Which configuration most directly prevents the double-tagging form of VLAN hopping?",options:{A:"Enabling PortFast on all ports",B:"Setting the trunk's native VLAN to an unused VLAN and not using VLAN 1 for data",C:"Disabling DHCP snooping",D:"Increasing the MTU"},answer:"B",explanation:"Double-tagging abuses the native VLAN: the outer tag matches the native VLAN and is stripped, letting the inner tag reach another VLAN. Assigning trunks a dedicated, unused native VLAN (and tagging native VLAN traffic) defeats it. Disabling unused ports and explicit trunking help too."},
{id:"nx4_04",domain:4,question:"A wireless user is tricked into connecting to a rogue AP that mimics the corporate SSID to capture credentials. What is this attack called, and what is a strong mitigation?",options:{A:"Deauthentication flood; disable 802.11w",B:"Evil twin; use 802.1X/WPA3-Enterprise with server-certificate validation",C:"MAC spoofing; hide the SSID",D:"War driving; lower AP power"},answer:"B",explanation:"An evil twin is a rogue AP impersonating a legitimate SSID. Enterprise authentication (802.1X / WPA3-Enterprise) with proper server-certificate validation prevents clients from silently trusting the fake AP, since the rogue cannot present a valid server certificate."},
{id:"nx4_05",domain:4,question:"A stateful firewall sits between the internet and a DMZ web server. Following least privilege, which inbound rule set is BEST?",options:{A:"Permit all inbound to the DMZ; deny outbound",B:"Permit inbound TCP 443 (and 80) only to the web server's IP; implicit deny everything else",C:"Permit all TCP and UDP to the DMZ",D:"Permit inbound ICMP only"},answer:"B",explanation:"Least privilege means opening only what the service requires — here, HTTPS (and possibly HTTP) to the specific server — and relying on the implicit deny for all other inbound traffic. A stateful firewall automatically permits the return traffic for allowed sessions."},
{id:"nx4_06",domain:4,question:"Two sites connect over the public internet and require that entire original IP packets be encrypted and encapsulated between the site gateways. Which technology and mode apply?",options:{A:"IPsec in transport mode",B:"IPsec in tunnel mode",C:"TLS on each application",D:"MAC filtering"},answer:"B",explanation:"Site-to-site VPNs use IPsec tunnel mode, which encrypts the entire original packet and wraps it in a new IP header between the gateways. Transport mode only protects the payload between two hosts and is typical for host-to-host, not gateway-to-gateway, protection."},

// Domain 5 — Network Troubleshooting
{id:"nx5_01",domain:5,question:"A link between a switch and a server passes small pings but shows terrible throughput, and the switch interface counters show rising late collisions. What is the MOST likely cause?",options:{A:"A duplex mismatch (one side full, one side half)",B:"An incorrect default gateway",C:"A DNS misconfiguration",D:"An exhausted DHCP scope"},answer:"A",explanation:"Late collisions on a modern link almost always indicate a duplex mismatch: the half-duplex side detects collisions after the slot time while the full-duplex side transmits freely. Result: connectivity works but throughput collapses. Set both ends to auto or matching full duplex."},
{id:"nx5_02",domain:5,question:"Traffic from client to server succeeds, but return traffic takes a different path and is dropped by a stateful firewall that never saw the outbound flow. What is this condition called?",options:{A:"Split horizon",B:"Asymmetric routing",C:"Broadcast storm",D:"MTU black hole"},answer:"B",explanation:"Asymmetric routing occurs when forward and return traffic follow different paths. A stateful firewall on the return-only path has no session entry for the flow and drops it. Fixes include route/policy adjustments or ensuring both directions traverse the same stateful device."},
{id:"nx5_03",domain:5,question:"A traceroute to a remote host shows normal hops 1–5, then '* * *' for hops 6 onward, yet the destination web page still loads. What is the MOST likely explanation?",options:{A:"The network is completely down past hop 5",B:"A device/firewall along the path is rate-limiting or blocking the ICMP/UDP probes, but forwarding actual traffic",C:"DNS is failing",D:"The client NIC is faulty"},answer:"B",explanation:"Timeouts in traceroute often mean intermediate devices deprioritize or drop the probe packets (or block ICMP TTL-exceeded), even while they forward normal application traffic. Since the page loads, the path works — the '* * *' is a probe-handling artifact, not an outage."},
{id:"nx5_04",domain:5,question:"An interface log shows increasing 'giants' and 'runts' along with CRC errors. What do these counters collectively indicate?",options:{A:"A DHCP problem",B:"Malformed frames from a physical-layer fault or duplex/MTU issue — undersized (runts), oversized (giants), and corrupted (CRC) frames",C:"A routing loop",D:"A DNS cache issue"},answer:"B",explanation:"Runts are frames below 64 bytes, giants exceed the max frame size, and CRC errors mean the frame check failed. Together they point to Layer 1/2 problems: bad cabling, EMI, a failing transceiver, or a duplex/MTU mismatch — not higher-layer services."},
{id:"nx5_05",domain:5,question:"Some clients on a VLAN get 10.10.10.x addresses and work; others receive 192.168.50.x and immediately lose access. What is the MOST likely cause and the correct mitigation?",options:{A:"Scope exhaustion; enlarge the scope",B:"A rogue DHCP server; enable DHCP snooping to trust only the legitimate server's port",C:"DNS poisoning; flush DNS",D:"A duplex mismatch; hard-set speed"},answer:"B",explanation:"Two different address ranges being handed out means an unauthorized DHCP server is racing the real one. Clients that accept the rogue offer get an invalid config. DHCP snooping trusts only the port toward the real server and drops rogue offers on untrusted ports."},
{id:"nx5_06",domain:5,question:"A user reports a website loads at the wrong company's page. nslookup on the client returns an unexpected IP, but querying a known-good public resolver returns the correct IP. What is the MOST likely cause?",options:{A:"The remote web server is down",B:"The client's configured resolver has a poisoned/stale cache or is compromised",C:"The client's NIC driver is corrupt",D:"The default gateway is wrong"},answer:"B",explanation:"Correct resolution from a trusted resolver but wrong resolution from the client's configured one isolates the fault to that resolver — cache poisoning or a stale/tampered record. Flushing/validating the resolver (and enabling DNSSEC) addresses it; connectivity itself is fine."},
{id:"nx5_07",domain:5,question:"Wi-Fi clients show 4 of 5 bars (strong RSSI) yet suffer slow speeds and heavy retransmissions near a factory floor. Which metric best explains the problem?",options:{A:"High RSSI",B:"Low signal-to-noise ratio (SNR) from RF interference",C:"An expired DHCP lease",D:"A blocked TCP port"},answer:"B",explanation:"RSSI measures received signal strength, but throughput depends on SNR — signal relative to noise. Industrial RF noise raises the noise floor, so even a strong signal yields a poor SNR, forcing retransmissions and lower data rates. Reduce interference or move to a cleaner band/channel."},
{id:"nx5_08",domain:5,question:"After the correct time was lost on a client (clock off by two days), HTTPS sites fail with certificate errors although the network is otherwise fine. What is the root cause?",options:{A:"The certificates were revoked",B:"The system clock skew places 'now' outside the certificate's valid date range, so validation fails",C:"DNS is down",D:"The firewall blocks TCP 443"},answer:"B",explanation:"Certificate validation checks the current time against the cert's notBefore/notAfter window. A large clock skew makes valid certificates appear not-yet-valid or expired, breaking TLS. Correcting the clock (or NTP) resolves it — a classic time-synchronization dependency."},
{id:"nx5_09",domain:5,question:"A gigabit-capable NIC on a gigabit switch port negotiates only 100 Mbps and delivers ~94 Mbps. Cabling is Cat 5e and terminated at a keystone and patch panel. What should the technician check FIRST?",options:{A:"Replace the switch",B:"Inspect the physical run for a damaged pair/poor termination — 1000BASE-T needs all four pairs; a single bad pair drops it to 100 Mbps",C:"Reinstall the OS",D:"Change the DNS server"},answer:"B",explanation:"1000BASE-T requires all four wire pairs; 100BASE-TX needs only two. A broken or mis-terminated pair (at the keystone, patch panel, or a damaged cable) causes negotiation to fall back to 100 Mbps. Test/re-terminate the run before swapping hardware."},
{id:"nx5_10",domain:5,question:"A newly added redundant switch link coincides with near-100% utilization on multiple uplinks, MAC flapping, and an unresponsive network. What is happening and what is the FIRST corrective action?",options:{A:"A DNS outage; restart DNS",B:"A Layer 2 broadcast storm from a switching loop; remove the redundant link and verify/enable STP",C:"DHCP exhaustion; expand the scope",D:"A duplex mismatch; hard-set duplex"},answer:"B",explanation:"Saturated uplinks plus MAC address flapping right after adding a redundant link is the signature of a switching loop and broadcast storm. STP should have blocked the redundant path. Break the loop (remove the link) to restore service, then confirm STP is running correctly before re-adding redundancy."}
