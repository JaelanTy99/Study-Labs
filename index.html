{id:"s4_19",domain:4,question:"An external firm is engaged to test an organization's perimeter with no prior information about the environment, simulating an outside attacker's starting position. Which engagement type is this?",options:{A:"A known environment (white box) internal penetration test",B:"An unknown environment (black box) external penetration test",C:"A partially known environment (gray box) test with full source code access",D:"A vulnerability assessment with credentialed scanning"},answer:"B",lead:"Unknown environment testing gives the tester no internal information, so the reconnaissance phase mirrors what a genuine external attacker would perform. Combined with an external starting point, it evaluates the perimeter as an outsider actually encounters it. The tradeoff is time spent on discovery rather than depth.",why:{A:"A and C both provide the tester with information the stem says was withheld, and A starts inside the network.",C:"A and C both provide the tester with information the stem says was withheld, and A starts inside the network.",D:"Is automated scanning rather than an adversarial engagement."}},
{id:"s4_20",domain:4,question:"After patching a critical vulnerability across 300 servers, what should the team do to close the loop, and why is it necessary?",options:{A:"Close the findings in the register based on the patch management system's success report",B:"Wait for the next quarterly scan cycle to confirm remediation",C:"Rescan the affected hosts to verify remediation, because deployment success does not prove the vulnerability is gone",D:"Notify the vendor that the patch was applied successfully"},answer:"C",lead:"Validation is a required phase. A patch may report as installed while a service was never restarted, a configuration change was also needed, or the patch applied to a different component than the one the scanner flagged. Rescanning is the only evidence that the vulnerability is actually no longer present, and it produces the artifact auditors ask for.",why:{A:"Trusts the deployment tool's view rather than independent verification.",B:"Leaves the status unknown for months.",D:"Serves no verification purpose."}},
{id:"s4_21",domain:4,question:"An organization runs a program inviting external researchers to report vulnerabilities in exchange for monetary rewards, with a published scope and safe harbor terms. Which TWO benefits does this provide over penetration testing alone? (Select TWO)",options:{A:"Elimination of the need for internal vulnerability scanning",B:"A guaranteed report deliverable on a fixed schedule for compliance evidence",C:"Assurance that all in-scope assets have been comprehensively examined",D:"Access to a diverse pool of researchers with varied techniques and specializations",E:"Continuous testing rather than a point-in-time assessment"},answer:["D", "E"],lead:"A bug bounty runs continuously, so newly introduced flaws can be found shortly after they ship rather than at the next annual test. It also draws on many researchers with different specialties and creative approaches, which surfaces issues a single testing team may not think to try.",why:{A:"Is unfounded, as scanning and bounties address different needs.",B:"Is a strength of contracted penetration testing, not bounties, which produce reports only when someone finds something.",C:"Is false, since coverage is inherently unpredictable."}},
{id:"s4_22",domain:4,question:"Which statement correctly distinguishes a CVE from a CWE?",options:{A:"A CVE describes a weakness class; a CWE identifies a specific product flaw",B:"A CVE is a severity score; a CWE is an exploitability rating",C:"They are synonymous identifiers maintained by different organizations",D:"A CVE identifies a specific vulnerability instance in a particular product; a CWE describes the underlying weakness class"},answer:"D",lead:"CVE entries catalogue individual, publicly disclosed vulnerabilities — a specific flaw in a specific product version, with a unique identifier. CWE catalogues the categories of software weakness that give rise to them, such as improper input validation or use after free. A single CWE class underlies thousands of CVEs.",why:{A:"Reverses the two.",B:"Confuses both with CVSS, which is the scoring system.",C:"Ignores a meaningful distinction used throughout vulnerability management."}},
{id:"s4_23",domain:4,question:"A security team wants to automate configuration compliance checking against published hardening benchmarks, using machine-readable content that multiple tools can consume. Which standard supports this?",options:{A:"SCAP",B:"SIEM",C:"TAXII",D:"STIX"},answer:"A",lead:"The Security Content Automation Protocol is a suite of specifications that expresses security configuration and vulnerability content in a standardized machine-readable form, so benchmarks such as CIS or DISA STIGs can be evaluated automatically by any SCAP-validated tool.",why:{B:"Is a product category for log aggregation and correlation, not a content standard.",C:"Is the transport protocol for exchanging that intelligence.",D:"Is a language for describing cyber threat intelligence."}},
{id:"s4_24",domain:4,question:"A software team is notified that a widely used open-source library in their application has a critical vulnerability. Which tooling would have identified this dependency risk proactively?",options:{A:"A network vulnerability scan of the application servers",B:"Software composition analysis with continuous package monitoring",C:"Dynamic application security testing against the staging environment",D:"Manual code review of the team's own source files"},answer:"B",lead:"SCA builds an inventory of third-party components and their versions — effectively a software bill of materials — and continuously compares it against vulnerability databases. Because most of a modern application's code is inherited from dependencies, this is where a large share of exposure lives.",why:{A:"Examines the host rather than the application's dependency tree.",C:"Might detect exploitable symptoms but would not identify which library is at fault or flag it before exploitation is possible.",D:"Reviews first-party code, and the flaw is in someone else's."}},
{id:"s4_25",domain:4,question:"An administrator publishes the DNS record below for the corporate domain. What effect does it have on messages that fail authentication?",pre:"_dmarc.example.com  TXT  \"v=DMARC1; p=quarantine; pct=100; adkim=s; aspf=s; rua=mailto:dmarc@example.com\"",options:{A:"Receiving servers should reject failing messages outright at the SMTP transaction",B:"Receiving servers should deliver failing messages normally and take no action",C:"Receiving servers should place failing messages in the spam folder, and aggregate reports are sent to the listed address",D:"Receiving servers should encrypt failing messages before delivery"},answer:"C",lead:"The policy tag p=quarantine instructs receivers to treat failing mail as suspicious, typically by delivering it to the spam or junk folder. pct=100 applies that to all messages, the strict alignment tags require the DKIM and SPF domains to match the From header exactly, and rua names where aggregate reports are sent.",why:{A:"Describes p=reject, the strictest policy.",B:"Describes p=none, which is monitor-only and used during rollout.",D:"Is not a DMARC behavior at all."}},
{id:"s4_26",domain:4,question:"Which statement correctly describes what SPF and DKIM each validate?",options:{A:"Both validate the same thing, so implementing either is sufficient",B:"SPF encrypts the message in transit; DKIM authenticates the recipient",C:"SPF signs the message body; DKIM lists authorized sending IP addresses",D:"SPF authorizes which servers may send for a domain; DKIM cryptographically signs the message so alterations are detectable"},answer:"D",lead:"SPF is a DNS record listing the IP addresses and hosts permitted to send mail for a domain, validated against the envelope sender. DKIM attaches a cryptographic signature over selected headers and the body, so the receiver can verify both origin and that nothing was modified in transit. DMARC then binds these results to the visible From domain and declares a policy.",why:{A:"Ignores that each addresses a different weakness, which is why DMARC requires alignment with at least one.",B:"Misattributes encryption and recipient authentication to protocols that do neither.",C:"Reverses the two mechanisms."}},
{id:"s4_27",domain:4,question:"A DLP system inspects outbound email and blocks a message containing a spreadsheet with 4,000 rows of Social Security numbers. Which data state was being protected, and which detection technique was most likely used?",options:{A:"Data in transit; pattern matching with contextual validation such as checksum and proximity rules",B:"Data in use; memory scanning of the mail client process",C:"Data in transit; signature matching against known malware hashes",D:"Data at rest; full disk encryption key verification"},answer:"A",lead:"An outbound message leaving the organization is data in transit. DLP identifies structured sensitive data using regular expressions refined by context — validating format, checking proximity to related keywords, and requiring a threshold count — which is what keeps a nine-digit number in a product code from triggering a false positive.",why:{B:"Would apply to protecting data actively in memory.",C:"Describes antimalware detection, which does not identify sensitive data patterns.",D:"Addresses stored data and does not inspect content."}},
{id:"s4_28",domain:4,question:"A file integrity monitoring tool alerts that /usr/bin/sshd and several files in /etc were modified outside a change window. What makes this alert significant, and what should follow?",options:{A:"It confirms a malware infection and the host should be reimaged immediately without analysis",B:"System binaries and configuration should change only through approved change control, so this suggests compromise and warrants immediate investigation",C:"It indicates a failed software update that should be reapplied",D:"It is expected behavior after a reboot and can be tuned out"},answer:"B",lead:"FIM establishes a cryptographic baseline of critical files and alerts on deviation. Because production binaries and configuration should only change through a controlled process, an unscheduled modification to the SSH daemon is a strong indicator of a backdoor or persistence mechanism and must be triaged as a potential incident.",why:{A:"Jumps to the most destructive response before preserving evidence and determining scope.",C:"Assumes a benign cause without evidence.",D:"Would suppress exactly the detection the tool exists to provide."}},
{id:"s4_29",domain:4,question:"An organization deploys a capability that correlates telemetry from endpoints, email, cloud workloads, and network sensors into a single detection and response workflow. Which technology is this, and how does it differ from its predecessor?",options:{A:"SIEM; it replaces all endpoint agents with log collection",B:"DLP; it correlates data movement across multiple channels",C:"XDR; it extends EDR's endpoint-only visibility across multiple telemetry domains for cross-source correlation",D:"EDR; it narrows XDR's broad scope to focus exclusively on endpoints"},answer:"C",lead:"Extended detection and response builds on EDR by ingesting signals beyond the endpoint and correlating them automatically, so an email delivery, a process execution, and a suspicious outbound connection are linked into one incident rather than three unrelated alerts. That correlation is the core value.",why:{A:"Is log-centric and generally requires more manual correlation and rule authoring, and it does not replace endpoint agents.",B:"Focuses on sensitive data movement rather than threat detection across telemetry sources.",D:"Reverses the relationship."}},
{id:"s4_30",domain:4,question:"A user behavior analytics platform flags an employee who suddenly begins accessing hundreds of files in departments unrelated to their role, at 2:00 a.m., from a device they have never used. What makes this detection possible, and what is the appropriate first response?",options:{A:"A DLP policy violation; block all outbound traffic from the network segment",B:"A vulnerability scan finding; schedule the host for patching",C:"A matched malware signature; quarantine the endpoint immediately without notification",D:"Deviation from an established behavioral baseline; contact the user through a verified channel and review the activity before disabling access"},answer:"D",lead:"UBA builds a statistical profile of normal behavior per user and peer group, so it detects anomalies that break no explicit rule. The combination of volume, unusual scope, off-hours timing, and a new device is a strong composite signal. Because it could also be legitimate — a new project, an approved after-hours task — verification through a known-good channel comes before disruptive action, unless severity demands immediate containment.",why:{A:"A, B, and C all describe detections from entirely different tool categories.",B:"A, B, and C all describe detections from entirely different tool categories.",C:"A, B, and C all describe detections from entirely different tool categories."}},
{id:"s4_31",domain:4,question:"A security team configures its recursive resolver to return a controlled address for domains known to host command and control infrastructure, and logs every client that queries them. Which technique is this, and what dual benefit does it provide?",options:{A:"DNS sinkholing; it blocks the connection and identifies which internal hosts are infected",B:"DNSSEC validation; it prevents forged DNS responses from being accepted",C:"DNS tunneling; it exfiltrates data through DNS queries for analysis",D:"Split-horizon DNS; it serves different answers to internal and external clients"},answer:"A",lead:"Sinkholing redirects malicious domain lookups to a system the defenders control. The malware's callback fails, and simultaneously the query log becomes an authoritative list of compromised hosts — often the fastest way to scope an infection across an enterprise.",why:{B:"Protects DNS response integrity but does not block malicious domains.",C:"Is an attacker technique for covert channels.",D:"Serves different views of a zone and is a design pattern rather than a security control."}},
{id:"s4_32",domain:4,question:"An organization must migrate away from legacy cleartext protocols. Which set of replacements is correct?",options:{A:"SSH to Telnet with a VPN, HTTPS to HTTP behind a firewall, SNMPv3 to SNMPv1",B:"Telnet to SSH, FTP to SFTP, HTTP to HTTPS, SNMPv2c to SNMPv3, LDAP to LDAPS",C:"Telnet to TFTP, FTP to HTTP, SNMPv3 to SNMPv2c, LDAPS to LDAP",D:"FTP to FTP over a private VLAN, Telnet with an ACL, HTTP with a strong password"},answer:"B",lead:"Each pairing replaces an unencrypted protocol with one providing confidentiality and integrity. Note that SNMPv3 is the only version offering authentication and encryption, and that SFTP runs over SSH while FTPS is FTP wrapped in TLS — both are valid secure alternatives to plain FTP.",why:{A:"A and C move in the wrong direction, downgrading to weaker protocols.",C:"A and C move in the wrong direction, downgrading to weaker protocols.",D:"Relies on network placement and access lists as substitutes for encryption, which leaves credentials and data readable to anyone who gains a position on the path."}},
{id:"s4_33",domain:4,question:"A SOC receives 4,000 alerts per day, of which analysts historically confirm fewer than 10 as genuine incidents. Which action BEST improves detection effectiveness?",options:{A:"Raise the severity threshold so only critical alerts are displayed",B:"Increase SOC staffing so every alert can be reviewed manually",C:"Tune rules against the environment's baseline, suppress known-benign patterns, and enrich alerts with asset context for risk-based prioritization",D:"Disable the noisiest detection rules entirely to reduce volume"},answer:"C",lead:"Alert fatigue causes real detections to be missed inside a flood of noise. Tuning removes patterns proven benign in this specific environment, and enrichment — asset criticality, data classification, user privilege — lets the queue be ordered by actual risk rather than by raw signature severity. This preserves coverage while making the queue workable.",why:{A:"Discards detections that are frequently the early stages of an intrusion.",B:"Scales the problem rather than solving it and is rarely affordable.",D:"Creates blind spots, since noisy rules often still catch real events."}},
{id:"s4_34",domain:4,question:"A team must choose between agent-based and agentless monitoring for a fleet of servers. Which statement correctly captures the tradeoff?",options:{A:"Agents cannot collect data when a host is disconnected from the network",B:"Agentless monitoring eliminates the need for credentials on monitored hosts",C:"Agentless monitoring provides deeper host visibility because it uses privileged remote access",D:"Agents provide deeper, continuous host visibility including offline activity, but add deployment overhead and their own attack surface"},answer:"D",lead:"An agent runs locally, so it observes process execution, memory activity, and file changes continuously — including while the host is off the corporate network — and can respond in real time. The costs are genuine: deployment and lifecycle management across the fleet, resource consumption, and a privileged component that is itself a target.",why:{A:"Is wrong, as agents queue data locally and report when connectivity returns.",B:"Is wrong, because agentless approaches typically require privileged credentials, which is one of their main drawbacks.",C:"Is generally false, since remote queries see less than a resident agent."}},
{id:"s4_35",domain:4,question:"Which TWO measures MOST directly protect the integrity of security logs against an attacker who has gained administrative access to a monitored host? (Select TWO)",options:{A:"Increasing the local log file size limit on the host",B:"Setting the local log rotation interval to weekly",C:"Forwarding logs to a central collector in near real time",D:"Writing archived logs to write-once, read-many storage",E:"Enabling log compression to save disk space"},answer:["C", "D"],lead:"An administrator on a host can alter or delete anything stored there, so integrity depends on getting the record somewhere they cannot reach. Real-time forwarding means the evidence already exists elsewhere before the attacker clears the local log, and WORM storage makes the archived copy immutable even to the logging platform's own administrators.",why:{A:"A and B only affect how much local history is retained, all of which remains modifiable.",B:"A and B only affect how much local history is retained, all of which remains modifiable.",E:"Affects storage efficiency and provides no integrity protection."}},
{id:"s4_36",domain:4,question:"A Linux hardening standard requires that even a compromised web server process be unable to read files outside its designated directories, enforced by the kernel regardless of file permissions. Which mechanism provides this?",options:{A:"SELinux in enforcing mode with a targeted policy",B:"Running the web server under a dedicated unprivileged user account",C:"chmod permissions set to 750 on application directories",D:"A host-based firewall with outbound rules"},answer:"A",lead:"SELinux implements mandatory access control in the kernel. Policy defines what each labeled domain may do, and that decision is enforced independently of the traditional discretionary permission bits — so a compromised web server process is confined to what its domain permits even if file permissions would otherwise allow access.",why:{B:"B and C are both valuable discretionary controls, but they can be undermined by privilege escalation or by permissive settings elsewhere, and they are not kernel-enforced mandatory policy.",C:"B and C are both valuable discretionary controls, but they can be undermined by privilege escalation or by permissive settings elsewhere, and they are not kernel-enforced mandatory policy.",D:"Controls network traffic, not file access."}},
{id:"s4_37",domain:4,question:"An organization wants web filtering applied consistently to laptops whether they are in the office, at home, or in a hotel. Which deployment model BEST achieves this?",options:{A:"A centralized proxy appliance in the data center with policy enforced on the corporate LAN",B:"Agent-based filtering on the endpoint, optionally backed by a cloud-delivered gateway",C:"DNS filtering configured only on the corporate DHCP-issued resolvers",D:"Firewall URL rules applied at the headquarters perimeter"},answer:"B",lead:"Policy must travel with the device. An endpoint agent enforces filtering regardless of network location, and pairing it with a cloud-delivered secure web gateway keeps enforcement close to the user without backhauling traffic.",why:{A:"A, C, and D all enforce policy only while the device is on a corporate network path — the moment a laptop connects to home or hotel Wi-Fi, no filtering applies at all.",C:"A, C, and D all enforce policy only while the device is on a corporate network path — the moment a laptop connects to home or hotel Wi-Fi, no filtering applies at all.",D:"A, C, and D all enforce policy only while the device is on a corporate network path — the moment a laptop connects to home or hotel Wi-Fi, no filtering applies at all."}},
{id:"s4_38",domain:4,question:"Ransomware is actively encrypting shares on a file server. The incident commander must choose an immediate action. Which is MOST appropriate, and why?",options:{A:"Begin restoring from backup onto the same server while encryption is in progress",B:"Run a full antivirus scan on the server before taking any other action",C:"Isolate the server from the network without powering it off, to stop the spread while preserving volatile evidence",D:"Power the server off immediately to halt encryption as fast as possible"},answer:"C",lead:"Containment must stop the spread, but a shutdown destroys everything in RAM — running processes, network connections, injected code, and sometimes the encryption keys themselves. Disconnecting the network interface or moving the host to a quarantine VLAN achieves containment while preserving the volatile evidence that analysis depends on.",why:{A:"Restores into a compromised environment, and the new data is encrypted too.",B:"Leaves the malware running and spreading while the scan completes.",D:"Trades irreplaceable evidence for a marginal timing gain."}},
{id:"s4_39",domain:4,question:"An examiner must collect evidence from a running compromised system. Which collection order correctly follows the order of volatility?",options:{A:"Archival backups, disk, RAM, then CPU registers",B:"RAM, archival backups, disk, then network state",C:"Disk, RAM, CPU cache, network state, then archival backups",D:"CPU registers and cache, RAM, network state and running processes, disk, then archival backups"},answer:"D",lead:"Collect what disappears fastest first. CPU registers and cache survive only microseconds to seconds, RAM is lost on power-off, network connections and process state change continuously, disk persists across reboots, and archival backups and remote logs are the most durable of all.",why:{A:"A, B, and C all place durable sources before volatile ones, which means the volatile evidence is gone by the time it is reached — the single most common forensic error.",B:"A, B, and C all place durable sources before volatile ones, which means the volatile evidence is gone by the time it is reached — the single most common forensic error.",C:"A, B, and C all place durable sources before volatile ones, which means the volatile evidence is gone by the time it is reached — the single most common forensic error."}},
{id:"s4_40",domain:4,question:"An organization anticipates litigation related to a security incident. Which action must be taken immediately regarding relevant data, and what is the consequence of failing to act?",options:{A:"Issue a legal hold suspending routine deletion and retention schedules; failure can result in spoliation sanctions",B:"Encrypt all relevant data so it cannot be altered; failure results in a compliance finding",C:"Delete all data unrelated to the incident to reduce discovery scope; failure increases legal cost",D:"Transfer custody of the data to outside counsel; failure invalidates attorney-client privilege"},answer:"A",lead:"A legal hold suspends automated deletion, log rotation, and retention policies for potentially relevant data as soon as litigation is reasonably anticipated. Destroying evidence after that point — even through a routine automated process that nobody thought to pause — constitutes spoliation and can result in adverse inference instructions, monetary sanctions, or case-ending penalties.",why:{B:"Does not prevent deletion.",C:"Is precisely the destruction that creates liability.",D:"Misstates how privilege operates and does not preserve anything."}},
{id:"s4_41",domain:4,question:"A forensic analyst creates a bit-for-bit copy of a suspect drive. Which TWO steps are essential to make the resulting image defensible? (Select TWO)",options:{A:"Perform all analysis on the original drive to avoid copy artifacts",B:"Use a hardware write blocker so the original media is never modified",C:"Boot the original drive to confirm the operating system is functional",D:"Compute cryptographic hashes of the original and the image and confirm they match",E:"Delete unallocated space from the image to reduce its size"},answer:["B", "D"],lead:"A write blocker guarantees that the acquisition process cannot alter the source, which is the foundation of the claim that the evidence is unchanged. Matching hashes of the source and the image prove the copy is faithful, and rehashing later proves it has not changed since. Analysis is then performed on the copy.",why:{A:"Modifies the original by the act of examining it.",C:"Writes to the original drive during boot, contaminating the evidence.",E:"Destroys deleted-file and slack-space evidence, which is often the most valuable content."}},
{id:"s4_42",domain:4,question:"A security team proactively searches its environment for signs of an adversary based on a hypothesis derived from recent threat intelligence, without any alert having fired. What is this activity, and what distinguishes it from incident response?",options:{A:"Vulnerability scanning; it enumerates weaknesses rather than intrusions",B:"Threat hunting; it is hypothesis-driven and proactive, whereas incident response is triggered by a detected event",C:"Penetration testing; it simulates an attacker to find exploitable paths",D:"Red teaming; it tests detection capability through simulated adversary operations"},answer:"B",lead:"Threat hunting assumes an adversary may already be present and that existing detections have not caught them. The hunter forms a hypothesis — for example, that a specific technique would appear as a particular parent-child process relationship — and searches the data for it. Its output is either a finding or a new detection rule.",why:{A:"Looks for weaknesses, not active intrusions.",C:"C and D both involve simulating an attacker rather than searching for a real one, though red team exercises complement hunting by testing whether it works.",D:"C and D both involve simulating an attacker rather than searching for a real one, though red team exercises complement hunting by testing whether it works."}},
{id:"s4_43",domain:4,question:"Following recovery from an incident, the team conducts a review that asks why the initial phishing email was not blocked, why the endpoint agent did not alert, and why detection took nine days. Which activity is this, and what is its primary output?",options:{A:"Eradication; its output is removal of the attacker's persistence mechanisms",B:"Containment; its output is a limited blast radius",C:"Root cause analysis within the lessons learned phase; its output is specific, owned improvements fed back into preparation",D:"Detection and analysis; its output is confirmation that an incident occurred"},answer:"C",lead:"Root cause analysis asks why each control failed rather than stopping at what happened, and it belongs to the lessons learned phase that closes the incident response lifecycle. Its value is entirely in the improvements it produces — tuned detections, new playbooks, control changes — which feed directly back into the preparation phase.",why:{A:"A, B, and D all name earlier lifecycle phases that had already concluded by the time this review occurred.",B:"A, B, and D all name earlier lifecycle phases that had already concluded by the time this review occurred.",D:"A, B, and D all name earlier lifecycle phases that had already concluded by the time this review occurred."}},
{id:"s4_44",domain:4,question:"An organization automates security group creation and firewall rule deployment through its CI/CD pipeline. Which risk is MOST specific to this automation, and how should it be managed?",options:{A:"Automation always increases the time required to deploy changes",B:"Automated rules cannot be audited after deployment",C:"Automation eliminates the need for change management approval",D:"The pipeline becomes a single point of failure and a high-value target; it requires the same hardening, access control, and monitoring as production"},answer:"D",lead:"Anything that can deploy infrastructure at scale can also destroy or expose it at scale. The pipeline holds credentials to production and is trusted implicitly by everything downstream, which makes it one of the most attractive targets in the environment. It must be treated as production infrastructure: least privilege on its service accounts, signed and reviewed changes, secrets in a vault, and full audit logging.",why:{A:"Is the opposite of automation's purpose.",B:"Is backwards, since declarative definitions are easier to audit.",C:"Is false; automation changes how approval is applied, not whether it is required."}},
{id:"s4_45",domain:4,question:"Which set of activities correctly describes the lifecycle of a secure baseline?",options:{A:"Establish the approved configuration, deploy it consistently to all systems in scope, and maintain it by detecting and correcting drift",B:"Scan for vulnerabilities, patch findings, and document exceptions",C:"Establish the configuration once, deploy it at build time, and rely on users to preserve it",D:"Classify assets, assign owners, and schedule disposal"},answer:"A",lead:"A baseline is not a one-time document. It must be defined and approved, applied uniformly through automation such as group policy, configuration management, or images, and then continuously verified — because ad hoc changes cause configuration drift that quietly reintroduces previously remediated weaknesses.",why:{B:"Describes vulnerability management, a related but separate process.",C:"Omits the maintenance phase where most baselines actually fail.",D:"Describes asset management."}},
{id:"s4_46",domain:4,question:"A company allows employees to use personally owned phones for corporate email. Legal is concerned about the organization's ability to wipe corporate data without destroying personal photographs. Which approach BEST resolves this?",options:{A:"Full device enrollment in MDM with a full-device remote wipe capability",B:"Mobile application management with containerization, permitting a selective wipe of the corporate container only",C:"Prohibiting corporate email on personal devices entirely",D:"A COPE model in which the company owns and fully manages the device"},answer:"B",lead:"In a BYOD model the device is the employee's property, so the control must be scoped to corporate data. Containerization creates an encrypted, policy-managed workspace separated from personal apps and data, and a selective wipe removes only that container — which resolves both the security requirement and the privacy concern.",why:{A:"Destroys personal data and creates real legal exposure.",C:"Solves the problem by eliminating the business capability.",D:"Is a valid alternative model but changes device ownership, which the stem does not contemplate."}},
{id:"s4_47",domain:4,question:"A development team must ensure that users of their distributed desktop application can verify the software genuinely came from the company and was not tampered with after release. Which control provides this?",options:{A:"Publishing the application only through the company's HTTPS website",B:"Obfuscating the compiled binary to hinder reverse engineering",C:"Code signing with a certificate from a trusted certificate authority",D:"Encrypting the installer with a password distributed to customers"},answer:"C",lead:"Code signing attaches a digital signature created with the publisher's private key. The operating system verifies it against the publisher's certificate, confirming both the identity of the signer and that the binary has not been altered since signing. Users see a verified publisher rather than an unknown-publisher warning.",why:{A:"Protects the download in transit but says nothing about the file itself once it leaves the site.",B:"Raises the effort of analysis but proves nothing about origin or integrity.",D:"Provides confidentiality, not authenticity, and a shared password is not a meaningful control."}},
{id:"s4_48",domain:4,question:"A web application accepts a numeric account identifier from a URL parameter and uses it to retrieve records. Which control is the MOST important defense against a user manipulating that parameter to read another customer's data?",options:{A:"TLS encryption of the request in transit",B:"Client-side JavaScript validation ensuring the parameter is numeric",C:"A secure cookie flag on the session identifier",D:"Server-side authorization checks confirming the authenticated user owns the requested record"},answer:"D",lead:"This is insecure direct object reference, and it is fundamentally an authorization failure rather than an input validation failure. The parameter may be perfectly well-formed; the flaw is that the application retrieves the record without confirming the requester is entitled to it. Every request must be authorized server-side against the authenticated identity.",why:{A:"A and C are both important controls that protect the session and the channel, but neither prevents an authenticated user from requesting a record belonging to someone else.",B:"Runs in the attacker's own browser and is trivially bypassed.",C:"A and C are both important controls that protect the session and the channel, but neither prevents an authenticated user from requesting a record belonging to someone else."}},
{id:"s4_49",domain:4,question:"An asset inventory review finds 340 devices on the network that do not appear in the asset management system. Which TWO risks does this MOST directly create? (Select TWO)",options:{A:"Ownership is undefined, so no one is accountable for patching or configuration",B:"The organization's insurance premiums will automatically increase",C:"DNS resolution will fail for the unmanaged devices",D:"Network bandwidth is consumed by the unknown devices",E:"Vulnerability management cannot cover systems that are not known to exist"},answer:["A", "E"],lead:"Asset management underpins nearly every other control. A device absent from the inventory is not in the scanning scope, not covered by patch deployment, not enrolled in monitoring, and not included in the baseline — so it is invisible precisely where visibility matters most. Without an assigned owner, there is also no one accountable for remediating anything found on it.",why:{B:"B and C are fabricated consequences.",C:"B and C are fabricated consequences.",D:"Is a capacity concern rather than the security risk being asked about."}},
{id:"s5_01",domain:5,question:"An organization values a data center facility at 2,000,000 dollars. A flood would damage an estimated 25 percent of its value, and historical data indicates such a flood occurs once every five years. What is the annualized loss expectancy?",options:{A:"100,000 dollars",B:"2,500,000 dollars",C:"500,000 dollars",D:"400,000 dollars"},answer:"A",lead:"Single loss expectancy equals asset value multiplied by exposure factor: 2,000,000 x 0.25 = 500,000. Annualized rate of occurrence for a once-in-five-years event is 1/5 = 0.2. ALE equals SLE x ARO: 500,000 x 0.2 = 100,000 dollars per year.",why:{B:"B and D result from multiplying rather than applying the ARO correctly.",C:"Is the SLE, which is the loss from a single event rather than the annualized figure.",D:"B and D result from multiplying rather than applying the ARO correctly."},note:"ALE is the number used to justify annual control spending."},
{id:"s5_02",domain:5,question:"A company loses an average of 20 laptops per year to theft, each valued at 2,000 dollars and considered a total loss. A proposed control combining cable locks, asset tracking, and awareness training costs 15,000 dollars per year and is projected to reduce losses to 5 laptops per year. Is the control justified?",options:{A:"No, because the exposure factor is unknown",B:"Yes, because it reduces ALE from 40,000 to 10,000 dollars, a 30,000 dollar benefit for a 15,000 dollar cost",C:"Yes, because any reduction in theft justifies any control cost",D:"No, because the 15,000 dollar cost exceeds the 10,000 dollar residual ALE"},answer:"B",lead:"Current ALE is SLE x ARO = 2,000 x 20 = 40,000 dollars. With the control, ALE becomes 2,000 x 5 = 10,000 dollars. The annual benefit is the 30,000 dollar reduction, against a 15,000 dollar annual cost, giving a net benefit of 15,000 dollars. A control is justified when the reduction in ALE exceeds its cost.",why:{A:"Is wrong because the exposure factor is 100 percent for a total loss.",C:"Abandons cost-benefit analysis.",D:"Compares the cost to the wrong figure — the correct comparison is against the SAVINGS, not the remaining exposure."}},
{id:"s5_03",domain:5,question:"Which statement correctly distinguishes risk appetite from risk tolerance?",options:{A:"Risk appetite applies to individual controls; risk tolerance applies to the entire enterprise",B:"They are interchangeable terms with no meaningful distinction",C:"Risk appetite is the overall amount of risk an organization is willing to pursue; tolerance is the acceptable variation around a specific objective",D:"Risk appetite is calculated quantitatively; risk tolerance is always qualitative"},answer:"C",lead:"Appetite is the strategic, board-level statement of how much risk the organization is willing to take on in pursuit of its objectives, and it is often characterized as expansionary, neutral, or conservative. Tolerance is the narrower operational threshold — how much deviation is acceptable for a particular risk or objective before action is required.",why:{A:"Reverses the scope of each term.",B:"Ignores a distinction used throughout governance frameworks.",D:"Invents a methodology split that does not exist."}},
{id:"s5_04",domain:5,question:"A risk register entry must be complete before the risk committee will review it. Which set of elements is essential?",options:{A:"Asset serial number, purchase price, and depreciation schedule",B:"Vulnerability CVE number, CVSS score, and patch availability date",C:"Incident ticket number, analyst name, and time to resolution",D:"Risk description, likelihood and impact, current controls, risk owner, treatment strategy, and key risk indicators"},answer:"D",lead:"A risk register is the operational record of identified risks and their treatment. Each entry needs the risk described in business terms, an assessment of likelihood and impact, the controls currently in place, a named owner who is accountable, the chosen strategy (mitigate, transfer, avoid, or accept), and indicators that signal the risk is materializing.",why:{A:"Is asset management data.",B:"Belongs to a vulnerability register, which is narrower and technical.",C:"Is incident tracking data."}},
{id:"s5_05",domain:5,question:"Under privacy regulations such as GDPR, an organization determines the purposes and means of processing personal data, while a cloud vendor stores and processes that data strictly on the organization's documented instructions. What are their respective roles?",options:{A:"The organization is the data controller; the vendor is the data processor",B:"The organization is the data processor; the vendor is the data controller",C:"The organization is the data subject; the vendor is the custodian",D:"Both are joint controllers because both handle the data"},answer:"A",lead:"The controller decides why and how personal data is processed and carries primary accountability to regulators and to data subjects. The processor acts only on the controller's documented instructions. This distinction determines who must respond to data subject requests, who notifies regulators after a breach, and what must appear in the contract between them.",why:{B:"Reverses the roles.",C:"Misuses data subject, which refers to the individual the data is about.",D:"Would require both to jointly determine purposes and means, which the stem rules out."}},
{id:"s5_06",domain:5,question:"A customer invokes the right to erasure, requesting deletion of their personal data. The organization holds that data in a production database, in nightly backups, and in an analytics warehouse. What is the MOST defensible response?",options:{A:"Delete only from the production database, since backups are not considered live data",B:"Delete from production and analytics, document a defined process for backups given technical constraints, and confirm the data will not be restored into active use",C:"Refuse the request because backups make complete deletion technically impossible",D:"Delete all backups entirely to guarantee erasure"},answer:"B",lead:"Erasure obligations extend to all copies, but regulators generally accept that immutable or rolling backups present genuine technical constraints. The defensible position is deleting from all active systems, documenting why backups cannot be surgically edited, applying the retention schedule so the data ages out, and ensuring a restore does not silently reintroduce the erased record.",why:{A:"Ignores backups as a data holding entirely.",C:"Treats a technical constraint as a total exemption.",D:"Destroys the organization's entire recovery capability, creating a far larger risk."}},
{id:"s5_07",domain:5,question:"An organization is contracting with a managed service provider and wants the contractual right to inspect the provider's security controls and evidence directly. Which clause should be negotiated?",options:{A:"A non-disclosure agreement",B:"A memorandum of understanding",C:"A right-to-audit clause",D:"A statement of work"},answer:"C",lead:"A right-to-audit clause preserves the customer's ability to examine the vendor's controls, request evidence, and in some cases conduct or commission an on-site assessment. Without it, the customer is limited to whatever attestations the vendor chooses to share, which may not cover the specific risks that matter.",why:{A:"Protects confidential information exchanged between parties.",B:"Is a non-binding statement of intent.",D:"Defines deliverables, timelines, and acceptance criteria for specific work."}},
{id:"s5_08",domain:5,question:"Which agreement type establishes the overarching legal terms governing a long-term relationship between two organizations, under which individual projects are subsequently defined?",options:{A:"A statement of work",B:"A business partnership agreement",C:"A service level agreement",D:"A master service agreement"},answer:"D",lead:"An MSA sets the general terms once — liability, indemnification, intellectual property, confidentiality, dispute resolution, payment terms — so each subsequent engagement needs only a statement of work describing that specific project. This avoids renegotiating legal terms for every piece of work.",why:{A:"Defines the scope, deliverables, and schedule of one specific engagement under the MSA.",B:"Governs a joint business venture between partners.",C:"Defines measurable service commitments such as uptime and response times."}},
{id:"s5_09",domain:5,question:"Which pair correctly distinguishes due diligence from due care?",options:{A:"Due diligence is the investigation performed before a decision; due care is the ongoing responsible action taken afterward",B:"They are synonymous legal terms with identical meaning",C:"Due diligence is the ongoing maintenance of controls; due care is the initial risk assessment",D:"Due diligence applies only to vendors; due care applies only to employees"},answer:"A",lead:"Due diligence is the research and verification a reasonable organization performs before committing — assessing a vendor's security posture, reviewing audit reports, validating claims. Due care is acting reasonably and prudently on an ongoing basis afterward, such as maintaining controls and monitoring the relationship. Failing either can establish negligence.",why:{B:"Ignores a distinction that carries real legal weight.",C:"Reverses the temporal relationship.",D:"Invents a scope restriction."}},
{id:"s5_10",domain:5,question:"A business impact analysis has been completed. Which outputs should it produce, and how are they used?",options:{A:"An inventory of hardware assets with purchase dates and warranty status",B:"Criticality rankings, maximum tolerable downtime, RTO and RPO per function, and dependency mappings that drive continuity investment",C:"A network diagram showing physical and logical topology",D:"A prioritized list of technical vulnerabilities and their CVSS scores"},answer:"B",lead:"The BIA identifies which business functions matter most, how quickly their loss becomes intolerable, and what they depend on. Those findings produce the RTO and RPO targets that justify spending on recovery infrastructure — a function needing a two-hour RTO warrants a hot site, while one tolerating three days does not.",why:{A:"Is asset management data. Each is useful, but none establishes business criticality or recovery targets.",C:"Is network documentation.",D:"Is vulnerability management output."}},
{id:"s5_11",domain:5,question:"An organization's board wants a single accountable individual for a critical customer database who decides classification and who may access it. Which role is being described, and how does it differ from the custodian?",options:{A:"The data steward, who administers the servers, while the owner writes the queries",B:"The data processor, who decides purposes, while the controller stores the data",C:"The data owner, who is accountable for classification and access decisions, while the custodian implements and maintains the technical controls",D:"The data custodian, who sets classification, while the owner performs backups"},answer:"C",lead:"The data owner is a senior business role accountable for the data — determining its classification, approving who may access it, and accepting risk on its behalf. The custodian is typically an IT function that implements those decisions through backups, access control configuration, encryption, and availability.",why:{A:"Misdescribes the steward, who is responsible for data quality and appropriate use rather than server administration.",B:"Reverses controller and processor.",D:"Reverses the two roles."}},
{id:"s5_12",domain:5,question:"A financial institution fails an examination and faces regulatory penalties. Which set of consequences is MOST associated with non-compliance?",options:{A:"Mandatory replacement of all network hardware",B:"Immediate revocation of all vendor agreements by law",C:"Automatic criminal prosecution of all IT staff",D:"Fines, sanctions, loss of operating license, contractual penalties, and reputational damage"},answer:"D",lead:"Regulatory non-compliance generally produces monetary fines proportional to severity and revenue, formal sanctions and consent orders imposing oversight, potential loss or suspension of the license to operate in regulated industries, breach of contractual commitments to customers and partners, and reputational damage that frequently outlasts the financial penalty.",why:{A:"A, B, and C describe consequences that do not follow automatically from a compliance failure and confuse regulatory enforcement with criminal and contractual processes that operate separately.",B:"A, B, and C describe consequences that do not follow automatically from a compliance failure and confuse regulatory enforcement with criminal and contractual processes that operate separately.",C:"A, B, and C describe consequences that do not follow automatically from a compliance failure and confuse regulatory enforcement with criminal and contractual processes that operate separately."}},
{id:"s5_13",domain:5,question:"A risk assessment scores risks as high, medium, or low based on expert judgment and a likelihood-versus-impact matrix, without assigning dollar values. Which method is this, and when is it MOST appropriate?",options:{A:"Qualitative analysis; appropriate when reliable loss data is unavailable or when comparing risks quickly across a broad portfolio",B:"Quantitative analysis; appropriate when the organization lacks historical loss data",C:"Qualitative analysis; appropriate only for regulatory reporting where numbers are prohibited",D:"Quantitative analysis; appropriate when precise financial justification is required for a specific control"},answer:"A",lead:"Qualitative analysis uses relative rankings and subject matter expertise rather than monetary figures. It is fast, requires no historical loss data, and is well suited to comparing many risks. Its weakness is subjectivity and the difficulty of using its output to justify a specific budget.",why:{B:"Is backwards, since quantitative analysis depends on the loss data it says is absent.",C:"Invents a prohibition.",D:"Correctly describes quantitative analysis but does not match the scenario."}},
{id:"s5_14",domain:5,question:"An organization decides to stop offering a product line entirely because the regulatory and security burden of processing that data exceeds any projected profit. Which risk management strategy is this?",options:{A:"Risk mitigation",B:"Risk avoidance",C:"Risk acceptance",D:"Risk transference"},answer:"B",lead:"Avoidance eliminates the risk by ceasing the activity that creates it. It is the only strategy that reduces risk to zero, and it is appropriate when the residual risk after any feasible controls would still exceed the organization's appetite, or when the activity's value does not justify the exposure.",why:{A:"Applies controls to reduce likelihood or impact while continuing the activity.",C:"Consciously bears the risk without further action.",D:"Shifts financial consequence to a third party through insurance or contract."}},
{id:"s5_15",domain:5,question:"A penetration tester gathers information about the target using public DNS records, certificate transparency logs, employee LinkedIn profiles, and archived web pages, without sending any traffic to the target's systems. Which activity is this?",options:{A:"Exploitation",B:"Vulnerability scanning",C:"Passive reconnaissance",D:"Active reconnaissance"},answer:"C",lead:"Passive reconnaissance collects information without interacting with the target's infrastructure, drawing on third-party and public sources. Because nothing touches the target, it generates no logs there and cannot be detected, which is why it typically comes first in an engagement.",why:{A:"Attempts to leverage a discovered weakness.",B:"Is a specific active technique.",D:"Involves direct interaction such as port scanning, banner grabbing, or DNS zone transfer attempts, which the target can log."}},
{id:"s5_16",domain:5,question:"Before a penetration test begins, both parties sign a document defining the in-scope systems, the testing window, prohibited techniques such as denial of service, escalation contacts, and handling of discovered sensitive data. What is this document?",options:{A:"A non-disclosure agreement",B:"The statement of work only",C:"A service level agreement",D:"The rules of engagement"},answer:"D",lead:"Rules of engagement define the operational boundaries of the test. They protect the client from unintended disruption and protect the tester legally by documenting authorization for activity that would otherwise be unlawful. Scope, timing, prohibited techniques, emergency contacts, and evidence handling are its core contents.",why:{A:"Governs confidentiality of information exchanged.",B:"Defines commercial deliverables and schedule, and while related, it does not set the operational boundaries.",C:"Sets service performance commitments."}},
{id:"s5_17",domain:5,question:"An organization commissions an independent third party to examine its controls against a recognized framework and issue a formal opinion that can be shared with customers. Which activity is this, and how does it differ from a self-assessment?",options:{A:"An external audit producing an attestation; unlike a self-assessment it carries independence and is accepted as evidence by third parties",B:"An internal audit; unlike a self-assessment it is performed by the control owners themselves",C:"A penetration test; unlike a self-assessment it attempts exploitation",D:"A vulnerability assessment; unlike a self-assessment it uses automated scanning"},answer:"A",lead:"Independence is what gives an external audit its value. A self-assessment is useful for internal improvement but carries an inherent conflict of interest, since the people evaluating the controls also operate them. An independent examination results in an attestation that customers, regulators, and partners will accept as evidence.",why:{B:"Is performed by the organization's own audit function, which is independent of operations but not of the organization.",C:"C and D are technical testing activities rather than control examinations against a framework.",D:"C and D are technical testing activities rather than control examinations against a framework."}},
{id:"s5_18",domain:5,question:"A security awareness program measures its effectiveness through simulated phishing campaigns. After six months the click rate has dropped from 22 percent to 4 percent, but the reporting rate has stayed flat at 3 percent. What does this MOST likely indicate, and what should change?",options:{A:"The click rate metric is unreliable and should be discontinued",B:"Users avoid clicking but are not reporting; the program should emphasize and simplify reporting so the workforce acts as a detection sensor",C:"The simulations are too difficult and should be made more obvious",D:"The program is fully successful and requires no changes"},answer:"B",lead:"Not clicking protects the individual, but reporting protects the organization — it is what lets the security team pull the message from other inboxes and block the infrastructure. A flat reporting rate alongside a falling click rate means users recognize the threat and simply delete it. The fix is a one-click report button, positive reinforcement for reporting, and explicitly teaching that reporting is the expected action.",why:{A:"Discards a metric that is demonstrating real improvement.",C:"Would weaken the training value.",D:"Ignores a clear gap."}},
{id:"s5_19",domain:5,question:"Which document would define what employees may and may not do with company-owned computing resources, including personal use, prohibited activities, and monitoring expectations?",options:{A:"A business continuity plan",B:"An incident response plan",C:"An acceptable use policy",D:"A software development lifecycle policy"},answer:"C",lead:"The AUP sets the boundaries of permitted use for corporate systems, networks, and data. Its practical importance is twofold: it tells users what is expected, and by establishing that monitoring occurs and personal privacy expectations are limited, it provides the legal foundation for enforcement and investigation.",why:{A:"Governs operations during a disruption.",B:"Governs response to security events.",D:"Governs how software is built and released."}},
{id:"s5_20",domain:5,question:"A security team documents a step-by-step response sequence for a confirmed ransomware event, specifying who is notified, what systems are isolated, how evidence is preserved, and when legal counsel is engaged. What is this artifact called, and where does it fit?",options:{A:"A guideline, offering optional recommendations for handling incidents",B:"A policy, establishing the organization's high-level intent regarding ransomware",C:"A standard, defining mandatory technical specifications for endpoint protection",D:"A playbook, supporting the incident response plan with specific operational steps for one scenario"},answer:"D",lead:"The hierarchy runs policy (what and why), standard (mandatory specifics), procedure or playbook (how, step by step), and guideline (recommended but optional). A playbook operationalizes the incident response plan for one specific scenario so that responders under pressure execute consistently rather than improvising.",why:{A:"A, B, and C each describe a different level of that hierarchy, and none of them provide the ordered operational steps described.",B:"A, B, and C each describe a different level of that hierarchy, and none of them provide the ordered operational steps described.",C:"A, B, and C each describe a different level of that hierarchy, and none of them provide the ordered operational steps described."}},
{id:"s5_21",domain:5,question:"A vendor assessment finds that a critical supplier subcontracts data processing to a fourth party located in a jurisdiction the organization has not evaluated. Which concern does this raise, and what should the organization require?",options:{A:"Supply chain and sovereignty risk; require disclosure of subprocessors, flow-down of security obligations, and approval rights over changes",B:"A performance concern; require an SLA with tighter response times",C:"No concern, since the primary vendor remains contractually accountable",D:"Only a pricing concern; require a discount to offset the additional handling"},answer:"A",lead:"Risk does not stop at the direct vendor. A fourth party handling the data introduces both supply chain exposure and potential data sovereignty conflicts if the jurisdiction has different legal protections or government access powers. The contract should require disclosure of all subprocessors, obligate the vendor to impose equivalent security terms on them, and give the organization the right to review or object to new ones.",why:{B:"B and D address commercial and performance terms rather than the risk.",C:"Is a common but dangerous assumption — contractual accountability does not prevent a breach or restore the data.",D:"B and D address commercial and performance terms rather than the risk."}},
{id:"s5_22",domain:5,question:"An organization operates under a centralized governance structure. Which characteristic BEST describes how security decisions are made?",options:{A:"Decisions are made by consensus vote of all employees",B:"A single authority sets policy and standards enterprise-wide, producing consistency at the cost of local flexibility",C:"Each business unit independently defines its own controls, maximizing consistency",D:"An external regulator makes all security decisions on the organization's behalf"},answer:"B",lead:"Centralized governance concentrates authority in one function that defines policy, standards, and architecture for the whole organization. The benefit is uniformity and simpler auditing; the cost is reduced responsiveness to the specific needs of individual business units or regions, which is why many large organizations adopt a hybrid model.",why:{A:"Is not a recognized governance model.",C:"Describes decentralized governance and then misstates its effect, since independence reduces consistency.",D:"Confuses regulatory oversight with internal governance."}},
{id:"s5_23",domain:5,question:"Which TWO practices MOST directly reduce insider threat risk during employee offboarding? (Select TWO)",options:{A:"Extending the departing employee's access for two weeks to complete knowledge transfer",B:"Conducting an exit interview that includes reaffirmation of NDA obligations and return of assets",C:"Changing the departing employee's password and leaving the account enabled",D:"Disabling all accounts and access at the moment of separation, coordinated with HR",E:"Archiving the employee's data only after 90 days of inactivity"},answer:["B", "D"],lead:"The riskiest window is between the decision to separate and the removal of access. Coordinating deactivation with HR so it happens at the moment of separation closes it, covering not only the primary account but SaaS applications, VPN, physical badges, and any shared or service credentials the person knew. The exit interview reaffirms continuing confidentiality obligations and recovers assets.",why:{A:"Leaves privileged access with someone who no longer has an ongoing stake.",C:"Leaves an enabled account that may be reachable through cached tokens or alternate credentials.",E:"Delays a records action without addressing access."}},
{id:"s5_24",domain:5,question:"A compliance program requires that employees formally confirm they have read and understood the security policy each year. What is this practice, and why does it matter beyond documentation?",options:{A:"Certification; it qualifies the employee to handle regulated data without further training",B:"Attestation; it substitutes for security awareness training",C:"Attestation and acknowledgement; it establishes that the individual was informed, which is necessary for enforcement and for demonstrating due care",D:"Authorization; it grants the employee access to systems covered by the policy"},answer:"C",lead:"Acknowledgement creates a defensible record that the employee was informed of the rules. Without it, disciplinary action or termination for a policy violation can be challenged on the grounds that the person was never told, and regulators reviewing an incident look for evidence that the organization communicated its requirements.",why:{A:"Confuses acknowledgement with qualification.",B:"Is wrong because acknowledging a document is not training.",D:"Confuses it with access provisioning."}},
{id:"s5_25",domain:5,question:"A vendor provides a SOC 2 Type II report covering a 12-month period. What does this give the customer that a Type I report would not?",options:{A:"A quantitative risk score for the vendor's environment",B:"A guarantee that no security incident occurred during the period",C:"Permission to conduct an on-site audit of the vendor",D:"Evidence that controls operated effectively over time, not merely that they were suitably designed at a point in time"},answer:"D",lead:"A Type I report attests that controls were suitably designed as of a specific date. A Type II additionally tests whether those controls actually operated effectively across a review period, which is far stronger evidence — a well-designed control that is not consistently performed provides no protection.",why:{A:"Is not what these reports produce; they contain an auditor's opinion and tested control descriptions.",B:"Overstates it, since exceptions can be noted and incidents can still occur.",C:"Is a separate contractual right that must be negotiated."}},
{id:"s5_26",domain:5,question:"Which statement correctly distinguishes MTTR and MTBF from RTO and RPO?",options:{A:"MTTR and MTBF describe observed reliability and repair performance; RTO and RPO are targets set by the business for recovery",B:"MTTR and MTBF are business targets; RTO and RPO are measured historical averages",C:"All four are synonyms for system availability",D:"MTTR measures acceptable data loss; RPO measures average repair time"},answer:"A",lead:"MTBF and MTTR are backward-looking reliability metrics describing how a system has actually behaved — how long it typically runs before failing and how long repairs typically take. RTO and RPO are forward-looking requirements the business sets: how quickly service must be restored and how much data loss is acceptable. Availability targets are validated against reliability metrics.",why:{B:"Reverses the two.",C:"Ignores meaningful differences.",D:"Swaps the definitions entirely."}},
{id:"s5_27",domain:5,question:"An organization grants a documented, time-limited approval for a specific system to operate outside a mandatory security standard, with compensating controls and an expiry date. Which term BEST describes this?",options:{A:"An exemption from all security policy",B:"An exception",C:"Risk avoidance",D:"A compensating control substitution requiring no approval"},answer:"B",lead:"An exception is a formal, bounded deviation from a standard, granted by an appropriate authority with documented justification, compensating controls, an accountable owner, and a defined expiry that forces reassessment. Its bounded and time-limited nature is what prevents it from silently becoming permanent.",why:{A:"Implies blanket relief from policy, which is far broader than what is described.",C:"Would mean ceasing the activity.",D:"Omits the approval and documentation that make the deviation defensible."}},
{id:"s5_28",domain:5,question:"A risk committee wants early warning that a risk is trending toward its threshold, before an incident occurs. Which instrument provides this?",options:{A:"The asset inventory's depreciation schedule",B:"Post-incident reports summarizing what already happened",C:"Key risk indicators tracked against defined thresholds",D:"An annual penetration test report"},answer:"C",lead:"KRIs are leading metrics selected because they correlate with a risk materializing — for example, the percentage of critical systems past their patch SLA, the rate of failed access reviews, or the volume of privileged accounts without MFA. Tracking them against thresholds gives the committee time to act before the risk becomes an incident.",why:{A:"Is financial data unrelated to risk trending.",B:"Is inherently lagging.",D:"Is a point-in-time assessment rather than a continuously tracked indicator."}},
{id:"s5_29",domain:5,question:"An awareness program must address the risk of an employee finding a USB drive in the parking lot or receiving an unsolicited charging cable at a conference. Which TWO messages are MOST important to convey? (Select TWO)",options:{A:"Format the drive before use to remove any malicious content",B:"Scan the device with antivirus before use to confirm it is safe",C:"Never connect unknown removable media or cables to corporate devices",D:"Only connect unknown devices to a personal laptop rather than a corporate one",E:"Report found devices to security rather than testing them personally"},answer:["C", "E"],lead:"USB drop attacks exploit curiosity and helpfulness, and malicious cables can contain hardware that emulates a keyboard to inject commands the moment they are connected. The only safe behaviors are refusing to connect the device at all and handing it to security, which also lets the team determine whether the organization is being deliberately targeted.",why:{A:"Likewise requires connecting it first, and does not affect firmware-based attacks.",B:"Is dangerous because a device emulating a keyboard executes on connection, before any scan runs.",D:"Simply relocates the compromise to a device that still reaches corporate resources."}},
{id:"s5_30",domain:5,question:"A red team simulates an adversary while the blue team defends, and both work together afterward to improve detections in a combined exercise. What is this arrangement called?",options:{A:"A white box penetration test with full documentation access",B:"A compliance audit against a control framework",C:"A tabletop exercise focused on communication",D:"A purple team exercise, integrating offensive and defensive perspectives"},answer:"D",lead:"Purple teaming integrates the offensive and defensive functions so that each attacker technique is immediately evaluated against whether the defenders detected it, and detection gaps are closed during the engagement rather than months later in a report. The white team typically oversees and adjudicates the exercise.",why:{A:"Describes the information provided to a tester, not team structure.",B:"Evaluates control existence against a framework rather than testing detection.",C:"Is a discussion-based exercise with no live attack."}},
{id:"s5_31",domain:5,question:"An organization's data retention schedule requires that customer transaction records be kept for seven years and then destroyed. Why is the destruction requirement as important as the retention requirement?",options:{A:"Data held beyond its required period remains discoverable in litigation and expands breach exposure with no offsetting business value",B:"Destroyed data cannot be subject to a legal hold",C:"Regulators require that all data be destroyed after seven years regardless of type",D:"Storage costs are the primary driver of retention schedules"},answer:"A",lead:"Retention schedules define both a floor and a ceiling. Data kept past its required period is still subject to discovery, still must be protected, and still appears in a breach — while providing no business benefit. Disciplined destruction is therefore a genuine risk reduction measure, not merely housekeeping.",why:{B:"Is dangerously wrong — a legal hold overrides the schedule, and destroying held data is spoliation.",C:"Overgeneralizes, since periods vary widely by data type and jurisdiction.",D:"Is a secondary consideration."}},
{id:"s5_32",domain:5,question:"A multinational company must comply with different privacy laws in each region where it operates. Which approach BEST manages this without maintaining entirely separate programs?",options:{A:"Delegate compliance entirely to each regional business unit with no central oversight",B:"Build the program to the strictest applicable requirement as a baseline and layer region-specific controls where local law demands more",C:"Apply the least restrictive requirement globally to minimize operational friction",D:"Comply only with the laws of the country where headquarters is located"},answer:"B",lead:"A high-water-mark baseline satisfies most jurisdictions at once and avoids maintaining parallel programs, with targeted additions where a specific jurisdiction imposes unique obligations such as data localization or particular breach notification timelines. It is both simpler to operate and easier to audit.",why:{A:"Produces inconsistency and no assurance that any requirement is actually met.",C:"Leaves the organization non-compliant in stricter jurisdictions.",D:"Ignores that privacy law generally follows the data subject's location, not the company's."}},
{id:"s5_33",domain:5,question:"A physical penetration test is commissioned. Which activity falls within its scope, and what authorization is essential before it begins?",options:{A:"Testing web application input validation; a staging environment is essential",B:"Scanning the perimeter firewall for open ports; a network diagram is essential",C:"Attempting entry through tailgating, badge cloning, or lock bypass; a signed authorization letter carried by testers is essential",D:"Reviewing access control policies for completeness; an audit checklist is essential"},answer:"C",lead:"Physical penetration testing evaluates whether an attacker can gain unauthorized physical access — through tailgating, badge cloning, lock bypass, or social engineering at reception. Testers must carry a signed authorization letter, sometimes called a get-out-of-jail letter, naming the authorizing executive and a verification contact, because the activity is otherwise indistinguishable from criminal trespass.",why:{A:"A and B describe technical testing.",B:"A and B describe technical testing.",D:"Describes a document review rather than a test."}},
{id:"s5_34",domain:5,question:"An organization reviews and updates its security policies annually and after any significant incident, regulatory change, or business transformation. Which governance activity is this, and why does the trigger-based element matter?",options:{A:"Attestation; it records that employees have read the current version",B:"Risk transference; it shifts policy accountability to the compliance function",C:"Compliance reporting; it demonstrates policy existence to regulators",D:"Monitoring and revision; scheduled reviews alone let policies fall out of step with material changes between cycles"},answer:"D",lead:"Policies decay as the environment changes. A purely annual cadence means a policy can be materially wrong for up to eleven months after a merger, a new regulation, or an incident that revealed a gap. Combining scheduled review with event-driven triggers keeps documented policy aligned with actual practice and obligations.",why:{A:"A, B, and C each name a different governance or risk activity, none of which involve keeping the policy content current.",B:"A, B, and C each name a different governance or risk activity, none of which involve keeping the policy content current.",C:"A, B, and C each name a different governance or risk activity, none of which involve keeping the policy content current."}},
{id:"s5_35",domain:5,question:"An organization shifting to permanent hybrid work must update its awareness training. Which TWO topics become MORE important as a direct result? (Select TWO)",options:{A:"Physical cable management standards in wiring closets",B:"Procedures for signing visitors into the corporate lobby",C:"Proper use of the data center badge access system",D:"Preventing shoulder surfing and unauthorized viewing in shared or public spaces",E:"Securing home networks and avoiding untrusted public Wi-Fi for corporate work"},answer:["D", "E"],lead:"Hybrid work moves the endpoint outside the controlled office environment. Home routers with default credentials and unpatched firmware, plus public networks where an attacker may be on the same segment, become part of the corporate attack surface. Working in cafes, airports, and shared homes also makes visual exposure of screens and conversations a genuine confidentiality risk.",why:{A:"A, B, and C all concern on-premises facilities and become LESS relevant to a workforce that is largely remote.",B:"A, B, and C all concern on-premises facilities and become LESS relevant to a workforce that is largely remote.",C:"A, B, and C all concern on-premises facilities and become LESS relevant to a workforce that is largely remote."}}
];

const SEC_FLASHCARDS = [
// Domain 1 — General Security Concepts
{id:"s1_f01",domain:1,term:"CIA Triad",definition:"The three core goals of information security: Confidentiality (only authorized parties can read data), Integrity (data is accurate and unaltered), and Availability (data and systems are accessible when needed).",example:"Encrypting a database protects confidentiality, hashing files detects integrity loss, and clustering the database servers preserves availability during a node failure."},
{id:"s1_f02",domain:1,term:"Non-repudiation",definition:"Assurance that a party cannot credibly deny having performed an action. Achieved through digital signatures, logging, and audit trails.",example:"A contract signed with the sender's private key cannot later be disowned, because only that key holder could have produced the signature."},
{id:"s1_f03",domain:1,term:"AAA (Authentication, Authorization, Accounting)",definition:"Authentication proves identity, authorization determines what that identity may do, and accounting records what was actually done.",example:"You log in with MFA (authentication), your role grants read access to the finance share (authorization), and the SIEM logs every file you open (accounting)."},
{id:"s1_f04",domain:1,term:"Control Categories",definition:"Technical (implemented in technology), Managerial (policies and risk decisions), Operational (executed by people day to day), and Physical (tangible barriers).",example:"A firewall rule is technical, the change management policy is managerial, the guard's nightly walkthrough is operational, and the door lock is physical."},
{id:"s1_f05",domain:1,term:"Control Types",definition:"Preventive (stops it), Deterrent (discourages it), Detective (identifies it), Corrective (fixes it after), Compensating (substitutes when the primary control is impossible), and Directive (instructs).",example:"A locked door is preventive, a warning sign deterrent, a camera detective, a restore from backup corrective, VLAN isolation of an unpatchable device compensating, and the AUP directive."},
{id:"s1_f06",domain:1,term:"Zero Trust",definition:"A security model that grants no implicit trust based on network location. Every request is authenticated, authorized, and continuously evaluated against policy.",example:"An employee already on the corporate LAN still must satisfy device posture, identity, and context checks before the Policy Enforcement Point allows access to a finance app."},
{id:"s1_f07",domain:1,term:"Symmetric vs Asymmetric Encryption",definition:"Symmetric uses one shared key for both encryption and decryption — fast, but key distribution is hard. Asymmetric uses a public/private key pair — slower, but solves key exchange and enables signatures.",example:"TLS uses asymmetric cryptography to exchange a session key, then switches to symmetric AES for the bulk of the data because it is far faster."},
{id:"s1_f08",domain:1,term:"Hashing",definition:"A one-way function producing a fixed-length digest from input of any size. Used for integrity verification and password storage — it cannot be reversed.",example:"Comparing the SHA-256 hash of a downloaded ISO against the vendor's published hash confirms the file was not altered or corrupted in transit."},
{id:"s1_f09",domain:1,term:"Salting",definition:"Adding a unique random value to each password before hashing, so identical passwords produce different digests and precomputed rainbow tables become useless.",example:"Two users both choose 'Summer2026', but unique salts mean their stored hashes are completely different, forcing an attacker to crack each one individually."},
{id:"s1_f10",domain:1,term:"PKI (Public Key Infrastructure)",definition:"The framework of certificate authorities, registration authorities, certificates, and revocation mechanisms that binds public keys to verified identities.",example:"A browser trusts a bank's site because the certificate chains up through an intermediate CA to a root CA already in the browser's trust store."},
{id:"s1_f11",domain:1,term:"TPM vs HSM",definition:"A TPM is a chip on a device's motherboard storing keys and boot measurements for that one machine. An HSM is a dedicated appliance performing high-volume key operations for an enterprise.",example:"BitLocker seals its key to the laptop's TPM; a payment processor uses a network HSM to sign thousands of transactions per second."},
{id:"s1_f12",domain:1,term:"Tokenization vs Masking",definition:"Tokenization replaces sensitive data with an unrelated surrogate stored in a vault, and is reversible via lookup. Masking permanently obscures part of a value for display and is not reversible.",example:"A card number becomes token 8f3a-99b2 in the database (tokenization), while a support agent's screen shows ************4471 (masking)."},

// Domain 2 — Threats, Vulnerabilities, and Mitigations
